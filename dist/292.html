<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extrator de Texto Pro</title>
  <style>
    :root {
      --primary-color: #4a90e2;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #333;
      --border-color: #ddd;
    }

    body.dark-mode {
      --primary-color: #64b5f6;
      --bg-color: #1e1e1e;
      --card-bg: #2d2d2d;
      --text-color: #e0e0e0;
      --border-color: #444;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      transition: background-color 0.3s, color 0.3s;
      display: flex;
      justify-content: center;
    }

    .container {
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 900px;
      width: 100%;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: var(--primary-color);
    }

    /* Área de Upload Customizada */
    .upload-area {
      border: 2px dashed var(--border-color);
      border-radius: 10px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 20px;
      background-color: rgba(0,0,0,0.02);
    }

    .upload-area:hover, .upload-area.dragover {
      border-color: var(--primary-color);
      background-color: rgba(74, 144, 226, 0.1);
    }

    .upload-icon {
      font-size: 40px;
      margin-bottom: 10px;
      display: block;
    }

    #fileInput {
      display: none;
    }

    /* Botões */
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }

    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button.secondary {
      background-color: #6c757d;
    }

    /* Área de Texto */
    textarea {
      width: 100%;
      padding: 15px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: monospace;
      resize: vertical;
      box-sizing: border-box;
      min-height: 300px;
    }

    /* Barra de Progresso */
    .progress-container {
      width: 100%;
      background-color: var(--border-color);
      border-radius: 5px;
      margin-bottom: 20px;
      display: none;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 10px;
      background-color: var(--primary-color);
      transition: width 0.4s ease;
    }

    /* Toggle Dark Mode */
    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 5px 10px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <button class="theme-toggle" onclick="toggleTheme()">🌙 Tema</button>

  <div class="container">
    <h2>📄 Extrator de Documentos Inteligente</h2>
    
    <!-- Área de Drag & Drop -->
    <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <span class="upload-icon">📂</span>
      <p id="fileNameDisplay">Arraste seu arquivo aqui ou clique para selecionar<br>
      <small>(PDF, TXT, Imagem, DOCX)</small></p>
      <input type="file" id="fileInput" accept=".pdf,.txt,.png,.jpg,.jpeg,.docx">
    </div>

    <!-- Barra de Progresso -->
    <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar"></div>
      <p style="text-align: center; font-size: 12px; margin-top: 5px;">Processando... (Isso pode levar alguns segundos)</p>
    </div>

    <div class="btn-group">
      <button onclick="extractText()" style="background-color: #28a745; font-weight: bold;">🚀 Extrair Texto</button>
      <button onclick="copyText()" class="secondary">📋 Copiar</button>
      <button onclick="downloadText()">💾 Baixar TXT</button>
      <button onclick="downloadPDF()">📄 Baixar PDF</button>
      <button onclick="downloadDOCX()">📝 Baixar DOCX</button>
      <button onclick="downloadMarkdown()">⬇️ Baixar MD</button>
    </div>
    
    <h3>Texto extraído:</h3>
    <textarea id="output" placeholder="O texto extraído aparecerá aqui..."></textarea>
  </div>
  
  <!-- Bibliotecas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.36.0/docxtemplater.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsPDF/2.5.1/jspdf.umd.min.js"></script>
  
  <script>
    let extractedText = "";

    // --- Configuração da Interface (Drag & Drop) ---
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileNameDisplay = document.getElementById('fileNameDisplay');

    // Efeitos visuais ao arrastar
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
    });

    // Ao soltar o arquivo
    dropZone.addEventListener('drop', handleDrop, false);

    function handleDrop(e) {
      const dt = e.dataTransfer;
      const files = dt.files;
      fileInput.files = files;
      updateFileName();
    }

    // Ao selecionar pelo clique
    fileInput.addEventListener('change', updateFileName);

    function updateFileName() {
      if (fileInput.files.length > 0) {
        fileNameDisplay.innerHTML = `<strong>Arquivo selecionado:</strong> ${fileInput.files[0].name}`;
      }
    }

    // --- Lógica Original Mantida e Organizada ---

    function cleanFooter(text) {
      const patterns = [
        /Num\.\s*\d+\s*-\s*Pág\.\s*\d+[\s\S]*?Número do documento:\s*\d+[^\n]*\n?/gi,
        /Assinado digitalmente por:[\s\S]*?Número do documento:[^\n]*\n?/gi,
        /Documento eletrônico assinado[\s\S]*?Número do documento:[^\n]*\n?/gi
      ];
      let cleaned = text;
      patterns.forEach(p => {
        cleaned = cleaned.replace(p, "");
      });
      return cleaned;
    }

    window.onload = function() {
      const saved = localStorage.getItem("autosaveText");
      if (saved) {
        extractedText = saved;
        document.getElementById("output").value = saved;
      }
    };

    // Função auxiliar para mostrar progresso
    function toggleLoading(show) {
      const progressContainer = document.getElementById('progressContainer');
      const progressBar = document.getElementById('progressBar');
      
      if (show) {
        progressContainer.style.display = 'block';
        progressBar.style.width = '30%';
        // Simulação de progresso
        setTimeout(() => progressBar.style.width = '70%', 1000);
      } else {
        progressBar.style.width = '100%';
        setTimeout(() => {
          progressContainer.style.display = 'none';
          progressBar.style.width = '0%';
        }, 500);
      }
    }

    async function extractText() {
      const file = fileInput.files[0];
      if (!file) {
        alert("Selecione um arquivo primeiro!");
        return;
      }

      toggleLoading(true); // Inicia loading
      document.getElementById("output").value = "Extraindo texto, por favor aguarde...";

      try {
        if (file.type === "text/plain") {
          const text = await file.text();
          extractedText = cleanFooter(text) + `\n\n--- Fim do arquivo TXT ---\n\n`;
          finalizeExtraction();

        } else if (file.type === "application/pdf") {
          const reader = new FileReader();
          reader.onload = async function() {
            const typedArray = new Uint8Array(this.result);
            const pdf = await pdfjsLib.getDocument(typedArray).promise;
            let textContent = "";

            for (let i = 1; i <= pdf.numPages; i++) {
              const page = await pdf.getPage(i);
              const text = await page.getTextContent();

              if (text.items.length > 0) {
                text.items.forEach(item => textContent += item.str + " ");
              } else {
                // Fallback OCR para PDF escaneado
                const viewport = page.getViewport({ scale: 2 });
                const canvas = document.createElement("canvas");
                const context = canvas.getContext("2d");
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                await page.render({ canvasContext: context, viewport: viewport }).promise;
                const { data: { text: ocrText } } = await Tesseract.recognize(canvas, 'por');
                textContent += ocrText + " ";
              }
              textContent += `\n\n--- Página ${i} ---\n\n`;
            }
            extractedText = cleanFooter(textContent);
            finalizeExtraction();
          };
          reader.readAsArrayBuffer(file);

        } else if (file.type.startsWith("image/")) {
          const reader = new FileReader();
          reader.onload = async function() {
            const { data: { text } } = await Tesseract.recognize(reader.result, 'por');
            extractedText = cleanFooter(text) + `\n\n--- Fim da imagem ---\n\n`;
            finalizeExtraction();
          };
          reader.readAsDataURL(file);

        } else if (file.name.endsWith(".docx")) {
          const reader = new FileReader();
          reader.onload = async function() {
            const zip = new JSZip(reader.result);
            const doc = new window.Docxtemplater().loadZip(zip);
            const text = doc.getFullText();
            extractedText = cleanFooter(text) + `\n\n--- Fim do arquivo DOCX ---\n\n`;
            finalizeExtraction();
          };
          reader.readAsBinaryString(file);

        } else {
          alert("Formato não suportado. Use PDF, TXT, DOCX ou imagem.");
          toggleLoading(false);
        }
      } catch (error) {
        console.error(error);
        alert("Erro ao processar arquivo. Verifique se o arquivo não está corrompido.");
        toggleLoading(false);
      }
    }

    function finalizeExtraction() {
      document.getElementById("output").value = extractedText;
      localStorage.setItem("autosaveText", extractedText);
      toggleLoading(false); // Para loading
    }

    // --- Funções de Download e Utilitários ---

    function downloadText() {
      if (!extractedText) return alert("Nenhum texto extraído ainda!");
      const blob = new Blob([extractedText], { type: "text/plain" });
      saveFile(blob, "texto_extraido.txt");
    }

    function downloadPDF() {
      if (!extractedText) return alert("Nenhum texto extraído ainda!");
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFontSize(12);
      const lines = doc.splitTextToSize(extractedText, 180);
      doc.text(lines, 10, 10);
      doc.save("texto_extraido.pdf");
    }

    function downloadDOCX() {
      if (!extractedText) return alert("Nenhum texto extraído ainda!");
      const blob = new Blob(
        [`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
        <w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
          <w:body>
            <w:p><w:r><w:t>${extractedText.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}</w:t></w:r></w:p>
          </w:body>
        </w:document>`],
        { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" }
      );
      saveFile(blob, "texto_extraido.docx");
    }

    function downloadMarkdown() {
      if (!extractedText) return alert("Nenhum texto extraído ainda!");
      const mdText = extractedText.replace(/--- Página (\d+) ---/g, "### Página $1");
      const blob = new Blob([mdText], { type: "text/markdown" });
      saveFile(blob, "texto_extraido.md");
    }

    function saveFile(blob, filename) {
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
    }

    function copyText() {
      if (!extractedText) return alert("Nenhum texto extraído ainda!");
      navigator.clipboard.writeText(extractedText).then(() => {
        // Feedback visual no botão
        const btn = document.querySelector('button[onclick="copyText()"]');
        const originalText = btn.innerText;
        btn.innerText = "Copiado! ✅";
        setTimeout(() => btn.innerText = originalText, 2000);
      });
    }

    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
    }
  </script>
</body>
</html>
