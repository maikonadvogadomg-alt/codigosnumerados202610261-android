                <input type=&amp;quot;file&amp;quot; id=&amp;quot;file2&amp;quot; accept=&amp;quot;.zip,.html,.js,.json,.txt&amp;quot; onchange=&amp;quot;carregarProjeto(2, event)&amp;quot;>
                <div id=&amp;quot;info2&amp;quot; class=&amp;quot;projeto-info&amp;quot; style=&amp;quot;display: none;&amp;quot;></div>
            </div>
        </div>

        <!-- AÇÕES -->
        <div class=&amp;quot;card&amp;quot;>
            <h2>⚡ Ações</h2>
            <button class=&amp;quot;btn btn-verde&amp;quot; onclick=&amp;quot;compararProjetos()&amp;quot; id=&amp;quot;btnComparar&amp;quot; disabled>
                🔍 Comparar Projetos
            </button>
            <button class=&amp;quot;btn btn-roxo&amp;quot; onclick=&amp;quot;gerarRelatorio()&amp;quot; id=&amp;quot;btnRelatorio&amp;quot; disabled>
                📄 Gerar Relatório Completo
            </button>
            <button class=&amp;quot;btn btn-vermelho&amp;quot; onclick=&amp;quot;limparTudo()&amp;quot;>
                🗑️ Limpar Tudo
            </button>
        </div>

        <!-- RESULTADO -->
        <div class=&amp;quot;resultado&amp;quot; id=&amp;quot;resultado&amp;quot; style=&amp;quot;display: none;&amp;quot;>
            <h2>📊 Resultado da Comparação</h2>
            
            <div class=&amp;quot;stats&amp;quot; id=&amp;quot;stats&amp;quot;></div>

            <div class=&amp;quot;tabs&amp;quot;>
                <div class=&amp;quot;tab ativo&amp;quot; onclick=&amp;quot;mudarTab('resumo')&amp;quot;>📋 Resumo</div>
                <div class=&amp;quot;tab&amp;quot; onclick=&amp;quot;mudarTab('arquivos')&amp;quot;>📁 Arquivos</div>
                <div class=&amp;quot;tab&amp;quot; onclick=&amp;quot;mudarTab('codigo')&amp;quot;>💻 Código</div>
                <div class=&amp;quot;tab&amp;quot; onclick=&amp;quot;mudarTab('dependencias')&amp;quot;>📦 Dependências</div>
                <div class=&amp;quot;tab&amp;quot; onclick=&amp;quot;mudarTab('sugestoes')&amp;quot;>💡 Sugestões</div>
            </div>

            <div class=&amp;quot;tab-content ativo&amp;quot; id=&amp;quot;tab-resumo&amp;quot;></div>
            <div class=&amp;quot;tab-content&amp;quot; id=&amp;quot;tab-arquivos&amp;quot;></div>
            <div class=&amp;quot;tab-content&amp;quot; id=&amp;quot;tab-codigo&amp;quot;></div>
            <div class=&amp;quot;tab-content&amp;quot; id=&amp;quot;tab-dependencias&amp;quot;></div>
            <div class=&amp;quot;tab-content&amp;quot; id=&amp;quot;tab-sugestoes&amp;quot;></div>
        </div>
    </div>

    <script>
        // =====================
        // ESTADO GLOBAL
        // =====================
        let projetos = {
            1: null,
            2: null
        };

        let comparacao = null;

        // =====================
        // DRAG &amp;amp; DROP
        // =====================
        ['upload1', 'upload2'].forEach((id, idx) => {
            const el = document.getElementById(id);
            
            el.addEventListener('dragover', (e) => {
                e.preventDefault();
                el.classList.add('dragover');
            });

            el.addEventListener('dragleave', () => {
                el.classList.remove('dragover');
            });

            el.addEventListener('drop', (e) => {
                e.preventDefault();
                el.classList.remove('dragover');
                const file = e.dataTransfer.files[0];
                if (file) {
                    document.getElementById(`file${idx + 1}`).files = e.dataTransfer.files;
                    carregarProjeto(idx + 1, { target: { files: [file] } });
                }
            });
        });

        // =====================
        // CARREGAR PROJETO
        // =====================
        async function carregarProjeto(num, event) {
            const file = event.target.files[0];
            if (!file) return;

            const ext = file.name.split('.').pop().toLowerCase();
            let projeto = {
                nome: file.name,
                tamanho: file.size,
                arquivos: {},
                tipo: ext
            };

            if (ext === 'zip') {
                projeto = await carregarZIP(file, projeto);
            } else {
                const conteudo = await file.text();
                projeto.arquivos[file.name] = {
                    nome: file.name,
                    conteudo: conteudo,
                    tamanho: file.size,
                    tipo: ext
                };
            }

            projetos[num] = projeto;
            mostrarInfo(num, projeto);
            verificarBotaoComparar();
        }

        async function carregarZIP(file, projeto) {
            const zip = await JSZip.loadAsync(file);
            const arquivos = {};

            for (const [caminho, entrada] of Object.entries(zip.files)) {
                if (!entrada.dir) {
                    const ext = caminho.split('.').pop().toLowerCase();
                    const legivel = ['js','ts','tsx','jsx','html','htm','css','json','txt','md','xml'].includes(ext);
                    
                    if (legivel) {
                        try {
                            const conteudo = await entrada.async('text');
                            arquivos[caminho] = {
                                nome: caminho,
                                conteudo: conteudo,
                                tamanho: conteudo.length,
                                tipo: ext
                            };
                        } catch(e) {}
                    }
                }
            }

            projeto.arquivos = arquivos;
            return projeto;
        }

        function mostrarInfo(num, projeto) {
            const el = document.getElementById(`info${num}`);
            const totalArquivos = Object.keys(projeto.arquivos).length;
            const tamanhoTotal = Object.values(projeto.arquivos).reduce((sum, arq) => sum + arq.tamanho, 0);

            el.style.display = 'block';
            el.innerHTML = `
                <div><span class=&amp;quot;label&amp;quot;>Nome:</span> <span class=&amp;quot;valor&amp;quot;>${projeto.nome}</span></div>
                <div><span class=&amp;quot;label&amp;quot;>Arquivos:</span> <span class=&amp;quot;valor&amp;quot;>${totalArquivos}</span></div>
                <div><span class=&amp;quot;label&amp;quot;>Tamanho:</span> <span class=&amp;quot;valor&amp;quot;>${(tamanhoTotal / 1024).toFixed(1)} KB</span></div>
                <div><span class=&amp;quot;label&amp;quot;>Status:</span> <span class=&amp;quot;valor&amp;quot;>✅ Carregado</span></div>
            `;
        }

        function verificarBotaoComparar() {
            const btn = document.getElementById('btnComparar');
            btn.disabled = !(projetos[1] &amp;amp;&amp;amp; projetos[2]);
        }

        // =====================
        // COMPARAR PROJETOS
        // =====================
        function compararProjetos() {
            if (!projetos[1] || !projetos[2]) {
                alert('Carregue os 2 projetos primeiro!');
                return;
            }

            document.getElementById('resultado').style.display = 'block';
            document.getElementById('tab-resumo').innerHTML = '<div class=&amp;quot;loading&amp;quot;><div class=&amp;quot;spinner&amp;quot;></div><div style=&amp;quot;margin-top:16px;&amp;quot;>Comparando projetos...</div></div>';

            setTimeout(() => {
                comparacao = realizarComparacao();
                mostrarResultado();
                document.getElementById('btnRelatorio').disabled = false;
            }, 500);
        }

        function realizarComparacao() {
            const arq1 = projetos[1].arquivos;
            const arq2 = projetos[2].arquivos;

            const nomes1 = new Set(Object.keys(arq1));
            const nomes2 = new Set(Object.keys(arq2));

            const novos = [];
            const deletados = [];
            const modificados = [];
            const iguais = [];

            // Arquivos novos (só no projeto 2)
            for (const nome of nomes2) {
                if (!nomes1.has(nome)) {
                    novos.push({
                        nome,
                        arquivo: arq2[nome]
                    });
                }
            }

            // Arquivos deletados (só no projeto 1)
            for (const nome of nomes1) {
                if (!nomes2.has(nome)) {
                    deletados.push({
                        nome,
                        arquivo: arq1[nome]
                    });
                }
            }

            // Arquivos em ambos (comparar conteúdo)
            for (const nome of nomes1) {
                if (nomes2.has(nome)) {
                    const diff = compararArquivos(arq1[nome], arq2[nome]);
                    if (diff.modificado) {
                        modificados.push({
                            nome,
                            arquivo1: arq1[nome],
                            arquivo2: arq2[nome],
                            diff
                        });
                    } else {
                        iguais.push({
                            nome,
                            arquivo: arq1[nome]
                        });
                    }
                }
            }

            return {
                novos,
                deletados,
                modificados,
                iguais,
                total: nomes1.size + nomes2.size - iguais.length
            };
        }

        function compararArquivos(arq1, arq2) {
            const linhas1 = arq1.conteudo.split('\n');
            const linhas2 = arq2.conteudo.split('\n');

            if (arq1.conteudo === arq2.conteudo) {
                return { modificado: false };
            }

            const diff = [];
            const maxLen = Math.max(linhas1.length, linhas2.length);

            for (let i = 0; i < maxLen; i++) {
                const l1 = linhas1[i];
                const l2 = linhas2[i];

                if (l1 === undefined) {
                    diff.push({ tipo: 'add', linha: i + 1, conteudo: l2 });
                } else if (l2 === undefined) {
                    diff.push({ tipo: 'remove', linha: i + 1, conteudo: l1 });
                } else if (l1 !== l2) {
                    diff.push({ tipo: 'modify', linha: i + 1, antes: l1, depois: l2 });
                } else {
                    diff.push({ tipo: 'igual', linha: i + 1, conteudo: l1 });
                }
            }

            return {
                modificado: true,
                diff,
                linhasAdicionadas: diff.filter(d => d.tipo === 'add').length,
                linhasRemovidas: diff.filter(d => d.tipo === 'remove').length,
                linhasModificadas: diff.filter(d => d.tipo === 'modify').length
            };
        }

        // =====================
        // MOSTRAR RESULTADO
        // =====================
        function mostrarResultado() {
            // STATS
            document.getElementById('stats').innerHTML = `
                <div class=&amp;quot;stat-card&amp;quot;>
                    <div class=&amp;quot;stat-numero&amp;quot; style=&amp;quot;color: #4ade80;&amp;quot;>${comparacao.novos.length}</div>
                    <div class=&amp;quot;stat-label&amp;quot;>Novos</div>
                </div>
                <div class=&amp;quot;stat-card&amp;quot;>
                    <div class=&amp;quot;stat-numero&amp;quot; style=&amp;quot;color: #fbbf24;&amp;quot;>${comparacao.modificados.length}</div>
                    <div class=&amp;quot;stat-label&amp;quot;>Modificados</div>
                </div>
                <div class=&amp;quot;stat-card&amp;quot;>
                    <div class=&amp;quot;stat-numero&amp;quot; style=&amp;quot;color: #f87171;&amp;quot;>${comparacao.deletados.length}</div>
                    <div class=&amp;quot;stat-label&amp;quot;>Deletados</div>
                </div>
                <div class=&amp;quot;stat-card&amp;quot;>
                    <div class=&amp;quot;stat-numero&amp;quot; style=&amp;quot;color: #64748b;&amp;quot;>${comparacao.iguais.length}</div>
                    <div class=&amp;quot;stat-label&amp;quot;>Iguais</div>
                </div>
            `;

            // RESUMO
            mostrarResumo();

            // ARQUIVOS
            mostrarArquivos();

            // SUGESTÕES
            gerarSugestoes();
        }

        function mostrarResumo() {
            let html = '<div class=&amp;quot;diff-container&amp;quot;>';
            
            html += `<div style=&amp;quot;color: #38bdf8; font-weight: bold; font-size: 16px; margin-bottom: 16px;&amp;quot;>📊 RESUMO DA COMPARAÇÃO</div>`;
            
            html += `<div style=&amp;quot;margin-bottom: 20px;&amp;quot;>`;
            html += `<div style=&amp;quot;color: #94a3b8; margin-bottom: 8px;&amp;quot;>PROJETO 1: ${projetos[1].nome}</div>`;
            html += `<div style=&amp;quot;color: #94a3b8;&amp;quot;>PROJETO 2: ${projetos[2].nome}</div>`;
            html += `</div>`;

            if (comparacao.novos.length > 0) {
                html += `<div style=&amp;quot;color: #4ade80; font-weight: bold; margin-top: 16px;&amp;quot;>✅ ARQUIVOS NOVOS (${comparacao.novos.length}):</div>`;
                comparacao.novos.slice(0, 10).forEach(item => {
                    html += `<div class=&amp;quot;diff-linha diff-add&amp;quot;>+ ${item.nome}</div>`;
                });
                if (comparacao.novos.length > 10) {
                    html += `<div style=&amp;quot;color: #64748b; margin: 8px 0;&amp;quot;>... e mais ${comparacao.novos.length - 10} arquivos</div>`;
                }
            }

            if (comparacao.modificados.length > 0) {
                html += `<div style=&amp;quot;color: #fbbf24; font-weight: bold; margin-top: 16px;&amp;quot;>⚠️ ARQUIVOS MODIFICADOS (${comparacao.modificados.length}):</div>`;
                comparacao.modificados.slice(0, 10).forEach(item => {
                    html += `<div class=&amp;quot;diff-linha diff-modify&amp;quot;>~ ${item.nome}</div>`;
                });
                if (comparacao.modificados.length > 10) {
                    html += `<div style=&amp;quot;color: #64748b; margin: 8px 0;&amp;quot;>... e mais ${comparacao.modificados.length - 10} arquivos</div>`;
                }
            }

            if (comparacao.deletados.length > 0) {
                html += `<div style=&amp;quot;color: #f87171; font-weight: bold; margin-top: 16px;&amp;quot;>❌ ARQUIVOS DELETADOS (${comparacao.deletados.length}):</div>`;
                comparacao.deletados.slice(0, 10).forEach(item => {
                    html += `<div class=&amp;quot;diff-linha diff-remove&amp;quot;>- ${item.nome}</div>`;
                });
                if (comparacao.deletados.length > 10) {
                    html += `<div style=&amp;quot;color: #64748b; margin: 8px 0;&amp;quot;>... e mais ${comparacao.deletados.length - 10} arquivos</div>`;
                }
            }

            html += '</div>';
            document.getElementById('tab-resumo').innerHTML = html;
        }

        function mostrarArquivos() {
            let html = '';

            // Novos
            if (comparacao.novos.length > 0) {
                html += `<div style=&amp;quot;color: #4ade80; font-weight: bold; margin-bottom: 12px;&amp;quot;>✅ ARQUIVOS NOVOS:</div>`;
                comparacao.novos.forEach((item, idx) => {
                    html += `
                        <div class=&amp;quot;arquivo-item&amp;quot; onclick=&amp;quot;verArquivo('novo', ${idx})&amp;quot;>
                            <div class=&amp;quot;arquivo-icon&amp;quot;>📄</div>
                            <div class=&amp;quot;arquivo-info&amp;quot;>
                                <div class=&amp;quot;arquivo-nome&amp;quot;>${item.nome}</div>
                                <div class=&amp;quot;arquivo-status status-novo&amp;quot;>Novo · ${(item.arquivo.tamanho / 1024).toFixed(1)} KB</div>
                            </div>
                        </div>
                    `;
                });
            }

            // Modificados
            if (comparacao.modificados.length > 0) {
                html += `<div style=&amp;quot;color: #fbbf24; font-weight: bold; margin: 20px 0 12px;&amp;quot;>⚠️ ARQUIVOS MODIFICADOS:</div>`;
                comparacao.modificados.forEach((item, idx) => {
                    html += `
                        <div class=&amp;quot;arquivo-item&amp;quot; onclick=&amp;quot;verArquivo('modificado', ${idx})&amp;quot;>
                            <div class=&amp;quot;arquivo-icon&amp;quot;>📝</div>
                            <div class=&amp;quot;arquivo-info&amp;quot;>
                                <div class=&amp;quot;arquivo-nome&amp;quot;>${item.nome}</div>
                                <div class=&amp;quot;arquivo-status status-modificado&amp;quot;>
                                    +${item.diff.linhasAdicionadas} -${item.diff.linhasRemovidas} ~${item.diff.linhasModificadas} linhas
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            // Deletados
            if (comparacao.deletados.length > 0) {
                html += `<div style=&amp;quot;color: #f87171; font-weight: bold; margin: 20px 0 12px;&amp;quot;>❌ ARQUIVOS DELETADOS:</div>`;
                comparacao.deletados.forEach((item, idx) => {
                    html += `
                        <div class=&amp;quot;arquivo-item&amp;quot; onclick=&amp;quot;verArquivo('deletado', ${idx})&amp;quot;>
                            <div class=&amp;quot;arquivo-icon&amp;quot;>🗑️</div>
                            <div class=&amp;quot;arquivo-info&amp;quot;>
                                <div class=&amp;quot;arquivo-nome&amp;quot;>${item.nome}</div>
                                <div class=&amp;quot;arquivo-status status-deletado&amp;quot;>Deletado</div>
                            </div>
                        </div>
                    `;
                });
            }

            document.getElementById('tab-arquivos').innerHTML = html;
        }

        function verArquivo(tipo, idx) {
            let item, diff;

            if (tipo === 'novo') {
                item = comparacao.novos[idx];
                diff = `<div style=&amp;quot;color: #4ade80; font-weight: bold; margin-bottom: 12px;&amp;quot;>✅ ARQUIVO NOVO: ${item.nome}</div>`;
                diff += '<div class=&amp;quot;diff-container&amp;quot;>';
                item.arquivo.conteudo.split('\n').slice(0, 100).forEach((linha, i) => {
                    diff += `<div class=&amp;quot;diff-linha diff-add&amp;quot;>${i + 1} | ${linha}</div>`;
                });
                diff += '</div>';
            } else if (tipo === 'modificado') {
                item = comparacao.modificados[idx];
                diff = `<div style=&amp;quot;color: #fbbf24; font-weight: bold; margin-bottom: 12px;&amp;quot;>⚠️ ARQUIVO MODIFICADO: ${item.nome}</div>`;
                diff += '<div class=&amp;quot;diff-container&amp;quot;>';
                item.diff.diff.slice(0, 200).forEach(d => {
                    if (d.tipo === 'add') {
                        diff += `<div class=&amp;quot;diff-linha diff-add&amp;quot;>${d.linha} | + ${d.conteudo}</div>`;
                    } else if (d.tipo === 'remove') {
                        diff += `<div class=&amp;quot;diff-linha diff-remove&amp;quot;>${d.linha} | - ${d.conteudo}</div>`;
                    } else if (d.tipo === 'modify') {
                        diff += `<div class=&amp;quot;diff-linha diff-remove&amp;quot;>${d.linha} | - ${d.antes}</div>`;
                        diff += `<div class=&amp;quot;diff-linha diff-add&amp;quot;>${d.linha} | + ${d.depois}</div>`;
                    } else if (Math.random() > 0.7) { // Mostrar só algumas linhas iguais
                        diff += `<div class=&amp;quot;diff-linha diff-igual&amp;quot;>${d.linha} | ${d.conteudo}</div>`;
                    }
                });
                diff += '</div>';
            } else {
                item = comparacao.deletados[idx];
                diff = `<div style=&amp;quot;color: #f87171; font-weight: bold; margin-bottom: 12px;&amp;quot;>❌ ARQUIVO DELETADO: ${item.nome}</div>`;
                diff += '<div class=&amp;quot;diff-container&amp;quot;>';
                item.arquivo.conteudo.split('\n').slice(0, 100).forEach((linha, i) => {
                    diff += `<div class=&amp;quot;diff-linha diff-remove&amp;quot;>${i + 1} | ${linha}</div>`;
                });
                diff += '</div>';
            }

            document.getElementById('tab-codigo').innerHTML = diff;
            mudarTab('codigo');
        }

        function gerarSugestoes() {
            let html = '<div style=&amp;quot;margin-bottom: 16px; color: #38bdf8; font-weight: bold; font-size: 16px;&amp;quot;>💡 SUGESTÕES INTELIGENTES</div>';

            // Sugestão 1: Arquivos novos
            if (comparacao.novos.length > 0) {
                html += `
                    <div class=&amp;quot;sugestao&amp;quot;>
                        <div class=&amp;quot;sugestao-titulo&amp;quot;>✅ ${comparacao.novos.length} arquivo(s) novo(s) no Projeto 2</div>
                        <div class=&amp;quot;sugestao-texto&amp;quot;>
                            Estes arquivos foram adicionados no projeto atualizado. Se o Projeto 1 não funciona e o 2 funciona, 
                            pode ser porque estes arquivos são necessários. Considere copiar para o Projeto 1:
                            <ul style=&amp;quot;margin-top: 8px;&amp;quot;>
                                ${comparacao.novos.slice(0, 5).map(n => `<li>${n.nome}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                `;
            }

            // Sugestão 2: Arquivos modificados
            if (comparacao.modificados.length > 0) {
                const maisModificado = comparacao.modificados.reduce((max, item) => 
                    (item.diff.linhasAdicionadas + item.diff.linhasRemovidas) > 
                    (max.diff.linhasAdicionadas + max.diff.linhasRemovidas) ? item : max
                );

                html += `
                    <div class=&amp;quot;sugestao&amp;quot;>
                        <div class=&amp;quot;sugestao-titulo&amp;quot;>⚠️ Arquivo mais modificado: ${maisModificado.nome}</div>
                        <div class=&amp;quot;sugestao-texto&amp;quot;>
                            Este arquivo teve ${maisModificado.diff.linhasAdicionadas + maisModificado.diff.linhasRemovidas} linhas alteradas.
                            Se algo não funciona no Projeto 1, provavelmente a correção está neste arquivo.
                            Clique em &amp;quot;📁 Arquivos&amp;quot; para ver as diferenças linha por linha.
                        </div>
                    </div>
                `;
            }

            // Sugestão 3: Dependências (se tiver package.json)
            const pkg1 = projetos[1].arquivos['package.json'];
            const pkg2 = projetos[2].arquivos['package.json'];

            if (pkg1 &amp;amp;&amp;amp; pkg2) {
                try {
                    const deps1 = JSON.parse(pkg1.conteudo).dependencies || {};
                    const deps2 = JSON.parse(pkg2.conteudo).dependencies || {};
                    const novasDeps = Object.keys(deps2).filter(k => !deps1[k]);

                    if (novasDeps.length > 0) {
                        html += `
                            <div class=&amp;quot;sugestao&amp;quot;>
                                <div class=&amp;quot;sugestao-titulo&amp;quot;>📦 ${novasDeps.length} dependência(s) nova(s)</div>
                                <div class=&amp;quot;sugestao-texto&amp;quot;>
                                    O Projeto 2 usa pacotes que não existem no Projeto 1:
                                    <ul style=&amp;quot;margin-top: 8px;&amp;quot;>
                                        ${novasDeps.slice(0, 5).map(d => `<li>${d}: ${deps2[d]}</li>`).join('')}
                                    </ul>
                                    Instale com: <code style=&amp;quot;background: #0f172a; padding: 2px 6px; border-radius: 4px;&amp;quot;>npm install ${novasDeps.join(' ')}</code>
                                </div>
                            </div>
                        `;
                    }
                } catch(e) {}
            }

            // Sugestão 4: Arquivos deletados
            if (comparacao.deletados.length > 0) {
                html += `
                    <div class=&amp;quot;sugestao&amp;quot;>
                        <div class=&amp;quot;sugestao-titulo&amp;quot;>❌ ${comparacao.deletados.length} arquivo(s) removido(s)</div>

<script>
'use strict';

/*══════════════════════════════════════════════════════════════════
  AUTO-DETECÇÃO AMPLIADA DE PROVEDORES
══════════════════════════════════════════════════════════════════*/
const AUTO_DETECT = [
  { prefix:'gsk_',    url:'https://api.groq.com/openai/v1',                          model:'llama-3.3-70b-versatile', name:'Groq' },
  { prefix:'sk-or-',  url:'https://openrouter.ai/api/v1',                            model:'openai/gpt-4o-mini',      name:'OpenRouter' },
  { prefix:'sk-ant-', url:'https://api.anthropic.com/v1',                            model:'claude-3-5-haiku-latest', name:'Anthropic Claude' },
  { prefix:'pplx-',   url:'https://api.perplexity.ai',                               model:'sonar-pro',               name:'Perplexity' },
  { prefix:'AIza',    url:'https://generativelanguage.googleapis.com/v1beta/openai', model:'gemini-2.0-flash',        name:'Google Gemini' },
  { prefix:'xai-',    url:'https://api.x.ai/v1',                                     model:'grok-2-latest',           name:'xAI/Grok' },
  { prefix:'hf_',     url:'https://api-inference.huggingface.co/v1',                 model:'meta-llama/Llama-3.3-70B-Instruct', name:'HuggingFace' },
  { prefix:'csk-',    url:'https://api.cerebras.ai/v1',                              model:'llama-3.3-70b',           name:'Cerebras' },
  { prefix:'fw_',     url:'https://api.fireworks.ai/inference/v1',                   model:'accounts/fireworks/models/llama-v3p3-70b-instruct', name:'Fireworks' },
  { prefix:'tgp_',    url:'https://api.together.xyz/v1',                             model:'meta-llama/Llama-3.3-70B-Instruct-Turbo', name:'Together AI' },
  // Mistral (32 chars hex), DeepSeek (sk-...), Cohere — detectados por regex abaixo
  { prefix:'sk-',     url:'https://api.openai.com/v1',                               model:'gpt-4o-mini',             name:'OpenAI' },
];

const REGEX_DETECT = [
  { regex:/^[a-zA-Z0-9]{32}$/, url:'https://api.mistral.ai/v1', model:'mistral-small-latest', name:'Mistral' },
];

function detectProvider(key) {
  if (!key) return null;
  for (const p of AUTO_DETECT) if (key.startsWith(p.prefix)) return p;
  for (const p of REGEX_DETECT) if (p.regex.test(key)) return p;
  return null;
}

/*══════════════════════════════════════════════════════════════════
  INDEXEDDB — Auto-save robusto
══════════════════════════════════════════════════════════════════*/
const DB_NAME = 'ChatIAProDB';
const DB_VER  = 1;
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = ev => {
      const d = ev.target.result;
      if (!d.objectStoreNames.contains('conversations')) {
        d.createObjectStore('conversations', { keyPath:'id' });
      }
      if (!d.objectStoreNames.contains('settings')) {
        d.createObjectStore('settings', { keyPath:'key' });
      }
    };
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onerror   = () => reject(req.error);
  });
}

function dbPut(store, obj) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(obj);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
function dbGetAll(store) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => res(req.result);
    req.onerror   = () => rej(req.error);
  });
}
function dbGet(store, key) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => res(req.result);
    req.onerror   = () => rej(req.error);
  });
}
function dbDelete(store, key) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}

/*══════════════════════════════════════════════════════════════════
  ESTADO
══════════════════════════════════════════════════════════════════*/
let apiKey    = localStorage.getItem('cia_key')   || '';
let apiUrl    = localStorage.getItem('cia_url')   || '';
let apiModel  = localStorage.getItem('cia_model') || '';
let savedKeys = JSON.parse(localStorage.getItem('cia_saved') || '[]');
let ttsOn     = localStorage.getItem('cia_tts') !== 'off';
let webOn     = localStorage.getItem('cia_web') === 'on';
let showKey   = false;

let history    = [];
let currentConvId = null;
let controller = null;
let isRecording= false;
let recog      = null;
let silTimer   = null;
let saveTimer  = null;

/*══════════════════════════════════════════════════════════════════
  BOOT
══════════════════════════════════════════════════════════════════*/
async function boot() {
  try { await openDB(); } catch(e) { console.warn('IndexedDB indisponível:', e); }

  const ki = document.getElementById('keyInput');
  ki.value = apiKey;
  if (apiKey) {
    const d = detectProvider(apiKey);
    if (d) {
      document.getElementById('urlInput').value = d.url;
      document.getElementById('modelInput').value = d.model;
    } else {
      document.getElementById('urlInput').value = apiUrl;
      document.getElementById('modelInput').value = apiModel;
    }
  }
  updateProvBadge();
  updateCfgStatus();
  document.getElementById('ttsBtn').style.opacity = ttsOn ? '1' : '0.4';
  document.getElementById('webBtn').classList.toggle('web-on', webOn);
  renderSavedKeys();
  await renderConvList();

  // Restaura conversa atual se houver
  const last = localStorage.getItem('cia_current_conv');
  if (last &amp;amp;&amp;amp; db) {
    const conv = await dbGet('conversations', last);
    if (conv &amp;amp;&amp;amp; conv.messages?.length) {
      currentConvId = conv.id;
      history = conv.messages;
      restoreUI();
    }
  }

  // Restaura rascunho do input
  const draft = localStorage.getItem('cia_draft');
  if (draft) {
    document.getElementById('msgInput').value = draft;
    adjustHeight(document.getElementById('msgInput'));
  }

  if (!apiKey) togglePanel('cfgPanel','cfgBtn');
}

function restoreUI() {
  document.getElementById('emptyState')?.remove();
  const chat = document.getElementById('chat');
  chat.innerHTML = '';
  history.forEach(m => appendMsg(m.role === 'user' ? 'user' : 'bot', m.content, false, true));
  addCopyListeners();
}

/*══════════════════════════════════════════════════════════════════
  AUTO-SAVE
══════════════════════════════════════════════════════════════════*/
async function autoSave() {
  if (!db || !history.length) return;
  if (!currentConvId) currentConvId = 'conv_' + Date.now();

  const firstUserMsg = history.find(m => m.role === 'user')?.content || 'Conversa';
  const title = firstUserMsg.slice(0, 60).replace(/\n/g,' ');

  const obj = {
    id: currentConvId,
    title,
    messages: history,
    updatedAt: Date.now(),
    provider: apiKey ? (detectProvider(apiKey)?.name || 'Custom') : 'Demo',
  };
  try {
    await dbPut('conversations', obj);
    localStorage.setItem('cia_current_conv', currentConvId);
  } catch(e) { console.warn('Auto-save falhou:', e); }
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(autoSave, 400);
}

function autoSaveDraft() {
  const v = document.getElementById('msgInput').value;
  if (v) localStorage.setItem('cia_draft', v);
  else   localStorage.removeItem('cia_draft');
}

/*══════════════════════════════════════════════════════════════════
  PAINÉIS GENÉRICOS
══════════════════════════════════════════════════════════════════*/
function togglePanel(panelId, btnId) {
  const allPanels = ['cfgPanel','keysPanel','convPanel','ioPanel'];
  const allBtns   = ['cfgBtn','keysBtn','convBtn','ioBtn'];
  const target = document.getElementById(panelId);
  const show = !target.classList.contains('show');
  allPanels.forEach(id => document.getElementById(id).classList.remove('show'));
  allBtns.forEach(id => document.getElementById(id)?.classList.remove('active'));
  if (show) {
    target.classList.add('show');
    document.getElementById(btnId)?.classList.add('active');
  }
}

/*══════════════════════════════════════════════════════════════════
  CHAVES
══════════════════════════════════════════════════════════════════*/
function onKeyInput(val) {
  val = val.trim();
  apiKey = val;
  localStorage.setItem('cia_key', val);
  const d = val ? detectProvider(val) : null;
  if (d) {
    document.getElementById('urlInput').value  = d.url;
    document.getElementById('modelInput').value = d.model;
    apiUrl   = d.url;
    apiModel = d.model;
    localStorage.setItem('cia_url',   d.url);
    localStorage.setItem('cia_model', d.model);
    document.getElementById('cfgProvOk').textContent = '✓ ' + d.name + ' · ' + d.model;
    document.getElementById('cfgProvOk').style.display = 'block';
    document.getElementById('cfgNote').style.display = 'none';
  } else {
    document.getElementById('cfgProvOk').style.display = 'none';
    document.getElementById('cfgNote').style.display = '';
  }
  document.getElementById('saveRow').style.display = val ? 'flex' : 'none';
  updateProvBadge();
  updateCfgStatus();
}

function updateProvBadge() {
  const badge = document.getElementById('provBadge');
  if (apiKey) {
    const d = detectProvider(apiKey);
    badge.textContent = d ? d.name : 'Custom';
    badge.style.borderColor = '#5aab56';
    badge.style.color = '#7ec87a';
  } else {
    badge.textContent = 'Demo ✨';
    badge.style.borderColor = '#60a5fa';
    badge.style.color = '#93c5fd';
  }
}

function updateCfgStatus() {
  const el = document.getElementById('cfgStatus');
  if (apiKey) {
    const d = detectProvider(apiKey);
    el.textContent = '✓ ' + (d ? d.name : 'Personalizada') + ' ativa';
    el.className = 'cfg-status ok';
  } else {
    el.textContent = 'Sem chave configurada';
    el.className = 'cfg-status demo';
  }
}

function toggleShowKey() {
  showKey = !showKey;
  document.getElementById('keyInput').type = showKey ? 'text' : 'password';
}

function saveKey() {
  const key   = document.getElementById('keyInput').value.trim();
  const label = document.getElementById('labelInput').value.trim();
  const url   = document.getElementById('urlInput').value.trim();
  const model = document.getElementById('modelInput').value.trim();
  if (!key) return;
  if (savedKeys.some(k => k.key === key)) { toast('Chave já salva','err'); return; }
  const d = detectProvider(key);
  const finalLabel = label || (d ? d.name : 'Chave ' + (savedKeys.length+1));
  savedKeys.push({ id:Date.now()+'', label:finalLabel, key, url, model, provider:d ? d.name : 'Custom' });
  localStorage.setItem('cia_saved', JSON.stringify(savedKeys));
  document.getElementById('labelInput').value = '';
  renderSavedKeys();
  toast('Chave salva ✓');
}

function renderSavedKeys() {
  const list = document.getElementById('keysList');
  document.getElementById('keysTitle').textContent = 'Chaves Salvas ('+savedKeys.length+')';
  if (!savedKeys.length) {
    list.innerHTML = '<div style=&amp;quot;font-size:12px;color:#6b8f68;text-align:center;padding:10px&amp;quot;>Nenhuma chave salva.</div>';
    return;
  }
  list.innerHTML = '';
  savedKeys.forEach(sk => {
    const div = document.createElement('div');
    div.className = 'saved-key' + (sk.key === apiKey ? ' active' : '');
    div.innerHTML =
      '<div class=&amp;quot;saved-key-info&amp;quot; onclick=&amp;quot;loadKey(\''+sk.id+'\')&amp;quot;>'+
        '<div class=&amp;quot;saved-key-label&amp;quot;>'+esc(sk.label)+'</div>'+
        '<div class=&amp;quot;saved-key-meta&amp;quot;>'+esc(sk.provider)+' · '+sk.key.slice(0,6)+'…'+sk.key.slice(-3)+'</div>'+
      '</div>'+
      (sk.key === apiKey ? '<span class=&amp;quot;active-tag&amp;quot;>ATIVA</span>' : '')+
      '<button class=&amp;quot;del-btn&amp;quot; onclick=&amp;quot;deleteKey(\''+sk.id+'\')&amp;quot;>✕</button>';
    list.appendChild(div);
  });
}

function loadKey(id) {
  const sk = savedKeys.find(k => k.id === id);
  if (!sk) return;
  apiKey = sk.key; apiUrl = sk.url; apiModel = sk.model;
  localStorage.setItem('cia_key',   sk.key);
  localStorage.setItem('cia_url',   sk.url);
  localStorage.setItem('cia_model', sk.model);
  document.getElementById('keyInput').value   = sk.key;
  document.getElementById('urlInput').value   = sk.url;
  document.getElementById('modelInput').value = sk.model;
  onKeyInput(sk.key);
  renderSavedKeys();
  togglePanel('keysPanel','keysBtn');
  toast('Chave &amp;quot;'+sk.label+'&amp;quot; ativada');
}

function deleteKey(id) {
  savedKeys = savedKeys.filter(k => k.id !== id);
  localStorage.setItem('cia_saved', JSON.stringify(savedKeys));
  renderSavedKeys();
}

/*══════════════════════════════════════════════════════════════════
  HISTÓRICO DE CONVERSAS
══════════════════════════════════════════════════════════════════*/
async function renderConvList() {
  const list = document.getElementById('convList');
  if (!db) { list.innerHTML = '<div style=&amp;quot;font-size:12px;color:#6b8f68;text-align:center;padding:10px&amp;quot;>DB indisponível</div>'; return; }
  const convs = (await dbGetAll('conversations')).sort((a,b) => b.updatedAt - a.updatedAt);
  document.getElementById('convTitle').textContent = 'Conversas ('+convs.length+')';
  if (!convs.length) {
    list.innerHTML = '<div style=&amp;quot;font-size:12px;color:#6b8f68;text-align:center;padding:10px&amp;quot;>Nenhuma conversa salva ainda.</div>';
    return;
  }
  list.innerHTML = '';
  convs.forEach(c => {
    const div = document.createElement('div');
    div.className = 'conv-item' + (c.id === currentConvId ? ' active' : '');
    const date = new Date(c.updatedAt).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    div.innerHTML =
      '<div class=&amp;quot;conv-info&amp;quot; onclick=&amp;quot;loadConv(\''+c.id+'\')&amp;quot;>'+
        '<div class=&amp;quot;conv-title&amp;quot;>'+esc(c.title)+'</div>'+
        '<div class=&amp;quot;conv-meta&amp;quot;>'+date+' · '+c.messages.length+' msgs · '+esc(c.provider||'')+'</div>'+
      '</div>'+
      '<button class=&amp;quot;del-btn&amp;quot; onclick=&amp;quot;deleteConv(\''+c.id+'\')&amp;quot;>✕</button>';
    list.appendChild(div);
  });
}

async function loadConv(id) {
  const c = await dbGet('conversations', id);
  if (!c) return;
  currentConvId = c.id;
  history = c.messages;
  localStorage.setItem('cia_current_conv', id);
  restoreUI();
  togglePanel('convPanel','convBtn');

async function deleteConv(id) {
  if (!confirm('Excluir esta conversa?')) return;
  await dbDelete('conversations', id);
  if (id === currentConvId) { currentConvId = null; history = []; restoreUI(); }

}

function newChat() {

      '<div class=&amp;quot;chip&amp;quot; onclick=&amp;quot;setPrompt(\'Me ajude com uma questão jurídica.\')&amp;quot;>⚖️ Jurídico</div>'+

/*══════════════════════════════════════════════════════════════════
  BUSCA NA WEB
══════════════════════════════════════════════════════════════════*/
function toggleWeb() {
  webOn = !webOn;
  localStorage.setItem('cia_web', webOn ? 'on' : 'off');
  document.getElementById('webBtn').classList.toggle('web-on', webOn);
  toast(webOn ? '🌐 Busca web ATIVADA' : 'Busca web desativada');
}

async function webSearch(query) {
  // Usa DuckDuckGo Instant Answer API (CORS-friendly)
  try {
    const url = 'https://api.duckduckgo.com/?q='+encodeURIComponent(query)+'&amp;amp;format=json&amp;amp;no_html=1&amp;amp;skip_disambig=1';
    const r = await fetch(url);
    const j = await r.json();
    const parts = [];
    if (j.AbstractText) parts.push('RESUMO: '+j.AbstractText+(j.AbstractURL?' (Fonte: '+j.AbstractURL+')':''));
    if (j.Answer) parts.push('RESPOSTA: '+j.Answer);
    if (j.Definition) parts.push('DEFINIÇÃO: '+j.Definition);
    if (j.RelatedTopics?.length) {
      const topics = j.RelatedTopics.slice(0,5)
        .filter(t => t.Text)
        .map((t,i) => (i+1)+'. '+t.Text+(t.FirstURL?' ['+t.FirstURL+']':''));
      if (topics.length) parts.push('TÓPICOS:\n'+topics.join('\n'));
    }
    return parts.length ? parts.join('\n\n') : null;
  } catch(e) {
    console.warn('Web search falhou:', e);
    return null;
  }
}

/*══════════════════════════════════════════════════════════════════
  ENVIAR
══════════════════════════════════════════════════════════════════*/
function handleKey(e) {
  if (e.key === 'Enter' &amp;amp;&amp;amp; !e.shiftKey) { e.preventDefault(); send(); }
}
function adjustHeight(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 130) + 'px';
}
function setPrompt(txt) {
  const el = document.getElementById('msgInput');
  el.value = txt; adjustHeight(el); el.focus();
}

async function send(textOverride) {
  const el = document.getElementById('msgInput');
  const text = (textOverride || el.value).trim();
  if (!text) return;

  if (window.speechSynthesis) {
    const u = new SpeechSynthesisUtterance(' '); u.volume = 0;
    window.speechSynthesis.speak(u);
  }

  document.getElementById('emptyState')?.remove();
  el.value = ''; el.style.height = '44px';
  localStorage.removeItem('cia_draft');

  history.push({ role:'user', content:text });
  appendMsg('user', text);
  scheduleSave();

  controller = new AbortController();
  document.getElementById('sendBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'flex';

  const { content: contentEl } = appendMsg('bot', '', true);

  // BUSCA WEB se ativada
  let webContext = '';
  if (webOn) {
    const note = document.createElement('div');
    note.className = 'progress';
    note.textContent = '🌐 Buscando na internet...';
    contentEl.appendChild(note);
    const result = await webSearch(text);
    note.remove();
    if (result) {
      webContext = '\n\n[CONTEXTO DA WEB — use estas informações atuais]:\n'+result+'\n[FIM DO CONTEXTO]';
      const ok = document.createElement('div');
      ok.className = 'progress';
      ok.textContent = '✓ Resultados da web incorporados';
      contentEl.appendChild
      contentEl.appendChild(ok);
      setTimeout(() => ok.remove(), 2000);
    } else {
      const fail = document.createElement('div');
      fail.className = 'progress';
      fail.style.color = '#f87171';
      fail.textContent = '⚠️ Busca web falhou — continuando sem contexto extra';
      contentEl.appendChild(fail);
      setTimeout(() => fail.remove(), 2500);
    }
  }

  try {
    const key   = apiKey.trim();
    const url   = (document.getElementById('urlInput').value || apiUrl || 'https://api.groq.com/openai/v1').trim().replace(/\/$/, '');
    const model = document.getElementById('modelInput').value || apiModel || 'llama-3.3-70b-versatile';

    if (!key) {
      contentEl.innerHTML = '<span style=&amp;quot;color:#60a5fa&amp;quot;>⚠️ Configure uma chave de API em ⚙️. Groq é gratuito: <a href=&amp;quot;https://console.groq.com&amp;quot; target=&amp;quot;_blank&amp;quot; style=&amp;quot;color:#7ec87a&amp;quot;>console.groq.com</a></span>';
      history.pop();
      scheduleSave();
      return;
    }

    // Monta mensagens (injeta contexto web se houver)
    let msgs = [...history];
    if (webContext) {
      const last = msgs[msgs.length - 1];
      msgs[msgs.length - 1] = { role:'user', content:last.content + webContext };
    }

    const endpoint = url + '/chat/completions';
    const headers = {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + key,
      'HTTP-Referer': location.origin,
      'X-Title': 'Chat IA Pro',
    };
    const body = JSON.stringify({ model, messages: msgs, stream: true, max_tokens: 16384 });

    const resp = await fetch(endpoint, { method:'POST', headers, body, signal: controller.signal });

    if (!resp.ok) {
      const errText = await resp.text();
      let msg = 'Erro ' + resp.status;
      try { msg = JSON.parse(errText)?.error?.message || msg; } catch {}
      contentEl.innerHTML = '<span style=&amp;quot;color:'+getCSSVar('--err')+'&amp;quot;>❌ ' + esc(msg) + '</span>';
      history.pop();
      scheduleSave();
      return;
    }

    const reader  = resp.body.getReader();
    const decoder = new TextDecoder();
    let full = '', buf = '';

    const cursor = document.createElement('span');
    cursor.className = 'cursor-blink';
    contentEl.appendChild(cursor);

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream:true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const j = line.slice(6).trim();
        if (j === '[DONE]') continue;
        try {
          const p = JSON.parse(j);
          if (p.error) throw new Error(typeof p.error === 'string' ? p.error : p.error.message || 'Erro do provedor');
          const delta = p.choices?.[0]?.delta?.content || p.text || p.content || '';
          if (delta) {
            full += delta;
            cursor.remove();
            contentEl.innerHTML = renderMarkdown(full);
            contentEl.appendChild(cursor);
            scrollBottom();
          }
        } catch(e) { if (e instanceof SyntaxError) continue; throw e; }
      }
    }

    cursor.remove();
    if (full) {
      contentEl.innerHTML = renderMarkdown(full);
      history.push({ role:'assistant', content:full });
      scheduleSave();
      if (ttsOn) speakText(full);
    }

  } catch (err) {
    if (err.name === 'AbortError') {
      contentEl.innerHTML += '<em style=&amp;quot;color:var(--muted);font-size:11px&amp;quot;> [parado]</em>';
    } else {
      contentEl.innerHTML = '<span style=&amp;quot;color:var(--err)&amp;quot;>❌ ' + esc(err.message) + '</span>';
      history.pop();
      scheduleSave();
    }
  } finally {
    controller = null;
    document.getElementById('sendBtn').style.display = 'flex';
    document.getElementById('stopBtn').style.display = 'none';
    scrollBottom();
    addCopyListeners();
  }
}

function abortStream() { controller?.abort(); }

/*══════════════════════════════════════════════════════════════════
  RENDERIZAÇÃO
══════════════════════════════════════════════════════════════════*/
function appendMsg(role, text, streaming, isRestore) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';

  const content = document.createElement('div');
  content.className = 'msg-content';

  if (role === 'user') {
    content.textContent = text;
  } else if (streaming) {
    content.innerHTML = '';
  } else {
    content.innerHTML = renderMarkdown(text);
  }

  bubble.appendChild(content);
  wrap.appendChild(bubble);

  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  if (role === 'bot') {
    const prov = apiKey ? (detectProvider(apiKey)?.name || 'IA') : 'IA';
    const btn = document.createElement('button');
    btn.innerHTML = '📋 Copiar';
    btn.onclick = function() { copyText(this, content.textContent); };
    const lbl = document.createElement('span');
    lbl.className = 'prov-label';
    lbl.textContent = prov;
    meta.appendChild(lbl);
    meta.appendChild(btn);
  } else {
    const btn = document.createElement('button');
    btn.innerHTML = '📋 Copiar';
    btn.onclick = function() { copyText(this, text); };
    meta.appendChild(btn);
  }
  wrap.appendChild(meta);

  document.getElementById('chat').appendChild(wrap);
  if (!isRestore) scrollBottom();
  return { el: wrap, content };
}

let copyBlockId = 0;
function renderMarkdown(text) {
  let html = esc(text);
  html = html.replace(/```(\w*?)\n([\s\S]*?)```/g, function(_, lang, code) {
    const id = 'cb' + (++copyBlockId);
    return (
      '<div class=&amp;quot;code-block&amp;quot;>' +
        '<div class=&amp;quot;code-header&amp;quot;>' +
          '<span>' + (lang || 'código') + '</span>' +
          '<button class=&amp;quot;copy-btn&amp;quot; data-copy=&amp;quot;'+escAttr(code)+'&amp;quot; id=&amp;quot;'+id+'&amp;quot;>📋 Copiar</button>' +
        '</div>' +
        '<div class=&amp;quot;code-body&amp;quot;>' + code + '</div>' +
      '</div>'
    );
  });
  html = html.replace(/`([^`\n]+?)`/g, '<span class=&amp;quot;inline-code&amp;quot;>$1</span>');
  html = html.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*([^*]+?)\*/g, '<em>$1</em>');
  html = html.replace(/(https?:\/\/[^\s<>&amp;quot;']+)/g, '<a href=&amp;quot;$1&amp;quot; target=&amp;quot;_blank&amp;quot; rel=&amp;quot;noopener&amp;quot;>$1</a>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

function addCopyListeners() {
  document.querySelectorAll('.copy-btn[data-copy]').forEach(btn => {
    if (btn.dataset.bound) return;
    btn.dataset.bound = '1';
    btn.onclick = function() { copyText(this, this.dataset.copy); };
  });
}

function copyText(btn, text) {
  navigator.clipboard.writeText(text || '').catch(() => {});
  const orig = btn.innerHTML;
  btn.innerHTML = '✓ Copiado!';
  setTimeout(() => { btn.innerHTML = orig; }, 1800);
}

function scrollBottom() {
  const c = document.getElementById('chat');
  c.scrollTop = c.scrollHeight;
}

/*══════════════════════════════════════════════════════════════════
  EXPORTAR — TXT, MD, JSON, PDF
══════════════════════════════════════════════════════════════════*/
function exportConv(format) {
  if (!history.length) { toast('Nada para exportar','err'); return; }
  const date = new Date().toLocaleString('pt-BR');
  let content = '', mime = 'text/plain', ext = format;

  if (format === 'txt') {
    const lines = ['=== CONVERSA — Chat IA Pro ===', 'Data: '+date, ''];
    history.forEach(m => {
      lines.push('['+(m.role==='user'?'VOCÊ':'IA')+']');
      lines.push(m.content); lines.push('');
    });
    content = lines.join('\n');
  }
  else if (format === 'md') {
    const lines = ['# Conversa Chat IA Pro', '> '+date, ''];
    history.forEach(m => {
      lines.push('### '+(m.role==='user'?'🧑 Você':'🤖 IA'));
      lines.push(''); lines.push(m.content); lines.push('');
    });
    content = lines.join('\n');
    mime = 'text/markdown';
  }
  else if (format === 'json') {
    content = JSON.stringify({
      title: history.find(m=>m.role==='user')?.content?.slice(0,60) || 'Conversa',
      exportedAt: date,
      provider: apiKey ? (detectProvider(apiKey)?.name || 'Custom') : 'Demo',
      messages: history,
    }, null, 2);
    mime = 'application/json';
  }
  else if (format === 'pdf') {
    // PDF via janela de impressão
    const w = window.open('', '_blank');
    const html = ['<!DOCTYPE html><html><head><meta charset=&amp;quot;UTF-8&amp;quot;><title>Conversa</title>',
      '<style>',
      'body{font-family:Georgia,serif;max-width:780px;margin:30px auto;padding:0 20px;color:#222;line-height:1.6}',
      'h1{color:#2d4a1e;border-bottom:2px solid #5aab56;padding-bottom:8px}',
      '.meta{color:#666;font-size:12px;margin-bottom:20px}',
      '.msg{margin:16px 0;padding:12px 16px;border-radius:8px;page-break-inside:avoid}',
      '.user{background:#e8f5e9;border-left:4px solid #5aab56}',
      '.bot{background:#f5f5f5;border-left:4px solid #888}',
      '.role{font-weight:bold;font-size:11px;text-transform:uppercase;color:#555;margin-bottom:4px}',
      'pre{background:#0d1309;color:#a8d5a2;padding:10px;border-radius:6px;overflow-x:auto;font-size:12px}',
      'code{background:#eee;padding:1px 4px;border-radius:3px;font-size:12px}',
      '@media print { body{margin:0} }',
      '</style></head><body>',
      '<h1>Conversa — Chat IA Pro</h1>',
      '<div class=&amp;quot;meta&amp;quot;>Exportado em '+date+' · '+history.length+' mensagens</div>'];
    history.forEach(m => {
      const safe = esc(m.content).replace(/\n/g,'<br>');
      html.push('<div class=&amp;quot;msg '+(m.role==='user'?'user':'bot')+'&amp;quot;>');
      html.push('<div class=&amp;quot;role&amp;quot;>'+(m.role==='user'?'🧑 Você':'🤖 IA')+'</div>');
      html.push('<div>'+safe+'</div></div>');
    });
    html.push('<script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>');
    w.document.write(html.join(''));
    w.document.close();
    toast('PDF: use &amp;quot;Salvar como PDF&amp;quot; na impressão');
    return;
  }

  const blob = new Blob([content], { type: mime+';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'conversa-' + Date.now() + '.' + ext;
  a.click();
  toast('Exportado: ' + ext.toUpperCase());
}

/*══════════════════════════════════════════════════════════════════
  IMPORTAR — TXT, MD, CSV, JSON, PDF
══════════════════════════════════════════════════════════════════*/
async function importFile(e) {
  const file = e.target.files?.[0];
  e.target.value = '';
  if (!file) return;

  const name = file.name.toLowerCase();
  const el = document.getElementById('msgInput');

  try {
    let txt = '';

    if (name.endsWith('.pdf')) {
      toast('📕 Lendo PDF...');
      txt = await extractPDF(file);
    }
    else if (name.endsWith('.json')) {
      const raw = await file.text();
      try {
        const j = JSON.parse(raw);
        // Se for conversa exportada, oferecer importar
        if (j.messages &amp;amp;&amp;amp; Array.isArray(j.messages)) {
          if (confirm('Este JSON é uma conversa exportada. Restaurar como nova conversa?')) {
            history = j.messages;
            currentConvId = null;
            restoreUI();
            scheduleSave();
            togglePanel('ioPanel','ioBtn');
            toast('Conversa importada ✓');
            return;
          }
        }
        txt = JSON.stringify(j, null, 2);
      } catch { txt = raw; }
    }
    else {
      txt = await file.text();
    }

    if (txt) {
      el.value = el.value ? el.value + '\n\n' + txt : txt;
      adjustHeight(el);
      autoSaveDraft();
      togglePanel('ioPanel','ioBtn');
      toast('Arquivo importado ('+txt.length+' chars)');
    }
  } catch(err) {
    toast('Erro: '+err.message, 'err');
  }
}

async function extractPDF(file) {
  if (typeof pdfjsLib === 'undefined') throw new Error('PDF.js não carregou');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    pages.push('--- Página '+i+' ---\n' + tc.items.map(it => it.str).join(' '));
  }
  return pages.join('\n\n');
}

/*══════════════════════════════════════════════════════════════════
  OCR — Imagem para texto
══════════════════════════════════════════════════════════════════*/
async function importImage(e) {
  const file = e.target.files?.[0];
  e.target.value = '';
  if (!file) return;

  if (typeof Tesseract === 'undefined') { toast('Tesseract não carregou','err'); return; }

  const el = document.getElementById('msgInput');
  const progress = document.createElement('div');
  progress.className = 'progress';
  progress.style.position = 'fixed';
  progress.style.top = '60px';
  progress.style.left = '50%';
  progress.style.transform = 'translateX(-50%)';
  progress.style.zIndex = '1000';
  progress.textContent = '🔍 OCR iniciando...';
  document.body.appendChild(progress);

  try {
    const { data } = await Tesseract.recognize(file, 'por+eng', {
      logger: m => {
        if (m.status === 'recognizing text') {
          progress.textContent = '🔍 OCR: ' + Math.round(m.progress*100) + '%';
        } else if (m.status) {
          progress.textContent = '🔍 ' + m.status + '...';
        }
      }
    });
    const txt = (data?.text || '').trim();
    if (txt) {
      el.value = el.value ? el.value + '\n\n[OCR]\n' + txt : '[OCR]\n' + txt;
      adjustHeight(el);
      autoSaveDraft();
      togglePanel('ioPanel','ioBtn');
      toast('OCR concluído ('+txt.length+' chars)');
    } else {
      toast('Nenhum texto encontrado na imagem','err');
    }
  } catch(err) {
    toast('Erro OCR: '+err.message,'err');
  } finally {
    progress.remove();
  }
}

async function backupAll() {

  const data = {

    exportedAt: new Date().toISOString(),
    keys: savedKeys,
    conversations: convs,
    settings: {

      ttsOn, webOn,
    }

  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });

  a.download = 'chatia-backup-' + Date.now() + '.json';
  a.click();
  toast('Backup completo gerado ✓');
}

async function restoreBackup(e) {
  const file = e.target.files?.[0];
  e.target.value = '';
  if (!file) return;
  if (!confirm('Restaurar backup? Suas chaves e conversas atuais serão MESCLADAS.')) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.keys?.length) {
      const existing = new Set(savedKeys.map(k => k.key));
      data.keys.forEach(k => { if (!existing.has(k.key)) savedKeys.push(k); });
      localStorage.setItem('cia_saved', JSON.stringify(savedKeys));
    }
    if (data.conversations?.length &amp;amp;&amp;amp; db) {
      for (const c of data.conversations) await dbPut('conversations', c);
    }
    renderSavedKeys();
    await renderConvList();
    toast('Backup restaurado ✓');
  } catch(err) {
    toast('Erro: backup inválido','err');
  }
}

/*══════════════════════════════════════════════════════════════════
  VOZ — STT
══════════════════════════════════════════════════════════════════*/
function toggleVoice() {
  if (isRecording) { stopVoice(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Use Chrome ou Edge para voz','err'); return; }

  recog = new SR();
  recog.lang = 'pt-BR';
  recog.continuous = true;
  recog.interimResults = true;

  let fullText = '';
  const schedSend = () => {
    clearTimeout(silTimer);
    silTimer = setTimeout(() => {
      try { recog.stop(); } catch {}
      if (fullText.trim()) { setPrompt(''); send(fullText.trim()); }
    }, 1800);
  };

  recog.onresult = ev => {
    let final = '', interim = '';
    for (let i = 0; i < ev.results.length; i++) {
      if (ev.results[i].isFinal) final += ev.results[i][0].transcript;
      else interim += ev.results[i][0].transcript;
    }
    fullText = final || interim;
    document.getElementById('msgInput').value = fullText;
    adjustHeight(document.getElementById('msgInput'));
    if (fullText) schedSend();
  };

  recog.onerror = recog.onend = () => {
    clearTimeout(silTimer);
    isRecording = false;
    recog = null;
    document.getElementById('micBtn').classList.remove('listening');
  };

  try { recog.start(); } catch { return; }
  isRecording = true;
  document.getElementById('micBtn').classList.add('listening');
}

function stopVoice() {
  try { recog?.stop(); } catch {}
  recog = null;
  isRecording = false;
  clearTimeout(silTimer);
  document.getElementById('micBtn').classList.remove('listening');
}

/*══════════════════════════════════════════════════════════════════
  TTS
══════════════════════════════════════════════════════════════════*/
function toggleTTS() {
  ttsOn = !ttsOn;
  localStorage.setItem('cia_tts', ttsOn ? 'on' : 'off');
  document.getElementById('ttsBtn').style.opacity = ttsOn ? '1' : '0.4';
  if (!ttsOn) window.speechSynthesis?.cancel();
}

function speakText(text) {
  if (!ttsOn || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/<[^>]+>/g, '').replace(/[`*#]/g, '').substring(0, 800);
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'pt-BR';
  window.speechSynthesis.speak(u);
}

/*══════════════════════════════════════════════════════════════════
  UTILS
══════════════════════════════════════════════════════════════════*/
function esc(s) {
  return String(s)
    .replace(/&amp;amp;/g,'&amp;amp;amp;').replace(/</g,'&amp;amp;lt;')
    .replace(/>/g,'&amp;amp;gt;').replace(/&amp;quot;/g,'&amp;amp;quot;');
}
function escAttr(s) { return esc(s).replace(/'/g,'&amp;amp;#39;'); }
function getCSSVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

let toastTimer;
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('err', type === 'err');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

window.addEventListener('beforeunload', () => {
  if (history.length) autoSave();
  autoSaveDraft();
});

// Inicia
boot();

                <div class=&amp;quot;stat-label&amp;quot;>Vínculos Replit</div>
            </div>
            <div class=&amp;quot;stat-card&amp;quot;>
                <div class=&amp;quot;stat-number&amp;quot; id=&amp;quot;vinculosRemovidos&amp;quot;>0</div>
                <div class=&amp;quot;stat-label&amp;quot;>Removidos</div>
            </div>
            <div class=&amp;quot;stat-card&amp;quot;>
                <div class=&amp;quot;stat-number&amp;quot; id=&amp;quot;endpointsCorrigidos&amp;quot;>0</div>
                <div class=&amp;quot;stat-label&amp;quot;>Endpoints Corrigidos</div>
            </div>
        </div>

        <div class=&amp;quot;log&amp;quot; id=&amp;quot;log&amp;quot; style=&amp;quot;display: none;&amp;quot;></div>

        <div style=&amp;quot;text-align: center;&amp;quot;>
            <button class=&amp;quot;btn&amp;quot; id=&amp;quot;btnBaixar&amp;quot; style=&amp;quot;display: none;&amp;quot; onclick=&amp;quot;baixarZipLimpo()&amp;quot;>
                📦 Baixar ZIP Limpo
            </button>
        </div>
    </div>

    <script src=&amp;quot;https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js&amp;quot;></script>
    <script>
        let arquivosLimpos = {};
        let estatisticas = {
            totalArquivos: 0,
            vinculosEncontrados: 0,
            vinculosRemovidos: 0,
            endpointsCorrigidos: 0
        };

        // ========================================
        // PADRÕES PARA DETECTAR E REMOVER
        // ========================================
        const padroes = {
            // URLs Replit
            urlsReplit: [
                /https?:\/\/[^\/]*replit\.com[^\s\&amp;quot;\'\)>]*/gi,
                /https?:\/\/[^\/]*repl\.co[^\s\&amp;quot;\'\)>]*/gi,
                /https?:\/\/[^\/]*replitusercontent\.com[^\s\&amp;quot;\'\)>]*/gi,
            ],

            // Imports Replit
            importsReplit: [
                /import\s+.*from\s+['&amp;quot;]@replit\/[^'&amp;quot;]+['&amp;quot;]/gi,
                /require\s*\(\s*['&amp;quot;]@replit\/[^'&amp;quot;]+['&amp;quot;]\s*\)/gi,
            ],

            // Endpoints API
            endpointsAPI: [
                /fetch\s*\(\s*['&amp;quot;]\/api\/[^'&amp;quot;]+['&amp;quot;]/gi,
                /axios\.[a-z]+\s*\(\s*['&amp;quot;]\/api\/[^'&amp;quot;]+['&amp;quot;]/gi,
            ],

            // Comentários com TODO/FIXME
            comentarios: [
                /\/\/\s*TODO:.*$/gmi,
                /\/\/\s*FIXME:.*$/gmi,
                /\/\*\s*TODO:[\s\S]*?\*\//gi,
            ],

            // Console.log desnecessários
            consoleLogs: [
                /console\.log\([^)]*replit[^)]*\);?/gi,
            ]
        };

        // ========================================
        // PROCESSAR ZIP
        // ========================================
        async function processarZip(event) {
            const file = event.target.files[0];
            if (!file) return;

            mostrarLog();
            log('🚀 Iniciando limpeza...', 'info');
            log('');

            const zip = new JSZip();
            const conteudo = await zip.loadAsync(file);

            arquivosLimpos = {};
            estatisticas = {
                totalArquivos: 0,
                vinculosEncontrados: 0,
                vinculosRemovidos: 0,
                endpointsCorrigidos: 0
            };

            for (const [caminho, arquivo] of Object.entries(conteudo.files)) {
                if (arquivo.dir) continue;

                estatisticas.totalArquivos++;
                
                // Ignora node_modules, .git, etc
                if (caminho.includes('node_modules/') || 
                    caminho.includes('.git/') ||
                    caminho.startsWith('.')) {
                    continue;
                }

                const conteudoOriginal = await arquivo.async('text');
                const conteudoLimpo = limparArquivo(caminho, conteudoOriginal);
                
                arquivosLimpos[caminho] = conteudoLimpo;
            }

            log('');
            log('✅ Limpeza concluída!', 'success');
            log('');
            log(`📊 Estatísticas:`, 'info');
            log(`   • Arquivos processados: ${estatisticas.totalArquivos}`);
            log(`   • Vínculos encontrados: ${estatisticas.vinculosEncontrados}`);
            log(`   • Vínculos removidos: ${estatisticas.vinculosRemovidos}`);
            log(`   • Endpoints corrigidos: ${estatisticas.endpointsCorrigidos}`);

            atualizarEstatisticas();
            document.getElementById('btnBaixar').style.display = 'inline-block';
        }

        // ========================================
        // LIMPAR ARQUIVO
        // ========================================
        function limparArquivo(caminho, conteudo) {
            let conteudoLimpo = conteudo;
            let mudancas = 0;

            log(`🔍 Analisando: ${caminho}`, 'info');

            // 1. Remover URLs Replit
            padroes.urlsReplit.forEach(padrao => {
                const matches = conteudo.match(padrao);
                if (matches) {
                    matches.forEach(match => {
                        log(`   ❌ Removendo URL: ${match}`, 'warning');
                        conteudoLimpo = conteudoLimpo.replace(match, '');
                        mudancas++;
                        estatisticas.vinculosEncontrados++;
                        estatisticas.vinculosRemovidos++;
                    });
                }
            });

            // 2. Remover Imports Replit
            padroes.importsReplit.forEach(padrao => {
                const matches = conteudo.match(padrao);
                if (matches) {
                    matches.forEach(match => {
                        log(`   ❌ Removendo import: ${match}`, 'warning');
                        conteudoLimpo = conteudoLimpo.replace(match, '// Import removido');
                        mudancas++;
                        estatisticas.vinculosEncontrados++;
                        estatisticas.vinculosRemovidos++;
                    });
                }
            });

            // 3. Corrigir Endpoints API
            padroes.endpointsAPI.forEach(padrao => {
                const matches = conteudo.match(padrao);
                if (matches) {
                    matches.forEach(match => {
                        log(`   🔧 Corrigindo endpoint: ${match}`, 'warning');
                        // Comentar o fetch
                        conteudoLimpo = conteudoLimpo.replace(
                            match, 
                            `// ${match} // ⚠️ Endpoint removido - configure seu backend`
                        );
                        mudancas++;
                        estatisticas.endpointsCorrigidos++;
                    });
                }
            });

            // 4. Remover comentários TODO/FIXME
            padroes.comentarios.forEach(padrao => {
                conteudoLimpo = conteudoLimpo.replace(padrao, '');
            });

            // 5. Remover console.log com &amp;quot;replit&amp;quot;
            padroes.consoleLogs.forEach(padrao => {
                conteudoLimpo = conteudoLimpo.replace(padrao, '');
            });

            if (mudancas > 0) {
                log(`   ✅ ${mudancas} alterações feitas`, 'success');
            } else {
                log(`   ✓ Arquivo limpo`, 'success');
            }

            return conteudoLimpo;
        }

        // ========================================
        // BAIXAR ZIP LIMPO
        // ========================================
        async function baixarZipLimpo() {
            log('');
            log('📦 Gerando ZIP limpo...', 'info');

            const zip = new JSZip();

            Object.entries(arquivosLimpos).forEach(([caminho, conteudo]) => {
                zip.file(caminho, conteudo);
            });

            // Adicionar README com instruções
            const readme = `# Projeto Limpo

✅ Este projeto foi limpo de vínculos com Replit.

## Alterações feitas:
- ${estatisticas.vinculosRemovidos} vínculos Replit removidos
- ${estatisticas.endpointsCorrigidos} endpoints comentados

## ⚠️ Próximos passos:
1. Revise os arquivos marcados com &amp;quot;⚠️&amp;quot;
2. Configure seu próprio backend se necessário
3. Teste o projeto localmente
4. Publique no GitHub Pages ou Netlify

---
Limpo por: Limpador de Replit
Data: ${new Date().toLocaleString('pt-BR')}
`;

            zip.file('README-LIMPEZA.md', readme);

            const blob = await zip.generateAsync({ type: 'blob' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'projeto-limpo.zip';
            a.click();

            log('✅ ZIP baixado com sucesso!', 'success');
        }

        // ========================================
        // FUNÇÕES AUXILIARES
        // ========================================
        function log(texto, tipo = '') {
            const logDiv = document.getElementById('log');
            const linha = document.createElement('div');
            linha.className = `log-line ${tipo}`;
            linha.textContent = texto;
            logDiv.appendChild(linha);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function mostrarLog() {
            document.getElementById('stats').style.display = 'grid';
            document.getElementById('log').style.display = 'block';
        }

        function atualizarEstatisticas() {
            document.getElementById('totalArquivos').textContent = estatisticas.totalArquivos;
            document.getElementById('vinculosEncontrados').textContent = estatisticas.vinculosEncontrados;
            document.getElementById('vinculosRemovidos').textContent = estatisticas.vinculosRemovidos;
            document.getElementById('endpointsCorrigidos').textContent = estatisticas.endpointsCorrigidos;
        }
    </script>
</body>
</html>&quot; sandbox=&quot;allow-scripts allow-same-origin allow-forms allow-modals allow-popups&quot;></iframe></div>
