// ========== STORAGE ==========
const LS_MODULOS = 'workstation-modulos-v1';
const LS_SELECTED = 'workstation-selected-v1';

function getModulos() {
  try { return JSON.parse(localStorage.getItem(LS_MODULOS) || '[]'); }
  catch { return []; }
}

function setModulos(list) {
  localStorage.setItem(LS_MODULOS, JSON.stringify(list));
  atualizarContador();
}

function getSelected() {
  try { return JSON.parse(localStorage.getItem(LS_SELECTED) || '[]'); }
  catch { return []; }
}

function setSelected(list) {
  localStorage.setItem(LS_SELECTED, JSON.stringify(list));
}

// ========== NAVEGAÇÃO ==========
function trocarAba(nome) {
  // Esconde todas
  document.querySelectorAll('.workspace').forEach(w => w.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  
  // Mostra a selecionada
  document.getElementById('ws-' + nome).classList.add('active');
  event.target.classList.add('active');
  
  // Atualiza conteúdo
  if (nome === 'montador') renderModulos();
  if (nome === 'arquivos') renderArquivos();
}

// ========== SCANNER ==========
function analisarCodigo() {
  const codigo = document.getElementById('scannerInput').value;
  if (!codigo.trim()) {
    toast('❌ Cole um código primeiro!');
    return;
  }

  const analise = {
    funcoes: extrairFuncoes(codigo),
    estilos: extrairEstilos(codigo),
    elementos: extrairElementos(codigo),
    scripts: extrairScripts(codigo)
  };

  renderAnalise(analise);
}

function extrairFuncoes(codigo) {
  const regex = /function\s+(\w+)\s*\([^)]*\)\s*\{/g;
  const funcoes = [];
  let match;
  while ((match = regex.exec(codigo)) !== null) {
    const inicio = match.index;
    const fim = encontrarFimFuncao(codigo, inicio);
    funcoes.push({
      nome: match[1],
      codigo: codigo.substring(inicio, fim)
    });
  }
  return funcoes;
}

function encontrarFimFuncao(codigo, inicio) {
  let nivel = 0;
  for (let i = inicio; i < codigo.length; i++) {
    if (codigo[i] === '{') nivel++;
    if (codigo[i] === '}') {
      nivel--;
      if (nivel === 0) return i + 1;
    }
  }
  return codigo.length;
}

function extrairEstilos(codigo) {
  const regex = /<style[^>]*>([\s\S]*?)<\/style>/gi;
  const estilos = [];
  let match;
  while ((match = regex.exec(codigo)) !== null) {
    estilos.push(match[1].trim());
  }
  return estilos;
}

function extrairElementos(codigo) {
  const regex = /<(\w+)[^>]*id=[&amp;quot;']([^&amp;quot;']+)[&amp;quot;'][^>]*>/g;
  const elementos = [];
  let match;
  while ((match = regex.exec(codigo)) !== null) {
    elementos.push({ tag: match[1], id: match[2] });
  }
  return elementos;
}

function extrairScripts(codigo) {
  const regex = /<script[^>]*>([\s\S]*?)<\/script>/gi;
  const scripts = [];
  let match;
  while ((match = regex.exec(codigo)) !== null) {
    scripts.push(match[1].trim());
  }
  return scripts;
}

function renderAnalise(analise) {
  const container = document.getElementById('scannerResults');
  
  let html = '';
  
  // Funções
  if (analise.funcoes.length > 0) {
    html += `
      <div class=&amp;quot;panel&amp;quot;>
        <div class=&amp;quot;panel-header&amp;quot;>
          <div class=&amp;quot;panel-title&amp;quot;>🔧 Funções Encontradas (${analise.funcoes.length})</div>
        </div>
        ${analise.funcoes.map((f, i) => `
          <div class=&amp;quot;file-item&amp;quot;>
            <div>
              <strong style=&amp;quot;color:var(--green);&amp;quot;>${escHtml(f.nome)}()</strong>

            </div>
            <div style=&amp;quot;display:flex;gap:4px;&amp;quot;>
              <button class=&amp;quot;btn btn-ghost btn-sm&amp;quot; onclick=&amp;quot;verCodigo(${i}, 'funcao')&amp;quot;>👁️</button>
              <button class=&amp;quot;btn btn-ghost btn-sm&amp;quot; onclick=&amp;quot;copiarParaPlayground('${escHtml(f.codigo).replace(/'/g, &amp;quot;\\'&amp;quot;)}')&amp;quot;>⚡ Playground</button>
              <button class=&amp;quot;btn btn-ghost btn-sm&amp;quot; onclick=&amp;quot;salvarComoModulo('${escHtml(f.nome)}', 'funcao', \`${f.codigo.replace(/`/g, '\\`')}\`)&amp;quot;>💾 Salvar</button>
            </div>
          </div>
        `).join('')}

  // Estilos
  if (analise.estilos.length > 0) {
    html += `
      <div class=&amp;quot;panel&amp;quot;>

            <div style=&amp;quot;display:flex;gap:4px;&amp;quot;>
              <button class=&amp;quot;btn btn-ghost btn-sm&amp;quot; onclick=&amp;quot;copiarParaPlayground(\`${css.replace(/`/g, '\\`')}\`)&amp;quot;>⚡ Playground</button>
              <button class=&amp;quot;btn btn-ghost btn-sm&amp;quot; onclick=&amp;quot;salvarComoModulo('CSS_${i + 1}', 'css', \`${css.replace(/`/g, '\\`')}\`)&amp;quot;>💾 Salvar</button>

          </div>
        `).join('')}
      </div>
    `;
  }
  
  container.innerHTML = html || '<div class=&amp;quot;status status-warning&amp;quot;>⚠️ Nenhum elemento extraível encontrado</div>';
  toast('✅ Análise concluída!');
}

function extrairTudo() {
  const codigo = document.getElementById('scannerInput').value;
  if (!codigo.trim()) {
    toast('❌ Cole um código primeiro!');
    return;
  }

  const analise = {
    funcoes: extrairFuncoes(codigo),
    estilos: extrairEstilos(codigo)
  };

  let contador = 0;
  
  analise.funcoes.forEach(f => {
    salvarComoModulo(f.nome, 'funcao', f.codigo);
    contador++;
  });
  
  analise.estilos.forEach((css, i) => {
    salvarComoModulo(`CSS_${i + 1}`, 'css', css);
    contador++;
  });

  toast(`✅ ${contador} módulos extraídos e salvos!`);
  renderModulos();
}

function copiarParaPlayground(codigo) {
  document.getElementById('playgroundCode').value = codigo;
  trocarAba('playground');
  document.querySelectorAll('.nav-tab')[2].classList.add('active');
  toast('✅ Código copiado para o Playground!');
}

function salvarComoModulo(nome, tipo, codigo) {
  const modulos = getModulos();
  modulos.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    nome,
    tipo,
    codigo,
    data: new Date().toISOString()
  });
  setModulos(modulos);
}

// ========== MONTADOR ==========
function salvarModulo() {
  const nome = document.getElementById('modNome').value.trim();
  const tipo = document.getElementById('modTipo').value;
  const codigo = document.getElementById('modCodigo').value;

  if (!nome || !codigo.trim()) {
    toast('❌ Preencha nome e código!');
    return;
  }

  salvarComoModulo(nome, tipo, codigo);
  limparModulo();
  renderModulos();
  toast('✅ Módulo salvo!');
}

function limparModulo() {
  document.getElementById('modNome').value = '';
  document.getElementById('modCodigo').value = '';
}

function renderModulos() {
  const modulos = getModulos();
  const selected = getSelected();
  const container = document.getElementById('modulosList');
  const checklist = document.getElementById('montadorChecklist');

  if (modulos.length === 0) {
    container.innerHTML = '<p style=&amp;quot;color:var(--text2);font-size:12px;text-align:center;padding:20px;&amp;quot;>Nenhum módulo salvo</p>';
    if (checklist) checklist.innerHTML = '';
    return;
  }

  // Lista de módulos
  container.innerHTML = modulos.slice(-10).reverse().map(m => `
    <div class=&amp;quot;file-item&amp;quot;>
      <div>
        <strong>${escHtml(m.nome)}</strong>
        <span class=&amp;quot;tag tag-${m.tipo}&amp;quot;>${m.tipo}</span>
      </div>
      <div style=&amp;quot;display:flex;gap:4px;&amp;quot;>
        <button class=&amp;quot;btn btn-ghost btn-sm&amp;quot; onclick=&amp;quot;editarModulo('${m.id}')&amp;quot;>✏️</button>
        <button class=&amp;quot;btn btn-danger btn-sm&amp;quot; onclick=&amp;quot;deletarModulo('${m.id}')&amp;quot;>🗑️</button>
      </div>
    </div>
  `).join('');

  // Checklist para montagem
  if (checklist) {
    checklist.innerHTML = '<div style=&amp;quot;max-height:300px;overflow-y:auto;&amp;quot;>' + modulos.map(m => `
      <label style=&amp;quot;display:flex;align-items:center;gap:8px;padding:8px;cursor:pointer;border-bottom:1px solid var(--border);&amp;quot;>
        <input type=&amp;quot;checkbox&amp;quot; ${selected.includes(m.id) ? 'checked' : ''} onchange=&amp;quot;toggleModulo('${m.id}')&amp;quot; />
        <strong style=&amp;quot;font-size:12px;&amp;quot;>${escHtml(m.nome)}</strong>
        <span class=&amp;quot;tag tag-${m.tipo}&amp;quot;>${m.tipo}</span>
      </label>
    `).join('') + '</div>';
  }
}

function toggleModulo(id) {
  let selected = getSelected();
  if (selected.includes(id)) {
    selected = selected.filter(x => x !== id);
  } else {
    selected.push(id);
  }
  setSelected(selected);
}

function selecionarTodos() {
  setSelected(getModulos().map(m => m.id));
  renderModulos();
}

function desselecionarTodos() {
  setSelected([]);
  renderModulos();
}

function deletarModulo(id) {
  if (!confirm('Deletar este módulo?')) return;
  setModulos(getModulos().filter(m => m.id !== id));
  renderModulos();
  toast('🗑️ Módulo deletado!');
}

function editarModulo(id) {
  const modulo = getModulos().find(m => m.id === id);
  if (!modulo) return;
  
  document.getElementById('modNome').value = modulo.nome;
  document.getElementById('modTipo').value = modulo.tipo;
  document.getElementById('modCodigo').value = modulo.codigo;
  
  deletarModulo(id);
  toast('✏️ Editando módulo...');
}

function gerarProjetoFinal() {
  const modulos = getModulos();
  const selected = getSelected();
  const escolhidos = modulos.filter(m => selected.includes(m.id));

  if (escolhidos.length === 0) {
    toast('❌ Selecione pelo menos um módulo!');
    return;
  }

  const nome = document.getElementById('projetoNome').value || 'Projeto';
  
  const html = escolhidos.filter(m => m.tipo === 'html').map(m => m.codigo).join('\n\n');
  const css = escolhidos.filter(m => m.tipo === 'css').map(m => m.codigo).join('\n\n');
  const js = escolhidos.filter(m => m.tipo === 'js' || m.tipo === 'funcao').map(m => m.codigo).join('\n\n');

  const projeto = `<!DOCTYPE html>
<html lang=&amp;quot;pt-BR&amp;quot;>
<head>
<meta charset=&amp;quot;UTF-8&amp;quot;>
<meta name=&amp;quot;viewport&amp;quot; content=&amp;quot;width=device-width, initial-scale=1.0&amp;quot;>
<title>${escHtml(nome)}</title>
<style>
${css}
</style>
</head>
<body>

${html}

<script>
${js}
<\/script>
</body>
</html>`;

  baixarArquivo(projeto, nome.replace(/[^a-z0-9]/gi, '_') + '.html', 'text/html');
  toast('✅ Projeto gerado!');
}

// ========== PLAYGROUND ==========
function executarPlayground() {
  const codigo = document.getElementById('playgroundCode').value;
  const iframe = document.getElementById('playgroundPreview');
  
  const blob = new Blob([codigo], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  iframe.src = url;
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  
  toast('▶️ Executando...');
}

function salvarDePlayground() {
  const codigo = document.getElementById('playgroundCode').value;
  if (!codigo.trim()) {
    toast('❌ Nada para salvar!');
    return;
  }
  
  const nome = prompt('Nome do módulo:');
  if (!nome) return;
  
  salvarComoModulo(nome, 'html', codigo);
  toast('✅ Salvo como módulo!');
}

function copiarPlayground() {
  const codigo = document.getElementById('playgroundCode').value;
  navigator.clipboard.writeText(codigo);
  toast('📋 Código copiado!');
}

function abrirPreviewNovo() {
  const codigo = document.getElementById('playgroundCode').value;
  const blob = new Blob([codigo], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
}

function limparPlayground() {
  document.getElementById('playgroundCode').value = '';
  document.getElementById('playgroundPreview').src = '';
}

// ========== ARQUIVOS ==========
function renderArquivos() {
  const modulos = getModulos();
  const container = document.getElementById('arquivosList');

  if (modulos.length === 0) {
    container.innerHTML = '<p style=&amp;quot;color:var(--text2);text-align:center;padding:40px;&amp;quot;>Nenhum arquivo salvo</p>';
    return;
  }

  container.innerHTML = modulos.map(m => `
    <div class=&amp;quot;file-item&amp;quot;>
      <div>
        <strong>${escHtml(m.nome)}</strong>
        <span class=&amp;quot;tag tag-${m.tipo}&amp;quot;>${m.tipo}</span>
        <span style=&amp;quot;font-size:10px;color:var(--text2);margin-left:8px;&amp;quot;>${new Date(m.data).toLocaleDateString('pt-BR')}</span>
      </div>
      <div style=&amp;quot;display:flex;gap:4px;&amp;quot;>
        <button class=&amp;quot;btn btn-ghost btn-sm&amp;quot; onclick=&amp;quot;copiarParaPlayground(\`${m.codigo.replace(/`/g, '\\`')}\`)&amp;quot;>⚡</button>
        <button class=&amp;quot;btn btn-ghost btn-sm&amp;quot; onclick=&amp;quot;baixarModulo('${m.id}')&amp;quot;>📥</button>
        <button class=&amp;quot;btn btn-danger btn-sm&amp;quot; onclick=&amp;quot;deletarModulo('${m.id}'); renderArquivos();&amp;quot;>🗑️</button>
      </div>
    </div>
  `).join('');
}

function filtrarArquivos(busca) {
  const modulos = getModulos().filter(m => 
    m.nome.toLowerCase().includes(busca.toLowerCase())
  );
  
  const container = document.getElementById('arquivosList');
  container.innerHTML = modulos.map(m => `
    <div class=&amp;quot;file-item&amp;quot;>
      <div>
        <strong>${escHtml(m.nome)}</strong>
        <span class=&amp;quot;tag tag-${m.tipo}&amp;quot;>${m.tipo}</span>
      </div>
      <div style=&amp;quot;display:flex;gap:4px;&amp;quot;>
        <button class=&amp;quot;btn btn-ghost btn-sm&amp;quot; onclick=&amp;quot;copiarParaPlayground(\`${m.codigo.replace(/`/g, '\\`')}\`)&amp;quot;>⚡</button>
        <button class=&amp;quot;btn btn-ghost btn-sm&amp;quot; onclick=&amp;quot;baixarModulo('${m.id}')&amp;quot;>📥</button>
      </div>
    </div>
  `).join('');
}

function baixarModulo(id) {
  const modulo = getModulos().find(m => m.id === id);
  if (!modulo) return;
  
  const ext = { html: '.html', css: '.css', js: '.js', funcao: '.js' }[modulo.tipo] || '.txt';
  baixarArquivo(modulo.codigo, modulo.nome + ext, 'text/plain');
}

function exportarTudo() {
  const data = {
    modulos: getModulos(),
    selected: getSelected(),
    data: new Date().toISOString()
  };
  
  baixarArquivo(JSON.stringify(data, null, 2), 'backup-workstation-' + new Date().toISOString().slice(0, 10) + '.json', 'application/json');
  toast('💾 Backup exportado!');
}

function importarTudo() {
  document.getElementById('backupInput').click();
}

document.getElementById('backupInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.modulos) {
        setModulos(data.modulos);
        if (data.selected) setSelected(data.selected);
        toast('✅ Backup importado!');
        renderModulos();
        renderArquivos();
      }
    } catch (err) {
      toast('❌ Arquivo inválido!');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

function limparTudo() {
  if (!confirm('⚠️ ATENÇÃO: Isso vai apagar TUDO! Tem certeza?')) return;
  if (!confirm('Última chance! Realmente deseja apagar tudo?')) return;
  
  localStorage.clear();
  toast('🗑️ Tudo limpo!');
  renderModulos();
  renderArquivos();
}

// ========== IMPORT ==========
function importarParaScanner() {
  document.getElementById('fileInput').click();
  document.getElementById('fileInput').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      document.getElementById('scannerInput').value = ev.target.result;
      toast('📂 Arquivo importado!');
    };
    reader.readAsText(file);
    e.target.value = '';
  };
}

function importarParaPlayground() {
  document.getElementById('fileInput').click();
  document.getElementById('fileInput').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      document.getElementById('playgroundCode').value = ev.target.result;
      executarPlayground();
      toast('📂 Arquivo importado!');
    };
    reader.readAsText(file);
    e.target.value = '';
  };
}

function limparScanner() {
  document.getElementById('scannerInput').value = '';
  document.getElementById('scannerResults').innerHTML = '';
}

// ========== UTILS ==========
function escHtml(s) {
  return String(s).replace(/&amp;amp;/g, '&amp;amp;amp;').replace(/</g, '&amp;amp;lt;').replace(/>/g, '&amp;amp;gt;').replace(/&amp;quot;/g, '&amp;amp;quot;');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.transform = 'translateY(0)';
  t.style.opacity = '1';
  setTimeout(() => {
    t.style.transform = 'translateY(100px)';
    t.style.opacity = '0';
  }, 2500);
}

function baixarArquivo(conteudo, nome, tipo) {
  const blob = new Blob([conteudo], { type: tipo });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nome;
  a.click();
  URL.revokeObjectURL(url);
}

function atualizarContador() {
  const count = getModulos().length;
  const el = document.getElementById('modCount');
  if (el) el.textContent = count;
}

// Init
atualizarContador();
renderModulos();

@media(max-width:768px) {
  .modules-grid { grid-template-columns:1fr; }
  .input-group { grid-template-columns:1fr; }
  .container { padding:12px; }
}

.empty-state { text-align:center; padding:40px; color:var(--text2); }
.empty-state .icon { font-size:48px; margin-bottom:12px; }

.section-title { font-size:12px; color:var(--text2); text-transform:uppercase; letter-spacing:2px; font-weight:700; margin:24px 0 12px; padding-bottom:8px; border-bottom:1px solid var(--border); }

.flex-between { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }

.checklist { list-style:none; }
.checklist li { padding:6px 0; font-size:12px; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--border); }
.checklist li:last-child { border:none; }
.check { width:18px; height:18px; border-radius:4px; border:2px solid var(--border); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:10px; transition:all 0.15s; }
.check.checked { background:var(--green); border-color:var(--green); color:#000; }
</style>
</head>
<body>

<div class=&amp;quot;header&amp;quot;>
  <h1>🧩 Montador de Módulos <small>PWA JURÍDICO — MAIKON CALDEIRA</small></h1>
  <div style=&amp;quot;display:flex;gap:6px;flex-wrap:wrap;&amp;quot;>
    <button class=&amp;quot;btn btn-primary&amp;quot; onclick=&amp;quot;exportFinal()&amp;quot;>📦 Gerar HTML Final</button>
    <button class=&amp;quot;btn btn-ghost&amp;quot; onclick=&amp;quot;exportBackup()&amp;quot;>💾 Backup Módulos</button>
    <button class=&amp;quot;btn btn-ghost&amp;quot; onclick=&amp;quot;importBackup()&amp;quot;>📂 Importar Backup</button>
  </div>
</div>

<div class=&amp;quot;container&amp;quot;>

  <!-- Instruções -->
  <div class=&amp;quot;status status-info&amp;quot;>
    💡 <strong>Como usar:</strong> Cole pedaços de código HTML nos módulos abaixo. Dê um nome e descrição para cada um. 
    Depois marque quais quer incluir e clique em &amp;quot;Gerar HTML Final&amp;quot; para combinar tudo num arquivo só.
  </div>

  <!-- Tabs -->
  <div class=&amp;quot;tabs&amp;quot;>
    <button class=&amp;quot;tab-btn active&amp;quot; onclick=&amp;quot;showSection('add')&amp;quot;>➕ Adicionar Módulo</button>
    <button class=&amp;quot;tab-btn&amp;quot; onclick=&amp;quot;showSection('modules')&amp;quot;>📦 Meus Módulos (<span id=&amp;quot;moduleCount&amp;quot;>0</span>)</button>
    <button class=&amp;quot;tab-btn&amp;quot; onclick=&amp;quot;showSection('build')&amp;quot;>🔨 Montar Projeto</button>
    <button class=&amp;quot;tab-btn&amp;quot; onclick=&amp;quot;showSection('preview')&amp;quot;>👁️ Preview</button>
    <button class=&amp;quot;tab-btn&amp;quot; onclick=&amp;quot;showSection('guide')&amp;quot;>📖 Guia</button>
  </div>

  <!-- Section: Add Module -->
  <div id=&amp;quot;section-add&amp;quot; class=&amp;quot;workspace&amp;quot;>
    <h2>➕ Adicionar Novo Módulo de Código</h2>
    
    <div class=&amp;quot;input-group&amp;quot;>
      <div class=&amp;quot;input-row&amp;quot;>
        <label>Nome do Módulo</label>
        <input type=&amp;quot;text&amp;quot; class=&amp;quot;input&amp;quot; id=&amp;quot;modName&amp;quot; placeholder=&amp;quot;Ex: Importar PDF, Exportar Word, Formulário Cliente...&amp;quot; />
      </div>
      <div class=&amp;quot;input-row&amp;quot;>
        <label>Tipo</label>
        <select class=&amp;quot;input&amp;quot; id=&amp;quot;modType&amp;quot;>
          <option value=&amp;quot;funcao&amp;quot;>🔧 Função/Lógica (JavaScript)</option>
          <option value=&amp;quot;visual&amp;quot;>🎨 Visual/Interface (HTML+CSS)</option>
          <option value=&amp;quot;completo&amp;quot;>📄 Bloco Completo (HTML+CSS+JS)</option>
          <option value=&amp;quot;estilo&amp;quot;>💅 Apenas CSS/Estilo</option>
          <option value=&amp;quot;dados&amp;quot;>📊 Dados/Templates</option>
        </select>
      </div>
    </div>
    
    <div class=&amp;quot;input-row&amp;quot;>
      <label>Descrição (o que esse código faz?)</label>
      <input type=&amp;quot;text&amp;quot; class=&amp;quot;input&amp;quot; id=&amp;quot;modDesc&amp;quot; placeholder=&amp;quot;Ex: Lê arquivo PDF e extrai nome, CPF e endereço do segurado...&amp;quot; />
    </div>
    
    <div class=&amp;quot;input-row&amp;quot;>
      <label>Tags (separadas por vírgula)</label>
      <input type=&amp;quot;text&amp;quot; class=&amp;quot;input&amp;quot; id=&amp;quot;modTags&amp;quot; placeholder=&amp;quot;Ex: pdf, importar, inss, dados&amp;quot; />
    </div>
    
    <div class=&amp;quot;input-row&amp;quot;>
      <label>Cole o Código Aqui</label>
      <textarea class=&amp;quot;code-area large&amp;quot; id=&amp;quot;modCode&amp;quot; placeholder=&amp;quot;Cole aqui o pedaço de código HTML/CSS/JS que quer salvar como módulo...&amp;quot;></textarea>
    </div>
    
    <div style=&amp;quot;display:flex;gap:8px;margin-top:12px;&amp;quot;>
      <button class=&amp;quot;btn btn-primary&amp;quot; onclick=&amp;quot;saveModule()&amp;quot;>💾 Salvar Módulo</button>
      <button class=&amp;quot;btn btn-ghost&amp;quot; onclick=&amp;quot;clearForm()&amp;quot;>🗑️ Limpar</button>
      <button class=&amp;quot;btn btn-blue&amp;quot; onclick=&amp;quot;importFromFile()&amp;quot;>📂 Importar de Arquivo</button>
    </div>
  </div>

  <!-- Section: Modules List -->
  <div id=&amp;quot;section-modules&amp;quot; class=&amp;quot;workspace&amp;quot; style=&amp;quot;display:none;&amp;quot;>
    <div class=&amp;quot;flex-between&amp;quot;>
      <h2>📦 Módulos Salvos</h2>
      <input type=&amp;quot;text&amp;quot; class=&amp;quot;input&amp;quot; style=&amp;quot;width:200px;&amp;quot; placeholder=&amp;quot;🔍 Buscar...&amp;quot; oninput=&amp;quot;filterModules(this.value)&amp;quot; />
    </div>
    <div class=&amp;quot;modules-grid&amp;quot; id=&amp;quot;modulesGrid&amp;quot;></div>
  </div>

  <!-- Section: Build -->
  <div id=&amp;quot;section-build&amp;quot; class=&amp;quot;workspace&amp;quot; style=&amp;quot;display:none;&amp;quot;>
    <h2>🔨 Montar Projeto Final</h2>
    <p style=&amp;quot;font-size:12px;color:var(--text2);margin-bottom:16px;&amp;quot;>
      Marque os módulos que deseja incluir no HTML final. A ordem importa — arraste ou use as setas para reorganizar.
    </p>
    
    <div class=&amp;quot;input-row&amp;quot;>
      <label>Título do Projeto Final</label>
      <input type=&amp;quot;text&amp;quot; class=&amp;quot;input&amp;quot; id=&amp;quot;buildTitle&amp;quot; value=&amp;quot;PWA Jurídico — Maikon Caldeira&amp;quot; />
    </div>
    
    <div class=&amp;quot;input-row&amp;quot;>
      <label>CSS Base (opcional — será incluído no &amp;amp;lt;head&amp;amp;gt;)</label>
      <textarea class=&amp;quot;code-area&amp;quot; id=&amp;quot;buildBaseCss&amp;quot; style=&amp;quot;min-height:80px;&amp;quot; placeholder=&amp;quot;/* CSS base que vai em todos os projetos */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; }&amp;quot;></textarea>
    </div>
    
    <div class=&amp;quot;section-title&amp;quot;>Selecione os Módulos para Incluir</div>
    <div id=&amp;quot;buildChecklist&amp;quot;></div>
    
    <div style=&amp;quot;margin-top:16px;display:flex;gap:8px;&amp;quot;>
      <button class=&amp;quot;btn btn-success&amp;quot; onclick=&amp;quot;exportFinal()&amp;quot;>📦 Gerar HTML Final</button>
      <button class=&amp;quot;btn btn-ghost&amp;quot; onclick=&amp;quot;selectAll()&amp;quot;>✅ Selecionar Todos</button>
      <button class=&amp;quot;btn btn-ghost&amp;quot; onclick=&amp;quot;deselectAll()&amp;quot;>⬜ Desmarcar Todos</button>
    </div>
  </div>

  <!-- Section: Preview -->
  <div id=&amp;quot;section-preview&amp;quot; class=&amp;quot;workspace&amp;quot; style=&amp;quot;display:none;&amp;quot;>
    <div class=&amp;quot;flex-between&amp;quot;>
      <h2>👁️ Preview do Projeto Montado</h2>
      <div style=&amp;quot;display:flex;gap:6px;&amp;quot;>
        <button class=&amp;quot;btn btn-ghost btn-sm&amp;quot; onclick=&amp;quot;refreshPreview()&amp;quot;>🔄 Atualizar</button>
        <button class=&amp;quot;btn btn-ghost btn-sm&amp;quot; onclick=&amp;quot;openFullPreview()&amp;quot;>🔳 Tela Cheia</button>
      </div>
    </div>
    <iframe class=&amp;quot;preview-frame&amp;quot; id=&amp;quot;previewFrame&amp;quot;></iframe>
  </div>

  <!-- Section: Guide -->
  <div id=&amp;quot;section-guide&amp;quot; class=&amp;quot;workspace&amp;quot; style=&amp;quot;display:none;&amp;quot;>
    <h2>📖 Guia — Como Montar seu PWA</h2>
    
    <div class=&amp;quot;status status-info&amp;quot; style=&amp;quot;margin-top:12px;&amp;quot;>
      🎯 <strong>Estratégia:</strong> Em vez de tentar fazer tudo de uma vez, vamos por partes. 
      Cada funcionalidade vira um &amp;quot;módulo&amp;quot; independente. Depois juntamos.
    </div>
    
    <div class=&amp;quot;section-title&amp;quot;>Passo a Passo</div>
    <ol style=&amp;quot;font-size:12px;line-height:2;padding-left:20px;color:var(--text2);&amp;quot;>
      <li><strong style=&amp;quot;color:var(--text)&amp;quot;>Separe os códigos por função</strong> — cada pedaço faz UMA coisa (importar PDF, gerar documento, salvar dados...)</li>
      <li><strong style=&amp;quot;color:var(--text)&amp;quot;>Cole cada pedaço como módulo</strong> — use a aba &amp;quot;Adicionar Módulo&amp;quot; e dê nome descritivo</li>
      <li><strong style=&amp;quot;color:var(--text)&amp;quot;>Teste individual</strong> — na aba Preview, veja se cada módulo funciona sozinho</li>
      <li><strong style=&amp;quot;color:var(--text)&amp;quot;>Monte o projeto</strong> — na aba &amp;quot;Montar&amp;quot;, selecione os módulos e gere o HTML final</li>
      <li><strong style=&amp;quot;color:var(--text)&amp;quot;>Ajuste conflitos</strong> — se algo quebrar, traga aqui que te ajudo a resolver</li>
    </ol>
    
    <div class=&amp;quot;section-title&amp;quot;>Tipos de Módulo</div>
    <table style=&amp;quot;width:100%;font-size:11px;border-collapse:collapse;&amp;quot;>
      <tr style=&amp;quot;border-bottom:1px solid var(--border);&amp;quot;>
        <td style=&amp;quot;padding:8px;color:var(--blue);&amp;quot;>🔧 Função/Lógica</td>
        <td style=&amp;quot;padding:8px;color:var(--text2);&amp;quot;>Código JavaScript puro (funções, cálculos, processamento de dados)</td>
      </tr>
      <tr style=&amp;quot;border-bottom:1px solid var(--border);&amp;quot;>
        <td style=&amp;quot;padding:8px;color:var(--green);&amp;quot;>🎨 Visual/Interface</td>
        <td style=&amp;quot;padding:8px;color:var(--text2);&amp;quot;>HTML + CSS (botões, formulários, layout, cards)</td>
      </tr>
      <tr style=&amp;quot;border-bottom:1px solid var(--border);&amp;quot;>
        <td style=&amp;quot;padding:8px;color:var(--accent);&amp;quot;>📄 Bloco Completo</td>
        <td style=&amp;quot;padding:8px;color:var(--text2);&amp;quot;>HTML + CSS + JS juntos (componente inteiro que funciona sozinho)</td>
      </tr>
      <tr style=&amp;quot;border-bottom:1px solid var(--border);&amp;quot;>
        <td style=&amp;quot;padding:8px;color:#c084fc;&amp;quot;>💅 Apenas CSS</td>
        <td style=&amp;quot;padding:8px;color:var(--text2);&amp;quot;>Estilos visuais (tema, cores, fontes, animações)</td>
      </tr>
      <tr>
        <td style=&amp;quot;padding:8px;color:var(--red);&amp;quot;>📊 Dados/Templates</td>
        <td style=&amp;quot;padding:8px;color:var(--text2);&amp;quot;>Modelos de documentos, arrays de dados, configurações</td>
      </tr>
    </table>
    
    <div class=&amp;quot;section-title&amp;quot;>Sobre o Banco de Dados (Neon)</div>
    <div style=&amp;quot;font-size:12px;color:var(--text2);line-height:1.8;&amp;quot;>
      <p>⚠️ <strong style=&amp;quot;color:var(--text)&amp;quot;>Importante:</strong> Um HTML puro no navegador <strong>NÃO consegue</strong> conectar direto no Neon (PostgreSQL). Precisa de um &amp;quot;servidor&amp;quot; no meio.</p>
      <p style=&amp;quot;margin-top:8px;&amp;quot;>🟢 <strong style=&amp;quot;color:var(--green)&amp;quot;>Alternativa que funciona sem servidor:</strong></p>
      <ul style=&amp;quot;padding-left:16px;margin-top:4px;&amp;quot;>
        <li><strong>localStorage</strong> — salva no navegador (o que estamos usando aqui)</li>
        <li><strong>IndexedDB</strong> — banco mais robusto no navegador (suporta mais dados)</li>
        <li><strong>Exportar/Importar JSON</strong> — backup manual dos dados</li>
      </ul>
      <p style=&amp;quot;margin-top:8px;&amp;quot;>🔵 <strong style=&amp;quot;color:var(--blue)&amp;quot;>Se quiser Neon no futuro:</strong> Precisará de um backend (Vercel Functions, Cloudflare Workers, ou Supabase que já dá tudo pronto).</p>
    </div>
  </div>

</div>

<!-- Hidden -->
<input type=&amp;quot;file&amp;quot; id=&amp;quot;fileInput&amp;quot; style=&amp;quot;display:none&amp;quot; accept=&amp;quot;.html,.htm,.js,.css,.txt,.json&amp;quot; />
<input type=&amp;quot;file&amp;quot; id=&amp;quot;backupInput&amp;quot; style=&amp;quot;display:none&amp;quot; accept=&amp;quot;.json&amp;quot; />

<!-- Toast -->
<div class=&amp;quot;toast&amp;quot; id=&amp;quot;toast&amp;quot; style=&amp;quot;position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--accent);border-radius:10px;padding:12px 20px;font-size:12px;font-weight:600;color:var(--accent2);z-index:2000;transform:translateY(100px);opacity:0;transition:all 0.3s;&amp;quot;></div>

<script>
// ========== STATE ==========
const LS_MODULES = 'pwa-modules-v1';
const LS_SELECTED = 'pwa-selected-v1';

function getModules() {
  try { return JSON.parse(localStorage.getItem(LS_MODULES) || '[]'); } catch { return []; }
}
function setModules(list) { localStorage.setItem(LS_MODULES, JSON.stringify(list)); }
function getSelected() {
  try { return JSON.parse(localStorage.getItem(LS_SELECTED) || '[]'); } catch { return []; }
}
function setSelected(list) { localStorage.setItem(LS_SELECTED, JSON.stringify(list)); }

// ========== UI ==========
function showSection(name) {
  ['add','modules','build','preview','guide'].forEach(s => {
    document.getElementById('section-' + s).style.display = s === name ? 'block' : 'none';
  });
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    const sections = ['add','modules','build','preview','guide'];
    btn.classList.toggle('active', sections[i] === name);
  });
  if (name === 'modules') renderModules();
  if (name === 'build') renderBuildChecklist();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.transform = 'translateY(0)';
  t.style.opacity = '1';
  setTimeout(() => { t.style.transform = 'translateY(100px)'; t.style.opacity = '0'; }, 2500);
}

// ========== MODULES ==========
function saveModule() {
  const name = document.getElementById('modName').value.trim();
  const type = document.getElementById('modType').value;
  const desc = document.getElementById('modDesc').value.trim();
  const tags = document.getElementById('modTags').value.split(',').map(t => t.trim()).filter(Boolean);
  const code = document.getElementById('modCode').value;
  
  if (!name) { showToast('❌ Dê um nome ao módulo!'); return; }
  if (!code.trim()) { showToast('❌ Cole algum código!'); return; }
  
  const modules = getModules();
  modules.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    name, type, desc, tags, code,
    date: new Date().toISOString()
  });
  setModules(modules);
  updateCount();
  clearForm();
  showToast('✅ Módulo &amp;quot;' + name + '&amp;quot; salvo!');
}

function clearForm() {
  document.getElementById('modName').value = '';
  document.getElementById('modDesc').value = '';
  document.getElementById('modTags').value = '';
  document.getElementById('modCode').value = '';
}

function renderModules(filter = '') {
  const modules = getModules().filter(m => 
    !filter || m.name.toLowerCase().includes(filter.toLowerCase()) || m.tags.some(t => t.toLowerCase().includes(filter.toLowerCase()))
  );
  const grid = document.getElementById('modulesGrid');
  
  if (modules.length === 0) {
    grid.innerHTML = '<div class=&amp;quot;empty-state&amp;quot;><div class=&amp;quot;icon&amp;quot;>📭</div><p>Nenhum módulo salvo ainda.<br>Use a aba &amp;quot;Adicionar Módulo&amp;quot; para começar!</p></div>';
    return;
  }
  
  grid.innerHTML = modules.map(m => `
    <div class=&amp;quot;module-card&amp;quot;>
      <div class=&amp;quot;card-header&amp;quot;>
        <h3>${escHtml(m.name)}</h3>
        <span class=&amp;quot;tag ${m.type === 'visual' ? 'visual' : m.type === 'funcao' ? 'logica' : ''}&amp;quot;>${getTypeLabel(m.type)}</span>
      </div>
      ${m.desc ? `<div class=&amp;quot;desc&amp;quot;>${escHtml(m.desc)}</div>` : ''}
      <div class=&amp;quot;tags&amp;quot;>${m.tags.map(t => `<span class=&amp;quot;tag&amp;quot;>${escHtml(t)}</span>`).join('')}</div>
      <pre>${escHtml(m.code.slice(0, 200))}${m.code.length > 200 ? '...' : ''}</pre>
      <div class=&amp;quot;card-actions&amp;quot;>
        <button class=&amp;quot;btn btn-ghost btn-sm&amp;quot; onclick=&amp;quot;viewModule('${m.id}')&amp;quot;>👁️ Ver</button>
        <button class=&amp;quot;btn btn-ghost btn-sm&amp;quot; onclick=&amp;quot;editModule('${m.id}')&amp;quot;>✏️ Editar</button>
        <button class=&amp;quot;btn btn-ghost btn-sm&amp;quot; onclick=&amp;quot;copyModule('${m.id}')&amp;quot;>📋 Copiar</button>
        <button class=&amp;quot;btn btn-danger btn-sm&amp;quot; onclick=&amp;quot;deleteModule('${m.id}')&amp;quot;>🗑️</button>
      </div>
    </div>
  `).join('');
}

function filterModules(query) { renderModules(query); }

function deleteModule(id) {
  if (!confirm('Excluir este módulo?')) return;
  setModules(getModules().filter(m => m.id !== id));
  renderModules();
  updateCount();
  showToast('🗑️ Módulo excluído!');
}

function copyModule(id) {
  const m = getModules().find(x => x.id === id);
  if (m) { navigator.clipboard.writeText(m.code); showToast('📋 Código copiado!'); }
}

function viewModule(id) {
  const m = getModules().find(x => x.id === id);
  if (!m) return;
  document.getElementById('modName').value = m.name;
  document.getElementById('modType').value = m.type;
  document.getElementById('modDesc').value = m.desc;
  document.getElementById('modTags').value = m.tags.join(', ');
  document.getElementById('modCode').value = m.code;
  showSection('add');
}

function editModule(id) {
  const m = getModules().find(x => x.id === id);
  if (!m) return;
  // Remove old and let user save as new
  setModules(getModules().filter(x => x.id !== id));
  viewModule(id); // This won't find it anymore, so we set manually
  document.getElementById('modName').value = m.name;
  document.getElementById('modType').value = m.type;
  document.getElementById('modDesc').value = m.desc;
  document.getElementById('modTags').value = m.tags.join(', ');
  document.getElementById('modCode').value = m.code;
  showSection('add');
  updateCount();
  showToast('✏️ Editando módulo — salve quando terminar!');
}

// ========== BUILD ==========
function renderBuildChecklist() {
  const modules = getModules();
  const selected = getSelected();
  const container = document.getElementById('buildChecklist');
  
  if (modules.length === 0) {
    container.innerHTML = '<p style=&amp;quot;color:var(--text2);font-size:12px;&amp;quot;>Nenhum módulo disponível. Adicione módulos primeiro.</p>';
    return;
  }
  
  container.innerHTML = '<ul class=&amp;quot;checklist&amp;quot;>' + modules.map((m, i) => `
    <li>
      <div class=&amp;quot;check ${selected.includes(m.id)?'checked':''}&amp;quot; onclick=&amp;quot;toggleSelect('${m.id}')&amp;quot;>
        ${selected.includes(m.id) ? '✓' : ''}
      </div>
      <div style=&amp;quot;flex:1;&amp;quot;>
        <strong style=&amp;quot;font-size:12px;&amp;quot;>${escHtml(m.name)}</strong>
        <span style=&amp;quot;font-size:10px;color:var(--text2);margin-left:8px;&amp;quot;>${getTypeLabel(m.type)}</span>
        ${m.desc ? `<br><span style=&amp;quot;font-size:10px;color:var(--text2);&amp;quot;>${escHtml(m.desc)}</span>` : ''}
      </div>
      <div style=&amp;quot;display:flex;gap:4px;&amp;quot;>
        <button class=&amp;quot;btn btn-ghost btn-sm&amp;quot; onclick=&amp;quot;moveModule(${i},-1)&amp;quot;>⬆️</button>
        <button class=&amp;quot;btn btn-ghost btn-sm&amp;quot; onclick=&amp;quot;moveModule(${i},1)&amp;quot;>⬇️</button>
      </div>
    </li>
  `).join('') + '</ul>';
}

function toggleSelect(id) {
  let selected = getSelected();
  if (selected.includes(id)) selected = selected.filter(x => x !== id);
  else selected.push(id);
  setSelected(selected);
  renderBuildChecklist();
}

function selectAll() {
  setSelected(getModules().map(m => m.id));
  renderBuildChecklist();
}

function deselectAll() {
  setSelected([]);
  renderBuildChecklist();
}

function moveModule(index, dir) {
  const modules = getModules();
  const newIndex = index + dir;
  if (newIndex < 0 || newIndex >= modules.length) return;
  [modules[index], modules[newIndex]] = [modules[newIndex], modules[index]];
  setModules(modules);
  renderBuildChecklist();
}

// ========== EXPORT ==========
function exportFinal() {
  const modules = getModules();
  const selected = getSelected();
  const chosen = modules.filter(m => selected.includes(m.id));
  
  if (chosen.length === 0) {
    showToast('⚠️ Selecione pelo menos um módulo na aba &amp;quot;Montar&amp;quot;!');
    showSection('build');
    return;
  }
  
  const title = document.getElementById('buildTitle').value || 'PWA Jurídico';
  const baseCss = document.getElementById('buildBaseCss').value || '';
  
  // Separate by type
  const styles = chosen.filter(m => m.type === 'estilo').map(m => m.code).join('\n\n');
  const htmlParts = chosen.filter(m => m.type === 'visual' || m.type === 'completo' || m.type === 'dados').map(m => `\n<!-- === MÓDULO: ${m.name} === -->\n${m.code}`).join('\n');
  const scripts = chosen.filter(m => m.type === 'funcao').map(m => `\n// === MÓDULO: ${m.name} ===\n${m.code}`).join('\n');
  
  // Check if any module is a complete document
  const completeDoc = chosen.find(m => m.code.trim().toLowerCase().includes('<!doctype') || m.code.trim().toLowerCase().includes('<html'));
  
  let finalHtml;
  if (completeDoc &amp;amp;&amp;amp; chosen.length === 1) {
    finalHtml = completeDoc.code;
  } else {
    finalHtml = `<!DOCTYPE html>
<html lang=&amp;quot;pt-BR&amp;quot;>
<head>
<meta charset=&amp;quot;UTF-8&amp;quot;>
<meta name=&amp;quot;viewport&amp;quot; content=&amp;quot;width=device-width, initial-scale=1.0&amp;quot;>
<title>${escHtml(title)}</title>
<style>
/* === CSS BASE === */
${baseCss}

/* === MÓDULOS CSS === */
${styles}
</style>
</head>
<body>

${htmlParts}

<script>
${scripts}
<\/script>
</body>
</html>`;
  }
  
  // Download
  const blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (title.replace(/[^a-zA-Z0-9]/g, '_') || 'projeto') + '.html';
  a.click();
  URL.revokeObjectURL(url);
  showToast('📦 HTML final gerado e baixado!');
}

function refreshPreview() {
  const modules = getModules();
  const selected = getSelected();
  const chosen = modules.filter(m => selected.includes(m.id));
  
  const title = document.getElementById('buildTitle').value || 'PWA Jurídico';
  const baseCss = document.getElementById('buildBaseCss').value || '';
  const styles = chosen.filter(m => m.type === 'estilo').map(m => m.code).join('\n');
  const htmlParts = chosen.filter(m => m.type === 'visual' || m.type === 'completo' || m.type === 'dados').map(m => m.code).join('\n');
  const scripts = chosen.filter(m => m.type === 'funcao').map(m => m.code).join('\n');
  
  const doc = `<!DOCTYPE html><html><head><meta charset=&amp;quot;UTF-8&amp;quot;><style>${baseCss}\n${styles}</style></head><body>${htmlParts}<script>${scripts}<\/script></body></html>`;
  
  const blob = new Blob([doc], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  document.getElementById('previewFrame').src = url;
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function openFullPreview() {
  refreshPreview();
  const frame = document.getElementById('previewFrame');
  if (frame.src) window.open(frame.src, '_blank');
}

// ========== BACKUP ==========
function exportBackup() {
  const data = { modules: getModules(), selected: getSelected(), date: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'pwa-modulos-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('💾 Backup exportado!');
}

function importBackup() {
  document.getElementById('backupInput').click();
}

document.getElementById('backupInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.modules) {
        const existing = getModules();
        const merged = [...existing, ...data.modules.filter(m => !existing.find(e => e.id === m.id))];
        setModules(merged);
        if (data.selected) setSelected(data.selected);
        updateCount();
        showToast('📂 Backup importado! ' + data.modules.length + ' módulos.');
      }
    } catch(err) {
      showToast('❌ Arquivo inválido!');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// Import code from file
function importFromFile() {
  document.getElementById('fileInput').click();
}

document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    document.getElementById('modCode').value = ev.target.result;
    if (!document.getElementById('modName').value) {
      document.getElementById('modName').value = file.name.replace(/\.[^.]+$/, '');
    }
    showToast('📂 Código do arquivo carregado!');
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ========== UTILS ==========
function escHtml(s) { return String(s).replace(/&amp;amp;/g,'&amp;amp;amp;').replace(/</g,'&amp;amp;lt;').replace(/>/g,'&amp;amp;gt;').replace(/&amp;quot;/g,'&amp;amp;quot;'); }
function getTypeLabel(type) {
  const labels = { funcao:'🔧 Função', visual:'🎨 Visual', completo:'📄 Completo', estilo:'💅 CSS', dados:'📊 Dados' };
  return labels[type] || type;
}
function updateCount() {
  document.getElementById('moduleCount').textContent = getModules().length;
}

// Init
updateCount();
</script>
</body>

<div class=&amp;quot;toast&amp;quot; id=&amp;quot;toast&amp;quot;></div>

<script>
// ========== STATE ==========
const LS_KEY = 'playground-projects-v3';
const AUTOSAVE_KEY = 'playground-autosave-v3';
const SETTINGS_KEY = 'playground-ai-settings-v3';

let state = {
  mode: 'html',
  activeTab: 'html',
  html: `<div style=&amp;quot;max-width:600px;margin:40px auto;padding:20px;font-family:sans-serif;&amp;quot;>
  <h1 style=&amp;quot;color:#333;&amp;quot;>Bem-vindo ao Playground Pro</h1>
  <p style=&amp;quot;color:#666;margin:16px 0;&amp;quot;>Cole seu código HTML aqui!</p>
  <button onclick=&amp;quot;alert('Funcionou!')&amp;quot; style=&amp;quot;padding:10px 24px;font-size:16px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;&amp;quot;>Clique</button>
</div>`,
  css: '',
  js: `console.log(&amp;quot;Hello from Playground Pro!&amp;quot;);`,
  jsx: `function App() {\n  const [count, setCount] = React.useState(0);\n  return (\n    <div style={{padding:40,textAlign:'center'}}>\n      <h1>⚛️ React</h1>\n      <p>Contador: {count}</p>\n      <button onClick={() => setCount(count + 1)}>+</button>\n    </div>\n  );\n}`,
  python: `print(&amp;quot;Hello from Python!&amp;quot;)`,
  title: 'Sem titulo',
  editorState: 'normal',
  currentLine: 1
};

let aiSettings = {
  provider: 'openai',
  apiKey: '',
  enableWebSearch: false,
  enableTTS: false
};

// Load saved data
try {
  const saved = localStorage.getItem(AUTOSAVE_KEY);
  if (saved) Object.assign(state, JSON.parse(saved));
  
  const savedSettings = localStorage.getItem(SETTINGS_KEY);
  if (savedSettings) Object.assign(aiSettings, JSON.parse(savedSettings));
} catch(e) {}

// ========== DOM REFS ==========
const editor = document.getElementById('editor');
const previewFrame = document.getElementById('previewFrame');
const lineNumbers = document.getElementById('lineNumbers');
const titleInput = document.getElementById('projectTitle');
const editorPanel = document.getElementById('editorPanel');
const previewPanel = document.getElementById('previewPanel');
const fileInput = document.getElementById('fileInput');

// ========== INIT ==========
titleInput.value = state.title;
updateTabs();
loadEditorContent();
updatePreview();
updateAIButton();

// ========== EDITOR EVENTS ==========
editor.addEventListener('input', () => {
  saveCurrentTab();
  updateLineNumbers();
  updateCursorPosition();
  autoSave();
  debouncePreview();
});

editor.addEventListener('scroll', () => {
  lineNumbers.scrollTop = editor.scrollTop;
});

editor.addEventListener('click', updateCursorPosition);
editor.addEventListener('keyup', updateCursorPosition);

editor.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = start + 2;
    saveCurrentTab();
  }
  
  if ((e.ctrlKey || e.metaKey) &amp;amp;&amp;amp; e.key === 'g') {
    e.preventDefault();
    openGotoLine();
  }
  
  if ((e.ctrlKey || e.metaKey) &amp;amp;&amp;amp; e.key === 's') {
    e.preventDefault();
    saveToLocal();
  }
});

titleInput.addEventListener('input', () => {
  state.title = titleInput.value;
  autoSave();
});

// ========== LINE NUMBERS ==========
function updateLineNumbers() {
  const lines = editor.value.split('\n');
  const totalLines = lines.length;
  document.getElementById('lineCount').textContent = totalLines + ' linhas';
  
  lineNumbers.innerHTML = lines.map((_, i) => {
    const lineNum = i + 1;
    const isCurrent = lineNum === state.currentLine;
    return `<div class=&amp;quot;line ${isCurrent ? 'current' : ''}&amp;quot; onclick=&amp;quot;jumpToLine(${lineNum})&amp;quot;>${lineNum}</div>`;
  }).join('');
}

function updateCursorPosition() {
  const pos = editor.selectionStart;
  const textBefore = editor.value.substring(0, pos);
  const lines = textBefore.split('\n');
  const line = lines.length;
  const col = lines[lines.length - 1].length + 1;
  
  state.currentLine = line;
  document.getElementById('cursorPos').textContent = `Ln ${line}, Col ${col}`;
  updateLineNumbers();
}

function jumpToLine(lineNum) {
  const lines = editor.value.split('\n');
  let pos = 0;
  for (let i = 0; i < lineNum - 1 &amp;amp;&amp;amp; i < lines.length; i++) {
    pos += lines[i].length + 1;
  }
  editor.focus();
  editor.setSelectionRange(pos, pos);
  updateCursorPosition();
}

function openGotoLine() {
  document.getElementById('gotoModal').classList.add('open');
  setTimeout(() => {
    const input = document.getElementById('gotoLineInput');
    input.value = '';
    input.max = editor.value.split('\n').length;
    input.focus();
  }, 100);
}

function closeGotoLine() {
  document.getElementById('gotoModal').classList.remove('open');
}

function gotoLine() {
  const lineNum = parseInt(document.getElementById('gotoLineInput').value);
  if (lineNum &amp;amp;&amp;amp; lineNum > 0) {
    jumpToLine(lineNum);
    closeGotoLine();
    showToast(`📍 Linha ${lineNum}`);
  }
}

// ========== TABS &amp;amp; MODES ==========
function saveCurrentTab() {
  const tab = state.activeTab;
  if (state.mode === 'react' &amp;amp;&amp;amp; tab === 'jsx') state.jsx = editor.value;
  else if (state.mode === 'python' &amp;amp;&amp;amp; tab === 'python') state.python = editor.value;
  else if (tab === 'html') state.html = editor.value;
  else if (tab === 'css') state.css = editor.value;
  else if (tab === 'js') state.js = editor.value;
}

function loadEditorContent() {
  const tab = state.activeTab;
  if (state.mode === 'react' &amp;amp;&amp;amp; tab === 'jsx') editor.value = state.jsx;
  else if (state.mode === 'python' &amp;amp;&amp;amp; tab === 'python') editor.value = state.python;
  else if (tab === 'html') editor.value = state.html;
  else if (tab === 'css') editor.value = state.css;
  else if (tab === 'js') editor.value = state.js;
  else editor.value = '';
  updateLineNumbers();
  updateCursorPosition();
}

function switchTab(tab) {
  saveCurrentTab();
  state.activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const tabEl = document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1));
  if (tabEl) tabEl.classList.add('active');
  loadEditorContent();
}

function updateTabs() {
  const container = document.getElementById('tabsContainer');
  const badge = document.getElementById('modeBadge');
  
  if (state.mode === 'html') {
    container.innerHTML = `
      <button class=&amp;quot;tab ${state.activeTab==='html'?'active':''}&amp;quot; id=&amp;quot;tabHtml&amp;quot; onclick=&amp;quot;switchTab('html')&amp;quot;>📄 HTML</button>
      <button class=&amp;quot;tab ${state.activeTab==='css'?'active':''}&amp;quot; id=&amp;quot;tabCss&amp;quot; onclick=&amp;quot;switchTab('css')&amp;quot;>🎨 CSS</button>
      <button class=&amp;quot;tab ${state.activeTab==='js'?'active':''}&amp;quot; id=&amp;quot;tabJs&amp;quot; onclick=&amp;quot;switchTab('js')&amp;quot;>⚙️ JS</button>
    `;
    badge.className = 'status-badge html';
    badge.textContent = 'HTML';
  } else if (state.mode === 'react') {
    container.innerHTML = `
      <button class=&amp;quot;tab ${state.activeTab==='jsx'?'active':''}&amp;quot; id=&amp;quot;tabJsx&amp;quot; onclick=&amp;quot;switchTab('jsx')&amp;quot;>⚛️ JSX</button>
      <button class=&amp;quot;tab ${state.activeTab==='css'?'active':''}&amp;quot; id=&amp;quot;tabCss&amp;quot; onclick=&amp;quot;switchTab('css')&amp;quot;>🎨 CSS</button>
    `;
    badge.className = 'status-badge react';
    badge.textContent = 'REACT';
  } else if (state.mode === 'python') {
    container.innerHTML = `<button class=&amp;quot;tab active&amp;quot; id=&amp;quot;tabPython&amp;quot; onclick=&amp;quot;switchTab('python')&amp;quot;>🐍 Python</button>`;
    badge.className = 'status-badge python';
    badge.textContent = 'PYTHON';
  }
}

function switchMode(mode) {
  saveCurrentTab();
  state.mode = mode;
  
  document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
  document.getElementById('mode' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');
  
  if (mode === 'html') state.activeTab = 'html';
  else if (mode === 'react') state.activeTab = 'jsx';
  else if (mode === 'python') state.activeTab = 'python';
  
  updateTabs();
  loadEditorContent();
  updatePreview();
  autoSave();
}

// ========== PREVIEW ==========
let previewTimer = null;
function debouncePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(updatePreview, 400);
}

function buildDocument() {
  if (state.mode === 'react') {
    return `<!DOCTYPE html>
<html><head><meta charset=&amp;quot;UTF-8&amp;quot;>
<script crossorigin src=&amp;quot;https://unpkg.com/react@18/umd/react.development.js&amp;quot;><\/script>
<script crossorigin src=&amp;quot;https://unpkg.com/react-dom@18/umd/react-dom.development.js&amp;quot;><\/script>
<script src=&amp;quot;https://unpkg.com/@babel/standalone/babel.min.js&amp;quot;><\/script>
<style>*{box-sizing:border-box;}body{margin:0;font-family:sans-serif;}${state.css}</style>
</head><body><div id=&amp;quot;root&amp;quot;></div>
<script type=&amp;quot;text/babel&amp;quot;>
const { useState, useEffect, useRef } = React;
${state.jsx}
try {
  const _root = ReactDOM.createRoot(document.getElementById('root'));
  _root.render(<App />);
} catch(e) {
  document.getElementById('root').innerHTML = '<div style=&amp;quot;color:red;padding:20px&amp;quot;>Erro: '+e.message+'</div>';
}
<\/script></body></html>`;
  }
  
  if (state.mode === 'python') {
    const escapedCode = state.python.replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/<\/script>/g,'<\\/script>');
    return `<!DOCTYPE html>
<html><head><meta charset=&amp;quot;UTF-8&amp;quot;>
<style>body{margin:0;background:#0f172a;color:#e2e8f0;font-family:monospace;padding:20px;}#output{white-space:pre-wrap;}</style>
</head><body>
<div id=&amp;quot;output&amp;quot;>⟳ Carregando Python...</div>
<script src=&amp;quot;https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js&amp;quot;><\/script>
<script>
async function main() {
  const out = document.getElementById('output');
  try {
    const pyodide = await loadPyodide();
    out.innerHTML = '';
    pyodide.runPython('import sys; from io import StringIO; sys.stdout = StringIO()');
    pyodide.runPython(\`${escapedCode}\`);
    const stdout = pyodide.runPython('sys.stdout.getvalue()');
    out.textContent = stdout || '(sem output)';
  } catch(e) {
    out.innerHTML = '<span style=&amp;quot;color:#f87171&amp;quot;>Erro: ' + e.message + '</span>';
  }
}
main();
<\/script></body></html>`;
  }
  
  const lower = state.html.trim().toLowerCase();
  const isComplete = lower.includes('<!doctype') || (lower.includes('<html') &amp;amp;&amp;amp; lower.includes('</html>'));
  
  if (isComplete) return state.html;
  
  return `<!DOCTYPE html>
<html><head><meta charset=&amp;quot;UTF-8&amp;quot;>
<style>${state.css}</style>
</head><body>
${state.html}
<script>${state.js}<\/script>
</body></html>`;
}

function updatePreview() {
  const doc = buildDocument();
  const blob = new Blob([doc], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  previewFrame.src = url;
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function autoSave() {
  try {
    localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(state));
  } catch(e) {}
}

// ========== FILE OPERATIONS ==========
function copyCode() {
  const doc = buildDocument();
  navigator.clipboard.writeText(doc).then(() => showToast('📋 Copiado!'));
}

function downloadFile() {
  let content, ext, mime;
  if (state.mode === 'python') { content = state.python; ext = 'py'; mime = 'text/plain'; }
  else if (state.mode === 'react') { content = state.jsx; ext = 'jsx'; mime = 'text/plain'; }
  else { content = buildDocument(); ext = 'html'; mime = 'text/html'; }
  
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (state.title || 'playground') + '.' + ext;
  a.click();
  URL.revokeObjectURL(url);
  showToast('⬇️ Baixado!');
}

function toggleFullscreen() {
  const doc = buildDocument();
  const blob = new Blob([doc], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function importFile() {
  fileInput.click();
}

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const content = ev.target.result;
    const ext = file.name.split('.').pop().toLowerCase();
    const name = file.name.replace(/\.[^.]+$/, '');
    
    if (ext === 'py') {
      switchMode('python');
      state.python = content;
    } else if (ext === 'jsx' || ext === 'tsx') {
      switchMode('react');
      state.jsx = content;
    } else if (ext === 'css') {
      state.css = content;
      if (state.mode === 'html') switchTab('css');
    } else if (ext === 'js') {
      state.js = content;
      if (state.mode === 'html') switchTab('js');
    } else {
      const lower = content.trim().toLowerCase();
      if (lower.includes('<!doctype') || lower.includes('<html')) {
        const htmlMatch = content.match(/<body[^>]*>([\s\S]*)<\/body>/i);
        const cssMatch = content.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
        const jsMatch = content.match(/<script[^>]*>([\s\S]*?)<\/script>/i);
        
        state.html = htmlMatch ? htmlMatch[1].trim() : content;
        state.css = cssMatch ? cssMatch[1].trim() : '';
        state.js = jsMatch ? jsMatch[1].trim() : '';
      } else {
        state.html = content;
      }
      switchMode('html');
    }
    
    state.title = name;
    titleInput.value = name;
    loadEditorContent();
    updatePreview();
    autoSave();
    showToast('📂 Importado!');
  };
  reader.readAsText(file);
  fileInput.value = '';
});

function toggleEditor() {
  if (state.editorState === 'normal') {
    state.editorState = 'expanded';
    editorPanel.classList.add('expanded');
    previewPanel.classList.add('hidden');
    document.getElementById('btnToggleEditor').textContent = '◧';
  } else if (state.editorState === 'expanded') {
    state.editorState = 'collapsed';
    editorPanel.classList.remove('expanded');
    editorPanel.classList.add('collapsed');
    previewPanel.classList.remove('hidden');
    document.getElementById('btnToggleEditor').textContent = '◨';
  } else {
    state.editorState = 'normal';
    editorPanel.classList.remove('collapsed', 'expanded');
    previewPanel.classList.remove('hidden');
    document.getElementById('btnToggleEditor').textContent = '⬜';
  }
}

function clearCode() {
  if (!confirm('Limpar código?')) return;
  if (state.mode === 'react') state.jsx = '';
  else if (state.mode === 'python') state.python = '';
  else { state.html = ''; state.css = ''; state.js = ''; }
  loadEditorContent();
  updatePreview();
  autoSave();
  showToast('🗑️ Limpo!');
}

function resetCode() {
  if (!confirm('Resetar?')) return;
  if (state.mode === 'react') {
    state.jsx = `function App() {\n  return <div>React App</div>;\n}`;
  } else if (state.mode === 'python') {
    state.python = `print(&amp;quot;Hello Python!&amp;quot;)`;
  } else {
    state.html = `<h1>Hello World</h1>`;
    state.css = '';

  loadEditorContent();
  updatePreview();
  autoSave();
  showToast('🔄 Resetado!');

// ========== PROJECT MANAGEMENT ==========
function getProjects() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); }
  catch { return []; }
}

function setProjects(list) {
  localStorage.setItem(LS_KEY, JSON.stringify(list));
}

function saveToLocal() {
  const projects = getProjects();
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const item = {
    id,
    title: state.title || 'Sem titulo',
    mode: state.mode,
    html: state.html,
    css: state.css,
    js: state.js,
    jsx: state.jsx,
    python: state.python,
    date: new Date().toISOString()
  };
  projects.unshift(item);
  setProjects(projects);
  showToast('💾 Salvo!');
}

function openSavedModal() {
  document.getElementById('savedModal').classList.add('open');
  renderSavedList();
}

function closeSavedModal() {
  document.getElementById('savedModal').classList.remove('open');
}

function renderSavedList() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const projects = getProjects().filter(s => s.title.toLowerCase().includes(query));
  const container = document.getElementById('savedList');
  
  if (projects.length === 0) {
    container.innerHTML = '<p style=&amp;quot;text-align:center;color:var(--text2);padding:20px;&amp;quot;>Nenhum projeto.</p>';
    return;
  }
  
  container.innerHTML = projects.map(s => `
    <div class=&amp;quot;snippet-item&amp;quot; onclick=&amp;quot;loadProject('${s.id}')&amp;quot;>
      <div>
        <div class=&amp;quot;name&amp;quot;>${escapeHtml(s.title)}</div>
        <div class=&amp;quot;meta&amp;quot;>${s.mode || 'html'} • ${new Date(s.date).toLocaleDateString('pt-BR')}</div>
      </div>
      <div class=&amp;quot;snippet-actions&amp;quot;>
        <button class=&amp;quot;btn-icon&amp;quot; onclick=&amp;quot;event.stopPropagation();renameProject('${s.id}')&amp;quot;>✏️</button>
        <button class=&amp;quot;btn-icon&amp;quot; onclick=&amp;quot;event.stopPropagation();deleteProject('${s.id}')&amp;quot;>🗑️</button>
      </div>
    </div>
  `).join('');
}

function loadProject(id) {
  const p = getProjects().find(x => x.id === id);
  if (!p) return;
  
  Object.assign(state, {
    title: p.title,
    mode: p.mode || 'html',
    html: p.html || '',
    css: p.css || '',
    js: p.js || '',
    jsx: p.jsx || '',
    python: p.python || ''
  });
  
  titleInput.value = state.title;
  switchMode(state.mode);
  closeSavedModal();
  showToast('📂 Carregado!');
}

function deleteProject(id) {
  if (!confirm('Excluir?')) return;
  setProjects(getProjects().filter(s => s.id !== id));
  renderSavedList();
  showToast('🗑️ Excluído!');
}

function renameProject(id) {
  const p = getProjects().find(x => x.id === id);
  if (!p) return;
  const newName = prompt('Novo nome:', p.title);
  if (newName &amp;amp;&amp;amp; newName.trim()) {
    p.title = newName.trim();
    setProjects(getProjects());
    renderSavedList();
    showToast('✏️ Renomeado!');
  }
}

async function askAI() {
  const prompt = document.getElementById('aiPrompt').value.trim();
  if (!prompt) {
    showToast('⚠️ Digite uma pergunta');
    return;
  }
  
  if (!aiSettings.apiKey) {
    showToast('⚠️ Configure a API Key primeiro');
    openSettings();
    return;
  }
  
  const responseDiv = document.getElementById('aiResponse');
  const btnAskAI = document.getElementById('btnAskAI');
  const originalText = document.getElementById('askBtnText').textContent;
  
  btnAskAI.disabled = true;
  document.getElementById('askBtnText').innerHTML = '<div class=&amp;quot;loading&amp;quot;></div> Pensando...';
  responseDiv.innerHTML = '<div style=&amp;quot;color:var(--text2);&amp;quot;><div class=&amp;quot;loading&amp;quot;></div> Consultando IA...</div>';
  
  try {
    const response = await callAI(prompt, aiSettings.enableWebSearch);
    
    responseDiv.innerHTML = `<div class=&amp;quot;ai-response&amp;quot;>🤖 <strong>Resposta:</strong>\n\n${escapeHtml(response)}</div>`;
    
    // TTS (Text-to-Speech)
    if (aiSettings.enableTTS) {
      speakText(response);
    }
    
  } catch(e) {
    responseDiv.innerHTML = `<div class=&amp;quot;ai-response&amp;quot; style=&amp;quot;border-left-color:var(--red);&amp;quot;>❌ <strong>Erro:</strong>\n\n${escapeHtml(e.message)}</div>`;
    showToast('❌ Erro na IA');
  } finally {
    btnAskAI.disabled = false;
    document.getElementById('askBtnText').textContent = originalText;
  }
}

// ========== AI API CALLS ==========
async function callAI(prompt, useWebSearch) {
  const provider = aiSettings.provider;
  
  if (provider === 'openai') {
    return await callOpenAI(prompt, useWebSearch);
  } else if (provider === 'gemini') {
    return await callGemini(prompt, useWebSearch);
  } else if (provider === 'claude') {
    return await callClaude(prompt, useWebSearch);
  }
  
  throw new Error('Provedor não suportado');
}

async function callOpenAI(prompt, useWebSearch) {
  const messages = [
    {
      role: 'system',
      content: 'Você é um assistente de programação especializado em HTML, CSS, JavaScript, React e Python. Seja direto e prático.'
    },
    {
      role: 'user',
      content: prompt
    }
  ];
  
  // Se busca web estiver ativada, adiciona contexto
  if (useWebSearch) {
    try {
      const searchResults = await searchWeb(prompt);
      messages[0].content += `\n\nInformações da web: ${searchResults}`;
    } catch(e) {
      console.warn('Busca web falhou:', e);
    }
  }
  
  const response = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${aiSettings.apiKey}`
    },
    body: JSON.stringify({
      model: 'gpt-4o-mini', // Modelo mais barato e rápido
      messages: messages,
      temperature: 0.7,
      max_tokens: 1000
    })
  });
  
  if (!response.ok) {
    const error = await response.json();
    throw new Error(error.error?.message || 'Erro na API OpenAI');
  }
  
  const data = await response.json();
  return data.choices[0].message.content;
}

async function callGemini(prompt, useWebSearch) {
  let fullPrompt = prompt;
  
  if (useWebSearch) {
    try {
      const searchResults = await searchWeb(prompt);
      fullPrompt = `Contexto da web: ${searchResults}\n\nPergunta: ${prompt}`;
    } catch(e) {
      console.warn('Busca web falhou:', e);
    }
  }
  
  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${aiSettings.apiKey}`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      contents: [{
        parts: [{
          text: fullPrompt
        }]
      }]
    })
  });
  
  if (!response.ok) {
    const error = await response.json();
    throw new Error(error.error?.message || 'Erro na API Gemini');
  }
  
  const data = await response.json();
  return data.candidates[0].content.parts[0].text;
}

async function callClaude(prompt, useWebSearch) {
  let fullPrompt = prompt;
  
  if (useWebSearch) {
    try {
      const searchResults = await searchWeb(prompt);
      fullPrompt = `Contexto da web: ${searchResults}\n\nPergunta: ${prompt}`;
    } catch(e) {
      console.warn('Busca web falhou:', e);
    }
  }
  
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': aiSettings.apiKey,
      'anthropic-version': '2023-06-01'
    },
    body: JSON.stringify({
      model: 'claude-3-haiku-20240307', // Modelo mais barato
      max_tokens: 1000,
      messages: [{
        role: 'user',
        content: fullPrompt
      }]
    })
  });
  
  if (!response.ok) {
    const error = await response.json();
    throw new Error(error.error?.message || 'Erro na API Claude');
  }
  
  const data = await response.json();
  return data.content[0].text;
}

// ========== WEB SEARCH ==========
async function searchWeb(query) {
  // Usando DuckDuckGo Instant Answer API (gratuita, sem API key)
  try {
    const response = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&amp;amp;format=json&amp;amp;no_html=1&amp;amp;skip_disambig=1`);
    const data = await response.json();
    
    let results = '';
    if (data.AbstractText) results += data.AbstractText + '\n';
    if (data.RelatedTopics &amp;amp;&amp;amp; data.RelatedTopics.length > 0) {
      results += data.RelatedTopics.slice(0, 3).map(t => t.Text).filter(Boolean).join('\n');
    }
    
    return results || 'Nenhum resultado encontrado';
  } catch(e) {
    console.error('Erro na busca:', e);
    return '';
  }
}
// ========== TEXT-TO-SPEECH ==========
function speakText(text) {
  if (!window.speechSynthesis) {
    console.warn('TTS não suportado neste navegador');
    return;
  }
  
  // Cancela qualquer fala anterior
  window.speechSynthesis.cancel();
  
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'pt-BR';
  utterance.rate = 1.0;
  utterance.pitch = 1.0;
  utterance.volume = 1.0;
  
  // Tenta usar uma voz em português
  const voices = window.speechSynthesis.getVoices();
  const ptVoice = voices.find(v => v.lang.startsWith('pt'));
  if (ptVoice) utterance.voice = ptVoice;
  
  window.speechSynthesis.speak(utterance);
  showToast('🔊 Reproduzindo áudio...');
}

// Carrega vozes disponíveis
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => {
    window.speechSynthesis.getVoices();
  };
}

// ========== UTILS ==========
function escapeHtml(str) {
  return str.replace(/&amp;amp;/g,'&amp;amp;amp;').replace(/</g,'&amp;amp;lt;').replace(/>/g,'&amp;amp;gt;').replace(/&amp;quot;/g,'&amp;amp;quot;');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2800);
}

// Close modals on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
});

// Enter key shortcuts
document.getElementById('gotoLineInput')?.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') gotoLine();
});

document.getElementById('aiPrompt')?.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) &amp;amp;&amp;amp; e.key === 'Enter') {
    askAI();
  }
});
</script>

<script>

let nomArquivo = &amp;quot;&amp;quot;;
let arquivosZip = []; // lista de arquivos dentro do ZIP/APK
let memoriaArquivos = JSON.parse(localStorage.getItem(&amp;quot;cirurgiao_memoria&amp;quot;) || &amp;quot;[]&amp;quot;);

// =====================
// AUTO-DETECTAR PROVEDOR DE IA
// =====================
const PROVEDORES = [
  { prefix: &amp;quot;gsk_&amp;quot;,   url: &amp;quot;https://api.groq.com/openai/v1&amp;quot;,                              model: &amp;quot;llama-3.3-70b-versatile&amp;quot;,  nome: &amp;quot;Groq&amp;quot; },
  { prefix: &amp;quot;sk-or-&amp;quot;, url: &amp;quot;https://openrouter.ai/api/v1&amp;quot;,                                model: &amp;quot;openai/gpt-4o-mini&amp;quot;,       nome: &amp;quot;OpenRouter&amp;quot; },
  { prefix: &amp;quot;pplx-&amp;quot;,  url: &amp;quot;https://api.perplexity.ai&amp;quot;,                                   model: &amp;quot;sonar-pro&amp;quot;,                nome: &amp;quot;Perplexity&amp;quot; },
  { prefix: &amp;quot;AIza&amp;quot;,   url: &amp;quot;https://generativelanguage.googleapis.com/v1beta/openai&amp;quot;,      model: &amp;quot;gemini-2.0-flash&amp;quot;,         nome: &amp;quot;Google Gemini&amp;quot; },

  { prefix: &amp;quot;sk-&amp;quot;,    url: &amp;quot;https://api.openai.com/v1&amp;quot;,                                   model: &amp;quot;gpt-4o-mini&amp;quot;,              nome: &amp;quot;OpenAI&amp;quot; },
];

function detectarProvedor(chave) {
  const k = (chave || &amp;quot;&amp;quot;).trim();
  for (const p of PROVEDORES) {
    if (k.startsWith(p.prefix)) return p;
  }
  return null;
}

document.getElementById(&amp;quot;iaApiKey&amp;quot;).addEventListener(&amp;quot;input&amp;quot;, function() {
  const p = detectarProvedor(this.value);
  const el = document.getElementById(&amp;quot;iaProviderDetectado&amp;quot;);
  el.textContent = p ? `✅ Detectado: ${p.nome} · Modelo: ${p.model}` : &amp;quot;&amp;quot;;
  if (this.value.trim()) localStorage.setItem(&amp;quot;cirurgiao_apikey&amp;quot;, this.value.trim());
});

// Restaurar chave salva
window.addEventListener(&amp;quot;load&amp;quot;, () => {
  const chaveSalva = localStorage.getItem(&amp;quot;cirurgiao_apikey&amp;quot;);
  if (chaveSalva) {
    document.getElementById(&amp;quot;iaApiKey&amp;quot;).value = chaveSalva;
    const p = detectarProvedor(chaveSalva);
    if (p) document.getElementById(&amp;quot;iaProviderDetectado&amp;quot;).textContent = `✅ Detectado: ${p.nome} · Modelo: ${p.model}`;
  }
  renderizarMemoria();
});

function toggleVerChave() {
  const inp = document.getElementById(&amp;quot;iaApiKey&amp;quot;);
  inp.type = inp.type === &amp;quot;password&amp;quot; ? &amp;quot;text&amp;quot; : &amp;quot;password&amp;quot;;
}

  if (!file) { alert(&amp;quot;Selecione um arquivo primeiro!&amp;quot;); return; }
  nomArquivo = file.name;
  const ext = file.name.split('.').pop().toLowerCase();

  if (ext === &amp;quot;zip&amp;quot; || ext === &amp;quot;apk&amp;quot;) {
    carregarZIP(file);
  } else {
    const reader = new FileReader();
    reader.onload = function(e) {
      codigoOriginal = e.target.result;
      document.getElementById(&amp;quot;cardExplorador&amp;quot;).style.display = &amp;quot;none&amp;quot;;
      arquivosZip = [];
      processarCodigo(file.name);
    };
    reader.readAsText(file, &amp;quot;UTF-8&amp;quot;);
  }
}

async function carregarZIP(file) {
  setStatus(&amp;quot;⏳ Abrindo &amp;quot; + file.name + &amp;quot;...&amp;quot;, &amp;quot;#38bdf8&amp;quot;);
  try {
    const zip = await JSZip.loadAsync(file);
    arquivosZip = [];
    const promessas = [];

    zip.forEach((caminho, entrada) => {
      if (!entrada.dir) {
        const ext = caminho.split('.').pop().toLowerCase();
        const legivel = [&amp;quot;js&amp;quot;,&amp;quot;ts&amp;quot;,&amp;quot;tsx&amp;quot;,&amp;quot;jsx&amp;quot;,&amp;quot;html&amp;quot;,&amp;quot;htm&amp;quot;,&amp;quot;css&amp;quot;,&amp;quot;json&amp;quot;,&amp;quot;txt&amp;quot;,&amp;quot;md&amp;quot;,&amp;quot;xml&amp;quot;,&amp;quot;yaml&amp;quot;,&amp;quot;yml&amp;quot;,&amp;quot;env&amp;quot;,&amp;quot;config&amp;quot;,&amp;quot;gradle&amp;quot;,&amp;quot;properties&amp;quot;,&amp;quot;kt&amp;quot;,&amp;quot;java&amp;quot;,&amp;quot;swift&amp;quot;,&amp;quot;py&amp;quot;].includes(ext);
        arquivosZip.push({ caminho, entrada, ext, legivel, tamanho: 0 });
      }
    });

    // Pegar tamanhos
    for (const arq of arquivosZip) {
      promessas.push(
        arq.entrada.async(&amp;quot;uint8array&amp;quot;).then(data => { arq.tamanho = data.length; })
      );
    }
    await Promise.all(promessas);

    arquivosZip.sort((a, b) => {
      if (a.legivel &amp;amp;&amp;amp; !b.legivel) return -1;
      if (!a.legivel &amp;amp;&amp;amp; b.legivel) return 1;
      return a.caminho.localeCompare(b.caminho);
    });

    renderizarListaArquivos(arquivosZip);
    document.getElementById(&amp;quot;cardExplorador&amp;quot;).style.display = &amp;quot;block&amp;quot;;

    // Concatenar arquivos legíveis para análise
    let conteudoTotal = &amp;quot;&amp;quot;;
    let count = 0;
    for (const arq of arquivosZip) {
      if (arq.legivel &amp;amp;&amp;amp; arq.tamanho < 500000) {
        try {
          const texto = await arq.entrada.async(&amp;quot;text&amp;quot;);
          conteudoTotal += `\n\n${&amp;quot;═&amp;quot;.repeat(60)}\n📄 ARQUIVO: ${arq.caminho}\n${&amp;quot;═&amp;quot;.repeat(60)}\n${texto}`;
          count++;
        } catch(e) {}
      }
    }
    codigoOriginal = conteudoTotal;
    processarCodigo(`${file.name} (${count} arquivos legíveis de ${arquivosZip.length} total)`);

  } catch(e) {
    setStatus(&amp;quot;❌ Erro ao abrir ZIP/APK: &amp;quot; + e.message, &amp;quot;#ef4444&amp;quot;);
  }
}

function renderizarListaArquivos(lista) {
  const container = document.getElementById(&amp;quot;listaArquivos&amp;quot;);
  const contador = document.getElementById(&amp;quot;contadorArquivos&amp;quot;);
  contador.textContent = `${lista.length} arquivos`;

  if (lista.length === 0) {
    container.innerHTML = '<div style=&amp;quot;color:#64748b; font-size:12px; text-align:center; padding:10px;&amp;quot;>Nenhum arquivo encontrado</div>';
    return;
  }

  container.innerHTML = lista.map((arq, i) => {
    const icone = arq.legivel ? &amp;quot;📄&amp;quot; : &amp;quot;🔒&amp;quot;;
    const extClass = [&amp;quot;js&amp;quot;,&amp;quot;ts&amp;quot;,&amp;quot;tsx&amp;quot;,&amp;quot;jsx&amp;quot;].includes(arq.ext) ? &amp;quot;ext-js&amp;quot; :
                     [&amp;quot;html&amp;quot;,&amp;quot;htm&amp;quot;].includes(arq.ext) ? &amp;quot;ext-html&amp;quot; :
                     arq.ext === &amp;quot;json&amp;quot; ? &amp;quot;ext-json&amp;quot; :
                     [&amp;quot;txt&amp;quot;,&amp;quot;md&amp;quot;].includes(arq.ext) ? &amp;quot;ext-txt&amp;quot; : &amp;quot;ext-outro&amp;quot;;
    const kb = (arq.tamanho / 1024).toFixed(1);
    return `
      <div class=&amp;quot;arquivo-item&amp;quot; onclick=&amp;quot;abrirArquivoDoZip(${i})&amp;quot; title=&amp;quot;${arq.caminho}&amp;quot;>
        <span>${icone}</span>
        <span class=&amp;quot;ext ${extClass}&amp;quot;>.${arq.ext}</span>
        <span style=&amp;quot;flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;&amp;quot;>${arq.caminho}</span>
        <span style=&amp;quot;color:#475569; font-size:10px; white-space:nowrap;&amp;quot;>${kb}KB</span>
      </div>
    `;
  }).join(&amp;quot;&amp;quot;);
}

function filtrarArquivos() {
  const termo = document.getElementById(&amp;quot;campoBuscaArquivo&amp;quot;).value.toLowerCase();
  const filtrados = arquivosZip.filter(a => a.caminho.toLowerCase().includes(termo));

async function abrirArquivoDoZip(idx) {
  const arq = arquivosZip[idx];
  if (!arq) return;
  if (!arq.legivel) {
    mostrarNaVisualizacao(`🔒 ${arq.caminho}`, `Este arquivo é binário e não pode ser lido como texto.\nExtensão: .${arq.ext}\nTamanho: ${(arq.tamanho/1024).toFixed(1)} KB`);
    return;
  }
  try {
