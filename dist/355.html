function processarCodigo(nome) {
  const linhas = codigoOriginal.split('\n').length;
  const kb = (codigoOriginal.length / 1024).toFixed(1);
  const regexFunc = /function\s+(\w+)\s*\(/g;
  const regexArrow = /const\s+(\w+)\s*=\s*(?:async\s*)?\(/g;
  const funcs = [...codigoOriginal.matchAll(regexFunc)];
  const arrows = [...codigoOriginal.matchAll(regexArrow)];
  const totalFuncs = funcs.length + arrows.length;
  const jsonMatches = codigoOriginal.match(/\{[^{}]{10,}\}/g) || [];

  document.getElementById(&amp;quot;statLinhas&amp;quot;).textContent = linhas.toLocaleString();
  document.getElementById(&amp;quot;statKB&amp;quot;).textContent = kb;
  document.getElementById(&amp;quot;statFunctions&amp;quot;).textContent = totalFuncs;
  document.getElementById(&amp;quot;statJsons&amp;quot;).textContent = jsonMatches.length;

  let tags = &amp;quot;&amp;quot;;
  if (codigoOriginal.includes(&amp;quot;localStorage&amp;quot;)) tags += '<span class=&amp;quot;tag tag-verde&amp;quot;>🧠 localStorage</span>';
  if (/replit\.com|replit\.dev|REPL_ID|REPLIT/i.test(codigoOriginal)) tags += '<span class=&amp;quot;tag tag-vermelho&amp;quot;>🚨 Replit</span>';
  if (/gemini|generativelanguage/i.test(codigoOriginal)) tags += '<span class=&amp;quot;tag tag-azul&amp;quot;>🤖 Gemini</span>';
  if (/openai|gpt-/i.test(codigoOriginal)) tags += '<span class=&amp;quot;tag tag-azul&amp;quot;>🤖 OpenAI</span>';
  if (/groq\.com/i.test(codigoOriginal)) tags += '<span class=&amp;quot;tag tag-azul&amp;quot;>🤖 Groq</span>';
  if (codigoOriginal.includes(&amp;quot;fetch(&amp;quot;)) tags += '<span class=&amp;quot;tag tag-amarelo&amp;quot;>🌐 fetch/API</span>';
  if (/<html|<!DOCTYPE/i.test(codigoOriginal)) tags += '<span class=&amp;quot;tag tag-azul&amp;quot;>🖼️ HTML</span>';
  if (/import |require\(/i.test(codigoOriginal)) tags += '<span class=&amp;quot;tag tag-amarelo&amp;quot;>📦 Módulos</span>';
  if (/class /i.test(codigoOriginal)) tags += '<span class=&amp;quot;tag tag-roxo&amp;quot;>🏗️ Classes</span>';
  if (/capacitor|ionic/i.test(codigoOriginal)) tags += '<span class=&amp;quot;tag tag-laranja&amp;quot;>📱 Capacitor</span>';
  if (/electron/i.test(codigoOriginal)) tags += '<span class=&amp;quot;tag tag-roxo&amp;quot;>🖥️ Electron</span>';

  document.getElementById(&amp;quot;tagDetectadas&amp;quot;).innerHTML = tags;
  document.getElementById(&amp;quot;cardStats&amp;quot;).style.display = &amp;quot;block&amp;quot;;
  document.getElementById(&amp;quot;cardAcoes&amp;quot;).style.display = &amp;quot;block&amp;quot;;
  document.getElementById(&amp;quot;cardBusca&amp;quot;).style.display = &amp;quot;block&amp;quot;;
  setStatus(`✅ <strong>${nome}</strong> carregado`, &amp;quot;#4ade80&amp;quot;);

  mostrarNaVisualizacao(&amp;quot;📊 ANÁLISE: &amp;quot; + nome, `
ARQUIVO: ${nome}
TAMANHO: ${kb} KB
LINHAS: ${linhas.toLocaleString()}
FUNCTIONS: ${totalFuncs}
BLOCOS JSON: ${jsonMatches.length}

TECNOLOGIAS DETECTADAS:
${tags.replace(/<[^>]+>/g, '').trim() || &amp;quot;Nenhuma detectada automaticamente&amp;quot;}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
PRÓXIMOS PASSOS RECOMENDADOS:
${/replit\.com|replit\.dev|REPL_ID|REPLIT/i.test(codigoOriginal) ? &amp;quot;⚠️  ATENÇÃO: Vínculos com Replit detectados!\n   → Clique em '🚨 Detectar Vínculos Replit'\n   → Ou use a IA para limpar automaticamente\n\n&amp;quot; : &amp;quot;&amp;quot;}1. Ver todas as functions → entender o que o código faz
2. Extrair localStorage → pegar a parte de memória
3. Extrair API → ver qual IA estava sendo usada

function irParaLinha(numLinha) {
  const linhas = codigoOriginal.split('\n');
  const inicio = Math.max(0, numLinha - 5);
  const fim = Math.min(linhas.length, numLinha + 10);
  const contexto = linhas.slice(inicio, fim).map((l, i) => {
    const n = inicio + i + 1;
    return (n === numLinha ? `>>> ` : `    `) + `[${n}] ${l}`;
  }).join('\n');
  mostrarNaVisualizacao(`🔍 Contexto da Linha ${numLinha}`, contexto);
}

function detectarReplit() {
  if (!codigoOriginal) return alert(&amp;quot;Carregue o arquivo primeiro!&amp;quot;);

  const linhas = codigoOriginal.split('\n');
  const padroes = [
    { regex: /replit\.com/gi,          tipo: &amp;quot;🌐 URL replit.com&amp;quot;,           solucao: &amp;quot;Substituir pela URL do seu próprio servidor ou GitHub Pages&amp;quot; },
    { regex: /replit\.dev/gi,          tipo: &amp;quot;🌐 URL replit.dev&amp;quot;,           solucao: &amp;quot;Substituir pela URL do seu próprio servidor&amp;quot; },
    { regex: /REPL_ID/g,               tipo: &amp;quot;🔑 Variável REPL_ID&amp;quot;,         solucao: &amp;quot;Remover ou substituir por variável própria&amp;quot; },
    { regex: /REPLIT_DB_URL/g,         tipo: &amp;quot;🗄️ Banco Replit DB&amp;quot;,          solucao: &amp;quot;Substituir por localStorage ou outro banco gratuito&amp;quot; },
    { regex: /replit\.nix/g,           tipo: &amp;quot;⚙️ Config replit.nix&amp;quot;,        solucao: &amp;quot;Pode remover — é configuração interna da Replit&amp;quot; },
    { regex: /\.replit/g,              tipo: &amp;quot;⚙️ Arquivo .replit&amp;quot;,          solucao: &amp;quot;Pode remover — é configuração interna da Replit&amp;quot; },
    { regex: /\/api\/code-assistant/g, tipo: &amp;quot;🔗 Rota /api/code-assistant&amp;quot;, solucao: &amp;quot;Substituir por chamada direta à API de IA com sua chave&amp;quot; },
    { regex: /\/api\/tts/g,            tipo: &amp;quot;🔗 Rota /api/tts&amp;quot;,            solucao: &amp;quot;Substituir por Web Speech API (gratuita, funciona no navegador)&amp;quot; },
    { regex: /\/api\//g,               tipo: &amp;quot;🔗 Rota /api/ genérica&amp;quot;,      solucao: &amp;quot;Verificar se é rota da Replit ou do seu próprio backend&amp;quot; },
    { regex: /process\.env\./g,        tipo: &amp;quot;🔑 Variável de ambiente&amp;quot;,     solucao: &amp;quot;Substituir por campo de input para o usuário colar a chave&amp;quot; },
  ];

  const encontrados = [];
  padroes.forEach(p => {
    linhas.forEach((linha, i) => {
      if (p.regex.test(linha)) {
        p.regex.lastIndex = 0;
        encontrados.push({ linha: i + 1, tipo: p.tipo, conteudo: linha.trim(), solucao: p.solucao });
      }
    });
    p.regex.lastIndex = 0;
  });

  if (encontrados.length === 0) {
    mostrarNaVisualizacao(&amp;quot;✅ VERIFICAÇÃO REPLIT&amp;quot;, &amp;quot;Nenhum vínculo com a Replit encontrado!\n\nSeu código parece estar limpo de dependências da Replit.\nAinda assim, verifique as chamadas de API (/api/) manualmente.&amp;quot;);
    return;
  }

  // Agrupar por tipo
  const porTipo = {};
  encontrados.forEach(e => {
    if (!porTipo[e.tipo]) porTipo[e.tipo] = [];
    porTipo[e.tipo].push(e);
  });

  let resultado = `🚨 VÍNCULOS COM REPLIT ENCONTRADOS: ${encontrados.length} ocorrências\n`;
  resultado += &amp;quot;═&amp;quot;.repeat(60) + &amp;quot;\n\n&amp;quot;;
  resultado += &amp;quot;⚠️  ATENÇÃO: Estas partes param de funcionar quando você\n&amp;quot;;
  resultado += &amp;quot;   para de pagar a Replit!\n\n&amp;quot;;
  resultado += &amp;quot;═&amp;quot;.repeat(60) + &amp;quot;\n\n&amp;quot;;

  Object.entries(porTipo).forEach(([tipo, itens]) => {
    resultado += `${tipo} (${itens.length}x)\n`;
    resultado += `💡 Como corrigir: ${itens[0].solucao}\n`;
    resultado += &amp;quot;─&amp;quot;.repeat(40) + &amp;quot;\n&amp;quot;;
    itens.slice(0, 5).forEach(item => {
      resultado += `  Linha ${item.linha}: ${item.conteudo.substring(0, 80)}\n`;
    });
    if (itens.length > 5) resultado += `  ... e mais ${itens.length - 5} ocorrências\n`;
    resultado += &amp;quot;\n&amp;quot;;
  });

  resultado += &amp;quot;═&amp;quot;.repeat(60) + &amp;quot;\n&amp;quot;;
  resultado += &amp;quot;💡 PRÓXIMO PASSO:\n&amp;quot;;
  resultado += &amp;quot;Use o botão '🤖 Pedir IA: Limpar Replit' para gerar\n&amp;quot;;
  resultado += &amp;quot;automaticamente o código corrigido sem essas dependências.\n&amp;quot;;

  mostrarNaVisualizacao(`🚨 ${encontrados.length} VÍNCULOS REPLIT ENCONTRADOS`, resultado);

  // Também mostrar na lista de blocos
  const cardBlocos = document.getElementById(&amp;quot;cardBlocos&amp;quot;);
  const listaBlocos = document.getElementById(&amp;quot;listaBlocos&amp;quot;);
  document.getElementById(&amp;quot;tituloBlocos&amp;quot;).textContent = `🚨 ${encontrados.length} Vínculos Replit`;
  cardBlocos.style.display = &amp;quot;block&amp;quot;;
  listaBlocos.innerHTML = encontrados.slice(0, 30).map(e => `
    <div class=&amp;quot;item-funcao replit&amp;quot; onclick=&amp;quot;irParaLinha(${e.linha})&amp;quot;>
      <div class=&amp;quot;nome-funcao&amp;quot;>${e.tipo}</div>
      <div class=&amp;quot;desc-funcao&amp;quot;>${e.conteudo.substring(0, 80)}</div>
      <div class=&amp;quot;linha-funcao&amp;quot;>Linha ${e.linha} · ${e.solucao}</div>
    </div>
  `).join(&amp;quot;&amp;quot;);
}

function mostrarFunctions() {
  if (!codigoOriginal) return alert(&amp;quot;Carregue o arquivo primeiro!&amp;quot;);
  const linhas = codigoOriginal.split('\n');
  const blocos = [];
  linhas.forEach((linha, i) => {
    const limpada = linha.trim();
    const mFunc = limpada.match(/^(?:async\s+)?function\s+(\w+)\s*\(/);
    if (mFunc) blocos.push({ tipo: 'function', nome: mFunc[1], linha: i+1, preview: limpada.substring(0, 80) });
    const mArrow = limpada.match(/^(?:export\s+)?(?:const|let)\s+(\w+)\s*=\s*(?:async\s*)?\(/);
    if (mArrow) blocos.push({ tipo: 'arrow', nome: mArrow[1], linha: i+1, preview: limpada.substring(0, 80) });
    const mClasse = limpada.match(/^class\s+(\w+)/);
    if (mClasse) blocos.push({ tipo: 'classe', nome: mClasse[1], linha: i+1, preview: limpada.substring(0, 80) });
    if (limpada.includes(&amp;quot;localStorage&amp;quot;)) blocos.push({ tipo: 'local', nome: 'localStorage', linha: i+1, preview: limpada.substring(0, 80) });
    if (limpada.includes(&amp;quot;fetch(&amp;quot;) || limpada.includes(&amp;quot;apiKey&amp;quot;)) blocos.push({ tipo: 'api', nome: 'API/fetch', linha: i+1, preview: limpada.substring(0, 80) });
  });

  const cardBlocos = document.getElementById(&amp;quot;cardBlocos&amp;quot;);
  const listaBlocos = document.getElementById(&amp;quot;listaBlocos&amp;quot;);
  document.getElementById(&amp;quot;tituloBlocos&amp;quot;).textContent = `📋 ${blocos.length} Blocos Encontrados`;
  cardBlocos.style.display = &amp;quot;block&amp;quot;;
  if (blocos.length === 0) {
    listaBlocos.innerHTML = '<div class=&amp;quot;aviso&amp;quot;>Nenhuma function encontrada. O código pode estar minificado.</div>';
    return;
  }
  listaBlocos.innerHTML = blocos.map((b, idx) => {
    const cor = b.tipo === 'local' ? 'local' : b.tipo === 'api' ? 'api' : b.tipo === 'classe' ? 'classe' : 'function';
    const icone = b.tipo === 'local' ? '🧠' : b.tipo === 'api' ? '🌐' : b.tipo === 'classe' ? '🏗️' : '⚡';
    return `
      <div class=&amp;quot;item-funcao ${cor}&amp;quot; onclick=&amp;quot;extrairFuncaoEspecifica(${idx})&amp;quot;>
        <div class=&amp;quot;nome-funcao&amp;quot;>${icone} ${b.nome}</div>
        <div class=&amp;quot;desc-funcao&amp;quot;>${b.preview}...</div>
        <div class=&amp;quot;linha-funcao&amp;quot;>Linha ${b.linha} · Clique para extrair</div>
      </div>
    `;
  }).join(&amp;quot;&amp;quot;);
  window._blocos = blocos;
  mostrarNaVisualizacao(`⚡ ${blocos.length} FUNÇÕES ENCONTRADAS`,
    blocos.map(b => `[Linha ${b.linha}] ${b.tipo.toUpperCase()}: ${b.nome}\n  ${b.preview}`).join('\n\n')
  );
}

function extrairFuncaoEspecifica(idx) {
  const bloco = window._blocos[idx];
  if (!bloco) return;
  const linhas = codigoOriginal.split('\n');
  const inicio = bloco.linha - 1;
  let codigo = &amp;quot;&amp;quot;;
  let abertas = 0;
  let comecou = false;
  for (let i = inicio; i < Math.min(inicio + 200, linhas.length); i++) {
    const linha = linhas[i];
    codigo += linha + '\n';
    for (const char of linha) {
      if (char === '{') { abertas++; comecou = true; }
      if (char === '}') abertas--;
    }
    if (comecou &amp;amp;&amp;amp; abertas <= 0) break;
  }
  mostrarNaVisualizacao(`📋 BLOCO: ${bloco.nome} (Linha ${bloco.linha})`, codigo);
}

function extrairLocalStorage() {

  linhas.forEach((linha, i) => {
    if (linha.includes(&amp;quot;localStorage&amp;quot;)) {

      const fim = Math.min(linhas.length, i + 3);
      encontrados.push(`[Linha ${i+1}]:\n${linhas.slice(inicio, fim).join('\n')}`);

}

// =====================
// EXTRAIR JSON
// =====================
function extrairJSON() {
  if (!codigoOriginal) return alert(&amp;quot;Carregue o arquivo primeiro!&amp;quot;);
  const jsonRegex = /\{(?:[^{}]|\{[^{}]*\})*\}/g;
  const matches = codigoOriginal.match(jsonRegex) || [];
  const jsonsValidos = [];
  matches.forEach((m, i) => {
    if (m.length < 20) return;
    try {
      const parsed = JSON.parse(m);
      jsonsValidos.push({ index: i, parsed: JSON.stringify(parsed, null, 2) });
    } catch(e) {
      if (m.length > 50) jsonsValidos.push({ index: i, parsed: m });
    }
  });
  if (jsonsValidos.length === 0) {
    mostrarNaVisualizacao(&amp;quot;📦 JSONs&amp;quot;, &amp;quot;Nenhum JSON válido encontrado.&amp;quot;);
    return;
  }
  mostrarNaVisualizacao(`📦 ${jsonsValidos.length} BLOCOS JSON`,
    jsonsValidos.slice(0, 20).map((j, i) => `═══ JSON #${i+1} ═══\n${j.parsed}`).join('\n\n')
  );
}

// =====================
// ORGANIZAR CÓDIGO
// =====================
function organizarCodigo() {
  if (!codigoOriginal) return alert(&amp;quot;Carregue o arquivo primeiro!&amp;quot;);
  let organizado = codigoOriginal
    .replace(/;(?!\n)/g, ';\n')
    .replace(/\{(?!\n)/g, '{\n')
    .replace(/\}(?!\n)/g, '}\n')
    .replace(/,(?!\n)(?!\s)/g, ',\n')
    .replace(/\n{3,}/g, '\n\n');
  const linhas = organizado.split('\n');
  let nivel = 0;
  const indentado = linhas.map(linha => {
    const trim = linha.trim();
    if (!trim) return '';
    if (trim.startsWith('}') || trim.startsWith(']')) nivel = Math.max(0, nivel - 1);
    const resultado = '  '.repeat(nivel) + trim;
    if (trim.endsWith('{') || trim.endsWith('[')) nivel++;
    return resultado;
  });
  mostrarNaVisualizacao(&amp;quot;✨ CÓDIGO ORGANIZADO&amp;quot;, indentado.join('\n'));
}

  const temReplit = /replit\.com|replit\.dev|REPL_ID/i.test(codigoOriginal);
  const temCapacitor = /capacitor/i.test(codigoOriginal);

    if (trim.match(/^class\s+\w+/)) secoes.push(`Linha ${i+1}: CLASSE → ${trim.substring(0
, 60)}`);

  }

function salvarNaMemoria() {
  if (!codigoOriginal) return alert(&amp;quot;Carregue um arquivo primeiro!&amp;quot;);
  const nome = nomArquivo || &amp;quot;arquivo-&amp;quot; + Date.now();
  const existe = memoriaArquivos.findIndex(m => m.nome === nome);
  const item = {
    id: Date.now().toString(),
    nome,
    conteudo: codigoOriginal,
    tamanho: (codigoOriginal.length / 1024).toFixed(1),
    data: new Date().toLocaleString(&amp;quot;pt-BR&amp;quot;)
  };
  if (existe >= 0) {
    memoriaArquivos[existe] = item;
  } else {
    memoriaArquivos.push(item);
  }
  localStorage.setItem(&amp;quot;cirurgiao_memoria&amp;quot;, JSON.stringify(memoriaArquivos));
  renderizarMemoria();
  mostrarNaVisualizacao(&amp;quot;💾 SALVO NA MEMÓRIA&amp;quot;, `✅ &amp;quot;${nome}&amp;quot; salvo com sucesso!\n\nTamanho: ${item.tamanho} KB\nData: ${item.data}\n\nTotal na memória: ${memoriaArquivos.length} arquivo(s)`);

function renderizarMemoria() {
  const container = document.getElementById(&amp;quot;listaMemoria&amp;quot;);

    container.innerHTML = '<div style=&amp;quot;color:#64748b; font-size:12px; text-align:center; padding:10px;&amp;quot;>Nenhum arquivo salvo ainda.</div>';

  }
  container.innerHTML = memoriaArquivos.map((m, i) => `
    <div class=&amp;quot;memoria-item&amp;quot;>
      <div style=&amp;quot;display:flex; justify-content:space-between; align-items:start; gap:6px;&amp;quot;>
        <div style=&amp;quot;flex:1; min-width:0;&amp;quot;>
          <div class=&amp;quot;memoria-nome&amp;quot; style=&amp;quot;overflow:hidden; text-overflow:ellipsis; white-space:nowrap;&amp;quot; title=&amp;quot;${m.nome}&amp;quot;>${m.nome}</div>
          <div class=&amp;quot;memoria-valor&amp;quot;>${m.tamanho} KB · ${m.data}</div>
        </div>
        <div style=&amp;quot;display:flex; gap:4px; flex-shrink:0;&amp;quot;>
          <button onclick=&amp;quot;carregarDaMemoria(${i})&amp;quot; style=&amp;quot;width:auto; padding:4px 8px; font-size:11px; margin:0;&amp;quot; class=&amp;quot;verde&amp;quot;>📂</button>
          <button onclick=&amp;quot;baixarDaMemoria(${i})&amp;quot; style=&amp;quot;width:auto; padding:4px 8px; font-size:11px; margin:0;&amp;quot; class=&amp;quot;roxo&amp;quot;>⬇️</button>
          <button onclick=&amp;quot;removerDaMemoria(${i})&amp;quot; style=&amp;quot;width:auto; padding:4px 8px; font-size:11px; margin:0;&amp;quot; class=&amp;quot;vermelho&amp;quot;>🗑️</button>
        </div>
      </div>
    </div>
  `).join(&amp;quot;&amp;quot;);
}

function carregarDaMemoria(idx) {
  const m = memoriaArquivos[idx];
  if (!m) return;
  codigoOriginal = m.conteudo;
  nomArquivo = m.nome;
  processarCodigo(m.nome);
}

function baixarDaMemoria(idx) {
  const m = memoriaArquivos[idx];
  if (!m) return;
  const blob = new Blob([m.conteudo], { type: &amp;quot;text/plain&amp;quot; });
  const url = URL.createObjectURL(blob);
  const a = document.createElement(&amp;quot;a&amp;quot;);
  a.href = url;
  a.download = m.nome.replace(/[^a-z0-9._-]/gi, &amp;quot;_&amp;quot;);
  a.click();
  URL.revokeObjectURL(url);
}

function removerDaMemoria(idx) {
  if (!confirm(&amp;quot;Remover este arquivo da memória?&amp;quot;)) return;
  memoriaArquivos.splice(idx, 1);
  localStorage.setItem(&amp;quot;cirurgiao_memoria&amp;quot;, JSON.stringify(memoriaArquivos));
  renderizarMemoria();
}

function limparMemoria() {
  if (!confirm(&amp;quot;Limpar TODA a memória? Esta ação não pode ser desfeita.&amp;quot;)) return;
  memoriaArquivos = [];
  localStorage.setItem(&amp;quot;cirurgiao_memoria&amp;quot;, JSON.stringify([]));
  renderizarMemoria();
}

function baixarMemoriaCompleta() {
  if (memoriaArquivos.length === 0) return alert(&amp;quot;Nenhum arquivo na memória.&amp;quot;);

async function consultarIA(perguntaOverride) {
  const chave = document.getElementById(&amp;quot;iaApiKey&amp;quot;).value.trim();
  if (!chave) { alert(&amp;quot;Cole sua chave de API no painel da IA (painel esquerdo).&amp;quot;); return; }

  const pergunta = perguntaOverride || document.getElementById(&amp;quot;iaPergunta&amp;quot;).value.trim();
  if (!pergunta) { alert(&amp;quot;Digite uma pergunta para a IA.&amp;quot;); return; }

  const provedor = detectarProvedor(chave);
  if (!provedor) { alert(&amp;quot;Chave não reconhecida. Use: gsk_ (Groq), AIza (Gemini), sk- (OpenAI), sk-or- (OpenRouter), pplx- (Perplexity), xai- (xAI)&amp;quot;); return; }

  const contexto = codigoOriginal
    ? `\n\nCÓDIGO ATUAL (${nomArquivo || &amp;quot;sem nome&amp;quot;}, ${(codigoOriginal.length/1024).toFixed(1)}KB):\n\`\`\`\n${codigoOriginal.substring(0, 8000)}${codigoOriginal.length > 8000 ? &amp;quot;\n... [código truncado para caber no contexto]&amp;quot; : &amp;quot;&amp;quot;}\n\`\`\``
    : &amp;quot;&amp;quot;;

  const btn = document.getElementById(&amp;quot;btnConsultarIA&amp;quot;);
  btn.disabled = true;
  btn.innerHTML = '<span class=&amp;quot;spinner&amp;quot;></span>Consultando...';

  const respostaEl = document.getElementById(&amp;quot;iaResposta&amp;quot;);
  respostaEl.style.display = &amp;quot;block&amp;quot;;
  respostaEl.textContent = &amp;quot;⏳ Aguardando resposta da IA...&amp;quot;;

  try {
    const resp = await fetch(`${provedor.url}/chat/completions`, {
      method: &amp;quot;POST&amp;quot;,
      headers: {
        &amp;quot;Content-Type&amp;quot;: &amp;quot;application/json&amp;quot;,
        &amp;quot;Authorization&amp;quot;: `Bearer ${chave}`
      },
      body: JSON.stringify({
        model: provedor.model,
        messages: [
          {
            role: &amp;quot;system&amp;quot;,
            content: &amp;quot;Você é um especialista em análise e limpeza de código. Responda sempre em português brasileiro. Seja direto, prático e explique de forma simples para um usuário leigo. Quando sugerir código, forneça o código completo e pronto para usar.&amp;quot;
          },
          {
            role: &amp;quot;user&amp;quot;,
            content: pergunta + contexto
          }
        ],
        max_tokens: 2000,
        temperature: 0.3
      })
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err?.error?.message || `Erro ${resp.status}`);
    }

    const data = await resp.json();
    const resposta = data.choices?.[0]?.message?.content || &amp;quot;Sem resposta.&amp;quot;;
    respostaEl.textContent = resposta;
    mostrarNaVisualizacao(`🤖 RESPOSTA DA IA (${provedor.nome})`, resposta);

  } catch(e) {
    respostaEl.textContent = `❌ Erro: ${e.message}\n\nVerifique se a chave está correta e tem créditos disponíveis.`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '🤖 Consultar IA';
  }
}

.ext-json { background: #3b0764; color: #c4b5fd; }

.busca-conteudo { color: #e2e8f0; }
.busca-destaque { background: #451a03; color: #fcd34d; padding: 0 2px; border-radius: 3px; }
.busca-destaque-2 { background: #3b0764; color: #c4b5fd; padding: 0 2px; border-radius: 3px; }
.busca-destaque-3 { background: #064e3b; color: #6ee7b7; padding: 0 2px; border-radius: 3px; }
.memoria-item { background: #0f172a; border: 1px solid #1e3a5f; border-radius: 8px; padding: 10px; margin: 6px 0; }
.memoria-nome { color: #38bdf8; font-size: 12px; font-weight: bold; }
.memoria-valor { color: #94a3b8; font-size: 11px; font-family: monospace; margin-top: 4px; word-break: break-all; }
.tab-bar { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
.tab { padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; border: 1px solid #1e3a5f; background: #0f172a; color: #64748b; transition: all 0.2s; width: auto; margin: 0; }

/* MODAL COLAR */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; align-items: center; justify-content: center; }
.modal-overlay.aberto { display: flex; }
.modal-box { background: #111827; border: 1px solid #1e3a5f; border-radius: 12px; padding: 24px; width: 90vw; max-width: 900px; max-height: 90vh; display: flex; flex-direction: column; gap: 12px; }
.modal-box h3 { color: #38bdf8; font-size: 16px; margin-bottom: 4px; }

.modal-btns { display: flex; gap: 8px; }

.nota-texto { color: #e2e8f0; font-size: 12px; white-space: pre-wrap; }

<h1>🔬 CIRURGIÃO DE CÓDIGO 3.0</h1>

  { prefix: &amp;quot;pplx-&amp;quot;,  url: &amp;quot;https://api.perplexity.ai&amp;quot;,                               model: &amp;quot;sonar-pro&amp;quot;,               nome: &amp;quot;Perplexity&amp;quot; },

  { prefix: &amp;quot;sk-&amp;quot;,    url: &amp;quot;https://api.openai.com/v1&amp;quot;,                               model: &amp;quot;gpt-4o-mini&amp;quot;,             nome: &amp;quot;OpenAI&amp;quot; },

function carregarArquivo() {
  const input = document.getElementById(&amp;quot;arquivo&amp;quot;);

  if (ext === &amp;quot;zip&amp;quot; || ext === &amp;quot;apk&amp;quot;) { carregarZIP(file); return; }
  const reader = new FileReader();
  reader.onload = function(e) {
    codigoOriginal = e.target.result;
    document.getElementById(&amp;quot;cardExplorador&amp;quot;).style.display = &amp;quot;none&amp;quot;;
    arquivosZip = [];
    processarCodigo(file.name);
  };
  reader.readAsText(file, &amp;quot;UTF-8&amp;quot;);
}

async function carregarZIP(file) {
  setStatus(&amp;quot;⏳ Abrindo &amp;quot; + file.name + &amp;quot;...&amp;quot;, &amp;quot;#38bdf8&amp;quot;);
  try {
    const zip = await JSZip.loadAsync(file);
    arquivosZip = [];
    const promessas = [];
    zip.forEach((caminho, entrada) => {
      if (!entrada.dir) {
        const ext = caminho.split('.').pop().toLowerCase();
        const legivel = [&amp;quot;js&amp;quot;,&amp;quot;ts&amp;quot;,&amp;quot;tsx&amp;quot;,&amp;quot;jsx&amp;quot;,&amp;quot;html&amp;quot;,&amp;quot;htm&amp;quot;,&amp;quot;css&amp;quot;,&amp;quot;json&amp;quot;,&amp;quot;txt&amp;quot;,&amp;quot;md&amp;quot;,&amp;quot;xml&amp;quot;,&amp;quot;yaml&amp;quot;,&amp;quot;yml&amp;quot;,&amp;quot;env&amp;quot;,&amp;quot;config&amp;quot;,&amp;quot;gradle&amp;quot;,&amp;quot;properties&amp;quot;,&amp;quot;kt&amp;quot;,&amp;quot;java&amp;quot;,&amp;quot;swift&amp;quot;,&amp;quot;py&amp;quot;,&amp;quot;php&amp;quot;,&amp;quot;cs&amp;quot;].includes(ext);
        arquivosZip.push({ caminho, entrada, ext, legivel, tamanho: 0 });
      }
    });
    for (const arq of arquivosZip) {
      promessas.push(arq.entrada.async(&amp;quot;uint8array&amp;quot;).then(data => { arq.tamanho = data.length; }));
    }
    await Promise.all(promessas);
    arquivosZip.sort((a, b) => { if (a.legivel &amp;amp;&amp;amp; !b.legivel) return -1; if (!a.legivel &amp;amp;&amp;amp; b.legivel) return 1; return a.caminho.localeCompare(b.caminho); });
    renderizarListaArquivos(arquivosZip);
    document.getElementById(&amp;quot;cardExplorador&amp;quot;).style.display = &amp;quot;block&amp;quot;;
    let conteudoTotal = &amp;quot;&amp;quot;, count = 0;
    for (const arq of arquivosZip) {
      if (arq.legivel &amp;amp;&amp;amp; arq.tamanho < 500000) {
        try { const t = await arq.entrada.async(&amp;quot;text&amp;quot;); conteudoTotal += `\n\n${&amp;quot;═&amp;quot;.repeat(60)}\n📄 ARQUIVO: ${arq.caminho}\n${&amp;quot;═&amp;quot;.repeat(60)}\n${t}`; count++; }
        catch(e) {}
      }
    }
    codigoOriginal = conteudoTotal;
    processarCodigo(`${file.name} (${count} arquivos legíveis de ${arquivosZip.length} total)`);
  } catch(e) { setStatus(&amp;quot;❌ Erro ao abrir ZIP/APK: &amp;quot; + e.message, &amp;quot;#ef4444&amp;quot;); }
}

function renderizarListaArquivos(lista) {
  const container = document.getElementById(&amp;quot;listaArquivos&amp;quot;);
  document.getElementById(&amp;quot;contadorArquivos&amp;quot;).textContent = `${lista.length} arquivos`;
  if (!lista.length) { container.innerHTML = '<div style=&amp;quot;color:#64748b; font-size:12px; text-align:center; padding:10px;&amp;quot;>Nenhum arquivo</div>'; return; }
  container.innerHTML = lista.map((arq, i) => {
    const icone = arq.legivel ? &amp;quot;📄&amp;quot; : &amp;quot;🔒&amp;quot;;
    const extClass = [&amp;quot;js&amp;quot;,&amp;quot;ts&amp;quot;,&amp;quot;tsx&amp;quot;,&amp;quot;jsx&amp;quot;].includes(arq.ext) ? &amp;quot;ext-js&amp;quot; : [&amp;quot;html&amp;quot;,&amp;quot;htm&amp;quot;].includes(arq.ext) ? &amp;quot;ext-html&amp;quot; : arq.ext === &amp;quot;json&amp;quot; ? &amp;quot;ext-json&amp;quot; : [&amp;quot;txt&amp;quot;,&amp;quot;md&amp;quot;].includes(arq.ext) ? &amp;quot;ext-txt&amp;quot; : &amp;quot;ext-outro&amp;quot;;
    return `<div class=&amp;quot;arquivo-item&amp;quot; onclick=&amp;quot;abrirArquivoDoZip(${i})&amp;quot; title=&amp;quot;${arq.caminho}&amp;quot;>
      <span>${icone}</span><span class=&amp;quot;ext ${extClass}&amp;quot;>.${arq.ext}</span>
      <span style=&amp;quot;flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;&amp;quot;>${arq.caminho}</span>
      <span style=&amp;quot;color:#475569; font-size:10px; white-space:nowrap;&amp;quot;>${(arq.tamanho/1024).toFixed(1)}KB</span>
    </div>`;
  }).join(&amp;quot;&amp;quot;);
}

function filtrarArquivos() {
  const t = document.getElementById(&amp;quot;campoBuscaArquivo&amp;quot;).value.toLowerCase();
  renderizarListaArquivos(arquivosZip.filter(a => a.caminho.toLowerCase().includes(t)));
}

async function abrirArquivoDoZip(idx) {
  const arq = arquivosZip[idx];
  if (!arq) return;
  if (!arq.legivel) { mostrarNaVisualizacao(`🔒 ${arq.caminho}`, `Arquivo binário — não pode ser lido como texto.\nExtensão: .${arq.ext}\nTamanho: ${(arq.tamanho/1024).toFixed(1)} KB`); return; }
  try {
    const texto = await arq.entrada.async(&amp;quot;text&amp;quot;);
    codigoOriginal = texto; nomArquivo = arq.caminho;
    mostrarNaVisualizacao(`📄 ${arq.caminho}`, texto);
    processarCodigo(arq.caminho);
  } catch(e) { mostrarNaVisualizacao(`❌ Erro`, `Não foi possível ler: ${e.message}`); }
}

// =====================
// PROCESSAR
// =====================
function processarCodigo(nome) {
  const linhas = codigoOriginal.split('\n').length;
  const kb = (codigoOriginal.length / 1024).toFixed(1);
  const funcs = [...codigoOriginal.matchAll(/function\s+(\w+)\s*\(/g)];
  const arrows = [...codigoOriginal.matchAll(/const\s+(\w+)\s*=\s*(?:async\s*)?\(/g)];
  const totalFuncs = funcs.length + arrows.length;
  const jsonMatches = codigoOriginal.match(/\{[^{}]{10,}\}/g) || [];

  document.getElementById(&amp;quot;statLinhas&amp;quot;).textContent = linhas.toLocaleString();
  document.getElementById(&amp;quot;statKB&amp;quot;).textContent = kb;
  document.getElementById(&amp;quot;statFunctions&amp;quot;).textContent = totalFuncs;
  document.getElementById(&amp;quot;statJsons&amp;quot;).textContent = jsonMatches.length;

  let tags = &amp;quot;&amp;quot;;
  if (codigoOriginal.includes(&amp;quot;localStorage&amp;quot;)) tags += '<span class=&amp;quot;tag tag-verde&amp;quot;>🧠 localStorage</span>';
  if (/replit\.com|replit\.dev|REPL_ID|REPLIT/i.test(codigoOriginal)) tags += '<span class=&amp;quot;tag tag-vermelho&amp;quot;>🚨 Replit</span>';

function buscarNoCodigo() {
  const campo = document.getElementById(&amp;quot;campoBusca&amp;quot;).value.trim();
  if (!campo) return;
  if (!codigoOriginal) { alert(&amp;quot;Carregue um arquivo primeiro!&amp;quot;); return; }

  const termos = campo.split(&amp;quot;,&amp;quot;).map(t => t.trim()).filter(Boolean);
  const linhas = codigoOriginal.split('\n');
  const resultados = [];
  const cores = [&amp;quot;busca-destaque&amp;quot;, &amp;quot;busca-destaque-2&amp;quot;, &amp;quot;busca-destaque-3&amp;quot;];

  linhas.forEach((linha, i) => {
    const linhaLower = linha.toLowerCase();
    const termosEncontrados = termos.filter(t => linhaLower.includes(t.toLowerCase()));
    if (termosEncontrados.length > 0) {
      resultados.push({ linha: i + 1, conteudo: linha.trim(), termos: termosEncontrados });
    }
  });

  const container = document.getElementById(&amp;quot;resultadoBusca&amp;quot;);
  if (!resultados.length) {
    container.innerHTML = `<div class=&amp;quot;aviso&amp;quot;>Nenhum resultado para: ${termos.map(t=>`&amp;quot;${t}&amp;quot;`).join(&amp;quot;, &amp;quot;)}</div>`;
    return;
  }

  container.innerHTML = `
    <div class=&amp;quot;aviso-verde&amp;quot; style=&amp;quot;margin-bottom:6px;&amp;quot;>✅ ${resultados.length} linha(s) encontrada(s) para: ${termos.map(t=>`&amp;quot;${t}&amp;quot;`).join(&amp;quot;, &amp;quot;)}</div>
    <div style=&amp;quot;max-height:220px; overflow-y:auto;&amp;quot;>
      ${resultados.slice(0, 60).map(r => {
        let conteudo = r.conteudo;
        r.termos.forEach((t, idx) => {
          const cls = cores[idx % cores.length];
          conteudo = conteudo.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&amp;amp;'), 'gi'), m => `<span class=&amp;quot;${cls}&amp;quot;>${m}</span>`);
        });
        return `<div class=&amp;quot;busca-resultado&amp;quot; onclick=&amp;quot;irParaLinha(${r.linha})&amp;quot;>
          <div class=&amp;quot;busca-linha&amp;quot;>Linha ${r.linha} · encontrou: ${r.termos.join(&amp;quot;, &amp;quot;)}</div>
          <div class=&amp;quot;busca-conteudo&amp;quot;>${conteudo}</div>
        </div>`;
      }).join(&amp;quot;&amp;quot;)}
      ${resultados.length > 60 ? `<div style=&amp;quot;color:#64748b; font-size:11px; text-align:center; padding:6px;&amp;quot;>... e mais ${resultados.length - 60} resultados</div>` : &amp;quot;&amp;quot;}
    </div>
  `;
}

function irParaLinha(numLinha) {
  const linhas = codigoOriginal.split('\n');
  const inicio = Math.max(0, numLinha - 5);
  const fim = Math.min(linhas.length, numLinha + 10);
  const contexto = linhas.slice(inicio, fim).map((l, i) => {
    const n = inicio + i + 1;
    return (n === numLinha ? `>>> ` : `    `) + `[${n}] ${l}`;
  }).join('\n');
  mostrarNaVisualizacao(`🔍 Contexto da Linha ${numLinha}`, contexto);
}

function detectarReplit() {
  if (!codigoOriginal) return alert(&amp;quot;Carregue o arquivo primeiro!&amp;quot;);

  const padroes = [
    { regex: /replit\.com/gi,          tipo: &amp;quot;🌐 URL replit.com&amp;quot;,            solucao: &amp;quot;Substituir pela URL do seu próprio servidor ou GitHub Pages&amp;quot; },
    { regex: /replit\.dev/gi,          tipo: &amp;quot;🌐 URL replit.dev&amp;quot;,            solucao: &amp;quot;Substituir pela URL do seu próprio servidor&amp;quot; },
    { regex: /REPL_ID/g,               tipo: &amp;quot;🔑 Variável REPL_ID&amp;quot;,          solucao: &amp;quot;Remover ou substituir por variável própria&amp;quot; },
    { regex: /REPLIT_DB_URL/g,         tipo: &amp;quot;🗄️ Banco Replit DB&amp;quot;,           solucao: &amp;quot;Substituir por localStorage ou Neon (gratuito)&amp;quot; },
    { regex: /replit\.nix/g,           tipo: &amp;quot;⚙️ Config replit.nix&amp;quot;,         solucao: &amp;quot;Pode remover — é configuração interna da Replit&amp;quot; },
    { regex: /\.replit/g,              tipo: &amp;quot;⚙️ Arquivo .replit&amp;quot;,           solucao: &amp;quot;Pode remover — é configuração interna da Replit&amp;quot; },
    { regex: /\/api\/code-assistant/g, tipo: &amp;quot;🔗 Rota /api/code-assistant&amp;quot;,  solucao: &amp;quot;Substituir por chamada direta à API de IA com sua chave&amp;quot; },
    { regex: /\/api\/tts/g,            tipo: &amp;quot;🔗 Rota /api/tts&amp;quot;,             solucao: &amp;quot;Substituir por Web Speech API (gratuita, funciona no navegador)&amp;quot; },
    { regex: /\/api\//g,               tipo: &amp;quot;🔗 Rota /api/ genérica&amp;quot;,       solucao: &amp;quot;Verificar se é rota da Replit ou do seu próprio backend&amp;quot; },
    { regex: /process\.env\./g,        tipo: &amp;quot;🔑 Variável de ambiente&amp;quot;,      solucao: &amp;quot;Substituir por campo de input para o usuário colar a chave&amp;quot; },
    { regex: /@replit\//g,             tipo: &amp;quot;📦 Pacote @replit/&amp;quot;,           solucao: &amp;quot;Remover ou substituir por alternativa sem Replit&amp;quot; },
    { regex: /replit-dev\.com/g,       tipo: &amp;quot;🌐 Domínio replit-dev&amp;quot;,        solucao: &amp;quot;Substituir pelo seu próprio domínio&amp;quot; },
  ];

  const encontrados = [];
  padroes.forEach(p => {
    linhas.forEach((linha, i) => {
      if (p.regex.test(linha)) { p.regex.lastIndex = 0; encontrados.push({ linha: i+1, tipo: p.tipo, conteudo: linha.trim(), solucao: p.solucao }); }
    });
    p.regex.lastIndex = 0;
  });

  if (!encontrados.length) {
    mostrarNaVisualizacao(&amp;quot;✅ VERIFICAÇÃO REPLIT&amp;quot;, &amp;quot;Nenhum vínculo com a Replit encontrado!\n\nSeu código parece limpo de dependências da Replit.&amp;quot;);
    return;
  }

  const porTipo = {};
  encontrados.forEach(e => { if (!porTipo[e.tipo]) porTipo[e.tipo] = []; porTipo[e.tipo].push(e); });

  let resultado = `🚨 VÍNCULOS COM REPLIT: ${encontrados.length} ocorrências\n${&amp;quot;═&amp;quot;.repeat(60)}\n\n`;
  resultado += &amp;quot;⚠️  Estas partes param de funcionar quando você para de pagar!\n\n&amp;quot; + &amp;quot;═&amp;quot;.repeat(60) + &amp;quot;\n\n&amp;quot;;

  Object.entries(porTipo).forEach(([tipo, itens]) => {

    resultado += `💡 Solução: ${itens[0].solucao}\n${&amp;quot;─&amp;quot;.repeat(40)}\n`;
    itens.slice(0, 5).forEach(item => { resultado += `  Linha ${item.linha}: ${item.conteudo.substring(0, 80)}\n`; });
    if (itens.length > 5) resultado += `  ... e mais ${itens.length - 5} ocorrências\n`;
    resultado += &amp;quot;\n&amp;quot;;
  });
  resultado += `${&amp;quot;═&amp;quot;.repeat(60)}\n💡 PRÓXIMO PASSO: Use '🤖 Pedir IA: Limpar Replit' para corrigir automaticamente.`;

  mostrarNaVisualizacao(`🚨 ${encontrados.length} VÍNCULOS REPLIT`, resultado);

  const listaBlocos = document.getElementById(&amp;quot;listaBlocos&amp;quot;);
  document.getElementById(&amp;quot;tituloBlocos&amp;quot;).textContent = `🚨 ${encontrados.length} Vínculos Replit`;

    </div>
  `).join(&amp;quot;&amp;quot;);
}

// =====================
// DETECTAR BUGS E ERROS DE SINTAXE
// =====================
function detectarBugs() {
  if (!codigoOriginal) return alert(&amp;quot;Carregue o arquivo primeiro!&amp;quot;);
  const linhas = codigoOriginal.split('\n');
  const bugs = [];

  // Padrões de bugs comuns
  const padroesBug = [
    { regex: /console\.log\s*\([^)]*$/, tipo: &amp;quot;🐛 console.log incompleto&amp;quot;, solucao: &amp;quot;Parêntese não fechado — adicione ) no final&amp;quot; },
    { regex: /=\s*undefined\b/, tipo: &amp;quot;⚠️ Atribuição para undefined&amp;quot;, solucao: &amp;quot;Variável recebe 'undefined' diretamente — provavelmente um erro&amp;quot; },
    { regex: /[^=!<>]==[^=]/, tipo: &amp;quot;⚠️ Comparação fraca (==)&amp;quot;, solucao: &amp;quot;Use === em vez de == para comparação segura&amp;quot; },
    { regex: /\.\.\/\.\.\/\.\.\/\.\.\//, tipo: &amp;quot;📁 Caminho relativo muito profundo&amp;quot;, solucao: &amp;quot;Caminho ../../../../ pode estar errado — verifique a estrutura de pastas&amp;quot; },
    { regex: /http:\/\/localhost/, tipo: &amp;quot;🌐 URL localhost no código&amp;quot;, solucao: &amp;quot;URL localhost não funciona em produção — use URL relativa ou variável&amp;quot; },
    { regex: /http:\/\/127\.0\.0\.1/, tipo: &amp;quot;🌐 URL 127.0.0.1 no código&amp;quot;, solucao: &amp;quot;URL local não funciona em produção&amp;quot; },
    { regex: /throw\s+[&amp;quot;']/, tipo: &amp;quot;⚠️ throw com string simples&amp;quot;, solucao: &amp;quot;Use 'throw new Error(...)' em vez de 'throw \&amp;quot;...\&amp;quot;'&amp;quot; },
    { regex: /catch\s*\(\s*\)\s*\{/, tipo: &amp;quot;🐛 catch vazio sem variável de erro&amp;quot;, solucao: &amp;quot;Use catch(e) para capturar o erro e saber o que deu errado&amp;quot; },
    { regex: /var\s+\w+/, tipo: &amp;quot;⚠️ Uso de 'var' (obsoleto)&amp;quot;, solucao: &amp;quot;Prefira 'const' ou 'let' em vez de 'var'&amp;quot; },
    { regex: /XMLHttpRequest/, tipo: &amp;quot;🌐 XMLHttpRequest (obsoleto)&amp;quot;, solucao: &amp;quot;Substitua por fetch() que é mais moderno e simples&amp;quot; },
    { regex: /innerHTML\s*\+=/, tipo: &amp;quot;⚠️ innerHTML += (lento e inseguro)&amp;quot;, solucao: &amp;quot;Pode causar problemas de performance — considere usar textContent ou createElement&amp;quot; },
    { regex: /eval\s*\(/, tipo: &amp;quot;🔴 EVAL detectado (perigoso)&amp;quot;, solucao: &amp;quot;eval() é perigoso e pode ser bloqueado pelo navegador — evite usar&amp;quot; },
    { regex: /document\.write\s*\(/, tipo: &amp;quot;⚠️ document.write (obsoleto)&amp;quot;, solucao: &amp;quot;Substituir por getElementById + innerHTML ou appendChild&amp;quot; },
    { regex: /\bNaN\b/, tipo: &amp;quot;🐛 Comparação com NaN&amp;quot;, solucao: &amp;quot;NaN nunca é igual a nada — use isNaN() ou Number.isNaN() para verificar&amp;quot; },
    { regex: /setTimeout\s*\([^,]+,\s*0\s*\)/, tipo: &amp;quot;⚠️ setTimeout com 0ms&amp;quot;, solucao: &amp;quot;setTimeout com 0ms é hack — verifique se há forma melhor&amp;quot; },
    { regex: /async\s+function.*(?!await)/, tipo: &amp;quot;⚠️ Função async sem await&amp;quot;, solucao: &amp;quot;Função declarada async mas pode não usar await — verifique se é necessário&amp;quot; },
  ];

  linhas.forEach((linha, i) => {
    const trim = linha.trim();
    if (!trim || trim.startsWith(&amp;quot;//&amp;quot;) || trim.startsWith(&amp;quot;*&amp;quot;)) return;
    padroesBug.forEach(p => {
      if (p.regex.test(linha)) {
        bugs.push({ linha: i+1, tipo: p.tipo, conteudo: trim.substring(0, 80), solucao: p.solucao });
      }
    });
  });

  // Verificar balanço de chaves (básico)
  let abertas = 0, fechadas = 0;
  let primeiraDesbalanceada = -1;
  for (let i = 0; i < linhas.length; i++) {
    const l = linhas[i];
    for (const c of l) {
      if (c === '{') abertas++;
      if (c === '}') { fechadas++; if (fechadas > abertas &amp;amp;&amp;amp; primeiraDesbalanceada === -1) primeiraDesbalanceada = i+1; }
    }
  }
  if (abertas !== fechadas) {
    bugs.push({
      linha: primeiraDesbalanceada > 0 ? primeiraDesbalanceada : linhas.length,
      tipo: `🔴 CHAVES DESBALANCEADAS: ${abertas} abertas × ${fechadas} fechadas`,
      conteudo: `Diferença de ${Math.abs(abertas-fechadas)} chave(s) ${abertas > fechadas ? 'faltando fechar }' : 'sobrando }'}`,
      solucao: abertas > fechadas ? `Falta(m) ${abertas-fechadas} chave(s) de fechamento } no código` : `Sobra(m) ${fechadas-abertas} chave(s) de fechamento }`
    });
  }

  // Verificar parênteses
  let parenA = 0, parenF = 0;
  for (const l of linhas) { for (const c of l) { if (c==='(') parenA++; if (c===')') parenF++; } }
  if (parenA !== parenF) {
    bugs.push({
      linha: linhas.length,
      tipo: `🔴 PARÊNTESES DESBALANCEADOS: ${parenA} abertos × ${parenF} fechados`,
      conteudo: `Diferença de ${Math.abs(parenA-parenF)} parêntese(s)`,
      solucao: parenA > parenF ? `Falta(m) ${parenA-parenF} parêntese(s) de fechamento )` : `Sobra(m) ${parenF-parenA} parêntese(s) de fechamento )`
    });
  }

  if (!bugs.length) {
    mostrarNaVisualizacao(&amp;quot;✅ VERIFICAÇÃO DE BUGS&amp;quot;, &amp;quot;Nenhum bug óbvio detectado!\n\nIsso não significa que o código está 100% correto — bugs de lógica precisam da IA para serem encontrados.\n\n💡 Use '🔧 Pedir IA: Corrigir Bugs' para uma análise mais profunda.&amp;quot;);
    return;
  }

  let resultado = `🐛 ${bugs.length} PROBLEMA(S) ENCONTRADO(S)\n${&amp;quot;═&amp;quot;.repeat(60)}\n\n`;
  bugs.forEach((b, i) => {
    resultado += `${i+1}. ${b.tipo}\n`;
    resultado += `   Linha ${b.linha}: ${b.conteudo}\n`;
    resultado += `   💡 ${b.solucao}\n\n`;
  });
  resultado += `${&amp;quot;═&amp;quot;.repeat(60)}\n💡 Use '🤖 Pedir IA: Corrigir Bugs' para corrigir automaticamente.`;

  mostrarNaVisualizacao(`🐛 ${bugs.length} PROBLEMAS DETECTADOS`, resultado);

  document.getElementById(&amp;quot;tituloBlocos&amp;quot;).textContent = `🐛 ${bugs.length} Bugs Encontrados`;
  document.getElementById(&amp;quot;cardBlocos&amp;quot;).style.display = &amp;quot;block&amp;quot;;
  document.getElementById(&amp;quot;listaBlocos&amp;quot;).innerHTML = bugs.map((b, i) => `
    <div class=&amp;quot;bug-item&amp;quot; onclick=&amp;quot;irParaLinha(${b.linha})&amp;quot;>
      <div class=&amp;quot;bug-tipo&amp;quot;>${b.tipo}</div>
      <div class=&amp;quot;bug-linha&amp;quot;>Linha ${b.linha}</div>
      <div class=&amp;quot;bug-desc&amp;quot;>${b.conteudo}</div>
      <div class=&amp;quot;bug-solucao&amp;quot;>💡 ${b.solucao}</div>
    </div>
  `).join(&amp;quot;&amp;quot;);
}

function detectarConflitos() {
  if (!codigoOriginal) return alert(&amp;quot;Carregue o arquivo primeiro!&amp;quot;);
  const linhas = codigoOriginal.split('\n');
  const conflitos = [];
  const importados = new Map();
  const usados = new Set();

  // Coletar imports/requires
  linhas.forEach((linha, i) => {
    const importMatch = linha.match(/import\s+.*?\s+from\s+['&amp;quot;](.+?)['&amp;quot;]/);
    const requireMatch = linha.match(/require\s*\(\s*['&amp;quot;](.+?)['&amp;quot;]\s*\)/);
    const scriptMatch = linha.match(/src=[&amp;quot;'].*?([\w@/-]+\.js)[&amp;quot;']/);

    if (importMatch) importados.set(importMatch[1], i+1);
    if (requireMatch) importados.set(requireMatch[1], i+1);
    if (scriptMatch) importados.set(scriptMatch[1], i+1);
  });

  // Verificar conflitos conhecidos
  const conflitosConhecidos = [
    { libs: [&amp;quot;react&amp;quot;, &amp;quot;react-dom&amp;quot;], descricao: &amp;quot;React detectado&amp;quot;, nota: &amp;quot;Verifique se as versões de react e react-dom são iguais&amp;quot; },
    { libs: [&amp;quot;jquery&amp;quot;, &amp;quot;react&amp;quot;], descricao: &amp;quot;jQuery + React&amp;quot;, nota: &amp;quot;Mistura de jQuery com React pode causar conflitos de DOM&amp;quot; },
    { libs: [&amp;quot;moment&amp;quot;, &amp;quot;date-fns&amp;quot;], descricao: &amp;quot;Duas libs de data&amp;quot;, nota: &amp;quot;Moment.js e date-fns fazem a mesma coisa — use apenas uma&amp;quot; },
    { libs: [&amp;quot;lodash&amp;quot;, &amp;quot;underscore&amp;quot;], descricao: &amp;quot;Duas libs de utilitários&amp;quot;, nota: &amp;quot;Lodash e Underscore se sobrepõem — use apenas uma&amp;quot; },
    { libs: [&amp;quot;axios&amp;quot;, &amp;quot;fetch&amp;quot;], descricao: &amp;quot;Axios + fetch&amp;quot;, nota: &amp;quot;Axios e fetch fazem requisições HTTP — mantenha apenas um padrão&amp;quot; },
    { libs: [&amp;quot;bootstrap&amp;quot;, &amp;quot;tailwind&amp;quot;], descricao: &amp;quot;Bootstrap + Tailwind&amp;quot;, nota: &amp;quot;Duas libs CSS pode causar conflito de estilos&amp;quot; },
    { libs: [&amp;quot;webpack&amp;quot;, &amp;quot;vite&amp;quot;], descricao: &amp;quot;Webpack + Vite&amp;quot;, nota: &amp;quot;Dois bundlers diferentes — use apenas um&amp;quot; },
  ];

  conflitosConhecidos.forEach(c => {
    const encontradas = c.libs.filter(lib => {
      return [...importados.keys()].some(k => k.toLowerCase().includes(lib)) ||
             codigoOriginal.toLowerCase().includes(`&amp;quot;${lib}&amp;quot;`) ||
             codigoOriginal.toLowerCase().includes(`'${lib}'`);
    });
    if (encontradas.length >= 2) {
      conflitos.push({ tipo: `⚡ ${c.descricao}`, libs: encontradas, nota: c.nota });
    }
  });

  // Verificar variáveis declaradas mas não usadas (simplificado)
  const varsDeclaradas = [];
  linhas.forEach((linha, i) => {
    const m = linha.match(/^(?:const|let|var)\s+(\w+)\s*=/);
    if (m &amp;amp;&amp;amp; m[1].length > 2) varsDeclaradas.push({ nome: m[1], linha: i+1 });
  });

  const codigoSemDecls = codigoOriginal.replace(/^(?:const|let|var)\s+\w+\s*=.*$/gm, '');
  let naoUsadas = 0;
  varsDeclaradas.slice(0, 30).forEach(v => {
    const regex = new RegExp(`\\b${v.nome}\\b`, 'g');
    const ocorrencias = (codigoSemDecls.match(regex) || []).length;
    if (ocorrencias === 0) {
      naoUsadas++;
      if (naoUsadas <= 10) conflitos.push({ tipo: `⚠️ Variável declarada mas não usada`, libs: [v.nome], nota: `Linha ${v.linha}: '${v.nome}' foi declarada mas nunca usada no código` });
    }
  });

  // Múltiplas declarações da mesma variável
  const nomesVars = varsDeclaradas.map(v => v.nome);
  const duplicadas = nomesVars.filter((v, i) => nomesVars.indexOf(v) !== i);
  [...new Set(duplicadas)].slice(0, 5).forEach(nome => {
    const linhasD = varsDeclaradas.filter(v => v.nome === nome).map(v => v.linha).join(&amp;quot;, &amp;quot;);
    conflitos.push({ tipo: `🔴 Variável declarada mais de uma vez`, libs: [nome], nota: `'${nome}' foi declarada nas linhas: ${linhasD}` });
  });

  if (!conflitos.length) {
    mostrarNaVisualizacao(&amp;quot;✅ VERIFICAÇÃO DE CONFLITOS&amp;quot;, &amp;quot;Nenhum conflito de dependência óbvio detectado!\n\nPara uma análise mais profunda, use '🤖 Consultar IA' e pergunte:\n'Este código tem conflitos de dependência ou variáveis duplicadas?'&amp;quot;);
    return;
  }

  let resultado = `⚡ ${conflitos.length} CONFLITO(S) DETECTADO(S)\n${&amp;quot;═&amp;quot;.repeat(60)}\n\n`;
  conflitos.forEach((c, i) => {
    resultado += `${i+1}. ${c.tipo}\n`;
    if (c.libs.length > 0) resultado += `   Envolvidos: ${c.libs.join(&amp;quot;, &amp;quot;)}\n`;
    resultado += `   ⚠️ ${c.nota}\n\n`;
  });
  resultado += `${&amp;quot;═&amp;quot;.repeat(60)}\n💡 Para corrigir, use '🤖 Pedir IA: Corrigir Bugs' ou pergunte à IA sobre cada conflito.`;

  mostrarNaVisualizacao(`⚡ ${conflitos.length} CONFLITOS ENCONTRADOS`, resultado);
}

function mostrarFunctions() {

  linhas.forEach((linha, i) => {

    if (mFunc) blocos.push({ tipo: 'function', nome: mFunc[1], linha: i+1, preview: limpada.substring(0, 80) });
    const mArrow = limpada.match(/^(?:export\s+)?(?:const|let)\s+(\w+)\s*=\s*(?:async\s*)?\(/);
    if (mArrow) blocos.push({ tipo: 'arrow', nome: mArrow[1], linha: i+1, preview: limpada.substring(0, 80) });
    const mClasse = limpada.match(/^class\s+(\w+)/);
    if (mClasse) blocos.push({ tipo: 'classe', nome: mClasse[1], linha: i+1, preview: limpada.substring(0, 80) });
    if (limpada.includes(&amp;quot;localStorage&amp;quot;)) blocos.push({ tipo: 'local', nome: 'localStorage', linha: i+1, preview: limpada.substring(0, 80) });
    if (limpada.includes(&amp;quot;fetch(&amp;quot;) || limpada.includes(&amp;quot;apiKey&amp;quot;)) blocos.push({ tipo: 'api', nome: 'API/fetch', linha: i+1, preview: limpada.substring(0, 80) });
  });

  document.getElementById(&amp;quot;tituloBlocos&amp;quot;).textContent = `📋 ${blocos.length} Blocos Encontrados`;
  document.getElementById(&amp;quot;cardBlocos&amp;quot;).style.display = &amp;quot;block&amp;quot;;
  if (!blocos.length) { document.getElementById(&amp;quot;listaBlocos&amp;quot;).innerHTML = '<div class=&amp;quot;aviso&amp;quot;>Nenhuma function encontrada. O código pode estar minificado.</div>'; return; }
  document.getElementById(&amp;quot;listaBlocos&amp;quot;).innerHTML = blocos.map((b, idx) => {
    const cor = b.tipo === 'local' ? 'local' : b.tipo === 'api' ? 'api' : b.tipo === 'classe' ? 'classe' : 'function';
    return `<div class=&amp;quot;item-funcao ${cor}&amp;quot; onclick=&amp;quot;extrairFuncaoEspecifica(${idx})&amp;quot;>
      <div class=&amp;quot;nome-funcao&amp;quot;>${b.nome}</div>
      <div class=&amp;quot;desc-funcao&amp;quot;>${b.preview}</div>
      <div class=&amp;quot;linha-funcao&amp;quot;>Linha ${b.linha} · ${b.tipo}</div>
    </div>`;
  }).join(&amp;quot;&amp;quot;);
  window._blocos = blocos;
  mostrarNaVisualizacao(`⚡ ${blocos.length} FUNÇÕES`, blocos.map(b => `[Linha ${b.linha}] ${b.tipo.toUpperCase()}: ${b.nome}\n  ${b.preview}`).join('\n\n'));
}

function extrairFuncaoEspecifica(idx) {
  const bloco = window._blocos[idx];
  if (!bloco) return;
  const linhas = codigoOriginal.split('\n');
  let codigo = &amp;quot;&amp;quot;, abertas = 0, comecou = false;
  for (let i = bloco.linha - 1; i < Math.min(bloco.linha + 200, linhas.length); i++) {
    const linha = linhas[i]; codigo += linha + '\n';
    for (const c of linha) { if (c==='{'){abertas++;comecou=true;} if(c==='}')abertas--; }
    if (comecou &amp;amp;&amp;amp; abertas <= 0) break;
  }
  mostrarNaVisualizacao(`📋 BLOCO: ${bloco.nome} (Linha ${bloco.linha})`, codigo);
}

// =====================

// =====================
function organizarCodigo() {
  if (!codigoOriginal) return alert(&amp;quot;Carregue o arquivo primeiro!&amp;quot;);
  let organizado = codigoOriginal.replace(/;(?!\n)/g,';\n').replace(/\{(?!\n)/g,'{\n').replace(/\}(?!\n)/g,'}\n').replace(/,(?!\n)(?!\s)/g,',\n').replace(/\n{3,}/g,'\n\n');
  const linhas = organizado.split('\n');
  let nivel = 0;
  const indentado = linhas.map(linha => {
    const trim = linha.trim();
    if (!trim) return '';
    if (trim.startsWith('}') || trim.startsWith(']')) nivel = Math.max(0, nivel-1);
    const resultado = '  '.repeat(nivel) + trim;
    if (trim.endsWith('{') || trim.endsWith('[')) nivel++;
    return resultado;
  });
  mostrarNaVisualizacao(&amp;quot;✨ CÓDIGO ORGANIZADO&amp;quot;, indentado.join('\n'));
}

async function consultarIA(perguntaOverride) {
  const chave = document.getElementById(&amp;quot;iaApiKey&amp;quot;).value.trim();
  if (!chave) { alert(&amp;quot;Cole sua chave de API no painel da IA.&amp;quot;); return; }
  const pergunta = perguntaOverride || document.getElementById(&amp;quot;iaPergunta&amp;quot;).value.trim();
  if (!pergunta) { alert(&amp;quot;Digite uma pergunta para a IA.&amp;quot;); return; }
  const provedor = detectarProvedor(chave);
  if (!provedor) { alert(&amp;quot;Chave não reconhecida. Use: gsk_ (Groq), AIza (Gemini), sk- (OpenAI), sk-or- (OpenRouter), xai- (xAI), sk-ant (Anthropic)&amp;quot;); return; }

  const contexto = codigoOriginal
    ? `\n\nCÓDIGO ATUAL (${nomArquivo || &amp;quot;sem nome&amp;quot;}, ${(codigoOriginal.length/1024).toFixed(1)}KB):\n\`\`\`\n${codigoOriginal.substring(0, 8000)}${codigoOriginal.length > 8000 ? &amp;quot;\n... [truncado]&amp;quot; : &amp;quot;&amp;quot;}\n\`\`\``
    : &amp;quot;&amp;quot;;

  const btn = document.getElementById(&amp;quot;btnConsultarIA&amp;quot;);
  btn.disabled = true; btn.innerHTML = '<span class=&amp;quot;spinner&amp;quot;></span>Consultando...';
  const respostaEl = document.getElementById(&amp;quot;iaResposta&amp;quot;);
  respostaEl.style.display = &amp;quot;block&amp;quot;; respostaEl.textContent = &amp;quot;⏳ Aguardando resposta...&amp;quot;;

  try {
    const resp = await fetch(`${provedor.url}/chat/completions`, {
      method: &amp;quot;POST&amp;quot;,
      headers: { &amp;quot;Content-Type&amp;quot;: &amp;quot;application/json&amp;quot;, &amp;quot;Authorization&amp;quot;: `Bearer ${chave}` },
      body: JSON.stringify({
        model: provedor.model,
        messages: [
          { role: &amp;quot;system&amp;quot;, content: &amp;quot;Você é especialista em análise e limpeza de código. Responda sempre em português brasileiro. Seja direto e prático para usuário leigo. Quando sugerir código, forneça completo e pronto para usar.&amp;quot; },
          { role: &amp;quot;user&amp;quot;, content: pergunta + contexto }
        ],
        max_tokens: 2000, temperature: 0.3
      })
    });

    if (!resp.ok) { const err = await resp.json().catch(() => ({})); throw new Error(err?.error?.message || `Erro ${resp.status}`); }
    const data = await resp.json();
    const resposta = data.choices?.[0]?.message?.content || &amp;quot;Sem resposta.&amp;quot;;
    respostaEl.textContent = resposta;
    mostrarNaVisualizacao(`🤖 RESPOSTA DA IA (${provedor.nome})`, resposta);
    salvarNoHistorico(pergunta, resposta, provedor.nome); // ← SALVA NO HISTÓRICO
  } catch(e) {
    const msg = `❌ Erro: ${e.message}\n\nVerifique se a chave está correta e tem créditos disponíveis.`;
    respostaEl.textContent = msg;
  } finally {
    btn.disabled = false; btn.innerHTML = '🤖 Consultar IA';
  }
}

function mostrarNaVisualizacao(titulo, conteudo) {
  document.getElementById(&amp;quot;tituloVisualizacao&amp;quot;).textContent = titulo;

function copiarVisualizacao() {
  const texto = document.getElementById(&amp;quot;areaVisualizacao&amp;quot;).textContent;
  if (!texto) return;
  navigator.clipboard.writeText(texto).then(() => {
    const btn = event.target.closest(&amp;quot;button&amp;quot;);
    const original = btn.textContent;
    btn.textContent = &amp;quot;✅ Copiado!&amp;quot;; btn.classList.add(&amp;quot;copiado&amp;quot;);
    setTimeout(() => { btn.textContent = original; btn.classList.remove(&amp;quot;copiado&amp;quot;); }, 2000);
  });
}

function baixarVisualizacao() {

function setStatus(html, cor) { const el = document.getElementById(&amp;quot;statusCarga&amp;quot;); el.innerHTML = html; el.style.color = cor; }

function baixarTexto(conteudo, nome) {
  const blob = new Blob([conteudo], { type: &amp;quot;text/plain&amp;quot; });
  const url = URL.createObjectURL(blob);
  const a = document.createElement(&amp;quot;a&amp;quot;); a.href = url; a.download = nome; a.click();
  URL.revokeObjectURL(url);
}
