<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Peças Jurídicas - TRF6/JEF</title>

<!-- Bibliotecas para ícones e estilos básicos -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

<style>
  /* --- ESTILOS GERAIS DA INTERFACE (UI) --- */
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; font-family: "Segoe UI", sans-serif; background: #eef2f6; height: 100vh; display: flex; overflow: hidden; }
  
  /* Painel Lateral (Editor) */
  aside { width: 40%; background: #fff; border-right: 1px solid #ccc; display: flex; flex-direction: column; box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 10; }
  
  .editor-header { padding: 15px; background: #2c3e50; color: white; display: flex; justify-content: space-between; align-items: center; }
  .editor-header h2 { margin: 0; font-size: 18px; }
  
  .editor-content { flex: 1; overflow-y: auto; padding: 20px; }
  
  .section-title { font-size: 12px; text-transform: uppercase; color: #7f8c8d; font-weight: bold; margin-top: 20px; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
  
  .input-group { margin-bottom: 12px; }
  .input-group label { display: block; font-size: 13px; font-weight: 600; color: #34495e; margin-bottom: 4px; }
  input, textarea, select { width: 100%; padding: 8px; border: 1px solid #bdc3c7; border-radius: 4px; font-family: inherit; font-size: 14px; transition: 0.2s; }
  input:focus, textarea:focus { border-color: #3498db; outline: none; box-shadow: 0 0 3px rgba(52,152,219,0.3); }
  textarea { resize: vertical; min-height: 60px; }

  /* Botões de Ação */
  .toolbar { padding: 15px; background: #f8f9fa; border-top: 1px solid #ddd; display: flex; gap: 10px; flex-wrap: wrap; }
  button { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
  
  .btn-add { background: #3498db; color: white; flex: 1; justify-content: center; }
  .btn-add:hover { background: #2980b9; }
  
  .btn-word { background: #27ae60; color: white; }
  .btn-word:hover { background: #219150; }
  
  .btn-print { background: #e67e22; color: white; }
  .btn-print:hover { background: #d35400; }

  /* Blocos Dinâmicos */
  .dynamic-block { background: #fdfdfd; border: 1px solid #e0e0e0; padding: 10px; border-radius: 5px; margin-bottom: 10px; position: relative; border-left: 4px solid #bdc3c7; }
  .dynamic-block.type-titulo { border-left-color: #2c3e50; }
  .dynamic-block.type-paragrafo { border-left-color: #3498db; }
  .dynamic-block.type-citacao { border-left-color: #9b59b6; }
  
  .block-header { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 11px; color: #777; text-transform: uppercase; font-weight: bold; }
  .btn-remove { background: transparent; color: #c0392b; padding: 0; font-size: 14px; }
  .btn-remove:hover { color: #e74c3c; background: transparent; }

  /* --- VISUALIZAÇÃO (PREVIEW / PAPEL) --- */
  main { flex: 1; background: #525659; overflow-y: auto; padding: 40px; display: flex; justify-content: center; }
  
  #folhaA4 {
    background: white;
    width: 210mm;
    min-height: 297mm;
    padding: 3cm 2cm 2cm 3cm; /* Margens ABNT: Sup/Esq 3cm, Inf/Dir 2cm */
    box-shadow: 0 0 15px rgba(0,0,0,0.5);
    position: relative;
  }

  /* --- ESTILOS JURÍDICOS (O QUE VAI PRO WORD/PDF) --- */
  .juridico { font-family: "Times New Roman", Times, serif; color: #000; line-height: 1.5; font-size: 12pt; text-align: justify; }
  
  .juridico p { margin-bottom: 10px; text-indent: 2cm; margin-top: 0; }
  
  .juridico h1 { text-align: center; font-size: 12pt; font-weight: bold; text-transform: uppercase; margin-top: 20px; margin-bottom: 20px; }
  
  .juridico h2 { font-size: 12pt; font-weight: bold; text-transform: uppercase; margin-top: 20px; margin-bottom: 10px; }
  
  .juridico .enderecamento { text-align: center; font-weight: bold; text-transform: uppercase; margin-bottom: 30px; font-size: 12pt; }
  
  .juridico .qualificacao { margin-bottom: 20px; text-indent: 2cm; }
  
  /* Estilo Específico para Citação de Jurisprudência */
  .juridico .citacao {
    font-size: 10pt;
    line-height: 1.0; /* Espaçamento simples */
    margin-left: 4cm; /* Recuo de 4cm */
    margin-bottom: 15px;
    margin-top: 15px;
    text-align: justify;
    font-style: italic;
  }

  .juridico .fechamento { margin-top: 40px; text-align: center; font-weight: bold; }
  .juridico .data-local { margin-top: 20px; text-align: center; }

  /* --- IMPRESSÃO --- */
  @media print {
    body { background: white; display: block; height: auto; overflow: visible; }
    aside, .toolbar { display: none !important; }
    main { padding: 0; background: white; display: block; }
    #folhaA4 { width: 100%; box-shadow: none; margin: 0; padding: 0; }
    @page { margin: 3cm 2cm 2cm 3cm; size: A4; }
  }
</style>
</head>
<body>

<!-- PAINEL DE EDIÇÃO -->
<aside>
  <div class="editor-header">
    <h2><i class="fas fa-gavel"></i> Editor Jurídico</h2>
  </div>

  <div class="editor-content" id="formContainer">
    
    <!-- Cabeçalho -->
    <div class="section-title">1. Cabeçalho & Partes</div>
    <div class="input-group">
      <label>Endereçamento (Juízo):</label>
      <input type="text" id="inp_enderecamento" value="EXCELENTÍSSIMO(A) SENHOR(A) DOUTOR(A) JUIZ(A) FEDERAL DA ___ TURMA RECURSAL DO TRF6" oninput="renderDoc()">
    </div>
    <div class="input-group">
      <label>Número do Processo:</label>
      <input type="text" id="inp_processo" placeholder="0000000-00.2024.4.06.XXXX" oninput="renderDoc()">
    </div>
    <div class="input-group">
      <label>Nome da Peça (Título):</label>
      <input type="text" id="inp_peca" value="EMBARGOS DE DECLARAÇÃO" oninput="renderDoc()">
    </div>
    <div class="input-group">
      <label>Preâmbulo (Qualificação):</label>
      <textarea id="inp_qualificacao" oninput="renderDoc()">NOME DO AUTOR, já qualificado nos autos em epígrafe, movido em face do INSS, vem, respeitosamente, por seu advogado, apresentar:</textarea>
    </div>

    <!-- Corpo Dinâmico -->
    <div class="section-title">2. Fundamentação & Tópicos</div>
    <div id="blocksContainer">
      <!-- Blocos serão inseridos aqui via JS -->
    </div>

    <div style="display:flex; gap:5px; margin-top:10px;">
      <button class="btn-add" style="background:#2c3e50" onclick="addBlock('titulo')"><i class="fas fa-heading"></i> Título</button>
      <button class="btn-add" onclick="addBlock('paragrafo')"><i class="fas fa-paragraph"></i> Texto</button>
      <button class="btn-add" style="background:#8e44ad" onclick="addBlock('citacao')"><i class="fas fa-quote-right"></i> Citação</button>
    </div>

    <!-- Fechamento -->
    <div class="section-title">3. Fechamento</div>
    <div class="input-group">
      <label>Pedidos Finais:</label>
      <textarea id="inp_pedidos" placeholder="Diante do exposto, requer..." oninput="renderDoc()"></textarea>
    </div>
    <div class="input-group">
      <label>Local e Data:</label>
      <input type="text" id="inp_data" value="Belo Horizonte, data do protocolo." oninput="renderDoc()">
    </div>
    <div class="input-group">
      <label>Advogado / OAB:</label>
      <textarea id="inp_advogado" oninput="renderDoc()">Nome do Advogado&#10;OAB/MG 00.000</textarea>
    </div>

  </div>

  <div class="toolbar">
    <button class="btn-word" onclick="exportWord()"><i class="fas fa-file-word"></i> Baixar Word (.doc)</button>
    <button class="btn-print" onclick="window.print()"><i class="fas fa-file-pdf"></i> Imprimir / PDF</button>
  </div>
</aside>

<!-- VISUALIZAÇÃO -->
<main>
  <div id="folhaA4" class="juridico">
    <!-- O conteúdo será renderizado aqui -->
  </div>
</main>

<script>
  // Estado inicial dos blocos dinâmicos
  let blocks = [
    { type: 'titulo', content: 'I – DA SÍNTESE FÁTICA' },
    { type: 'paragrafo', content: 'Trata-se de ação previdenciária visando a concessão de benefício...' },
    { type: 'titulo', content: 'II – DA OMISSÃO / CONTRADIÇÃO' },
    { type: 'paragrafo', content: 'O acórdão embargado restou omisso quanto à aplicação do Tema X...' },
    { type: 'citacao', content: 'EMENTA: PREVIDENCIÁRIO. EMBARGOS. OMISSÃO VERIFICADA. NECESSIDADE DE INTEGRALIZAÇÃO DO JULGADO. (TRF6, Processo nº ...)' }
  ];

  // Função para adicionar novo bloco
  function addBlock(type) {
    let content = '';
    if (type === 'titulo') content = 'NOVO TÍTULO';
    if (type === 'paragrafo') content = '';
    if (type === 'citacao') content = 'Cole aqui a jurisprudência ou doutrina...';
    
    blocks.push({ type, content });
    renderBlocksInputs();
    renderDoc();
  }

  // Função para remover bloco
  function removeBlock(index) {
    blocks.splice(index, 1);
    renderBlocksInputs();
    renderDoc();
  }

  // Função para atualizar o conteúdo do array 'blocks' ao digitar
  function updateBlockContent(index, value) {
    blocks[index].content = value;
    renderDoc();
  }

  // Renderiza os inputs no painel esquerdo
  function renderBlocksInputs() {
    const container = document.getElementById('blocksContainer');
    container.innerHTML = '';

    blocks.forEach((block, index) => {
      const div = document.createElement('div');
      div.className = `dynamic-block type-${block.type}`;
      
      let label = block.type.toUpperCase();
      let inputHtml = '';

      if (block.type === 'titulo') {
        inputHtml = `<input type="text" value="${block.content}" oninput="updateBlockContent(${index}, this.value)">`;
      } else {
        inputHtml = `<textarea oninput="updateBlockContent(${index}, this.value)">${block.content}</textarea>`;
      }

      div.innerHTML = `
        <div class="block-header">
          <span><i class="fas fa-layer-group"></i> ${label}</span>
          <button class="btn-remove" onclick="removeBlock(${index})" title="Remover"><i class="fas fa-trash"></i></button>
        </div>
        ${inputHtml}
      `;
      container.appendChild(div);
    });
  }

  // Renderiza o documento final (Preview)
  function renderDoc() {
    const folha = document.getElementById('folhaA4');
    
    // Pegar valores fixos
    const enderecamento = document.getElementById('inp_enderecamento').value;
    const processo = document.getElementById('inp_processo').value;
    const peca = document.getElementById('inp_peca').value;
    const qualificacao = document.getElementById('inp_qualificacao').value.replace(/\n/g, '<br>');
    const pedidos = document.getElementById('inp_pedidos').value.replace(/\n/g, '<br>');
    const dataLocal = document.getElementById('inp_data').value;
    const advogado = document.getElementById('inp_advogado').value.replace(/\n/g, '<br>');

    let html = `
      <div class="enderecamento">${enderecamento}</div>
      <p style="text-indent:0; margin-bottom:20px;"><b>Processo nº: ${processo}</b></p>
      
      <div class="qualificacao">
        ${qualificacao} <b>${peca}</b>, com fundamento na legislação vigente, pelas razões de fato e de direito a seguir expostas:
      </div>
    `;

    // Loop pelos blocos dinâmicos
    blocks.forEach(block => {
      const txt = block.content.replace(/\n/g, '<br>');
      if (block.type === 'titulo') {
        html += `<h2>${txt}</h2>`;
      } else if (block.type === 'paragrafo') {
        html += `<p>${txt}</p>`;
      } else if (block.type === 'citacao') {
        html += `<div class="citacao">"${txt}"</div>`;
      }
    });

    // Fechamento
    if (pedidos) {
      html += `<h2>DOS PEDIDOS</h2><p>${pedidos}</p>`;
    }

    html += `
      <div class="data-local">Termos em que,<br>Pede deferimento.<br><br>${dataLocal}</div>
      <div class="fechamento">${advogado}</div>
    `;

    folha.innerHTML = html;
  }

  // Função de Exportação para Word
  function exportWord() {
    const content = document.getElementById('folhaA4').innerHTML;
    
    // CSS Inline para garantir que o Word entenda a formatação
    const css = `
      <style>
        body { font-family: 'Times New Roman', serif; font-size: 12pt; }
        p { text-indent: 2cm; margin-bottom: 10pt; line-height: 1.5; text-align: justify; }
        h2 { font-weight: bold; text-transform: uppercase; margin-top: 20pt; font-size: 12pt; }
        .enderecamento { text-align: center; font-weight: bold; text-transform: uppercase; margin-bottom: 30pt; }
        .citacao { 
          margin-left: 4cm; 
          font-size: 10pt; 
          font-style: italic; 
          text-align: justify; 
          line-height: 1.0;
          margin-top: 10pt;
          margin-bottom: 10pt;
        }
        .fechamento { text-align: center; font-weight: bold; margin-top: 40pt; }
        .data-local { text-align: center; margin-top: 20pt; }
      </style>
    `;

    const blob = new Blob(['\ufeff', `<html><head>${css}</head><body>${content}</body></html>`], {
      type: 'application/msword'
    });
    
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `${document.getElementById('inp_peca').value || 'Peca_Juridica'}.doc`;
    link.click();
  }

  // Inicialização
  window.onload = () => {
    renderBlocksInputs();
    renderDoc();
  };
</script>

</body>
</html>
