<p style="color:#666">Copie seus códigos HTML aqui embaixo 👇</p>
<textarea style="width:95%;height:200px;font-family:monospace;font-size:14px" placeholder="Cole aqui o código HTML que funcionou..."></textarea>
<button onclick="salvarCodigos()" style="background:green;color:white;border:none;padding:15px 30px;border-radius:10px;font-size:16px;cursor:pointer">💾 SALVAR MEUS CÓDIGOS</button>

<script>
function salvarCodigos(){
  const codigos = document.querySelector('textarea').value;
  if(codigos){
    localStorage.setItem('meusCodigos', codigos);
    alert('✅ SALVOS! Reabra a página.');
  }
}
window.onload = () => {
  const salvos = localStorage.getItem('meusCodigos');
  if(salvos) document.querySelector('textarea').value = salvos;
}
</script>
