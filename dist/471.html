<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analisador de Código</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f1117; color: #e0e0e0; font-family: sans-serif; padding: 16px; }

  h1 { text-align: center; color: #7c9fff; margin-bottom: 6px; font-size: 1.3rem; }
  .subtitulo { text-align: center; color: #666; font-size: 0.82rem; margin-bottom: 20px; }

  .slot {
    background: #1a1d27;
    border: 1px solid #2a2d3e;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
    max-width: 860px;
    margin-left: auto;
    margin-right: auto;
  }

  .slot-header {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .slot-numero {
    background: #7c9fff;
    color: #0f1117;
    border-radius: 50%;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 0.85rem;
    flex-shrink: 0;
  }

  .slot-nome {
    background: #0f1117;
    border: 1px solid #2a2d3e;
    border-radius: 6px;
    color: #e0e0e0;
    padding: 6px 10px;
    font-size: 0.85rem;
    flex: 1;
    min-width: 160px;
  }

  .btn-arquivo {
    background: #2a2d3e;
    color: #7c9fff;
    border: 1px solid #7c9fff;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .btn-arquivo:hover { background: #7c9fff; color: #0f1117; }

  input[type="file"] { display: none; }

  .slot-descricao {
    width: 100%;
    background: #0f1117;
    border: 1px solid #2a2d3e;
    border-radius: 6px;
    color: #888;
    padding: 8px;
    font-size: 0.8rem;
    resize: vertical;
    min-height: 40px;
    margin-bottom: 8px;
    font-family: sans-serif;
  }

  .slot-codigo {
    width: 100%;
    background: #0a0c12;
    border: 1px solid #2a2d3e;
    border-radius: 6px;
    color: #c8f0a0;
    padding: 10px;
    font-size: 0.78rem;
    font-family: monospace;
    resize: vertical;
    min-height: 120px;
  }

  .slot-status {
    margin-top: 6px;
    font-size: 0.75rem;
    color: #555;
  }
  .slot-status.ok { color: #7fff7f; }

  .acoes {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 860px;
    margin: 0 auto 20px;
  }

  .btn-principal {
    background: #7c9fff;
    color: #0f1117;
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    font-size: 0.95rem;
    font-weight: bold;
    cursor: pointer;
    flex: 1;
    min-width: 200px;
    max-width: 260px;
  }
  .btn-principal:hover { background: #a0b8ff; }

  .btn-secundario {
    background: transparent;
    color: #7fff7f;
    border: 1px solid #7fff7f;
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 0.9rem;
    cursor: pointer;
    flex: 1;
    min-width: 200px;
    max-width: 260px;
  }
  .btn-secundario:hover { background: #7fff7f; color: #0f1117; }

  .btn-perigo {
    background: transparent;
    color: #ff7c7c;
    border: 1px solid #ff7c7c;
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 0.9rem;
    cursor: pointer;
    flex: 1;
    min-width: 160px;
    max-width: 200px;
  }
  .btn-perigo:hover { background: #ff7c7c; color: #0f1117; }

  .resumo-geral {
    max-width: 860px;
    margin: 0 auto 16px;
    background: #1a1d27;
    border: 1px solid #2a2d3e;
    border-radius: 10px;
    padding: 14px;
    color: #666;
    font-size: 0.85rem;
    text-align: center;
  }
  .resumo-geral.ativo { color: #e0e0e0; border-color: #7c9fff; }

  .painel {
    max-width: 860px;
    margin: 16px auto 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .secao {
    background: #1a1d27;
    border: 1px solid #2a2d3e;
    border-radius: 10px;
    padding: 14px;
    font-size: 0.83rem;
  }
  .secao.alerta { border-color: #ffcc44; }
  .secao.sucesso { border-color: #7fff7f; }

  .secao-titulo {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .secao-desc {
    color: #888;
    font-style: italic;
    margin-bottom: 8px;
    font-size: 0.8rem;
  }

  .linha {
    margin-bottom: 6px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
  }

  .label {
    color: #888;
    min-width: 90px;
    font-size: 0.8rem;
  }

  .tag {
    background: #2a2d3e;
    border-radius: 4px;
    padding: 2px 7px;
    font-size: 0.75rem;
  }
  .tag.html { color: #ff9f7c; }
  .tag.css  { color: #7cb8ff; }
  .tag.js   { color: #ffcc44; }
  .tag.pwa  { color: #c87cff; }
  .tag.api  { color: #7fffff; }
  .tag.term { color: #ff7cff; }
  .tag.cdn  { color: #7fff7f; }

  .abas {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .aba {
    background: #2a2d3e;
    color: #888;
    border: 1px solid #2a2d3e;
    border-radius: 6px 6px 0 0;
    padding: 6px 14px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .aba.ativa { background: #1a1d27; color: #7c9fff; border-color: #7c9fff; }

  .preview-frame {
    width: 100%;
    height: 400px;
    border: 1px solid #2a2d3e;
    border-radius: 8px;
    background: #fff;
    margin-top: 10px;
  }

  .msg-copia {
    color: #7fff7f;
    font-size: 0.8rem;
    margin-top: 6px;
    min-height: 18px;
  }
</style>
</head>
<body>

<h1>🔍 Analisador de Código</h1>
<p class="subtitulo">Cole seus códigos, analise, junte e baixe pronto</p>

<div id="slotsContainer"></div>

<div class="acoes">
  <button class="btn-principal" onclick="analisarTudo()">🔍 Analisar Tudo</button>
  <button class="btn-secundario" onclick="gerarHTMLUnificado()">⚡ Gerar HTML Unificado</button>
  <button class="btn-perigo" onclick="limparTudo()">🗑️ Limpar Tudo</button>
</div>

<div class="resumo-geral" id="resumoGeral">
  Cole seus códigos acima e clique em Analisar
</div>

<div class="painel" id="painelAnalise"></div>
<div class="painel" id="painelGerador"></div>

<script>
// ============================================================
// ESTADO
// ============================================================
const ESTADO = {
  slots: [
    { id:1, nome:'', descricao:'', codigo:'' },
    { id:2, nome:'', descricao:'', codigo:'' },
    { id:3, nome:'', descricao:'', codigo:'' },
    { id:4, nome:'', descricao:'', codigo:'' }
  ],
  codigoFinal: ''
};

// ============================================================
// RENDERIZAR SLOTS
// ============================================================
function renderizarSlots() {
  const container = document.getElementById('slotsContainer');
  container.innerHTML = '';
  ESTADO.slots.forEach((slot, i) => {
    const div = document.createElement('div');
    div.className = 'slot';
    div.innerHTML = `
      <div class="slot-header">
        <div class="slot-numero">${slot.id}</div>
        <input class="slot-nome" type="text"
          placeholder="Nome deste código (ex: chat, api, estilo...)"
          value="${slot.nome}"
          oninput="ESTADO.slots[${i}].nome=this.value"/>
        <button class="btn-arquivo"
          onclick="document.getElementById('file-${slot.id}').click()">
          📂 Importar arquivo
        </button>
        <input type="file" id="file-${slot.id}"
          accept=".html,.js,.css,.txt"
          onchange="importarArquivo(${i},this)"/>
      </div>
      <textarea class="slot-descricao"
        placeholder="Descreva o que este código faz (opcional)"
        oninput="ESTADO.slots[${i}].descricao=this.value"
      >${slot.descricao}</textarea>
      <textarea class="slot-codigo"
        placeholder="Cole o código aqui..."
        oninput="atualizarCodigo(${i},this.value)"
      >${slot.codigo}</textarea>
      <div class="slot-status ${slot.codigo?'ok':''}" id="status-${slot.id}">
        ${slot.codigo ? contarLinhas(slot.codigo) : 'Vazio'}
      </div>
    `;
    container.appendChild(div);
  });
}

function atualizarCodigo(i, valor) {
  ESTADO.slots[i].codigo = valor;
  const el = document.getElementById('status-' + ESTADO.slots[i].id);
  if (el) {
    el.className = 'slot-status ' + (valor ? 'ok' : '');
    el.textContent = valor ? contarLinhas(valor) : 'Vazio';
  }
}

function importarArquivo(i, input) {
  const arquivo = input.files[0];
  if (!arquivo) return;
  const reader = new FileReader();
  reader.onload = e => {
    ESTADO.slots[i].codigo = e.target.result;
    if (!ESTADO.slots[i].nome)
      ESTADO.slots[i].nome = arquivo.name.replace(/\.[^/.]+$/, '');
    renderizarSlots();
  };
  reader.readAsText(arquivo);
}

function contarLinhas(c) {
  return `✅ ${c.split('\n').length} linhas · ${c.length} caracteres`;
}

function limparTudo() {
  ESTADO.slots.forEach(s => { s.nome=''; s.descricao=''; s.codigo=''; });
  document.getElementById('resumoGeral').className = 'resumo-geral';
  document.getElementById('resumoGeral').textContent = 'Cole seus códigos acima e clique em Analisar';
  document.getElementById('painelAnalise').innerHTML = '';
  document.getElementById('painelGerador').innerHTML = '';
  renderizarSlots();
}

// ============================================================
// DETECÇÃO
// ============================================================
function detectarTipos(c) {
  return {
    html: /<[a-z][\s\S]*>/i.test(c),
    css:  /<style[\s\S]*?>[\s\S]*?<\/style>/i.test(c) || /\{[\s\S]*?:[\s\S]*?;/.test(c),
    js:   /<script[\s\S]*?>[\s\S]*?<\/script>/i.test(c) || /function\s+\w+/.test(c),
    pwa:  /manifest|service.worker|sw\.js/i.test(c),
    api:  /fetch\(|axios\.|XMLHttpRequest/i.test(c),
    term: /terminal|xterm|pty|exec\(|spawn\(/i.test(c)
  };
}

function detectarCDNs(c) {
  return [
    { r:/bootstrap/i,       n:'Bootstrap'    },
    { r:/jquery/i,          n:'jQuery'       },
    { r:/vue\.js|vue@/i,    n:'Vue.js'       },
    { r:/react\.js|react@/i,n:'React'        },
    { r:/tailwind/i,        n:'Tailwind'     },
    { r:/font-awesome/i,    n:'FontAwesome'  },
    { r:/marked/i,          n:'Marked'       },
    { r:/highlight\.js/i,   n:'Highlight.js' },
    { r:/axios/i,           n:'Axios'        },
    { r:/socket\.io/i,      n:'Socket.io'    },
    { r:/chart\.js/i,       n:'Chart.js'     },
    { r:/monaco/i,          n:'Monaco'       },
    { r:/xterm/i,           n:'XTerm'        }
  ].filter(p => p.r.test(c)).map(p => p.n);
}

function detectarFuncoes(c) {
  const f = new Set();
  let m;
  const r1 = /function\s+([a-zA-Z_$][\w$]*)\s*\(/g;
  const r2 = /const\s+([a-zA-Z_$][\w$]*)\s*=\s*(?:async\s*)?\(/g;
  while ((m = r1.exec(c)) !== null) f.add(m[1]);
  while ((m = r2.exec(c)) !== null) f.add(m[1]);
  return [...f];
}

function detectarDuplicatas(slots) {
  const dup = [];
  const fps = slots.map(s => detectarFuncoes(s.codigo));
  for (let i = 0; i < slots.length; i++)
    for (let j = i+1; j < slots.length; j++) {
      const comuns = fps[i].filter(f => fps[j].includes(f));
      if (comuns.length)
        dup.push({
          a: slots[i].nome || `Código ${i+1}`,
          b: slots[j].nome || `Código ${j+1}`,
          fns: comuns
        });
    }
  return dup;
}

// ============================================================
// ANÁLISE
// ============================================================
function analisarTudo() {
  const ativos = ESTADO.slots.filter(s => s.codigo.trim());
  const resumo = document.getElementById('resumoGeral');
  const painel = document.getElementById('painelAnalise');

  if (!ativos.length) {
    resumo.className = 'resumo-geral ativo';
    resumo.innerHTML = '⚠️ Cole pelo menos um código antes de analisar.';
    return;
  }

  resumo.className = 'resumo-geral ativo';
  resumo.innerHTML = `<strong>📋 ${ativos.length} código(s) carregado(s) — análise abaixo</strong>`;
  painel.innerHTML = '';

  ativos.forEach((slot, i) => {
    const nome   = slot.nome || `Código ${i+1}`;
    const tipos  = detectarTipos(slot.codigo);
    const cdns   = detectarCDNs(slot.codigo);
    const fns    = detectarFuncoes(slot.codigo);
    const linhas = slot.codigo.split('\n').length;

    const tags = [
      tipos.html ? `<span class="tag html">HTML</span>`  : '',
      tipos.css  ? `<span class="tag css">CSS</span>`    : '',
      tipos.js   ? `<span class="tag js">JS</span>`      : '',
      tipos.pwa  ? `<span class="tag pwa">PWA</span>`    : '',
      tipos.api  ? `<span class="tag api">API</span>`    : '',
      tipos.term ? `<span class="tag term">TERMINAL</span>` : ''
    ].join('');

    const cdnsHtml = cdns.length
      ? cdns.map(c => `<span class="tag cdn">${c}</span>`).join('')
      : '<span style="color:#555">Nenhuma</span>';

    const fnsHtml = fns.length
      ? fns.slice(0,12).map(f=>`<span class="tag js">${f}()</span>`).join('')
        + (fns.length>12 ? `<span class="tag" style="color:#888">+${fns.length-12} mais</span>` : '')
      : '<span style="color:#555">Nenhuma</span>';

    const sec = document.createElement('div');
    sec.className = 'secao';
    sec.innerHTML = `
      <div class="secao-titulo">
        <div class="slot-numero">${i+1}</div>
        <strong>${nome}</strong>
        <span style="color:#888;font-size:0.8rem;margin-left:6px">${linhas} linhas</span>
      </div>
      ${slot.descricao ? `<div class="secao-desc">"${slot.descricao}"</div>` : ''}
      <div class="linha"><span class="label">Tipos:</span>${tags||'<span style="color:#555">Não detectado</span>'}</div>
      <div class="linha"><span class="label">Bibliotecas:</span>${cdnsHtml}</div>
      <div class="linha"><span class="label">Funções:</span>${fnsHtml}</div>
    `;
    painel.appendChild(sec);
  });

  // Duplicatas
  const dups = detectarDuplicatas(ativos);
  if (dups.length) {
    const sec = document.createElement('div');
    sec.className = 'secao alerta';
    let h = `<strong>⚠️ Funções duplicadas encontradas:</strong>`;
    dups.forEach(d => {
      h += `<br><br><span style="color:#ffcc44">${d.a}</span> e <span style="color:#ffcc44">${d.b}</span>:<br>`;
      h += d.fns.map(f=>`<span class="tag js">${f}()</span>`).join('');
    });
    h += `<br><br><span style="color:#888;font-size:0.8rem">💡 Renomeie uma delas antes de juntar</span>`;
    sec.innerHTML = h;
    painel.appendChild(sec);
  }

  // Botão manual
  const secBtn = document.createElement('div');
  secBtn.className = 'secao sucesso';
  secBtn.innerHTML = `
    <strong>✅ Análise concluída!</strong><br><br>
    <button class="btn-principal" onclick="gerarManual()" style="max-width:100%">
      📋 Gerar Manual de Montagem
    </button>
  `;
  painel.appendChild(secBtn);
}

// ============================================================
// MANUAL
// ============================================================
function gerarManual() {
  const ativos = ESTADO.slots.filter(s => s.codigo.trim());
  const data = new Date().toLocaleDateString('pt-BR');
  const hora = new Date().toLocaleTimeString('pt-BR');

  let txt = `MANUAL DE MONTAGEM — ${data} às ${hora}\n${'='.repeat(60)}\n\n`;
  txt += `Cole este manual numa conversa com a IA para continuar de onde parou.\n\n`;
  txt += `CÓDIGOS ANALISADOS: ${ativos.length}\n${'='.repeat(60)}\n`;

  ativos.forEach((slot, i) => {
    const tipos = detectarTipos(slot.codigo);
    const cdns  = detectarCDNs(slot.codigo);
    const fns   = detectarFuncoes(slot.codigo);
    txt += `\nCÓDIGO ${i+1}: ${(slot.nome||`codigo-${i+1}`).toUpperCase()}\n${'-'.repeat(40)}\n`;
    txt += `Linhas: ${slot.codigo.split('\n').length}\n`;
    txt += `Descrição: ${slot.descricao||'Não informada'}\n`;
    txt += `Tipos: ${[tipos.html?'HTML':'',tipos.css?'CSS':'',tipos.js?'JS':'',tipos.pwa?'PWA':'',tipos.api?'API':'',tipos.term?'Terminal':''].filter(Boolean).join(', ')}\n`;
    txt += `Bibliotecas: ${cdns.join(', ')||'Nenhuma'}\n`;
    txt += `Funções (${fns.length}): ${fns.slice(0,20).join(', ')}${fns.length>20?'...':''}\n`;
  });

  const dups = detectarDuplicatas(ativos);
  if (dups.length) {
    txt += `\n${'='.repeat(60)}\nCONFLITOS DETECTADOS:\n${'='.repeat(60)}\n`;
    dups.forEach(d => {
      txt += `\n"${d.a}" e "${d.b}" têm funções iguais:\n`;
      txt += d.fns.map(f=>`  - ${f}()`).join('\n') + '\n';
    });
  }

  txt += `\n${'='.repeat(60)}\nCOMO USAR:\n${'='.repeat(60)}\n`;
  txt += `1. Cole este texto aqui na conversa com a IA\n`;
  txt += `2. Diga: "Quero continuar o projeto"\n`;
  txt += `3. Peça a melhoria específica\n\nFIM DO MANUAL\n`;

  const blob = new Blob([txt], {type:'text/plain;charset=utf-8'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = `manual-${Date.now()}.txt`; a.click();
  URL.revokeObjectURL(url);

  const painel = document.getElementById('painelAnalise');
  const sec = document.createElement('div');
  sec.className = 'secao';
  sec.innerHTML = `
    <strong>📋 Manual baixado!</strong><br><br>
    <textarea class="slot-codigo" style="height:180px;color:#c8f0a0" readonly>${txt}</textarea>
    <br><span style="color:#7c9fff;font-size:0.82rem">
      ✅ Cole este texto aqui na conversa com a IA para continuar de onde parou
    </span>
  `;
  painel.appendChild(sec);
  sec.scrollIntoView({behavior:'smooth'});
}

// ============================================================
// EXTRATORES
// ============================================================
function extrairCDNsTag(c) {
  const links = [];
  let m;
  const r1 = /<link[^>]+href=["'][^"']*(?:cdn|unpkg|jsdelivr|cdnjs)[^"']*["'][^>]*>/gi;
  const r2 = /<script[^>]+src=["'][^"']*(?:cdn|unpkg|jsdelivr|cdnjs)[^"']*["'][^>]*><\/script>/gi;
  while ((m=r1.exec(c))!==null) links.push(m[0]);
  while ((m=r2.exec(c))!==null) links.push(m[0]);
  return [...new Set(links)];
}

function extrairCSS(c) {
  const r = /<style[^>]*>([\s\S]*?)<\/style>/gi;
  const parts = []; let m;
  while ((m=r.exec(c))!==null) parts.push(m[1].trim());
  return parts.join('\n\n');
}

function extrairJS(c) {
  const r = /<script(?![^>]*src)[^>]*>([\s\S]*?)<\/script>/gi;
  const parts = []; let m;
  while ((m=r.exec(c))!==null) { const t=m[1].trim(); if(t) parts.push(t); }
  if (!parts.length && /function\s+\w+/.test(c)) return c.trim();
  return parts.join('\n\n');
}

function extrairBody(c) {
  const bm = /<body[^>]*>([\s\S]*?)<\/body>/i.exec(c);
  if (bm) return bm[1].replace(/<script[\s\S]*?<\/script>/gi,'').trim();
  if (/<(div|section|main|header|nav|form|button|input)[^>]*>/i.test(c))
    return c.replace(/<script[\s\S]*?<\/script>/gi,'')
            .replace(/<style[\s\S]*?<\/style>/gi,'')
            .replace(/<!DOCTYPE[^>]*>/gi,'')
            .replace(/<\/?html[^>]*>/gi,'')
            .replace(/<\/?head[^>]*>/gi,'')
            .replace(/<\/?body[^>]*>/gi,'')
            .trim();
  return '';
}

// ============================================================
// GERADOR HTML UNIFICADO
// ============================================================
function gerarHTMLUnificado() {
  const ativos = ESTADO.slots.filter(s => s.codigo.trim());
  if (!ativos.length) { alert('Cole pelo menos um código antes de gerar.'); return; }

  const cdns = new Set();
  const cssP = [], jsP = [], htmlP = [];

  ativos.forEach((slot, i) => {
    const nome = slot.nome || `codigo-${i+1}`;
    extrairCDNsTag(slot.codigo).forEach(c => cdns.add(c));
    const css = extrairCSS(slot.codigo);
    if (css)  cssP.push(`/* === ${nome.toUpperCase()} === */\n${css}`);
    const js  = extrairJS(slot.codigo);
    if (js)   jsP.push(`/* === ${nome.toUpperCase()} === */\n${js}`);
    const htm = extrairBody(slot.codigo);
    if (htm)  htmlP.push(`<!-- === ${nome.toUpperCase()} === -->\n${htm}`);
  });

  const final = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

function trocarAba(tipo) {
  document.getElementById('aba-codigo').className  = 'aba' + (tipo==='codigo'  ? ' ativa' : '');
  document.getElementById('aba-preview').className = 'aba' + (tipo==='preview' ? ' ativa' : '');
  const cont = document.getElementById('abaConteudo');
  if (tipo === 'codigo') {
    cont.innerHTML = `<textarea class="slot-codigo" style="height:320px;color:#c8f0a0" readonly
      id="codigoFinalTexto">${ESTADO.codigoFinal}</textarea>`;
  } else {
    cont.innerHTML = `<iframe class="preview-frame" sandbox="allow-scripts allow-same-origin"
      srcdoc="${ESTADO.codigoFinal.replace(/"/g,'&quot;')}"></iframe>`;
  }
}

function baixarFinal() {
  if (!ESTADO.codigoFinal) return;
  const blob = new Blob([ESTADO.codigoFinal],{type:'text/html;charset=utf-8'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href=url; a.download=`projeto-unificado-${Date.now()}.html`; a.click();
  URL.revokeObjectURL(url);
}

function copiarFinal() {
  if (!ESTADO.codigoFinal) return;
  navigator.clipboard.writeText(ESTADO.codigoFinal).then(() => {
    const el = document.getElementById('msgCopia');
    if (el) { el.textContent='✅ Copiado!'; setTimeout(()=>el.textContent='',3000); }
  });
}
