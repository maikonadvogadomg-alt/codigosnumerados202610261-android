<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Comparador Jurídico Multi-Cenário (Com Integração BCB)</title>
<style>
:root{
  --bg:#1e293b;--panel:#0f172a;--txt:#f1f5f9;--muted:#94a3b8;--accent:#f59e0b;
  --good:#10b981;--bad:#ef4444;--info:#3b82f6;--paper:#fff;--border:#334155;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#e2e8f0;color:#0f172a;overflow:hidden}
header{background:var(--bg);color:var(--txt);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:15px;letter-spacing:.5px;text-transform:uppercase}
.clock{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted)}
.wrap{display:flex;height:calc(100vh - 50px)}
.left{width:440px;background:var(--panel);color:var(--txt);overflow-y:auto;padding:16px}
.right{flex:1;background:#cbd5e1;overflow-y:auto;padding:16px}
h2{font-size:13px;margin:16px 0 8px;color:var(--accent);text-transform:uppercase;letter-spacing:.4px}
.box{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:10px}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
input,select,textarea{
  width:100%;background:rgba(0,0,0,.25);color:var(--txt);border:1px solid var(--border);
  border-radius:6px;padding:9px;font-size:13px;outline:none
}
textarea{min-height:100px;font-family:ui-monospace,monospace;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
button{
  border:0;border-radius:8px;padding:10px 12px;font-weight:700;cursor:pointer;
  text-transform:uppercase;font-size:11px;letter-spacing:.3px;transition:opacity 0.2s;
}
button:hover{opacity:0.9;}
.b1{background:var(--accent);color:#111}
.b2{background:var(--bad);color:#fff}
.b3{background:var(--good);color:#052e16}
.b4{background:var(--info);color:#fff}
.b5{background:#fff;color:#111;border:1px solid #cbd5e1}
.hint{font-size:12px;line-height:1.4;background:rgba(59,130,246,.1);border-left:3px solid var(--info);padding:10px;border-radius:6px;color:var(--txt)}
.status{white-space:pre-wrap;font-size:12px;background:rgba(0,0,0,.2);border:1px solid var(--border);padding:10px;border-radius:8px;color:var(--txt)}
.paper{background:var(--paper);border-radius:12px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.15);height:100%}
.paper h3{font-size:14px;margin-bottom:10px}
.topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:12px}
.card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px}
.card h4{font-size:13px;margin-bottom:6px;color:#0f172a}
.mono{font-family:ui-monospace,monospace;font-size:12px;line-height:1.5}
table{border-collapse:collapse;width:100%;font-size:12px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;margin-top:12px}
th,td{border-bottom:1px solid #e2e8f0;padding:8px 10px;text-align:left}
th{background:#f1f5f9;font-weight:700;position:sticky;top:0;z-index:2}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:#e0f2fe;border:1px solid #bae6fd;color:#0c4a6e}
.warn{color:#b45309}
.ok{color:#166534}
details{margin-top:10px}
summary{cursor:pointer;font-weight:700;color:var(--txt);font-size:12px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:9999}
.ovbox{background:#fff;border-radius:12px;padding:18px;min-width:320px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.spin{width:18px;height:18px;border:3px solid #cbd5e1;border-top-color:#3b82f6;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.ovtxt{text-align:center;font-size:13px;color:#334155;font-weight:600}
.ovsub{text-align:center;font-size:11px;color:#64748b;margin-top:4px}
</style>
</head>
<body>

<div class="overlay" id="ov"><div class="ovbox"><div class="spin"></div><div class="ovtxt" id="ovT">Processando...</div><div class="ovsub" id="ovS"></div></div></div>

<header>
  <h1>Comparador Jurídico</h1>
  <div class="clock" id="clock">00:00</div>
</header>

<div class="wrap">
  <!-- PAINEL ESQUERDO -->
  <div class="left">
    <div class="hint">
      Defina o período global, carregue índices (CSV/JSON ou <b>Via BCB</b>) e crie cenários para comparar evoluções.
    </div>

    <h2>1) Parâmetros Globais</h2>
    <div class="box">
      <div class="row">
        <div><label>Data Início (DD/MM/AAAA)</label><input id="dataInicio" value="01/01/2020"></div>
        <div><label>Data Fim (DD/MM/AAAA)</label><input id="dataFim" value="01/01/2023"></div>
      </div>
      <label>Valor Principal (R$)</label>
      <input id="valorPrincipal" value="10000,00">
    </div>

    <h2>2) Importar Índices</h2>
    <div class="box">
      <label>Texto (CSV ou JSON) - Manual</label>
      <textarea id="indicesText" placeholder="ex: competencia;inpc;cdi&#10;2020-01;0.5;0.3..."></textarea>
      
      <!-- NOVA SEÇÃO BCB -->
      <div style="margin-top:12px; border-top:1px solid var(--border); padding-top:12px;">
        <label style="color:var(--accent)">Importar Automático (Banco Central)</label>
        <div class="row3">
          <div>
            <label style="margin:0 0 4px">Cód. Série</label>
            <input id="bcbSerie" placeholder="Ex: 433" title="Código SGS (ex: 433 IPCA, 11 TR)">
          </div>
          <div style="grid-column: span 2">
             <label style="margin:0 0 4px">Nome Coluna Destino</label>
             <div style="display:flex; gap:5px;">
                <input id="bcbCampo" value="indice_bcb" placeholder="nome_coluna">
                <button class="b4" id="btnFetchBCB" style="min-width:80px">Buscar</button>
             </div>
          </div>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:6px;font-style:italic">
          * Usa as datas acima. Códigos comuns: 433 (IPCA), 189 (IGP-M), 11 (TR), 4390 (Sel
