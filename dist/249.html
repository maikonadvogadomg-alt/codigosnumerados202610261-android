<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Gerador de Cotejo Analítico</title>

<style>
body{font-family:Arial;background:#eee;padding:20px}

/* impressão */
@media print{
.painel-controle,.btn-remove,.btn-word{display:none}
@page{size:A4;margin:2cm}
}

.folha{
background:#fff;
width:210mm;
min-height:297mm;
padding:20mm;
margin:auto;
box-shadow:0 0 10px #0003;
font-size:12pt;
line-height:1.5;
text-align:justify;
}

/* tabela */
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #000;padding:8px}
th{background:#333;color:#fff}

/* botões */
button{padding:8px 12px;border:0;border-radius:4px;color:#fff;font-weight:bold;cursor:pointer}
.btn-print{background:#e67e22}
.btn-word{background:#2980b9}
.btn-clear{background:#c0392b}
.btn-add{background:#2c3e50;width:100%}
.btn-remove{background:none;color:red;font-size:18px}
</style>
</head>

<body>

<div class="painel-controle">

<button class="btn-print" onclick="window.print()">🖨️ PDF</button>
<button class="btn-word" onclick="exportarWord()">📄 Word</button>
<button class="btn-clear" onclick="limparTabela()">🗑️ Limpar</button>

<h3>Adicionar Linha</h3>

<input id="crit" placeholder="Critério"><br><br>

<textarea id="t1" placeholder="Theo"></textarea>
<textarea id="t2" placeholder="Paradigma 1"></textarea>
<textarea id="t3" placeholder="Paradigma 2"></textarea>

<input id="viol" placeholder="Violação">

<button class="btn-add" onclick="add()">➕ Inserir</button>

</div>

<div class="folha" id="folha">

<h3 style="text-align:center">COTEJO ANALÍTICO</h3>

<table>
<thead>
<tr>
<th>Critério</th>
<th>Theo</th>
<th>Paradigma</th>
<th>Reforço</th>
</tr>
</thead>
<tbody id="tb"></tbody>
</table>

<div style="margin-top:50px;text-align:center">
__________________________________<br>
<b>MAIKON DA ROCHA CALDEIRA</b><br>
OAB/MG 183.712
</div>

</div>

<script>

function add(){
let c=crit.value,t1v=t1.value,t2v=t2.value,t3v=t3.value,v=viol.value;
if(!c)return alert("Preencha critério");

let tr=document.createElement("tr");
tr.innerHTML=`
<td><b>${c}</b><button class="btn-remove" onclick="this.closest('tr').remove()">×</button></td>
<td>${t1v}</td>
<td>${t2v}</td>
<td>${t3v}</td>
`;
tb.appendChild(tr);

if(v){
let tr2=document.createElement("tr");
tr2.innerHTML=`
<td colspan="4" style="background:#fff3cd;font-weight:bold;text-align:center">
⚠️ VIOLAÇÃO: ${v}
</td>`;
tb.appendChild(tr2);
}

crit.value=t1.value=t2.value=t3.value=viol.value="";
crit.focus();
}

function limparTabela(){
if(confirm("Apagar tudo?")) tb.innerHTML="";
}

/* EXPORTAR WORD */
function exportarWord(){

let conteudo=document.getElementById("folha").innerHTML;

let html=`
<html>
<head>
<meta charset="UTF-8">
<style>
body{font-family:Times New Roman;font-size:12pt}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #000;padding:6px}
</style>
</head>
<body>${conteudo}</body></html>
`;

let blob=new Blob(['\ufeff',html],{type:'application/msword'});
let url=URL.createObjectURL(blob);

let a=document.createElement("a");
a.href=url;
a.download="cotejo_analitico.doc";
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
}
</script>

</body>
</html>
