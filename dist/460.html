<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Extrator Jurídico Avançado - Processo Completo com Links</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.0/FileSaver.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.worker.min.js';
        window.jsPDF = window.jspdf.jsPDF;
    </script>
    <style>
        .link-pagina {
            color: #2563eb;
            text-decoration: underline;
            cursor: pointer;
            font-weight: 600;
        }
        .link-pagina:hover {
            color: #1d4ed8;
        }
        .categoria-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            margin-right: 4px;
        }
        .badge-critico { background: #dc2626; color: white; }
        .badge-importante { background: #f59e0b; color: white; }
        .badge-normal { background: #10b981; color: white; }
        .badge-info { background: #3b82f6; color: white; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col overflow-hidden font-sans">
    <header class="bg-blue-900 text-white p-3 shadow-lg flex flex-wrap justify-between items-center z-20 gap-2">
        <div class="flex items-center gap-2">
            <i class="fas fa-balance-scale text-2xl text-yellow-400"></i>
            <div>
                <h1 class="text-lg font-bold leading-tight">Extrator Jurídico Avançado - Processo Completo</h1>
                <p class="text-[10px] text-blue-200 opacity-80">35+ Categorias • Links por Página • Exportação Inteligente</p>
            </div>
        </div>
        <div class="flex gap-2 text-xs">
            <button onclick="document.getElementById('fileInput').click()" class="bg-blue-600 hover:bg-blue-500 px-3 py-2 rounded font-bold transition flex items-center gap-2 shadow">
                <i class="fas fa-folder-open text-lg"></i> Importar PDFs
            </button>
            <div class="h-8 w-px bg-blue-700 mx-1"></div>
            <button onclick="exportarHTML()" class="bg-purple-700 hover:bg-purple-600 px-3 py-2 rounded transition" title="Exportar HTML com Links">
                <i class="fas fa-file-code text-lg"></i>
            </button>
            <button onclick="exportarExcel()" class="bg-green-700 hover:bg-green-600 px-3 py-2 rounded transition" title="Exportar Excel">
                <i class="fas fa-file-excel text-lg"></i>
            </button>
            <button onclick="exportarJSON()" class="bg-yellow-600 hover:bg-yellow-500 px-3 py-2 rounded transition" title="Exportar JSON">
                <i class="fas fa-code text-lg"></i>
            </button>
            <button onclick="exportarXML()" class="bg-orange-600 hover:bg-orange-500 px-3 py-2 rounded transition" title="Exportar XML">
                <i class="fas fa-file-code text-lg"></i>
            </button>
        </div>
        <input type="file" id="fileInput" multiple accept=".pdf" class="hidden">
    </header>
    
    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar com Categorias -->
        <aside class="w-1/4 min-w-[320px] bg-white border-r border-gray-200 flex flex-col shadow-md z-10 overflow-y-auto">
            <div class="p-4 bg-slate-50 border-b sticky top-0 z-10">
                <h2 class="font-bold text-slate-700 mb-1 flex items-center gap-2">
                    <i class="fas fa-filter"></i> Categorias de Extração
                </h2>
                <p class="text-xs text-slate-500 mb-3">35+ padrões regex pré-configurados</p>
                <div class="flex gap-2 mb-3">
                    <button onclick="selecionarTodas()" class="flex-1 bg-blue-600 text-white text-xs py-2 rounded hover:bg-blue-700">
                        <i class="fas fa-check-double mr-1"></i> Todas
                    </button>
                    <button onclick="desselecionarTodas()" class="flex-1 bg-gray-600 text-white text-xs py-2 rounded hover:bg-gray-700">
                        <i class="fas fa-times mr-1"></i> Nenhuma
                    </button>
                </div>
                <input type="text" id="buscaCategoria" placeholder="Buscar categoria..." class="w-full text-sm p-2 border rounded mb-2" oninput="filtrarCategorias()">
            </div>
            <div id="listaCategorias" class="p-2 space-y-1"></div>
        </aside>

        <!-- Área Principal -->
        <main class="w-3/4 flex flex-col relative">
            <!-- Tabela de Resultados -->
            <div class="h-3/5 overflow-auto p-4 bg-white border-b border-gray-300">
                <div class="sticky top-0 bg-white z-10 py-2 border-b flex justify-between items-center mb-2">
                    <h3 class="font-bold text-gray-700 flex items-center gap-2">
                        <i class="fas fa-table"></i> Resultados da Extração
                    </h3>
                    <div class="flex items-center gap-3">
                        <span id="statusCount" class="text-xs text-gray-500">0 arquivos • 0 trechos</span>
                        <label class="text-xs flex items-center gap-2">
                            <input type="checkbox" id="mostrarPaginas" checked onchange="reprocessar()">
                            Mostrar páginas
                        </label>
                        <label class="text-xs flex items-center gap-2">
                            Limite:
                            <input type="number" id="limiteCaracteres" value="300" min="50" max="2000" class="w-20 text-xs p-1 border rounded" onchange="reprocessar()">
                        </label>
                    </div>
                </div>
                <div id="resultadosContainer" class="space-y-4"></div>
            </div>

            <!-- Visualizador de Texto Bruto -->
            <div class="h-2/5 flex flex-col bg-slate-800 text-green-400 font-mono text-xs p-4 border-t-4 border-blue-900">
                <div class="flex justify-between items-center mb-2">
                    <span class="font-bold flex items-center gap-2">
                        <i class="fas fa-terminal"></i> Texto Bruto do Documento
                    </span>
                    <select id="seletorArquivoTexto" class="bg-slate-700 text-white border border-slate-600 rounded p-1 text-xs max-w-[400px]" onchange="mostrarTextoBruto()">
                        <option>Nenhum arquivo selecionado</option>
                    </select>
                </div>
                <textarea id="textoBrutoArea" class="flex-1 w-full bg-slate-900 border border-slate-700 p-4 resize-none focus:outline-none rounded text-xs leading-relaxed" readonly spellcheck="false" placeholder="O texto extraído aparecerá aqui..."></textarea>
            </div>
        </main>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center">
        <div class="bg-white p-6 rounded shadow-xl flex flex-col items-center">
            <i class="fas fa-spinner fa-spin text-4xl text-blue-600 mb-3"></i>
            <p class="font-bold text-gray-700">Processando documentos...</p>
            <p class="text-sm text-gray-500 mt-2" id="loadingStatus">Aguarde...</p>
        </div>
    </div>

    <script>
        let ARQUIVOS_CACHE = [];
        let RESULTADOS_CACHE = [];
        
        // Biblioteca expandida de regex com prioridades
        const CATEGORIAS_REGEX = [
            // CRÍTICAS (Vermelho)
            { nome: "Contrato Falsificado", regex: "\\b(falsificação|assinatura falsa|contrato falsificado|contrato indevido|divergência de assinatura|perícia grafotécnica|laudo pericial)\\b[\\s\\S]{0,800}", prioridade: "critico", ativa: true },
            { nome: "Estelionato/Crime", regex: "\\b(estelionato|crime|fraude|investigação criminal|inquérito policial|boletim de ocorrência|delegacia)\\b[\\s\\S]{0,800}", prioridade: "critico", ativa: true },
            { nome: "Má-Fé Processual", regex: "\\b(má-fé|litigância de má-fé|alegações falsas|condenação por má-fé|multa por litigância|artigo 80|artigo 81)\\b[\\s\\S]{0,800}", prioridade: "critico", ativa: true },
            { nome: "Sentença/Acórdão", regex: "\\b(sentença|acórdão|decisão final|julgo procedente|julgo improcedente|dispositivo)\\b[\\s\\S]{0,800}", prioridade: "critico", ativa: true },
            
            // IMPORTANTES (Laranja)
            { nome: "Petição Inicial", regex: "\\b(petição inicial|excelentíssimo|causa de pedir|pedido inicial|autor|réu)\\b[\\s\\S]{0,600}", prioridade: "importante", ativa: true },
            { nome: "Contestação/Defesa", regex: "\\b(contestação|defesa preliminar|impugnação ao valor|preliminarmente|mérito)\\b[\\s\\S]{0,600}", prioridade: "importante", ativa: true },
            { nome: "Perícia/Laudo", regex: "\\b(perícia|laudo pericial|perito|assistente técnico|quesitos|conclusão pericial)\\b[\\s\\S]{0,600}", prioridade: "importante", ativa: true },
            { nome: "Provas Documentais", regex: "\\b(prova documental|documento anexo|comprovante|extrato|contrato|certidão)\\b[\\s\\S]{0,600}", prioridade: "importante", ativa: true },
            { nome: "Testemunhas/Depoimentos", regex: "\\b(testemunha|depoimento|oitiva|declaração|termo de audiência)\\b[\\s\\S]{0,600}", prioridade: "importante", ativa: true },
            { nome: "Danos Morais", regex: "\\b(dano moral|sofrimento|constrangimento|abalo psicológico|indenização por dano moral)\\b[\\s\\S]{0,600}", prioridade: "importante", ativa: true },
            { nome: "Danos Materiais", regex: "\\b(dano material|prejuízo financeiro|lucros cessantes|danos emergentes|restituição)\\b[\\s\\S]{0,600}", prioridade: "importante", ativa: true },
            { nome: "Tutela de Urgência", regex: "\\b(tutela de urgência|liminar|antecipação de tutela|tutela provisória|medida cautelar)\\b[\\s\\S]{0,600}", prioridade: "importante", ativa: true },
            
            // NORMAIS (Verde)
            { nome: "Alegações Finais", regex: "\\b(alegações finais|memoriais|razões finais|conclusão)\\b[\\s\\S]{0,500}", prioridade: "normal", ativa: true },
            { nome: "Recursos", regex: "\\b(recurso|apelação|agravo|embargos de declaração|recurso especial|recurso extraordinário)\\b[\\s\\S]{0,500}", prioridade: "normal", ativa: true },
            { nome: "Prazos Processuais", regex: "\\b(prazo|intimação|citação|vencimento|decadência|prescrição)\\b[\\s\\S]{0,500}", prioridade: "normal", ativa: true },
            { nome: "Custas/Honorários", regex: "\\b(custas processuais|honorários advocatícios|sucumbência|taxa judiciária|despesas processuais)\\b[\\s\\S]{0,500}", prioridade: "normal", ativa: true },
            { nome: "Valores/Quantias", regex: "R\\$\\s*[\\d.,]+|\\b(valor|quantia|montante|total|soma)\\s+de\\s+R\\$[\\s\\S]{0,300}", prioridade: "normal", ativa: true },
            { nome: "Partes do Processo", regex: "\\b(autor|réu|advogado|procurador|representante legal|CPF|CNPJ)\\b[\\s\\S]{0,400}", prioridade: "normal", ativa: true },
            { nome: "Jurisprudência", regex: "\\b(jurisprudência|precedente|súmula|STJ|STF|tribunal|ementa)\\b[\\s\\S]{0,500}", prioridade: "normal", ativa: true },
            { nome: "Legislação Citada", regex: "\\b(artigo|lei|código|decreto|constituição federal|CF|CPC|CDC|CC)\\b[\\s\\S]{0,400}", prioridade: "normal", ativa: true },
            
            // INFORMATIVAS (Azul)
            { nome: "INSS/Benefício", regex: "\\b(INSS|benefício previdenciário|aposentadoria|pensão|auxílio|verba alimentar)\\b[\\s\\S]{0,500}", prioridade: "info", ativa: true },
            { nome: "Cadastro Positivo", regex: "\\b(cadastro positivo|vazamento de dados|LGPD|dados pessoais|acesso indevido)\\b[\\s\\S]{0,500}", prioridade: "info", ativa: true },
            { nome: "Banco/Instituição", regex: "\\b(banco|instituição financeira|C6|Bradesco|Itaú|Santander|Caixa)\\b[\\s\\S]{0,500}", prioridade: "info", ativa: true },
            { nome: "Audiências", regex: "\\b(audiência|sessão|pauta|designação|adiamento)\\b[\\s\\S]{0,400}", prioridade: "info", ativa: true },
            { nome: "Manifestações", regex: "\\b(manifestação|petição intermediária|juntada|protocolo)\\b[\\s\\S]{0,400}", prioridade: "info", ativa: true },
            { nome: "Decisões Interlocutórias", regex: "\\b(decisão interlocutória|despacho|determino|indefiro|defiro)\\b[\\s\\S]{0,400}", prioridade: "info", ativa: true },
            { nome: "Citações/Intimações", regex: "\\b(citação|intimação|notificação|AR|aviso de recebimento)\\b[\\s\\S]{0,400}", prioridade: "info", ativa: true },
            { nome: "Certidões", regex: "\\b(certidão|certifico|atesto|trânsito em julgado)\\b[\\s\\S]{0,400}", prioridade: "info", ativa: true },
            { nome: "Execução", regex: "\\b(execução|penhora|bloqueio|arresto|expropriação)\\b[\\s\\S]{0,400}", prioridade: "info", ativa: true },
            { nome: "Acordo/Transação", regex: "\\b(acordo|transação|conciliação|homologação|composição)\\b[\\s\\S]{0,400}", prioridade: "info", ativa: true },
            { nome: "Suspensão/Sobrestamento", regex: "\\b(suspensão|sobrestamento|paralisação|aguardar)\\b[\\s\\S]{0,400}", prioridade: "info", ativa: true },
            { nome: "Nulidades", regex: "\\b(nulidade|vício|invalidade|anulação)\\b[\\s\\S]{0,400}", prioridade: "info", ativa: true },
            { nome: "Competência", regex: "\\b(competência|incompetência|declínio|redistribuição)\\b[\\s\\S]{0,400}", prioridade: "info", ativa: true },
            { nome: "Provas Periciais", regex: "\\b(prova pericial|exame|vistoria|inspeção judicial)\\b[\\s\\S]{0,400}", prioridade: "info", ativa: true },
            { nome: "ID PJe", regex: "\\bId\\s+no\\s+PJe:\\s*\\d+\\b[\\s\\S]{0,200}", prioridade: "info", ativa: false },
            { nome: "Evento/Movimentação", regex: "\\bEvento\\s+\\d+\\b[\\s\\S]{0,200}", prioridade: "info", ativa: false }
        ];

        let CATEGORIAS = JSON.parse(JSON.stringify(CATEGORIAS_REGEX));

        // Inicialização
        window.onload = () => {
            renderizarCategorias();
        };

        function renderizarCategorias() {
            const container = document.getElementById('listaCategorias');
            container.innerHTML = '';
            
            const grupos = {
                critico: { titulo: 'Críticas', categorias: [] },
                importante: { titulo: 'Importantes', categorias: [] },
                normal: { titulo: 'Normais', categorias: [] },
                info: { titulo: 'Informativas', categorias: [] }
            };

            CATEGORIAS.forEach(cat => {
                grupos[cat.prioridade].categorias.push(cat);
            });

            Object.entries(grupos).forEach(([key, grupo]) => {
                if (grupo.categorias.length === 0) return;
                
                const grupoDiv = document.createElement('div');
                grupoDiv.className = 'mb-3';
                grupoDiv.innerHTML = `
                    <div class="text-xs font-bold text-gray-600 mb-1 px-2">${grupo.titulo}</div>
                `;
                
                grupo.categorias.forEach(cat => {
                    const div = document.createElement('div');
                    div.className = `categoria-item flex items-center gap-2 p-2 rounded hover:bg-gray-50 transition cursor-pointer`;
                    div.dataset.nome = cat.nome.toLowerCase();
                    div.innerHTML = `
                        <input type="checkbox" ${cat.ativa ? 'checked' : ''} onchange="toggleCategoria('${cat.nome}')" class="cursor-pointer">
                        <span class="categoria-badge badge-${cat.prioridade}">${cat.prioridade[0].toUpperCase()}</span>
                        <span class="text-sm flex-1">${cat.nome}</span>
                    `;
                    grupoDiv.appendChild(div);
                });
                
                container.appendChild(grupoDiv);
            });
        }

        function toggleCategoria(nome) {
            const cat = CATEGORIAS.find(c => c.nome === nome);
            if (cat) {
                cat.ativa = !cat.ativa;
                if (ARQUIVOS_CACHE.length > 0) reprocessar();
            }
        }

        function selecionarTodas() {
            CATEGORIAS.forEach(c => c.ativa = true);
            renderizarCategorias();
            if (ARQUIVOS_CACHE.length > 0) reprocessar();
        }

        function desselecionarTodas() {
            CATEGORIAS.forEach(c => c.ativa = false);
            renderizarCategorias();
            if (ARQUIVOS_CACHE.length > 0) reprocessar();
        }

        function filtrarCategorias() {
            const busca = document.getElementById('buscaCategoria').value.toLowerCase();
            document.querySelectorAll('.categoria-item').forEach(item => {
                const nome = item.dataset.nome;
                item.style.display = nome.includes(busca) ? 'flex' : 'none';
            });
        }

        // Processamento de arquivos
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            
            document.getElementById('loadingOverlay').classList.remove('hidden');
            ARQUIVOS_CACHE = [];
            document.getElementById('seletorArquivoTexto').innerHTML = '<option>Nenhum arquivo selecionado</option>';
            
            try {
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    document.getElementById('loadingStatus').innerText = `Processando ${i + 1}/${files.length}: ${file.name}`;
                    
                    if (file.type === "application/pdf") {
                        const pdfData = await extrairTextoPDFPorPagina(file);
                        ARQUIVOS_CACHE.push({
                            nome: file.name,
                            texto: pdfData.textoCompleto,
                            tipo: "PDF",
                            paginas: pdfData.textoPorPagina,
                            arquivo: file
                        });
                        
                        let opt = document.createElement('option');
                        opt.value = ARQUIVOS_CACHE.length - 1;
                        opt.text = `[PDF] ${file.name}`;
                        document.getElementById('seletorArquivoTexto').appendChild(opt);
                    }
                }
                
                if (ARQUIVOS_CACHE.length > 0) {
                    document.getElementById('seletorArquivoTexto').selectedIndex = 1;
                    mostrarTextoBruto();
                    reprocessar();
                }
            } catch (err) {
                alert("Erro ao processar arquivos: " + err.message);
                console.error(err);
            } finally {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }
        });

        async function extrairTextoPDFPorPagina(file) {
            const buffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument(buffer).promise;
            let textoCompleto = "";
            let textoPorPagina = [];
            
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                const textoPagina = content.items.map(item => item.str).join(" ") + "\n";
                textoCompleto += textoPagina;
                textoPorPagina.push({ pagina: i, texto: textoPagina });
            }
            
            return { textoCompleto, textoPorPagina };
        }

        function encontrarPagina(arquivo, trecho) {
            if (arquivo.tipo === "PDF") {
                const amostra = trecho.slice(0, 100).trim();
                for (let i = 0; i < arquivo.paginas.length; i++) {
                    if (arquivo.paginas[i].texto.includes(amostra)) {
                        return arquivo.paginas[i].pagina;
                    }
                }
            }
            return 1;
        }

        function mostrarTextoBruto() {
            const idx = document.getElementById('seletorArquivoTexto').value;
            document.getElementById('textoBrutoArea').value = idx ? ARQUIVOS_CACHE[idx].texto : "";
        }

        function reprocessar() {
            const limiteCaracteres = parseInt(document.getElementById('limiteCaracteres').value) || 300;
            const mostrarPaginas = document.getElementById('mostrarPaginas').checked;
            
            RESULTADOS_CACHE = [];
            let totalTrechos = 0;
            
            ARQUIVOS_CACHE.forEach(arquivo => {
                const resultadoArquivo = {
                    nome: arquivo.nome,
                    categorias: []
                };
                
                CATEGORIAS.filter(c => c.ativa).forEach(cat => {
                    try {
                        const regex = new RegExp(cat.regex, 'gi');
                        const matches = arquivo.texto.match(regex) || [];
                        
                        const trechos = matches.map(m => {
                            const pagina = encontrarPagina(arquivo, m);
                            const texto = m.slice(0, limiteCaracteres) + (m.length > limiteCaracteres ? '...' : '');
                            totalTrechos++;
                            return { texto, pagina, textoCompleto: m };
                        });
                        
                        if (trechos.length > 0) {
                            resultadoArquivo.categorias.push({
                                nome: cat.nome,
                                prioridade: cat.prioridade,
                                trechos: trechos
                            });
                        }
                    } catch (e) {
                        console.error(`Erro no regex de ${cat.nome}:`, e);
                    }
                });
                
                RESULTADOS_CACHE.push(resultadoArquivo);
            });
            
            renderizarResultados(mostrarPaginas);
            document.getElementById('statusCount').innerText = `${ARQUIVOS_CACHE.length} arquivos • ${totalTrechos} trechos encontrados`;
        }

        function renderizarResultados(mostrarPaginas) {
            const container = document.getElementById('resultadosContainer');
            container.innerHTML = '';
            
            RESULTADOS_CACHE.forEach((resultado, idxArq) => {
                const arquivoDiv = document.createElement('div');
                arquivoDiv.className = 'bg-white border rounded-lg shadow-sm p-4';
                
                let html = `
                    <h3 class="font-bold text-lg mb-3 text-blue-900 flex items-center gap-2">
                        <i class="fas fa-file-pdf text-red-600"></i>
                        ${resultado.nome}
                    </h3>
                `;
                
                if (resultado.categorias.length === 0) {
                    html += `<p class="text-gray-400 italic text-sm">Nenhum resultado encontrado nas categorias selecionadas.</p>`;
                } else {
                    resultado.categorias.forEach(cat => {
                        html += `
                            <div class="mb-4 border-l-4 border-${cat.prioridade === 'critico' ? 'red' : cat.prioridade === 'importante' ? 'orange' : cat.prioridade === 'normal' ? 'green' : 'blue'}-500 pl-3">
                                <div class="flex items-center gap-2 mb-2">
                                    <span class="categoria-badge badge-${cat.prioridade}">${cat.prioridade[0].toUpperCase()}</span>
                                    <strong class="text-sm">${cat.nome}</strong>
                                    <span class="text-xs text-gray-500">(${cat.trechos.length} ocorrência${cat.trechos.length > 1 ? 's' : ''})</span>
                                </div>
                                <div class="space-y-2">
                        `;
                        
                        cat.trechos.forEach((trecho, idx) => {
                            const linkPagina = mostrarPaginas ? `
                                <a href="#" onclick="abrirPagina(${idxArq}, ${trecho.pagina}); return false;" class="link-pagina" title="Abrir página ${trecho.pagina}">
                                    <i class="fas fa-external-link-alt text-xs"></i> pág. ${trecho.pagina}
                                </a>
                            ` : '';
                            
                            html += `
                                <div class="text-sm bg-gray-50 p-2 rounded border border-gray-200">
                                    <div class="flex justify-between items-start gap-2 mb-1">
                                        <span class="text-xs text-gray-500 font-mono">#${idx + 1}</span>
                                        ${linkPagina}
                                    </div>
                                    <p class="text-gray-700">${trecho.texto}</p>
                                </div>
                            `;
                        });
                        
                        html += `
                                </div>
                            </div>
                        `;
                    });
                }
                
                arquivoDiv.innerHTML = html;
                container.appendChild(arquivoDiv);
            });
        }

        function abrirPagina(idxArquivo, numPagina) {
            const arquivo = ARQUIVOS_CACHE[idxArquivo];
            if (!arquivo || !arquivo.arquivo) {
                alert('Arquivo não disponível para visualização.');
                return;
            }
            
            // Criar URL do arquivo e abrir em nova aba com fragmento de página
            const url = URL.createObjectURL(arquivo.arquivo);
            window.open(`${url}#page=${numPagina}`, '_blank');
            
            // Limpar URL após 5 segundos
            setTimeout(() => URL.revokeObjectURL(url), 5000);
        }

        // Funções de exportação
        function exportarHTML() {

            RESULTADOS_CACHE.forEach(resultado => {

                resultado.categorias.forEach(cat => {
                    html += `

                    `;

                                    <span class="link-pagina">Página ${trecho.pagina}</span>

        }

        function exportarExcel() {
            const wb = XLSX.utils.book_new();
            
            RESULTADOS_CACHE.forEach(resultado => {
                const ws_data = [['Categoria', 'Prioridade', 'Página', 'Trecho']];
                
                resultado.categorias.forEach(cat => {
                    cat.trechos.forEach(trecho => {
                        ws_data.push([
                            cat.nome,
                            cat.prioridade.toUpperCase(),
                            trecho.pagina,
                            trecho.textoCompleto || trecho.texto
                        ]);
                    });
                });
                
                const ws = XLSX.utils.aoa_to_sheet(ws_data);
                
                // Ajustar largura das colunas
                ws['!cols'] = [
                    { wch: 30 },
                    { wch: 12 },
                    { wch: 8 },
                    { wch: 80 }
                ];
                
                const nomeAba = resultado.nome.slice(0, 30).replace(/[\\\/\?\*\[\]]/g, '_');
                XLSX.utils.book_append_sheet(wb, ws, nomeAba);
            });
            
            XLSX.writeFile(wb, 'extrator_resultados.xlsx');
        }

        function exportarJSON() {
            const data = {
                metadata: {
                    dataExtracao: new Date().toISOString(),
                    totalArquivos: ARQUIVOS_CACHE.length,
                    categoriasAtivas: CATEGORIAS.filter(c => c.ativa).map(c => c.nome)
                },
                resultados: RESULTADOS_CACHE
            };
            
            download('extrator_resultados.json', JSON.stringify(data, null, 2), 'application/json;charset=utf-8');
        }

        function exportarXML() {
            let xml = '<?xml version="1.0" encoding="UTF-8"?>\n<ExtratorJuridico>\n';
            xml += `    <Metadata>\n`;
            xml += `        <DataExtracao>${new Date().toISOString()}</DataExtracao>\n`;
            xml += `        <TotalArquivos>${ARQUIVOS_CACHE.length}</TotalArquivos>\n`;
            xml += `    </Metadata>\n`;
            xml += `    <Resultados>\n`;
            
            RESULTADOS_CACHE.forEach(resultado => {
                xml += `        <Arquivo nome="${escapeXml(resultado.nome)}">\n`;
                
                resultado.categorias.forEach(cat => {
                    xml += `            <Categoria nome="${escapeXml(cat.nome)}" prioridade="${cat.prioridade}">\n`;
                    
                    cat.trechos.forEach((trecho, idx) => {
                        xml += `                <Trecho id="${idx + 1}" pagina="${trecho.pagina}">\n`;
                        xml += `                    <![CDATA[${trecho.textoCompleto || trecho.texto}]]>\n`;
                        xml += `                </Trecho>\n`;
                    });
                    
                    xml += `            </Categoria>\n`;
                });
                
                xml += `        </Arquivo>\n`;
            });
            
            xml += `    </Resultados>\n</ExtratorJuridico>`;
            
            download('extrator_resultados.xml', xml, 'application/xml;charset=utf-8');
        }

        function escapeXml(unsafe) {
            return unsafe.replace(/[<>&'"]/g, c => {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                    default: return c;
                }
            });
        }

        function download(filename, text, mime = "text/plain") {
            const blob = new Blob([text], { type: mime });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        }
    </script>
