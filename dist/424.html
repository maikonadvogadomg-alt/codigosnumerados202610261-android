<!DOCTYPE html>
<html>
<head>
    <title>🔑 JWT Generator PDJUD/PDPJ</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial; 
            max-width: 700px; 
            margin: 50px auto; 
            padding: 30px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); 
        }
        input, textarea, select { 
            width: 100%; 
            padding: 15px; 
            margin: 10px 0; 
            border: 2px solid #e9ecef; 
            border-radius: 10px; 
            font-size: 16px; 
            box-sizing: border-box; 
            font-family: monospace;
        }
        button { 
            background: linear-gradient(45deg, #28a745, #20c997); 
            color: white; 
            padding: 18px; 
            width: 100%; 
            font-size: 20px; 
            font-weight: bold; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: all 0.3s; 
        }
        button:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 10px 25px rgba(40,167,69,0.4); 
        }
        #resultado { 
            margin-top: 25px; 
            padding: 25px; 
            border-radius: 12px; 
            white-space: pre-wrap; 
            font-family: monospace; 
            font-size: 14px;
            line-height: 1.6;
        }
        .sucesso { 
            background: linear-gradient(45deg, #d4edda, #c3e6cb); 
            border: 3px solid #28a745; 
            color: #155724; 
        }
        .jwt-input { background: #f8f9fa; border-color: #007bff; }
        h1 { 
            color: #1a3c34; 
            text-align: center; 
            margin-bottom: 30px;
            font-size: 28px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚖️ JWT Generator - PDJUD/PDPJ Brasil</h1>
        
        <label>👤 CPF (11 dígitos):</label>
        <input type="text" id="cpf" class="jwt-input" placeholder="12345678901" maxlength="11">
        
        <label>🏛️ OAB Completa:</label>
        <input type="text" id="oab" class="jwt-input" placeholder="OAB/MG 123456">
        
        <label>🏢 CNPJ Escritório:</label>
        <input type="text" id="cnpj" class="jwt-input" placeholder="12.345.678/0001-90">
        
        <label>🔑 Secret Key (PDPJ/PDJUD):</label>
        <input type="text" id="secret" class="jwt-input" placeholder="sua_chave_secreta_pdpj">
        
        <label>⏰ Expiração (minutos):</label>
        <select id="expiracao">
            <option value="60">1 hora (PDJUD padrão)</option>
            <option value="3600">1 dia</option>
            <option value="86400">1 mês</option>
        </select>

        <button onclick="gerarJWT()">🚀 GERAR TOKEN JWT PDJUD</button>
        
        <div id="resultado"></div>
    </div>

    <script>
        // 🔐 JWT Generator Puro JavaScript (sem bibliotecas)
        function base64urlEncode(str) {
            return btoa(String(str))
                .replace(/+/g, '-')
                .replace(///g, '_')
                .replace(/=/g, '');
        }

        function base64urlDecode(str) {
            str = str.replace(/-/g, '+').replace(/_/g, '/');
            while (str.length % 4) str += '=';
            return atob(str);
        }

        function sha256(str) {
            function rotate(val, shift) {
                return (val << shift) | (val >>> (32 - shift));
            }
            const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
            const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5];
            let msg = new TextEncoder().encode(str);
            let len = msg.length * 8;
            msg.push(0x80);
            while (msg.length % 64 !== 56) msg.push(0);
            let view = new DataView(new ArrayBuffer(msg.length + 8));
            for (let i = 0; i < msg.length; i++) view.setUint8(i, msg[i]);
            view.setUint32(msg.length, len, true);
            view.setUint32(msg.length + 4, 0, true);
            
            for (let chunk = 0; chunk < view.byteLength; chunk += 64) {
                let w = new Uint32Array(64);
                for (let i = 0; i < 16; i++) w[i] = view.getUint32(chunk + i * 4, true);
                for (let i = 16; i < 64; i++) {
                    let x = w[i-15], y = w[i-2], z = w[i-16], t = w[i-7];
                    w[i] = (rotate(z,7)^rotate(z,18)^(z>>>3)) + t + (rotate(y,17)^rotate(y,19)^(y>>>10)) + x;
                }
                let a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
                for (let i = 0; i < 64; i++) {
                    let t1 = h + (rotate(e,6)^rotate(e,11)^rotate(e,25)) + ((e&f)^((~e)&g)) + K[i] + w[i];
                    let t2 = (rotate(a,2)^rotate(a,13)^rotate(a,22)) + ((a&b)|(a&c)|(b&c));
                    h = g; g = f; f = e; e = d + t1; d = c; c = b; b = a; a = t1 + t2;
                }
                for (let i = 0; i < 8; i++) H[i] += [a,b,c,d,e,f,g,h][i];
            }
            let hash = new Uint8Array(32);
            for (let i = 0; i < 8; i++) {
                hash[i*4] = (H[i] >>> 24) & 0xff;
                hash[i*4+1] = (H[i] >>> 16) & 0xff;
                hash[i*4+2] = (H[i] >>> 8) & 0xff;
                hash[i*4+3] = H[i] & 0xff;
            }
            return Array.from(hash).map(b => String.fromCharCode(b)).join('');
        }

        function gerarJWT() {
            const cpf = document.getElementById('cpf').value.replace(/D/g,'');
            const oab = document.getElementById('oab').value;
            const cnpj = document.getElementById('cnpj').value.replace(/D/g,'');
            const secret = document.getElementById('secret').value || 'pdjud_default_secret';
            const expMinutos = parseInt(document.getElementById('expiracao').value);
            
            if(cpf.length !== 11) {
                document.getElementById('resultado').innerHTML = 
                    '<div class="erro">❌ CPF deve ter 11 dígitos!</div>';
                return;
            }
            
            const agora = Math.floor(Date.now() / 1000);
            const payload = {
                sub: cpf,
                oab: oab,
                cnpj: cnpj,
                iss: "PDJUD-VBA",
                aud: "https://homolog.eproc.tjmg.jus.br",
                iat: agora,
                exp: agora + (expMinutos * 60),
                jti: 'pdjud-' + Math.random().toString(36).substr(2, 9),
                scope: "pdjud.read pdjud.write pdpj.basic"
            };
            
            const header = { alg: 'HS256', typ: 'JWT' };
            const encodedHeader = base64urlEncode(JSON.stringify(header));
            const encodedPayload = base64urlEncode(JSON.stringify(payload));
            const signatureInput = encodedHeader + '.' + encodedPayload;
            const signature = base64urlEncode(sha256(signatureInput + secret));
            
            const jwt = signatureInput + '.' + signature;
            
            document.getElementById('resultado').innerHTML = `
<div class="sucesso">
✅ <strong>TOKEN JWT PDJUD GERADO!</strong>

📋 <strong>Payload:</strong>
<textarea rows="6" readonly>${JSON.stringify(payload, null, 2)}</textarea>

🔑 <strong>TOKEN COMPLETO (copie esta linha):</strong>
<textarea rows="2" readonly style="font-size:16px;background:#000;color:#0f0;">${jwt}</textarea>

📤 <strong>Teste API PDJUD:</strong>
<code>curl -H "Authorization: Bearer ${jwt.substring(0,50)}..."<br>
https://homolog.eproc.tjmg.jus.br/pdjude/api/processos?cpf=${cpf}</code>

⏰ <strong>Validade:</strong> ${new Date((agora + expMinutos*60)*1000).toLocaleString('pt-BR')}
<br>🔐 <strong>Assinado com:</strong> ${secret.substring(0,20)}...
</div>`;
            
            // Copia automaticamente
            navigator.clipboard.writeText(jwt).then(() => {
                console.log('✅ JWT copiado!');
            });
        }
        
        // Enter para gerar
        document.addEventListener('keypress', function(e) {
            if(e.key === 'Enter') gerarJWT();
        });
    </script>
</body>
</html>
