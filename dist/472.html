,ta){P[path].content=ta.value;P[path].modified=true;renderTabs();}\nfunction saveF(path){P[path].modified=false;renderTabs();renderTree();toast('💾 Salvo!');}\n\n// ══════════════════════════════════════════\n// ANÁLISE COMPLETA\n// ══════════════════════════════════════════\nfunction runAnalysis(){\n  const paths=Object.keys(P);\n  if(!paths.length) return;\n\n  const has=p=>typeof p==='string'?paths.some(x=>x===p||x.endsWith('/'+p)||x.includes(p)):paths.some(x=>p.test(x));\n  const get=p=>paths.find(x=>typeof p==='string'?(x===p||x.endsWith('/'+p)):p.test(x));\n  const content=p=>{const k=get(p);return k?P[k]?.content||'':'';}\n\n  // package.json\n  let pkg={};\n  try{pkg=JSON.parse(content('package.json'));}catch{}\n  const deps={...pkg.dependencies,...pkg.devDependencies};\n\n  // Detecções\n  const isReact=!!(deps.react);\n  const isVite=!!(deps.vite)||has('vite.config');\n  const isExpo=!!(deps.expo)||has('app.json')||has('app.config.js');\n  const isElectron=!!(deps.electron)||has('electron/main.js')||has('main.js');\n  const isCapacitor=!!(deps['@capacitor/core'])||has('capacitor.config');\n  const isNext=!!(deps.next);\n  const isWorkspace=pkg.name?.includes('/')||pkg.name?.includes('@workspace')||!!pkg.workspaces;\n  const hasManifest=has('manifest.json');\n  const hasSW=has('sw.js')||has('service-worker.js');\n  const hasWorkflow=has('.github/workflows');\n  const hasAndroid=paths.some(p=>p.startsWith('android/'));\n  const hasElectronBuilder=has('electron-builder.yml')||has('electron-builder.json');\n  const hasIndexHtml=has('index.html');\n  const hasEnv=has('.env');\n  const hasReplitRefs=paths.some(p=>/replit\\.dev|repl\\.co|REPL_ID|REPLIT|cartographer|vite-plugin-dev-banner/i.test(P[p]?.content||''));\n  const hasTsconfigBase=paths.some(p=>{const c=P[p]?.content||'';return c.includes('../../tsconfig')||c.includes('../tsconfig.base');});\n  const hasWorkspaceRef=paths.some(p=>{const c=P[p]?.content||'';return c.includes('@workspace/');});\n\n  // Tipo de projeto\n  let type='HTML Puro';\n  if(isExpo) type='Expo / React Native';\n  else if(isElectron&&isReact) type='Electron + React';\n  else if(isElectron) type='Electron';\n  else if(isNext) type='Next.js';\n  else if(isReact&&isVite) type='React + Vite';\n  else if(isReact) type='React';\n  else if(pkg.name) type='Node.js';\n\n  // Arquivos com problemas\n  const problemFiles=[];\n  if(hasTsconfigBase) paths.filter(p=>P[p]?.content?.includes('../../tsconfig')).forEach(p=>problemFiles.push(p));\n  if(hasWorkspaceRef) paths.filter(p=>P[p]?.content?.includes('@workspace/')).forEach(p=>problemFiles.push(p));\n  if(hasReplitRefs) paths.filter(p=>/replit\\.dev|repl\\.co|REPL_ID|REPLIT/i.test(P[p]?.content||'')).forEach(p=>problemFiles.push(p));\n\n  // Problemas críticos\n  const problems=[];\n  if(isWorkspace) problems.push({type:'err',title:'Monorepo / Workspace detectado',desc:'package.json tem referências @workspace/ que impedem rodar standalone',fix:'fixWorkspace'});\n  if(hasTsconfigBase) problems.push({type:'err',title:'tsconfig.json aponta para pasta superior',desc:'extends: ../../tsconfig.base.json — não existe fora do monorepo',fix:'genTsconfig'});\n  if(hasWorkspaceRef) problems.push({type:'err',title:'Imports @workspace/ encontrados',desc:'Arquivos importam de @workspace/ que não existe standalone',fix:'fixWorkspaceImports'});\n  if(hasReplitRefs) problems.push({type:'warn',title:'Referências ao Replit detectadas',desc:'URLs replit.dev / REPL_ID / plugins do Replit encontrados',fix:'cleanAllReplit'});\n  if(!hasIndexHtml) problems.push({type:'warn',title:'index.html não encontrado',desc:'Necessário como ponto de entrada do app'});\n  if(!hasManifest&&!isElectron) problems.push({type:'warn',title:'manifest.json ausente',desc:'Necessário para PWA e APK via Capacitor'});\n  if(!hasSW&&!isElectron) problems.push({type:'warn',title:'Service Worker ausente',desc:'Necessário para funcionamento offline'});\n  if(isElectron&&!hasElectronBuilder) problems.push({type:'warn',title:'electron-builder.yml ausente',desc:'Necessário para gerar .exe / .dmg / .AppImage'});\n  if(isCapacitor&&!hasAndroid) problems.push({type:'warn',title:'Pasta android/ ausente',desc:'Execute: npx cap add android'});\n  if(!hasWorkflow) problems.push({type:'warn',title:'GitHub Actions ausente',desc:'Sem workflow para build automático'});\n\n  AN={\n    type,paths,pkg,deps,\n    isReact,isVite,isExpo,isElectron,isCapacitor,isNext,\n    isWorkspace,hasManifest,hasSW,hasWorkflow,hasAndroid,\n    hasElectronBuilder,hasIndexHtml,hasEnv,hasReplitRefs,\n    hasTsconfigBase,hasWorkspaceRef,\n    problems,problemFiles,\n    total:paths.length,\n    totalSize:paths.reduce((s,p)=>s+(P[p]?.content?.length||0),0),\n  };\n\n  renderPanel();\n  switchP('diag');\n}\n\nfunction analyzeFile(path){\n  const c=P[path]?.content||'';\n  const issues=[];\n  if(/replit\\.dev|repl\\.co|REPL_ID/i.test(c)) issues.push('⚠️ Referências ao Replit');\n  if(c.includes('../../tsconfig')) issues.push('❌ Aponta para tsconfig fora da pasta');\n  if(c.includes('@workspace/')) issues.push('❌ Import @workspace/ — não funciona standalone');\n  if(c.includes('localhost:3000')&&!c.includes('proxy')) issues.push('⚠️ URL hardcoded localhost:3000');\n  if(issues.length===0) issues.push('✅ Nenhum problema encontrado');\n  toast(issues.join(' | '), issues.some(i=>i.includes('❌'))?'err':issues.some(i=>i.includes('⚠️'))?'warn':'ok');\n}\n\n// ══════════════════════════════════════════\n// PAINEL\n// ══════════════════════════════════════════\nfunction switchP(tab){\n  PANEL=tab;\n  document.querySelectorAll('.ptab').forEach((t,i)=>{\n    t.classList.toggle('active',['diag','gerar','limpar','deploy'][i]===tab);\n  });\n  renderPanel();\n}\n\nfunction renderPanel(){\n  const el=document.getElementById('pc');\n  if(!AN){el.innerHTML='\u003cdiv style=\"color:#8b949e;font-size:11px;text-align:center;padding:20px\">\u003cdiv style=\"font-size:28px;margin-bottom:6px\">🔍\u003c/div>Importe um projeto\u003c/div>';return;}\n  if(PANEL==='diag') renderDiag(el);\n  else if(PANEL==='gerar') renderGerar(el);\n  else if(PANEL==='limpar') renderLimpar(el);\n  else if(PANEL==='deploy') renderDeploy(el);\n}\n\nfunction renderDiag(el){\n  const a=AN;\n  const errs=a.problems.filter(p=>p.type==='err').length;\n  const warns=a.problems.filter(p=>p.type==='warn').length;\n  el.innerHTML=`\n    \u003cdiv class=\"stats\">\n      \u003cdiv class=\"stat\">\u003cdiv class=\"n\">${a.total}\u003c/div>\u003cdiv class=\"l\">Arquivos\u003c/div>\u003c/div>\n      \u003cdiv class=\"stat\">\u003cdiv class=\"n\" style=\"color:${errs?'#f85149':'#3fb950'}\">${errs}\u003c/div>\u003cdiv class=\"l\">Erros\u003c/div>\u003c/div>\n      \u003cdiv class=\"stat\">\u003cdiv class=\"n\" style=\"color:${warns?'#e3b341':'#3fb950'}\">${warns}\u003c/div>\u003cdiv class=\"l\">Avisos\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"progress-bar\">\u003cdiv class=\"progress-fill\" style=\"width:${Math.max(10,100-errs*20-warns*10)}%\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"sec\">\n      \u003ch3>Tipo de Projeto\u003c/h3>\n      \u003cdiv class=\"card ok\">\u003cspan class=\"ci\">🏗️\u003c/span>\u003cdiv class=\"ct\">\u003cdiv class=\"cl\">${a.type}\u003c/div>\u003cdiv class=\"cd\">${fmtSz(a.totalSize)} · ${a.total} arquivos\u003c/div>\u003c/div>\u003c/div>\n    \u003c/div>\n    ${a.problems.length?`\n    \u003cdiv class=\"sec\">\n      \u003ch3>Problemas Encontrados\u003c/h3>\n      ${a.problems.map(p=>`\n        \u003cdiv class=\"problem\">\n          \u003cdiv class=\"pt\">${p.type==='err'?'❌':'⚠️'} ${p.title}\u003c/div>\n          \u003cdiv class=\"pd\">${p.desc}\u003c/div>\n          ${p.fix?`\u003cbutton class=\"pf\" onclick=\"${p.fix}()\">🔧 Corrigir automaticamente\u003c/button>`:''}\n        \u003c/div>`).join('')}\n    \u003c/div>`:'\u003cdiv class=\"card ok\">\u003cspan class=\"ci\">✅\u003c/span>\u003cdiv class=\"ct\">\u003cdiv class=\"cl\">Nenhum problema crítico!\u003c/div>\u003c/div>\u003c/div>'}\n    \u003cdiv class=\"sec\">\n      \u003ch3>Checklist\u003c/h3>\n      ${chk('index.html',a.hasIndexHtml,'Ponto de entrada')}\n      ${chk('manifest.json',a.hasManifest,'PWA / APK')}\n      ${chk('Service Worker',a.hasSW,'Offline')}\n      ${chk('Capacitor',a.isCapacitor,'APK Android')}\n      ${chk('android/',a.hasAndroid,'Pasta nativa')}\n      ${chk('Electron',a.isElectron,'Desktop .exe')}\n      ${chk('electron-builder',a.hasElectronBuilder,'Config .exe')}\n      ${chk('GitHub Actions',a.hasWorkflow,'Build automático')}\n    \u003c/div>\n    \u003cbutton class=\"gb\" onclick=\"switchP('gerar')\" style=\"background:#1f3a5f;border-color:#1f6feb;margin-top:4px\">\n      \u003cspan class=\"gbi\">⚙️\u003c/span>\u003cdiv class=\"gbt\">Gerar arquivos que faltam\u003cspan class=\"gbd\">Corrige automaticamente\u003c/span>\u003c/div>\u003cspan class=\"badge bg-info\">→\u003c/span>\n    \u003c/button>`;\n}\n\nfunction chk(label,ok,detail){\n  return `\u003cdiv class=\"card ${ok?'ok':'warn'}\">\n    \u003cspan class=\"ci\">${ok?'✅':'⚠️'}\u003c/span>\n    \u003cdiv class=\"ct\">\u003cdiv class=\"cl\">${label}\u003c/div>\u003cdiv class=\"cd\">${ok?'Encontrado':'Faltando — '+detail}\u003c/div>\u003c/div>\n  \u003c/div>`;\n}\n\nfunction renderGerar(el){\n  const a=AN;\n  el.innerHTML=`\n    \u003cdiv class=\"sec\">\n      \u003ch3>Alvo do Build\u003c/h3>\n      \u003cdiv class=\"target-selector\">\n        \u003cbutton class=\"target-btn ${TARGET==='apk'?'active':''}\" onclick=\"setTarget('apk')\">\n          \u003cspan class=\"tbi\">📱\u003c/span>APK\n        \u003c/button>\n        \u003cbutton class=\"target-btn ${TARGET==='exe'?'active':''}\" onclick=\"setTarget('exe')\">\n          \u003cspan class=\"tbi\">🖥️\u003c/span>EXE\n        \u003c/button>\n        \u003cbutton class=\"target-btn ${TARGET==='pwa'?'active':''}\" onclick=\"setTarget('pwa')\">\n          \u003cspan class=\"tbi\">🌐\u003c/span>PWA\n        \u003c/button>\n        \u003cbutton class=\"target-btn ${TARGET==='all'?'active':''}\" onclick=\"setTarget('all')\">\n          \u003cspan class=\"tbi\">🎯\u003c/span>Todos\n        \u003c/button>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"sec\">\n      \u003ch3>Gerar Tudo de Uma Vez\u003c/h3>\n      \u003cbutton class=\"gb\" onclick=\"genAll()\" style=\"background:#0d2818;border-color:#238636\">\n        \u003cspan class=\"gbi\">🚀\u003c/span>\n        \u003cdiv class=\"gbt\">Gerar TODOS os arquivos necessários\u003cspan class=\"gbd\">Para ${TARGET==='all'?'APK + EXE + PWA':TARGET.toUpperCase()}\u003c/span>\u003c/div>\n        \u003cspan class=\"badge bg-ok\">AUTO\u003c/span>\n      \u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"sec\">\n      \u003ch3>Arquivos Individuais\u003c/h3>\n      ${!a.hasManifest?gb('📋','Gerar manifest.json','PWA obrigatório','genManifest','falta'):''}\n      ${!a.hasSW?gb('⚙️','Gerar service-worker.js','Cache offline','genSW','falta'):''}\n      ${!a.isCapacitor?gb('📱','Gerar capacitor.config.ts','Para APK Android','genCapacitor','falta'):''}\n      ${!a.hasElectronBuilder?gb('🖥️','Gerar electron-builder.yml','Para .exe Windows','genElectronBuilder','falta'):''}\n      ${!a.hasWorkflow?gb('🔄','Gerar workflow APK','GitHub Actions','genWfApk','falta'):''}\n      ${!a.hasWorkflow?gb('🖥️','Gerar workflow EXE','GitHub Actions Windows','genWfExe','falta'):''}\n      ${!a.hasWorkflow?gb('🌐','Gerar workflow Pages','Deploy GitHub Pages','genWfPages','falta'):''}\n      ${gb('📦','Corrigir package.json','Remove @workspace/','fixWorkspace','corrigir')}\n      ${gb('📘','Gerar tsconfig.json','Standalone sem monorepo','genTsconfig','gerar')}\n      ${gb('⚡','Gerar vite.config.ts','Configuração correta','genVite','gerar')}\n      ${gb('📋','Gerar manifest.json','PWA completo','genManifest','gerar')}\n      ${gb('⚙️','Gerar service-worker.js','Offline cache','genSW','gerar')}\n      ${gb('📱','Gerar capacitor.config.ts','Android config','genCapacitor','gerar')}\n      ${gb('🖥️','Gerar electron-builder.yml','Desktop config','genElectronBuilder','gerar')}\n      ${gb('📋','Gerar eas.json','Expo EAS Build','genEas','gerar')}\n    \u003c/div>`;\n}\n\nfunction gb(icon,label,detail,fn,badge){\n  const bc=badge==='falta'?'bg-err':badge==='corrigir'?'bg-warn':'bg-info';\n  return `\u003cbutton class=\"gb\" onclick=\"${fn}()\">\n    \u003cspan class=\"gbi\">${icon}\u003c/span>\n    \u003cdiv class=\"gbt\">${label}\u003cspan class=\"gbd\">${detail}\u003c/span>\u003c/div>\n    \u003cspan class=\"badge ${bc}\">${badge}\u003c/span>\n  \u003c/button>`;\n}\n\nfunction setTarget(t){TARGET=t;renderPanel();}\n\nfunction renderLimpar(el){\n  const rFiles=Object.keys(P).filter(p=>/replit\\.dev|repl\\.co|REPL_ID|REPLIT|cartographer|vite-plugin-dev-banner|vite-plugin-runtime-error/i.test(P[p]?.content||''));\n  const wsFiles=Object.keys(P).filter(p=>P[p]?.content?.includes('@workspace/'));\n  const tsFiles=Object.keys(P).filter(p=>P[p]?.content?.includes('../../tsconfig'));\n  el.innerHTML=`\n    \u003cdiv class=\"sec\">\n      \u003ch3>Limpeza Automática\u003c/h3>\n      \u003cbutton class=\"gb\" onclick=\"cleanAll()\" style=\"background:#2d0f0f;border-color:#f85149\">\n        \u003cspan class=\"gbi\">🧹\u003c/span>\n        \u003cdiv class=\"gbt\">Limpar TUDO automaticamente\u003cspan class=\"gbd\">Replit + @workspace + tsconfig\u003c/span>\u003c/div>\n        \u003cspan class=\"badge bg-err\">${rFiles.length+wsFiles.length+tsFiles.length}\u003c/span>\n      \u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"sec\">\n      \u003ch3>Referências Replit ${rFiles.length?`(${rFiles.length})`:'✅'}\u003c/h3>\n      ${rFiles.length===0\n        ?'\u003cdiv class=\"card ok\">\u003cspan class=\"ci\">✅\u003c/span>\u003cdiv class=\"ct\">\u003cdiv class=\"cl\">Limpo!\u003c/div>\u003c/div>\u003c/div>'\n        :`\u003cbutton class=\"gb\" onclick=\"cleanAllReplit()\" style=\"background:#2d1f00;border-color:#9a6700\">\n            \u003cspan class=\"gbi\">🧹\u003c/span>\u003cdiv class=\"gbt\">Limpar todos\u003cspan class=\"gbd\">${rFiles.length} arquivos\u003c/span>\u003c/div>\n            \u003cspan class=\"badge bg-warn\">${rFiles.length}\u003c/span>\n          \u003c/button>\n          ${rFiles.slice(0,8).map(p=>`\n            \u003cdiv style=\"display:flex;align-items:center;gap:6px;padding:4px 6px;background:#2d1f00;border-radius:4px;margin-bottom:3px;font-size:10px;color:#e3b341\">\n              \u003cspan style=\"flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">${fIcon(p.split('/').pop())} ${p}\u003c/span>\n              \u003cbutton onclick=\"cleanReplit('${esc(p)}')\" style=\"padding:1px 6px;border-radius:3px;border:none;background:#9a6700;color:#fff;cursor:pointer;font-size:9px;flex-shrink:0\">Limpar\u003c/button>\n            \u003c/div>`).join('')}`}\n    \u003c/div>\n    \u003cdiv class=\"sec\">\n      \u003ch3>Imports @workspace/ ${wsFiles.length?`(${wsFiles.length})`:'✅'}\u003c/h3>\n      ${wsFiles.length===0\n        ?'\u003cdiv class=\"card ok\">\u003cspan class=\"ci\">✅\u003c/span>\u003cdiv class=\"ct\">\u003cdiv class=\"cl\">Limpo!\u003c/div>\u003c/div>\u003c/div>'\n        :`\u003cbutton class=\"gb\" onclick=\"fixWorkspaceImports()\" style=\"background:#2d1f00;border-color:#9a6700\">\n            \u003cspan class=\"gbi\">🔧\u003c/span>\u003cdiv class=\"gbt\">Corrigir todos\u003cspan class=\"gbd\">${wsFiles.length} arquivos\u003c/span>\u003c/div>\n            \u003cspan class=\"badge bg-warn\">${wsFiles.length}\u003c/span>\n          \u003c/button>`}\n    \u003c/div>\n    \u003cdiv class=\"sec\">\n      \u003ch3>Outros\u003c/h3>\n      \u003cbutton class=\"gb\" onclick=\"rmNodeModules()\">\u003cspan class=\"gbi\">🗑️\u003c/span>\u003cdiv class=\"gbt\">Remover node_modules/\u003cspan class=\"gbd\">Reduz tamanho do ZIP\u003c/span>\u003c/div>\u003cspan class=\"badge bg-warn\">pesado\u003c/span>\u003c/button>\n      \u003cbutton class=\"gb\" onclick=\"rmDist()\">\u003cspan class=\"gbi\">🗑️\u003c/span>\u003cdiv class=\"gbt\">Remover dist/ build/ www/\u003cspan class=\"gbd\">Rebuild necessário\u003c/span>\u003c/div>\u003cspan class=\"badge bg-info\">rebuild\u003c/span>\u003c/button>\n    \u003c/div>`;\n}\n\nfunction renderDeploy(el){\n  el.innerHTML=`\n    \u003cdiv class=\"sec\">\n      \u003ch3>Instruções de Deploy\u003c/h3>\n      \u003cdiv class=\"card ok\">\u003cspan class=\"ci\">1️⃣\u003c/span>\u003cdiv class=\"ct\">\u003cdiv class=\"cl\">Gere os arquivos\u003c/div>\u003cdiv class=\"cd\">Aba ⚙️ Gerar → clique \"Gerar TODOS\"\u003c/div>\u003c/div>\u003c/div>\n      \u003cdiv class=\"card ok\">\u003cspan class=\"ci\">2️⃣\u003c/span>\u003cdiv class=\"ct\">\u003cdiv class=\"cl\">Exporte o ZIP\u003c/div>\u003cdiv class=\"cd\">Botão 💾 Exportar no topo\u003c/div>\u003c/div>\u003c/div>\n      \u003cdiv class=\"card ok\">\u003cspan class=\"ci\">3️⃣\u003c/span>\u003cdiv class=\"ct\">\u003cdiv class=\"cl\">Suba no GitHub\u003c/div>\u003cdiv class=\"cd\">Crie repositório e faça upload do ZIP\u003c/div>\u003c/div>\u003c/div>\n      \u003cdiv class=\"card ok\">\u003cspan class=\"ci\">4️⃣\u003c/span>\u003cdiv class=\"ct\">\u003cdiv class=\"cl\">Configure Secrets\u003c/div>\u003cdiv class=\"cd\">Settings → Secrets → Actions\u003c/div>\u003c/div>\u003c/div>\n      \u003cdiv class=\"card ok\">\u003cspan class=\"ci\">5️⃣\u003c/span>\u003cdiv class=\"ct\">\u003cdiv class=\"cl\">Dispare o workflow\u003c/div>\u003cdiv class=\"cd\">Actions → Run workflow\u003c/div>\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"sec\">\n      \u003ch3>Secrets necessários\u003c/h3>\n      ${secret('GITHUB_TOKEN','Gerado automaticamente pelo GitHub','✅ Automático')}\n      ${secret('KEYSTORE_BASE64','Para assinar APK de produção','⚠️ Opcional')}\n      ${secret('KEY_ALIAS','Alias do keystore','⚠️ Opcional')}\n      ${secret('KEY_PASSWORD','Senha do keystore','⚠️ Opcional')}\n    \u003c/div>\n    \u003cdiv class=\"sec\">\n      \u003ch3>Exportar\u003c/h3>\n      \u003cbutton class=\"gb\" onclick=\"exportZip()\" style=\"background:#0d2818;border-color:#238636\">\n        \u003cspan class=\"gbi\">💾\u003c/span>\u003cdiv class=\"gbt\">Baixar projeto corrigido\u003cspan class=\"gbd\">Pronto para subir no GitHub\u003c/span>\u003c/div>\n        \u003cspan class=\"badge bg-ok\">ZIP\u003c/span>\n      \u003c/button>\n    \u003c/div>`;\n}\n\nfunction secret(name,desc,status){\n  return `\u003cdiv class=\"card ${status.includes('✅')?'ok':'warn'}\">\n    \u003cspan class=\"ci\">${status.includes('✅')?'✅':'⚠️'}\u003c/span>\n    \u003cdiv class=\"ct\">\u003cdiv class=\"cl\">${name}\u003c/div>\u003cdiv class=\"cd\">${desc} — ${status}\u003c/div>\u003c/div>\n  \u003c/div>`;\n}\n\n// ══════════════════════════════════════════\n// LIMPEZA\n// ══════════════════════════════════════════\nconst RP=[\n  [/https?:\\/\\/[a-z0-9-]+\\.replit\\.dev[^\\s\"'`)]*/gi,''],\n  [/https?:\\/\\/[a-z0-9-]+\\.repl\\.co[^\\s\"'`)]*/gi,''],\n  [/\"REPLIT_DEV_DOMAIN\"\\s*:\\s*\"[^\"]*\"/gi,'\"REPLIT_DEV_DOMAIN\":\"\"'],\n  [/\"REPL_ID\"\\s*:\\s*\"[^\"]*\"/gi,'\"REPL_ID\":\"\"'],\n  [/process\\.env\\.REPL_ID/g,'\"\"'],\n  [/process\\.env\\.REPLIT_DEV_DOMAIN/g,'\"\"'],\n  [/import\\.meta\\.env\\.REPLIT[A-Z_]*/g,'\"\"'],\n  [/import[^;]*vite-plugin-dev-banner[^;]*;\\n?/g,''],\n  [/import[^;]*vite-plugin-runtime-error[^;]*;\\n?/g,''],\n  [/cartographer[^\\n]*/g,''],\n  [/RuntimeErrorModal[^\\n]*/g,''],\n  [/DevBanner[^\\n]*/g,''],\n];\n\nfunction cleanReplit(path){\n  let c=P[path]?.content||''; let changed=false;\n  for(const [pat,rep] of RP){const n=c.replace(pat,rep);if(n!==c){c=n;changed=true;}}\n  if(changed){P[path].content=c;P[path].modified=true;if(ATAB===path)renderEditor();renderTree();toast(`🧹 Limpo: ${path.split('/').pop()}`);}\n  else toast('Nada encontrado','warn');\n  runAnalysis();\n}\n\nfunction cleanAllReplit(){\n  const files=Object.keys(P).filter(p=>/replit\\.dev|repl\\.co|REPL_ID|REPLIT|cartographer|vite-plugin-dev-banner|vite-plugin-runtime-error/i.test(P[p]?.content||''));\n  files.forEach(p=>cleanReplit(p));\n  toast(`🧹 ${files.length} arquivos limpos!`);\n}\n\nfunction fixWorkspaceImports(){\n  let fixed=0;\n  Object.keys(P).forEach(path=>{\n    const c=P[path]?.content||'';\n    if(c.includes('@workspace/')){\n      P[path].content=c.replace(/@workspace\\/[a-z0-9-]+\\//g,'../');\n      P[path].modified=true; fixed++;\n    }\n  });\n  toast(`🔧 ${fixed} arquivos corrigidos!`);\n  runAnalysis();\n}\n\nfunction fixWorkspace(){\n  const path=Object.keys(P).find(p=>p==='package.json'||p.endsWith('/package.json')&&!p.includes('node_modules'));\n  if(!path){toast('package.json não encontrado','err');return;}\n  try{\n    const pkg=JSON.parse(P[path].content);\n    if(pkg.name?.includes('/')) pkg.name=pkg.name.split('/').pop();\n    pkg.name=(pkg.name||'meu-app').replace(/@[^/]+\\//,'');\n    delete pkg.workspaces;\n    P[path].content=JSON.stringify(pkg,null,2);\n    P[path].modified=true;\n    openFile(path); runAnalysis();\n    toast('✅ package.json corrigido!');\n  }catch(e){toast('Erro: '+e.message,'err');}\n}\n\nfunction cleanAll(){\n  cleanAllReplit();\n  fixWorkspaceImports();\n  fixWorkspace();\n  toast('🧹 Limpeza completa!');\n}\n\nfunction rmNodeModules(){const k=Object.keys(P).filter(p=>p.startsWith('node_modules/'));k.forEach(x=>delete P[x]);toast(`🗑️ ${k.length} removidos`);renderTree();runAnalysis();}\nfunction rmDist(){const k=Object.keys(P).filter(p=>/^(dist|build|www)\\//.test(p));k.forEach(x=>delete P[x]);toast(`🗑️ ${k.length} removidos`);renderTree();runAnalysis();}\n\n// ══════════════════════════════════════════\n// GERADORES\n// ══════════════════════════════════════════\nfunction addFile(path,content){\n  P[path]={content,modified:true,binary:false};\n  renderTree(); openFile(path); runAnalysis();\n  toast(`✅ ${path.split('/').pop()} gerado!`);\n}\n\nfunction getAppName(){\n  try{const p=JSON.parse(P[Object.keys(P).find(x=>x==='package.json'||x.endsWith('/package.json'))]?.content||'{}');return(p.name||'meu-app').replace(/@[^/]+\\//,'').replace(/[^a-z0-9-]/gi,'-');}catch{return'meu-app';}\n}\n\nfunction genAll(){\n  const a=AN; const name=getAppName();\n  if(!a.hasManifest) genManifest();\n  if(!a.hasSW) genSW();\n  if(TARGET==='apk'||TARGET==='all'){if(!a.isCapacitor)genCapacitor();genWfApk();}\n  if(TARGET==='exe'||TARGET==='all'){if(!a.hasElectronBuilder)genElectronBuilder();genWfExe();}\n  if(TARGET==='pwa'||TARGET==='all') genWfPages();\n  genTsconfig(); genVite();\n  toast(`🚀 Arquivos gerados para ${TARGET.toUpperCase()}!`);\n}\n\nfunction genManifest(){\n  const name=getAppName();\n  addFile('manifest.json',JSON.stringify({\n    name,short_name:name,description:`Aplicativo ${name}`,\n    start_url:'/',display:'standalone',\n    background_color:'#0f172a',theme_color:'#6366f1',\n    orientation:'portrait',\n    icons:[\n      {src:'icons/icon-192.png',sizes:'192x192',type:'image/png',purpose:'any maskable'},\n      {src:'icons/icon-512.png',sizes:'512x512',type:'image/png',purpose:'any maskable'},\n    ]\n  },null,2));\n}\n\nfunction genSW(){\n  addFile('public/sw.js',`const CACHE='app-v1';\nconst FILES=['/','/index.html','/manifest.json'];\nself.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(FILES)));self.skipWaiting();});\nself.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));self.clients.claim();});\nself.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)));});`);\n}\n\nfunction genCapacitor(){\n  const name=getAppName();\n  const id=`com.app.${name.replace(/[^a-z0-9]/gi,'').toLowerCase()}`;\n  addFile('capacitor.config.ts',`import type{CapacitorConfig}from'@capacitor/cli';\nconst config:CapacitorConfig={\n  appId:'${id}',\n  appName:'${name}',\n  webDir:'dist',\n  server:{androidScheme:'https'},\n  plugins:{SplashScreen:{launchShowDuration:2000,backgroundColor:'#0f172a'}},\n};\nexport default config;`);\n}\n\nfunction genElectronBuilder(){\n  const name=getAppName();\n  addFile('electron-builder.yml',`appId: com.app.${name.toLowerCase()}\nproductName: ${name}\ncopyright: Copyright © 2026\n\ndirectories:\n  output: dist-electron\n  buildResources: build\n\nfiles:\n  - dist/**/*\n  - electron/**/*\n  - node_modules/**/*\n  - package.json\n\nwin:\n  target:\n    - target: nsis\n      arch: [x64]\n  icon: build/icon.ico\n\nlinux:\n  target:\n    - target: AppImage\n      arch: [x64]\n  icon: build/icon.png\n\nmac:\n  target:\n    - target: dmg\n      arch: [x64, arm64]\n  icon: build/icon.icns\n\nnsis:\n  oneClick: false\n  allowToChangeInstallationDirectory: true\n  createDesktopShortcut: true\n  createStartMenuShortcut: true`);\n}\n\nfunction genWfApk(){\n  addFile('.github/workflows/build-apk.yml',`name: Build APK Android\n\non:\n  push:\n    branches: [main, master]\n  workflow_dispatch:\n\njobs:\n  build-apk:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n\n      - name: Install dependencies\n        run: npm ci || npm install\n\n      - name: Build web app\n        run: npm run build\n\n      - name: Setup Java 17\n        uses: actions/setup-java@v4\n        with:\n          distribution: temurin\n          java-version: '17'\n\n      - name: Setup Android SDK\n        uses: android-actions/setup-android@v3\n\n      - name: Install Capacitor CLI\n        run: npm install -g @capacitor/cli @capacitor/core @capacitor/android\n\n      - name: Add Android platform\n        run: npx cap add android || true\n\n      - name: Sync Capacitor\n        run: npx cap sync android\n\n      - name: Build Debug APK\n        run: |\n          cd android\n          chmod +x gradlew\n          ./gradlew assembleDebug --no-daemon\n\n      - name: Upload APK\n        uses: actions/upload-artifact@v4\n        with:\n          name: app-debug-apk\n          path: android/app/\n          retention-days: 30\n\n      - name: Build Release APK (se keystore configurado)\n        if: secrets.KEYSTORE_BASE64 != ''\n        run: |\n          cd android\n          echo \"${{ secrets.KEYSTORE_BASE64 }}\" | base64 -d > app/keystore.jks\n          ./gradlew assembleRelease --no-daemon \\\n            -Pandroid.injected.signing.store.file=keystore.jks \\\n            -Pandroid.injected.signing.store.password=\"${{ secrets.KEY_PASSWORD }}\" \\\n            -Pandroid.injected.signing.key.alias=\"${{ secrets.KEY_ALIAS }}\" \\\n            -Pandroid.injected.signing.key.password=\"${{ secrets.KEY_PASSWORD }}\"\n\n      - name: Upload Release APK\n        if: secrets.KEYSTORE_BASE64 != ''\n        uses: actions/upload-artifact@v4\n        with:\n          name: app-release-apk\n          path: android/app/build/outputs/apk/release/\n          retention-days: 30`);\n}\n\nfunction genWfExe(){\n  addFile('.github/workflows/build-exe.yml',`name: Build EXE Windows\n\non:\n  push:\n    branches: [main, master]\n  workflow_dispatch:\n\njobs:\n  build-windows:\n    runs-on: windows-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n\n      - name: Install dependencies\n        run: npm ci || npm install\n\n      - name: Build web app\n        run: npm run build\n\n      - name: Build Electron EXE\n        run: npx electron-builder --win --x64\n        env:\n          GH_TOKEN: \\${{ secrets.GITHUB_TOKEN }}\n\n      - name: Upload EXE\n        uses: actions/upload-artifact@v4\n        with:\n          name: app-windows-exe\n          path: dist-electron/*.exe\n          retention-days: 30\n\n  build-linux:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n\n      - name: Install dependencies\n        run: npm ci || npm install\n\n      - name: Build web app\n        run: npm run build\n\n      - name: Build Electron Linux\n        run: npx electron-builder --linux --x64\n        env:\n          GH_TOKEN: \\${{ secrets.GITHUB_TOKEN }}\n\n      - name: Upload AppImage\n        uses: actions/upload-artifact@v4\n        with:\n          name: app-linux-appimage\n          path: dist-electron/*.AppImage\n          retention-days: 30`);\n}\n\nfunction genWfPages(){\n  addFile('.github/workflows/deploy-pages.yml',`name: Deploy GitHub Pages (PWA)\n\non:\n  push:\n    branches: [main, master]\n  workflow_dispatch:\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\nconcurrency:\n  group: pages\n  cancel-in-progress: false\n\njobs:\n  build-deploy:\n    runs-on: ubuntu-latest\n    environment:\n      name: github-pages\n      url: \\${{ steps.deployment.outputs.page_url }}\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Setup Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: 'npm'\n\n      - name: Install dependencies\n        run: npm ci || npm install\n\n      - name: Build\n        run: npm run build\n\n      - name: Setup Pages\n        uses: actions/configure-pages@v4\n\n      - name: Upload artifact\n        uses: actions/upload-pages-artifact@v3\n        with:\n          path: dist\n\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4`);\n}\n\nfunction genTsconfig(){\n  addFile('tsconfig.json',JSON.stringify({\n    compilerOptions:{\n      target:'ES2020',\n      useDefineForClassFields:true,\n      lib:['ES2020','DOM','DOM.Iterable'],\n      module:'ESNext',\n      skipLibCheck:true,\n      moduleResolution:'bundler',\n      allowImportingTsExtensions:true,\n      resolveJsonModule:true,\n      isolatedModules:true,\n      noEmit:true,\n      jsx:'react-jsx',\n      strict:true,\n      noUnusedLocals:false,\n      noUnusedParameters:false,\n      noFallthroughCasesInSwitch:true,\n      baseUrl:'.',\n      paths:{'@/*':['./src/*']}\n    },\n    include:['src'],\n    exclude:['node_modules','dist','android','ios','electron']\n  },null,2));\n}\n\nfunction genVite(){\n  const name=getAppName();\n  addFile('vite.config.ts',`import{defineConfig}from'vite';\nimport react from'@vitejs/plugin-react';\nimport path from'path';\n\nexport default defineConfig({\n  plugins:[react()],\n  resolve:{\n    alias:{'@':path.resolve(__dirname,'./src')},\n  },\n  base:'./',\n  build:{\n    outDir:'dist',\n    emptyOutDir:true,\n    rollupOptions:{\n      output:{\n        manualChunks:{\n          vendor:['react','react-dom'],\n        },\n      },\n    },\n  },\n  server:{\n    port:5173,\n    host:true,\n    proxy:{\n      '/api':{\n        target:'http://localhost:3000',\n        changeOrigin:true,\n      },\n    },\n  },\n});`);\n}\n\nfunction genEas(){\n  const name=getAppName();\n  addFile('eas.json',JSON.stringify({\n    cli:{version:'>= 7.0.0'},\n    build:{\n      development:{\n        developmentClient:true,\n        distribution:'internal',\n        android:{buildType:'apk'}\n      },\n      preview:{\n        distribution:'internal',\n        android:{buildType:'apk'}\n      },\n      production:{\n        android:{buildType:'app-bundle'}\n      }\n    },\n    submit:{production:{}}\n  },null,2));\n}\n\n// ══════════════════════════════════════════\n// EXPORTAR ZIP\n// ══════════════════════════════════════════\nasync function exportZip(){\n  if(!Object.keys(P).length){toast('Nenhum projeto carregado','err');return;}\n  toast('⏳ Gerando ZIP...');\n  try{\n    const JSZ=await loadJSZ();\n    const zip=new JSZ();\n    for(const[path,f]of Object.entries(P)){\n      if(f.binary&&f.raw) zip.file(path,f.raw);\n      else if(f.content!=null) zip.file(path,f.content);\n    }\n    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});\n    const url=URL.createObjectURL(blob);\n    const a=document.createElement('a');\n    a.href=url; a.download=(getAppName()||'projeto')+'-corrigido.zip';\n    a.click(); URL.revokeObjectURL(url);\n    toast('✅ ZIP baixado!');\n  }catch(e){toast('Erro: '+e.message,'err');}\n}\n\n// ══════════════════════════════════════════\n// JSZIP LOADER\n// ══════════════════════════════════════════\nfunction loadJSZ(){\n  return new Promise((res,rej)=>{\n    if(window.JSZip){res(window.JSZip);return;}\n    const s=document.createElement('script');\n    s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';\n    s.onload=()=>res(window.JSZip);\n    s.onerror=()=>rej(new Error('JSZip não carregou'));\n    document.head.appendChild(s);\n  });\n}\n\n// ══════════════════════════════════════════\n// DRAG & DROP\n// ══════════════════════════════════════════\nconst ov=document.getElementById('dropOverlay');\ndocument.addEventListener('dragover',e=>{e.preventDefault();ov.classList.add('active');});\ndocument.addEventListener('dragleave',e=>{if(!e.relatedTarget)ov.classList.remove('active');});\ndocument.addEventListener('drop',async e=>{\n  e.preventDefault(); ov.classList.remove('active');\n  const f=e.dataTransfer.files[0];\n  if(!f) return;\n  if(f.name.endsWith('.zip')){\n    const inp=document.getElementById('fi');\n    const dt=new DataTransfer(); dt.items.add(f);\n    inp.files=dt.files; importZip(inp);\n  }else toast('Arraste um arquivo .zip','warn');\n});\n\n// ══════════════════════════════════════════\n// TOAST\n// ══════════════════════════════════════════\nfunction toast(msg,type='ok'){\n  const t=document.createElement('div');\n  t.className=`toast ${type}`; t.textContent=msg;\n  document.body.appendChild(t);\n  setTimeout(()=>t.remove(),3000);\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","l":"html","n":""},{"p":"extrator-scanner-combiner.html","t":"\u003c!DOCTYPE html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  \u003ctitle>SK Oficina Jurídica v4 - Maikon Caldeira\u003c/title>\n  \u003cscript src=\"https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js\">\u003c/script>\n  \u003cscript src=\"https://cdn.tailwindcss.com\">\u003c/script>\n  \u003cscript>\n    tailwind.config = {\n      theme: {\n        extend: {\n          colors: {\n            darkBg: '#0d1208',\n            panelBg: '#141c0d',\n            borderGreen: '#223018',\n            textGreen: '#c8dda8',\n            brandGreen: '#5fad3c',\n            focusGreen: '#7dcf55',\n            matrixGreen: '#22c55e',\n            accentGold: '#d4aa4e',\n            accentBlue: '#56b6c2'\n          }\n        }\n      }\n    }\n  \u003c/script>\n  \u003cstyle>\n    ::-webkit-scrollbar { width: 6px; height: 6px; }\n    ::-webkit-scrollbar-track { background: #0d1208; }\n    ::-webkit-scrollbar-thumb { background: #223018; border-radius: 3px; }\n    ::-webkit-scrollbar-thumb:hover { background: #5fad3c; }\n    @keyframes spin { to { transform: rotate(360deg); } }\n    .spinner { animation: spin 0.8s linear infinite; }\n  \u003c/style>\n\u003c/head>\n\u003cbody class=\"bg-darkBg text-textGreen font-sans min-h-screen flex flex-col\">\n\n  \u003c!-- Header Unificado -->\n  \u003cheader class=\"bg-panelBg border-b border-borderGreen p-4 flex flex-col md:flex-row justify-between items-center gap-4 shrink-0\">\n    \u003cdiv class=\"flex items-center gap-3\">\n      \u003cspan class=\"text-2xl\">⚖️\u003c/span>\n      \u003cdiv>\n        \u003ch1 class=\"text-brandGreen font-bold text-lg flex items-center gap-2\">\n          SK Oficina Jurídica Unificada \u003cspan class=\"text-xs bg-brandGreen/20 text-brandGreen px-2 py-0.5 rounded\">v4\u003c/span>\n        \u003c/h1>\n        \u003cp class=\"text-[11px] text-focusGreen font-mono\">Maikon Caldeira OAB/MG 183712 — Extrator + Scanner + Combiner\u003c/p>\n      \u003c/div>\n    \u003c/div>\n    \n    \u003c!-- Menu de Abas -->\n    \u003cdiv class=\"flex flex-wrap gap-1\">\n      \u003cbutton onclick=\"showSection('importar')\" class=\"tab-btn bg-borderGreen text-brandGreen px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-focusGreen hover:text-darkBg transition-all\">📥 Importar ZIP/APK\u003c/button>\n      \u003cbutton onclick=\"showSection('extrator')\" class=\"tab-btn bg-borderGreen text-brandGreen px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-focusGreen hover:text-darkBg transition-all\">🔎 Extrator Web\u003c/button>\n      \u003cbutton onclick=\"showSection('editor')\" class=\"tab-btn bg-borderGreen text-brandGreen px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-focusGreen hover:text-darkBg transition-all\">📂 Editor\u003c/button>\n      \u003cbutton onclick=\"showSection('scanner')\" class=\"tab-btn bg-borderGreen text-brandGreen px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-focusGreen hover:text-darkBg transition-all\">🛡️ Scanner\u003c/button>\n      \u003cbutton onclick=\"showSection('combinar')\" class=\"tab-btn bg-borderGreen text-brandGreen px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-focusGreen hover:text-darkBg transition-all\">🔗 Combinar Apps\u003c/button>\n    \u003c/div>\n  \u003c/header>\n\n  \u003c!-- CONTEÚDO PRINCIPAL -->\n  \u003cmain class=\"flex-1 overflow-hidden relative flex flex-col\">\n\n    \u003c!-- ABA 1: IMPORTAR LOCAL -->\n    \u003csection id=\"section-importar\" class=\"section-panel p-6 space-y-6 overflow-y-auto max-w-4xl mx-auto w-full\">\n      \u003cdiv class=\"bg-panelBg border border-borderGreen rounded-xl p-6 text-center space-y-4\">\n        \u003cdiv class=\"text-4xl\">📦\u003c/div>\n        \u003ch2 class=\"text-white font-bold text-lg\">Carregar Projeto Local (ZIP ou APK)\u003c/h2>\n        \u003cp class=\"text-xs text-textGreen\">Arraste ou selecione o arquivo para extrair e analisar o código-fonte.\u003c/p>\n        \n        \u003cdiv class=\"border-2 border-dashed border-borderGreen p-8 rounded-lg bg-darkBg/50 hover:border-brandGreen cursor-pointer transition-all\" onclick=\"document.getElementById('zipInput').click()\">\n          \u003cp class=\"text-xs text-brandGreen font-bold\">Clique para procurar arquivo local (.zip, .apk, .aab)\u003c/p>\n          \u003cspan id=\"zipName\" class=\"block text-[10px] mt-2 text-textGreen\">Nenhum arquivo carregado\u003c/span>\n        \u003c/div>\n        \u003cinput type=\"file\" id=\"zipInput\" accept=\".zip,.apk,.aab\" class=\"hidden\">\n      \u003c/div>\n\n      \u003cdiv class=\"bg-panelBg border border-borderGreen rounded-xl p-6 space-y-4\">\n        \u003ch3 class=\"text-white font-bold text-sm flex items-center gap-2\">🌐 Baixar Repositório do GitHub\u003c/h3>\n        \u003cdiv class=\"space-y-2\">\n          \u003cinput type=\"text\" id=\"githubUrl\" placeholder=\"https://github.com/usuario/repositorio\" class=\"w-full bg-darkBg border border-borderGreen rounded-lg px-3 py-2 text-xs text-white placeholder-gray-600 outline-none\">\n          \u003cdiv class=\"grid grid-cols-2 gap-2\">\n            \u003cinput type=\"text\" id=\"githubBranch\" placeholder=\"branch (padrão: main)\" class=\"bg-darkBg border border-borderGreen rounded-lg px-3 py-2 text-xs text-white placeholder-gray-600 outline-none\">\n            \u003cinput type=\"password\" id=\"githubToken\" placeholder=\"Token GitHub (opcional)\" class=\"bg-darkBg border border-borderGreen rounded-lg px-3 py-2 text-xs text-white placeholder-gray-600 outline-none\">\n          \u003c/div>\n          \u003cbutton onclick=\"loadFromGitHub()\" class=\"w-full bg-brandGreen text-darkBg py-2 rounded-lg text-xs font-bold hover:bg-focusGreen transition-all\">Baixar e Processar Repositório\u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- ABA 2: EXTRATOR WEB JURÍDICO -->\n    \u003csection id=\"section-extrator\" class=\"section-panel hidden p-6 overflow-y-auto max-w-5xl mx-auto w-full space-y-6\">\n      \u003cdiv class=\"bg-panelBg border border-borderGreen rounded-xl p-6 space-y-4\">\n        \u003ch2 class=\"text-brandGreen font-bold text-lg\">🔎 Extrator de Sites e Cálculos Jurídicos\u003c/h2>\n        \u003cp class=\"text-xs text-textGreen\">Varre sites de tribunais, extrai textos de processos, scripts de cálculo e APIs.\u003c/p>\n\n        \u003cdiv class=\"flex gap-2 flex-wrap\">\n          \u003cinput type=\"text\" id=\"extractorUrl\" placeholder=\"https://www.tjmg.jus.br\" class=\"flex-1 bg-darkBg border border-borderGreen rounded-lg px-3 py-2 text-xs text-white outline-none\">\n          \u003cselect id=\"extractorDepth\" class=\"bg-darkBg border border-borderGreen rounded-lg px-3 py-2 text-xs text-textGreen outline-none\">\n            \u003coption value=\"1\">Apenas página principal\u003c/option>\n            \u003coption value=\"2\">Página + Subpáginas\u003c/option>\n          \u003c/select>\n          \u003cbutton onclick=\"runWebExtractor()\" class=\"bg-brandGreen text-darkBg px-4 py-2 rounded-lg text-xs font-bold hover:bg-focusGreen transition-all\">Extrair Site\u003c/button>\n        \u003c/div>\n\n        \u003c!-- Atalhos Rápidos -->\n        \u003cdiv class=\"flex flex-wrap gap-1.5 pt-2\">\n          \u003cbutton onclick=\"setExtractorUrl('https://www.tjmg.jus.br')\" class=\"text-[10px] bg-darkBg border border-borderGreen px-2.5 py-1 rounded hover:border-brandGreen\">TJMG\u003c/button>\n          \u003cbutton onclick=\"setExtractorUrl('https://www.stj.jus.br')\" class=\"text-[10px] bg-darkBg border border-borderGreen px-2.5 py-1 rounded hover:border-brandGreen\">STJ\u003c/button>\n          \u003cbutton onclick=\"setExtractorUrl('https://www.stf.jus.br')\" class=\"text-[10px] bg-darkBg border border-borderGreen px-2.5 py-1 rounded hover:border-brandGreen\">STF\u003c/button>\n          \u003cbutton onclick=\"setExtractorUrl('https://www.calculojuridico.com.br')\" class=\"text-[10px] bg-darkBg border border-borderGreen px-2.5 py-1 rounded hover:border-brandGreen\">Cálculo Jurídico\u003c/button>\n        \u003c/div>\n\n        \u003c!-- Resultados da Extração -->\n        \u003cdiv id=\"extractorResults\" class=\"hidden space-y-4 pt-4 border-t border-borderGreen\">\n          \u003cdiv class=\"grid grid-cols-2 md:grid-cols-4 gap-2\">\n            \u003cdiv class=\"bg-darkBg p-3 rounded-lg border border-borderGreen text-center\">\n              \u003cspan id=\"extPagesCount\" class=\"block text-xl font-mono text-brandGreen\">0\u003c/span>\n              \u003cspan class=\"text-[10px] text-textGreen\">Páginas Varridas\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"bg-darkBg p-3 rounded-lg border border-borderGreen text-center\">\n              \u003cspan id=\"extScriptsCount\" class=\"block text-xl font-mono text-accentGold\">0\u003c/span>\n              \u003cspan class=\"text-[10px] text-textGreen\">Scripts de Cálculo\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"bg-darkBg p-3 rounded-lg border border-borderGreen text-center\">\n              \u003cspan id=\"extLinksCount\" class=\"block text-xl font-mono text-accentBlue\">0\u003c/span>\n              \u003cspan class=\"text-[10px] text-textGreen\">Links Encontrados\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"bg-darkBg p-3 rounded-lg border border-borderGreen text-center\">\n              \u003cspan id=\"extApisCount\" class=\"block text-xl font-mono text-purple-400\">0\u003c/span>\n              \u003cspan class=\"text-[10px] text-textGreen\">APIs Detectadas\u003c/span>\n            \u003c/div>\n          \u003c/div>\n\n          \u003c!-- Abas internas do Extrator -->\n          \u003cdiv class=\"border-b border-borderGreen flex gap-2\">\n            \u003cbutton onclick=\"showExtSubTab('overview')\" class=\"ext-subtab text-xs py-1 px-3 border-b-2 border-brandGreen text-white\">Visão Geral\u003c/button>\n            \u003cbutton onclick=\"showExtSubTab('scripts')\" class=\"ext-subtab text-xs py-1 px-3 text-textGreen\">Scripts & Cálculos\u003c/button>\n            \u003cbutton onclick=\"showExtSubTab('text')\" class=\"ext-subtab text-xs py-1 px-3 text-textGreen\">Texto Extraído\u003c/button>\n          \u003c/div>\n\n          \u003cdiv id=\"ext-subtab-overview\" class=\"ext-panel space-y-2\">\u003c/div>\n          \u003cdiv id=\"ext-subtab-scripts\" class=\"ext-panel space-y-2 hidden\">\u003c/div>\n          \u003cdiv id=\"ext-subtab-text\" class=\"ext-panel space-y-2 hidden\">\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- ABA 3: EDITOR DE CÓDIGO -->\n    \u003csection id=\"section-editor\" class=\"section-panel hidden flex-1 flex flex-col md:flex-row overflow-hidden h-full\">\n      \u003c!-- Lista de arquivos lateral -->\n      \u003cdiv class=\"w-full md:w-80 bg-panelBg border-r border-borderGreen p-3 flex flex-col shrink-0\">\n        \u003ch3 class=\"text-xs font-bold text-brandGreen uppercase mb-2 flex justify-between\">\n          \u003cspan>📁 Arquivos do Projeto\u003c/span>\n          \u003cspan id=\"filesCount\" class=\"text-matrixGreen\">0\u003c/span>\n        \u003c/h3>\n        \u003cinput type=\"text\" id=\"fileSearch\" placeholder=\"Buscar arquivo...\" onkeyup=\"filterFiles()\" class=\"bg-darkBg border border-borderGreen rounded-lg px-3 py-1.5 text-xs text-white outline-none mb-2\">\n        \u003cdiv id=\"fileList\" class=\"flex-1 overflow-y-auto space-y-1 text-xs\">\n          \u003cp class=\"text-gray-500 italic p-2 text-center\">Nenhum arquivo carregado.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- Editor de código -->\n      \u003cdiv class=\"flex-1 bg-darkBg p-3 flex flex-col overflow-hidden\">\n        \u003cdiv class=\"flex justify-between items-center mb-2 bg-panelBg p-2 rounded-lg border border-borderGreen\">\n          \u003cspan id=\"currentFileName\" class=\"text-xs font-mono text-brandGreen font-bold\">📝 Nenhum arquivo selecionado\u003c/span>\n          \u003cdiv class=\"flex gap-2\">\n            \u003cbutton onclick=\"saveCurrentFileChanges()\" class=\"text-[10px] bg-brandGreen/20 text-brandGreen border border-brandGreen/30 px-2.5 py-1 rounded hover:bg-brandGreen hover:text-black transition-all\">Salvar Alteração\u003c/button>\n            \u003cbutton onclick=\"downloadModifiedZip()\" class=\"text-[10px] bg-accentBlue/20 text-accentBlue border border-accentBlue/30 px-2.5 py-1 rounded hover:bg-accentBlue hover:text-black transition-all\">Exportar ZIP\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003ctextarea id=\"fileContent\" class=\"flex-1 w-full bg-[#020617] border border-borderGreen rounded-lg p-4 text-xs font-mono text-matrixGreen outline-none resize-none\" placeholder=\"// Selecione um arquivo para editar...\">\u003c/textarea>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- ABA 4: SCANNER DE DEPENDÊNCIAS -->\n    \u003csection id=\"section-scanner\" class=\"section-panel hidden p-6 overflow-y-auto max-w-5xl mx-auto w-full space-y-6\">\n      \u003cdiv class=\"bg-panelBg border border-borderGreen rounded-xl p-6 space-y-4\">\n        \u003ch2 class=\"text-brandGreen font-bold text-lg\">🛡️ Scanner de Dependências & Limpeza\u003c/h2>\n        \u003cp class=\"text-xs text-textGreen\">Identifique sujeiras do Replit, erros de nó ou termos personalizados em todo o projeto.\u003c/p>\n\n        \u003cdiv class=\"bg-darkBg/50 p-4 rounded-lg border border-borderGreen space-y-2\">\n          \u003clabel class=\"block text-xs font-bold text-brandGreen\">🔍 Termo de Busca Personalizado (Opcional)\u003c/label>\n          \u003cdiv class=\"flex gap-2\">\n            \u003cinput type=\"text\" id=\"customSearchTerm\" placeholder=\"Ex: localhost, neon, api_key, banco\" class=\"flex-1 bg-darkBg border border-borderGreen rounded-lg px-3 py-1.5 text-xs text-white outline-none\">\n            \u003cbutton onclick=\"runScan()\" class=\"bg-brandGreen text-darkBg px-4 py-1.5 rounded-lg text-xs font-bold hover:bg-focusGreen transition-all\">Escanear Projeto\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv id=\"scannerActions\" class=\"hidden flex gap-2\">\n          \u003cbutton onclick=\"downloadScanReport()\" class=\"bg-borderGreen text-brandGreen border border-brandGreen/30 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-brandGreen hover:text-black transition-all\">📥 Baixar Relatório .TXT\u003c/button>\n          \u003cbutton onclick=\"autoCleanReplitFiles()\" class=\"bg-red-950/40 text-red-400 border border-red-900/50 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-red-500 hover:text-white transition-all\">🧹 Limpar Replit e Baixar ZIP\u003c/button>\n        \u003c/div>\n\n        \u003cdiv id=\"scannerResults\" class=\"space-y-3\">\u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- ABA 5: COMBINAR APLICATIVOS (Sua ferramenta recuperada!) -->\n    \u003csection id=\"section-combinar\" class=\"section-panel hidden p-6 overflow-y-auto max-w-4xl mx-auto w-full space-y-6\">\n      \u003cdiv class=\"bg-panelBg border border-borderGreen rounded-xl p-6 space-y-4\">\n        \u003cdiv class=\"flex justify-between items-center border-b border-borderGreen pb-3\">\n          \u003cdiv>\n            \u003ch2 class=\"text-brandGreen font-bold text-lg\">🔗 Combinar Projetos & Códigos\u003c/h2>\n            \u003cp class=\"text-xs text-textGreen\">Monte a estrutura ideal e gere o prompt perfeito para a IA unificar seus códigos.\u003c/p>\n          \u003c/div>\n          \u003cbutton onclick=\"clearCombiner()\" class=\"text-xs border border-borderGreen text-textGreen px-2.5 py-1 rounded hover:text-brandGreen transition-all\">Limpar Tudo\u003c/button>\n        \u003c/div>\n\n        \u003cdiv>\n          \u003clabel class=\"block text-brandGreen text-xs font-semibold mb-1\">🎯 Objetivo do Aplicativo Final\u003c/label>\n          \u003ctextarea id=\"combinerGoal\" rows=\"2\" placeholder=\"Ex: Unificar meu PWA Jurídico com a função de gerar relatórios em PDF...\" class=\"w-full bg-darkBg border border-borderGreen rounded-lg px-3 py-2 text-xs text-textGreen placeholder-gray-600 outline-none resize-none\">\u003c/textarea>\n        \u003c/div>\n\n        \u003cdiv id=\"appsContainer\" class=\"space-y-4\">\u003c/div>\n\n        \u003cdiv class=\"flex gap-2\">\n          \u003cbutton onclick=\"addAppCard()\" class=\"flex-1 py-2 border border-dashed border-borderGreen rounded-lg text-brandGreen text-xs font-bold hover:bg-borderGreen/20 transition-all\">➕ Adicionar Outro Código\u003c/button>\n          \u003cbutton onclick=\"generateSuperPrompt()\" class=\"flex-1 py-2 bg-borderGreen text-brandGreen font-bold text-xs rounded-lg hover:bg-brandGreen hover:text-black transition-all\">✨ Gerar Prompt de Unificação\u003c/button>\n        \u003c/div>\n\n        \u003c!-- Prompt Gerado -->\n        \u003cdiv id=\"promptResultContainer\" class=\"hidden bg-darkBg border border-borderGreen rounded-xl overflow-hidden mt-4\">\n          \u003cdiv class=\"flex items-center justify-between px-3 py-2 bg-borderGreen/30 border-b border-borderGreen\">\n            \u003cspan class=\"text-brandGreen text-xs font-bold\">📋 Prompt Pronto para Copiar\u003c/span>\n            \u003cbutton onclick=\"copyGeneratedPrompt()\" class=\"text-xs bg-borderGreen text-brandGreen px-3 py-1 rounded hover:bg-brandGreen hover:text-black transition-all\">Copiar Prompt\u003c/button>\n          \u003c/div>\n          \u003ctextarea id=\"generatedPromptTextarea\" rows=\"8\" class=\"w-full bg-darkBg p-3 text-xs text-textGreen font-mono leading-relaxed outline-none resize-none\" readonly>\u003c/textarea>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n  \u003c/main>\n\n  \u003c!-- Loader Global -->\n  \u003cdiv id=\"globalLoader\" class=\"hidden fixed inset-0 bg-black/80 z-50 flex flex-col items-center justify-center space-y-4\">\n    \u003cdiv class=\"w-12 h-12 border-4 border-brandGreen border-t-transparent rounded-full spinner\">\u003c/div>\n    \u003cp id=\"loaderMsg\" class=\"text-brandGreen font-mono text-xs\">Processando...\u003c/p>\n  \u003c/div>\n\n  \u003cscript>\n    // ==================== ESTADO GLOBAL ====================\n    let currentFiles = [];\n    let fileContents = {};\n    let appsToCombine = [];\n    let activeFile = null;\n    let extractedData = null;\n\n    // Padrões de busca do Replit\n    const _p = String.fromCharCode(114,101,112,108,105,116);\n    const PATS = [\n      { re: new RegExp(_p + \"\\\\.com\",    \"gi\"), lb: \"url-plataforma\" },\n      { re: new RegExp(\"repl\\\\.it\",      \"gi\"), lb: \"url-plataforma-antiga\" },\n      { re: new RegExp(_p.toUpperCase() + \"_\", \"g\"),  lb: \"var-plataforma\" },\n      { re: new RegExp(\"REPL_ID\",        \"g\"),  lb: \"var-id-plataforma\" },\n      { re: new RegExp(\"REPL_SLUG\",      \"g\"),  lb: \"var-slug-plataforma\" },\n      { re: new RegExp(\"REPL_OWNER\",     \"g\"),  lb: \"var-owner-plataforma\" },\n      { re: new RegExp(\"@\" + _p + \"/\",   \"gi\"), lb: \"pacote-externo\" },\n      { re: /vite-plugin-runtime-error-modal/gi,  lb: \"plugin-error-externo\" },\n      { re: /vite-plugin-cartographer/gi,         lb: \"plugin-cartographer-externo\" },\n      { re: /vite-plugin-dev-banner/gi,           lb: \"plugin-banner-externo\" },\n      { re: new RegExp(\"\\\\.\" + _p + \"\\\\b\", \"gi\"), lb: \"config-plataforma\" },\n      { re: new RegExp(_p + \"\\\\.app\",    \"gi\"), lb: \"dominio-hospedagem\" },\n      { re: new RegExp(_p + \"-dev\\\\.com\",\"gi\"), lb: \"dominio-dev-externo\" },\n      { re: new RegExp(\"pid1\\\\.\" + _p,   \"gi\"), lb: \"processo-plataforma\" },\n    ];\n\n    const SKIP_EXT = new Set([\"png\",\"jpg\",\"jpeg\",\"gif\",\"webp\",\"ico\",\"woff\",\"woff2\",\"ttf\",\"eot\",\"otf\",\"mp3\",\"mp4\",\"webm\",\"ogg\",\"bin\",\"class\",\"dex\"]);\n\n    const PROXIES = [\n      { name:\"allorigins.win\", fn:u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}` },\n      { name:\"corsproxy.io\",   fn:u=>`https://corsproxy.io/?${encodeURIComponent(u)}` },\n      { name:\"codetabs.com\",   fn:u=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}` },\n    ];\n\n    // ==================== ABAS ====================\n    function showSection(id) {\n      document.querySelectorAll('.section-panel').forEach(p => p.classList.add('hidden'));\n      document.getElementById(`section-${id}`).classList.remove('hidden');\n    }\n\n    function showLoader(msg) {\n      document.getElementById('loaderMsg').innerText = msg;\n      document.getElementById('globalLoader').classList.remove('hidden');\n    }\n    function hideLoader() {\n      document.getElementById('globalLoader').classList.add('hidden');\n    }\n\n    // ==================== IMPORTAÇÃO ZIP/APK ====================\n    document.getElementById('zipInput').addEventListener('change', async (e) => {\n      const file = e.target.files[0];\n      if (!file) return;\n      document.getElementById('zipName').innerText = file.name;\n      showLoader(\"Processando arquivo local...\");\n\n      try {\n        const ext = file.name.split('.').pop().toLowerCase();\n        if (['zip', 'apk', 'aab', 'jar', 'aar'].includes(ext)) {\n          const buffer = await file.arrayBuffer();\n          const zip = await JSZip.loadAsync(buffer);\n          await processZip(zip);\n        } else {\n          const text = await file.text();\n          currentFiles = [file.name];\n          fileContents[file.name] = text;\n          renderFileList();\n          showSection('editor');\n        }\n      } catch(e) {\n        alert(\"Erro ao ler arquivo: \" + e.message);\n      } finally {\n        hideLoader();\n      }\n    });\n\n    async function processZip(zip) {\n      currentFiles = [];\n      fileContents = {};\n\n      zip.forEach((path, entry) => {\n        if (!entry.dir) currentFiles.push(path);\n      });\n\n      currentFiles.sort();\n      showLoader(`Carregando ${currentFiles.length} arquivos...`);\n\n      let promises = currentFiles.map(async (path) => {\n        const ext = path.split('.').pop().toLowerCase();\n        if (SKIP_EXT.has(ext)) {\n          fileContents[path] = \"[Arquivo binário/mídia]\";\n          return;\n        }\n        try {\n          fileContents[path] = await zip.file(path).async('string');\n        } catch(e) {\n          fileContents[path] = \"[Erro ao ler arquivo]\";\n        }\n      });\n\n      await Promise.all(promises);\n      renderFileList();\n      showSection('editor');\n    }\n\n    // ==================== GITHUB ====================\n    async function loadFromGitHub() {\n      let url = document.getElementById('githubUrl').value.trim();\n      let branch = document.getElementById('githubBranch').value.trim() || 'main';\n      let token = document.getElementById('githubToken').value.trim();\n\n      if (!url) return alert(\"Por favor, indique a URL do repositório.\");\n      const m = url.match(/github\\.com\\/([^/]+)\\/([^/]+)/);\n      if (!m) return alert(\"URL inválida.\");\n      const [, owner, repo] = m;\n\n      showLoader(\"Baixando do GitHub...\");\n      const zipUrl = `https://codeload.github.com/${owner}/${repo}/zip/refs/heads/${branch}`;\n      const hdrs = token ? { Authorization: `token ${token}` } : {};\n\n      try {\n        let resp = await fetch(zipUrl, { headers: hdrs });\n        if (!resp.ok) {\n          showLoader(\"Tentando via proxy secundário...\");\n          const px = `https://api.allorigins.win/raw?url=${encodeURIComponent(zipUrl)}`;\n          resp = await fetch(px);\n        }\n        if (!resp.ok) throw new Error(\"Falha ao baixar repositório.\");\n\n        const blob = await resp.blob();\n        const buffer = await blob.arrayBuffer();\n        const zip = await JSZip.loadAsync(buffer);\n\n        const tempFiles = Object.keys(zip.files).filter(n => !zip.files[n].dir);\n        const prefix = (tempFiles[0]?.split(\"/\")[0] ?? \"\") + \"/\";\n\n        currentFiles = [];\n        fileContents = {};\n\n        for (const n of tempFiles) {\n          const rel = n.startsWith(prefix) ? n.slice(prefix.length) : n;\n          if (!rel) continue;\n          currentFiles.push(rel);\n          fileContents[rel] = await zip.files[n].async(\"string\");\n        }\n\n        currentFiles.sort();\n        renderFileList();\n        showSection('editor');\n        alert(\"Repositório importado!\");\n      } catch(e) {\n        alert(\"Erro: \" + e.message);\n      } finally {\n        hideLoader();\n      }\n    }\n\n    // ==================== EDITOR DE CÓDIGO ====================\n    function renderFileList() {\n      const container = document.getElementById('fileList');\n      document.getElementById('filesCount').innerText = currentFiles.length;\n      \n      if (currentFiles.length === 0) {\n        container.innerHTML = '\u003cp class=\"text-gray-500 italic p-2 text-center\">Nenhum arquivo.\u003c/p>';\n        return;\n      }\n\n      container.innerHTML = currentFiles.map(file => {\n        const isSujo = checkSingleFileIsDirty(file);\n        const badge = isSujo ? '\u003cspan class=\"text-[9px] bg-red-950 text-red-400 px-1 rounded\">sujo\u003c/span>' : '';\n        return `\u003cdiv class=\"p-1.5 hover:bg-borderGreen rounded cursor-pointer flex justify-between items-center truncate border-b border-borderGreen/10\" onclick=\"openFile('${file}')\">\n          \u003cspan class=\"truncate\">📄 ${file}\u003c/span>\n          ${badge}\n        \u003c/div>`;\n      }).join('');\n    }\n\n    function checkSingleFileIsDirty(filename) {\n      const content = fileContents[filename] || \"\";\n      return PATS.some(p => {\n        p.re.lastIndex = 0;\n        const test = p.re.test(content);\n        p.re.lastIndex = 0;\n        return test;\n      });\n    }\n\n    function openFile(filename) {\n      activeFile = filename;\n      document.getElementById('currentFileName').innerText = `📝 ${filename}`;\n      document.getElementById('fileContent').value = fileContents[filename] || \"\";\n      showSection('editor');\n    }\n\n    function filterFiles() {\n      const term = document.getElementById('fileSearch').value.toLowerCase();\n      const filtered = currentFiles.filter(f => f.toLowerCase().includes(term));\n      const container = document.getElementById('fileList');\n      container.innerHTML = filtered.map(file => {\n        const isSujo = checkSingleFileIsDirty(file);\n        const badge = isSujo ? '\u003cspan class=\"text-[9px] bg-red-950 text-red-400 px-1 rounded\">sujo\u003c/span>' : '';\n        return `\u003cdiv class=\"p-1.5 hover:bg-borderGreen rounded cursor-pointer flex justify-between items-center truncate border-b border-borderGreen/10\" onclick=\"openFile('${file}')\">\n          \u003cspan class=\"truncate\">📄 ${file}\u003c/span>\n          ${badge}\n        \u003c/div>`;\n      }).join('');\n    }\n\n    function saveCurrentFileChanges() {\n      if (!activeFile) return alert(\"Selecione um arquivo!\");\n      fileContents[activeFile] = document.getElementById('fileContent').value;\n      alert(\"Alteração salva na memória!\");\n      renderFileList();\n    }\n\n    async function downloadModifiedZip() {\n      showLoader(\"Gerando ZIP...\");\n      const zip = new JSZip();\n      currentFiles.forEach(file => {\n        zip.file(file, fileContents[file]);\n      });\n      const content = await zip.generateAsync({type:\"blob\"});\n      const link = document.createElement(\"a\");\n      link.href = URL.createObjectURL(content);\n      link.download = \"projeto-oficina-sk.zip\";\n      link.click();\n      hideLoader();\n    }\n\n    // ==================== EXTRATOR WEB JURÍDICO ====================\n    function setExtractorUrl(url) {\n      document.getElementById('extractorUrl').value = url;\n    }\n\n    async function fetchViaProxy(url) {\n      let lastErr = null;\n      for (let i = 0; i \u003c PROXIES.length; i++) {\n        const p = PROXIES[i];\n        try {\n          const r = await fetch(p.fn(url));\n          if (!r.ok) continue;\n          const text = await r.text();\n          if (text.length > 40) return text;\n        } catch (e) { lastErr = e; }\n      }\n      throw new Error(\"Falha ao acessar o site via proxies.\");\n    }\n\n    async function runWebExtractor() {\n      let url = document.getElementById('extractorUrl').value.trim();\n      if (!url) return alert(\"Insira uma URL.\");\n      if (!/^https?:\\/\\//i.test(url)) url = \"https://\" + url;\n\n      showLoader(\"Varrendo site jurídico...\");\n      try {\n        const html = await fetchViaProxy(url);\n        \n        // Parsing básico\n        const title = html.match(/\u003ctitle[^>]*>([^\u003c]*)\u003c\\/title>/i)?.[1] || \"Sem Título\";\n        const textContent = html.replace(/\u003cscript[\\s\\S]*?\u003c\\/script>/gi, \"\").replace(/\u003c[^>]+>/g, \" \").replace(/\\s{2,}/g,\" \").trim();\n        \n        // Scripts de cálculo\n        const scripts = [];\n        const p = /\u003cscript(?![^>]+src=)[^>]*>([\\s\\S]*?)\u003c\\/script>/gi;\n        let m;\n        while ((m = p.exec(html)) !== null) {\n          const c = (m[1] ?? \"\").trim();\n          if (c.length > 30) {\n            const isCalc = /calc|cálculo|previdenci|inss|aposentad|correção|juros/i.test(c);\n            scripts.push({ content: c, isCalc });\n          }\n        }\n\n        extractedData = { url, title, textContent, scripts };\n\n        // Atualizar UI do Extrator\n        document.getElementById('extPagesCount').innerText = \"1\";\n        document.getElementById('extScriptsCount').innerText = scripts.filter(s => s.isCalc).length;\n        document.getElementById('extLinksCount').innerText = (html.match(/href=/g) || []).length;\n        document.getElementById('extApisCount').innerText = (html.match(/\\/api\\//g) || []).length;\n\n        document.getElementById('extractorResults').classList.remove('hidden');\n\n        // Renderizar subtabs\n        renderExtractorOverview();\n      } catch(e) {\n        alert(e.message);\n      } finally {\n        hideLoader();\n      }\n    }\n\n    function showExtSubTab(tabId) {\n      document.querySelectorAll('.ext-panel').forEach(p => p.classList.add('hidden'));\n      document.querySelectorAll('.ext-subtab').forEach(b => b.className = \"ext-subtab text-xs py-1 px-3 text-textGreen\");\n      \n      document.getElementById(`ext-subtab-${tabId}`).classList.remove('hidden');\n      event.target.className = \"ext-subtab text-xs py-1 px-3 border-b-2 border-brandGreen text-white\";\n\n      if (tabId === 'scripts') renderExtractorScripts();\n      if (tabId === 'text') renderExtractorText();\n    }\n\n    function renderExtractorOverview() {\n      const panel = document.getElementById('ext-subtab-overview');\n      panel.innerHTML = `\n        \u003cdiv class=\"bg-darkBg p-4 rounded-lg border border-borderGreen\">\n          \u003ch3 class=\"text-brandGreen font-bold text-sm\">🏷️ ${extractedData.title}\u003c/h3>\n          \u003cp class=\"text-xs text-gray-400 mt-1\">URL: ${extractedData.url}\u003c/p>\n          \u003cbutton onclick=\"importExtractedToProject()\" class=\"mt-3 bg-brandGreen text-darkBg px-3 py-1.5 rounded text-xs font-bold hover:bg-focusGreen\">📥 Importar Texto para o Editor\u003c/button>\n        \u003c/div>`;\n    }\n\n    function renderExtractorScripts() {\n      const panel = document.getElementById('ext-subtab-scripts');\n      const calcs = extractedData.scripts.filter(s => s.isCalc);\n      if (calcs.length === 0) {\n        panel.innerHTML = '\u003cp class=\"text-xs text-gray-500 italic\">Nenhum script de cálculo jurídico identificado.\u003c/p>';\n        return;\n      }\n      panel.innerHTML = calcs.map((s, i) => `\n        \u003cdiv class=\"bg-darkBg border border-accentGold rounded-lg p-3 space-y-2\">\n          \u003cdiv class=\"flex justify-between items-center\">\n            \u003cspan class=\"text-xs text-accentGold font-bold\">⚖️ Script de Cálculo #${i+1}\u003c/span>\n            \u003cbutton onclick=\"openScriptInEditor(${i})\" class=\"text-[10px] bg-borderGreen text-brandGreen px-2 py-0.5 rounded\">Abrir no Editor\u003c/button>\n          \u003c/div>\n          \u003cpre class=\"text-[10px] font-mono text-textGreen overflow-x-auto max-h-32 p-2 bg-black/40 rounded\">${s.content.slice(0, 500)}...\u003c/pre>\n        \u003c/div>\n      `).join('');\n    }\n\n    function renderExtractorText() {\n      const panel = document.getElementById('ext-subtab-text');\n      panel.innerHTML = `\n        \u003cdiv class=\"bg-darkBg border border-borderGreen rounded-lg p-3\">\n          \u003ctextarea readonly class=\"w-full h-64 bg-transparent text-xs font-mono text-textGreen outline-none resize-none\">${extractedData.textContent}\u003c/textarea>\n        \u003c/div>`;\n    }\n\n    function importExtractedToProject() {\n      if (!extractedData) return;\n      const filename = \"texto-extraido.txt\";\n      if (!currentFiles.includes(filename)) {\n        currentFiles.push(filename);\n      }\n      fileContents[filename] = extractedData.textContent;\n      renderFileList();\n      openFile(filename);\n      alert(\"Texto importado para o arquivo 'texto-extraido.txt' no Editor!\");\n    }\n\n    function openScriptInEditor(idx) {\n      const calcs = extractedData.scripts.filter(s => s.isCalc);\n      const filename = `script-calculo-${idx+1}.js`;\n      if (!currentFiles.includes(filename)) {\n        currentFiles.push(filename);\n      }\n      fileContents[filename] = calcs[idx].content;\n      renderFileList();\n      openFile(filename);\n    }\n\n    // ==================== SCANNER DE DEPENDÊNCIAS ====================\n    let scanResultsData = [];\n\n    function runScan() {\n      if (currentFiles.length === 0) return alert(\"Carregue um projeto primeiro!\");\n      \n      const customTerm = document.getElementById('customSearchTerm').value.trim();\n      let customRegex = null;\n      if (customTerm) {\n        customRegex = new RegExp(customTerm, \"gi\");\n      }\n\n      scanResultsData = [];\n      showLoader(\"Escaneando arquivos...\");\n\n      currentFiles.forEach(file => {\n        const content = fileContents[file] || \"\";\n        const lines = content.split('\\n');\n        const hits = [];\n\n        lines.forEach((line, idx) => {\n          const foundLabels = [];\n          \n          PATS.forEach(p => {\n            p.re.lastIndex = 0;\n            if (p.re.test(line)) foundLabels.push(p.lb);\n            p.re.lastIndex = 0;\n          });\n\n          if (customRegex) {\n            customRegex.lastIndex = 0;\n            if (customRegex.test(line)) foundLabels.push(`busca:\"${customTerm}\"`);\n            customRegex.lastIndex = 0;\n          }\n\n          if (foundLabels.length > 0) {\n            hits.push({\n              ln: idx + 1,\n              txt: line.trim().slice(0, 150),\n              labels: foundLabels\n            });\n          }\n        });\n\n        if (hits.length > 0) {\n          scanResultsData.push({ nome: file, hits });\n        }\n      });\n\n      renderScanResults();\n      document.getElementById('scannerActions').classList.remove('hidden');\n      hideLoader();\n    }\n\n    function renderScanResults() {\n      const container = document.getElementById('scannerResults');\n      if (scanResultsData.length === 0) {\n        container.innerHTML = '\u003cdiv class=\"text-center py-8 text-matrixGreen\">🟢 Projeto Limpo! Nenhuma dependência indesejada encontrada.\u003c/div>';\n        return;\n      }\n\n      container.innerHTML = `\n        \u003cdiv class=\"text-xs text-red-400 mb-2 font-mono\">⚠️ Encontrados ${scanResultsData.length} arquivos com referências indesejadas:\u003c/div>\n        \u003cdiv class=\"space-y-2\">\n          ${scanResultsData.map(res => `\n            \u003cdiv class=\"bg-darkBg border border-red-950 rounded-lg overflow-hidden\">\n              \u003cdiv class=\"bg-red-950/20 px-3 py-2 flex justify-between items-center border-b border-red-950/40\">\n                \u003cspan class=\"font-mono text-xs text-red-300 truncate cursor-pointer hover:underline\" onclick=\"openFile('${res.nome}')\">📄 ${res.nome}\u003c/span>\n                \u003cbutton onclick=\"openFile('${res.nome}')\" class=\"text-[10px] bg-brandGreen/20 text-brandGreen px-2 py-0.5 rounded hover:bg-brandGreen hover:text-black\">Abrir no Editor\u003c/button>\n              \u003c/div>\n              \u003cdiv class=\"p-2 space-y-1 bg-black/30\">\n                ${res.hits.map(h => `\n                  \u003cdiv class=\"text-[11px] font-mono text-red-200/80 flex gap-2\">\n                    \u003cspan class=\"text-gray-600\">L${h.ln}:\u003c/span>\n                    \u003cspan class=\"text-yellow-500/80 bg-yellow-500/10 px-1 rounded text-[9px]\">${h.labels.join(', ')}\u003c/span>\n                    \u003cspan class=\"truncate\">${h.txt}\u003c/span>\n                  \u003c/div>\n                `).join('')}\n              \u003c/div>\n            \u003c/div>\n          `).join('')}\n        \u003c/div>`;\n    }\n\n    function downloadScanReport() {\n      let txt = `=== RELATÓRIO DE DEPENDÊNCIAS ===\\n`;\n      txt += `Gerado em: ${new Date().toLocaleString('pt-BR')}\\n`;\n      txt += `Assinado: Maikon Caldeira OAB/MG 183712\\n`;\n      txt += `Total de arquivos com problemas: ${scanResultsData.length}\\n\\n`;\n\n      scanResultsData.forEach(res => {\n        txt += `\\n► ARQUIVO: ${res.nome}\\n`;\n        res.hits.forEach(h => {\n          txt += `  [L${h.ln}] [${h.labels.join(', ')}] -> ${h.txt}\\n`;\n        });\n      });\n\n      const blob = new Blob([txt], {type: \"text/plain;charset=utf-8\"});\n      const link = document.createElement(\"a\");\n      link.href = URL.createObjectURL(blob);\n      link.download = \"relatorio-scanner-maikon.txt\";\n      link.click();\n    }\n\n    async function autoCleanReplitFiles() {\n      if (!confirm(\"Remover automaticamente as linhas com referências do Replit?\")) return;\n      \n      showLoader(\"Limpando arquivos...\");\n      scanResultsData.forEach(res => {\n        let content = fileContents[res.nome] || \"\";\n        let lines = content.split('\\n');\n        \n        let cleanLines = lines.filter(line => {\n          return !PATS.some(p => {\n            p.re.lastIndex = 0;\n            const isMatch = p.re.test(line);\n            p.re.lastIndex = 0;\n            return isMatch;\n          });\n        });\n\n        fileContents[res.nome] = cleanLines.join('\\n');\n      });\n\n      alert(\"Arquivos limpos localmente! Iniciando download.\");\n      await downloadModifiedZip();\n      runScan();\n    }\n\n    // ==================== COMBINAR APLICATIVOS (RECUPERADO) ====================\n    const COMBINER_STORAGE_KEY = \"sk-combinador-v4:data\";\n\n    function createEmptyApp() {\n      return {\n        id: Math.random().toString(36).slice(2, 9),\n        name: \"\",\n        sourceType: \"github\",\n        sourceLocation: \"\",\n        works: \"\",\n        broken: \"\"\n      };\n    }\n\n    function loadCombiner() {\n      try {\n        const raw = localStorage.getItem(COMBINER_STORAGE_KEY);\n        if (raw) {\n          const parsed = JSON.parse(raw);\n          appsToCombine = parsed.apps || [];\n          document.getElementById('combinerGoal').value = parsed.goal || \"\";\n        }\n      } catch(e) {}\n\n      if (appsToCombine.length === 0) {\n        appsToCombine.push(createEmptyApp());\n      }\n      renderAppCards();\n    }\n\n    function saveCombiner() {\n      const goal = document.getElementById('combinerGoal').value;\n      localStorage.setItem(COMBINER_STORAGE_KEY, JSON.stringify({ apps: appsToCombine, goal }));\n    }\n\n    function renderAppCards() {\n      const container = document.getElementById('appsContainer');\n      container.innerHTML = appsToCombine.map((app, idx) => `\n        \u003cdiv class=\"bg-darkBg border border-borderGreen rounded-xl p-4 space-y-3\">\n          \u003cdiv class=\"flex justify-between items-center\">\n            \u003cspan class=\"text-brandGreen text-xs font-bold uppercase\">📦 Código/App de Origem #${idx + 1}\u003c/span>\n            ${appsToCombine.length > 1 ? `\u003cbutton onclick=\"removeAppCard('${app.id}')\" class=\"text-xs text-red-400 hover:underline\">Remover\u003c/button>` : ''}\n          \u003c/div>\n          \u003cdiv class=\"grid grid-cols-1 md:grid-cols-3 gap-3\">\n            \u003cinput type=\"text\" value=\"${app.name}\" onchange=\"updateAppField('${app.id}', 'name', this.value)\" placeholder=\"Nome (ex: PWA Jurídico)\" class=\"bg-panelBg border border-borderGreen rounded-lg px-3 py-1.5 text-xs text-textGreen outline-none\">\n            \u003cselect onchange=\"updateAppField('${app.id}', 'sourceType', this.value)\" class=\"bg-panelBg border border-borderGreen rounded-lg px-3 py-1.5 text-xs text-textGreen outline-none\">\n              \u003coption value=\"github\" ${app.sourceType === 'github' ? 'selected' : ''}>GitHub\u003c/option>\n              \u003coption value=\"zip\" ${app.sourceType === 'zip' ? 'selected' : ''}>Arquivo ZIP\u003c/option>\n            \u003c/select>\n            \u003cinput type=\"text\" value=\"${app.sourceLocation}\" onchange=\"updateAppField('${app.id}', 'sourceLocation', this.value)\" placeholder=\"Link do GitHub ou Nome do ZIP\" class=\"bg-panelBg border border-borderGreen rounded-lg px-3 py-1.5 text-xs text-textGreen outline-none\">\n          \u003c/div>\n          \u003cdiv class=\"grid grid-cols-1 md:grid-cols-2 gap-3\">\n            \u003ctextarea rows=\"2\" onchange=\"updateAppField('${app.id}', 'works', this.value)\" placeholder=\"✅ O que funciona perfeitamente...\" class=\"bg-panelBg border border-borderGreen rounded-lg px-3 py-2 text-xs text-textGreen outline-none resize-none\">${app.works}\u003c/textarea>\n            \u003ctextarea rows=\"2\" onchange=\"updateAppField('${app.id}', 'broken', this.value)\" placeholder=\"❌ O que está quebrado...\" class=\"bg-panelBg border border-borderGreen rounded-lg px-3 py-2 text-xs text-textGreen outline-none resize-none\">${app.broken}\u003c/textarea>\n          \u003c/div>\n        \u003c/div>\n      `).join('');\n    }\n\n    function addAppCard() {\n      appsToCombine.push(createEmptyApp());\n      renderAppCards();\n      saveCombiner();\n    }\n\n    function removeAppCard(id) {\n      appsToCombine = appsToCombine.filter(app => app.id !== id);\n      renderAppCards();\n      saveCombiner();\n    }\n\n    function updateAppField(id, field, value) {\n      appsToCombine = appsToCombine.map(app => app.id === id ? { ...app, [field]: value } : app);\n      saveCombiner();\n    }\n\n    function clearCombiner() {\n      if (confirm(\"Limpar dados do combinador?\")) {\n        appsToCombine = [createEmptyApp()];\n        document.getElementById('combinerGoal').value = \"\";\n        document.getElementById('promptResultContainer').classList.add('hidden');\n        renderAppCards();\n        saveCombiner();\n      }\n    }\n\n    function generateSuperPrompt() {\n      const goal = document.getElementById('combinerGoal').value.trim();\n      const filled = appsToCombine.filter(a => a.name || a.sourceLocation || a.works);\n\n      let prompt = `Estou usando o SK Oficina Jurídica v4 e preciso unificar códigos de projetos diferentes em uma única versão estável.\n\n🎯 OBJETIVO DO PROJETO UNIFICADO:\n${goal ? goal : \"Combinar os códigos mantendo a estabilidade e eliminando erros de dependência/Replit.\"}\n\n--------------------------------------------------\n📦 FONTES DE CÓDIGO A SEREM ANALISADAS:\n`;\n\n      filled.forEach((app, idx) => {\n        prompt += `\\n[CÓDIGO ${idx + 1}: ${app.name || 'Sem Nome'}]\\n`;\n        prompt += `- Origem: ${app.sourceType === 'github' ? 'Repositório GitHub' : 'Arquivo ZIP'}\\n`;\n        prompt += `- Endereço/Referência: ${app.sourceLocation || 'Não especificado'}\\n`;\n        prompt += `- ✅ O QUE FUNCIONA E DEVE SER MANTIDO:\\n  ${app.works || 'Não especificado'}\\n`;\n        prompt += `- ❌ O QUE ESTÁ QUEBRADO E DEVE SER CORRIGIDO:\\n  ${app.broken || 'Não especificado'}\\n`;\n      });\n\n      prompt += `\n--------------------------------------------------\n🛠️ INSTRUÇÕES DE ARQUITETURA PARA A IA (CRÍTICAS):\n1. NÃO comece o projeto do zero. Aproveite a lógica de importação de arquivos pesados e persistência local que já funciona.\n2. Remova qualquer dependência desnecessária do Replit (como arquivos .replit, replit.nix ou pacotes que dependem de terminal).\n3. O projeto final deve rodar como um PWA de arquivo único (HTML/JS) ou uma estrutura limpa de Vite+React que possa ser aberta diretamente no navegador sem precisar de servidores locais complexos.\n4. Explique detalhadamente quais partes de código você unificou e de qual arquivo original elas vieram.\n5. Apresente o código pronto e limpo para ser copiado.`;\n\n      document.getElementById('generatedPromptTextarea').value = prompt;\n      document.getElementById('promptResultContainer').classList.remove('hidden');\n    }\n\n    function copyGeneratedPrompt() {\n      const txt = document.getElementById('generatedPromptTextarea');\n      txt.select();\n      document.execCommand('copy');\n      alert(\"Prompt copiado! Cole na sua IA preferida.\");\n    }\n\n    // Inicialização\n    window.onload = () => {\n      loadCombiner();\n      showSection('importar');\n    };\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n","l":"html","n":""},{"p":"gerador-plano-1.html","t":"\u003c!doctype html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Gerador de Plano de Projeto\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink rel=\"stylesheet\" href=\"https://f
