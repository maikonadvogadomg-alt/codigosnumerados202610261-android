,\n            { name: '.github/workflows/build-apk.yml', desc: 'Workflow do GitHub Actions' }\n        ];\n\n        checks.forEach(check => {\n            // Verifica se o arquivo existe em qualquer lugar do ZIP\n            const exists = filesList.some(f => f.endsWith(check.name));\n            \n            resultsDiv.innerHTML += `\n                \u003cdiv class=\"item\">\n                    \u003cspan>${check.desc} (${check.name})\u003c/span>\n                    \u003cspan class=\"${exists ? 'found' : 'missing'}\">${exists ? '✅ Encontrado' : '❌ Faltando'}\u003c/span>\n                \u003c/div>\n            `;\n        });\n        \n        document.getElementById('downloadBtn').style.display = 'none';\n        document.getElementById('fixAllBtn').style.display = 'block';\n    }\n\n    function fixAll() {\n        // Injeta os arquivos que faltam\n        const checks = Object.keys(templates);\n        \n        checks.forEach(fileName => {\n            const exists = filesList.some(f => f.endsWith(fileName));\n            if (!exists) {\n                currentZip.file(fileName, templates[fileName]);\n                console.log(`Adicionado: ${fileName}`);\n            }\n        });\n\n        alert(\"✅ Arquivos gerados com sucesso! O workflow do GitHub Actions e as configurações do Capacitor foram injetados.\");\n        \n        // Atualiza a lista e a interface\n        filesList = Object.keys(currentZip.files);\n        analyzeFiles();\n        \n        document.getElementById('fixAllBtn').style.display = 'none';\n        document.getElementById('downloadBtn').style.display = 'block';\n    }\n\n    function downloadZip() {\n        currentZip.generateAsync({type:\"blob\"}).then(function(content) {\n            const link = document.createElement('a');\n            link.href = URL.createObjectURL(content);\n            link.download = \"projeto_corrigido_apk.zip\";\n            link.click();\n        });\n    }\n    \u003c/script>\n\n\u003c/body>\n\n\u003c/html>","l":"html","n":""},{"p":"projeto-arquivos-4-pasta-total-eas.html","t":"\u003c!DOCTYPE html>\n\u003chtml lang=\"pt-BR\">\n\n\u003chead>\n    \u003cmeta charset=\"UTF-8\" />\n    \u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\" />\n    \u003ctitle>🔍 Analisador de Projetos\u003c/title>\n    \u003cstyle>\n        * {\n            box-sizing: border-box;\n            margin: 0;\n            padding: 0\n        }\n\n        body {\n            font-family: 'Segoe UI', sans-serif;\n            background: #0d1117;\n            color: #c9d1d9;\n            min-height: 100vh\n        }\n\n        ::-webkit-scrollbar {\n            width: 4px\n        }\n\n        ::-webkit-scrollbar-track {\n            background: #0d1117\n        }\n\n        ::-webkit-scrollbar-thumb {\n            background: #30363d;\n            border-radius: 2px\n        }\n\n        .header {\n            padding: 12px 16px;\n            background: #161b22;\n            border-bottom: 1px solid #30363d;\n            display: flex;\n            align-items: center;\n            gap: 8px\n        }\n\n        .header h1 {\n            font-size: 15px;\n            font-weight: 700;\n            color: #fff\n        }\n\n        .tabs {\n            display: flex;\n            background: #161b22;\n            border-bottom: 1px solid #30363d\n        }\n\n        .tab {\n            padding: 8px 16px;\n            font-size: 12px;\n            font-weight: 600;\n            cursor: pointer;\n            border-bottom: 2px solid transparent;\n            color: #8b949e;\n            transition: all .15s\n        }\n\n        .tab.active {\n            color: #58a6ff;\n            border-bottom-color: #58a6ff\n        }\n\n        .tab:hover {\n            color: #c9d1d9\n        }\n\n        .panel {\n            display: none;\n            padding: 14px\n        }\n\n        .panel.active {\n            display: block\n        }\n\n        textarea {\n            width: 100%;\n            background: #161b22;\n            border: 1px solid #30363d;\n            border-radius: 8px;\n            color: #c9d1d9;\n            font-family: monospace;\n            font-size: 11px;\n            padding: 10px;\n            resize: vertical;\n            outline: none;\n            min-height: 120px\n        }\n\n        textarea:focus {\n            border-color: #58a6ff\n        }\n\n        .btn {\n            padding: 8px 16px;\n            border-radius: 8px;\n            font-size: 12px;\n            font-weight: 600;\n            cursor: pointer;\n            border: none;\n            transition: all .15s\n        }\n\n        .btn-blue {\n            background: #1f6feb;\n            color: #fff\n        }\n\n        .btn-blue:hover {\n            background: #388bfd\n        }\n\n        .btn-green {\n            background: #238636;\n            color: #fff\n        }\n\n        .btn-green:hover {\n            background: #2ea043\n        }\n\n        .btn-red {\n            background: #da3633;\n            color: #fff\n        }\n\n        .btn-red:hover {\n            background: #f85149\n        }\n\n        .btn-gray {\n            background: #21262d;\n            color: #c9d1d9;\n            border: 1px solid #30363d\n        }\n\n        .btn-gray:hover {\n            background: #30363d\n        }\n\n        .btn-sm {\n            padding: 4px 10px;\n            font-size: 11px\n        }\n\n        /* CARDS DE RESULTADO */\n        .result-area {\n            margin-top: 12px;\n            space-y: 8px\n        }\n\n        .card {\n            background: #161b22;\n            border: 1px solid #30363d;\n            border-radius: 10px;\n            margin-bottom: 10px;\n            overflow: hidden\n        }\n\n        .card-header {\n            padding: 8px 12px;\n            display: flex;\n            align-items: center;\n            gap: 8px;\n            cursor: pointer;\n            user-select: none\n        }\n\n        .card-header:hover {\n            background: #21262d\n        }\n\n        .card-title {\n            font-size: 12px;\n            font-weight: 700;\n            flex: 1\n        }\n\n        .card-body {\n            padding: 10px 12px;\n            border-top: 1px solid #30363d;\n            display: none\n        }\n\n        .card-body.open {\n            display: block\n        }\n\n        /* BADGES */\n        .badge {\n            display: inline-flex;\n            align-items: center;\n            gap: 3px;\n            padding: 2px 7px;\n            border-radius: 6px;\n            font-size: 10px;\n            font-weight: 700;\n            margin: 2px\n        }\n\n        .b-red {\n            background: #da363322;\n            border: 1px solid #da363360;\n            color: #f85149\n        }\n\n        .b-yellow {\n            background: #e3b34122;\n            border: 1px solid #e3b34160;\n            color: #e3b341\n        }\n\n        .b-green {\n            background: #23863622;\n            border: 1px solid #23863660;\n            color: #3fb950\n        }\n\n        .b-blue {\n            background: #1f6feb22;\n            border: 1px solid #1f6feb60;\n            color: #58a6ff\n        }\n\n        .b-purple {\n            background: #a371f722;\n            border: 1px solid #a371f760;\n            color: #d2a8ff\n        }\n\n        .b-gray {\n            background: #21262d;\n            border: 1px solid #30363d;\n            color: #8b949e\n        }\n\n        /* PROBLEMAS */\n        .prob {\n            display: flex;\n            gap: 8px;\n            padding: 6px 8px;\n            border-radius: 6px;\n            margin-bottom: 6px;\n            font-size: 11px;\n            line-height: 1.5\n        }\n\n        .prob-crit {\n            background: #da363315;\n            border-left: 3px solid #da3633\n        }\n\n        .prob-warn {\n            background: #e3b34115;\n            border-left: 3px solid #e3b341\n        }\n\n        .prob-info {\n            background: #1f6feb15;\n            border-left: 3px solid #1f6feb\n        }\n\n        .prob-ok {\n            background: #23863615;\n            border-left: 3px solid #238636\n        }\n\n        .prob-icon {\n            font-size: 14px;\n            flex-shrink: 0\n        }\n\n        .prob-content b {\n            display: block;\n            font-weight: 700;\n            margin-bottom: 2px\n        }\n\n        .prob-content code {\n            background: #0d1117;\n            padding: 1px 5px;\n            border-radius: 4px;\n            font-family: monospace;\n            font-size: 10px\n        }\n\n        /* TABELA */\n        table {\n            width: 100%;\n            border-collapse: collapse;\n            font-size: 11px\n        }\n\n        th {\n            text-align: left;\n            padding: 5px 8px;\n            background: #21262d;\n            color: #8b949e;\n            font-weight: 600;\n            font-size: 10px;\n            text-transform: uppercase;\n            letter-spacing: .5px\n        }\n\n        td {\n            padding: 5px 8px;\n            border-top: 1px solid #21262d;\n            vertical-align: top\n        }\n\n        tr:hover td {\n            background: #21262d22\n        }\n\n        /* CÓDIGO */\n        .code-box {\n            background: #0d1117;\n            border: 1px solid #21262d;\n            border-radius: 7px;\n            padding: 10px;\n            font-family: monospace;\n            font-size: 10px;\n            white-space: pre-wrap;\n            word-break: break-all;\n            max-height: 300px;\n            overflow-y: auto;\n            line-height: 1.6\n        }\n\n        .hl-red {\n            color: #f85149\n        }\n\n        .hl-yellow {\n            color: #e3b341\n        }\n\n        .hl-green {\n            color: #3fb950\n        }\n\n        .hl-blue {\n            color: #58a6ff\n        }\n\n        .hl-purple {\n            color: #d2a8ff\n        }\n\n        /* SCORE */\n        .score-bar {\n            height: 8px;\n            background: #21262d;\n            border-radius: 4px;\n            overflow: hidden;\n            margin: 6px 0\n        }\n\n        .score-fill {\n            height: 100%;\n            border-radius: 4px;\n            transition: width .5s\n        }\n\n        /* DROP */\n        .drop-zone {\n            border: 2px dashed #30363d;\n            border-radius: 10px;\n            padding: 20px;\n            text-align: center;\n            cursor: pointer;\n            transition: all .2s;\n            margin-bottom: 10px\n        }\n\n        .drop-zone:hover,\n        .drop-zone.over {\n            border-color: #58a6ff;\n            background: #0d1f3a22\n        }\n\n        /* SUMÁRIO */\n        .summary-grid {\n            display: grid;\n            grid-template-columns: repeat(3, 1fr);\n            gap: 8px;\n            margin-bottom: 12px\n        }\n\n        .sum-card {\n            background: #21262d;\n            border-radius: 8px;\n            padding: 10px;\n            text-align: center\n        }\n\n        .sum-num {\n            font-size: 22px;\n            font-weight: 700\n        }\n\n        .sum-label {\n            font-size: 10px;\n            color: #8b949e;\n            margin-top: 2px\n        }\n\n        .sep {\n            height: 1px;\n            background: #21262d;\n            margin: 10px 0\n        }\n\n        .row {\n            display: flex;\n            align-items: center;\n            gap: 6px;\n            margin-bottom: 4px;\n            font-size: 11px\n        }\n\n        .row label {\n            color: #8b949e;\n            min-width: 120px;\n            flex-shrink: 0\n        }\n\n        .row span {\n            color: #c9d1d9\n        }\n\n        /* FIX PREVIEW */\n        .fix-box {\n            background: #0d2818;\n            border: 1px solid #23863640;\n            border-radius: 8px;\n            padding: 10px;\n            margin-top: 8px\n        }\n\n        .fix-title {\n            font-size: 11px;\n            font-weight: 700;\n            color: #3fb950;\n            margin-bottom: 6px\n        }\n\n        .toast {\n            position: fixed;\n            bottom: 16px;\n            right: 16px;\n            padding: 8px 14px;\n            border-radius: 8px;\n            font-size: 12px;\n            font-weight: 600;\n            z-index: 9999;\n            transition: opacity .3s;\n            pointer-events: none\n        }\n\n        .t-ok {\n            background: #238636;\n            color: #fff\n        }\n\n        .t-err {\n            background: #da3633;\n            color: #fff\n        }\n    \u003c/style>\n\u003c/head>\n\n\u003cbody>\n\n    \u003cdiv class=\"header\">\n        \u003cspan style=\"font-size:20px\">🔍\u003c/span>\n        \u003ch1>Analisador de Projetos — Detector de Problemas\u003c/h1>\n    \u003c/div>\n\n    \u003cdiv class=\"tabs\">\n        \u003cdiv class=\"tab active\" onclick=\"showTab('colar')\">📋 Colar Arquivo\u003c/div>\n        \u003cdiv class=\"tab\" onclick=\"showTab('zip')\">📦 Importar ZIP\u003c/div>\n        \u003cdiv class=\"tab\" onclick=\"showTab('resultado')\">📊 Resultado\u003c/div>\n        \u003cdiv class=\"tab\" onclick=\"showTab('corrigido')\">✅ Arquivos Corrigidos\u003c/div>\n    \u003c/div>\n\n    \u003c!-- ABA COLAR -->\n    \u003cdiv class=\"panel active\" id=\"tab-colar\">\n        \u003cp style=\"font-size:11px;color:#8b949e;margin-bottom:8px\">Cole qualquer arquivo: package.json, app.json,\n            eas.json, tsconfig.json, credentials.json, .jks info, fingerprint, etc.\u003c/p>\n        \u003ctextarea id=\"txt-input\" placeholder='Cole aqui o conteúdo do arquivo...\nExemplos aceitos:\n- package.json\n- app.json  \n- eas.json\n- tsconfig.json\n- credentials.json\n- O fingerprint JSON que você colou antes\n- Qualquer texto com configurações' rows=\"10\">\u003c/textarea>\n        \u003cdiv style=\"display:flex;gap:8px;margin-top:8px;flex-wrap:wrap\">\n            \u003cbutton class=\"btn btn-blue\" onclick=\"analisar()\">🔍 Analisar\u003c/button>\n            \u003cbutton class=\"btn btn-gray\" onclick=\"document.getElementById('txt-input').value=''\">🗑️ Limpar\u003c/button>\n            \u003cbutton class=\"btn btn-gray\" onclick=\"colarExemplo()\">📋 Colar exemplo\u003c/button>\n        \u003c/div>\n        \u003cdiv style=\"margin-top:10px\">\n            \u003cp style=\"font-size:11px;color:#8b949e;margin-bottom:6px\">Ou cole múltiplos arquivos de uma vez (separa\n                automaticamente):\u003c/p>\n            \u003ctextarea id=\"txt-multi\" placeholder=\"Cole vários arquivos juntos aqui — o analisador separa automaticamente...\" rows=\"6\">\u003c/textarea>\n            \u003cbutton class=\"btn btn-blue btn-sm\" style=\"margin-top:6px\" onclick=\"analisarMulti()\">🔍 Analisar Tudo\u003c/button>\n        \u003c/div>\n    \u003c/div>\n\n    \u003c!-- ABA ZIP -->\n    \u003cdiv class=\"panel\" id=\"tab-zip\">\n        \u003cdiv class=\"drop-zone\" id=\"dz\" onclick=\"document.getElementById('fi').click()\">\n            \u003cdiv style=\"font-size:32px;margin-bottom:8px\">📦\u003c/div>\n            \u003cdiv style=\"font-size:13px;font-weight:700;margin-bottom:4px\">Importe o ZIP do projeto\u003c/div>\n            \u003cdiv style=\"font-size:11px;color:#8b949e\">Analisa todos os arquivos de configuração automaticamente\u003c/div>\n        \u003c/div>\n        \u003cinput type=\"file\" id=\"fi\" accept=\".zip,.json,.jks,.keystore\" style=\"display:none\" onchange=\"importarArquivo(this)\"/>\n        \u003cdiv id=\"zip-status\" style=\"display:none\" class=\"prob prob-info\">\u003cspan class=\"prob-icon\">⏳\u003c/span>\n            \u003cdiv class=\"prob-content\">\u003cb id=\"zip-msg\">Processando...\u003c/b>\u003c/div>\n        \u003c/div>\n    \u003c/div>\n\n    \u003c!-- ABA RESULTADO -->\n    \u003cdiv class=\"panel\" id=\"tab-resultado\">\n        \u003cdiv id=\"resultado-vazio\" style=\"text-align:center;padding:40px;color:#8b949e\">\n            \u003cdiv style=\"font-size:40px;margin-bottom:12px\">🔍\u003c/div>\n            \u003cdiv>Cole um arquivo na aba \"Colar Arquivo\" e clique em Analisar\u003c/div>\n        \u003c/div>\n        \u003cdiv id=\"resultado-content\" style=\"display:none\">\u003c/div>\n    \u003c/div>\n\n    \u003c!-- ABA CORRIGIDOS -->\n    \u003cdiv class=\"panel\" id=\"tab-corrigido\">\n        \u003cdiv id=\"corrigido-vazio\" style=\"text-align:center;padding:40px;color:#8b949e\">\n            \u003cdiv style=\"font-size:40px;margin-bottom:12px\">✅\u003c/div>\n            \u003cdiv>Os arquivos corrigidos aparecerão aqui após a análise\u003c/div>\n        \u003c/div>\n        \u003cdiv id=\"corrigido-content\" style=\"display:none\">\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"toast\" id=\"toast\" style=\"opacity:0\">\u003c/div>\n\n    \u003cscript>\n        // ══════════════════════════════════════════\n// ESTADO GLOBAL\n// ══════════════════════════════════════════\nlet PROJETOS = []; // projetos detectados\nlet TODOS_ARQUIVOS = {}; // todos os arquivos do ZIP\n\n// ══════════════════════════════════════════\n// TABS\n// ══════════════════════════════════════════\nfunction showTab(id){\n  document.querySelectorAll('.tab').forEach((t,i)=>{\n    const ids=['colar','zip','resultado','corrigido'];\n    t.classList.toggle('active', ids[i]===id);\n  });\n  document.querySelectorAll('.panel').forEach((p,i)=>{\n    const ids=['colar','zip','resultado','corrigido'];\n    p.classList.toggle('active', ids[i]===id);\n  });\n}\n\n// ══════════════════════════════════════════\n// ANALISAR TEXTO COLADO\n// ══════════════════════════════════════════\nfunction analisar(){\n  const txt = document.getElementById('txt-input').value.trim();\n  if(!txt){ toast('Cole algum conteúdo primeiro!','err'); return; }\n  const arquivos = detectarArquivos(txt);\n  processarResultados(arquivos);\n  showTab('resultado');\n}\n\nfunction analisarMulti(){\n  const txt = document.getElementById('txt-multi').value.trim();\n  if(!txt){ toast('Cole algum conteúdo primeiro!','err'); return; }\n  const arquivos = detectarArquivos(txt);\n  processarResultados(arquivos);\n  showTab('resultado');\n}\n\n// ══════════════════════════════════════════\n// DETECTAR TIPO DE ARQUIVO\n// ══════════════════════════════════════════\nfunction detectarArquivos(texto){\n  const resultado = [];\n\n  // Tentar separar múltiplos JSONs\n  const blocos = extrairBlocos(texto);\n\n  for(const bloco of blocos){\n    const tipo = identificarTipo(bloco);\n    resultado.push({ tipo, conteudo: bloco, parsed: tentarParse(bloco) });\n  }\n\n  // Se não encontrou blocos JSON, analisar como texto\n  if(resultado.length === 0){\n    resultado.push({ tipo: 'texto', conteudo: texto, parsed: null });\n  }\n\n  return resultado;\n}\n\nfunction extrairBlocos(texto){\n  const blocos = [];\n  let depth = 0, start = -1, inStr = false, escape = false;\n\n  for(let i=0; i\u003ctexto.length; i++){\n    const c = texto[i];\n    if(escape){ escape=false; continue; }\n    if(c==='\\\\'&&inStr){ escape=true; continue; }\n    if(c==='\"'){ inStr=!inStr; continue; }\n    if(inStr) continue;\n    if(c==='{'){ if(depth===0) start=i; depth++; }\n    else if(c==='}'){ depth--; if(depth===0&&start!==-1){ blocos.push(texto.slice(start,i+1)); start=-1; } }\n  }\n\n  // Se não encontrou blocos, retornar o texto inteiro\n  if(blocos.length===0) blocos.push(texto);\n  return blocos;\n}\n\nfunction tentarParse(txt){\n  try{ return JSON.parse(txt); }catch{ return null; }\n}\n\nfunction identificarTipo(txt){\n  const p = tentarParse(txt);\n  if(!p) return detectarTipoTexto(txt);\n\n  // app.json\n  if(p.expo) return 'app.json';\n  // eas.json\n  if(p.build && (p.build.preview||p.build.production||p.build.development) && !p.name) return 'eas.json';\n  // credentials.json\n  if(p.android?.keystore || p.keystore) return 'credentials.json';\n  // tsconfig\n  if(p.compilerOptions || p.extends?.includes('tsconfig')) return 'tsconfig.json';\n  // package.json com expo\n  if(p.name && p.dependencies && (p['react-native']||p.dependencies?.expo||p.devDependencies?.expo)) return 'package.json (mobile)';\n  // package.json web/electron\n  if(p.name && (p.dependencies||p.devDependencies) && p.scripts) return 'package.json (web/electron)';\n  // package.json genérico\n  if(p.name && p.version) return 'package.json';\n  // fingerprint\n  if(p.hash && p.sources) return 'fingerprint.json';\n  // metro config\n  if(txt.includes('metro-config')||txt.includes('getDefaultConfig')) return 'metro.config.js';\n  // babel config\n  if(txt.includes('babel-preset-expo')||txt.includes('api.cache')) return 'babel.config.js';\n\n  return 'json (desconhecido)';\n}\n\nfunction detectarTipoTexto(txt){\n  if(txt.includes('keystorePassword')||txt.includes('keyAlias')) return 'credentials';\n  if(txt.includes('EXPO_TOKEN')||txt.includes('expo_')) return '.env';\n  if(txt.includes('gradlew')||txt.includes('assembleDebug')) return 'script bash';\n  if(txt.includes('runs-on:')||txt.includes('workflow_dispatch')) return 'github actions';\n  return 'texto';\n}\n\n// ══════════════════════════════════════════\n// PROCESSAR E EXIBIR RESULTADOS\n// ══════════════════════════════════════════\nfunction processarResultados(arquivos){\n  const el = document.getElementById('resultado-content');\n  const vazio = document.getElementById('resultado-vazio');\n  el.style.display='block';\n  vazio.style.display='none';\n\n  let html = '';\n  let totalProblemas = 0;\n  let totalCriticos = 0;\n  const correcoes = [];\n\n  for(const arq of arquivos){\n    const analise = analisarArquivo(arq);\n    totalProblemas += analise.problemas.length;\n    totalCriticos += analise.problemas.filter(p=>p.nivel==='crit').length;\n    html += renderCard(arq, analise);\n    if(analise.correcao) correcoes.push({ tipo: arq.tipo, correcao: analise.correcao });\n  }\n\n  // Sumário no topo\n  const score = Math.max(0, 100 - totalCriticos*20 - (totalProblemas-totalCriticos)*5);\n  const scoreColor = score>=80?'#3fb950':score>=50?'#e3b341':'#f85149';\n\n  const sumario = `\n    \u003cdiv class=\"summary-grid\">\n      \u003cdiv class=\"sum-card\">\n        \u003cdiv class=\"sum-num\" style=\"color:${scoreColor}\">${score}\u003c/div>\n        \u003cdiv class=\"sum-label\">Score de Saúde\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"sum-card\">\n        \u003cdiv class=\"sum-num\" style=\"color:#f85149\">${totalCriticos}\u003c/div>\n        \u003cdiv class=\"sum-label\">Críticos\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"sum-card\">\n        \u003cdiv class=\"sum-num\" style=\"color:#e3b341\">${totalProblemas-totalCriticos}\u003c/div>\n        \u003cdiv class=\"sum-label\">Avisos\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"score-bar\">\u003cdiv class=\"score-fill\" style=\"width:${score}%;background:${scoreColor}\">\u003c/div>\u003c/div>\n  `;\n\n  el.innerHTML = sumario + html;\n\n  // Gerar arquivos corrigidos\n  if(correcoes.length > 0){\n    renderCorrigidos(correcoes, arquivos);\n  }\n\n  toast(`✅ ${arquivos.length} arquivo(s) analisado(s) — ${totalCriticos} crítico(s)`,'ok');\n}\n\n// ══════════════════════════════════════════\n// ANALISAR ARQUIVO ESPECÍFICO\n// ══════════════════════════════════════════\nfunction analisarArquivo(arq){\n  const problemas = [];\n  const info = [];\n  let correcao = null;\n  const p = arq.parsed;\n  const txt = arq.conteudo;\n\n  // ── APP.JSON ──\n  if(arq.tipo === 'app.json' && p?.expo){\n    const expo = p.expo;\n\n    // CRÍTICO: origin Replit\n    if(txt.includes('replit.com')){\n      problemas.push({\n        nivel:'crit',\n        titulo:'🔴 Origin do Replit detectado',\n        desc:'O app tenta conectar em replit.com ao abrir. Fora do Replit = tela azul/erro.',\n        codigo: '\"origin\": \"https://replit.com/\"',\n        fix: 'Remover o objeto {origin} do plugin expo-router'\n      });\n    }\n\n    // CRÍTICO: reactCompiler\n    if(expo.experiments?.reactCompiler){\n      problemas.push({\n        nivel:'crit',\n        titulo:'🔴 reactCompiler ativado',\n        desc:'Causa crashes em builds de produção. Ainda é experimental.',\n        codigo: '\"reactCompiler\": true',\n        fix: 'Remover ou definir como false'\n      });\n    }\n\n    // INFO: dados do projeto\n    info.push({label:'Nome', valor: expo.name||'?'});\n    info.push({label:'Slug', valor: expo.slug||'?'});\n    info.push({label:'Versão', valor: expo.version||'?'});\n    info.push({label:'Package Android', valor: expo.android?.package||'?'});\n    info.push({label:'Owner', valor: expo.owner||'❌ não definido'});\n    info.push({label:'ProjectId EAS', valor: expo.extra?.eas?.projectId||'❌ não definido'});\n    info.push({label:'SDK', valor: expo.sdkVersion||'não especificado'});\n\n    // AVISO: sem owner\n    if(!expo.owner){\n      problemas.push({nivel:'warn',titulo:'⚠️ Owner não definido',desc:'Sem owner o EAS não sabe a qual conta pertence.',fix:'Adicionar \"owner\": \"seu-usuario-expo\"'});\n    }\n\n    // AVISO: sem projectId\n    if(!expo.extra?.eas?.projectId){\n      problemas.push({nivel:'warn',titulo:'⚠️ ProjectId EAS vazio',desc:'Necessário para builds no EAS Cloud.',fix:'Adicionar o projectId da sua conta expo.dev'});\n    }\n\n    // OK: teclado\n    if(expo.android?.softwareKeyboardLayoutMode==='resize'){\n      problemas.push({nivel:'ok',titulo:'✅ Teclado configurado corretamente',desc:'softwareKeyboardLayoutMode: resize — teclado não vai sumir'});\n    } else {\n      problemas.push({nivel:'warn',titulo:'⚠️ Configuração de teclado ausente',desc:'O teclado pode sumir sobre inputs no Android.',fix:'Adicionar \"softwareKeyboardLayoutMode\": \"resize\" em android{}'});\n    }\n\n    // Gerar correção\n    correcao = gerarAppJsonCorrigido(p);\n  }\n\n  // ── PACKAGE.JSON MOBILE ──\n  else if(arq.tipo === 'package.json (mobile)' && p){\n\n    // CRÍTICO: nome @workspace\n    if(p.name?.startsWith('@workspace/')){\n      problemas.push({\n        nivel:'crit',\n        titulo:'🔴 Nome @workspace — dependência do Replit',\n        desc:'Este nome só funciona dentro do monorepo do Replit.',\n        codigo: `\"name\": \"${p.name}\"`,\n        fix: `Trocar para: \"name\": \"${p.name.replace('@workspace/','').replace(/[^a-z0-9-]/g,'-')}\"`\n      });\n    }\n\n    // CRÍTICO: scripts com variáveis Replit\n    const scriptsTxt = JSON.stringify(p.scripts||{});\n    if(scriptsTxt.includes('REPLIT')||scriptsTxt.includes('$REPL_')){\n      problemas.push({\n        nivel:'crit',\n        titulo:'🔴 Scripts dependem do Replit',\n        desc:'Os scripts usam variáveis de ambiente ($REPLIT_*, $REPL_ID) que só existem no Replit.',\n        codigo: 'EXPO_PACKAGER_PROXY_URL=https://$REPLIT_EXPO_DEV_DOMAIN ...',\n        fix: 'Substituir script \"dev\" por: \"expo start\"'\n      });\n    }\n\n    // AVISO: react: \"catalog:\"\n    if(JSON.stringify(p).includes('\"catalog:\"')){\n      problemas.push({\n        nivel:'crit',\n        titulo:'🔴 Versão \"catalog:\" — específico do pnpm workspace',\n        desc:'Esta sintaxe só funciona no monorepo do Replit com pnpm workspaces.',\n        codigo: '\"react\": \"catalog:\"',\n        fix: 'Trocar para versão real: \"react\": \"19.0.0\"'\n      });\n    }\n\n    // INFO\n    info.push({label:'Nome', valor: p.name||'?'});\n    info.push({label:'Versão', valor: p.version||'?'});\n    info.push({label:'Expo', valor: p.devDependencies?.expo||p.dependencies?.expo||'não encontrado'});\n    info.push({label:'React Native', valor: p.devDependencies?.['react-native']||p.dependencies?.['react-native']||'não encontrado'});\n    info.push({label:'Total deps', valor: Object.keys({...p.dependencies,...p.devDependencies}).length});\n\n    correcao = gerarPackageJsonMobileCorrigido(p);\n  }\n\n  // ── PACKAGE.JSON WEB/ELECTRON ──\n  else if(arq.tipo === 'package.json (web/electron)' && p){\n\n    if(p.name?.startsWith('@workspace/')){\n      problemas.push({nivel:'crit',titulo:'🔴 Nome @workspace',desc:'Dependência do Replit.',codigo:`\"name\": \"${p.name}\"`,fix:'Remover @workspace/ do nome'});\n    }\n\n    // Detectar tipo\n    const isElectron = !!(p.dependencies?.electron||p.devDependencies?.electron);\n    const isVite = !!(p.devDependencies?.vite||p.dependencies?.vite);\n    const hasWebcontainer = !!(p.dependencies?.['@webcontainer/api']);\n    const hasMonaco = !!(p.dependencies?.['@monaco-editor/react']);\n\n    info.push({label:'Tipo', valor: isElectron?'Electron Desktop':isVite?'Vite Web':'Node.js'});\n    info.push({label:'Nome', valor: p.name||'?'});\n    info.push({label:'Versão', valor: p.version||'?'});\n    if(isElectron) info.push({label:'Electron', valor: p.devDependencies?.electron||'?'});\n    if(isVite) info.push({label:'Vite', valor: p.devDependencies?.vite||'?'});\n    if(hasWebcontainer) info.push({label:'WebContainer', valor: '✅ presente (terminal real)'});\n    if(hasMonaco) info.push({label:'Monaco Editor', valor: '✅ presente (editor de código)'});\n\n    if(hasWebcontainer){\n      problemas.push({nivel:'info',titulo:'ℹ️ WebContainer API detectada',desc:'Este projeto tem terminal real (npm install, etc). Requer COOP/COEP headers para funcionar.'});\n    }\n\n    problemas.push({nivel:'ok',titulo:'✅ Projeto web/desktop identificado',desc:`${isElectron?'Electron':'Vite'} — pode ser buildado independente do Replit`});\n  }\n\n  // ── EAS.JSON ──\n  else if(arq.tipo === 'eas.json' && p){\n    info.push({label:'CLI mínimo', valor: p.cli?.version||'não definido'});\n    info.push({label:'Perfis', valor: Object.keys(p.build||{}).join(', ')||'nenhum'});\n\n    const preview = p.build?.preview;\n    if(preview){\n      info.push({label:'Tipo build (preview)', valor: preview.android?.buildType||'não definido'});\n      info.push({label:'Distribuição', valor: preview.distribution||'não definido'});\n      info.push({label:'Credenciais', valor: preview.credentialsSource||'remote (padrão)'});\n    }\n\n    if(p.build?.preview?.android?.buildType==='apk'){\n      problemas.push({nivel:'ok',titulo:'✅ Perfil preview gera APK',desc:'Configurado para gerar .apk (instalável direto)'});\n    }\n\n    if(!p.build?.preview){\n      problemas.push({nivel:'warn',titulo:'⚠️ Sem perfil preview',desc:'Sem perfil preview não dá para gerar APK de teste.',fix:'Adicionar perfil preview com buildType: \"apk\"'});\n    }\n\n    correcao = gerarEasJsonCorrigido(p);\n  }\n\n  // ── CREDENTIALS.JSON ──\n  else if(arq.tipo === 'credentials.json' && p){\n    problemas.push({\n      nivel:'crit',\n      titulo:'🔴 SENHA EXPOSTA no arquivo!',\n      desc:'Este arquivo contém senhas do keystore em texto puro. NUNCA suba para o GitHub!',\n      codigo: JSON.stringify(p.android?.keystore||p.keystore||{},null,2),\n      fix: 'Adicionar credentials.json ao .gitignore'\n    });\n\n    const ks = p.android?.keystore||p.keystore||{};\n    info.push({label:'Keystore', valor: ks.keystorePath||'?'});\n    info.push({label:'Key Alias', valor: ks.keyAlias||'?'});\n    info.push({label:'⚠️ Senha', valor: ks.keystorePassword?'[EXPOSTA - '+ks.keystorePassword.length+' chars]':'não definida'});\n  }\n\n  // ── FINGERPRINT ──\n  else if(arq.tipo === 'fingerprint.json' && p){\n    info.push({label:'Hash do build', valor: p.hash||'?'});\n    info.push({label:'Total de fontes', valor: p.sources?.length||0});\n\n    // Detectar projetos no fingerprint\n    const expoConfig = p.sources?.find(s=>s.id==='expoConfig');\n    if(expoConfig){\n      try{\n        const cfg = JSON.parse(expoConfig.contents||'{}');\n        info.push({label:'App detectado', valor: cfg.name||'?'});\n        info.push({label:'Package', valor: cfg.android?.package||'?'});\n        info.push({label:'Owner', valor: cfg.owner||'?'});\n        info.push({label:'ProjectId', valor: cfg.extra?.eas?.projectId||'?'});\n        info.push({label:'Versão', valor: cfg.version||'?'});\n\n        if(expoConfig.contents?.includes('replit.com')){\n          problemas.push({nivel:'crit',titulo:'🔴 Origin Replit no fingerprint',desc:'O build foi feito com origin do Replit. O APK gerado vai tentar conectar no Replit.',fix:'Corrigir app.json e fazer novo build'});\n        }\n      }catch{}\n    }\n\n    // Detectar scripts Replit\n    const pkgScripts = p.sources?.find(s=>s.id==='packageJson:scripts');\n    if(pkgScripts?.contents?.includes('REPLIT')){\n      problemas.push({nivel:'crit',titulo:'🔴 Scripts Replit no build',desc:'Os scripts de build dependem de variáveis do Replit.',fix:'Corrigir package.json'});\n    }\n\n    // Listar módulos\n    const dirs = p.sources?.filter(s=>s.type==='dir'&&s.filePath?.includes('node_modules'))||[];\n    info.push({label:'Módulos Android', valor: dirs.length+' detectados'});\n\n    problemas.push({nivel:'info',titulo:'ℹ️ Fingerprint é arquivo de cache do EAS',desc:'Não precisa modificar. Serve para identificar o que estava no build.'});\n  }\n\n  // ── TSCONFIG ──\n  else if(arq.tipo === 'tsconfig.json' && p){\n    if(p.references?.some(r=>r.path?.includes('../../'))){\n      problemas.push({\n        nivel:'crit',\n        titulo:'🔴 Referência a pasta externa (../../lib)',\n        desc:'Aponta para pasta que só existe no monorepo do Replit.',\n        codigo: JSON.stringify(p.references,null,2),\n        fix: 'Remover o array \"references\" completamente'\n      });\n      correcao = gerarTsconfigCorrigido(p);\n    } else {\n      problemas.push({nivel:'ok',titulo:'✅ tsconfig sem referências externas',desc:'Configuração limpa.'});\n    }\n  }\n\n  // ── TEXTO GENÉRICO ──\n  else {\n    const refs = detectarReferenciasReplit(txt);\n    refs.forEach(r=>problemas.push(r));\n    if(refs.length===0){\n      problemas.push({nivel:'ok',titulo:'✅ Nenhuma referência ao Replit detectada',desc:'Arquivo parece limpo.'});\n    }\n  }\n\n  return { problemas, info, correcao };\n}\n\n// ══════════════════════════════════════════\n// DETECTAR REFERÊNCIAS REPLIT\n// ══════════════════════════════════════════\nfunction detectarReferenciasReplit(txt){\n  const problemas = [];\n  const checks = [\n    {pattern:/replit\\.com/gi, nivel:'crit', titulo:'🔴 URL do Replit', desc:'Referência direta ao replit.com'},\n    {pattern:/\\$REPLIT_/g, nivel:'crit', titulo:'🔴 Variável $REPLIT_*', desc:'Variável de ambiente específica do Replit'},\n    {pattern:/\\$REPL_ID/g, nivel:'crit', titulo:'🔴 Variável $REPL_ID', desc:'ID do Repl — só existe no Replit'},\n    {pattern:/@workspace\\//g, nivel:'crit', titulo:'🔴 @workspace/', desc:'Namespace de monorepo do Replit'},\n    {pattern:/\"catalog:\"/g, nivel:'crit', titulo:'🔴 \"catalog:\"', desc:'Sintaxe de pnpm workspace do Replit'},\n    {pattern:/@replit\\//g, nivel:'warn', titulo:'⚠️ Pacote @replit/', desc:'Pacote específico do Replit'},\n    {pattern:/\\.replit/g, nivel:'warn', titulo:'⚠️ Arquivo .replit', desc:'Arquivo de configuração do Replit'},\n  ];\n\n  for(const c of checks){\n    const matches = txt.match(c.pattern);\n    if(matches){\n      problemas.push({\n        nivel: c.nivel,\n        titulo: c.titulo,\n        desc: c.desc + ` (${matches.length}x encontrado)`,\n        fix: 'Remover ou substituir esta referência'\n      });\n    }\n  }\n  return problemas;\n}\n\n// ══════════════════════════════════════════\n// RENDER CARD\n// ══════════════════════════════════════════\nfunction renderCard(arq, analise){\n  const criticos = analise.problemas.filter(p=>p.nivel==='crit').length;\n  const avisos = analise.problemas.filter(p=>p.nivel==='warn').length;\n  const oks = analise.problemas.filter(p=>p.nivel==='ok').length;\n\n  const statusColor = criticos>0?'#f85149':avisos>0?'#e3b341':'#3fb950';\n  const statusIcon = criticos>0?'🔴':avisos>0?'⚠️':'✅';\n\n  const id = 'card-'+Math.random().toString(36).slice(2,7);\n\n  let html = `\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"card-header\" onclick=\"toggleCard('${id}')\">\n        \u003cspan style=\"font-size:16px\">${statusIcon}\u003c/span>\n        \u003cdiv class=\"card-title\">${arq.tipo}\u003c/div>\n        \u003cdiv style=\"display:flex;gap:4px\">\n          ${criticos>0?`\u003cspan class=\"badge b-red\">🔴 ${criticos}\u003c/span>`:''}\n          ${avisos>0?`\u003cspan class=\"badge b-yellow\">⚠️ ${avisos}\u003c/span>`:''}\n          ${oks>0?`\u003cspan class=\"badge b-green\">✅ ${oks}\u003c/span>`:''}\n        \u003c/div>\n        \u003cspan style=\"font-size:12px;color:#8b949e;margin-left:4px\" id=\"chv-${id}\">▶\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"card-body\" id=\"${id}\">\n  `;\n\n  // Info do projeto\n  if(analise.info.length > 0){\n    html += '\u003cdiv style=\"margin-bottom:10px\">';\n    for(const i of analise.info){\n      html += `\u003cdiv class=\"row\">\u003clabel>${i.label}:\u003c/label>\u003cspan>${eh(String(i.valor))}\u003c/span>\u003c/div>`;\n    }\n    html += '\u003c/div>\u003cdiv class=\"sep\">\u003c/div>';\n  }\n\n  // Problemas\n  html += '\u003cdiv style=\"margin-top:8px\">';\n  for(const prob of analise.problemas){\n    const cls = prob.nivel==='crit'?'prob-crit':prob.nivel==='warn'?'prob-warn':prob.nivel==='ok'?'prob-ok':'prob-info';\n    html += `\u003cdiv class=\"prob ${cls}\">\n      \u003cdiv class=\"prob-icon\">${prob.nivel==='crit'?'🔴':prob.nivel==='warn'?'⚠️':prob.nivel==='ok'?'✅':'ℹ️'}\u003c/div>\n      \u003cdiv class=\"prob-content\">\n        \u003cb>${eh(prob.titulo)}\u003c/b>\n        ${eh(prob.desc)}\n        ${prob.codigo?`\u003cbr>\u003ccode>${eh(prob.codigo.slice(0,100))}${prob.codigo.length>100?'...':''}\u003c/code>`:''}\n        ${prob.fix?`\u003cbr>\u003cspan style=\"color:#3fb950\">💡 Fix: ${eh(prob.fix)}\u003c/span>`:''}\n      \u003c/div>\n    \u003c/div>`;\n  }\n  html += '\u003c/div>';\n\n  // Preview da correção\n  if(analise.correcao){\n    html += `\u003cdiv class=\"fix-box\">\n      \u003cdiv class=\"fix-title\">✅ Versão corrigida disponível na aba \"Arquivos Corrigidos\"\u003c/div>\n    \u003c/div>`;\n  }\n\n  html += '\u003c/div>\u003c/div>';\n  return html;\n}\n\nfunction toggleCard(id){\n  const b=document.getElementById(id);\n  const c=document.getElementById('chv-'+id);\n  const open=b.classList.toggle('open');\n  c.textContent=open?'▼':'▶';\n}\n\n// ══════════════════════════════════════════\n// RENDER CORRIGIDOS\n// ══════════════════════════════════════════\nfunction renderCorrigidos(correcoes, arquivos){\n  const el = document.getElementById('corrigido-content');\n  const vazio = document.getElementById('corrigido-vazio');\n  el.style.display='block';\n  vazio.style.display='none';\n\n  let html = `\u003cp style=\"font-size:11px;color:#8b949e;margin-bottom:12px\">\n    Substitua estes arquivos no seu projeto. Todas as referências ao Replit foram removidas.\n  \u003c/p>`;\n\n  for(const c of correcoes){\n    if(!c.correcao) continue;\n    const id='fix-'+Math.random().toString(36).slice(2,6);\n    const conteudo = typeof c.correcao==='string'?c.correcao:JSON.stringify(c.correcao,null,2);\n    html += `\n      \u003cdiv class=\"card\" style=\"margin-bottom:10px\">\n        \u003cdiv class=\"card-header\" onclick=\"toggleCard('${id}')\">\n          \u003cspan>✅\u003c/span>\n          \u003cdiv class=\"card-title\">${c.tipo} — CORRIGIDO\u003c/div>\n          \u003cbutton class=\"btn btn-green btn-sm\" onclick=\"event.stopPropagation();copiar('${id}-code')\">📋 Copiar\u003c/button>\n          \u003cbutton class=\"btn btn-blue btn-sm\" onclick=\"event.stopPropagation();baixarArquivo('${c.tipo}','${id}-code')\">⬇️ Baixar\u003c/button>\n          \u003cspan style=\"font-size:12px;color:#8b949e\" id=\"chv-${id}\">▶\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card-body\" id=\"${id}\">\n          \u003cdiv class=\"code-box\" id=\"${id}-code\">${eh(conteudo)}\u003c/div>\n        \u003c/div>\n      \u003c/div>`;\n  }\n\n  // Botão baixar tudo\n  html += `\n    \u003cbutton class=\"btn btn-green\" style=\"width:100%;margin-top:8px\" onclick=\"baixarTodosCorrigidos()\">\n      ⬇️ Baixar todos os arquivos corrigidos (.zip)\n    \u003c/button>`;\n\n  el.innerHTML = html;\n\n  // Guardar correcoes globalmente\n  window._correcoes = correcoes;\n}\n\n// ══════════════════════════════════════════\n// GERADORES DE ARQUIVOS CORRIGIDOS\n// ══════════════════════════════════════════\nfunction gerarAppJsonCorrigido(p){\n  const expo = p.expo;\n  const plugins = (expo.plugins||[]).map(plugin=>{\n    if(Array.isArray(plugin) && plugin[0]==='expo-router'){\n      return 'expo-router'; // Remove o objeto {origin}\n    }\n    return plugin;\n  });\n\n  return {\n    expo: {\n      name: expo.name,\n      slug: expo.slug,\n      version: expo.version,\n      orientation: expo.orientation||'portrait',\n      icon: expo.icon,\n      scheme: expo.scheme,\n      userInterfaceStyle: expo.userInterfaceStyle||'dark',\n      newArchEnabled: expo.newArchEnabled||true,\n      splash: expo.splash,\n      ios: expo.ios,\n      android: {\n        ...expo.android,\n        softwareKeyboardLayoutMode: 'resize',\n      },\n      web: expo.web,\n      plugins: plugins,\n      experiments: {\n        typedRoutes: true,\n        // reactCompiler REMOVIDO\n      },\n      extra: expo.extra,\n      owner: expo.owner,\n    }\n  };\n}\n\nfunction gerarPackageJsonMobileCorrigido(p){\n  const nome = (p.name||'meu-app').replace('@workspace/','').replace(/[^a-z0-9-]/g,'-');\n  const deps = {};\n  const devDeps = {};\n\n  // Limpar deps\n  for(const[k,v]of Object.entries(p.dependencies||{})){\n    if(!k.startsWith('@replit/')&&!k.startsWith('@workspace/')) deps[k]=v;\n  }\n  for(const[k,v]of Object.entries(p.devDependencies||{})){\n    if(!k.startsWith('@replit/')&&!k.startsWith('@workspace/')){\n      // Corrigir \"catalog:\"\n      const versao = v==='catalog:'?'*':v;\n      devDeps[k]=versao;\n    }\n  }\n\n  // Corrigir react/react-dom se \"catalog:\"\n  if(devDeps.react==='*') devDeps.react='19.0.0';\n  if(devDeps['react-dom']==='*') devDeps['react-dom']='19.0.0';\n\n  return {\n    name: nome,\n    version: p.version||'1.0.0',\n    private: true,\n    main: 'expo-router/entry',\n    scripts: {\n      start: 'expo start',\n      'start:tunnel': 'expo start --tunnel',\n      android: 'expo run:android',\n      'build:apk': 'eas build --platform android --profile preview',\n      typecheck: 'tsc -p tsconfig.json --noEmit',\n    },\n    devDependencies: devDeps,\n    dependencies: deps,\n  };\n}\n\nfunction gerarEasJsonCorrigido(p){\n  return {\n    cli: { version: '>= 12.0.0', appVersionSource: 'local' },\n    build: {\n      preview: {\n        distribution: 'internal',\n        credentialsSource: p.build?.preview?.credentialsSource||'remote',\n        android: {\n          buildType: 'apk',\n          gradleCommand: ':app:assembleRelease',\n          resourceClass: 'medium',\n        },\n        node: '20.18.0',\n        cache: { disabled: false },\n        env: {},\n      },\n      development: {\n        distribution: 'internal',\n        android: { buildType: 'apk', resourceClass: 'medium' },\n        node: '20.18.0',\n      },\n      production: {\n        android: { buildType: 'app-bundle', resourceClass: 'medium' },\n        node: '20.18.0',\n      },\n    },\n    submit: { production: {} },\n  };\n}\n\nfunction gerarTsconfigCorrigido(p){\n  const corrigido = {...p};\n  delete corrigido.references; // Remove referências externas\n  return corrigido;\n}\n\n// ══════════════════════════════════════════\n// IMPORTAR ZIP\n// ══════════════════════════════════════════\nasync function importarArquivo(inp){\n  const f = inp.files[0]; if(!f) return;\n  const st = document.getElementById('zip-status');\n  const msg = document.getElementById('zip-msg');\n  st.style.display='flex';\n\n  if(f.name.endsWith('.zip')){\n    try{\n      msg.textContent='Carregando JSZip...';\n      const JSZ = await loadJSZ();\n      msg.textContent='Lendo ZIP...';\n      const zip = await JSZ.loadAsync(await f.arrayBuffer());\n      const arquivosParaAnalisar = [];\n      const configFiles = ['package.json','app.json','eas.json','tsconfig.json','credentials.json','babel.config.js','metro.config.js','.env','.env.example'];\n\n      for(const [path, entry] of Object.entries(zip.files)){\n        if(entry.dir) continue;\n        const nome = path.split('/').pop();\n        if(configFiles.includes(nome) && !path.includes('node_modules')){\n          const txt = await entry.async('text').catch(()=>'');\n          arquivosParaAnalisar.push({ tipo: identificarTipo(txt)||nome, conteudo: txt, parsed: tentarParse(txt), path });\n          msg.textContent=`Analisando: ${path}`;\n        }\n      }\n\n      if(arquivosParaAnalisar.length===0){\n        msg.textContent='Nenhum arquivo de configuração encontrado no ZIP';\n        return;\n      }\n\n      msg.textContent=`${arquivosParaAnalisar.length} arquivos encontrados!`;\n      processarResultados(arquivosParaAnalisar);\n      showTab('resultado');\n    }catch(e){\n      msg.textContent='Erro: '+e.message;\n    }\n  } else {\n    // Arquivo único\n    const txt = await f.text().catch(()=>'');\n    const arquivos = detectarArquivos(txt);\n    processarResultados(arquivos);\n    showTab('resultado');\n  }\n  inp.value='';\n}\n\n// ══════════════════════════════════════════\n// UTILS\n// ══════════════════════════════════════════\nfunction copiar(id){\n  const el=document.getElementById(id);\n  navigator.clipboard.writeText(el.textContent||el.innerText).then(()=>toast('✅ Copiado!','ok'));\n}\n\nfunction baixarArquivo(tipo, codeId){\n  const conteudo = document.getElementById(codeId).textContent||'';\n  const nome = tipo.replace(' — CORRIGIDO','').replace(' (mobile)','').replace(' (web/electron)','');\n  const blob = new Blob([conteudo],{type:'text/plain'});\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  a.href=url; a.download=nome; a.click();\n  setTimeout(()=>URL.revokeObjectURL(url),1000);\n}\n\nasync function baixarTodosCorrigidos(){\n  if(!window._correcoes||window._correcoes.length===0){ toast('Nenhuma correção disponível','err'); return; }\n  try{\n    const JSZ = await loadJSZ();\n    const zip = new JSZ();\n    for(const c of window._correcoes){\n      if(!c.correcao) continue;\n      const conteudo = typeof c.correcao==='string'?c.correcao:JSON.stringify(c.correcao,null,2);\n      const nome = c.tipo.replace(' (mobile)','').replace(' (web/electron)','');\n      zip.file(nome, conteudo);\n    }\n    // Adicionar .gitignore com credentials\n    zip.file('.gitignore-additions.txt','# Adicione ao seu .gitignore:\\ncredentials.json\\n.env\\n*.keystore\\n*.jks\\n');\n    const blob = await zip.generateAsync({type:'blob'});\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href=url; a.download='arquivos-corrigidos.zip'; a.click();\n    setTimeout(()=>URL.revokeObjectURL(url),1000);\n    toast('✅ ZIP baixado!','ok');\n  }catch(e){ toast('Erro: '+e.message,'err'); }\n}\n\nfunction colarExemplo(){\n  document.getElementById('txt-input').value=`{\n  \"expo\": {\n    \"name\": \"Meu App\",\n    \"slug\": \"meu-app\",\n    \"version\": \"1.0.0\",\n    \"plugins\": [\n      [\"expo-router\", {\"origin\": \"https://replit.com/\"}],\n      \"expo-font\"\n    ],\n    \"experiments\": {\"reactCompiler\": true},\n    \"android\": {\"package\": \"com.meuapp.test\"},\n    \"extra\": {\"eas\": {\"projectId\": \"\"}}\n  }\n}`;\n  toast('Exemplo colado!','ok');\n}\n\nfunction eh(s){ return String(s||'').replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;'); }\n\nfunction toast(msg,tipo){\n  const el=document.getElementById('toast');\n  el.textContent=msg;\n  el.className='toast '+(tipo==='ok'?'t-ok':'t-err');\n  el.style.opacity='1';\n  clearTimeout(el._t);\n  el._t=setTimeout(()=>el.style.opacity='0',2500);\n}\n\nfunction loadJSZ(){\n  return new Promise((res,rej)=>{\n    if(window.JSZip){res(window.JSZip);return;}\n    const s=document.createElement('script');\n    s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';\n    s.onload=()=>res(window.JSZip);\n    s.onerror=()=>rej(new Error('JSZip não carregou'));\n    document.head.appendChild(s);\n  });\n}\n\n// Drag & drop no ZIP\nconst dz=document.getElementById('dz');\ndz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over');});\ndz.addEventListener('dragleave',()=>dz.classList.remove('over'));\ndz.addEventListener('drop',e=>{\n  e.preventDefault();dz.classList.remove('over');\n  const f=e.dataTransfer.files[0]; if(!f) return;\n  const inp=document.getElementById('fi');\n  const dt=new DataTransfer();dt.items.add(f);inp.files=dt.files;\n  importarArquivo(inp);\n});\n\n// Auto-analisar os exemplos da conversa\nwindow.onload = ()=>{\n  // Pré-carregar os arquivos que você já colou\n  document.getElementById('txt-multi').value = `{\"name\":\"@workspace/sk-editor\",\"version\":\"1.0.0\",\"type\":\"module\",\"scripts\":{\"dev\":\"vite --host 0.0.0.0\"},\"dependencies\":{\"@webcontainer/api\":\"^1.6.4\",\"express\":\"^5.2.1\",\"jszip\":\"^3.10.1\"}}\n\n{\"expo\":{\"name\":\"APK Builder\",\"slug\":\"apk\",\"version\":\"2.0.0\",\"plugins\":[[\"expo-router\",{\"origin\":\"https://replit.com/\"}],\"expo-font\"],\"experiments\":{\"typedRoutes\":true,\"reactCompiler\":true},\"android\":{\"package\":\"com.sktools.apkbuilder\",\"softwareKeyboardLayoutMode\":\"resize\"},\"extra\":{\"eas\":{\"projectId\":\"4ecb0863-1738-4d4e-b693-185e905fc234\"}},\"owner\":\"maikons-individual-orga\"}}\n\n{\"name\":\"@workspace/habit-tracker\",\"version\":\"0.0.0\",\"main\":\"expo-router/entry\",\"scripts\":{\"dev\":\"EXPO_PACKAGER_PROXY_URL=https://$REPLIT_EXPO_DEV_DOMAIN pnpm exec expo start --localhost --port $PORT\"},\"devDependencies\":{\"expo\":\"~54.0.27\",\"react\":\"catalog:\",\"react-native\":\"0.81.5\"}}`;\n};\n    \u003c/script>\n\u003c/body>\n\n\u003c/html>","l":"html","n":""},{"p":"projeto_4-sistema.html","t":"\u003c!DOCTYPE html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\n    \u003cmeta charset=\"UTF-8\">\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    \u003cmeta name=\"description\" content=\"Sistema Profissional Modular com Supabase\">\n    \u003cmeta name=\"theme-color\" content=\"#667eea\">\n    \u003ctitle>Sistema Profissional - Modular\u003c/title>\n    \u003clink rel=\"manifest\" href=\"manifest.json\">\n    \u003clink rel=\"icon\" type=\"image/png\" href=\"data:image/svg+xml,\u003csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'>\u003crect fill='%23667eea' width='192' height='192'/>\u003ctext x='96' y='120' font-size='120' fill='white' text-anchor='middle' font-weight='bold'>S\u003c/text>\u003c/svg>\">\n    \u003cstyle>\n        * {\n            margin: 0;\n            padding: 0;\n            box-sizing: border-box;\n        }\n\n        :root {\n            --primary: #667eea;\n            --secondary: #764ba2;\n            --success: #28a745;\n            --danger: #dc3545;\n            --warning: #ffc107;\n            --info: #17a2b8;\n            --light: #f8f9fa;\n            --dark: #1e1e1e;\n            --border: #e9ecef;\n            --shadow: 0 2px 8px rgba(0,0,0,0.1);\n            --shadow-lg: 0 10px 30px rgba(0,0,0,0.2);\n        }\n\n        html, body {\n            height: 100%;\n            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;\n            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);\n            color: #333;\n        }\n\n        body {\n            display: flex;\n            flex-direction: column;\n        }\n\n        /* LAYOUT PRINCIPAL */\n        .app-container {\n            display: flex;\n            height: 100vh;\n            overflow: hidden;\n        }\n\n        .sidebar {\n            width: 280px;\n            background: white;\n            border-right: 1px solid var(--border);\n            display: flex;\n            flex-direction: column;\n            box-shadow: var(--shadow);\n            z-index: 100;\n            transition: transform 0.3s ease;\n        }\n\n        .sidebar-header {\n            padding: 20px;\n            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);\n            color: white;\n            text-align: center;\n        }\n\n        .sidebar-header h1 {\n            font-size: 1.5em;\n            margin-bottom: 5px;\n        }\n\n        .sidebar-header p {\n            font-size: 0.85em;\n            opacity: 0.9;\n        }\n\n        .sidebar-menu {\n            flex: 1;\n            overflow-y: auto;\n            padding: 15px 0;\n        }\n\n        .menu-item {\n            padding: 15px 20px;\n            cursor: pointer;\n            transition: all 0.3s;\n            border-left: 4px solid transparent;\n            display: flex;\n            align-items: center;\n            gap: 10px;\n            color: #666;\n            font-weight: 500;\n        }\n\n        .menu-item:hover {\n            background: var(--light);\n            border-left-color: var(--primary);\n            color: var(--primary);\n        }\n\n        .menu-item.active {\n            background: rgba(102, 126, 234, 0.1);\n            border-left-color: var(--primary);\n            color: var(--primary);\n        }\n\n        .menu-icon {\n            font-size: 1.3em;\n        }\n\n        .sidebar-footer {\n            padding: 15px 20px;\n            border-top: 1px solid var(--border);\n            background: var(--light);\n        }\n\n        .connection-status {\n            display: flex;\n            align-items: center;\n            gap: 8px;\n            padding: 10px;\n            background: white;\n            border-radius: 5px;\n            font-size: 0.9em;\n        }\n\n        .status-dot {\n            width: 10px;\n            height: 10px;\n            border-radius: 50%;\n            background: #dc3545;\n        }\n\n        .status-dot.connected {\n            background: #28a745;\n        }\n\n        /* CONTEÚDO PRINCIPAL */\n        .main-content {\n            flex: 1;\n            display: flex;\n            flex-direction: column;\n            overflow: hidden;\n        }\n\n        .topbar {\n            background: white;\n            padding: 15px 30px;\n            border-bottom: 1px solid var(--border);\n            display: flex;\n            justify-content: space-between;\n            align-items: center;\n            box-shadow: var(--shadow);\n        }\n\n        .topbar-title {\n            font-size: 1.5em;\n            font-weight: 600;\n            color: #333;\n        }\n\n        .topbar-actions {\n            display: flex;\n            gap: 10px;\n            align-items: center;\n        }\n\n        .btn {\n            padding: 10px 20px;\n            border: none;\n            border-radius: 5px;\n            cursor: pointer;\n            font-weight: 600;\n            transition: all 0.3s;\n            display: inline-flex;\n            align-items: center;\n            gap: 8px;\n        }\n\n        .btn-primary {\n            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);\n            color: white;\n        }\n\n        .btn-primary:hover {\n            transform: translateY(-2px);\n            box-shadow: var(--shadow-lg);\n        }\n\n        .btn-secondary {\n            background: var(--light);\n            color: #666;\n            border: 1px solid var(--border);\n        }\n\n        .btn-secondary:hover {\n            background: #e9ecef;\n        }\n\n        .btn-danger {\n            background: var(--danger);\n            color: white;\n        }\n\n        .btn-success {\n            background: var(--success);\n            color: white;\n        }\n\n        .btn-small {\n            padding: 8px 15px;\n            font-size: 0.9em;\n        }\n\n        .content-area {\n            flex: 1;\n            overflow-y: auto;\n            padding: 30px;\n            background: #f5f6fa;\n        }\n\n        /* CARDS E COMPONENTES */\n        .card {\n            background: white;\n            border-radius: 8px;\n            padding: 20px;\n            margin-bottom: 20px;\n            box-shadow: var(--shadow);\n            transition: all 0.3s;\n        }\n\n        .card:hover {\n            box-shadow: var(--shadow-lg);\n        }\n\n        .card-header {\n            display: flex;\n            justify-content: space-between;\n            align-items: center;\n            margin-bottom: 15px;\n            padding-bottom: 15px;\n            border-bottom: 1px solid var(--border);\n        }\n\n        .card-title {\n            font-size: 1.3em;\n            font-weight: 600;\n            color: #333;\n        }\n\n        .card-body {\n            color: #666;\n            line-height: 1.6;\n        }\n\n        /* FORMULÁRIOS */\n        .form-group {\n            margin-bottom: 20px;\n        }\n\n        .form-group label {\n            display: block;\n            margin-bottom: 8px;\n            font-weight: 600;\n            color: #333;\n        }\n\n        .form-group input,\n        .form-group textarea,\n        .form-group select {\n            width: 100%;\n            padding: 12px;\n            border: 1px solid var(--border);\n            border-radius: 5px;\n            font-size: 1em;\n            font-family: inherit;\n            transition: border-color 0.3s;\n        }\n\n        .form-group input:focus,\n        .form-group textarea:focus,\n        .form-group select:focus {\n            outline: none;\n            border-color: var(--primary);\n            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);\n        }\n\n        .form-group textarea {\n            resize: vertical;\n            min-height: 120px;\n        }\n\n        .form-row {\n            display: grid;\n            grid-template-columns: 1fr 1fr;\n            gap: 20px;\n        }\n\n        /* TABELAS */\n        .table-responsive {\n            overflow-x: auto;\n        }\n\n        table {\n            width: 100%;\n            border-collapse: collapse;\n        }\n\n        thead {\n            background: var(--light);\n        }\n\n        th {\n            padding: 15px;\n            text-align: left;\n            font-weight: 600;\n            color: #333;\n            border-bottom: 2px solid var(--border);\n        }\n\n        td {\n            padding: 15px;\n            border-bottom: 1px solid var(--border);\n        }\n\n        tr:hover {\n            background: var(--light);\n        }\n\n        /* MODAIS */\n        .modal {\n            display: none;\n            position: fixed;\n            top: 0;\n            left: 0;\n            right: 0;\n            bottom: 0;\n            background: rgba(0,0,0,0.5);\n            z-index: 1000;\n            align-items: center;\n            justify-content: center;\n        }\n\n        .modal.active {\n            display: flex;\n        }\n\n        .modal-content {\n            background: white;\n            border-radius: 8px;\n            padding: 30px;\n            max-width: 500px;\n            width: 90%;\n            max-height: 90vh;\n            overflow-y: auto;\n            box-shadow: var(--shadow-lg);\n        }\n\n        .modal-header {\n            display: flex;\n            justify-content: space-between;\n            align-items: center;\n            margin-bottom: 20px;\n            padding-bottom: 15px;\n            border-bottom: 1px solid var(--border);\n        }\n\n        .modal-title {\n            font-size: 1.5em;\n            font-weight: 600;\n        }\n\n        .close-btn {\n            background: none;\n            border: none;\n            font-size: 1.5em;\n            cursor: pointer;\n            color: #999;\n        }\n\n        .close-btn:hover {\n            color: #333;\n        }\n\n        /* ALERTAS */\n        .alert {\n            padding: 15px 20px;\n            border-radius: 5px;\n            margin-bottom: 20px;\n            display: flex;\n            align-items: center;\n            gap: 10px;\n        }\n\n        .alert-success {\n            background: #d4edda;\n            color: #155724;\n            border-left: 4px solid #28a745;\n        }\n\n        .alert-error {\n            background: #f8d7da;\n            color: #721c24;\n            border-left: 4px solid #dc3545;\n        }\n\n        .alert-warning {\n            background: #fff3cd;\n            color: #856404;\n            border-left: 4px solid #ffc107;\n        }\n\n        .alert-info {\n            background: #d1ecf1;\n            color: #0c5460;\n            border-left: 4px solid #17a2b8;\n        }\n\n        /* GRID */\n        .grid {\n            display: grid;\n            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));\n            gap: 20px;\n            margin-bottom: 20px;\n        }\n\n        .stat-card {\n            background: white;\n            padding: 20px;\n            border-radius: 8px;\n            box-shadow: var(--shadow);\n            text-align: center;\n        }\n\n        .stat-number {\n            font-size: 2.5em;\n            font-weight: bold;\n            color: var(--primary);\n        }\n\n        .stat-label {\n            color: #999;\n            margin-top: 10px;\n            font-size: 0.95em;\n        }\n\n        /* ABAS */\n        .tabs {\n            display: flex;\n            gap: 10px;\n            margin-bottom: 20px;\n            border-bottom: 2px solid var(--border);\n        }\n\n        .tab-btn {\n            padding: 12px 20px;\n            background: none;\n            border: none;\n            cursor: pointer;\n            font-weight: 600;\n            color: #999;\n            border-bottom: 3px solid transparent;\n            transition: all 0.3s;\n        }\n\n        .tab-btn.active {\n            color: var(--primary);\n            border-bottom-color: var(--primary);\n        }\n\n        .tab-content {\n            display: none;\n        }\n\n        .tab-content.active {\n            display: block;\n        }\n\n        /* RESPONSIVO */\n        @media (max-width: 768px) {\n            .app-container {\n                flex-direction: column;\n            }\n\n            .sidebar {\n                width: 100%;\n                height: auto;\n                max-height: 60px;\n                flex-direction: row;\n                transform: translateX(-100%);\n                position: absolute;\n                top: 0;\n                left: 0;\n                z-index: 200;\n            }\n\n            .sidebar.active {\n                transform: translateX(0);\n            }\n\n            .sidebar-header {\n                flex: 0 0 60px;\n                padding: 0;\n                display: flex;\n                align-items: center;\n                justify-content: center;\n            }\n\n            .sidebar-menu {\n                display: none;\n            }\n\n            .form-row {\n                grid-template-columns: 1fr;\n            }\n\n            .topbar {\n                padding: 15px;\n            }\n\n            .content-area {\n                padding: 15px;\n            }\n        }\n\n        /* LOADING */\n        .spinner {\n            border: 3px solid var(--light);\n            border-top: 3px solid var(--primary);\n            border-radius: 50%;\n            width: 30px;\n            height: 30px;\n            animation: spin 1s linear infinite;\n        }\n\n        @keyframes spin {\n            0% { transform: rotate(0deg); }\n            100% { transform: rotate(360deg); }\n        }\n\n        /* SCROLLBAR */\n        ::-webkit-scrollbar {\n            width: 8px;\n            height: 8px;\n        }\n\n        ::-webkit-scrollbar-track {\n            background: var(--light);\n        }\n\n        ::-webkit-scrollbar-thumb {\n            background: var(--primary);\n            border-radius: 4px;\n        }\n\n        ::-webkit-scrollbar-thumb:hover {\n            background: var(--secondary);\n        }\n    \u003c/style>\n\u003c/head>\n\u003cbody>\n    \u003cdiv class=\"app-container\">\n        \u003c!-- SIDEBAR -->\n        \u003caside class=\"sidebar\" id=\"sidebar\">\n            \u003cdiv class=\"sidebar-header\">\n                \u003ch1>📊 Sistema\u003c/h1>\n                \u003cp>Profissional Modular\u003c/p>\n            \u003c/div>\n\n            \u003cnav class=\"sidebar-menu\" id=\"sidebarMenu\">\n                \u003cdiv class=\"menu-item active\" data-page=\"dashboard\">\n                    \u003cspan class=\"menu-icon\">📈\u003c/span>\n                    \u003cspan>Dashboard\u003c/span>\n                \u003c/div>\n                \u003cdiv class=\"menu-item\" data-page=\"projetos\">\n                    \u003cspan class=\"menu-icon\">📁\u003c/span>\n                    \u003cspan>Projetos\u003c/span>\n                \u003c/div>\n                \u003cdiv class=\"menu-item\" data-page=\"tarefas\">\n                    \u003cspan class=\"menu-icon\">✅\u003c/span>\n                    \u003cspan>Tarefas\u003c/span>\n                \u003c/div>\n                \u003cdiv class=\"menu-item\" data-page=\"usuarios\">\n                    \u003cspan class=\"menu-icon\">👥\u003c/span>\n                    \u003cspan>Usuários\u003c/span>\n                \u003c/div>\n                \u003cdiv class=\"menu-item\" data-page=\"relatorios\">\n                    \u003cspan class=\"menu-icon\">📋\u003c/span>\n                    \u003cspan>Relatórios\u003c/span>\n                \u003c/div>\n                \u003cdiv class=\"menu-item\" data-page=\"configuracoes\">\n                    \u003cspan class=\"menu-icon\">⚙️\u003c/span>\n                    \u003cspan>Configurações\u003c/span>\n                \u003c/div>\n            \u003c/nav>\n\n            \u003cdiv class=\"sidebar-footer\">\n                \u003cdiv class=\"connection-status\">\n                    \u003cdiv class=\"status-dot\" id=\"statusDot\">\u003c/div>\n                    \u003cspan id=\"statusText\">Desconectado\u003c/span>\n                \u003c/div>\n            \u003c/div>\n        \u003c/aside>\n\n        \u003c!-- CONTEÚDO PRINCIPAL -->\n        \u003cdiv class=\"main-content\">\n            \u003c!-- TOPBAR -->\n            \u003cheader class=\"topbar\">\n                \u003ch2 class=\"topbar-title\" id=\"pageTitle\">Dashboard\u003c/h2>\n                \u003cdiv class=\"topbar-actions\">\n                    \u003cbutton class=\"btn btn-secondary btn-small\" id=\"connectBtn\" onclick=\"abrirConexao()\">\n                        🔗 Conectar Supabase\n                    \u003c/button>\n                    \u003cbutton class=\"btn btn-secondary btn-small\" id=\"menuToggle\">\n                        ☰ Menu\n                    \u003c/button>\n                \u003c/div>\n            \u003c/header>\n\n            \u003c!-- ÁREA DE CONTEÚDO -->\n            \u003cdiv class=\"content-area\" id=\"contentArea\">\n                \u003c!-- Conteúdo dinâmico será inserido aqui -->\n            \u003c/div>\n        \u003c/div>\n    \u003c/div>\n\n    \u003c!-- MODAL DE CONEXÃO -->\n    \u003cdiv class=\"modal\" id=\"conexaoModal\">\n        \u003cdiv class=\"modal-content\">\n            \u003cdiv class=\"modal-header\">\n                \u003ch2 class=\"modal-title\">🔗 Conectar ao Supabase\u003c/h2>\n                \u003cbutton class=\"close-btn\" onclick=\"fecharModal('conexaoModal')\">✕\u003c/button>\n            \u003c/div>\n            \u003cdiv class=\"modal-body\">\n                \u003cdiv class=\"form-group\">\n                    \u003clabel>URL do Supabase:\u003c/label>\n                    \u003cinput type=\"text\" id=\"supabaseUrl\" placeholder=\"https://seu-projeto.supabase.co\">\n                \u003c/div>\n                \u003cdiv class=\"form-group\">\n                    \u003clabel>Chave Pública (anon):\u003c/label>\n                    \u003cinput type=\"password\" id=\"supabaseKey\" placeholder=\"sua-chave-publica\">\n                \u003c/div>\n                \u003cbutton class=\"btn btn-primary\" style=\"width: 100%; margin-top: 20px;\" onclick=\"conectarSupabase()\">\n                    Conectar\n                \u003c/button>\n            \u003c/div>\n        \u003c/div>\n    \u003c/div>\n\n    \u003c!-- MODAL GENÉRICO -->\n    \u003cdiv class=\"modal\" id=\"genericModal\">\n        \u003cdiv class=\"modal-content\">\n            \u003cdiv class=\"modal-header\">\n                \u003ch2 class=\"modal-title\" id=\"genericModalTitle\">Modal\u003c/h2>\n                \u003cbutton class=\"close-btn\" onclick=\"fecharModal('genericModal')\">✕\u003c/button>\n            \u003c/div>\n            \u003cdiv class=\"modal-body\" id=\"genericModalBody\">\n                \u003c!-- Conteúdo dinâmico -->\n            \u003c/div>\n        \u003c/div>\n    \u003c/div>\n\n    \u003c!-- SCRIPTS MODULARES -->\n    \u003cscript>\n        // ============================================\n        // MÓDULO: CONFIGURAÇÃO GLOBAL\n        // ============================================\n        const CONFIG = {\n            supabase: {\n                url: localStorage.getItem('supabase_url') || '',\n                key: localStorage.getItem('supabase_key') || ''\n            },\n            currentPage: 'dashboard',\n            isConnected: false\n        };\n\n        // ============================================\n        // MÓDULO: INICIALIZAÇÃO\n        // ============================================\n        class App {\n            static init() {\n                this.setupEventListeners();\n                this.verificarConexao();\n                this.carregarPagina('dashboard');\n                this.registerServiceWorker();\n            }\n\n            static setupEventListeners() {\n                // Menu items\n                document.querySelectorAll('.menu-item').forEach(item => {\n                    item.addEventListener('click', () => {\n                        const page = item.dataset.page;\n                        this.mudarPagina(page);\n                    });\n                });\n\n                // Menu toggle mobile\n                document.getElementById('menuToggle').addEventListener('click', () => {\n                    document.getElementById('sidebar').classList.toggle('active');\n                });\n\n                // Fechar menu ao clicar em um item (mobile)\n                document.querySelectorAll('.menu-item').forEach(item => {\n                    item.addEventListener('click', () => {\n                        if (window.innerWidth \u003c= 768) {\n                            document.getElementById('sidebar').classList.remove('active');\n                        }\n                    });\n                });\n            }\n\n            static mudarPagina(page) {\n                CONFIG.currentPage = page;\n                \n                // Atualizar menu ativo\n                document.querySelectorAll('.menu-item').forEach(item => {\n                    item.classList.remove('active');\n                    if (item.dataset.page === page) {\n                        item.classList.add('active');\n                    }\n                });\n\n                this.carregarPagina(page);\n            }\n\n            static carregarPagina(page) {\n                const titles = {\n                    dashboard: 'Dashboard',\n                    projetos: 'Projetos',\n                    tarefas: 'Tarefas',\n                    usuarios: 'Usuários',\n                    relatorios: 'Relatórios',\n                    configuracoes: 'Configurações'\n                };\n\n                document.getElementById('pageTitle').textContent = titles[page] || 'Página';\n\n                const contentArea = document.getElementById('contentArea');\n                contentArea.innerHTML = `\u003cdiv class=\"spinner\" style=\"margin: 50px auto;\">\u003c/div>`;\n\n                // Simular carregamento\n                setTimeout(() => {\n                    const conteudo = this.renderizarPagina(page);\n                    contentArea.innerHTML = conteudo;\n                }, 300);\n            }\n\n            static renderizarPagina(page) {\n                const paginas = {\n                    dashboard: this.renderDashboard(),\n                    projetos: this.renderProjetos(),\n                    tarefas: this.renderTarefas(),\n                    usuarios: this.renderUsuarios(),\n                    relatorios: this.renderRelatorios(),\n                    configuracoes: this.renderConfiguracoes()\n                };\n\n                return paginas[page] || '\u003cp>Página não encontrada\u003c/p>';\n            }\n\n            static renderDashboard() {\n                return `\n                    \u003cdiv class=\"grid\">\n                        \u003cdiv class=\"stat-card\">\n                            \u003cdiv class=\"stat-number\">24\u003c/div>\n                            \u003cdiv class=\"stat-label\">Projetos Ativos\u003c/div>\n                        \u003c/div>\n                        \u003cdiv class=\"stat-card\">\n                            \u003cdiv class=\"stat-number\">156\u003c/div>\n                            \u003cdiv class=\"stat-label\">Tarefas Concluídas\u003c/div>\n                        \u003c/div>\n                        \u003cdiv class=\"stat-card\">\n                            \u003cdiv class=\"stat-number\">12\u003c/div>\n                            \u003cdiv class=\"stat-label\">Usuários\u003c/div>\n                        \u003c/div>\n                    \u003c/div>\n\n                    \u003cdiv class=\"card\">\n                        \u003cdiv class=\"card-header\">\n                            \u003ch3 class=\"card-title\">📊 Atividade Recente\u003c/h3>\n                            \u003cbutton class=\"btn btn-primary btn-small\">Ver Mais\u003c/button>\n                        \u003c/div>\n                        \u003cdiv class=\"card-body\">\n                            \u003cp>✅ Projeto \"Sistema Web\" iniciado\u003c/p>\n                            \u003cp>✅ Tarefa \"Design UI\" concluída\u003c/p>\n                            \u003cp>✅ Novo usuário \"João Silva\" adicionado\u003c/p>\n                        \u003c/div>\n                    \u003c/div>\n\n                    \u003cdiv class=\"card\">\n                        \u003cdiv class=\"card-header\">\n                            \u003ch3 class=\"card-title\">🎯 Próximos Passos\u003c/h3>\n                        \u003c/div>\n                        \u003cdiv class=\"card-body\">\n                            \u003col style=\"margin-left: 20px; line-height: 2;\">\n                                \u003cli>Conectar ao Supabase\u003c/li>\n                                \u003cli>Criar tabelas no banco de dados\u003c/li>\n                                \u003cli>Configurar autenticação\u003c/li>\n                                \u003cli>Testar sincronização de dados\u003c/li>\n                                \u003cli>Publicar como PWA\u003c/li>\n                            \u003c/ol>\n                        \u003c/div>\n                    \u003c/div>\n                `;\n            }\n\n            static renderProjetos() {\n                return `\n                    \u003cdiv class=\"card\">\n                        \u003cdiv class=\"card-header\">\n                            \u003ch3 class=\"card-title\">📁 Meus Projetos\u003c/h3>\n                            \u003cbutton class=\"btn btn-primary btn-small\" onclick=\"abrirNovoProjet()\">\n                                ➕ Novo Projeto\n                            \u003c/button>\n                        \u003c/div>\n                        \u003cdiv class=\"table-responsive\">\n                            \u003ctable>\n                                \u003cthead>\n                                    \u003ctr>\n                                        \u003cth>Nome\u003c/th>\n                                        \u003cth>Status\u003c/th>\n                                        \u003cth>Progresso\u003c/th>\n                                        \u003cth>Ações\u003c/th>\n                                    \u003c/tr>\n                                \u003c/thead>\n                                \u003ctbody>\n                                    \u003ctr>\n                                        \u003ctd>Sistema Web\u003c/td>\n                                        \u003ctd>\u003cspan style=\"background: #d4edda; padding: 5px 10px; border-radius: 3px; color: #155724;\">Ativo\u003c/span>\u003c/td>\n                                        \u003ctd>75%\u003c/td>\n                                        \u003ctd>\n                                            \u003cbutton class=\"btn btn-secondary btn-small\">Editar\u003c/button>\n                                            \u003cbutton class=\"btn btn-danger btn-small\">Deletar\u003c/button>\n                                        \u003c/td>\n                                    \u003c/tr>\n                                    \u003ctr>\n                                        \u003ctd>App Mobile\u003c/td>\n                                        \u003ctd>\u003cspan style=\"background: #fff3cd; padding: 5px 10px; border-radius: 3px; color: #856404;\">Planejamento\u003c/span>\u003c/td>\n                                        \u003ctd>25%\u003c/td>\n                                        \u003ctd>\n                                            \u003cbutton class=\"btn btn-secondary btn-small\">Editar\u003c/button>\n                                            \u003cbutton class=\"btn btn-danger btn-small\">Deletar\u003c/button>\n                                        \u003c/td>\n                                    \u003c/tr>\n                                \u003c/tbody>\n                            \u003c/table>\n                        \u003c/div>\n                    \u003c/div>\n                `;\n            }\n\n            static renderTarefas() {\n                return `\n                    \u003cdiv class=\"card\">\n                        \u003cdiv class=\"card-header\">\n                            \u003ch3 class=\"card-title\">✅ Tarefas\u003c/h3>\n                            \u003cbutton class=\"btn btn-primary btn-small\" onclick=\"abrirNovaTarefa()\">\n                                ➕ Nova Tarefa\n                            \u003c/button>\n                        \u003c/div>\n                        \u003cdiv class=\"table-responsive\">\n                            \u003ctable>\n                                \u003cthead>\n                                    \u003ctr>\n                                        \u003cth>Tarefa\u003c/th>\n                                        \u003cth>Projeto\u003c/th>\n                                        \u003cth>Responsável\u003c/th>\n                                        \u003cth>Status\u003c/th>\n                                    \u003c/tr>\n                                \u003c/thead>\n                                \u003ctbody>\n                                    \u003ctr>\n                                        \u003ctd>Design da interface\u003c/td>\n                                        \u003ctd>Sistema Web\u003c/td>\n                                        \u003ctd>Maria\u003c/td>\n                                        \u003ctd>\u003cspan style=\"background: #d4edda; padding: 5px 10px; border-radius: 3px; color: #155724;\">Concluída\u003c/span>\u003c/td>\n                                    \u003c/tr>\n                                    \u003ctr>\n
