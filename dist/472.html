                                      \u003ctd>Implementar autenticação\u003c/td>\n                                        \u003ctd>Sistema Web\u003c/td>\n                                        \u003ctd>João\u003c/td>\n                                        \u003ctd>\u003cspan style=\"background: #d1ecf1; padding: 5px 10px; border-radius: 3px; color: #0c5460;\">Em Progresso\u003c/span>\u003c/td>\n                                    \u003c/tr>\n                                \u003c/tbody>\n                            \u003c/table>\n                        \u003c/div>\n                    \u003c/div>\n                `;\n            }\n\n            static renderUsuarios() {\n                return `\n                    \u003cdiv class=\"card\">\n                        \u003cdiv class=\"card-header\">\n                            \u003ch3 class=\"card-title\">👥 Usuários\u003c/h3>\n                            \u003cbutton class=\"btn btn-primary btn-small\" onclick=\"abrirNovoUsuario()\">\n                                ➕ Novo Usuário\n                            \u003c/button>\n                        \u003c/div>\n                        \u003cdiv class=\"table-responsive\">\n                            \u003ctable>\n                                \u003cthead>\n                                    \u003ctr>\n                                        \u003cth>Nome\u003c/th>\n                                        \u003cth>Email\u003c/th>\n                                        \u003cth>Função\u003c/th>\n                                        \u003cth>Status\u003c/th>\n                                    \u003c/tr>\n                                \u003c/thead>\n                                \u003ctbody>\n                                    \u003ctr>\n                                        \u003ctd>João Silva\u003c/td>\n                                        \u003ctd>joao@example.com\u003c/td>\n                                        \u003ctd>Admin\u003c/td>\n                                        \u003ctd>\u003cspan style=\"background: #d4edda; padding: 5px 10px; border-radius: 3px; color: #155724;\">Ativo\u003c/span>\u003c/td>\n                                    \u003c/tr>\n                                    \u003ctr>\n                                        \u003ctd>Maria Santos\u003c/td>\n                                        \u003ctd>maria@example.com\u003c/td>\n                                        \u003ctd>Desenvolvedor\u003c/td>\n                                        \u003ctd>\u003cspan style=\"background: #d4edda; padding: 5px 10px; border-radius: 3px; color: #155724;\">Ativo\u003c/span>\u003c/td>\n                                    \u003c/tr>\n                                \u003c/tbody>\n                            \u003c/table>\n                        \u003c/div>\n                    \u003c/div>\n                `;\n            }\n\n            static renderRelatorios() {\n                return `\n                    \u003cdiv class=\"card\">\n                        \u003cdiv class=\"card-header\">\n                            \u003ch3 class=\"card-title\">📋 Relatórios\u003c/h3>\n                            \u003cbutton class=\"btn btn-primary btn-small\">📥 Exportar\u003c/button>\n                        \u003c/div>\n                        \u003cdiv class=\"card-body\">\n                            \u003ch4 style=\"margin-bottom: 15px;\">Relatório de Projetos\u003c/h4>\n                            \u003cp>\u003cstrong>Total de Projetos:\u003c/strong> 24\u003c/p>\n                            \u003cp>\u003cstrong>Projetos Ativos:\u003c/strong> 18\u003c/p>\n                            \u003cp>\u003cstrong>Taxa de Conclusão:\u003c/strong> 75%\u003c/p>\n                            \n                            \u003ch4 style=\"margin-top: 30px; margin-bottom: 15px;\">Relatório de Tarefas\u003c/h4>\n                            \u003cp>\u003cstrong>Total de Tarefas:\u003c/strong> 156\u003c/p>\n                            \u003cp>\u003cstrong>Tarefas Concluídas:\u003c/strong> 120\u003c/p>\n                            \u003cp>\u003cstrong>Tarefas Pendentes:\u003c/strong> 36\u003c/p>\n                        \u003c/div>\n                    \u003c/div>\n                `;\n            }\n\n            static renderConfiguracoes() {\n                return `\n                    \u003cdiv class=\"card\">\n                        \u003cdiv class=\"card-header\">\n                            \u003ch3 class=\"card-title\">⚙️ Configurações\u003c/h3>\n                        \u003c/div>\n                        \u003cdiv class=\"card-body\">\n                            \u003cdiv class=\"form-group\">\n                                \u003clabel>Nome da Aplicação:\u003c/label>\n                                \u003cinput type=\"text\" value=\"Sistema Profissional\" placeholder=\"Nome da app\">\n                            \u003c/div>\n                            \u003cdiv class=\"form-group\">\n                                \u003clabel>Tema:\u003c/label>\n                                \u003cselect>\n                                    \u003coption>Claro\u003c/option>\n                                    \u003coption>Escuro\u003c/option>\n                                    \u003coption>Auto\u003c/option>\n                                \u003c/select>\n                            \u003c/div>\n                            \u003cdiv class=\"form-group\">\n                                \u003clabel>Idioma:\u003c/label>\n                                \u003cselect>\n                                    \u003coption>Português\u003c/option>\n                                    \u003coption>Inglês\u003c/option>\n                                    \u003coption>Espanhol\u003c/option>\n                                \u003c/select>\n                            \u003c/div>\n                            \u003cbutton class=\"btn btn-primary\">💾 Salvar Configurações\u003c/button>\n                        \u003c/div>\n                    \u003c/div>\n\n                    \u003cdiv class=\"card\">\n                        \u003cdiv class=\"card-header\">\n                            \u003ch3 class=\"card-title\">🔗 Conexão Supabase\u003c/h3>\n                        \u003c/div>\n                        \u003cdiv class=\"card-body\">\n                            \u003cp>\u003cstrong>Status:\u003c/strong> \u003cspan id=\"statusConexao\">Desconectado\u003c/span>\u003c/p>\n                            \u003cp id=\"urlConexao\" style=\"font-size: 0.9em; color: #999;\">\u003c/p>\n                            \u003cbutton class=\"btn btn-primary\" onclick=\"abrirConexao()\">🔗 Reconectar\u003c/button>\n                            \u003cbutton class=\"btn btn-danger\" onclick=\"desconectarSupabase()\">🔌 Desconectar\u003c/button>\n                        \u003c/div>\n                    \u003c/div>\n                `;\n            }\n\n            static verificarConexao() {\n                if (CONFIG.supabase.url && CONFIG.supabase.key) {\n                    CONFIG.isConnected = true;\n                    document.getElementById('statusDot').classList.add('connected');\n                    document.getElementById('statusText').textContent = 'Conectado';\n                }\n            }\n\n            static registerServiceWorker() {\n                if ('serviceWorker' in navigator) {\n                    navigator.serviceWorker.register('data:application/javascript,' + encodeURIComponent(`\n                        self.addEventListener('install', event => {\n                            console.log('Service Worker instalado');\n                        });\n                        self.addEventListener('fetch', event => {\n                            console.log('Fetch interceptado:', event.request.url);\n                        });\n                    `)).catch(err => console.log('SW erro:', err));\n                }\n            }\n        }\n\n        // ============================================\n        // MÓDULO: SUPABASE\n        // ============================================\n        class SupabaseManager {\n            static async conectar(url, key) {\n                try {\n                    // Validar conexão\n                    const response = await fetch(`${url}/rest/v1/`, {\n                        headers: {\n                            'apikey': key,\n                            'Authorization': `Bearer ${key}`\n                        }\n                    });\n\n                    if (response.ok) {\n                        CONFIG.supabase.url = url;\n                        CONFIG.supabase.key = key;\n                        CONFIG.isConnected = true;\n\n                        localStorage.setItem('supabase_url', url);\n                        localStorage.setItem('supabase_key', key);\n\n                        document.getElementById('statusDot').classList.add('connected');\n                        document.getElementById('statusText').textContent = 'Conectado';\n\n                        mostrarAlerta('✅ Conectado ao Supabase com sucesso!', 'success');\n                        return true;\n                    }\n                } catch (error) {\n                    mostrarAlerta('❌ Erro ao conectar: ' + error.message, 'error');\n                    return false;\n                }\n            }\n\n            static desconectar() {\n                CONFIG.supabase = { url: '', key: '' };\n                CONFIG.isConnected = false;\n\n                localStorage.removeItem('supabase_url');\n                localStorage.removeItem('supabase_key');\n\n                document.getElementById('statusDot').classList.remove('connected');\n                document.getElementById('statusText').textContent = 'Desconectado';\n\n                mostrarAlerta('🔌 Desconectado do Supabase', 'info');\n            }\n\n            static async query(table, options = {}) {\n                if (!CONFIG.isConnected) {\n                    mostrarAlerta('❌ Não conectado ao Supabase', 'error');\n                    return null;\n                }\n\n                try {\n                    const url = `${CONFIG.supabase.url}/rest/v1/${table}`;\n                    const response = await fetch(url, {\n                        headers: {\n                            'apikey': CONFIG.supabase.key,\n                            'Authorization': `Bearer ${CONFIG.supabase.key}`,\n                            'Content-Type': 'application/json'\n                        },\n                        ...options\n                    });\n\n                    return await response.json();\n                } catch (error) {\n                    console.error('Erro na query:', error);\n                    return null;\n                }\n            }\n        }\n\n        // ============================================\n        // FUNÇÕES AUXILIARES\n        // ============================================\n        function abrirConexao() {\n            document.getElementById('conexaoModal').classList.add('active');\n        }\n\n        function fecharModal(modalId) {\n            document.getElementById(modalId).classList.remove('active');\n        }\n\n        function conectarSupabase() {\n            const url = document.getElementById('supabaseUrl').value;\n            const key = document.getElementById('supabaseKey').value;\n\n            if (!url || !key) {\n                mostrarAlerta('❌ Preencha todos os campos', 'error');\n                return;\n            }\n\n            SupabaseManager.conectar(url, key).then(sucesso => {\n                if (sucesso) {\n                    fecharModal('conexaoModal');\n                    document.getElementById('statusConexao').textContent = 'Conectado ✅';\n                    document.getElementById('urlConexao').textContent = `URL: ${url}`;\n                }\n            });\n        }\n\n        function desconectarSupabase() {\n            if (confirm('Desconectar do Supabase?')) {\n                SupabaseManager.desconectar();\n                document.getElementById('statusConexao').textContent = 'Desconectado ❌';\n                document.getElementById('urlConexao').textContent = '';\n            }\n        }\n\n        function mostrarAlerta(mensagem, tipo = 'info') {\n            const alertDiv = document.createElement('div');\n            alertDiv.className = `alert alert-${tipo}`;\n            alertDiv.innerHTML = `\u003cspan>${mensagem}\u003c/span>`;\n            \n            const contentArea = document.getElementById('contentArea');\n            contentArea.insertBefore(alertDiv, contentArea.firstChild);\n\n            setTimeout(() => alertDiv.remove(), 5000);\n        }\n\n        function abrirNovoProjet() {\n            mostrarAlerta('📁 Funcionalidade de novo projeto em desenvolvimento', 'info');\n        }\n\n        function abrirNovaTarefa() {\n            mostrarAlerta('✅ Funcionalidade de nova tarefa em desenvolvimento', 'info');\n        }\n\n        function abrirNovoUsuario() {\n            mostrarAlerta('👥 Funcionalidade de novo usuário em desenvolvimento', 'info');\n        }\n\n        // ============================================\n        // INICIALIZAR APP\n        // ============================================\n        document.addEventListener('DOMContentLoaded', () => {\n            App.init();\n        });\n    \u003c/script>\n\n    \u003c!-- MANIFEST.JSON EMBUTIDO -->\n    \u003cscript>\n        const manifestData = {\n            name: \"Sistema Profissional Modular\",\n            short_name: \"Sistema\",\n            description: \"Sistema profissional modular com Supabase\",\n            start_url: \"/\",\n            display: \"standalone\",\n            background_color: \"#ffffff\",\n            theme_color: \"#667eea\",\n            scope: \"/\",\n            icons: [\n                {\n                    src: \"data:image/svg+xml,\u003csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'>\u003crect fill='%23667eea' width='192' height='192'/>\u003ctext x='96' y='120' font-size='120' fill='white' text-anchor='middle' font-weight='bold'>S\u003c/text>\u003c/svg>\",\n                    sizes: \"192x192\",\n                    type: \"image/svg+xml\",\n                    purpose: \"any\"\n                }\n            ],\n            screenshots: [\n                {\n                    src: \"data:image/svg+xml,\u003csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 540 720'>\u003crect fill='%23667eea' width='540' height='720'/>\u003c/svg>\",\n                    sizes: \"540x720\",\n                    type: \"image/svg+xml\",\n                    form_factor: \"narrow\"\n                }\n            ]\n        };\n\n        // Criar blob do manifest\n        const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/manifest+json' });\n        const manifestUrl = URL.createObjectURL(manifestBlob);\n        \n        // Atualizar link no head\n        let manifestLink = document.querySelector('link[rel=\"manifest\"]');\n        if (manifestLink) {\n            manifestLink.href = manifestUrl;\n        }\n    \u003c/script>\n\u003c/body>\n\u003c/html>\n","l":"html","n":""},{"p":"projeto_4-gerador.html","t":"\u003c!DOCTYPE html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\n    \u003cmeta charset=\"UTF-8\">\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    \u003ctitle>Gerador de Estrutura de Projeto\u003c/title>\n    \u003cstyle>\n        * {\n            margin: 0;\n            padding: 0;\n            box-sizing: border-box;\n        }\n\n        body {\n            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;\n            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);\n            min-height: 100vh;\n            padding: 20px;\n        }\n\n        .container {\n            max-width: 1600px;\n            margin: 0 auto;\n            background: white;\n            border-radius: 10px;\n            box-shadow: 0 20px 60px rgba(0,0,0,0.3);\n            overflow: hidden;\n        }\n\n        header {\n            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);\n            color: white;\n            padding: 30px;\n            text-align: center;\n        }\n\n        header h1 {\n            font-size: 2.5em;\n            margin-bottom: 10px;\n        }\n\n        header p {\n            font-size: 1.1em;\n            opacity: 0.9;\n        }\n\n        .main-grid {\n            display: grid;\n            grid-template-columns: 1fr 1fr;\n            gap: 20px;\n            padding: 30px;\n        }\n\n        .panel {\n            background: #f8f9fa;\n            border-radius: 8px;\n            padding: 20px;\n            border: 2px solid #e9ecef;\n        }\n\n        .panel h2 {\n            color: #667eea;\n            margin-bottom: 15px;\n            font-size: 1.5em;\n            border-bottom: 2px solid #667eea;\n            padding-bottom: 10px;\n        }\n\n        .upload-area {\n            border: 3px dashed #667eea;\n            border-radius: 8px;\n            padding: 30px;\n            text-align: center;\n            cursor: pointer;\n            transition: all 0.3s;\n            background: rgba(102, 126, 234, 0.05);\n        }\n\n        .upload-area:hover {\n            background: rgba(102, 126, 234, 0.1);\n            border-color: #764ba2;\n        }\n\n        .upload-area.dragover {\n            background: rgba(102, 126, 234, 0.2);\n            border-color: #764ba2;\n            transform: scale(1.02);\n        }\n\n        .upload-area input[type=\"file\"] {\n            display: none;\n        }\n\n        .upload-icon {\n            font-size: 3em;\n            margin-bottom: 10px;\n        }\n\n        .upload-text {\n            color: #666;\n            margin-bottom: 10px;\n        }\n\n        .upload-hint {\n            font-size: 0.9em;\n            color: #999;\n        }\n\n        button {\n            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);\n            color: white;\n            border: none;\n            padding: 12px 24px;\n            border-radius: 5px;\n            cursor: pointer;\n            font-size: 1em;\n            font-weight: 600;\n            transition: all 0.3s;\n            margin: 5px;\n        }\n\n        button:hover {\n            transform: translateY(-2px);\n            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);\n        }\n\n        .btn-secondary {\n            background: #6c757d;\n        }\n\n        .btn-success {\n            background: #28a745;\n        }\n\n        .btn-danger {\n            background: #dc3545;\n        }\n\n        .btn-info {\n            background: #17a2b8;\n        }\n\n        .tabs {\n            display: flex;\n            gap: 10px;\n            margin-bottom: 20px;\n            border-bottom: 2px solid #ddd;\n            flex-wrap: wrap;\n        }\n\n        .tab-btn {\n            background: #e9ecef;\n            color: #333;\n            border: none;\n            padding: 10px 20px;\n            cursor: pointer;\n            border-radius: 5px 5px 0 0;\n            font-weight: 600;\n            transition: all 0.3s;\n        }\n\n        .tab-btn.active {\n            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);\n            color: white;\n        }\n\n        .tab-content {\n            display: none;\n        }\n\n        .tab-content.active {\n            display: block;\n        }\n\n        .code-block {\n            background: #1e1e1e;\n            color: #d4d4d4;\n            padding: 20px;\n            border-radius: 5px;\n            font-family: 'Courier New', monospace;\n            font-size: 0.85em;\n            max-height: 400px;\n            overflow-y: auto;\n            line-height: 1.5;\n            white-space: pre-wrap;\n            word-wrap: break-word;\n            margin-bottom: 15px;\n            position: relative;\n        }\n\n        .copy-btn {\n            position: absolute;\n            top: 10px;\n            right: 10px;\n            padding: 8px 12px;\n            font-size: 0.8em;\n            background: #667eea;\n        }\n\n        .structure-tree {\n            background: white;\n            padding: 15px;\n            border-radius: 5px;\n            border: 1px solid #ddd;\n            font-family: 'Courier New', monospace;\n            font-size: 0.9em;\n            max-height: 500px;\n            overflow-y: auto;\n            line-height: 1.6;\n        }\n\n        .tree-item {\n            margin-left: 20px;\n            color: #333;\n        }\n\n        .tree-folder {\n            color: #667eea;\n            font-weight: 600;\n        }\n\n        .tree-file {\n            color: #764ba2;\n        }\n\n        .dependency-list {\n            list-style: none;\n            margin-top: 15px;\n        }\n\n        .dependency-item {\n            background: white;\n            padding: 12px;\n            margin-bottom: 10px;\n            border-radius: 5px;\n            border-left: 4px solid #667eea;\n            display: flex;\n            justify-content: space-between;\n            align-items: center;\n        }\n\n        .dep-name {\n            font-weight: 600;\n            color: #333;\n        }\n\n        .dep-version {\n            background: #e9ecef;\n            padding: 4px 8px;\n            border-radius: 3px;\n            font-size: 0.85em;\n            color: #666;\n        }\n\n        .dep-description {\n            font-size: 0.85em;\n            color: #999;\n            margin-top: 5px;\n        }\n\n        .alert {\n            padding: 15px;\n            border-radius: 5px;\n            margin-bottom: 15px;\n            border-left: 4px solid;\n        }\n\n        .alert-info {\n            background: #d1ecf1;\n            color: #0c5460;\n            border-left-color: #0c5460;\n        }\n\n        .alert-success {\n            background: #d4edda;\n            color: #155724;\n            border-left-color: #155724;\n        }\n\n        .alert-error {\n            background: #f8d7da;\n            color: #721c24;\n            border-left-color: #721c24;\n        }\n\n        .alert-warning {\n            background: #fff3cd;\n            color: #856404;\n            border-left-color: #856404;\n        }\n\n        .form-group {\n            margin-bottom: 15px;\n        }\n\n        .form-group label {\n            display: block;\n            margin-bottom: 8px;\n            font-weight: 600;\n            color: #333;\n        }\n\n        .form-group input,\n        .form-group select,\n        .form-group textarea {\n            width: 100%;\n            padding: 10px;\n            border: 1px solid #ddd;\n            border-radius: 5px;\n            font-size: 0.95em;\n        }\n\n        .form-group textarea {\n            min-height: 100px;\n            resize: vertical;\n        }\n\n        .checkbox-group {\n            display: flex;\n            flex-wrap: wrap;\n            gap: 15px;\n            margin-top: 10px;\n        }\n\n        .checkbox-item {\n            display: flex;\n            align-items: center;\n        }\n\n        .checkbox-item input[type=\"checkbox\"] {\n            width: auto;\n            margin-right: 8px;\n            cursor: pointer;\n        }\n\n        .checkbox-item label {\n            margin: 0;\n            cursor: pointer;\n            font-weight: normal;\n        }\n\n        .full-width {\n            grid-column: 1 / -1;\n        }\n\n        .stats-grid {\n            display: grid;\n            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));\n            gap: 15px;\n            margin-bottom: 20px;\n        }\n\n        .stat-card {\n            background: white;\n            padding: 20px;\n            border-radius: 5px;\n            text-align: center;\n            border: 2px solid #e9ecef;\n        }\n\n        .stat-number {\n            font-size: 2em;\n            font-weight: bold;\n            color: #667eea;\n        }\n\n        .stat-label {\n            color: #666;\n            font-size: 0.9em;\n            margin-top: 5px;\n        }\n\n        .monorepo-section {\n            background: white;\n            padding: 15px;\n            border-radius: 5px;\n            border: 2px dashed #667eea;\n            margin-bottom: 15px;\n        }\n\n        .monorepo-section h4 {\n            color: #667eea;\n            margin-bottom: 10px;\n        }\n\n        @media (max-width: 1200px) {\n            .main-grid {\n                grid-template-columns: 1fr;\n            }\n\n            .full-width {\n                grid-column: 1;\n            }\n        }\n\n        .scrollbar::-webkit-scrollbar {\n            width: 8px;\n        }\n\n        .scrollbar::-webkit-scrollbar-track {\n            background: #f1f1f1;\n        }\n\n        .scrollbar::-webkit-scrollbar-thumb {\n            background: #667eea;\n            border-radius: 4px;\n        }\n    \u003c/style>\n\u003c/head>\n\u003cbody>\n    \u003cdiv class=\"container\">\n        \u003cheader>\n            \u003ch1>🏗️ Gerador de Estrutura de Projeto\u003c/h1>\n            \u003cp>Analisa ZIP, gera package.json limpo, scripts .bat e configurações\u003c/p>\n        \u003c/header>\n\n        \u003cdiv class=\"main-grid\">\n            \u003c!-- Painel 1: Upload -->\n            \u003cdiv class=\"panel\">\n                \u003ch2>📦 Upload do Projeto\u003c/h2>\n                \u003cdiv class=\"upload-area\" id=\"uploadArea\">\n                    \u003cdiv class=\"upload-icon\">📁\u003c/div>\n                    \u003cdiv class=\"upload-text\">Arraste seu arquivo ZIP aqui\u003c/div>\n                    \u003cdiv class=\"upload-hint\">ou clique para selecionar\u003c/div>\n                    \u003cinput type=\"file\" id=\"fileInput\" accept=\".zip\">\n                \u003c/div>\n                \u003cdiv id=\"uploadStatus\" style=\"margin-top: 15px;\">\u003c/div>\n            \u003c/div>\n\n            \u003c!-- Painel 2: Configurações -->\n            \u003cdiv class=\"panel\">\n                \u003ch2>⚙️ Configurações do Projeto\u003c/h2>\n                \n                \u003cdiv class=\"form-group\">\n                    \u003clabel for=\"projectName\">Nome do Projeto:\u003c/label>\n                    \u003cinput type=\"text\" id=\"projectName\" placeholder=\"meu-projeto\">\n                \u003c/div>\n\n                \u003cdiv class=\"form-group\">\n                    \u003clabel for=\"projectVersion\">Versão Inicial:\u003c/label>\n                    \u003cinput type=\"text\" id=\"projectVersion\" value=\"1.0.0\" placeholder=\"1.0.0\">\n                \u003c/div>\n\n                \u003cdiv class=\"form-group\">\n                    \u003clabel for=\"projectType\">Tipo de Projeto:\u003c/label>\n                    \u003cselect id=\"projectType\">\n                        \u003coption value=\"web\">Web (HTML/CSS/JS)\u003c/option>\n                        \u003coption value=\"react\">React\u003c/option>\n                        \u003coption value=\"vue\">Vue.js\u003c/option>\n                        \u003coption value=\"angular\">Angular\u003c/option>\n                        \u003coption value=\"node\">Node.js\u003c/option>\n                        \u003coption value=\"monorepo\">Monorepo\u003c/option>\n                    \u003c/select>\n                \u003c/div>\n\n                \u003cdiv class=\"form-group\">\n                    \u003clabel>Ferramentas Adicionais:\u003c/label>\n                    \u003cdiv class=\"checkbox-group\">\n                        \u003cdiv class=\"checkbox-item\">\n                            \u003cinput type=\"checkbox\" id=\"useVite\" checked>\n                            \u003clabel for=\"useVite\">Vite\u003c/label>\n                        \u003c/div>\n                        \u003cdiv class=\"checkbox-item\">\n                            \u003cinput type=\"checkbox\" id=\"useSW\">\n                            \u003clabel for=\"useSW\">Service Worker\u003c/label>\n                        \u003c/div>\n                        \u003cdiv class=\"checkbox-item\">\n                            \u003cinput type=\"checkbox\" id=\"useManifest\">\n                            \u003clabel for=\"useManifest\">Manifest.json\u003c/label>\n                        \u003c/div>\n                        \u003cdiv class=\"checkbox-item\">\n                            \u003cinput type=\"checkbox\" id=\"useESLint\">\n                            \u003clabel for=\"useESLint\">ESLint\u003c/label>\n                        \u003c/div>\n                        \u003cdiv class=\"checkbox-item\">\n                            \u003cinput type=\"checkbox\" id=\"usePrettier\">\n                            \u003clabel for=\"usePrettier\">Prettier\u003c/label>\n                        \u003c/div>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003cbutton onclick=\"analisarProjeto()\" style=\"width: 100%; margin-top: 20px;\">\n                    🔍 Analisar Projeto\n                \u003c/button>\n            \u003c/div>\n\n            \u003c!-- Painel 3: Resultados -->\n            \u003cdiv class=\"panel full-width\">\n                \u003ch2>📊 Análise do Projeto\u003c/h2>\n                \n                \u003cdiv class=\"tabs\">\n                    \u003cbutton class=\"tab-btn active\" onclick=\"mudarAba('estrutura')\">🗂️ Estrutura\u003c/button>\n                    \u003cbutton class=\"tab-btn\" onclick=\"mudarAba('dependencias')\">📚 Dependências\u003c/button>\n                    \u003cbutton class=\"tab-btn\" onclick=\"mudarAba('packagejson')\">📋 package.json\u003c/button>\n                    \u003cbutton class=\"tab-btn\" onclick=\"mudarAba('scripts')\">⚡ Scripts\u003c/button>\n                    \u003cbutton class=\"tab-btn\" onclick=\"mudarAba('configuracoes')\">🔧 Configurações\u003c/button>\n                    \u003cbutton class=\"tab-btn\" onclick=\"mudarAba('bat')\">🖥️ Arquivo .bat\u003c/button>\n                \u003c/div>\n\n                \u003c!-- Aba Estrutura -->\n                \u003cdiv id=\"estrutura\" class=\"tab-content active\">\n                    \u003cdiv class=\"stats-grid\" id=\"statsContainer\">\u003c/div>\n                    \u003ch3 style=\"color: #667eea; margin-bottom: 15px;\">Estrutura de Diretórios\u003c/h3>\n                    \u003cdiv class=\"structure-tree scrollbar\" id=\"estruturaOutput\">\n                        Aguardando análise...\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Aba Dependências -->\n                \u003cdiv id=\"dependencias\" class=\"tab-content\">\n                    \u003ch3 style=\"color: #667eea; margin-bottom: 15px;\">Dependências Detectadas\u003c/h3>\n                    \u003cdiv id=\"dependenciasOutput\">\n                        \u003cp style=\"color: #999; text-align: center; padding: 40px;\">\n                            Nenhuma dependência detectada ainda\n                        \u003c/p>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Aba package.json -->\n                \u003cdiv id=\"packagejson\" class=\"tab-content\">\n                    \u003ch3 style=\"color: #667eea; margin-bottom: 15px;\">package.json Gerado\u003c/h3>\n                    \u003cdiv class=\"code-block\" id=\"packageJsonOutput\">\n{\n  \"name\": \"seu-projeto\",\n  \"version\": \"1.0.0\",\n  \"description\": \"Projeto gerado automaticamente\",\n  \"main\": \"index.js\",\n  \"scripts\": {},\n  \"dependencies\": {},\n  \"devDependencies\": {}\n}\n                    \u003c/div>\n                    \u003cbutton class=\"btn-success\" onclick=\"copiarParaClipboard('packageJsonOutput')\">\n                        📋 Copiar JSON\n                    \u003c/button>\n                    \u003cbutton class=\"btn-success\" onclick=\"baixarPackageJson()\">\n                        📥 Baixar package.json\n                    \u003c/button>\n                \u003c/div>\n\n                \u003c!-- Aba Scripts -->\n                \u003cdiv id=\"scripts\" class=\"tab-content\">\n                    \u003ch3 style=\"color: #667eea; margin-bottom: 15px;\">Scripts NPM Gerados\u003c/h3>\n                    \u003cdiv class=\"code-block\" id=\"scriptsOutput\">\nnpm run dev       # Inicia servidor de desenvolvimento\nnpm run build     # Constrói para produção\nnpm run preview   # Visualiza build de produção\nnpm run test      # Executa testes\n                    \u003c/div>\n                    \u003cbutton class=\"btn-success\" onclick=\"copiarParaClipboard('scriptsOutput')\">\n                        📋 Copiar Scripts\n                    \u003c/button>\n                \u003c/div>\n\n                \u003c!-- Aba Configurações -->\n                \u003cdiv id=\"configuracoes\" class=\"tab-content\">\n                    \u003cdiv class=\"tabs\" style=\"margin-bottom: 20px;\">\n                        \u003cbutton class=\"tab-btn active\" onclick=\"mudarConfiguracao('vite')\">Vite\u003c/button>\n                        \u003cbutton class=\"tab-btn\" onclick=\"mudarConfiguracao('manifest')\">Manifest\u003c/button>\n                        \u003cbutton class=\"tab-btn\" onclick=\"mudarConfiguracao('sw')\">Service Worker\u003c/button>\n                        \u003cbutton class=\"tab-btn\" onclick=\"mudarConfiguracao('eslint')\">ESLint\u003c/button>\n                    \u003c/div>\n\n                    \u003cdiv id=\"vite\" class=\"tab-content active\">\n                        \u003ch4 style=\"color: #667eea; margin-bottom: 10px;\">vite.config.js\u003c/h4>\n                        \u003cdiv class=\"code-block\" id=\"viteConfigOutput\">\nimport { defineConfig } from 'vite'\nimport react from '@vitejs/plugin-react'\n\nexport default defineConfig({\n  plugins: [react()],\n  server: {\n    port: 3000,\n    open: true\n  },\n  build: {\n    outDir: 'dist',\n    sourcemap: false\n  }\n})\n                        \u003c/div>\n                        \u003cbutton class=\"btn-success\" onclick=\"copiarParaClipboard('viteConfigOutput')\">\n                            📋 Copiar\n                        \u003c/button>\n                        \u003cbutton class=\"btn-success\" onclick=\"baixarArquivo('vite.config.js', document.getElementById('viteConfigOutput').textContent)\">\n                            📥 Baixar\n                        \u003c/button>\n                    \u003c/div>\n\n                    \u003cdiv id=\"manifest\" class=\"tab-content\">\n                        \u003ch4 style=\"color: #667eea; margin-bottom: 10px;\">manifest.json\u003c/h4>\n                        \u003cdiv class=\"code-block\" id=\"manifestOutput\">\n{\n  \"name\": \"Meu Aplicativo\",\n  \"short_name\": \"App\",\n  \"description\": \"Descrição do aplicativo\",\n  \"start_url\": \"/\",\n  \"display\": \"standalone\",\n  \"background_color\": \"#ffffff\",\n  \"theme_color\": \"#667eea\",\n  \"icons\": [\n    {\n      \"src\": \"/icon-192x192.png\",\n      \"sizes\": \"192x192\",\n      \"type\": \"image/png\"\n    }\n  ]\n}\n                        \u003c/div>\n                        \u003cbutton class=\"btn-success\" onclick=\"copiarParaClipboard('manifestOutput')\">\n                            📋 Copiar\n                        \u003c/button>\n                        \u003cbutton class=\"btn-success\" onclick=\"baixarArquivo('manifest.json', document.getElementById('manifestOutput').textContent)\">\n                            📥 Baixar\n                        \u003c/button>\n                    \u003c/div>\n\n                    \u003cdiv id=\"sw\" class=\"tab-content\">\n                        \u003ch4 style=\"color: #667eea; margin-bottom: 10px;\">service-worker.js\u003c/h4>\n                        \u003cdiv class=\"code-block\" id=\"swOutput\">\nconst CACHE_NAME = 'v1'\nconst urlsToCache = [\n  '/',\n  '/index.html',\n  '/styles/main.css',\n  '/scripts/main.js'\n]\n\nself.addEventListener('install', event => {\n  event.waitUntil(\n    caches.open(CACHE_NAME)\n      .then(cache => cache.addAll(urlsToCache))\n  )\n})\n\nself.addEventListener('fetch', event => {\n  event.respondWith(\n    caches.match(event.request)\n      .then(response => response || fetch(event.request))\n  )\n})\n                        \u003c/div>\n                        \u003cbutton class=\"btn-success\" onclick=\"copiarParaClipboard('swOutput')\">\n                            📋 Copiar\n                        \u003c/button>\n                        \u003cbutton class=\"btn-success\" onclick=\"baixarArquivo('service-worker.js', document.getElementById('swOutput').textContent)\">\n                            📥 Baixar\n                        \u003c/button>\n                    \u003c/div>\n\n                    \u003cdiv id=\"eslint\" class=\"tab-content\">\n                        \u003ch4 style=\"color: #667eea; margin-bottom: 10px;\">.eslintrc.json\u003c/h4>\n                        \u003cdiv class=\"code-block\" id=\"eslintOutput\">\n{\n  \"env\": {\n    \"browser\": true,\n    \"es2021\": true,\n    \"node\": true\n  },\n  \"extends\": [\"eslint:recommended\"],\n  \"parserOptions\": {\n    \"ecmaVersion\": \"latest\",\n    \"sourceType\": \"module\"\n  },\n  \"rules\": {\n    \"no-unused-vars\": \"warn\",\n    \"no-console\": \"warn\"\n  }\n}\n                        \u003c/div>\n                        \u003cbutton class=\"btn-success\" onclick=\"copiarParaClipboard('eslintOutput')\">\n                            📋 Copiar\n                        \u003c/button>\n                        \u003cbutton class=\"btn-success\" onclick=\"baixarArquivo('.eslintrc.json', document.getElementById('eslintOutput').textContent)\">\n                            📥 Baixar\n                        \u003c/button>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Aba .bat -->\n                \u003cdiv id=\"bat\" class=\"tab-content\">\n                    \u003cdiv class=\"alert alert-info\">\n                        \u003cstrong>💡 Dica:\u003c/strong> Este arquivo .bat cria a estrutura completa do projeto e instala dependências\n                    \u003c/div>\n                    \u003ch3 style=\"color: #667eea; margin-bottom: 15px;\">criar-projeto.bat\u003c/h3>\n                    \u003cdiv class=\"code-block\" id=\"batOutput\">\n@echo off\nREM Gerador de Projeto - Criado automaticamente\nREM Este script cria a estrutura do projeto e instala dependências\n\nsetlocal enabledelayedexpansion\n\necho ========================================\necho Criando estrutura do projeto...\necho ========================================\n\nREM Criar diretórios\nmkdir src\nmkdir public\nmkdir dist\nmkdir node_modules\n\nREM Criar arquivos principais\necho. > .gitignore\necho. > README.md\n\nREM Instalar dependências\necho.\necho Instalando dependências NPM...\ncall npm install\n\necho.\necho ========================================\necho Projeto criado com sucesso!\necho ========================================\necho.\necho Comandos disponíveis:\necho - npm run dev     : Inicia servidor de desenvolvimento\necho - npm run build   : Constrói para produção\necho - npm run test    : Executa testes\necho.\npause\n                    \u003c/div>\n                    \u003cbutton class=\"btn-success\" onclick=\"copiarParaClipboard('batOutput')\">\n                        📋 Copiar Script\n                    \u003c/button>\n                    \u003cbutton class=\"btn-success\" onclick=\"baixarArquivo('criar-projeto.bat', document.getElementById('batOutput').textContent)\">\n                        📥 Baixar .bat\n                    \u003c/button>\n                    \u003cbutton class=\"btn-info\" onclick=\"gerarBatAvancado()\">\n                        🚀 Gerar .bat Avançado\n                    \u003c/button>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Painel 4: Monorepo -->\n            \u003cdiv class=\"panel full-width\" id=\"monorepoPanel\" style=\"display: none;\">\n                \u003ch2>🏢 Configuração Monorepo\u003c/h2>\n                \u003cdiv id=\"monorepoConfig\">\u003c/div>\n            \u003c/div>\n\n            \u003c!-- Painel 5: Download -->\n            \u003cdiv class=\"panel full-width\">\n                \u003ch2>📥 Baixar Tudo\u003c/h2>\n                \u003cdiv style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;\">\n                    \u003cbutton class=\"btn-success\" onclick=\"baixarTudo()\">\n                        📦 Baixar Projeto Completo (.zip)\n                    \u003c/button>\n                    \u003cbutton class=\"btn-success\" onclick=\"gerarRelatorio()\">\n                        📄 Gerar Relatório\n                    \u003c/button>\n                    \u003cbutton class=\"btn-secondary\" onclick=\"limparTudo()\">\n                        🗑️ Limpar Tudo\n                    \u003c/button>\n                \u003c/div>\n            \u003c/div>\n        \u003c/div>\n    \u003c/div>\n\n    \u003c!-- Biblioteca JSZip para manipular ZIP -->\n    \u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js\">\u003c/script>\n\n    \u003cscript>\n        // Estado global\n        let estadoGlobal = {\n            projeto: null,\n            estrutura: {},\n            dependencias: {},\n            packageJson: {},\n            scripts: {},\n            configuracoes: {}\n        };\n\n        // Dicionário de dependências com descrição em português\n        const descricaoDependencias = {\n            'react': 'Biblioteca JavaScript para construir interfaces de usuário com componentes reutilizáv státicos',\n            'railway': 'Plataforma de hospedagem moderna',\n            'render': 'Plataforma de hospedagem em nuvem',\n            'fly': 'Plataforma de hospedagem de aplicações',\n            'docker': 'Containerização de aplicações',\n            'kubernetes': 'Orquestração de containers',\n            'terraform': 'Infraestrutura como código',\n            'ansible': 'Automação de infraestrutura',\n            'vagrant': 'Ferramenta para criar ambientes de desenvolvimento',\n            'git': 'Sistema de controle de versão',\n            'github': 'Plataforma de hospedagem de repositórios Git',\n            'gitlab': 'Plataforma de hospedagem de repositórios Git',\n            'bitbucket': 'Plataforma de hospedagem de repositórios Git',\n            'gitea': 'Serviço Git auto-hospedado',\n            'jenkins': 'Servidor de automação para CI/CD',\n            'gitlab-ci': 'Integração contínua do GitLab',\n            'github-actions': 'Automação do GitHub',\n            'circleci': 'Plataforma de CI/CD',\n            'travis-ci': 'Serviço de integração contínua',\n            'appveyor': 'CI/CD para Windows',\n            'codecov': 'Cobertura de testes',\n            'coveralls': 'Serviço de cobertura de código',\n            'sonarqube': 'Análise de qualidade de código',\n            'codeclimate': 'Análise de qualidade de código',\n            'dependabot': 'Automação de atualizações de dependências',\n            'renovate': 'Automação de atualizações de dependências',\n            'snyk': 'Segurança de dependências e vulnerabilidades',\n            'npm-audit': 'Auditoria de segurança de pacotes NPM',\n            'yarn': 'Gerenciador de pacotes alternativo ao NPM',\n            'pnpm': 'Gerenciador de pacotes rápido e eficiente',\n            'bun': 'Runtime JavaScript rápido e moderno',\n            'deno': 'Runtime JavaScript/TypeScript seguro',\n            'node': 'Runtime JavaScript para servidor',\n            'electron': 'Framework para criar aplicações desktop',\n            'tauri': 'Framework leve para aplicações desktop',\n            'nwjs': 'Framework para aplicações desktop com Node.js',\n            'react-native': 'Framework para aplicações mobile',\n            'flutter': 'Framework para aplicações mobile (Dart)',\n            'ionic': 'Framework para aplicações mobile híbridas',\n            'cordova': 'Framework para aplicações mobile híbridas',\n            'expo': 'Plataforma para desenvolvimento React Native',\n            'capacitor': 'Framework para aplicações web em mobile',\n            'webview': 'Componente para renderizar web em aplicações native'\n        };\n\n        // Setup drag and drop\n        const uploadArea = document.getElementById('uploadArea');\n        const fileInput = document.getElementById('fileInput');\n\n        uploadArea.addEventListener('click', () => fileInput.click());\n\n        uploadArea.addEventListener('dragover', (e) => {\n            e.preventDefault();\n            uploadArea.classList.add('dragover');\n        });\n\n        uploadArea.addEventListener('dragleave', () => {\n            uploadArea.classList.remove('dragover');\n        });\n\n        uploadArea.addEventListener('drop', (e) => {\n            e.preventDefault();\n            uploadArea.classList.remove('dragover');\n            const files = e.dataTransfer.files;\n            if (files.length > 0) {\n                fileInput.files = files;\n                processarZip(files[0]);\n            }\n        });\n\n        fileInput.addEventListener('change', (e) => {\n            if (e.target.files.length > 0) {\n                processarZip(e.target.files[0]);\n            }\n        });\n\n        // Processar arquivo ZIP\n        async function processarZip(file) {\n            try {\n                const zip = new JSZip();\n                const conteudo = await zip.loadAsync(file);\n                \n                const estrutura = {};\n                const dependencias = {};\n                let packageJsonContent = null;\n\n                // Analisar conteúdo do ZIP\n                conteudo.forEach((relativePath, zipEntry) => {\n                    if (relativePath.includes('package.json')) {\n                        zipEntry.async('string').then(content => {\n                            packageJsonContent = JSON.parse(content);\n                            extrairDependencias(packageJsonContent, dependencias);\n                        });\n                    }\n                    \n                    // Construir árvore de diretórios\n                    const partes = relativePath.split('/');\n                    let atual = estrutura;\n                    partes.forEach((parte, index) => {\n                        if (parte) {\n                            if (!atual[parte]) {\n                                atual[parte] = {};\n                            }\n                            if (index === partes.length - 1) {\n                                atual[parte]._arquivo = true;\n                            }\n                            atual = atual[parte];\n                        }\n                    });\n                });\n\n                estadoGlobal.estrutura = estrutura;\n                estadoGlobal.dependencias = dependencias;\n                estadoGlobal.packageJson = packageJsonContent || {};\n\n                exibirEstrutura();\n                exibirDependencias();\n                gerarPackageJson();\n                gerarScripts();\n                gerarConfiguracoes();\n                gerarBat();\n\n                document.getElementById('uploadStatus').innerHTML = \n                    '\u003cdiv class=\"alert alert-success\">✅ Projeto analisado com sucesso!\u003c/div>';\n\n            } catch (error) {\n                document.getElementById('uploadStatus').innerHTML = \n                    `\u003cdiv class=\"alert alert-error\">❌ Erro ao processar ZIP: ${error.message}\u003c/div>`;\n            }\n        }\n\n        // Extrair dependências\n        function extrairDependencias(packageJson, dependencias) {\n            const deps = { ...packageJson.dependencies, ...packageJson.devDependencies };\n            Object.entries(deps).forEach(([nome, versao]) => {\n                dependencias[nome] = versao;\n            });\n        }\n\n        // Exibir estrutura\n        function exibirEstrutura() {\n            let html = renderizarArvore(estadoGlobal.estrutura, '');\n            document.getElementById('estruturaOutput').innerHTML = html;\n\n            // Atualizar estatísticas\n            const stats = calcularEstatisticas();\n            document.getElementById('statsContainer').innerHTML = `\n                \u003cdiv class=\"stat-card\">\n                    \u003cdiv class=\"stat-number\">${stats.arquivos}\u003c/div>\n                    \u003cdiv class=\"stat-label\">Arquivos\u003c/div>\n                \u003c/div>\n                \u003cdiv class=\"stat-card\">\n                    \u003cdiv class=\"stat-number\">${stats.pastas}\u003c/div>\n                    \u003cdiv class=\"stat-label\">Pastas\u003c/div>\n                \u003c/div>\n                \u003cdiv class=\"stat-card\">\n                    \u003cdiv class=\"stat-number\">${stats.dependencias}\u003c/div>\n                    \u003cdiv class=\"stat-label\">Dependências\u003c/div>\n                \u003c/div>\n            `;\n        }\n\n        // Renderizar árvore de diretórios\n        function renderizarArvore(obj, prefix = '') {\n            let html = '';\n            Object.entries(obj).forEach(([chave, valor]) => {\n                if (chave === '_arquivo') return;\n                \n                const isArquivo = valor._arquivo;\n                const classe = isArquivo ? 'tree-file' : 'tree-folder';\n                const icon = isArquivo ? '📄' : '📁';\n                \n                html += `\u003cdiv class=\"tree-item\">\u003cspan class=\"${classe}\">${icon} ${chave}\u003c/span>`;\n                \n                if (!isArquivo && Object.keys(valor).length > 0) {\n                    html += renderizarArvore(valor, prefix + '  ');\n                }\n                html += '\u003c/div>';\n            });\n            return html;\n        }\n\n        // Calcular estatísticas\n        function calcularEstatisticas() {\n            let arquivos = 0, pastas = 0;\n            \n            function contar(obj) {\n                Object.entries(obj).forEach(([chave, valor]) => {\n                    if (chave === '_arquivo') return;\n                    if (valor._arquivo) {\n                        arquivos++;\n                    } else {\n                        pastas++;\n                        contar(valor);\n                    }\n                });\n            }\n            \n            contar(estadoGlobal.estrutura);\n            return { \n                arquivos, \n                pastas, \n                dependencias: Object.keys(estadoGlobal.dependencias).length \n            };\n        }\n\n        // Exibir dependências\n        function exibirDependencias() {\n            let html = '\u003cul class=\"dependency-list\">';\n            \n            Object.entries(estadoGlobal.dependencias).forEach(([nome, versao]) => {\n                const descricao = descricaoDependencias[nome] || 'Dependência do projeto';\n                html += `\n                    \u003cli class=\"dependency-item\">\n                        \u003cdiv>\n                            \u003cdiv class=\"dep-name\">📦 ${nome}\u003c/div>\n                            \u003cdiv class=\"dep-description\">${descricao}\u003c/div>\n                        \u003c/div>\n                        \u003cdiv class=\"dep-version\">${versao}\u003c/div>\n                    \u003c/li>\n                `;\n            });\n            \n            html += '\u003c/ul>';\n            document.getElementById('dependenciasOutput').innerHTML = html || \n                '\u003cp style=\"color: #999; text-align: center; padding: 40px;\">Nenhuma dependência detectada\u003c/p>';\n        }\n\n        // Gerar package.json\n        function gerarPackageJson() {\n            const projectName = document.getElementById('projectName').value || 'meu-projeto';\n            const projectVersion = document.getElementById('projectVersion').value || '1.0.0';\n\n            const packageJson = {\n                name: projectName,\n                version: projectVersion,\n                description: \"Projeto gerado automaticamente\",\n                main: \"index.js\",\n                scripts: {\n                    \"dev\": \"vite\",\n                    \"build\": \"vite build\",\n                    \"preview\": \"vite preview\",\n                    \"test\": \"vitest\"\n                },\n                dependencies: estadoGlobal.dependencias,\n                devDependencies: {\n                    \"vite\": \"^4.0.0\",\n                    \"vitest\": \"^0.34.0\"\n                }\n            };\n\n            estadoGlobal.packageJson = packageJson;\n            document.getElementById('packageJsonOutput').textContent = JSON.stringify(packageJson, null, 2);\n        }\n\n        // Gerar scripts\n        function gerarScripts() {\n            const projectType = document.getElementById('projectType').value;\n            let scripts = `npm run dev       # Inicia servidor de desenvolvimento\nnpm run build     # Constrói para produção\nnpm run preview   # Visualiza build de produção\nnpm run test      # Executa testes`;\n\n            if (projectType === 'react') {\n                scripts += `\nnpm run lint      # Verifica erros de código\nnpm run format    # Formata código`;\n            }\n\n            document.getElementById('scriptsOutput').textContent = scripts;\n        }\n\n        // Gerar configurações\n        function gerarConfiguracoes() {\n            const projectType = document.getElementById('projectType').value;\n\n            // Vite config\n            let viteConfig = `import { defineConfig } from 'vite'\nimport react from '@vitejs/plugin-react'\n\nexport default defineConfig({\n  plugins: [react()],\n  server: {\n    port: 3000,\n    open: true\n  },\n  build: {\n    outDir: 'dist',\n    sourcemap: false\n  }\n})`;\n\n            if (projectType === 'vue') {\n                viteConfig = viteConfig.replace('react', 'vue').replace('@vitejs/plugin-react', '@vitejs/plugin-vue');\n            }\n\n            document.getElementById('viteConfigOutput').textContent = viteConfig;\n        }\n\n        // Gerar arquivo .bat\n        function gerarBat() {\n            const projectName = document.getElementById('projectName').value || 'meu-projeto';\n            const projectType = document.getElementById('projectType').value;\n            const useVite = document.getElementById('useVite').checked;\n            const useSW = document.getElementById('useSW').checked;\n            const useManifest = document.getElementById('useManifest').checked;\n\n            let batContent = `@echo off\nREM Gerador de Projeto: ${projectName}\nREM Tipo: ${projectType}\nREM Data: ${new Date().toLocaleString('pt-BR')}\n\nsetlocal enabledelayedexpansion\n\necho ========================================\necho Criando estrutura do projeto: ${projectName}\necho ========================================\necho.\n\nREM Criar diretórios principais\necho Criando diretórios...\nmkdir src\nmkdir public\nmkdir dist\nmkdir tests\n\nREM Criar subdiretórios\nmkdir src\\\\components\nmkdir src\\\\pages\nmkdir src\\\\styles\nmkdir src\\\\utils\nmkdir public\\\\images\nmkdir public\\\\icons\n\nREM Criar arquivos principais\necho Criando arquivos...\n(\n  echo {\n  echo   \"name\": \"${projectName}\",\n  echo   \"version\": \"1.0.0\",\n  echo   \"description\": \"Projeto ${projectType}\",\n  echo   \"scripts\": {\n  echo     \"dev\": \"vite\",\n  echo     \"build\": \"vite build\",\n  echo     \"preview\": \"vite preview\"\n  echo   }\n  echo }\n) > package.json\n\necho. > .gitignore\necho node_modules/ >> .gitignore\necho dist/ >> .gitignore\necho .env >> .gitignore\n\necho. > README.md\necho # ${projectName} >> README.md\necho Projeto ${projectType} criado automaticamente >> README.md\n\nREM Criar arquivos de configuração\necho Criando configurações...\n(\n  echo import { defineConfig } from 'vite'\n  echo export default defineConfig({\n  echo   server: { port: 3000 }\n  echo })\n) > vite.config.js\n\n${useSW ? `\nREM Criar Service Worker\n(\n  echo const CACHE_NAME = 'v1'\n  echo self.addEventListener('install', event => {\n  echo   console.log('Service Worker instalado')\n  echo })\n) > public\\\\service-worker.js\n` : ''}\n\n${useManifest ? `\nREM Criar Manifest\n(\n  echo {\n  echo   \"name\": \"${projectName}\",\n  echo   \"short_name\": \"App\",\n  echo   \"start_url\": \"/\",\n  echo   \"display\": \"standalone\"\n  echo }\n) > public\\\\manifest.json\n` : ''}\n\nREM Instalar dependências\necho.\necho Instalando dependências NPM...\ncall npm install\n\necho.\necho ========================================\necho Projeto criado com sucesso!\necho ========================================\necho.\necho Estrutura criada:\necho - src/              : Código-fonte\necho - public/           : Arquivos estáticos\necho - dist/             : Build de produção\necho - tests/            : Testes\necho.\necho Próximos passos:\necho 1. cd ${projectName}\necho 2. npm run dev\necho.\npause`;\n\n            document.getElementById('batOutput').textContent = batContent;\n        }\n\n        // Gerar .bat avançado\n        function gerarBatAvancado() {\n            const projectName = document.getElementById('projectName').value || 'meu-projeto';\n            const useESLint = document.getElementById('useESLint').checked;\n            const usePrettier = document.getElementById('usePrettier').checked;\n\n            let batAvancado = `@echo off\nREM Script Avançado de Configuração\nREM Projeto: ${projectName}\n\nsetlocal enabledelayedexpansion\n\necho ========================================\necho Configuração Avançada do Projeto\necho ========================================\necho.\n\n${useESLint ? `\necho Configurando ESLint...\ncall npm install --save-dev eslint\ncall npx eslint --init\n` : ''}\n\n${usePrettier ? `\necho Configurando Prettier...\ncall npm install --save-dev prettier\n(\n  echo {\n  echo   \"semi\": true,\n  echo   \"singleQuote\": true,\n  echo   \"tabWidth\": 2\n  echo }\n) > .prettierrc\n` : ''}\n\necho.\necho Executando verificações...\ncall npm run build\n\necho.\necho ========================================\necho Configuração concluída!\necho ========================================\npause`;\n\n            alert('Script avançado gerado! Verifique a aba .bat');\n            document.getElementById('batOutput').textContent = batAvancado;\n        }\n\n        // Funções auxiliares\n        function mudarAba(abaName) {\n            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));\n            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));\n            \n            document.getElementById(abaName).classList.add('active');\n            event.target.classList.add('active');\n        }\n\n        function mudarConfiguracao(configName) {\n            document.querySelectorAll('#configuracoes .tab-content').forEach(el => el.classList.remove('active'));\n            document.querySelectorAll('#configuracoes .tab-btn').forEach(el => el.classList.remove('active'));\n            \n            document.getElementById(configName).classList.add('active');\n            event.target.classList.add('active');\n        }\n\n        function copiarParaClipboard(elementId) {\n            const elemento = document.getElementById(elementId);\n            const texto = elemento.textContent;\n            navigator.clipboard.writeText(texto).then(() => {\n                alert('✅ Copiado para a área de transferência!');\n            });\n        }\n\n        function baixarArquivo(nome, conteudo) {\n            const blob = new Blob([conteudo], { type: 'text/plain' });\n            const url = URL.createObjectURL(blob);\n            const link = document.createElement('a');\n            link.href = url;\n            link.download = nome;\n            link.click();\n        }\n\n        function baixarPackageJson() {\n            const conteudo = JSON.stringify(estadoGlobal.packageJson, null, 2);\n            baixarArquivo('package.json', conteudo);\n        }\n\n        function analisarProjeto() {\n            if (Object.keys(estadoGlobal.estrutura).length === 0) {\n                alert('Por favor, primeiro faça upload de um arquivo ZIP!');\n                return;\n            }\n            exibirEstrutura();\n            exibirDependencias();\n            gerarPackageJson();\n            mudarAba('estrutura');\n        }\n\n        function baixarTudo() {\n            alert('Funcionalidade de download completo em desenvolvimento!');\n        }\n\n        function gerarRelatorio() {\n            const relatorio = `\nRELATÓRIO DO PROJETO\n====================\n\nNome: ${document.getElementById('projectName').value}\nVersão: ${document.getElementById('projectVersion').value}\nTipo: ${document.getElementById('projectType').value}\nData: ${new Date().toLocaleString('pt-BR')}\n\nDEPENDÊNCIAS DETECTADAS:\n${Object.entries(estadoGlobal.dependencias).map(([nome, versao]) => `- ${nome}: ${versao}`).join('\\n')}\n\nESTRUTURA DE DIRETÓRIOS:\n${renderizarArvore(estadoGlobal.estrutura)}\n\nPRÓXIMOS PASSOS:\n1. Revisar package.json\n2. Executar arquivo .bat para criar estrutura\n3. Instalar dependências: npm install\n4. Iniciar desenvolvimento: npm run dev\n            `;\n\n            baixarArquivo(`relatorio-${document.getElementById('projectName').value}.txt`, relatorio);\n        }\n\n        function limparTudo() {\n            if (confirm('Deseja limpar tudo?')) {\n                estadoGlobal = { projeto: null, estrutura: {}, dependencias: {}, packageJson: {}, scripts: {}, configuracoes: {} };\n                document.getElementById('fileInput').value = '';\n                document.getElementById('uploadStatus').innerHTML = '';\n                alert('Tudo foi limpo!');\n            }\n        }\n    \u003c/script>\n\u003c/body>\n\u003c/html>\n","l":"html","n":""},{"p":"projeto_4-termux.html","t":"\u003c!DOCTYPE html>\r\n\u003chtml lang=\"pt-BR\">\r\n\u003chead>\r\n    \u003cmeta charset=\"UTF-8\">\r\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\r\n    \u003ctitle>🔗 Teste APK + Termux\u003c/title>\r\n    \u003cstyle>\r\n        * {\r\n            margin: 0;\r\n            padding: 0;\r\n            box-sizing: border-box;\r\n        }\r\n        \r\n        body {\r\n            font-family: 'Courier New', monospace;\r\n            background: #1a1a1a;\r\n            color: #00ff00;\r\n            padding: 20px;\r\n            min-height: 100vh;\r\n        }\r\n        \r\n        .container {\r\n            max-width: 600px;\r\n            margin: 0 auto;\r\n            background: #0a0a0a;\r\n            border: 2px solid #00ff00;\r\n            border-radius: 10px;\r\n            padding: 20px;\r\n            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);\r\n        }\r\n        \r\n        h1 {\r\n            text-align: center;\r\n            margin-bottom: 20px;\r\n            color: #00ff00;\r\n            text-shadow: 0 0 10px #00ff00;\r\n        }\r\n        \r\n        .status-box {\r\n            background: #1a1a1a;\r\n            border: 2px solid #444;\r\n            border-radius: 8px;\r\n            padding: 15px;\r\n            margin: 15px 0;\r\n            min-height: 100px;\r\n            overflow-y: auto;\r\n        }\r\n        \r\n        .log {\r\n            margin: 5px 0;\r\n            padding: 5px;\r\n            font-size: 12px;\r\n            line-height: 1.5;\r\n        }\r\n        \r\n        .log.success {\r\n            color: #00ff00;\r\n            background: rgba(0, 255, 0, 0.1);\r\n        }\r\n        \r\n        .log.error {\r\n            color: #ff0000;\r\n            background: rgba(255, 0, 0, 0.1);\r\n        }\r\n        \r\n        .log.info {\r\n            color: #00aaff;\r\n            background: rgba(0, 170, 255, 0.1);\r\n        }\r\n        \r\n        .log.warning {\r\n            color: #ffaa00;\r\n            background: rgba(255, 170, 0, 0.1);\r\n        }\r\n        \r\n        button {\r\n            width: 100%;\r\n            padding: 15px;\r\n            margin: 10px 0;\r\n            background: #00ff00;\r\n            color: #000;\r\n            border: none;\r\n            border-radius: 5px;\r\n            font-size: 16px;\r\n            font-weight: bold;\r\n            cursor: pointer;\r\n            transition: all 0.3s;\r\n        }\r\n        \r\n        button:hover {\r\n            background: #00cc00;\r\n            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);\r\n        }\r\n        \r\n        button:active {\r\n            transform: scale(0.98);\r\n        }\r\n        \r\n        button:disabled {\r\n            background: #666;\r\n            cursor: not-allowed;\r\n            opacity: 0.5;\r\n        }\r\n        \r\n        .info-section {\r\n            background: #1a1a1a;\r\n            border-left: 4px solid #00ff00;\r\n            padding: 15px;\r\n            margin: 15px 0;\r\n            border-radius: 5px;\r\n        }\r\n        \r\n        .info-section h3 {\r\n            color: #00ff00;\r\n            margin-bottom: 10px;\r\n        }\r\n        \r\n        .info-section p {\r\n            font-size: 12px;\r\n            line-height: 1.6;\r\n            color: #aaa;\r\n        }\r\n        \r\n        .status-indicator {\r\n            display: inline-block;\r\n            width: 15px;\r\n            height: 15px;\r\n            border-radius: 50%;\r\n            margin-right: 8px;\r\n            animation: pulse 2s infinite;\r\n        }\r\n        \r\n        .status-indicator.connected {\r\n            background: #00ff00;\r\n            box-shadow: 0 0 10px #00ff00;\r\n        }\r\n        \r\n        .status-indicator.disconnected {\r\n            background: #ff0000;\r\n            box-shadow: 0 0 10px #ff0000;\r\n            animation: none;\r\n        }\r\n        \r\n        .status-indicator.testing {\r\n            background: #ffaa00;\r\n            animation: pulse 0.5s infinite;\r\n        }\r\n        \r\n        @keyframes pulse {\r\n            0%, 100% { opacity: 1; }\r\n            50% { opacity: 0.5; }\r\n        }\r\n        \r\n        .result {\r\n            background: #0a0a0a;\r\n            border: 2px solid #00ff00;\r\n            border-radius: 8px;\r\n            padding: 15px;\r\n            margin: 15px 0;\r\n            display: none;\r\n        }\r\n        \r\n        .result.show {\r\n            display: block;\r\n        }\r\n        \r\n        .result.success {\r\n            border-color: #00ff00;\r\n            background: rgba(0, 255, 0, 0.05);\r\n        }\r\n        \r\n        .result.error {\r\n            border-color: #ff0000;\r\n            background: rgba(255, 0, 0, 0.05);\r\n        }\r\n    \u003c/style>\r\n\u003c/head>\r\n\u003cbody>\r\n    \u003cdiv class=\"container\">\r\n        \u003ch1>🔗 Teste APK ↔ Termux\u003c/h1>\r\n        \r\n        \u003cdiv class=\"info-section\">\r\n            \u003ch3>📋 Como Usar:\u003c/h3>\r\n            \u003cp>\r\n                1️⃣ Abra Termux no seu celular\u003cbr>\r\n                2️⃣ Cole o código do servidor (veja abaixo)\u003cbr>\r\n                3️⃣ Clique nos botões aqui para testar\u003cbr>\r\n                4️⃣ Veja se conecta ou não\r\n            \u003c/p>\r\n        \u003c/div>\r\n        \r\n        \u003cdiv style=\"text-align: center; margin: 20px 0;\">\r\n            \u003cspan class=\"status-indicator disconnected\" id=\"statusIndicator\">\u003c/span>\r\n            \u003cspan id=\"statusText\">Desconectado\u003c/span>\r\n        \u003c/div>\r\n        \r\n        \u003cbutton onclick=\"testarConexaoSimples()\">🧪 Teste 1: Conexão Básica\u003c/button>\r\n        \u003cbutton onclick=\"testarConexaoComDados()\">📊 Teste 2: Enviar/Receber Dados\u003c/button>\r\n        \u003cbutton onclick=\"testarComandoTermux()\">⚙️ Teste 3: Executar Comando\u003c/button>\r\n        \u003cbutton onclick=\"testarMultiplas()\">🔄 Teste 4: Múltiplas Requisições\u003c/button>\r\n        \u003cbutton onclick=\"limparLogs()\">🗑️ Limpar Logs\u003c/button>\r\n        \r\n        \u003cdiv class=\"status-box\" id=\"logs\">\r\n            \u003cdiv class=\"log info\">📍 Aguardando testes...\u003c/div>\r\n        \u003c/div>\r\n        \r\n        \u003cdiv class=\"result\" id=\"result\">\u003c/div>\r\n        \r\n        \u003cdiv class=\"info-section\">\r\n            \u003ch3>🖥️ Código para Rodar no Termux:\u003c/h3>\r\n            \u003cp style=\"background: #000; padding: 10px; border-radius: 5px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; font-size: 11px;\">\r\nnpm install express\r\ncat > server.js \u003c\u003c 'EOF'\r\nconst express = require('express');\r\nconst app = express();\r\napp.use(express.json());\r\n\r\napp.get('/teste', (req, res) => {\r\n    res.json({ \r\n        status: 'conectado',\r\n        mensagem: 'APK conectou com sucesso!',\r\n        horario: new Date()\r\n    });\r\n});\r\n\r\napp.post('/dados', (req, res) => {\r\n    res.json({\r\n        recebido: req.body,\r\n        resposta: 'Dados recebidos!'\r\n    });\r\n});\r\n\r\napp.get('/comando', (req, res) => {\r\n    res.json({\r\n        comando: 'teste',\r\n        resultado: 'Comando executado!'\r\n    });\r\n});\r\n\r\napp.listen(8080, '0.0.0.0', () => {\r\n    console.log('✅ Servidor rodando em http://localhost:8080');\r\n});\r\nEOF\r\nnode server.js\r\n            \u003c/p>\r\n        \u003c/div>\r\n    \u003c/div>\r\n\r\n    \u003cscript>\r\n        const logsDiv = document.getElementById('logs');\r\n        const statusIndicator = document.getElementById('statusIndicator');\r\n        const statusText = document.getElementById('statusText');\r\n        const resultDiv = document.getElementById('result');\r\n        \r\n        function addLog(mensagem, tipo = 'info') {\r\n            const log = document.createElement('div');\r\n            log.className = `log ${tipo}`;\r\n            log.textContent = `[${new Date().toLocaleTimeString()}] ${mensagem}`;\r\n            logsDiv.appendChild(log);\r\n            logsDiv.scrollTop = logsDiv.scrollHeight;\r\n        }\r\n        \r\n        function setStatus(conectado, testando = false) {\r\n            if (testando) {\r\n                statusIndicator.className = 'status-indicator testing';\r\n                statusText.textContent = 'Testando...';\r\n            } else if (conectado) {\r\n                statusIndicator.className = 'status-indicator connected';\r\n                statusText.textContent = '✅ Conectado';\r\n            } else {\r\n                statusIndicator.className = 'status-indicator disconnected';\r\n                statusText.textContent = '❌ Desconectado';\r\n            }\r\n        }\r\n        \r\n        function showResult(titulo, dados, sucesso = true) {\r\n            resultDiv.className = `result show ${sucesso ? 'success' : 'error'}`;\r\n            resultDiv.innerHTML = `\r\n                \u003ch3>${titulo}\u003c/h3>\r\n                \u003cpre style=\"background: #000; padding: 10px; border-radius: 5px; overflow-x: auto; font-size: 12px;\">\r\n${JSON.stringify(dados, null, 2)}\r\n                \u003c/pre>\r\n            `;\r\n        }\r\n        \r\n        async function testarConexaoSimples() {\r\n            addLog('🔄 Iniciando Teste 1: Conexão Básica...', 'info');\r\n            setStatus(false, true);\r\n            \r\n            try {\r\n                addLog('📡 Conectando em http://localhost:8080/teste', 'info');\r\n                \r\n                const resposta = await Promise.race([\r\n                    fetch('http://localhost:8080/teste', {\r\n                        method: 'GET',\r\n                        headers: { 'Content-Type': 'application/json' }\r\n                    }),\r\n                    new Promise((_, reject) => \r\n                        setTimeout(() => reject(new Error('Timeout: Servidor não respondeu')), 5000)\r\n                    )\r\n                ]);\r\n                \r\n                if (resposta.ok) {\r\n                    const dados = await resposta.json();\r\n                    addLog('✅ CONEXÃO ESTABELECIDA!', 'success');\r\n                    addLog(`📊 Resposta: ${JSON.stringify(dados)}`, 'success');\r\n                    setStatus(true);\r\n                    showResult('✅ Conexão Bem-Sucedida', dados, true);\r\n                } else {\r\n                    addLog(`❌ Erro HTTP: ${resposta.status}`, 'error');\r\n                    setStatus(false);\r\n                    showResult('❌ Erro na Resposta', { status: resposta.status }, false);\r\n                }\r\n                \r\n            } catch (erro) {\r\n                addLog(`❌ ERRO: ${erro.message}`, 'error');\r\n                addLog('💡 Dica: Termux está rodando? Porta 8080 está aberta?', 'warning');\r\n                setStatus(false);\r\n                showResult('❌ Falha na Conexão', { erro: erro.message }, false);\r\n            }\r\n        }\r\n        \r\n        async function testarConexaoComDados() {\r\n            addLog('🔄 Iniciando Teste 2: Enviar/Receber Dados...', 'info');\r\n            setStatus(false, true);\r\n            \r\n            try {\r\n                const dadosEnvio = {\r\n                    teste: 'APK enviando dados',\r\n                    timestamp: new Date().toISOString()\r\n                };\r\n                \r\n                addLog(`📤 Enviando dados: ${JSON.stringify(dadosEnvio)}`, 'info');\r\n                \r\n                const resposta = await Promise.race([\r\n                    fetch('http://localhost:8080/dados', {\r\n                        method: 'POST',\r\n                        headers: { 'Content-Type': 'application/json' },\r\n                        body: JSON.stringify(dadosEnvio)\r\n                    }),\r\n                    new Promise((_, reject) => \r\n                        setTimeout(() => reject(new Error('Timeout')), 5000)\r\n                    )\r\n                ]);\r\n                \r\n                const dados = await resposta.json();\r\n                addLog('✅ Dados enviados e recebidos!', 'success');\r\n                addLog(`📥 Resposta: ${JSON.stringify(dados)}`, 'success');\r\n                setStatus(true);\r\n                showResult('✅ Comunicação Bidirecional Funcionando', dados, true);\r\n                \r\n            } catch (erro) {\r\n                addLog(`❌ ERRO: ${erro.message}`, 'error');\r\n                setStatus(false);\r\n                showResult('❌ Falha na Comunicação', { erro: erro.message }, false);\r\n            }\r\n        }\r\n        \r\n        async function testarComandoTermux() {\r\n            addLog('🔄 Iniciando Teste 3: Executar Comando...', 'info');\r\n            setStatus(false, true);\r\n            \r\n            try {\r\n                addLog('⚙️ Solicitando execução de comando', 'info');\r\n                \r\n                const resposta = await Promise.race([\r\n                    fetch('http://localhost:8080/comando', {\r\n                        method: 'GET'\r\n                    }),\r\n                    new Promise((_, reject) => \r\n                        setTimeout(() => reject(new Error('Timeout')), 5000)\r\n                    )\r\n                ]);\r\n                \r\n                const dados = await resposta.json();\r\n                addLog('✅ Comando executado!', 'success');\r\n                addLog(`📋 Resultado: ${JSON.stringify(dados)}`, 'success');\r\n                setStatus(true);\r\n                showResult('✅ Comando Executado com Sucesso', dados, true);\r\n                \r\n            } catch (erro) {\r\n                addLog(`❌ ERRO: ${erro.message}`, 'error');\r\n                setStatus(false);\r\n                showResult('❌ Falha na Execução', { erro: erro.message }, false);\r\n            }\r\n        }\r\n        \r\n        async function testarMultiplas() {\r\n            addLog('🔄 Iniciando Teste 4: Múltiplas Requisições...', 'info');\r\n            setStatus(false, true);\r\n            \r\n            let sucessos = 0;\r\n            let erros = 0;\r\n            \r\n            for (let i = 1; i \u003c= 5; i++) {\r\n                try {\r\n                    addLog(`📡 Requisição ${i}/5...`, 'info');\r\n                    \r\n                    const resposta = await Promise.race([\r\n                        fetch('http://localhost:8080/teste'),\r\n                        new Promise((_, reject) => \r\n                            setTimeout(() => reject(new Error('Timeout')), 3000)\r\n                        )\r\n                    ]);\r\n                    \r\n                    if (resposta.ok) {\r\n                        sucessos++;\r\n                        addLog(`✅ Requisição ${i} OK`, 'success');\r\n                    } else {\r\n                        erros++;\r\n                        addLog(`❌ Requisição ${i} Falhou`, 'error');\r\n                    }\r\n                    \r\n                } catch (erro) {\r\n                    erros++;\r\n                    addLog(`❌ Requisição ${i} Erro: ${erro.message}`, 'error');\r\n                }\r\n                \r\n                await new Promise(resolve => setTimeout(resolve, 500));\r\n            }\r\n            \r\n            addLog(`📊 Resultado: ${sucessos} OK, ${erros} Falhas`, 'info');\r\n            setStatus(sucessos > 0);\r\n            showResult('📊 Teste de Múltiplas Requisições', {\r\n                total: 5,\r\n                sucessos: sucessos,\r\n                erros: erros,\r\n                taxa_sucesso: `${(sucessos/5*100).toFixed(0)}%`\r\n            }, sucessos > 0);\r\n        }\r\n        \r\n        function limparLogs() {\r\n            logsDiv.innerHTML = '\u003cdiv class=\"log info\">📍 Logs limpos\u003c/div>';\r\n            resultDiv.className = 'result';\r\n        }\r\n        \r\n        // Log inicial\r\n        addLog('🚀 Sistema pronto para testes', 'success');\r\n        addLog('⚠️ Certifique-se de que Termux está rodando o servidor', 'warning');\r\n    \u003c/script>\r\n\u003c/body>\r\n\u003c/html>\r\n","l":"html","n":""}];const e=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));function cp(t,b){navigator.clipboard.writeText(t).then(()=>{if(b){const o=b.textContent;b.textContent="✓";setTimeout(()=>b.textContent=o,1200)}}).catch(()=>prompt("Copie:",t))}function r(){const q=document.getElementById("q").value.toLowerCase();const v=D.map((x,i)=>[x,i]).filter(([x])=>!q||x.p.toLowerCase().includes(q)||(x.t||"").toLowerCase().includes(q));document.getElementById("nav").innerHTML=v.map(([x,i])=>'<a href="#s'+i+'">'+(i+1)+". "+e(x.p)+"</a>").join("");document.getElementById("l").innerHTML=v.map(([x,i])=>'<section id="s'+i+'"><h2><span>'+(i+1)+". "+e(x.p)+'</span><button data-i="'+i+'">📋 Copiar</button></h2>'+(x.n?'<div style="padding:0 10px 8px;color:#f2d27a;font-size:13px">📝 '+e(x.n)+"</div>":"")+'<pre>'+(x.t==null?"(arquivo binário)":e(x.t))+"</pre></section>").join("")}document.getElementById("q").oninput=r;document.getElementById("l").onclick=ev=>{const b=ev.target.closest("[data-i]");if(b)cp(D[+b.dataset.i].t||"",b)};document.getElementById("all").onclick=ev=>cp(D.map(x=>"===== "+x.p+" =====\n"+(x.t||"(binário)")).join("\n\n"),ev.target);r();</script></body></html>
