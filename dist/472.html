n onPicked(e, mode) { const files = [...e.target.files]; e.target.value = ''; if (files.length) loadInto(APP.loadSlot, files, mode, $('loadName').value.trim()); }\nasync function loadInto(slot, files, mode, name) {\n  closeModal('loadModal');\n  busy(true, 'Preparando...');\n  try {\n    const proj = await buildProject(files, mode, { skipHeavy: $('optSkip').checked, name }, t => { $('busyTxt').textContent = t; });\n    if (!proj.files.size) throw new Error('Nenhum arquivo encontrado.');\n    $('busyTxt').textContent = 'Analisando o projeto...'; await tick();\n    setSlot(slot, proj);\n    const n = APP.an[slot].issues.length;\n    toast(`✅ ${slot}: ${proj.files.size} arquivos lidos · ${n} ponto(s) detectado(s)` + (proj.warnings.length ? ` · ${proj.warnings.length} aviso(s)` : ''), 'success');\n    if (APP.slots.A && APP.slots.B && slot === 'B') setTab('comparar'); else { APP.active = slot; render(); }\n  } catch (e) { console.error(e); toast('❌ ' + e.message, 'error'); }\n  busy(false);\n}\nfunction setSlot(slot, proj) {\n  APP.slots[slot] = proj; APP.an[slot] = proj ? analyze(proj) : null; APP.repos[slot] = proj ? findRepos(proj) : [];\n  APP.fileSel[slot] = null; APP.git[slot] = { repo: 0, sel: null, file: null, log: null, ch: null }; APP.cmp.sel = null;\n  updateSlots();\n}\nfunction renameSlot(slot, v) { if (APP.slots[slot]) { APP.slots[slot].name = v || slot; render(); } }\nfunction clearSlot(slot) { if (APP.slots[slot] && !confirm(`Remover o projeto ${slot}?`)) return; setSlot(slot, null); if (APP.active === slot && APP.slots[other(slot)]) APP.active = other(slot); render(); }\nfunction swapSlots() {\n  [APP.slots.A, APP.slots.B] = [APP.slots.B, APP.slots.A]; [APP.an.A, APP.an.B] = [APP.an.B, APP.an.A]; [APP.repos.A, APP.repos.B] = [APP.repos.B, APP.repos.A];\n  [APP.fileSel.A, APP.fileSel.B] = [APP.fileSel.B, APP.fileSel.A]; [APP.git.A, APP.git.B] = [APP.git.B, APP.git.A]; APP.cmp.sel = null;\n  updateSlots(); render();\n}\nfunction updateSlots() {\n  for (const s of ['A', 'B']) {\n    const p = APP.slots[s];\n    $('name' + s).value = p ? p.name : '';\n    $('info' + s).textContent = p ? `${p.files.size} arq · ${fmtSize(p.bytes)}` : 'vazio';\n  }\n  const iss = APP.an[APP.active]?.issues.length || 0;\n  $('cntIss').textContent = iss;\n}\nfunction setTab(t) { APP.tab = t; document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t)); render(); }\nfunction setActive(s) { APP.active = s; render(); }\nfunction viewbar() {\n  const vb = $('viewbar');\n  const both = APP.slots.A && APP.slots.B;\n  if (APP.tab === 'comparar' || !(APP.slots.A || APP.slots.B)) { vb.classList.add('hidden'); return; }\n  const s = APP.active, P = APP.slots[s];\n  vb.classList.remove('hidden');\n  vb.innerHTML = (both ? `\u003cspan class=\"muted\">Ver:\u003c/span>` + ['A', 'B'].map(x => `\u003cbutton class=\"btn sm ${x === s ? 'on' : ''}\" onclick=\"setActive('${x}')\">\u003cspan class=\"tag ${x}\">${x}\u003c/span> ${esc(APP.slots[x].name)}\u003c/button>`).join('') : (P ? `\u003cspan class=\"tag ${s}\">${s}\u003c/span> \u003cb>${esc(P.name)}\u003c/b>` : ''))\n    + `\u003cspan style=\"flex:1\">\u003c/span>` + (P ? `\u003cbutton class=\"btn sm ai\" onclick=\"Ctx.askProject('${s}')\">🤖 Diagnóstico geral\u003c/button>\u003cbutton class=\"btn sm\" onclick=\"exportReport('${s}')\" title=\"Relatório em Markdown\">📄 Relatório\u003c/button>\u003cbutton class=\"btn sm\" onclick=\"copyReport('${s}')\" title=\"Copiar relatório para colar em qualquer IA\">📋 Copiar relatório\u003c/button>\u003cbutton class=\"btn sm\" onclick=\"exportLean('${s}')\" title=\"Zip sem node_modules — bom para mandar para IA/GitHub\">📦 Zip enxuto\u003c/button>` : '');\n}\nfunction render() {\n  updateSlots(); viewbar();\n  const v = $('view'); v.className = '';\n  if (!APP.slots.A && !APP.slots.B) { v.innerHTML = welcomeHTML(); return; }\n  if (!APP.slots[APP.active]) APP.active = APP.slots.A ? 'A' : 'B';\n  try {\n    ({ resumo: renderResumo, arquivos: renderArquivos, problemas: renderProblemas, deps: renderDeps, api: renderApi, git: renderGit, comparar: renderComparar })[APP.tab]();\n  } catch (e) { console.error(e); v.innerHTML = `\u003cdiv class=\"pad aimsg err\">Erro ao montar a tela: ${esc(e.message)}\u003c/div>`; }\n}\nfunction welcomeHTML() {\n  return `\u003cdiv class=\"welcome\">\n    \u003ch2>🔬 Projeto Lab — raio-x de projetos\u003c/h2>\n    \u003cp>Carregue um projeto (zip, tar, tar.gz/tgz ou pasta) em \u003cspan class=\"tag A\">A\u003c/span>. Para \u003cb>comparar duas versões\u003c/b> (ex.: a que funcionava × a que quebrou), carregue a outra em \u003cspan class=\"tag B\">B\u003c/span> e dê um nome a cada uma.\u003c/p>\n    \u003cdiv class=\"big-btns\">\u003cbutton class=\"btn primary\" onclick=\"openLoad('A')\">📂 Carregar projeto A\u003c/button>\u003cbutton class=\"btn\" onclick=\"openLoad('B')\">📂 Carregar projeto B\u003c/button>\u003c/div>\n    \u003cp>\u003cb>O que ele faz:\u003c/b>\u003c/p>\n    \u003cul>\n      \u003cli>📁 Mostra todos os arquivos, inclusive pastas ocultas (\u003cb>.git\u003c/b>, .replit, .local, .config...)\u003c/li>\n      \u003cli>🩺 Acha \u003cb>imports quebrados\u003c/b>, \u003cb>dependências faltando\u003c/b>, JSON inválido, conflitos de merge, \u003cb>chaves de API expostas\u003c/b>, variáveis de ambiente, problemas de Capacitor/Flutter/Python\u003c/li>\n      \u003cli>🧹 Lista tudo que é \u003cb>do Replit\u003c/b> (arquivos, plugins, \"catalog:\", PORT obrigatória...) com o que fazer\u003c/li>\n      \u003cli>🌿 Lê a pasta \u003cb>.git\u003c/b>: histórico de commits, \u003cb>o que cada commit mudou, onde e como\u003c/b> — e deixa usar um commit antigo como versão A ou B\u003c/li>\n      \u003cli>⚖️ Compara A × B: arquivos novos/apagados/alterados, diferenças linha a linha lado a lado, problemas \u003cb>resolvidos\u003c/b> e \u003cb>novos\u003c/b>, dependências que mudaram\u003c/li>\n      \u003cli>🔌 Lista as rotas da API, confere se o frontend chama rotas que existem, e \u003cb>testa a API\u003c/b> rodando no seu PC\u003c/li>\n      \u003cli>🤖 IA ajudante (Gemini, Claude, GPT, Groq, OpenRouter, DeepSeek, Ollama...) com o arquivo/diferença/problemas já anexados — ou \u003cb>📋 copie o pedido\u003c/b> para colar em qualquer chat\u003c/li>\n      \u003cli>📦 \u003cb>Zip enxuto\u003c/b>: gera um zip sem node_modules para mandar a uma IA ou ao GitHub\u003c/li>\n    \u003c/ul>\n    \u003cp class=\"muted\">Tudo é lido no seu navegador — nada é enviado a lugar nenhum, só o que você mandar para a IA. Arraste e solte funciona aqui na tela.\u003c/p>\u003c/div>`;\n}\n\n/* ------------------------------- RESUMO ------------------------------- */\nfunction renderResumo() {\n  const s = APP.active, P = APP.slots[s], A = APP.an[s], v = $('view');\n  const skippedTotal = [...P.skipped.values()].reduce((a, b) => a + b, 0);\n  const topSkip = new Map(); for (const [k, n] of P.skipped) { const key = k.replace(/.*?(node_modules|\\.[\\w-]+|[\\w-]+)\\/$/, '$1'); topSkip.set(key, (topSkip.get(key) || 0) + n); }\n  const hid = [...A.hidden].filter(h => h.split('/').filter(Boolean).length \u003c= 2 || h.endsWith('.git/')).filter((h, i, arr) => !arr.some(o => o !== h && h.startsWith(o) && o.endsWith('/'))).slice(0, 40);\n  let html = `\u003cdiv class=\"cards\">\n    \u003cdiv class=\"card\">\u003cdiv class=\"big\">${P.files.size}\u003c/div>\u003cdiv class=\"lbl\">arquivos lidos · ${fmtSize(P.bytes)}\u003c/div>\u003c/div>\n    \u003cdiv class=\"card\">\u003cdiv class=\"big\">${skippedTotal}\u003c/div>\u003cdiv class=\"lbl\">ignorados (${[...topSkip.keys()].slice(0, 3).join(', ') || '—'})\u003c/div>\u003c/div>\n    ${SEVS.map(sv => `\u003cdiv class=\"card click\" onclick=\"APP.issF.sev='${sv}';setTab('problemas')\">\u003cdiv class=\"big\">\u003cspan class=\"sev ${sv}\">${A.bySev[sv]}\u003c/span>\u003c/div>\u003cdiv class=\"lbl\">${SEV_LBL[sv]}\u003c/div>\u003c/div>`).join('')}\n  \u003c/div>`;\n  html += `\u003cdiv class=\"box\">\u003ch3>🧩 O que tem dentro\u003c/h3>` + (A.stack.length ? `\u003ctable class=\"t\">\u003ctr>\u003cth>Pasta\u003c/th>\u003cth>Tipo\u003c/th>\u003cth>Scripts\u003c/th>\u003c/tr>` + A.stack.map(x => `\u003ctr>\u003ctd class=\"mono\">${esc(x.dir)}${x.name ? `\u003cbr>\u003cspan class=\"muted\">${esc(x.name)}\u003c/span>` : ''}\u003c/td>\u003ctd>${x.tags.map(t => `\u003cspan class=\"pill\">${esc(t)}\u003c/span>`).join('')}\u003c/td>\u003ctd class=\"mono\" style=\"font-size:11px\">${x.scripts ? Object.entries(x.scripts).slice(0, 6).map(([k, c]) => `\u003cb>${esc(k)}\u003c/b>: ${esc(c)}`).join('\u003cbr>') : ''}\u003c/td>\u003c/tr>`).join('') + `\u003c/table>` : '\u003cp class=\"muted\">Nenhum package.json, pubspec.yaml ou Python reconhecido.\u003c/p>') + `\u003c/div>`;\n  const rep = A.issues.filter(i => i.cat === 'Replit');\n  html += `\u003cdiv class=\"box\">\u003ch3>🧹 Replit ${rep.length ? `\u003cspan class=\"pill bad\">${rep.length} ponto(s)\u003c/span>` : '\u003cspan class=\"pill ok\">nada encontrado\u003c/span>'}\u003c/h3>`;\n  if (rep.length) html += `\u003cp class=\"muted\" style=\"margin-bottom:6px\">Para rodar fora do Replit (PC, Electron, APK), resolva estes itens:\u003c/p>` + rep.map(i => issueHTML(i, s)).join('') + `\u003cdiv class=\"row\" style=\"margin-top:8px\">\u003cbutton class=\"btn sm ai\" onclick=\"Ctx.askReplit('${s}')\">🤖 Pedir à IA o passo a passo para tirar o Replit\u003c/button>\u003c/div>`;\n  html += `\u003c/div>`;\n  html += `\u003cdiv class=\"box\">\u003ch3>👁️ Pastas e arquivos ocultos\u003c/h3>${hid.length ? hid.map(h => `\u003cspan class=\"pill ${/\\.git\\/$/.test(h) ? 'ok' : /replit|\\.local|\\.upm/.test(h) ? 'warn' : ''}\">${esc(h)}\u003c/span>`).join('') : '\u003cspan class=\"muted\">Nenhum.\u003c/span>'}\u003c/div>`;\n  const repos = APP.repos[s];\n  html += `\u003cdiv class=\"box\">\u003ch3>🌿 Git\u003c/h3>` + (repos.length ? repos.map(r => { const h = r.head(), st = r.stats(), rm = r.remotes(); return `\u003cdiv>\u003cb>${esc(r.base)}\u003c/b> · branch \u003cb>${esc(h.branch)}\u003c/b> · ${st.loose + st.packed} objetos · ${r.reflog().length} entradas no histórico local ${rm.map(x => `\u003cbr>\u003cspan class=\"muted\">remoto ${esc(x.name)}: ${esc(x.url.replace(/\\/\\/[^@/]+@/, '//***@'))}\u003c/span>`).join('')}\u003c/div>`; }).join('') + `\u003cdiv class=\"row\" style=\"margin-top:6px\">\u003cbutton class=\"btn sm\" onclick=\"setTab('git')\">Abrir histórico →\u003c/button>\u003c/div>` : '\u003cp class=\"muted\">Sem pasta .git (baixou como zip sem o histórico). Para ver o histórico, compacte a pasta do projeto \u003cb>incluindo\u003c/b> a pasta oculta .git.\u003c/p>') + `\u003c/div>`;\n  if (P.warnings.length) html += `\u003cdiv class=\"box\">\u003ch3>⚠️ Avisos da leitura\u003c/h3>\u003cdiv class=\"mono\" style=\"font-size:11px\">${P.warnings.slice(0, 30).map(esc).join('\u003cbr>')}\u003c/div>\u003c/div>`;\n  v.innerHTML = html;\n}\nfunction issueHTML(i, s, idx) {\n  const loc = i.file ? `\u003cdiv class=\"loc\" onclick=\"gotoFile('${s}',${R(i.file)},${i.line || 0})\">${esc(i.file)}${i.line ? ':' + i.line : ''}\u003c/div>` : '';\n  return `\u003cdiv class=\"iss\">\u003cspan class=\"sev ${i.sev}\">${SEV_LBL[i.sev].split(' ')[1]}\u003c/span>\u003cdiv class=\"body\">\u003cdiv class=\"msg\">\u003cspan class=\"muted\">[${esc(i.cat)}]\u003c/span> ${esc(i.msg)}\u003c/div>${i.det ? `\u003cdiv class=\"det\">${esc(i.det)}\u003c/div>` : ''}${i.fix ? `\u003cdiv class=\"fix\">💡 ${esc(i.fix)}\u003c/div>` : ''}${loc}\u003c/div>${idx != null ? `\u003cbutton class=\"btn sm ai\" title=\"Perguntar à IA sobre isto\" onclick=\"Ctx.askIssue('${s}',${idx})\">🤖\u003c/button>` : ''}\u003c/div>`;\n}\nfunction gotoFile(s, refIdx, line) { APP.active = s; APP.fileSel[s] = { path: REF[refIdx], line }; setTab('arquivos'); }\n\n/* ------------------------------ ARQUIVOS ------------------------------ */\nfunction buildTree(paths) {\n  const root = { d: new Map(), f: [] };\n  for (const p of paths) { const parts = p.split('/'); let n = root; for (let i = 0; i \u003c parts.length - 1; i++) { if (!n.d.has(parts[i])) n.d.set(parts[i], { d: new Map(), f: [] }); n = n.d.get(parts[i]); } n.f.push(p); }\n  return root;\n}\nfunction countTree(n) { let c = n.f.length; for (const x of n.d.values()) c += countTree(x); return c; }\nfunction treeHTML(n, prefix, opts) {\n  let h = '';\n  const dirs = [...n.d.keys()].sort((a, b) => (a.startsWith('.') - b.startsWith('.')) || a.localeCompare(b));\n  for (const d of dirs) {\n    const full = prefix + d + '/', open = APP.openDirs.has(full) || opts.openAll;\n    h += `\u003cdetails ${open ? 'open' : ''} ontoggle=\"this.open?APP.openDirs.add(${JSON.stringify(full).replace(/\"/g, '&quot;')}):APP.openDirs.delete(${JSON.stringify(full).replace(/\"/g, '&quot;')})\">\u003csummary class=\"${d.startsWith('.') ? 'hid' : ''}\">📁 ${esc(d)}\u003cspan class=\"cnt\">${countTree(n.d.get(d))}\u003c/span>${opts.sev && opts.sevDir(full) ? `\u003cspan class=\"dot ${opts.sevDir(full)}\">\u003c/span>` : ''}\u003c/summary>\u003cdiv>${treeHTML(n.d.get(d), full, opts)}\u003c/div>\u003c/details>`;\n  }\n  for (const f of n.f.sort((a, b) => basename(a).localeCompare(basename(b)))) h += opts.fileRow(f);\n  return h;\n}\nfunction renderArquivos() {\n  const s = APP.active, P = APP.slots[s], A = APP.an[s], v = $('view'); v.className = 'full';\n  const sel = APP.fileSel[s];\n  if (sel) { const parts = sel.path.split('/'); for (let i = 1; i \u003c parts.length; i++) APP.openDirs.add(parts.slice(0, i).join('/') + '/'); }\n  const q = APP.fileQ.toLowerCase();\n  const paths = [...P.files.keys()];\n  const sevDirCache = new Map();\n  const sevDir = full => { if (sevDirCache.has(full)) return sevDirCache.get(full); let best = null; for (const [f, sv] of A.fileSev) if (f.startsWith(full) && (!best || severityRank(sv) \u003c severityRank(best))) best = sv; sevDirCache.set(full, best); return best; };\n  const fileRow = f => { const sv = A.fileSev.get(f); const fi = P.files.get(f); return `\u003cdiv class=\"f ${sel && sel.path === f ? 'sel' : ''} ${basename(f).startsWith('.') ? 'hid' : ''}\" onclick=\"selFile(${R(f)})\" title=\"${esc(f)}\">${fi.binary ? '🖼️' : fi.git ? '⚙️' : '📄'} ${esc(q ? f : basename(f))}${sv ? `\u003cspan class=\"dot ${sv}\">\u003c/span>` : ''}\u003c/div>`; };\n  let left = `\u003cdiv class=\"pad\" style=\"border-bottom:1px solid var(--border)\">\u003cinput type=\"search\" id=\"fq\" placeholder=\"🔍 Buscar arquivo ou texto...\" value=\"${esc(APP.fileQ)}\" style=\"width:100%\" onkeydown=\"if(event.key==='Enter'){APP.fileQ=this.value;render()}\" onsearch=\"APP.fileQ=this.value;render()\">\u003c/div>\u003cdiv class=\"tree\">`;\n  if (q) {\n    const byName = paths.filter(p => p.toLowerCase().includes(q)).slice(0, 300);\n    const byText = paths.filter(p => !byName.includes(p) && P.files.get(p).text && P.files.get(p).text.toLowerCase().includes(q)).slice(0, 200);\n    left += `\u003cdiv class=\"muted pad\" style=\"padding:4px 8px\">${byName.length} no nome · ${byText.length} no conteúdo\u003c/div>` + byName.map(fileRow).join('') + (byText.length ? `\u003cdiv class=\"muted\" style=\"padding:6px 8px 2px\">— contém \"${esc(APP.fileQ)}\" —\u003c/div>` + byText.map(fileRow).join('') : '');\n  } else {\n    left += treeHTML(buildTree(paths), '', { fileRow, sev: true, sevDir });\n    if (P.skipped.size) {\n      const grp = new Map(); for (const [k, n] of P.skipped) grp.set(k, n);\n      left += [...grp].slice(0, 30).map(([k, n]) => `\u003cdiv class=\"skip\">📦 ${esc(k)} — ignorado (${n})\u003c/div>`).join('');\n    }\n  }\n  left += '\u003c/div>';\n  let right = '';\n  if (!sel || !P.files.has(sel.path)) right = `\u003cdiv class=\"pad muted\">Escolha um arquivo à esquerda. Os pontinhos coloridos mostram onde há problemas.\u003c/div>`;\n  else right = fileViewHTML(s, sel.path, sel.line);\n  v.innerHTML = `\u003cdiv class=\"split\">\u003cdiv class=\"left\">${left}\u003c/div>\u003cdiv class=\"right\" id=\"fileRight\">${right}\u003c/div>\u003c/div>`;\n  if (sel && sel.line) setTimeout(() => { const el = document.getElementById('L' + sel.line); if (el) el.scrollIntoView({ block: 'center' }); }, 30);\n  else if (sel) setTimeout(() => { const el = document.querySelector('.tree .f.sel'); if (el) el.scrollIntoView({ block: 'nearest' }); }, 30);\n}\nfunction selFile(ri) { const s = APP.active; APP.fileSel[s] = { path: REF[ri], line: 0 }; if (window.innerWidth \u003c= 820) render(); else { const P = APP.slots[s]; document.querySelectorAll('.tree .f.sel').forEach(e => e.classList.remove('sel')); event?.currentTarget?.classList.add('sel'); $('fileRight').innerHTML = fileViewHTML(s, REF[ri], 0); $('fileRight').scrollTop = 0; } }\nfunction fileViewHTML(s, path, jump) {\n  const P = APP.slots[s], f = P.files.get(path), A = APP.an[s];\n  const iss = A.issues.map((x, i) => [x, i]).filter(([x]) => x.file === path);\n  const o = other(s), inOther = APP.slots[o] && APP.slots[o].files.has(path);\n  let h = `\u003cdiv class=\"codehead\">\u003cspan class=\"path\">${esc(path)} \u003cspan class=\"muted\">· ${fmtSize(f.size)}\u003c/span>\u003c/span>\n    ${f.text != null ? `\u003cbutton class=\"btn sm\" onclick=\"copyText(APP.slots['${s}'].files.get(REF[${R(path)}]).text)\">📋 Copiar\u003c/button>` : ''}\n    \u003cbutton class=\"btn sm\" onclick=\"dlFile('${s}',${R(path)})\">⬇️\u003c/button>\n    ${inOther ? `\u003cbutton class=\"btn sm\" onclick=\"APP.cmp.sel=REF[${R(path)}];setTab('comparar')\">⚖️ Comparar com ${o}\u003c/button>` : ''}\n    ${f.text != null ? `\u003cbutton class=\"btn sm ai\" onclick=\"Ctx.askFile('${s}',${R(path)})\">🤖 Analisar com IA\u003c/button>` : ''}\u003c/div>`;\n  if (iss.length) h += `\u003cdiv style=\"border-bottom:1px solid var(--border)\">${iss.map(([x, i]) => issueHTML(x, s, i)).join('')}\u003c/div>`;\n  if (f.text != null) {\n    const lines = f.text.split('\\n'); const hl = new Set(iss.map(([x]) => x.line).filter(Boolean));\n    const lim = Math.min(lines.length, 12000);\n    let c = '\u003cdiv class=\"code\">';\n    for (let i = 0; i \u003c lim; i++) c += `\u003cdiv class=\"l ${hl.has(i + 1) ? 'hl' : ''} ${jump === i + 1 ? 'jump' : ''}\" id=\"L${i + 1}\">\u003cspan class=\"n\">${i + 1}\u003c/span>\u003cspan class=\"x\">${esc(lines[i])}\u003c/span>\u003c/div>`;\n    if (lines.length > lim) c += `\u003cdiv class=\"pad muted\">... mais ${lines.length - lim} linhas (baixe o arquivo para ver tudo)\u003c/div>`;\n    h += c + '\u003c/div>';\n  } else if (f.bytes && IMG_EXT.has(extOf(path))) {\n    const url = URL.createObjectURL(new Blob([f.bytes], { type: extOf(path) === 'svg' ? 'image/svg+xml' : 'image/' + extOf(path) }));\n    h += `\u003cdiv class=\"pad\">\u003cimg src=\"${url}\" style=\"max-width:100%;background:#fff3;border-radius:6px\">\u003c/div>`;\n  } else if (f.git) h += `\u003cdiv class=\"pad muted\">Arquivo interno do Git (compactado). Veja o conteúdo pela aba 🌿 Git.\u003c/div>`;\n  else h += `\u003cdiv class=\"pad muted\">${f.tooBig ? 'Arquivo de texto grande demais para exibir.' : 'Arquivo binário.'}\u003c/div>`;\n  return h;\n}\nfunction dlFile(s, ri) { const f = APP.slots[s].files.get(REF[ri]); if (f.text != null) download(f.text, basename(f.path)); else if (f.bytes) download(new Blob([f.bytes]), basename(f.path)); else toast('Conteúdo não disponível', 'warn'); }\n\n/* ----------------------------- PROBLEMAS ------------------------------ */\nfunction renderProblemas() {\n  const s = APP.active, A = APP.an[s], v = $('view'), F = APP.issF;\n  const cats = [...new Set(A.issues.map(i => i.cat))].sort();\n  const list = A.issues.map((x, i) => [x, i]).filter(([x]) => (F.sev === 'all' || x.sev === F.sev) && (F.cat === 'all' || x.cat === F.cat) && (!F.q || (x.msg + x.file + x.det).toLowerCase().includes(F.q.toLowerCase())));\n  v.innerHTML = `\u003cdiv class=\"row\" style=\"margin-bottom:8px\">\n      \u003cbutton class=\"btn sm ${F.sev === 'all' ? 'on' : ''}\" onclick=\"APP.issF.sev='all';render()\">Todos (${A.issues.length})\u003c/button>\n      ${SEVS.map(sv => `\u003cbutton class=\"btn sm ${F.sev === sv ? 'on' : ''}\" onclick=\"APP.issF.sev='${sv}';render()\">${SEV_LBL[sv]} (${A.bySev[sv]})\u003c/button>`).join('')}\n      \u003cselect onchange=\"APP.issF.cat=this.value;render()\">\u003coption value=\"all\">Todas as categorias\u003c/option>${cats.map(c => `\u003coption ${F.cat === c ? 'selected' : ''}>${esc(c)}\u003c/option>`).join('')}\u003c/select>\n      \u003cinput type=\"search\" placeholder=\"🔍 filtrar\" value=\"${esc(F.q)}\" onkeydown=\"if(event.key==='Enter'){APP.issF.q=this.value;render()}\" onsearch=\"APP.issF.q=this.value;render()\">\n      \u003cspan style=\"flex:1\">\u003c/span>\n      \u003cbutton class=\"btn sm ai\" onclick=\"Ctx.askIssues('${s}')\">🤖 IA: priorizar e dizer como corrigir\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"box\" style=\"padding:0\">${list.length ? list.map(([x, i]) => issueHTML(x, s, i)).join('') : '\u003cdiv class=\"pad muted\">Nada com esse filtro. 🎉\u003c/div>'}\u003c/div>\n    \u003cp class=\"hint\">A detecção é automática e não entende a \"intenção\" do código — use 🤖 em cada item para a IA confirmar se é realmente um problema e como resolver.\u003c/p>`;\n}\n\n/* --------------------------- DEPENDÊNCIAS ----------------------------- */\nfunction depRows(an) {\n  const m = new Map();\n  for (const pk of an.pkgs) for (const [type, key] of [['prod', 'dependencies'], ['dev', 'devDependencies'], ['peer', 'peerDependencies']])\n    for (const [n, ver] of Object.entries(pk.json[key] || {})) m.set(pk.path + '|' + n, { pkg: pk.path, name: n, ver: String(ver), type, real: String(ver).startsWith('catalog:') ? an.catalog[n] : null });\n  return m;\n}\nfunction verPill(r) {\n  if (!r) return '\u003cspan class=\"muted\">—\u003c/span>';\n  let cls = ''; if (r.ver.startsWith('catalog:') || r.name.startsWith('@replit/')) cls = 'bad'; else if (r.ver.startsWith('workspace:') || r.ver === '*' || r.ver === 'latest') cls = 'warn';\n  return `\u003cspan class=\"pill ${cls} mono\">${esc(r.ver)}\u003c/span>${r.real ? `\u003cspan class=\"muted mono\" style=\"font-size:11px\">→ ${esc(r.real)}\u003c/span>` : ''}`;\n}\nfunction renderDeps() {\n  const s = APP.active, A = APP.an[s], v = $('view');\n  if (!A.pkgs.length) { v.innerHTML = '\u003cdiv class=\"box muted\">Nenhum package.json encontrado. (Flutter/Python aparecem no Resumo e em Problemas.)\u003c/div>'; return; }\n  const rows = depRows(A);\n  let html = `\u003cp class=\"hint\" style=\"margin-bottom:8px\">\u003cspan class=\"pill bad\">vermelho\u003c/span> = só funciona no Replit/pnpm · \u003cspan class=\"pill warn\">amarelo\u003c/span> = arriscado. Com B carregado, a aba ⚖️ Comparar mostra o que mudou de versão.\u003c/p>`;\n  for (const pk of A.pkgs) {\n    const mine = [...rows.values()].filter(r => r.pkg === pk.path).sort((a, b) => a.type.localeCompare(b.type) || a.name.localeCompare(b.name));\n    html += `\u003cdiv class=\"box\">\u003ch3 class=\"mono\">${esc(pk.path)} ${pk.json.name ? `\u003cspan class=\"muted\">(${esc(pk.json.name)})\u003c/span>` : ''} \u003cspan class=\"pill\">${mine.length}\u003c/span>\u003c/h3>\n      \u003ctable class=\"t\">\u003ctr>\u003cth>Pacote\u003c/th>\u003cth>Versão\u003c/th>\u003cth>Tipo\u003c/th>\u003c/tr>${mine.map(r => `\u003ctr>\u003ctd class=\"mono\">${esc(r.name)}\u003c/td>\u003ctd>${verPill(r)}\u003c/td>\u003ctd class=\"muted\">${r.type}\u003c/td>\u003c/tr>`).join('')}\u003c/table>\u003c/div>`;\n  }\n  if (A.env.size) html += `\u003cdiv class=\"box\">\u003ch3>🔐 Variáveis de ambiente usadas no código\u003c/h3>\u003ctable class=\"t\">\u003ctr>\u003cth>Variável\u003c/th>\u003cth>Onde\u003c/th>\u003c/tr>${[...A.env].sort().map(([k, locs]) => `\u003ctr>\u003ctd class=\"mono\">${esc(k)}\u003c/td>\u003ctd>${locs.map(l => `\u003cspan class=\"loc\" style=\"color:var(--accent);cursor:pointer\" onclick=\"gotoFile('${s}',${R(l.file)},${l.line})\">${esc(l.file)}:${l.line}\u003c/span>`).join('\u003cbr>')}\u003c/td>\u003c/tr>`).join('')}\u003c/table>\u003c/div>`;\n  v.innerHTML = html;\n}\n\n/* -------------------------------- API --------------------------------- */\nfunction renderApi() {\n  const s = APP.active, A = APP.an[s], v = $('view'), T = APP.api;\n  const routes = A.routes.slice().sort((a, b) => a.path.localeCompare(b.path));\n  const calls = A.calls;\n  v.innerHTML = `\u003cdiv class=\"box\">\u003ch3>🧪 Testar a API (com o servidor rodando no seu PC)\u003c/h3>\n    \u003cdiv class=\"row\">\u003cinput type=\"text\" id=\"apiBase\" value=\"${esc(T.base)}\" style=\"flex:1;min-width:180px\" placeholder=\"http://localhost:5000\">\n    \u003cselect id=\"apiMethod\">${['GET', 'POST', 'PUT', 'PATCH', 'DELETE'].map(m => `\u003coption ${T.method === m ? 'selected' : ''}>${m}\u003c/option>`).join('')}\u003c/select>\n    \u003cinput type=\"text\" id=\"apiPath\" value=\"${esc(T.path)}\" style=\"flex:2;min-width:180px\">\u003c/div>\n    \u003ctextarea id=\"apiBody\" placeholder='Corpo JSON (para POST/PUT) ex.: {\"nome\":\"teste\"}' style=\"width:100%;margin-top:6px;min-height:50px\">${esc(T.body)}\u003c/textarea>\n    \u003cdiv class=\"row\" style=\"margin-top:6px\">\u003cbutton class=\"btn primary\" onclick=\"apiSend()\">▶ Enviar\u003c/button>\u003cbutton class=\"btn\" onclick=\"apiAllGet()\">▶ Testar todas as GET\u003c/button>\n    \u003cspan class=\"muted\" style=\"font-size:11px\">Se der \"Failed to fetch\": servidor desligado, porta errada, ou CORS bloqueando (normal quando o HTML é aberto de outro endereço).\u003c/span>\u003c/div>\n    \u003cpre id=\"apiResp\" class=\"mono\" style=\"margin-top:8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px;max-height:300px;overflow:auto;white-space:pre-wrap;font-size:12px\">${esc(T.resp || 'Resposta aparece aqui.')}\u003c/pre>\u003c/div>\n    \u003cdiv class=\"box\">\u003ch3>🛣️ Rotas encontradas no servidor \u003cspan class=\"pill\">${routes.length}\u003c/span> ${A.mounts.filter(Boolean).length ? `\u003cspan class=\"muted\" style=\"font-size:11px\">prefixos: ${A.mounts.filter(Boolean).map(esc).join(', ')}\u003c/span>` : ''}\u003c/h3>\n    ${routes.length ? `\u003ctable class=\"t\">\u003ctr>\u003cth>Método\u003c/th>\u003cth>Caminho\u003c/th>\u003cth>Arquivo\u003c/th>\u003cth>\u003c/th>\u003c/tr>${routes.map(r => `\u003ctr>\u003ctd>\u003cspan class=\"pill\">${r.method}\u003c/span>\u003c/td>\u003ctd class=\"mono\">${esc(r.path)}\u003c/td>\u003ctd>\u003cspan class=\"loc\" style=\"color:var(--accent);cursor:pointer\" onclick=\"gotoFile('${s}',${R(r.file)},${r.line})\">${esc(r.file)}${r.line ? ':' + r.line : ''}\u003c/span> \u003cspan class=\"muted\">${r.src}\u003c/span>\u003c/td>\u003ctd>\u003cbutton class=\"btn sm\" onclick=\"apiPick('${r.method}',${R(r.path)})\">usar\u003c/button>\u003c/td>\u003c/tr>`).join('')}\u003c/table>` : '\u003cp class=\"muted\">Nenhuma rota de servidor reconhecida (Express, Fastify, Hono, Flask, FastAPI, Next.js, OpenAPI).\u003c/p>'}\u003c/div>\n    \u003cdiv class=\"box\">\u003ch3>📞 Chamadas do frontend \u003cspan class=\"pill\">${calls.length}\u003c/span>\u003c/h3>\n    ${calls.length ? `\u003ctable class=\"t\">\u003ctr>\u003cth>Caminho\u003c/th>\u003cth>Status\u003c/th>\u003cth>Arquivo\u003c/th>\u003c/tr>${calls.map(c => `\u003ctr>\u003ctd class=\"mono\">${esc(c.raw)}\u003c/td>\u003ctd>${!routes.length ? '\u003cspan class=\"muted\">?\u003c/span>' : c.ok ? '\u003cspan class=\"pill ok\">rota existe\u003c/span>' : '\u003cspan class=\"pill bad\">rota não achada\u003c/span>'}\u003c/td>\u003ctd>\u003cspan class=\"loc\" style=\"color:var(--accent);cursor:pointer\" onclick=\"gotoFile('${s}',${R(c.file)},${c.line})\">${esc(c.file)}:${c.line}\u003c/span>\u003c/td>\u003c/tr>`).join('')}\u003c/table>` : '\u003cp class=\"muted\">Nenhuma chamada fetch/axios com caminho fixo encontrada.\u003c/p>'}\u003c/div>`;\n}\nfunction apiSave() { const T = APP.api; T.base = $('apiBase').value.trim().replace(/\\/+$/, ''); T.method = $('apiMethod').value; T.path = $('apiPath').value.trim(); T.body = $('apiBody').value; }\nfunction apiPick(m, ri) { apiSave(); const A = APP.an[APP.active]; let p = REF[ri]; if (!p.startsWith('/api') && A.mounts.includes('/api')) p = '/api' + p; APP.api.method = m === 'ANY' || m === 'ALL' ? 'GET' : m; APP.api.path = p; render(); }\nasync function apiReq(method, url, body) {\n  const t0 = performance.now();\n  const init = { method, headers: {} };\n  if (body && method !== 'GET') { init.body = body; init.headers['Content-Type'] = 'application/json'; }\n  const r = await fetch(url, init);\n  const txt = await r.text(); let pretty = txt;\n  try { pretty = JSON.stringify(JSON.parse(txt), null, 2); } catch (e) { }\n  return { status: r.status, ok: r.ok, ms: Math.round(performance.now() - t0), body: pretty, type: r.headers.get('content-type') || '' };\n}\nasync function apiSend() {\n  apiSave(); const T = APP.api; $('apiResp').textContent = '⏳ ...';\n  try { const r = await apiReq(T.method, T.base + T.path, T.body.trim()); T.resp = `${r.ok ? '✅' : '❌'} HTTP ${r.status} · ${r.ms} ms · ${r.type}\\n\\n${r.body.slice(0, 20000)}`; }\n  catch (e) { T.resp = `❌ ${e.message}\\n\\nVerifique se o servidor está rodando em ${T.base} e se permite CORS.`; }\n  $('apiResp').textContent = T.resp;\n}\nasync function apiAllGet() {\n  apiSave(); const A = APP.an[APP.active], T = APP.api;\n  const gets = [...new Set(A.routes.filter(r => r.method === 'GET' && !/[:{[*]/.test(r.path)).map(r => (!r.path.startsWith('/api') && A.mounts.includes('/api') && r.src !== 'Next.js') ? '/api' + r.path : r.path))];\n  if (!gets.length) { toast('Nenhuma rota GET sem parâmetros', 'warn'); return; }\n  let out = '';\n  for (const p of gets) { $('apiResp').textContent = out + `⏳ ${p}...`; try { const r = await apiReq('GET', T.base + p); out += `${r.ok ? '✅' : '❌'} ${r.status} ${r.ms}ms  GET ${p}\\n`; } catch (e) { out += `❌ erro  GET ${p} — ${e.message}\\n`; } }\n  T.resp = out; $('apiResp').textContent = out;\n}\n\n/* -------------------------------- GIT --------------------------------- */\nasync function renderGit() {\n  const s = APP.active, v = $('view'), repos = APP.repos[s], G = APP.git[s];\n  if (!repos.length) { v.innerHTML = `\u003cdiv class=\"box\">\u003ch3>🌿 Sem pasta .git\u003c/h3>\u003cp class=\"muted\" style=\"line-height:1.7\">Este projeto veio sem o histórico do Git. Para analisar o histórico (o que foi consertado, quando e onde), compacte a pasta do projeto \u003cb>incluindo a pasta oculta .git\u003c/b>.\u003cbr>No Windows: mostre itens ocultos (Explorador → Exibir → Itens ocultos) antes de compactar.\u003cbr>Do Replit: baixe o projeto inteiro (\"Download as zip\") — ele costuma incluir a .git.\u003c/p>\u003c/div>`; return; }\n  const repo = repos[G.repo] || repos[0];\n  const h = repo.head(), st = repo.stats();\n  v.className = 'full';\n  const head = `\u003cdiv class=\"viewbar\" style=\"border-bottom:1px solid var(--border)\">${repos.length > 1 ? `\u003cselect onchange=\"APP.git['${s}']={repo:+this.value,sel:null,file:null,log:null,ch:null};render()\">${repos.map((r, i) => `\u003coption value=\"${i}\" ${i === G.repo ? 'selected' : ''}>${esc(r.base)}\u003c/option>`).join('')}\u003c/select>` : `\u003cspan class=\"mono\">${esc(repo.base)}\u003c/span>`}\n    \u003cspan>branch \u003cb>${esc(h.branch)}\u003c/b>\u003c/span>\u003cspan class=\"muted\">${st.loose} objetos soltos · ${st.packed} em ${st.packs} pack(s)\u003c/span>\n    ${[...repo.branches().keys()].length > 1 ? `\u003cspan class=\"muted\">branches: ${[...repo.branches().keys()].map(esc).join(', ')}\u003c/span>` : ''}\u003c/div>`;\n  v.innerHTML = head + `\u003cdiv class=\"pad muted\">⏳ Lendo histórico...\u003c/div>`;\n  if (!G.log) { try { G.log = await repo.log(h.sha); } catch (e) { G.log = { commits: [], missing: 1, err: e.message }; } }\n  const log = G.log;\n  const reflog = repo.reflog();\n  let left = '';\n  if (log.commits.length) {\n    left = `\u003cdiv class=\"pad muted\" style=\"font-size:11px\">${log.commits.length} commit(s)${log.more ? '+ (limite)' : ''}${log.missing ? ` · ${log.missing} não encontrado(s) (histórico raso/incompleto)` : ''}\u003c/div>` +\n      log.commits.map(c => `\u003cdiv class=\"iss\" style=\"cursor:pointer;${G.sel === c.sha ? 'background:rgba(88,166,255,.14)' : ''}\" onclick=\"gitSel('${s}','${c.sha}')\">\u003cdiv class=\"body\">\u003cdiv class=\"msg\">${esc(c.msg.split('\\n')[0].slice(0, 120) || '(sem mensagem)')}\u003c/div>\u003cdiv class=\"det mono\">${c.sha.slice(0, 8)} · ${fmtDate(c.time)} · ${esc(c.author || '')}\u003c/div>\u003c/div>\u003c/div>`).join('');\n  } else if (reflog.length) {\n    left = `\u003cdiv class=\"pad muted\">Não consegui ler os objetos (${esc(log.err || 'faltando')}). Histórico local (reflog):\u003c/div>` + reflog.map(r => `\u003cdiv class=\"iss\">\u003cdiv class=\"body\">\u003cdiv class=\"msg\">${esc(r.msg)}\u003c/div>\u003cdiv class=\"det mono\">${r.sha.slice(0, 8)} · ${fmtDate(r.time)} · ${esc(r.author)}\u003c/div>\u003c/div>\u003c/div>`).join('');\n  } else left = '\u003cdiv class=\"pad muted\">Nenhum commit encontrado.\u003c/div>';\n  let right = '\u003cdiv class=\"pad muted\">Escolha um commit à esquerda para ver \u003cb>o que mudou, onde e como\u003c/b>.\u003c/div>';\n  if (G.sel) {\n    const c = log.commits.find(x => x.sha === G.sel);\n    if (!G.ch || G.ch.sha !== G.sel) { v.innerHTML = head + `\u003cdiv class=\"split\">\u003cdiv class=\"left\">${left}\u003c/div>\u003cdiv class=\"right\">\u003cdiv class=\"pad muted\">⏳ Calculando mudanças...\u003c/div>\u003c/div>\u003c/div>`; G.ch = { sha: G.sel, ...(await repo.changes(c)) }; }\n    const ch = G.ch;\n    right = `\u003cdiv class=\"codehead\">\u003cspan class=\"path\">${esc(c.msg.split('\\n')[0])}\u003cbr>\u003cspan class=\"muted\">${c.sha.slice(0, 10)} · ${fmtDate(c.time)} · ${esc(c.author || '')} ${ch.parent ? '' : '· (primeiro commit)'}\u003c/span>\u003c/span>\n      \u003cbutton class=\"btn sm ai\" onclick=\"Ctx.askCommit('${s}')\">🤖 Explicar commit\u003c/button>\n      \u003cbutton class=\"btn sm\" onclick=\"commitToSlot('${s}','A')\">→ usar como A\u003c/button>\u003cbutton class=\"btn sm\" onclick=\"commitToSlot('${s}','B')\">→ usar como B\u003c/button>\u003c/div>`;\n    if (c.msg.includes('\\n')) right += `\u003cdiv class=\"pad mono\" style=\"white-space:pre-wrap;font-size:12px;border-bottom:1px solid var(--border)\">${esc(c.msg)}\u003c/div>`;\n    right += `\u003cdiv style=\"border-bottom:1px solid var(--border);max-height:34vh;overflow:auto\">${ch.list.length ? ch.list.slice(0, 800).map(x => `\u003cdiv class=\"f tree\" style=\"padding:3px 10px;cursor:pointer;${G.file === x.path ? 'background:rgba(88,166,255,.14)' : ''}\" onclick=\"gitFile('${s}',${R(x.path)})\">\u003cspan class=\"st ${x.st}\">${x.st}\u003c/span> \u003cspan class=\"mono\">${esc(x.path)}\u003c/span>\u003c/div>`).join('') : '\u003cdiv class=\"pad muted\">Nenhum arquivo alterado.\u003c/div>'}\u003c/div>\u003cdiv id=\"gitDiff\">\u003c/div>`;\n  }\n  v.innerHTML = head + `\u003cdiv class=\"split\">\u003cdiv class=\"left\">${left}\u003c/div>\u003cdiv class=\"right\">${right}\u003c/div>\u003c/div>`;\n  if (G.file) showGitDiff(s);\n}\nfunction gitSel(s, sha) { const G = APP.git[s]; G.sel = sha; G.file = null; render(); }\nfunction gitFile(s, ri) { APP.git[s].file = REF[ri]; render(); }\nasync function showGitDiff(s) {\n  const G = APP.git[s], repo = APP.repos[s][G.repo], x = G.ch.list.find(y => y.path === G.file); if (!x) return;\n  const el = $('gitDiff'); el.innerHTML = '\u003cdiv class=\"pad muted\">⏳\u003c/div>';\n  const [a, b] = await Promise.all([repo.blobText(x.a), repo.blobText(x.b)]);\n  if (a === null || b === null) { el.innerHTML = '\u003cdiv class=\"pad muted\">Conteúdo não disponível no .git (histórico incompleto).\u003c/div>'; return; }\n  G.lastDiff = { path: x.path, a, b };\n  el.innerHTML = `\u003cdiv class=\"codehead\">\u003cspan class=\"path\">${esc(x.path)}\u003c/span>\u003cbutton class=\"btn sm ai\" onclick=\"Ctx.askGitFile('${s}')\">🤖 O que mudou aqui?\u003c/button>\u003c/div>` + renderDiff(a, b, 'antes', 'depois do commit');\n}\nasync function commitToSlot(s, target) {\n  const G = APP.git[s], repo = APP.repos[s][G.repo], c = G.log.commits.find(x => x.sha === G.sel);\n  if (APP.slots[target] && target !== s && !confirm(`Substituir o projeto ${target} pela versão deste commit?`)) return;\n  if (target === s && !confirm(`Isto troca o projeto ${s} (inclusive o .git) pela versão do commit. Continuar?`)) return;\n  busy(true, 'Montando versão do commit...');\n  try {\n    const tree = await repo.flatten(c.tree);\n    const proj = newProject(`${APP.slots[s].name} @ ${c.sha.slice(0, 7)}`);\n    let i = 0;\n    for (const [p, sha] of tree) {\n      await addEntry(proj, p, async () => { const o = await repo.read(sha); return o ? o.data : null; }, { skipHeavy: true });\n      if (++i % 100 === 0) { $('busyTxt').textContent = `Montando ${i} / ${tree.size}...`; await tick(); }\n    }\n    setSlot(target, proj);\n    toast(`✅ Versão ${c.sha.slice(0, 7)} carregada em ${target}`, 'success');\n    if (APP.slots.A && APP.slots.B) setTab('comparar'); else render();\n  } catch (e) { toast('❌ ' + e.message, 'error'); }\n  busy(false);\n}\n\n/* ------------------------------ COMPARAR ------------------------------ */\nfunction sameFile(f1, f2) {\n  if (f1.text != null && f2.text != null) return f1.text === f2.text;\n  if (f1.size !== f2.size) return false;\n  if (f1.bytes && f2.bytes) { for (let i = 0; i \u003c f1.bytes.length; i++) if (f1.bytes[i] !== f2.bytes[i]) return false; return true; }\n  return true;\n}\nfunction compareFiles() {\n  const A = APP.slots.A, B = APP.slots.B, incGit = APP.cmp.git;\n  const out = [];\n  const keys = new Set([...A.files.keys(), ...B.files.keys()]);\n  for (const p of keys) {\n    const a = A.files.get(p), b = B.files.get(p);\n    if (!incGit && ((a && a.git) || (b && b.git))) continue;\n    if (a && !b) out.push({ st: 'D', path: p }); else if (!a && b) out.push({ st: 'A', path: p });\n    else if (!sameFile(a, b)) out.push({ st: 'M', path: p, a, b }); else out.push({ st: '=', path: p });\n  }\n  return out.sort((x, y) => x.path.localeCompare(y.path));\n}\nfunction renderComparar() {\n  const v = $('view');\n  if (!APP.slots.A || !APP.slots.B) { v.innerHTML = `\u003cdiv class=\"box\">\u003ch3>⚖️ Comparar duas versões\u003c/h3>\u003cp class=\"muted\" style=\"line-height:1.7\">Carregue os dois projetos: \u003cspan class=\"tag A\">A\u003c/span> (ex.: versão antiga / que funcionava) e \u003cspan class=\"tag B\">B\u003c/span> (versão nova / com bug). Dê nomes a eles no topo.\u003cbr>Dica: na aba 🌿 Git, você pode usar qualquer commit antigo como A ou B.\u003c/p>\u003cdiv class=\"big-btns\">\u003cbutton class=\"btn\" onclick=\"openLoad('A')\">📂 Carregar A\u003c/button>\u003cbutton class=\"btn\" onclick=\"openLoad('B')\">📂 Carregar B\u003c/button>\u003c/div>\u003c/div>`; return; }\n  const C = APP.cmp, nA = APP.slots.A.name, nB = APP.slots.B.name;\n  const list = compareFiles();\n  const cnt = { A: 0, D: 0, M: 0, '=': 0 }; list.forEach(x => cnt[x.st]++);\n  const iA = APP.an.A.issues, iB = APP.an.B.issues;\n  const kA = new Set(iA.map(i => i.key)), kB = new Set(iB.map(i => i.key));\n  const fixed = iA.filter(i => !kB.has(i.key)), intro = iB.filter(i => !kA.has(i.key));\n  const dA = depRows(APP.an.A), dB = depRows(APP.an.B);\n  const depDiff = [];\n  const depKey = r => r.pkg + '|' + r.name;\n  for (const k of new Set([...dA.keys(), ...dB.keys()])) { const a = dA.get(k), b = dB.get(k); if (!a || !b || a.ver !== b.ver) depDiff.push({ k, a, b, name: (a || b).name, pkg: (a || b).pkg }); }\n  APP._cmp = { list, fixed, intro, depDiff };\n  let html = `\u003cdiv class=\"viewbar\" style=\"border-bottom:1px solid var(--border)\">\u003cspan class=\"tag A\">A\u003c/span>\u003cb>${esc(nA)}\u003c/b> \u003cspan class=\"muted\">×\u003c/span> \u003cspan class=\"tag B\">B\u003c/span>\u003cb>${esc(nB)}\u003c/b>\n    \u003cspan class=\"pill warn\">~${cnt.M} alterados\u003c/span>\u003cspan class=\"pill ok\">+${cnt.A} só em B\u003c/span>\u003cspan class=\"pill bad\">−${cnt.D} só em A\u003c/span>\u003cspan class=\"pill\">=${cnt['=']} iguais\u003c/span>\n    \u003cspan class=\"pill ok\">✔ ${fixed.length} problemas resolvidos\u003c/span>\u003cspan class=\"pill bad\">✖ ${intro.length} novos\u003c/span>\u003cspan class=\"pill\">📦 ${depDiff.length} deps mudaram\u003c/span>\n    \u003cspan style=\"flex:1\">\u003c/span>\u003cbutton class=\"btn sm ai\" onclick=\"Ctx.askCompare()\">🤖 IA: qual versão é melhor e o que foi consertado?\u003c/button>\u003cbutton class=\"btn sm\" onclick=\"copyText(compareReport())\">📋 Copiar comparação\u003c/button>\u003c/div>\n    \u003cdiv class=\"viewbar\">${[['arquivos', '📁 Arquivos'], ['problemas', '🩺 Problemas'], ['deps', '📦 Dependências']].map(([k, l]) => `\u003cbutton class=\"btn sm ${C.sub === k ? 'on' : ''}\" onclick=\"APP.cmp.sub='${k}';render()\">${l}\u003c/button>`).join('')}\u003c/div>`;\n  v.className = 'full';\n  if (C.sub === 'problemas') {\n    html += `\u003cdiv style=\"overflow:auto;padding:10px\">\u003cdiv class=\"box\" style=\"padding:0\">\u003ch3 class=\"pad\" style=\"color:var(--green)\">✔ Existiam em A e sumiram em B (${fixed.length}) — provavelmente consertados\u003c/h3>${fixed.map(i => issueHTML(i, 'A')).join('') || '\u003cdiv class=\"pad muted\">Nenhum.\u003c/div>'}\u003c/div>\n      \u003cdiv class=\"box\" style=\"padding:0\">\u003ch3 class=\"pad\" style=\"color:var(--red)\">✖ Apareceram em B (${intro.length}) — possivelmente introduzidos\u003c/h3>${intro.map(i => issueHTML(i, 'B')).join('') || '\u003cdiv class=\"pad muted\">Nenhum.\u003c/div>'}\u003c/div>\n      \u003cdiv class=\"box\">\u003ch3>= Presentes nas duas (${iA.filter(i => kB.has(i.key)).length})\u003c/h3>\u003cp class=\"muted\">Veja em 🩺 Problemas de cada projeto.\u003c/p>\u003c/div>\u003c/div>`;\n    v.innerHTML = html; return;\n  }\n  if (C.sub === 'deps') {\n    html += `\u003cdiv style=\"overflow:auto;padding:10px\">\u003cdiv class=\"box\">${depDiff.length ? `\u003ctable class=\"t\">\u003ctr>\u003cth>Pacote\u003c/th>\u003cth>package.json\u003c/th>\u003cth>🅰 ${esc(nA)}\u003c/th>\u003cth>🅱 ${esc(nB)}\u003c/th>\u003c/tr>${depDiff.sort((x, y) => x.k.localeCompare(y.k)).map(d => `\u003ctr>\u003ctd class=\"mono\">${esc(d.name)}\u003c/td>\u003ctd class=\"mono muted\">${esc(d.pkg)}\u003c/td>\u003ctd>${verPill(d.a)}\u003c/td>\u003ctd>${verPill(d.b)}\u003c/td>\u003c/tr>`).join('')}\u003c/table>` : '\u003cp class=\"muted\">Dependências idênticas.\u003c/p>'}\u003c/div>\u003c/div>`;\n    v.innerHTML = html; return;\n  }\n  const shown = list.filter(x => (C.filter === 'all' || (C.filter === 'changed' ? x.st !== '=' : x.st === C.filter)) && (!C.q || x.path.toLowerCase().includes(C.q.toLowerCase())));\n  let left = `\u003cdiv class=\"pad row\" style=\"border-bottom:1px solid var(--border)\">${[['changed', 'Mudou'], ['M', '~'], ['A', '+'], ['D', '−'], ['all', 'Todos']].map(([k, l]) => `\u003cbutton class=\"btn sm ${C.filter === k ? 'on' : ''}\" onclick=\"APP.cmp.filter='${k}';render()\">${l}\u003c/button>`).join('')}\n    \u003clabel class=\"check\" style=\"font-size:11px\">\u003cinput type=\"checkbox\" ${C.git ? 'checked' : ''} onchange=\"APP.cmp.git=this.checked;render()\"> .git\u003c/label>\n    \u003cinput type=\"search\" placeholder=\"🔍\" value=\"${esc(C.q)}\" style=\"width:100%\" onkeydown=\"if(event.key==='Enter'){APP.cmp.q=this.value;render()}\" onsearch=\"APP.cmp.q=this.value;render()\">\u003c/div>\u003cdiv class=\"tree\">`;\n  const byPath = new Map(shown.map(x => [x.path, x]));\n  if (C.q || shown.length \u003c 60) left += shown.map(x => cmpRow(x, true)).join('');\n  else left += treeHTML(buildTree(shown.map(x => x.path)), '', { fileRow: p => cmpRow(byPath.get(p), false), openAll: shown.length \u003c 150 });\n  left += (shown.length ? '' : '\u003cdiv class=\"pad muted\">Nada aqui.\u003c/div>') + '\u003c/div>';\n  let right = `\u003cdiv class=\"pad muted\">Escolha um arquivo para ver as diferenças lado a lado.\u003cbr>\u003cbr>\u003cspan class=\"st M\">M\u003c/span> alterado · xTokens;\n    $('setModal').classList.add('open');\n  },\n  collect() {\n    Object.keys(PROVIDERS).forEach(k => { const e = $('k_' + k); if (e) SET.keys[k] = e.value.replace(/\\s+/g, ''); });\n    SET.ollamaUrl = $('setOllama').value.trim() || 'http://localhost:11434'; SET.customBase = $('setCustom').value.trim();\n    SET.maxCtx = Math.max(5000, +$('setMaxCtx').value || 180000); SET.maxTokens = Math.max(256, +$('setMaxTok').value || 8192);\n    saveSettings();\n  },\n  save() { this.collect(); closeModal('setModal'); toast('✅ Salvo', 'success'); },\n  async test() {\n    if ($('setModal').classList.contains('open')) this.collect();\n    AI.fill(); const p = SET.provider, m = $('aiModel').value;\n    toast(`🧪 Testando ${PROVIDERS[p].name} · ${m}...`);\n    try { const r = await AIC.call(p, m, 'Responda só OK.', [{ role: 'user', content: 'Diga OK' }]); toast(`✅ Funcionando: \"${r.trim().slice(0, 30)}\"`, 'success'); } catch (e) { toast('❌ ' + e.message, 'error'); }\n  }\n};\n\n/* =====================================================================\n   ARRASTAR E SOLTAR\n   ===================================================================== */\nasync function entriesToFiles(items) {\n  const out = []; let hasDir = false;\n  const walk = (entry, path) => new Promise(res => {\n    if (entry.isFile) entry.file(f => { f._rel = path + f.name; out.push(f); res(); }, () => res());\n    else if (entry.isDirectory) {\n      hasDir = true;\n      const rd = entry.createReader(), all = [];\n      const read = () => rd.readEntries(async es => { if (!es.length) { for (const e of all) await walk(e, path + entry.name + '/'); res(); } else { all.push(...es); read(); } }, () => res());\n      read();\n    } else res();\n  });\n  const entries = [...items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);\n  for (const e of entries) await walk(e, '');\n  return { files: out, hasDir };\n}\nfunction setupDrop() {\n  let depth = 0;\n  window.addEventListener('dragenter', e => { if (![...e.dataTransfer.types].includes('Files')) return; e.preventDefault(); depth++; $('dropOverlay').classList.add('show'); $('dropHint').textContent = !APP.slots.A ? 'vai para A' : !APP.slots.B ? 'vai para B' : 'solte em cima de A ou B no topo para escolher'; });\n  window.addEventListener('dragleave', e => { if (--depth \u003c= 0) { depth = 0; $('dropOverlay').classList.remove('show'); } });\n  window.addEventListener('dragover', e => { e.preventDefault(); ['A', 'B'].forEach(s => $('slot' + s).classList.toggle('drop', $('slot' + s).contains(e.target))); });\n  window.addEventListener('drop', async e => {\n    e.preventDefault(); depth = 0; $('dropOverlay').classList.remove('show');\n    let slot = $('slotB').contains(e.target) ? 'B' : $('slotA').contains(e.target) ? 'A' : (!APP.slots.A ? 'A' : !APP.slots.B ? 'B' : null);\n    ['A', 'B'].forEach(s => $('slot' + s).classList.remove('drop'));\n    if (!slot) slot = confirm('Os dois lados já têm projeto.\\nOK = substituir A · Cancelar = substituir B') ? 'A' : 'B';\n    const { files, hasDir } = await entriesToFiles(e.dataTransfer.items);\n    if (!files.length) return;\n    const allArchives = !hasDir && files.every(f => /\\.(zip|tar|tgz|gz|taz)$/i.test(f.name));\n    loadInto(slot, files, allArchives ? 'archive' : 'folder', '');\n  });\n}\n\n/* =====================================================================\n   INÍCIO\n   ===================================================================== */\nfunction INIT() {\n  loadSettings();\n  if (typeof DecompressionStream === 'undefined') toast('⚠️ Navegador antigo: atualize o Chrome/Edge para ler zip/tar.gz.', 'warn');\n  setupDrop();\n  render();\n  document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.modal-bg.open').forEach(m => m.classList.remove('open')); });\n  document.querySelectorAll('.modal-bg').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); }));\n  window.addEventListener('beforeunload', e => { if (APP.slots.A || APP.slots.B) { e.preventDefault(); e.returnValue = ''; } });\n}\nif (typeof document !== 'undefined' && document.getElementById('view')) INIT();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","l":"html","n":""},{"p":"prom.html","t":"\u003c!DOCTYPE html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  \u003ctitle>SK-Prompt Manager — Templates + Histórico\u003c/title>\n  \u003cstyle>\n    * {\n      margin: 0;\n      padding: 0;\n      box-sizing: border-box;\n    }\n\n    body {\n      font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif;\n      background: #0a0e27;\n      color: #e0e0e0;\n      height: 100vh;\n      display: flex;\n      overflow: hidden;\n    }\n\n    .container {\n      display: flex;\n      width: 100%;\n      height: 100%;\n    }\n\n    /* ═══ SIDEBAR ═══ */\n    .sidebar {\n      width: 300px;\n      background: #0f1419;\n      border-right: 1px solid #1e2139;\n      display: flex;\n      flex-direction: column;\n      overflow-y: auto;\n    }\n\n    .sidebar-header {\n      padding: 16px;\n      border-bottom: 1px solid #1e2139;\n      background: #0a0e27;\n    }\n\n    .sidebar-title {\n      font-size: 12px;\n      font-weight: 700;\n      color: #8b949e;\n      text-transform: uppercase;\n      letter-spacing: 1px;\n    }\n\n    .sidebar-section {\n      padding: 12px;\n      border-bottom: 1px solid #1e2139;\n    }\n\n    .sidebar-section-title {\n      font-size: 10px;\n      font-weight: 600;\n      color: #6e7681;\n      text-transform: uppercase;\n      letter-spacing: 0.5px;\n      margin-bottom: 8px;\n    }\n\n    .sidebar-btn {\n      width: 100%;\n      padding: 10px 12px;\n      background: transparent;\n      border: 1px solid #1e2139;\n      border-radius: 6px;\n      color: #c9d1d9;\n      cursor: pointer;\n      font-size: 12px;\n      font-weight: 600;\n      transition: all 0.2s;\n      text-align: left;\n      margin-bottom: 6px;\n    }\n\n    .sidebar-btn:hover {\n      background: #161b22;\n      border-color: #3b82f6;\n      color: #58a6ff;\n    }\n\n    .sidebar-btn.active {\n      background: #1f6feb;\n      border-color: #1f6feb;\n      color: white;\n    }\n\n    /* ═══ MAIN ═══ */\n    .main {\n      flex: 1;\n      display: flex;\n      flex-direction: column;\n      background: #0a0e27;\n    }\n\n    .header {\n      padding: 16px;\n      background: #0f1419;\n      border-bottom: 1px solid #1e2139;\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n    }\n\n    .header-title {\n      font-size: 14px;\n      font-weight: 600;\n      color: #c9d1d9;\n    }\n\n    .header-actions {\n      display: flex;\n      gap: 8px;\n    }\n\n    .btn-icon {\n      width: 36px;\n      height: 36px;\n      background: transparent;\n      border: 1px solid #1e2139;\n      border-radius: 6px;\n      color: #8b949e;\n      cursor: pointer;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      font-size: 16px;\n      transition: all 0.2s;\n    }\n\n    .btn-icon:hover {\n      background: #161b22;\n      border-color: #3b82f6;\n      color: #58a6ff;\n    }\n\n    .content {\n      flex: 1;\n      overflow-y: auto;\n      padding: 16px;\n      display: flex;\n      flex-direction: column;\n      gap: 16px;\n    }\n\n    .section {\n      background: #0f1419;\n      border: 1px solid #1e2139;\n      border-radius: 8px;\n      padding: 16px;\n      display: flex;\n      flex-direction: column;\n      gap: 12px;\n    }\n\n    .section-title {\n      font-size: 13px;\n      font-weight: 600;\n      color: #c9d1d9;\n    }\n\n    .form-group {\n      display: flex;\n      flex-direction: column;\n      gap: 6px;\n    }\n\n    .form-label {\n      font-size: 11px;\n      font-weight: 600;\n      color: #8b949e;\n      text-transform: uppercase;\n      letter-spacing: 0.5px;\n    }\n\n    .form-input,\n    .form-textarea,\n    .form-select {\n      padding: 10px 12px;\n      background: #0a0e27;\n      border: 1px solid #1e2139;\n      border-radius: 6px;\n      color: #c9d1d9;\n      font-size: 12px;\n      font-family: inherit;\n    }\n\n    .form-textarea {\n      resize: vertical;\n      min-height: 100px;\n    }\n\n    .form-input:focus,\n    .form-textarea:focus,\n    .form-select:focus {\n      outline: none;\n      border-color: #3b82f6;\n      box-shadow: 0 0 0 2px rgba(31, 110, 251, 0.1);\n    }\n\n    .btn-group {\n      display: flex;\n      gap: 8px;\n      flex-wrap: wrap;\n    }\n\n    .btn {\n      padding: 10px 16px;\n      background: #1f6feb;\n      border: none;\n      border-radius: 6px;\n      color: white;\n      cursor: pointer;\n      font-size: 12px;\n      font-weight: 600;\n      transition: all 0.2s;\n    }\n\n    .btn:hover {\n      background: #388bfd;\n    }\n\n    .btn.secondary {\n      background: transparent;\n      border: 1px solid #1e2139;\n      color: #8b949e;\n    }\n\n    .btn.secondary:hover {\n      background: #161b22;\n      border-color: #3b82f6;\n      color: #58a6ff;\n    }\n\n    .btn.danger {\n      background: #da3633;\n    }\n\n    .btn.danger:hover {\n      background: #f85149;\n    }\n\n    .list-item {\n      background: #0a0e27;\n      border: 1px solid #1e2139;\n      border-radius: 6px;\n      padding: 12px;\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      gap: 12px;\n    }\n\n    .list-item-content {\n      flex: 1;\n      display: flex;\n      flex-direction: column;\n      gap: 4px;\n    }\n\n    .list-item-title {\n      font-size: 12px;\n      font-weight: 600;\n      color: #c9d1d9;\n    }\n\n    .list-item-meta {\n      font-size: 10px;\n      color: #6e7681;\n    }\n\n    .list-item-actions {\n      display: flex;\n      gap: 4px;\n    }\n\n    .btn-small {\n      width: 32px;\n      height: 32px;\n      background: transparent;\n      border: 1px solid #1e2139;\n      border-radius: 4px;\n      color: #8b949e;\n      cursor: pointer;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      font-size: 12px;\n      transition: all 0.2s;\n    }\n\n    .btn-small:hover {\n      background: #161b22;\n      border-color: #3b82f6;\n      color: #58a6ff;\n    }\n\n    .btn-small.delete:hover {\n      background: #da3633;\n      border-color: #da3633;\n      color: white;\n    }\n\n    /* ═══ MODAL ═══ */\n    .modal {\n      display: none;\n      position: fixed;\n      inset: 0;\n      background: rgba(0, 0, 0, 0.7);\n      backdrop-filter: blur(4px);\n      z-index: 100;\n      align-items: center;\n      justify-content: center;\n    }\n\n    .modal.open {\n      display: flex;\n    }\n\n    .modal-content {\n      background: #0f1419;\n      border: 1px solid #1e2139;\n      border-radius: 8px;\n      padding: 24px;\n      max-width: 700px;\n      width: 90%;\n      max-height: 80vh;\n      overflow-y: auto;\n      display: flex;\n      flex-direction: column;\n      gap: 16px;\n    }\n\n    .modal-title {\n      font-size: 14px;\n      font-weight: 600;\n      color: #c9d1d9;\n    }\n\n    .modal-buttons {\n      display: flex;\n      gap: 8px;\n      justify-content: flex-end;\n    }\n\n    ::-webkit-scrollbar {\n      width: 8px;\n    }\n\n    ::-webkit-scrollbar-track {\n      background: transparent;\n    }\n\n    ::-webkit-scrollbar-thumb {\n      background: #1e2139;\n      border-radius: 4px;\n    }\n\n    ::-webkit-scrollbar-thumb:hover {\n      background: #30363d;\n    }\n\n    .hidden {\n      display: none;\n    }\n\n    .tag {\n      display: inline-block;\n      padding: 4px 8px;\n      background: #1f6feb;\n      color: white;\n      border-radius: 4px;\n      font-size: 10px;\n      font-weight: 600;\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"container\">\n    \u003c!-- SIDEBAR -->\n    \u003cdiv class=\"sidebar\">\n      \u003cdiv class=\"sidebar-header\">\n        \u003cdiv class=\"sidebar-title\">🎯 SK-Prompt\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"sidebar-section\">\n        \u003cdiv class=\"sidebar-section-title\">Templates\u003c/div>\n        \u003cbutton class=\"sidebar-btn\" onclick=\"selectTemplate('juridico')\">📋 Jurídico\u003c/button>\n        \u003cbutton class=\"sidebar-btn\" onclick=\"selectTemplate('html')\">💻 HTML/CSS\u003c/button>\n        \u003cbutton class=\"sidebar-btn\" onclick=\"selectTemplate('python')\">🐍 Python\u003c/button>\n        \u003cbutton class=\"sidebar-btn\" onclick=\"selectTemplate('sql')\">📊 SQL\u003c/button>\n        \u003cbutton class=\"sidebar-btn\" onclick=\"selectTemplate('nodejs')\">⚡ Node.js\u003c/button>\n        \u003cbutton class=\"sidebar-btn\" onclick=\"selectTemplate('react')\">⚛️ React\u003c/button>\n        \u003cbutton class=\"sidebar-btn\" onclick=\"selectTemplate('devops')\">🔧 DevOps\u003c/button>\n        \u003cbutton class=\"sidebar-btn\" onclick=\"selectTemplate('design')\">🎨 Design\u003c/button>\n      \u003c/div>\n\n      \u003cdiv class=\"sidebar-section\">\n        \u003cdiv class=\"sidebar-section-title\">Ações\u003c/div>\n        \u003cbutton class=\"sidebar-btn\" onclick=\"openNewPrompt()\">➕ Novo Prompt\u003c/button>\n        \u003cbutton class=\"sidebar-btn\" onclick=\"viewHistorico()\">📜 Histórico\u003c/button>\n        \u003cbutton class=\"sidebar-btn\" onclick=\"exportAll()\">📤 Exportar Tudo\u003c/button>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- MAIN -->\n    \u003cdiv class=\"main\">\n      \u003cdiv class=\"header\">\n        \u003cdiv class=\"header-title\" id=\"headerTitle\">🎯 Gerenciador de Prompts\u003c/div>\n        \u003cdiv class=\"header-actions\">\n          \u003cbutton class=\"btn-icon\" title=\"Salvar\" onclick=\"savePrompt()\">💾\u003c/button>\n          \u003cbutton class=\"btn-icon\" title=\"Limpar\" onclick=\"clearForm()\">🗑️\u003c/button>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"content\" id=\"mainContent\">\n        \u003c!-- EDITOR DE PROMPT -->\n        \u003cdiv class=\"section\">\n          \u003cdiv class=\"section-title\">📝 Editor de Prompt\u003c/div>\n          \u003cdiv class=\"form-group\">\n            \u003clabel class=\"form-label\">Nome do Prompt\u003c/label>\n            \u003cinput type=\"text\" id=\"promptName\" class=\"form-input\" placeholder=\"Ex: Análise de Código Python\">\n          \u003c/div>\n          \u003cdiv class=\"form-group\">\n            \u003clabel class=\"form-label\">Tipo\u003c/label>\n            \u003cselect id=\"promptType\" class=\"form-select\">\n              \u003coption value=\"juridico\">📋 Jurídico\u003c/option>\n              \u003coption value=\"html\">💻 HTML/CSS\u003c/option>\n              \u003coption value=\"python\">🐍 Python\u003c/option>\n              \u003coption value=\"sql\">📊 SQL\u003c/option>\n              \u003coption value=\"nodejs\">⚡ Node.js\u003c/option>\n              \u003coption value=\"react\">⚛️ React\u003c/option>\n              \u003coption value=\"devops\">🔧 DevOps\u003c/option>\n              \u003coption value=\"design\">🎨 Design\u003c/option>\n              \u003coption value=\"custom\">✨ Customizado\u003c/option>\n            \u003c/select>\n          \u003c/div>\n          \u003cdiv class=\"form-group\">\n            \u003clabel class=\"form-label\">O que você quer (Objetivo)\u003c/label>\n            \u003ctextarea id=\"promptWhat\" class=\"form-textarea\" placeholder=\"Ex: Quero um chat com memória que funcione em HTML...\">\u003c/textarea>\n          \u003c/div>\n          \u003cdiv class=\"form-group\">\n            \u003clabel class=\"form-label\">O que você NÃO quer (Restrições)\u003c/label>\n            \u003ctextarea id=\"promptNotWant\" class=\"form-textarea\" placeholder=\"Ex: Não quero código em pedaços, não quero APIs pagas...\">\u003c/textarea>\n          \u003c/div>\n          \u003cdiv class=\"form-group\">\n            \u003clabel class=\"form-label\">Por quê (Justificativa)\u003c/label>\n            \u003ctextarea id=\"promptWhy\" class=\"form-textarea\" placeholder=\"Ex: Porque preciso de algo pronto para usar agora...\">\u003c/textarea>\n          \u003c/div>\n          \u003cdiv class=\"form-group\">\n            \u003clabel class=\"form-label\">Contexto Adicional\u003c/label>\n            \u003ctextarea id=\"promptContext\" class=\"form-textarea\" placeholder=\"Ex: Já tentei X, Y, Z... Preciso de algo diferente...\">\u003c/textarea>\n          \u003c/div>\n          \u003cdiv class=\"btn-group\">\n            \u003cbutton class=\"btn\" onclick=\"generatePrompt()\">🚀 Gerar Prompt Final\u003c/button>\n            \u003cbutton class=\"btn secondary\" onclick=\"loadTemplate()\">📂 Carregar Template\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003c!-- PROMPT GERADO -->\n        \u003cdiv class=\"section\">\n          \u003cdiv class=\"section-title\">✨ Prompt Final Gerado\u003c/div>\n          \u003cdiv style=\"background: #0a0e27; border: 1px solid #1e2139; border-radius: 6px; padding: 12px; min-height: 150px; max-height: 300px; overflow-y: auto;\">\n            \u003cdiv id=\"promptOutput\" style=\"font-size: 12px; color: #c9d1d9; line-height: 1.6; white-space: pre-wrap; word-break: break-word;\">\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"btn-group\">\n            \u003cbutton class=\"btn\" onclick=\"copyPrompt()\">📋 Copiar Prompt\u003c/button>\n            \u003cbutton class=\"btn secondary\" onclick=\"saveAsTemplate()\">⭐ Salvar como Template\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- MODAL: HISTÓRICO -->\n  \u003cdiv class=\"modal\" id=\"historicoModal\">\n    \u003cdiv class=\"modal-content\">\n      \u003cdiv class=\"modal-title\">📜 Histórico de Prompts\u003c/div>\n      \u003cdiv id=\"historicoList\" style=\"display: flex; flex-direction: column; gap: 8px;\">\u003c/div>\n      \u003cdiv class=\"modal-buttons\">\n        \u003cbutton class=\"btn secondary\" onclick=\"closeHistorico()\">Fechar\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cscript>\n    const STORAGE_KEY_PROMPTS = \"sk-prompts\";\n    const STORAGE_KEY_TEMPLATES = \"sk-templates\";\n\n    let prompts = [];\n    let templates = {};\n\n    // ═══════════════════════════════════════════════════════════════\n    // TEMPLATES PRÉ-DEFINIDOS\n    // ═══════════════════════════════════════════════════════════════\n\n    const DEFAULT_TEMPLATES = {\n      juridico: {\n        name: \"Jurídico\",\n        what: \"Preciso de um documento jurídico profissional\",\n        notWant: \"Não quero termos genéricos, não quero ambiguidades\",\n        why: \"Precisa ser válido legalmente\",\n        context: \"Para uso profissional em contrato\"\n      },\n      html: {\n        name: \"HTML/CSS\",\n        what: \"Quero um componente HTML/CSS responsivo\",\n        notWant: \"Não quero frameworks, não quero JavaScript complexo\",\n        why: \"Precisa ser leve e rápido\",\n        context: \"Para integrar em projeto existente\"\n      },\n      python: {\n        name: \"Python\",\n        what: \"Quero um script Python funcional\",\n        notWant: \"Não quero código incompleto, não quero dependências pesadas\",\n        why: \"Precisa rodar direto sem configuração\",\n        context: \"Para automação de tarefas\"\n      },\n      sql: {\n        name: \"SQL\",\n        what: \"Quero queries SQL otimizadas\",\n        notWant: \"Não quero N+1 queries, não quero joins desnecessários\",\n        why: \"Precisa ser eficiente\",\n        context: \"Para banco de dados em produção\"\n      },\n      nodejs: {\n        name: \"Node.js\",\n        what: \"Quero um servidor Node.js pronto\",\n        notWant: \"Não quero código espaguete, não quero callbacks aninhados\",\n        why: \"Precisa ser escalável\",\n        context: \"Para API REST\"\n      },\n      react: {\n        name: \"React\",\n        what: \"Quero um componente React funcional\",\n        notWant: \"Não quero class components, não quero prop drilling\",\n        why: \"Precisa ser moderno e eficiente\",\n        context: \"Para aplicação SPA\"\n      },\n      devops: {\n        name: \"DevOps\",\n        what: \"Quero configuração de infraestrutura\",\n        notWant: \"Não quero configurações manuais, não quero segurança fraca\",\n        why: \"Precisa ser automatizado e seguro\",\n        context: \"Para produção\"\n      },\n      design: {\n        name: \"Design\",\n        what: \"Quero um design profissional\",\n        notWant: \"Não quero cores genéricas, não quero fontes ruins\",\n        why: \"Precisa ser atrativo\",\n        context: \"Para apresentação ao cliente\"\n      }\n    };\n\n    // ═══════════════════════════════════════════════════════════════\n    // CARREGAR/SALVAR\n    // ═══════════════════════════════════════════════════════════════\n\n    function loadData() {\n      try {\n        const saved = localStorage.getItem(STORAGE_KEY_PROMPTS);\n        prompts = saved ? JSON.parse(saved) : [];\n        \n        const savedTemplates = localStorage.getItem(STORAGE_KEY_TEMPLATES);\n        templates = savedTemplates ? JSON.parse(savedTemplates) : DEFAULT_TEMPLATES;\n      } catch (e) {\n        console.error(\"Erro ao carregar:\", e);\n        templates = DEFAULT_TEMPLATES;\n      }\n    }\n\n    function savePrompts() {\n      localStorage.setItem(STORAGE_KEY_PROMPTS, JSON.stringify(prompts));\n    }\n\n    function saveTemplates() {\n      localStorage.setItem(STORAGE_KEY_TEMPLATES, JSON.stringify(templates));\n    }\n\n    // ═══════════════════════════════════════════════════════════════\n    // TEMPLATES\n    // ═══════════════════════════════════════════════════════════════\n\n    function selectTemplate(type) {\n      const template = templates[type];\n      if (template) {\n        document.getElementById(\"promptType\").value = type;\n        document.getElementById(\"promptWhat\").value = template.what || \"\";\n        document.getElementById(\"promptNotWant\").value = template.notWant || \"\";\n        document.getElementById(\"promptWhy\").value = template.why || \"\";\n        document.getElementById(\"promptName\").value = template.name || \"\";\n      }\n    }\n\n    function loadTemplate() {\n      selectTemplate(document.getElementById(\"promptType\").value);\n    }\n\n    // ═══════════════════════════════════════════════════════════════\n    // GERAR PROMPT\n    // ═══════════════════════════════════════════════════════════════\n\n    function generatePrompt() {\n      const name = document.getElementById(\"promptName\").value || \"Sem nome\";\n      const type = document.getElementById(\"promptType\").value;\n      const what = document.getElementById(\"promptWhat\").value;\n      const notWant = document.getElementById(\"promptNotWant\").value;\n      const why = document.getElementById(\"promptWhy\").value;\n      const context = document.getElementById(\"promptContext\").value;\n\n      const prompt = `\n=== PROMPT FINAL ===\nNome: ${name}\nTipo: ${type}\nData: ${new Date().toLocaleString(\"pt-BR\")}\n\n--- O QUE EU QUERO ---\n${what || \"Não especificado\"}\n\n--- O QUE EU NÃO QUERO ---\n${notWant || \"Nenhuma restrição especificada\"}\n\n--- POR QUÊ ---\n${why || \"Não especificado\"}\n\n--- CONTEXTO ADICIONAL ---\n${context || \"Nenhum contexto adicional\"}\n\n--- INSTRUÇÕES PARA A IA ---\n1. Leia atentamente o que eu quero\n2. Respeite TODAS as restrições\n3. Entenda o contexto e a justificativa\n4. Não sugira alternativas que violem as restrições\n5. Forneça uma solução COMPLETA e PRONTA\n6. Não deixe nada para o usuário integrar\n7. Teste a solução antes de entregar\n\nResponda de forma profissional e estruturada.\n      `;\n\n      document.getElementById(\"promptOutput\").textContent = prompt;\n    }\n\n    function copyPrompt() {\n      const text = document.getElementById(\"promptOutput\").textContent;\n      if (!text.trim()) {\n        alert(\"Gere um prompt primeiro!\");\n        return;\n      }\n      navigator.clipboard.writeText(text).then(() => {\n        alert(\"✅ Prompt copiado!\");\n      });\n    }\n\n    function savePrompt() {\n      const name = document.getElementById(\"promptName\").value;\n      if (!name) {\n        alert(\"Digite um nome para o prompt!\");\n        return;\n      }\n\n      const prompt = {\n        id: Date.now(),\n        name,\n        type: document.getElementById(\"promptType\").value,\n        what: document.getElementById(\"promptWhat\").value,\n        notWant: document.getElementById(\"promptNotWant\").value,\n        why: document.getElementById(\"promptWhy\").value,\n        context: document.getElementById(\"promptContext\").value,\n        timestamp: new Date().toLocaleString(\"pt-BR\")\n      };\n\n      prompts.push(prompt);\n      savePrompts();\n      alert(\"✅ Prompt salvo!\");\n      clearForm();\n    }\n\n    function saveAsTemplate() {\n      const type = document.getElementById(\"promptType\").value;\n      if (type === \"custom\") {\n        const name = prompt(\"Nome do template:\");\n        if (!name) return;\n        templates[name.toLowerCase()] = {\n          name,\n          what: document.getElementById(\"promptWhat\").value,\n          notWant: document.getElementById(\"promptNotWant\").value,\n          why: document.getElementById(\"promptWhy\").value,\n          context: document.getElementById(\"promptContext\").value\n        };\n      } else {\n        templates[type] = {\n          name: document.getElementById(\"promptName\").value,\n          what: document.getElementById(\"promptWhat\").value,\n          notWant: document.getElementById(\"promptNotWant\").value,\n          why: document.getElementById(\"promptWhy\").value,\n          context: document.getElementById(\"promptContext\").value\n        };\n      }\n      saveTemplates();\n      alert(\"✅ Template salvo!\");\n    }\n\n    // ═══════════════════════════════════════════════════════════════\n    // HISTÓRICO\n    // ═══════════════════════════════════════════════════════════════\n\n    function viewHistorico() {\n      const list = document.getElementById(\"historicoList\");\n      if (prompts.length === 0) {\n        list.innerHTML = \"\u003cp style='color: #6e7681;'>Nenhum prompt salvo ainda.\u003c/p>\";\n      } else {\n        list.innerHTML = prompts.map(p => `\n          \u003cdiv class=\"list-item\">\n            \u003cdiv class=\"list-item-content\">\n              \u003cdiv class=\"list-item-title\">${p.name}\u003c/div>\n              \u003cdiv class=\"list-item-meta\">${p.type} • ${p.timestamp}\u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"list-item-actions\">\n              \u003cbutton class=\"btn-small\" onclick=\"loadPromptFromHistorico(${p.id})\" title=\"Carregar\">📂\u003c/button>\n              \u003cbutton class=\"btn-small delete\" onclick=\"deletePrompt(${p.id})\" title=\"Deletar\">🗑️\u003c/button>\n            \u003c/div>\n          \u003c/div>\n        `).join(\"\");\n      }\n      document.getElementById(\"historicoModal\").classList.add(\"open\");\n    }\n\n    function loadPromptFromHistorico(id) {\n      const prompt = prompts.find(p => p.id === id);\n      if (prompt) {\n        document.getElementById(\"promptName\").value = prompt.name;\n        document.getElementById(\"promptType\").value = prompt.type;\n        document.getElementById(\"promptWhat\").value = prompt.what;\n        document.getElementById(\"promptNotWant\").value = prompt.notWant;\n        document.getElementById(\"promptWhy\").value = prompt.why;\n        document.getElementById(\"promptContext\").value = prompt.context;\n        closeHistorico();\n        generatePrompt();\n      }\n    }\n\n    function deletePrompt(id) {\n      if (confirm(\"Deletar esse prompt?\")) {\n        prompts = prompts.filter(p => p.id !== id);\n        savePrompts();\n        viewHistorico();\n      }\n    }\n\n    function closeHistorico() {\n      document.getElementById(\"historicoModal\").classList.remove(\"open\");\n    }\n\n    // ═══════════════════════════════════════════════════════════════\n    // AÇÕES\n    // ═══════════════════════════════════════════════════════════════\n\n    function clearForm() {\n      document.getElementById(\"promptName\").value = \"\";\n      document.getElementById(\"promptWhat\").value = \"\";\n      document.getElementById(\"promptNotWant\").value = \"\";\n      document.getElementById(\"promptWhy\").value = \"\";\n      document.getElementById(\"promptContext\").value = \"\";\n      document.getElementById(\"promptOutput\").textContent = \"\";\n    }\n\n    function openNewPrompt() {\n      clearForm();\n    }\n\n    function exportAll() {\n      const data = {\n        prompts,\n        templates,\n        exportedAt: new Date().toLocaleString(\"pt-BR\")\n      };\n\n      const content = JSON.stringify(data, null, 2);\n      const blob = new Blob([content], { type: \"application/json\" });\n      const url = URL.createObjectURL(blob);\n      const a = document.createElement(\"a\");\n      a.href = url;\n      a.download = `sk-prompts-${Date.now()}.json`;\n      a.click();\n    }\n\n    // ═══════════════════════════════════════════════════════════════\n    // INICIALIZAÇÃO\n    // ═══════════════════════════════════════════════════════════════\n\n    window.addEventListener(\"DOMContentLoaded\", () => {\n      loadData();\n    });\n  \u003c/script>\n\u003c/body>\n\u003c/html>","l":"html","n":""},{"p":"projeto-arquivos-4-pasta-total-rep.html","t":"\u003c!DOCTYPE html>\n\u003chtml lang=\"pt-BR\">\n\n\u003chead>\n    \u003cmeta charset=\"UTF-8\">\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    \u003ctitle>Analisador e Reparador PWA -> APK\u003c/title>\n    \u003c!-- Importa a biblioteca JSZip para ler e criar ZIPs no navegador -->\n    \u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js\">\u003c/script>\n    \u003cstyle>\n        body {\n            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;\n            background-color: #1e1e2e;\n            color: #cdd6f4;\n            margin: 0;\n            padding: 20px;\n            display: flex;\n            flex-direction: column;\n            align-items: center;\n        }\n\n        .container {\n            background-color: #313244;\n            padding: 30px;\n            border-radius: 12px;\n            width: 100%;\n            max-width: 600px;\n            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);\n        }\n\n        h1 {\n            color: #89b4fa;\n            text-align: center;\n        }\n\n        .upload-area {\n            border: 2px dashed #6c7086;\n            padding: 30px;\n            text-align: center;\n            border-radius: 8px;\n            margin-bottom: 20px;\n            cursor: pointer;\n        }\n\n        .upload-area:hover {\n            border-color: #89b4fa;\n        }\n\n        input[type=\"file\"] {\n            display: none;\n        }\n\n        .status {\n            margin-top: 20px;\n            padding: 15px;\n            border-radius: 8px;\n            background: #181825;\n        }\n\n        .item {\n            display: flex;\n            justify-content: space-between;\n            margin-bottom: 10px;\n            padding-bottom: 10px;\n            border-bottom: 1px solid #45475a;\n        }\n\n        .missing {\n            color: #f38ba8;\n            font-weight: bold;\n        }\n\n        .found {\n            color: #a6e3a1;\n            font-weight: bold;\n        }\n\n        button {\n            background-color: #89b4fa;\n            color: #11111b;\n            border: none;\n            padding: 10px 15px;\n            border-radius: 6px;\n            cursor: pointer;\n            font-weight: bold;\n            margin-top: 5px;\n            width: 100%;\n        }\n\n        button:hover {\n            background-color: #b4befe;\n        }\n\n        button:disabled {\n            background-color: #45475a;\n            cursor: not-allowed;\n        }\n\n        #downloadBtn {\n            background-color: #a6e3a1;\n            margin-top: 20px;\n            display: none;\n            font-size: 1.1em;\n            padding: 15px;\n        }\n\n        #downloadBtn:hover {\n            background-color: #94e2d5;\n        }\n    \u003c/style>\n\u003c/head>\n\n\u003cbody>\n\n    \u003cdiv class=\"container\">\n        \u003ch1>🛠️ Reparador PWA para APK\u003c/h1>\n        \u003cp style=\"text-align: center; color: #a6adc8;\">Importe seu projeto .zip para analisar os arquivos.\u003c/p>\n\n        \u003cdiv class=\"upload-area\" onclick=\"document.getElementById('zipInput').click()\">\n            📁 Clique aqui para selecionar o arquivo .ZIP\n            \u003cinput type=\"file\" id=\"zipInput\" accept=\".zip\">\n        \u003c/div>\n\n        \u003cdiv class=\"status\" id=\"statusArea\" style=\"display: none;\">\n            \u003ch3>📊 Resultado da Análise:\u003c/h3>\n            \u003cdiv id=\"results\">\u003c/div>\n            \u003cbutton id=\"fixAllBtn\" onclick=\"fixAll()\">✨ Gerar Arquivos Faltantes\u003c/button>\n            \u003cbutton id=\"downloadBtn\" onclick=\"downloadZip()\">⬇️ Baixar ZIP Corrigido\u003c/button>\n        \u003c/div>\n    \u003c/div>\n\n    \u003cscript>\n        let currentZip = null;\n    let filesList = [];\n\n    // Arquivos padrão que vamos injetar\n    const templates = {\n        \"manifest.json\": `{\\n  \"name\": \"Meu App APK\",\\n  \"short_name\": \"App\",\\n  \"start_url\": \"/index.html\",\\n  \"display\": \"standalone\",\\n  \"background_color\": \"#ffffff\",\\n  \"theme_color\": \"#000000\"\\n}`,\n        \"service-worker.js\": `self.addEventListener('install', (e) => { console.log('SW Instalado'); self.skipWaiting(); });\\nself.addEventListener('fetch', (e) => { });`,\n        \"capacitor.config.json\": `{\\n  \"appId\": \"com.meuapp.gerado\",\\n  \"appName\": \"Meu App\",\\n  \"webDir\": \".\",\\n  \"bundledWebRuntime\": false\\n}`,\n        \".github/workflows/build-apk.yml\": `name: Build APK\\non: [push, workflow_dispatch]\\njobs:\\n  build:\\n    runs-on: ubuntu-latest\\n    steps:\\n      - uses: actions/checkout@v3\\n      - uses: actions/setup-node@v3\\n        with: { node-version: '18' }\\n      - run: npm install @capacitor/core @capacitor/cli\\n      - run: npx cap init \"Meu App\" \"com.meuapp.gerado\" --web-dir .\\n      - run: npm install @capacitor/android\\n      - run: npx cap add android\\n      - run: npx cap sync android\\n      - run: cd android && ./gradlew assembleDebug\\n      - uses: actions/upload-artifact@v3\\n        with:\\n          name: app-debug.apk\\n          path: android/app/build/outputs/apk/debug/app-debug.apk`\n    };\n\n    document.getElementById('zipInput').addEventListener('change', function(e) {\n        const file = e.target.files[0];\n        if (!file) return;\n\n        const reader = new FileReader();\n        reader.onload = function(event) {\n            JSZip.loadAsync(event.target.result).then(function(zip) {\n                currentZip = zip;\n                filesList = Object.keys(zip.files);\n                analyzeFiles();\n            });\n        };\n        reader.readAsArrayBuffer(file);\n    });\n\n    function analyzeFiles() {\n        document.getElementById('statusArea').style.display = 'block';\n        const resultsDiv = document.getElementById('results');\n        resultsDiv.innerHTML = '';\n\n        const checks = [\n            { name: 'manifest.json', desc: 'Manifesto PWA' },\n            { name: 'service-worker.js', desc: 'Service Worker' },\n            { name: 'capacitor.config.json', desc: 'Configuração Capacitor' }
