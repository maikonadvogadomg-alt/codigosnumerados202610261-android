<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>11</title><style>body{margin:0;background:#0f1420;color:#d8deea;font:15px/1.45 system-ui,sans-serif}main{max-width:960px;margin:0 auto;padding:14px}h1{font-size:19px}input{width:100%;font-size:16px;padding:9px;border-radius:9px;border:1px solid #34405e;background:#151b2b;color:#d8deea;margin-bottom:10px}nav a{display:block;color:#8fb8ff;font:13px ui-monospace,monospace;padding:2px 0;text-decoration:none}section{background:#151b2b;border:1px solid #263048;border-radius:10px;margin:10px 0}section h2{font:600 13px ui-monospace,monospace;margin:0;padding:9px 10px;display:flex;gap:8px;align-items:center;word-break:break-all}section h2 span{flex:1}button{font:inherit;font-size:13px;padding:4px 10px;border-radius:7px;border:1px solid #34405e;background:#1b2337;color:#d8deea;cursor:pointer}pre{margin:0;padding:10px;border-top:1px solid #263048;white-space:pre-wrap;word-break:break-word;font:12.5px/1.5 ui-monospace,monospace}</style></head><body><main><h1>11</h1><input id="q" placeholder="🔍 Procurar…"><button id="all">📋 Copiar tudo</button><nav id="nav"></nav><div id="l"></div></main><script>const D=[{"p":"Triagem de Código (3).html","t":"\u003c!doctype html>\u003chtml>\u003chead>\u003cmeta charset=utf8>\u003cmeta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\u003cstyle>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}\u003c/style>\u003c/head>\u003cbody>\n\u003ctitle>Triagem de Código\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap\">\n\u003cstyle>\n/* Layout: bancada de trabalho em 4 etapas (abas), lista à esquerda, painel de ações à direita em telas largas */\n:root{\n  --bg:#EEF1EF; --panel:#FBFCFB; --sunk:#E4E9E6; --ink:#17211D; --muted:#5A6862; --line:#CFD8D4;\n  --accent:#1E6B57; --accent-ink:#F4FBF8; --accent-soft:#D5E9E2;\n  --warn:#9A5B06; --ok:#1C7A3E; --bad:#B42318; --scrim:rgba(10,18,15,.5);\n  --t-html:#B4480B; --t-css:#1F5FB8; --t-js:#8A6A00; --t-ts:#2B55A8; --t-json:#5B6470; --t-py:#2F6F8F; --t-cmd:#7A3FA0; --t-md:#4B5A55; --t-other:#6B6B6B;\n  --code-bg:#F3F5F4;\n  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;\n  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;\n  --f-mono:'JetBrains Mono',ui-monospace,'Cascadia Code',Consolas,monospace;\n}\n@media (prefers-color-scheme: dark){ :root:not([data-theme=\"light\"]){\n  --bg:#0F1513; --panel:#161E1B; --sunk:#1C2622; --ink:#E4ECE8; --muted:#95A59E; --line:#2A3632;\n  --accent:#5CC4A3; --accent-ink:#082019; --accent-soft:#1D3A31;\n  --warn:#E7A93B; --ok:#5FD68A; --bad:#F2877C; --scrim:rgba(0,0,0,.6);\n  --t-html:#F29A5E; --t-css:#7FB1F5; --t-js:#E5C85A; --t-ts:#8FA9F0; --t-json:#A9B3BE; --t-py:#7CC3DE; --t-cmd:#C99BEA; --t-md:#A6B5AE; --t-other:#A8A8A8;\n  --code-bg:#111916; color-scheme:dark }}\n:root[data-theme=\"dark\"]{\n  --bg:#0F1513; --panel:#161E1B; --sunk:#1C2622; --ink:#E4ECE8; --muted:#95A59E; --line:#2A3632;\n  --accent:#5CC4A3; --accent-ink:#082019; --accent-soft:#1D3A31;\n  --warn:#E7A93B; --ok:#5FD68A; --bad:#F2877C; --scrim:rgba(0,0,0,.6);\n  --t-html:#F29A5E; --t-css:#7FB1F5; --t-js:#E5C85A; --t-ts:#8FA9F0; --t-json:#A9B3BE; --t-py:#7CC3DE; --t-cmd:#C99BEA; --t-md:#A6B5AE; --t-other:#A8A8A8;\n  --code-bg:#111916; color-scheme:dark }\n\nbody{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}\n.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 64px}\nheader.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 24px;padding-block:24px 14px}\nh1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4.2vw,38px);letter-spacing:-.015em;line-height:1.05;margin:0;text-wrap:balance}\nh2{font-family:var(--f-display);font-weight:700;font-size:21px;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}\nh3{font-size:15px;font-weight:600;margin:0}\n.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}\n.stats{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}\n.stats b{color:var(--ink);font-weight:600}\nnav.steps{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:22px}\nnav.steps button{font:inherit;font-weight:500;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:12px 14px 10px;cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:baseline}\nnav.steps button .n{font-family:var(--f-mono);font-size:12px}\nnav.steps button[aria-selected=\"true\"]{color:var(--ink);border-bottom-color:var(--accent)}\nnav.steps button:hover{color:var(--ink)}\n:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.lead{color:var(--muted);margin:0 0 16px;max-width:70ch}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}\n.stack{display:grid;gap:16px}\n.row-flex{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.btn{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;line-height:1.2}\n.btn:hover{border-color:var(--muted)}\n.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}\n.btn.primary:hover{filter:brightness(1.07)}\n.btn.small{padding:5px 9px;font-size:13px;border-radius:6px}\n.btn.danger{color:var(--bad)}\n.btn[disabled]{opacity:.45;cursor:not-allowed}\ninput[type=text],input:not([type]),select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 10px;min-width:0}\ntextarea{font-family:var(--f-mono);font-size:12.5px;width:100%;resize:vertical;line-height:1.45}\n.mono{font-family:var(--f-mono)}\nlabel.inline{display:flex;gap:8px;align-items:center;cursor:pointer}\n\n.drop{border:2px dashed var(--line);border-radius:12px;padding:28px 20px;display:grid;gap:10px;background:var(--panel);transition:border-color .15s,background .15s}\n.drop.over{border-color:var(--accent);background:var(--accent-soft)}\n.drop strong{font-family:var(--f-display);font-size:19px;font-weight:700}\n.drop .kinds{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}\n.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}\n@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}\nol.how{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--ink)}\nol.how li::marker{font-family:var(--f-mono);color:var(--accent)}\n.srcs{display:grid;gap:6px}\n.src{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}\n.src .nm{font-family:var(--f-mono);font-size:13px;min-width:0;overflow-wrap:anywhere}\n.note{font-size:13px;color:var(--muted)}\n.banner{border:1px solid var(--line);background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}\n\n.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:4px;color:var(--c,var(--t-other));background:color-mix(in srgb,var(--c,var(--t-other)) 14%,transparent);white-space:nowrap}\n[data-t=\"html\"]{--c:var(--t-html)} [data-t=\"css\"]{--c:var(--t-css)} [data-t=\"js\"]{--c:var(--t-js)} [data-t=\"ts\"]{--c:var(--t-ts)} [data-t=\"json\"]{--c:var(--t-json)} [data-t=\"py\"]{--c:var(--t-py)} [data-t=\"cmd\"]{--c:var(--t-cmd)} [data-t=\"md\"]{--c:var(--t-md)} [data-t=\"other\"]{--c:var(--t-other)}\n.flag{font-size:12px;font-weight:500;padding:1px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}\n.flag.warn{color:var(--warn)} .flag.ok{color:var(--ok)} .flag.info{color:var(--muted)}\n\n.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}\n.toolbar input[type=text]{flex:1 1 220px}\n.typechips{display:flex;flex-wrap:wrap;gap:6px}\n.typechips button{font:inherit;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer;font-variant-numeric:tabular-nums}\n.typechips button[aria-pressed=\"true\"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}\n.blocks{display:grid;gap:10px}\n.card{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:12px;display:grid;gap:8px;min-width:0}\n.card.chosen{border-color:var(--accent)}\n.card .head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}\n.path{font-family:var(--f-mono);font-size:13px;flex:1 1 220px;min-width:0}\n.meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}\n.code{font-family:var(--f-mono);font-size:12.5px;line-height:1.5;background:var(--code-bg);border:1px solid var(--line);border-radius:7px;padding:10px 12px;margin:0;overflow:auto;white-space:pre;tab-size:2;color:var(--ink)}\n.code.prev{max-height:132px;overflow:hidden;position:relative}\n.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}\n.okmark{font-size:13px;color:var(--ok);font-weight:500}\n\n.proj{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:20px;align-items:start}\n@media (max-width:900px){.proj{grid-template-columns:minmax(0,1fr)}}\n.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);display:grid;gap:12px}\n@media (max-width:900px){.side{position:static}}\n.grow{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,250px) auto;gap:8px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}\n.grow .pbox{display:grid;gap:3px;min-width:0}\n@media (max-width:640px){.grow{grid-template-columns:auto minmax(0,1fr)} .grow select,.grow .acts{grid-column:2}}\n.grow select{width:100%;font-size:13px}\n.tree{font-family:var(--f-mono);font-size:12.5px;line-height:1.55;white-space:pre;overflow:auto;background:var(--code-bg);border:1px solid var(--line);border-radius:7px;padding:10px 12px;margin:0;max-height:340px}\ndetails.box{border:1px solid var(--line);border-radius:9px;background:var(--panel)}\ndetails.box>summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style-position:inside}\ndetails.box>div{padding:0 14px 14px;display:grid;gap:10px}\n.guide{display:grid;gap:0}\n.gstep{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}\n.gstep .p{font-family:var(--f-mono);font-size:13px;overflow-wrap:anywhere}\n.gstep.done .p{color:var(--muted);text-decoration:line-through}\n.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}\n.seg button{font:inherit;font-size:13px;border:0;background:var(--panel);color:var(--muted);padding:6px 11px;cursor:pointer}\n.seg button[aria-pressed=\"true\"]{background:var(--accent-soft);color:var(--ink);font-weight:600}\n\n.mode{display:grid;gap:8px}\n.mode label{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--panel)}\n.mode label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}\n.mode .d{grid-column:2;font-size:13px;color:var(--muted)}\n.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}\ntable{border-collapse:collapse;width:100%;font-size:13.5px}\nth,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}\nth{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--sunk)}\ntd.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}\ntd input{width:100%;min-width:130px;font-family:var(--f-mono);font-size:12.5px;padding:4px 8px}\n.warns{list-style:none;margin:0;padding:0;display:grid;gap:6px}\n.warns li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:14px}\n.warns li::before{content:\"!\";font-family:var(--f-mono);font-weight:600;color:var(--warn);width:18px;height:18px;border:1.5px solid var(--warn);border-radius:50%;display:grid;place-items:center;font-size:11px;margin-top:2px}\n.files{display:grid;gap:0}\n.frow{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}\n.frow .p{font-family:var(--f-mono);font-size:13px;overflow-wrap:anywhere}\n\n.overlay{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30}\n.dialog{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(1040px,100%);max-height:100%;display:flex;flex-direction:column;min-height:0}\n.dialog>header{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}\n.dialog>.body{overflow:auto;padding:12px 14px;min-height:0;display:grid;gap:12px;align-content:start}\n.dialog .code{max-height:none}\npre.ln{counter-reset:ln}\npre.ln>span{counter-increment:ln}\npre.ln>span::before{content:counter(ln);display:inline-block;width:3.2em;margin-right:12px;text-align:right;color:var(--muted);opacity:.7;user-select:none}\n.diff .a{background:color-mix(in srgb,var(--ok) 16%,transparent);display:block}\n.diff .d{background:color-mix(in srgb,var(--bad) 16%,transparent);display:block}\n.diff .s{color:var(--muted);display:block;font-style:italic}\n.fnlist{font-family:var(--f-mono);font-size:12.5px;overflow-wrap:anywhere}\n.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:40;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.18)}\n.empty{padding:28px 16px;text-align:left;color:var(--muted);border:1px dashed var(--line);border-radius:9px}\n@media (prefers-reduced-motion: reduce){*{transition:none!important}}\n\u003c/style>\n\n\u003cdiv class=\"wrap\">\n  \u003cheader class=\"top\">\n    \u003cdiv>\n      \u003ch1>Triagem de Código\u003c/h1>\n      \u003cp class=\"sub\">Separe o código perdido nas conversas com a IA, escolha a versão certa de cada arquivo e monte o projeto em módulos independentes.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"stats\" id=\"stats\">\u003c/div>\n  \u003c/header>\n\n  \u003cnav class=\"steps\" role=\"tablist\" aria-label=\"Etapas\">\n    \u003cbutton role=\"tab\" data-tab=\"importar\" aria-selected=\"true\">\u003cspan class=\"n\">1\u003c/span>Importar\u003c/button>\n    \u003cbutton role=\"tab\" data-tab=\"blocos\" aria-selected=\"false\">\u003cspan class=\"n\">2\u003c/span>Blocos\u003c/button>\n    \u003cbutton role=\"tab\" data-tab=\"projeto\" aria-selected=\"false\">\u003cspan class=\"n\">3\u003c/span>Projeto\u003c/button>\n    \u003cbutton role=\"tab\" data-tab=\"modular\" aria-selected=\"false\">\u003cspan class=\"n\">4\u003c/span>Modularizar\u003c/button>\n  \u003c/nav>\n\n  \u003c!-- 1. IMPORTAR -->\n  \u003csection id=\"tab-importar\" class=\"stack\">\n    \u003cdiv id=\"exBanner\" class=\"banner\" hidden>\n      \u003cspan>Você está vendo uma \u003cb>conversa de exemplo\u003c/b>. Importe o seu arquivo e o exemplo some sozinho.\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"two\">\n      \u003cdiv class=\"stack\">\n        \u003clabel class=\"drop\" id=\"drop\" for=\"fileIn\">\n          \u003cstrong>Solte aqui o arquivo da conversa\u003c/strong>\n          \u003cspan>Ou clique para escolher. Pode mandar vários de uma vez.\u003c/span>\n          \u003cspan class=\"kinds\">.md  .txt  .zip  .html  .js  .css  .py  .json (organização salva)\u003c/span>\n          \u003cinput id=\"fileIn\" type=\"file\" multiple hidden accept=\".md,.markdown,.txt,.zip,.html,.htm,.js,.mjs,.jsx,.ts,.tsx,.css,.scss,.json,.py,.sh,.bat,.ps1,.xml,.svg,.yml,.yaml,.sql,.php,.vue\">\n        \u003c/label>\n        \u003cdiv class=\"panel stack\">\n          \u003ch3>Ou cole o texto da conversa\u003c/h3>\n          \u003ctextarea id=\"pasteIn\" rows=\"6\" placeholder=\"Cole aqui um trecho da conversa (com os blocos de código)…\">\u003c/textarea>\n          \u003cdiv class=\"row-flex\">\u003cbutton class=\"btn primary\" id=\"pasteBtn\">Separar texto colado\u003c/button>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"stack\">\n        \u003cdiv class=\"panel stack\">\n          \u003ch3>Como funciona\u003c/h3>\n          \u003col class=\"how\">\n            \u003cli>Tudo roda no seu navegador. O arquivo não é enviado para lugar nenhum.\u003c/li>\n            \u003cli>Cada bloco de código da conversa vira um cartão, separado por tipo. O nome do arquivo é lido do texto em volta (ex.: “salve como \u003cspan class=\"mono\">js/app.js\u003c/span>”).\u003c/li>\n            \u003cli>Quando o mesmo arquivo aparece várias vezes, as versões ficam juntas. Você escolhe qual vale.\u003c/li>\n            \u003cli>No Projeto você baixa tudo em .zip, com guia de montagem e comandos para criar as pastas.\u003c/li>\n            \u003cli>No Modularizar você quebra um HTML ou JS gigante em arquivos pequenos, com um mapa de onde está cada função.\u003c/li>\n          \u003c/ol>\n        \u003c/div>\n        \u003cdiv class=\"panel stack\">\n          \u003cdiv class=\"row-flex\" style=\"justify-content:space-between\">\u003ch3>Arquivos importados\u003c/h3>\u003cspan class=\"note\" id=\"autosaveNote\">\u003c/span>\u003c/div>\n          \u003cdiv class=\"srcs\" id=\"srcList\">\u003c/div>\n          \u003cdiv class=\"row-flex\">\n            \u003cbutton class=\"btn small\" id=\"exBtn\">Carregar exemplo\u003c/button>\n            \u003cbutton class=\"btn small danger\" id=\"clearBtn\">Limpar tudo\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 2. BLOCOS -->\n  \u003csection id=\"tab-blocos\" hidden>\n    \u003cp class=\"lead\">Cada cartão é um bloco de código tirado da conversa, na ordem em que apareceu. Dê nome aos que ficaram sem nome digitando o caminho (ex.: \u003cspan class=\"mono\">js/chat.js\u003c/span>): blocos com o mesmo caminho viram versões do mesmo arquivo.\u003c/p>\n    \u003cdiv class=\"toolbar\">\n      \u003cinput type=\"text\" id=\"q\" placeholder=\"Buscar por nome ou trecho de código (ex.: sendMessage)\">\n      \u003cselect id=\"showSel\" aria-label=\"Mostrar\">\n        \u003coption value=\"all\">Todos os blocos\u003c/option>\n        \u003coption value=\"named\">Só com nome\u003c/option>\n        \u003coption value=\"unnamed\">Só sem nome\u003c/option>\n        \u003coption value=\"chosen\">Só as versões escolhidas\u003c/option>\n      \u003c/select>\n    \u003c/div>\n    \u003cdiv class=\"typechips\" id=\"typeChips\" style=\"margin-bottom:14px\">\u003c/div>\n    \u003cdiv class=\"blocks\" id=\"blockList\">\u003c/div>\n    \u003cdiv class=\"row-flex\" style=\"margin-top:14px\">\u003cbutton class=\"btn\" id=\"moreBtn\" hidden>Mostrar mais\u003c/button>\u003c/div>\n  \u003c/section>\n\n  \u003c!-- 3. PROJETO -->\n  \u003csection id=\"tab-projeto\" hidden>\n    \u003cp class=\"lead\">Aqui fica um arquivo por linha, com a versão escolhida. Marque o que entra no projeto. A versão sugerida é a última completa; as marcadas como \u003cspan class=\"flag warn\">trecho\u003c/span> parecem pedaços (“substitua só esta função”).\u003c/p>\n    \u003cdiv class=\"proj\">\n      \u003cdiv class=\"stack\">\n        \u003cdiv class=\"panel\" id=\"groupsIn\">\u003c/div>\n        \u003cdetails class=\"box\" id=\"outBox\">\n          \u003csummary id=\"outSummary\">Fora do projeto\u003c/summary>\n          \u003cdiv id=\"groupsOut\">\u003c/div>\n        \u003c/details>\n      \u003c/div>\n      \u003caside class=\"side\">\n        \u003cdiv class=\"panel stack\">\n          \u003clabel for=\"projName\">\u003ch3>Nome da pasta do projeto\u003c/h3>\u003c/label>\n          \u003cinput type=\"text\" id=\"projName\" class=\"mono\" value=\"meu-projeto\">\n          \u003cpre class=\"tree\" id=\"tree\">\u003c/pre>\n          \u003cbutton class=\"btn primary\" id=\"zipProj\">Baixar projeto (.zip)\u003c/button>\n          \u003cbutton class=\"btn\" id=\"zipAll\">Baixar tudo, com todas as versões (.zip)\u003c/button>\n          \u003cbutton class=\"btn\" id=\"saveJson\">Salvar organização (.json)\u003c/button>\n          \u003cp class=\"note\" id=\"dlNote\">O .json guarda seus nomes e escolhas. Para continuar depois, importe ele na etapa 1.\u003c/p>\n        \u003c/div>\n      \u003c/aside>\n    \u003c/div>\n    \u003cdiv class=\"stack\" style=\"margin-top:18px\">\n      \u003cdetails class=\"box\">\n        \u003csummary>Guia de montagem: criar cada arquivo e colar\u003c/summary>\n        \u003cdiv>\n          \u003cp class=\"note\">Para quem prefere montar à mão no VS Code ou no Bloco de Notas. Crie o arquivo com o caminho exato, clique em Copiar, cole, salve e marque como feito.\u003c/p>\n          \u003cdiv class=\"guide\" id=\"guide\">\u003c/div>\n        \u003c/div>\n      \u003c/details>\n      \u003cdetails class=\"box\">\n        \u003csummary>Comandos para criar as pastas e arquivos vazios\u003c/summary>\n        \u003cdiv>\n          \u003cdiv class=\"row-flex\">\n            \u003cdiv class=\"seg\" id=\"shellSeg\">\n              \u003cbutton data-sh=\"cmd\" aria-pressed=\"true\">Windows (CMD)\u003c/button>\n              \u003cbutton data-sh=\"ps\" aria-pressed=\"false\">PowerShell\u003c/button>\n              \u003cbutton data-sh=\"sh\" aria-pressed=\"false\">Linux / Mac\u003c/button>\n            \u003c/div>\n            \u003cbutton class=\"btn small\" id=\"copyCmd\">Copiar comandos\u003c/button>\n          \u003c/div>\n          \u003cp class=\"note\" id=\"shellHint\">\u003c/p>\n          \u003cpre class=\"code\" id=\"cmdOut\" style=\"max-height:320px\">\u003c/pre>\n        \u003c/div>\n      \u003c/details>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- 4. MODULARIZAR -->\n  \u003csection id=\"tab-modular\" hidden>\n    \u003cp class=\"lead\">Cole um HTML ou JS grande. A ferramenta separa o CSS, quebra o JavaScript em arquivos por assunto e gera um \u003cb>MAPA\u003c/b> dizendo onde está cada função. Quando algo quebrar, você manda para a IA só o arquivo com problema.\u003c/p>\n    \u003cdiv class=\"two\">\n      \u003cdiv class=\"stack\">\n        \u003cdiv class=\"row-flex\">\n          \u003cselect id=\"modSrc\" style=\"flex:1 1 240px\" aria-label=\"Pegar de um bloco\">\u003c/select>\n          \u003clabel class=\"btn small\" for=\"modFile\">Abrir arquivo\u003c/label>\n          \u003cinput type=\"file\" id=\"modFile\" hidden accept=\".html,.htm,.js,.mjs,.txt\">\n        \u003c/div>\n        \u003ctextarea id=\"modIn\" rows=\"14\" placeholder=\"Cole aqui o HTML completo ou o JS (ex.: o app.js de 6.000 linhas)…\">\u003c/textarea>\n        \u003cdiv class=\"row-flex\">\u003cbutton class=\"btn primary\" id=\"anaBtn\">Analisar\u003c/button>\u003cspan class=\"note\" id=\"anaNote\">\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"stack\">\n        \u003cdiv class=\"mode\" role=\"radiogroup\" aria-label=\"Formato dos módulos\">\n          \u003clabel>\u003cinput type=\"radio\" name=\"mode\" value=\"simple\" checked>\u003cb>Simples (recomendado)\u003c/b>\u003cspan class=\"d\">Arquivos separados carregados em ordem. Funciona abrindo o index.html com dois cliques. Nada muda no código, só muda de lugar.\u003c/span>\u003c/label>\n          \u003clabel>\u003cinput type=\"radio\" name=\"mode\" value=\"es\">\u003cb>Módulos ES (import/export)\u003c/b>\u003cspan class=\"d\">Cada arquivo declara o que usa dos outros. Mais organizado, mas precisa de servidor local (Live Server do VS Code ou \u003cspan class=\"mono\">npx serve\u003c/span>).\u003c/span>\u003c/label>\n        \u003c/div>\n        \u003cdiv class=\"panel stack\">\n          \u003ch3>Como ele decide os arquivos\u003c/h3>\n          \u003cp class=\"note\" style=\"margin:0\">Se o código tem títulos de seção (\u003cspan class=\"mono\">// ===== CHAT =====\u003c/span>), cada seção vira um arquivo. Se não tem, agrupa pelo nome das funções (renderChat, sendChat → chat.js). Variáveis soltas vão para \u003cspan class=\"mono\">estado.js\u003c/span> e o código de inicialização para \u003cspan class=\"mono\">main.js\u003c/span>. Você pode mudar o arquivo de qualquer função antes de gerar.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"modAn\" class=\"stack\" style=\"margin-top:20px\">\u003c/div>\n    \u003cdiv id=\"modOut\" class=\"stack\" style=\"margin-top:20px\">\u003c/div>\n  \u003c/section>\n\u003c/div>\n\n\u003cdiv class=\"overlay\" id=\"ov\" hidden>\u003cdiv class=\"dialog\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"ovTitle\">\n  \u003cheader>\u003cdiv style=\"min-width:0\">\u003ch3 id=\"ovTitle\" class=\"mono\" style=\"overflow-wrap:anywhere\">\u003c/h3>\u003cdiv class=\"meta\" id=\"ovMeta\">\u003c/div>\u003c/div>\u003cdiv class=\"acts\" id=\"ovActs\">\u003c/div>\u003c/header>\n  \u003cdiv class=\"body\" id=\"ovBody\">\u003c/div>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"toast\" id=\"toast\" hidden role=\"status\">\u003c/div>\n\n\u003ctextarea id=\"exemploMd\" hidden>\n# Chat profissional\n\n**Você:**\nQuero um chat profissional simples, com lista de conversas e envio de mensagem.\n\n**Claude:**\nAqui está a primeira versão, tudo em um arquivo só. Salve como `index.html`:\n\n```html\n\u003c!DOCTYPE html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003ctitle>Chat Profissional\u003c/title>\n\u003cstyle>\n/* ===== BASE ===== */\nbody { margin: 0; font-family: sans-serif; display: flex; height: 100vh; }\n/* ===== LISTA ===== */\n#lista { width: 260px; border-right: 1px solid #ddd; overflow: auto; }\n.conversa { padding: 12px; cursor: pointer; }\n.conversa.ativa { background: #eef; }\n/* ===== CHAT ===== */\n#chat { flex: 1; display: flex; flex-direction: column; }\n#mensagens { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; }\n.msg { margin: 6px 0; padding: 8px 12px; border-radius: 8px; background: #f1f1f1; }\n.msg.minha { background: #dcf; align-self: flex-end; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003caside id=\"lista\">\u003c/aside>\n\u003cmain id=\"chat\">\n  \u003cdiv id=\"mensagens\">\u003c/div>\n  \u003cform id=\"form\">\u003cinput id=\"texto\" placeholder=\"Mensagem\">\u003cbutton onclick=\"enviarMensagem(event)\">Enviar\u003c/button>\u003c/form>\n\u003c/main>\n\u003cscript>\n// ===== ESTADO =====\nlet conversas = [\n  { id: 1, nome: 'Cliente A', mensagens: [] },\n  { id: 2, nome: 'Cliente B', mensagens: [] }\n];\nlet ativaId = 1;\nconst STORAGE_KEY = 'chat-pro';\n\n// ===== CONVERSAS =====\nfunction renderLista() {\n  const lista = document.getElementById('lista');\n  lista.innerHTML = conversas.map(c =>\n    `\u003cdiv class=\"conversa ${c.id === ativaId ? 'ativa' : ''}\" onclick=\"abrirConversa(${c.id})\">${c.nome}\u003c/div>`\n  ).join('');\n}\n\nfunction abrirConversa(id) {\n  ativaId = id;\n  renderLista();\n  renderMensagens();\n}\n\n// ===== MENSAGENS =====\nfunction conversaAtiva() {\n  return conversas.find(c => c.id === ativaId);\n}\n\nfunction renderMensagens() {\n  const box = document.getElementById('mensagens');\n  box.innerHTML = conversaAtiva().mensagens\n    .map(m => `\u003cdiv class=\"msg minha\">${m.texto}\u003csmall> ${formatarHora(m.hora)}\u003c/small>\u003c/div>`)\n    .join('');\n}\n\nfunction enviarMensagem(e) {\n  e.preventDefault();\n  const input = document.getElementById('texto');\n  if (!input.value.trim()) return;\n  conversaAtiva().mensagens.push({ texto: input.value, hora: Date.now() });\n  input.value = '';\n  salvar();\n  renderMensagens();\n}\n\n// ===== UTILIDADES =====\nfunction formatarHora(ts) {\n  return new Date(ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });\n}\n\nfunction salvar() {\n  localStorage.setItem(STORAGE_KEY, JSON.stringify(conversas));\n}\n\n// ===== INICIO =====\nconst salvo = localStorage.getItem(STORAGE_KEY);\nif (salvo) conversas = JSON.parse(salvo);\nrenderLista();\nrenderMensagens();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n```\n\n**Você:**\nAgora separa em arquivos.\n\n**Claude:**\nCrie `css/style.css`:\n\n```css\nbody { margin: 0; font-family: sans-serif; display: flex; height: 100vh; }\n#lista { width: 260px; border-right: 1px solid #ddd; }\n.msg { margin: 6px 0; padding: 8px 12px; border-radius: 8px; }\n```\n\nE o **js/app.js**:\n\n```javascript\nlet conversas = [];\nlet ativaId = 1;\n\nfunction renderLista() {\n  document.getElementById('lista').innerHTML = conversas.map(c => c.nome).join('\u003cbr>');\n}\n\nfunction renderMensagens() {\n  // TODO\n}\n\nfunction enviarMensagem(e) {\n  e.preventDefault();\n}\n```\n\n**Você:**\nO botão de enviar não funciona.\n\n**Claude:**\nSubstitua só esta função no `js/app.js`:\n\n```js\nfunction enviarMensagem(e) {\n  e.preventDefault();\n  const input = document.getElementById('texto');\n  conversas[0].mensagens.push({ texto: input.value });\n  renderMensagens();\n}\n```\n\nColoque isto no final do arquivo:\n\n```js\nfunction formatarHora(ts) {\n  return new Date(ts).toLocaleTimeString('pt-BR');\n}\n```\n\n**Você:**\nManda o app.js completo corrigido.\n\n**Claude:**\nAqui está o `js/app.js` completo:\n\n```js\nlet conversas = [];\nlet ativaId = 1;\n\nfunction renderLista() {\n  document.getElementById('lista').innerHTML = conversas.map(c => c.nome).join('\u003cbr>');\n}\n\nfunction renderMensagens() {\n  const box = document.getElementById('mensagens');\n  box.innerHTML = conversas[0].mensagens.map(m => m.texto).join('\u003cbr>');\n}\n\nfunction enviarMensagem(e) {\n  e.preventDefault();\n  const input = document.getElementById('texto');\n  conversas[0].mensagens.push({ texto: input.value });\n  input.value = '';\n  renderMensagens();\n}\n\nfunction formatarHora(ts) {\n  return new Date(ts).toLocaleTimeString('pt-BR');\n}\n```\n\nPara criar as pastas no terminal:\n\n```bash\nmkdir -p meu-chat/css meu-chat/js\n```\n\u003c/textarea>\n\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js\">\u003c/script>\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/jsdiff/5.2.0/diff.min.js\">\u003c/script>\n\u003cscript>\n/* ============================================================\n   NÚCLEO (sem DOM): leitura da conversa e modularizador\n   ============================================================ */\nconst TYPES = {\n  html:{label:'HTML',ext:'html'}, css:{label:'CSS',ext:'css'}, js:{label:'JavaScript',ext:'js'},\n  ts:{label:'TypeScript',ext:'ts'}, json:{label:'JSON',ext:'json'}, py:{label:'Python',ext:'py'},\n  cmd:{label:'Comandos',ext:'sh'}, md:{label:'Markdown',ext:'md'}, other:{label:'Outros',ext:'txt'}\n};\nconst TYPE_ORDER = ['html','css','js','ts','json','py','md','othe ps();\n  const ins = sg.filter(([p,l]) => included(p,l)), outs = sg.filter(([p,l]) => !included(p,l));\n  $('#groupsIn').innerHTML = '\u003ch3 style=\"margin-bottom:4px\">No projeto (' + ins.length + ')\u003c/h3>' + (ins.length ? ins.map(([p,l]) => groupRow(p,l)).join('') : '\u003cp class=\"note\">Nenhum arquivo marcado. Marque abaixo, em “Fora do projeto”, ou dê nomes aos blocos na etapa 2.\u003c/p>');\n  $('#outSummary').textContent = 'Fora do projeto (' + outs.length + '): blocos sem nome e comandos';\n  $('#groupsOut').innerHTML = outs.length ? outs.map(([p,l]) => groupRow(p,l)).join('') : '\u003cp class=\"note\">Nada aqui.\u003c/p>';\n  const files = projectFiles();\n  $('#tree').textContent = treeText(S.projectName || 'projeto', files.map(f => f.path));\n  renderGuide(files); renderCmds(files);\n}\nfunction treeText(root, paths){\n  const t = {}; paths.forEach(p => { let n = t; p.split('/').forEach((seg, i, a) => { n[seg] = n[seg] || (i === a.length-1 ? null : {}); if (n[seg]) n = n[seg]; }); });\n  const lines = [root + '/'];\n  const walk = (node, pre) => { const ks = Object.keys(node).sort((a,b) => ((node[a]===null) - (node[b]===null)) || a.localeCompare(b)); ks.forEach((k, i) => { const last = i === ks.length-1; lines.push(pre + (last ? '└─ ' : '├─ ') + k + (node[k] ? '/' : '')); if (node[k]) walk(node[k], pre + (last ? '   ' : '│  ')); }); };\n  walk(t, ''); if (!paths.length) lines.push('└─ (vazio)');\n  return lines.join('\\n');\n}\nfunction renderGuide(files){\n  const G = $('#guide');\n  if (!files.length){ G.innerHTML = '\u003cp class=\"note\">Marque arquivos no projeto primeiro.\u003c/p>'; return; }\n  const ord = files.slice().sort((a,b) => (a.path.split('/').length - b.path.split('/').length) || a.path.localeCompare(b.path));\n  G.innerHTML = '\u003cdiv class=\"gstep\">\u003cspan class=\"mono\">0\u003c/span>\u003cspan>Crie a pasta \u003cb class=\"mono\">' + esc(S.projectName) + '\u003c/b> (ou use os comandos abaixo para criar tudo de uma vez).\u003c/span>\u003cspan>\u003c/span>\u003c/div>' +\n    ord.map((f, i) => { const key = f.path + '#' + f.block.id; const done = !!S.guideDone[key];\n      return '\u003cdiv class=\"gstep' + (done?' done':'') + '\" data-path=\"' + esc(f.path) + '\">\u003cinput type=\"checkbox\" data-act=\"gdone\" data-key=\"' + esc(key) + '\" ' + (done?'checked':'') + ' aria-label=\"Feito\">\u003cspan class=\"p\">' + (i+1) + '. ' + esc(f.path) + ' \u003cspan class=\"meta\">(' + fmt(f.block.lines) + ' linhas)\u003c/span>\u003c/span>\u003cbutton class=\"btn small\" data-act=\"gcopy\">Copiar conteúdo\u003c/button>\u003c/div>'; }).join('');\n}\nfunction renderCmds(files){\n  const root = S.projectName || 'projeto'; const dirs = new Set([root]);\n  files.forEach(f => { const segs = f.path.split('/'); for (let i=1;i\u003csegs.length;i++) dirs.add(root + '/' + segs.slice(0,i).join('/')); });\n  const fps = files.map(f => root + '/' + f.path); const D = [...dirs].sort();\n  const win = p => p.replace(/\\//g, '\\\\');\n  let out = '', hint = '';\n  if (shell === 'cmd'){ out = D.map(d => 'if not exist \"' + win(d) + '\" mkdir \"' + win(d) + '\"').join('\\n') + '\\n' + fps.map(f => 'if not exist \"' + win(f) + '\" type nul > \"' + win(f) + '\"').join('\\n'); hint = 'Abra o Prompt de Comando na pasta onde quer criar o projeto (na barra de endereço do Explorer, digite cmd e Enter) e cole. Arquivos que já existem não são apagados.'; }\n  else if (shell === 'ps'){ out = D.map(d => 'New-Item -ItemType Directory -Force -Path \"' + win(d) + '\" | Out-Null').join('\\n') + '\\n' + fps.map(f => 'if (!(Test-Path \"' + win(f) + '\")) { New-Item -ItemType File -Path \"' + win(f) + '\" | Out-Null }').join('\\n'); hint = 'No PowerShell ou no terminal do VS Code (Windows). Arquivos que já existem não são apagados.'; }\n  else { out = 'mkdir -p ' + D.map(d => '\"' + d + '\"').join(' ') + '\\n' + fps.map(f => 'touch \"' + f + '\"').join('\\n'); hint = 'No Terminal do Linux ou Mac. touch não apaga arquivos existentes.'; }\n  $('#cmdOut').textContent = files.length ? out : '# Marque arquivos no projeto primeiro';\n  $('#shellHint').textContent = hint;\n  $$('#shellSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.sh === shell)));\n}\nfunction onGroupEvent(e){\n  const row = e.target.closest('[data-path]'); if (!row) return; const p = row.dataset.path;\n  const a = e.target.closest('[data-act]'); if (!a) return; const act = a.dataset.act;\n  const list = groups().get(p);\n  if (e.type === 'click'){\n    if (act === 'gview'){ const b = chosenOf(p, list); openViewer(b); }\n    else if (act === 'gcmp'){ const ch = chosenOf(p, list); const i = list.indexOf(ch); const other = i > 0 ? list[i-1] : list[1]; openCompare(p, other.id, ch.id); }\n    else if (act === 'gcopy'){ const b = chosenOf(p, list); copyText(b.code, p); }\n    return;\n  }\n  if (act === 'inc'){ S.included[p] = a.checked; }\n  else if (act === 'choose'){ S.chosen[p] = +a.value; }\n  else if (act === 'gpath'){ renameGroup(p, a.value); }\n  else if (act === 'gdone'){ S.guideDone[a.dataset.key] = a.checked; row.classList.toggle('done', a.checked); persist(); return; }\n  persist(); renderProject(); renderStats();\n}\n['click','change'].forEach(ev => { $('#groupsIn').addEventListener(ev, onGroupEvent); $('#groupsOut').addEventListener(ev, onGroupEvent); $('#guide').addEventListener(ev, onGroupEvent); });\n$('#projName').addEventListener('change', e => { S.projectName = (e.target.value.trim().replace(/[\\\\/:*?\"\u003c>|]+/g,'-') || 'meu-projeto'); persist(); renderProject(); });\n$('#shellSeg').addEventListener('click', e => { const b = e.target.closest('[data-sh]'); if (!b) return; shell = b.dataset.sh; renderCmds(projectFiles()); });\n$('#copyCmd').addEventListener('click', () => copyText($('#cmdOut').textContent, 'Comandos'));\n\nfunction readme(files){\n  const g = groups();\n  return '# ' + S.projectName + '\\n\\nMontado com a Triagem de Código em ' + new Date().toLocaleString('pt-BR') + '.\\n\\n| Arquivo | Versão usada | Linhas | De onde veio |\\n|---|---|---|---|\\n' +\n    files.map(f => { const list = g.get(f.path); const i = list.indexOf(f.block) + 1; return '| ' + f.path + ' | ' + i + ' de ' + list.length + ' | ' + f.block.lines + ' | ' + f.block.src + ', bloco #' + f.block.id + (f.block.turn ? ', mensagem ' + f.block.turn : '') + ' |'; }).join('\\n') +\n    '\\n\\nAs outras versões de cada arquivo estão no .zip “com todas as versões”.\\n';\n}\n$('#zipProj').addEventListener('click', async () => {\n  const files = projectFiles(); if (!files.length){ toast('Nenhum arquivo marcado no projeto'); return; }\n  if (!needZip()) return;\n  const z = new JSZip(); const root = z.folder(S.projectName || 'projeto');\n  files.forEach(f => root.file(f.path, f.block.code.replace(/\\s*$/, '\\n')));\n  root.file('LEIA-ME-TRIAGEM.md', readme(files));\n  saveFile((S.projectName || 'projeto') + '.zip', await z.generateAsync({ type:'blob' }));\n});\n$('#zipAll').addEventListener('click', async () => {\n  if (!S.blocks.length){ toast('Nada importado ainda'); return; }\n  if (!needZip()) return;\n  const z = new JSZip(); const base = z.folder((S.projectName || 'projeto') + '-completo');\n  const g = groups(); const vi = versionInfo();\n  for (const [p, list] of g){\n    const ext = extOf(p) || 'txt'; const dir = base.folder('todas-as-versoes/' + p);\n    const ch = chosenOf(p, list);\n    list.forEach((b,i) => dir.file('v' + (i+1) + '_bloco' + b.id + (b.turn ? '_msg' + b.turn : '') + '_' + b.lines + 'linhas' + (b.id===ch.id ? '_ESCOLHIDA' : '') + '.' + ext, b.code));\n  }\n  const byId = {}; S.blocks.forEach(b => byId[b.id] = b);\n  S.texts.forEach(t => {\n    const txt = t.text.replace(/\\u0000B(\\d+)\\u0000/g, (m, id) => { const b = byId[id]; if (!b) return '> [bloco de código removido]'; const v = vi[b.id]; return '> [CÓDIGO] ' + b.path + ' · versão ' + v.i + ' de ' + v.n + ' · bloco #' + b.id + ' · ' + b.lines + ' linhas'; });\n    base.file('conversas-sem-codigo/' + t.name.replace(/[\\\\/:*?\"\u003c>|]+/g,'_').replace(/\\.(md|txt|markdown)$/i,'') + '.md', '# Conversa sem os códigos (para ler a lógica)\\n\\nCada código foi trocado por uma linha [CÓDIGO] dizendo em qual arquivo ele está.\\n\\n' + txt);\n  });\n  const cmds = S.blocks.filter(b => b.type === 'cmd');\n  if (cmds.length) base.file('todos-os-comandos.md', '# Todos os comandos que apareceram nas conversas\\n\\nNa ordem em que apareceram.\\n\\n' + cmds.map(b => '## Bloco #' + b.id + (b.turn ? ' · mensagem ' + b.turn : '') + '\\n\\n```\\n' + b.code + '\\n```').join('\\n\\n') + '\\n');\n  base.file('organizacao.json', JSON.stringify(S));\n  saveFile((S.projectName || 'projeto') + '-completo.zip', await z.generateAsync({ type:'blob' }));\n});\n$('#saveJson').addEventListener('click', () => { if (!S.blocks.length){ toast('Nada importado ainda'); return; } saveFile('organizacao-' + (S.projectName || 'projeto') + '.json', JSON.stringify(S)); });\n\n/* ---------- 4. modularizar ---------- */\nfunction renderModSrc(){\n  const sel = $('#modSrc'); const cur = sel.value;\n  const opts = sortedGroups().filter(([, l]) => ['html','js','ts'].includes(l[0].type)).flatMap(([p, l]) => l.map((b,i) => ({ b, label: (p.startsWith('sem-nome/') ? 'bloco #' + b.id + ' sem nome' : p) + ' · v' + (i+1) + ' · ' + fmt(b.lines) + ' linhas' + (b.id === chosenOf(p,l).id && l.length > 1 ? ' (escolhida)' : '') })));\n  sel.innerHTML = '\u003coption value=\"\">Pegar de um bloco importado…\u003c/option>' + opts.map(o => '\u003coption value=\"' + o.b.id + '\">' + esc(o.label) + '\u003c/option>').join('');\n  if (cur) sel.value = cur;\n  if (!$('#modIn').value && S.example){ const h = S.blocks.find(b => b.type === 'html'); if (h){ $('#modIn').value = h.code; sel.value = String(h.id); } }\n}\nlet modLabel = '';\n$('#modSrc').addEventListener('change', e => { const b = blockById(e.target.value); if (b){ $('#modIn').value = b.code; modLabel = b.name || 'bloco #' + b.id; } });\n$('#modFile').addEventListener('change', async e => { const f = e.target.files[0]; if (!f) return; $('#modIn').value = await f.text(); modLabel = f.name; e.target.value = ''; $('#modSrc').value = ''; });\n$('#modIn').addEventListener('input', () => { modLabel = ''; });\nconst modeVal = () => document.querySelector('input[name=mode]:checked').value;\n$('#anaBtn').addEventListener('click', () => {\n  const src = $('#modIn').value; if (!src.trim()){ toast('Cole um HTML ou JS primeiro'); return; }\n  let an; try { an = analyzeInput(src); } catch(err){ $('#modAn').innerHTML = '\u003cdiv class=\"panel\">\u003cul class=\"warns\">\u003cli>Não consegui analisar este código: ' + esc(err.message) + '\u003c/li>\u003c/ul>\u003c/div>'; return; }\n  lastAn = an; lastGen = null; $('#modOut').innerHTML = '';\n  renderAnalysis();\n});\nfunction renderAnalysis(){\n  const an = lastAn; const ch = an.chunks;\n  const nFn = ch.filter(c => c.kind==='fn'||c.kind==='fnvar').length, nCl = ch.filter(c => c.kind==='class').length, nVar = ch.filter(c => c.kind==='var').length, nCode = ch.filter(c => c.kind==='code'||c.kind==='import').length;\n  const mods = [...new Set(ch.filter(isDecl).map(c => c.module))];\n  const kindLabel = { fn:'função', fnvar:'função', class:'classe', var:'variável', code:'inicialização', import:'import' };\n  if (!ch.length && !an.cssParts.length){ $('#modAn').innerHTML = '\u003cdiv class=\"panel\">\u003cp class=\"note\" style=\"margin:0\">Não encontrei JavaScript nem CSS dentro do código. Se o JS está em arquivos separados (script src=…), abra esses arquivos aqui.\u003c/p>\u003c/div>'; return; }\n  $('#modAn').innerHTML = '\u003cdiv class=\"panel stack\">\u003ch2>O que encontrei\u003c/h2>' +\n    '\u003cp style=\"margin:0\">' + [nFn && fmt(nFn) + ' funç' + (nFn>1?'ões':'ão'), nCl && nCl + ' classe' + (nCl>1?'s':''), nVar && nVar + ' declaraç' + (nVar>1?'ões':'ão') + ' de variáveis', nCode && nCode + ' trecho' + (nCode>1?'s':'') + ' de inicialização', an.cssParts.length && an.cssParts.length + ' arquivo' + (an.cssParts.length>1?'s':'') + ' de CSS'].filter(Boolean).join(', ') + '. ' +\n    (an.sections.length >= 2 ? 'Usei as seções do próprio código: ' + esc(an.sections.join(', ')) + '.' : 'O código não tem títulos de seção, então agrupei pelo nome das funções.') + ' Proposta: ' + mods.length + ' arquivo' + (mods.length===1?'':'s') + ' de funções.\u003c/p>' +\n    (an.warnings.length ? '\u003cul class=\"warns\">' + an.warnings.map(w => '\u003cli>' + esc(w) + '\u003c/li>').join('') + '\u003c/ul>' : '') +\n    '\u003cp class=\"note\" style=\"margin:0\">Para mudar o arquivo de uma função, edite a coluna “Vai para”. Use nomes curtos, sem acento (ex.: chat, lista, api).\u003c/p>' +\n    '\u003cdatalist id=\"modNames\">' + mods.map(m => '\u003coption value=\"' + esc(m) + '\">').join('') + '\u003c/datalist>' +\n    '\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Nome\u003c/th>\u003cth>Tipo\u003c/th>\u003cth>Linhas\u003c/th>\u003cth>Linha no original\u003c/th>\u003cth>Vai para\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>' +\n    ch.map(c => '\u003ctr>\u003ctd class=\"mono\">' + esc(c.names.length ? c.names.join(', ') : (c.text.trim().split('\\n').find(l => l.trim() && !/^\\s*(\\/\\/|\\/\\*|\\*)/.test(l)) || '').slice(0,48)) + '\u003c/td>\u003ctd>' + kindLabel[c.kind] + '\u003c/td>\u003ctd class=\"num\">' + fmt(c.nlines) + '\u003c/td>\u003ctd class=\"num\">' + fmt(c.line) + '\u003c/td>\u003ctd>' +\n      (isDecl(c) ? '\u003cinput list=\"modNames\" data-cid=\"' + c.id + '\" value=\"' + esc(c.module) + '\" aria-label=\"Arquivo de ' + esc(c.names[0]) + '\">' : '\u003cspan class=\"mono\">' + (c.kind==='var' ? 'estado' : 'main') + '\u003c/span>') + '\u003c/td>\u003c/tr>').join('') +\n    '\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"row-flex\">\u003cbutton class=\"btn primary\" id=\"genBtn\">Gerar arquivos\u003c/button>\u003cspan class=\"note\">Modo: ' + (modeVal()==='simple' ? 'Simples' : 'Módulos ES') + ' (troque acima se quiser)\u003c/span>\u003c/div>\u003c/div>';\n}\n$('#modAn').addEventListener('change', e => { const c = e.target.dataset.cid; if (c === undefined) return; let v = slug(e.target.value); if (RESERVED.has(v)) v += '-funcoes'; lastAn.chunks[+c].module = v; e.target.value = v; });\n$('#modAn').addEventListener('click', e => { if (e.target.id === 'genBtn') doGenerate(); });\n$$('input[name=mode]').forEach(r => r.addEventListener('change', () => { if (lastAn){ renderAnalysis(); if (lastGen) doGenerate(); } }));\nfunction doGenerate(){\n  let g; try { g = generate(lastAn, modeVal(), modLabel); } catch(err){ $('#modOut').innerHTML = '\u003cdiv class=\"panel\">\u003cul class=\"warns\">\u003cli>Erro ao gerar: ' + esc(err.message) + '\u003c/li>\u003c/ul>\u003c/div>'; return; }\n  lastGen = g;\n  const bad = [];\n  g.files.forEach(f => { if (/\\.js$/.test(f.path)){ try { new Function(f.content.replace(/^\\s*(import\\s[^\\n]*|export\\s+(?=function|async|class|const|let|var))/gm, m => m.startsWith('export') ? '' : '//' + m)); } catch(e){ bad.push(f.path + ': ' + e.message); } } });\n  const mapa = g.files.find(f => f.path === 'MAPA.md');\n  $('#modOut').innerHTML = '\u003cdiv class=\"panel stack\">\u003ch2>Arquivos gerados\u003c/h2>' +\n    (bad.length ? '\u003cul class=\"warns\">' + bad.map(b => '\u003cli>Possível erro de sintaxe em ' + esc(b) + '. Pode ser um trecho que já estava quebrado no original; confira antes de usar.\u003c/li>').join('') + '\u003c/ul>' : '\u003cp class=\"okmark\" style=\"margin:0\">Conferi a sintaxe de todos os .js gerados: sem erros.\u003c/p>') +\n    (g.warnings.length ? '\u003cul class=\"warns\">' + g.warnings.map(w => '\u003cli>' + esc(w) + '\u003c/li>').join('') + '\u003c/ul>' : '') +\n    '\u003cdiv class=\"files\">' + g.files.map((f,i) => '\u003cdiv class=\"frow\">\u003cspan class=\"p\">' + esc(f.path) + ' \u003cspan class=\"meta\">(' + fmt(f.content.split('\\n').length) + ' linhas)\u003c/span>\u003c/span>\u003cspan class=\"acts\">\u003cbutton class=\"btn small\" data-fi=\"' + i + '\" data-fa=\"view\">Ver\u003c/button>\u003cbutton class=\"btn small\" data-fi=\"' + i + '\" data-fa=\"copy\">Copiar\u003c/button>\u003c/span>\u003c/div>').join('') + '\u003c/div>' +\n    '\u003cdiv class=\"row-flex\">\u003cbutton class=\"btn primary\" id=\"modZip\">Baixar .zip\u003c/button>\u003cbutton class=\"btn\" id=\"modToProj\">Adicionar ao Projeto\u003c/button>\u003c/div>' +\n    '\u003cdetails class=\"box\">\u003csummary>Ver o MAPA.md\u003c/summary>\u003cdiv>\u003cpre class=\"code\" style=\"max-height:420px;white-space:pre-wrap\">' + esc(mapa.content) + '\u003c/pre>\u003c/div>\u003c/details>\u003c/div>';\n}\n$('#modOut').addEventListener('click', async e => {\n  const fb = e.target.closest('[data-fi]');\n  if (fb){ const f = lastGen.files[+fb.dataset.fi]; if (fb.dataset.fa === 'view') openFileViewer(f.path, f.content); else copyText(f.content, f.path); return; }\n  if (e.target.id === 'modZip'){\n    if (!needZip()) return;\n    const z = new JSZip(); const name = (slug(modLabel.replace(/\\.[a-z]+$/i,'')) || 'codigo') + '-modular'; const root = z.folder(name);\n    lastGen.files.forEach(f => root.file(f.path, f.content));\n    saveFile(name + '.zip', await z.generateAsync({ type:'blob' }));\n  }\n  if (e.target.id === 'modToProj'){\n    clearExample();\n    const src = 'modularizado' + (modLabel ? ': ' + modLabel : '');\n    const nb = lastGen.files.filter(f => !f.path.startsWith('js/_repetidas')).map(f => fileBlock(f.content, f.path, src));\n    S.blocks.push(...nb); nb.forEach(b => { S.chosen[b.path] = b.id; S.included[b.path] = true; });\n    S.sources.push({ name: src, size: nb.reduce((a,b) => a + b.code.length, 0), blocks: nb.length, kind: 'modular' });\n    persist(); renderStats(); toast(nb.length + ' arquivos adicionados ao Projeto como versão escolhida'); setTab('projeto');\n  }\n});\n\n/* ---------- início ---------- */\n$$('nav.steps button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));\nconst saved = restore();\nif (saved){ S = Object.assign(fresh(), saved); } else loadExample();\nupdateDlUI();\nrenderAll();\n})();\n\u003c/script>\n\n\u003c/body>\u003c/html>","l":"html","n":""},{"p":"colecionador-de-comandos.html","t":"\u003c!doctype html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"theme-color\" content=\"#1d2a44\">\n\u003ctitle>Colecionador de Comandos\u003c/title>\n\u003cstyle>\n:root { --bg:#f1f2f6; --p:#fff; --f:#1b2130; --m:#5d6578; --l:#d9dde6; --az:#2a5bd7; --azc:#e6edfc; --v:#1f6b4f; --vc:#e3f1e9; --a:#fff3d3; --r:#a3332a; --rc:#fbe6e3; --cod:#141b2a; --codf:#dce6ff; }\n@media (prefers-color-scheme: dark) { :root:not([data-theme=\"light\"]) { --bg:#10141c; --p:#181f2b; --f:#e8ebf2; --m:#9aa4b7; --l:#2a3343; --az:#7ea2ff; --azc:#1c2742; --v:#6fd1a4; --vc:#1d3329; --a:#33290f; --r:#f0958c; --rc:#3a1f1c; --cod:#0b0f18; color-scheme:dark; } }\n* { box-sizing:border-box; }\nbody { margin:0; background:var(--bg); color:var(--f); font:17px/1.5 system-ui,\"Segoe UI\",Roboto,sans-serif; }\nheader { background:#1d2a44; color:#fff; padding:12px 16px; position:sticky; top:0; z-index:5; }\nheader .linha1 { display:flex; align-items:center; gap:8px; }\nheader b { font-size:19px; flex:1; }\nheader small { color:#aebbd6; font-size:13px; }\n.busca { display:flex; gap:6px; margin-top:8px; }\n.busca input { flex:1; min-width:0; font:inherit; padding:10px 12px; border-radius:10px; border:0; }\n.bt { border:1px solid var(--l); background:var(--p); color:var(--f); border-radius:10px; padding:9px 13px; font:inherit; font-size:15px; cursor:pointer; min-height:42px; }\n.bt.az { background:var(--az); border-color:var(--az); color:#fff; font-weight:600; }\n.bt.r { background:var(--r); border-color:var(--r); color:#fff; }\n.bt.mini { min-height:34px; padding:5px 10px; font-size:14px; }\n.bt.cab { background:#33456b; border-color:#4a5d86; color:#fff; }\nmain { max-width:860px; margin:0 auto; padding:10px 14px 90px; }\n.acoes { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 4px; }\n.filtros { display:flex; gap:6px; overflow-x:auto; padding:6px 0; }\n.filtros button { flex:none; border:1px solid var(--l); background:var(--p); color:var(--f); border-radius:999px; padding:6px 12px; font:inherit; font-size:14px; cursor:pointer; }\n.filtros button.on { background:var(--az); border-color:var(--az); color:#fff; }\n.item { background:var(--p); border:1px solid var(--l); border-radius:14px; padding:12px 14px; margin:10px 0; }\n.item h3 { margin:0 0 4px; font-size:18px; display:flex; gap:8px; align-items:flex-start; }\n.item h3 span.t { flex:1; }\n.selo { display:inline-block; font-size:12px; font-weight:700; padding:2px 9px; border-radius:999px; background:var(--azc); color:var(--az); white-space:nowrap; }\n.exp { color:var(--m); font-size:15px; margin:4px 0; white-space:pre-wrap; }\n.passo { margin:8px 0; }\n.passo .n { font-weight:700; color:var(--az); margin-right:4px; }\n.cmd { display:flex; gap:8px; align-items:flex-start; background:var(--cod); color:var(--codf); border-radius:10px; padding:10px; margin:4px 0; }\n.cmd pre { flex:1; min-width:0; margin:0; font:14px/1.5 ui-monospace,Consolas,monospace; white-space:pre-wrap; overflow-wrap:anywhere; }\n.cmd button { flex:none; border:0; border-radius:8px; background:#3a64d8; color:#fff; padding:7px 10px; font:14px system-ui; cursor:pointer; }\n.perigo { background:var(--rc); color:var(--r); border-radius:8px; padding:6px 10px; font-size:14px; margin:4px 0; }\n.rodape-item { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; border-top:1px solid var(--l); padding-top:8px; }\n.mut { color:var(--m); font-size:14px; }\n.aviso { background:var(--a); border-radius:10px; padding:10px 12px; font-size:15px; margin:8px 0; }\n.ok { background:var(--vc); border-radius:10px; padding:10px 12px; font-size:15px; margin:8px 0; }\ndialog { border:0; border-radius:16px; padding:0; width:min(96vw,760px); max-height:92vh; background:var(--p); color:var(--f); box-shadow:0 20px 60px rgba(0,0,0,.35); }\ndialog::backdrop { background:rgba(10,15,30,.55); }\n.dlg { padding:14px 16px; overflow:auto; max-height:92vh; }\n.dlg h2 { margin:0 0 10px; font-size:20px; }\n.campo { margin:8px 0; } .campo label { display:block; font-size:14px; font-weight:600; margin-bottom:3px; }\n.campo input, .campo select, .campo textarea { width:100%; font:inherit; padding:9px 11px; border-radius:10px; border:1px solid var(--l); background:var(--p); color:var(--f); }\ntextarea.mono { font:14px/1.5 ui-monospace,Consolas,monospace; }\n.passo-ed { border:1px solid var(--l); border-radius:12px; padding:8px 10px; margin:8px 0; background:var(--bg); }\n.extraido { border:1px solid var(--l); border-radius:12px; padding:8px 10px; margin:8px 0; }\n.extraido.off { opacity:.45; }\n.qr { display:flex; justify-content:center; padding:10px; background:#fff; border-radius:12px; }\n.qr canvas { width:min(78vw,340px); height:auto; image-rendering:pixelated; }\n.vazio { text-align:center; padding:30px 10px; color:var(--m); }\n.toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:#1b2130; color:#fff; padding:10px 16px; border-radius:10px; z-index:99; box-shadow:0 6px 20px rgba(0,0,0,.3); max-width:92vw; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\n  \u003cdiv class=\"linha1\">\u003cb>🧰 Colecionador de Comandos\u003c/b>\u003csmall id=\"conta\">\u003c/small>\u003c/div>\n  \u003cdiv class=\"busca\">\u003cinput type=\"search\" id=\"q\" placeholder=\"Procurar: backup, adb, ollama…\" aria-label=\"Procurar\">\u003cbutton class=\"bt cab\" id=\"mic-q\" title=\"Falar\">🎤\u003c/button>\u003c/div>\n\u003c/header>\n\u003cmain>\n  \u003cdiv class=\"acoes\">\n    \u003cbutton class=\"bt az\" id=\"b-colar\">📥 Colar resposta da IA\u003c/button>\n    \u003cbutton class=\"bt\" id=\"b-novo\">＋ Novo\u003c/button>\n    \u003cbutton class=\"bt\" id=\"b-exportar\">💾 Guardar cópia\u003c/button>\n    \u003cbutton class=\"bt\" id=\"b-importar\">📂 Abrir cópia\u003c/button>\n    \u003cinput type=\"file\" id=\"arq\" accept=\".json,application/json,text/plain\" hidden>\n  \u003c/div>\n  \u003cdiv id=\"lembrete\">\u003c/div>\n  \u003cdiv class=\"filtros\" id=\"filtros\">\u003c/div>\n  \u003cdiv id=\"lista\">\u003c/div>\n\u003c/main>\n\n\u003c!-- editor -->\n\u003cdialog id=\"dlg-ed\">\u003cdiv class=\"dlg\">\n  \u003ch2 id=\"ed-titulo-dlg\">Comando\u003c/h2>\n  \u003cdiv class=\"campo\">\u003clabel>Nome (para achar depois)\u003c/label>\u003cdiv style=\"display:flex;gap:6px\">\u003cinput id=\"ed-titulo\" placeholder=\"ex.: Fazer backup do celular\">\u003cbutton class=\"bt\" type=\"button\" data-mic=\"ed-titulo\">🎤\u003c/button>\u003c/div>\u003c/div>\n  \u003cdiv class=\"campo\">\u003clabel>Onde roda\u003c/label>\u003cselect id=\"ed-onde\">\u003c/select>\u003c/div>\n  \u003cdiv class=\"campo\">\u003clabel>Para que serve (explicação)\u003c/label>\u003ctextarea id=\"ed-exp\" rows=\"2\" placeholder=\"ex.: Copia as fotos do celular para o computador pelo Wi-Fi\">\u003c/textarea>\u003c/div>\n  \u003cdiv id=\"ed-passos\">\u003c/div>\n  \u003cbutton class=\"bt mini\" id=\"ed-mais\" type=\"button\">＋ Mais um passo (comando seguinte)\u003c/button>\n  \u003cdiv class=\"campo\">\u003clabel>Etiquetas (separadas por vírgula)\u003c/label>\u003cinput id=\"ed-tags\" placeholder=\"backup, celular\">\u003c/div>\n  \u003cdiv class=\"acoes\" style=\"justify-content:flex-end;margin-top:12px\">\u003cbutton class=\"bt\" id=\"ed-cancelar\" type=\"button\">Cancelar\u003c/button>\u003cbutton class=\"bt az\" id=\"ed-salvar\" type=\"button\">✅ Salvar\u003c/button>\u003c/div>\n\u003c/div>\u003c/dialog>\n\n\u003c!-- colar da IA -->\n\u003cdialog id=\"dlg-colar\">\u003cdiv class=\"dlg\">\n  \u003ch2>📥 Colar resposta da IA\u003c/h2>\n  \u003cp class=\"mut\" style=\"margin:0 0 6px\">Copie a resposta inteira (do Claude, do Gemini…) e cole aqui. Eu separo cada comando com a explica     i('Copiar o celular INTEIRO para o HD (pelo cabo)', 'adb', 'Troque E: pela letra do seu HD em \"Este Computador\". Funciona mesmo se o celular não aparecer no Windows.', [{ explica: '', cmd: 'adb pull /sdcard/ \"E:\\\\Backup celular\"' }], ['backup', 'hd', 'adb']),\n      i('Devolver peças do sistema que foram desinstaladas', 'adb', 'Traz de volta (sem apagar nada) o app Arquivos, USB/MTP e mídia. Use se o HD ou o cabo pararam de funcionar.', [\n        { explica: 'App Arquivos:', cmd: 'adb shell cmd package install-existing com.google.android.documentsui' },\n        { explica: 'Armazenamento externo (HD/pendrive):', cmd: 'adb shell cmd package install-existing com.android.externalstorage' },\n        { explica: 'Transferência pelo cabo (MTP):', cmd: 'adb shell cmd package install-existing com.android.mtp' },\n        { explica: 'Mídia (fotos e vídeos):', cmd: 'adb shell cmd package install-existing com.google.android.providers.media.module' },\n      ], ['adb', 'conserto', 'hd']),\n      i('Desativar / reativar um app do Google', 'adb', 'Desativar não apaga: dá para ligar de volta. Troque o nome do app.', [\n        { explica: 'Ver a lista dos apps do Google:', cmd: 'adb shell pm list packages google' },\n        { explica: 'Desativar (exemplo: YouTube):', cmd: 'adb shell pm disable-user --user 0 com.google.android.youtube' },\n        { explica: 'Ligar de volta:', cmd: 'adb shell pm enable com.google.android.youtube' },\n      ], ['adb', 'google']),\n      i('Instalar o ADB no Linux', 'linux', '', [{ explica: '', cmd: 'sudo apt install adb' }], ['adb', 'linux']),\n      i('Instalar o Ollama (IA no computador) no Linux', 'linux', 'No Linux ele já fica ligado sozinho.', [{ explica: 'Instalar:', cmd: 'curl -fsSL https://ollama.com/install.sh | sh' }, { explica: 'Baixar um modelo que fala português:', cmd: 'ollama pull qwen2.5:3b' }], ['ollama', 'ia']),\n      i('Ollama no celular aceitar o app 🤖 IA', 'termux', 'Liga o Ollama no Termux deixando as páginas (Mini SK, jurídico) conversarem com ele.', [{ explica: '', cmd: 'OLLAMA_ORIGINS=\"*\" ollama serve' }], ['ollama', 'ia']),\n      i('Abrir o terminal numa pasta do Windows', 'windows', 'Abra a pasta, clique na barra de endereço lá em cima, apague o que tem, digite isto e aperte Enter.', [{ explica: '', cmd: 'cmd' }], ['windows']),\n    ];\n  }\n\n  desenhar();\n  window.__col = { separar, adivinhar, dados: () => dados };\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","l":"html","n":""},{"p":"construtor-apk.html","t":"\u003c!DOCTYPE html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\"/>\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\"/>\n\u003ctitle>🔧 ConstruAPK Pro — Analisador e Gerador\u003c/title>\n\u003cstyle>\n*{box-sizing:border-box;margin:0;padding:0}\nbody{font-family:'Segoe UI',monospace;background:#0d1117;color:#c9d1d9;height:100vh;display:flex;flex-direction:column}\nheader{background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}\nheader h1{font-size:15px;color:#58a6ff;white-space:nowrap}\n.hbtns{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}\n.hbtns button{padding:5px 10px;border-radius:6px;border:none;cursor:pointer;font-size:11px;font-weight:600}\n.btn-import{background:#1f6feb;color:#fff}\n.btn-folder{background:#21262d;color:#c9d1d9;border:1px solid #30363d}\n.btn-export{background:#238636;color:#fff}\n.main{display:flex;flex:1;overflow:hidden}\n\n/* SIDEBAR */\n.sidebar{width:260px;min-width:180px;background:#161b22;border-right:1px solid #30363d;display:flex;flex-direction:column;overflow:hidden;transition:width 0.2s}\n.sidebar.collapsed{width:0;min-width:0}\n.sb-header{padding:8px;border-bottom:1px solid #30363d;display:flex;gap:4px;flex-wrap:wrap}\n.sb-header button{font-size:10px;padding:3px 7px;border-radius:4px;border:1px solid #30363d;background:#21262d;color:#c9d1d9;cursor:pointer}\n.sb-header button:hover{background:#30363d}\n.sb-search{padding:4px 8px;border-bottom:1px solid #30363d}\n.sb-search input{width:100%;padding:4px 8px;background:#21262d;border:1px solid #30363d;border-radius:4px;color:#c9d1d9;font-size:11px;outline:none}\n.file-tree{flex:1;overflow-y:auto;padding:4px 0}\n.ti{display:flex;align-items:center;gap:5px;padding:2px 8px;cursor:pointer;font-size:11px;user-select:none;border-radius:3px;margin:0 4px}\n.ti:hover{background:#21262d}\n.ti.active{background:#1f3a5f;color:#58a6ff}\n.ti.folder{color:#e3b341}\n.ti .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.ti .sz{color:#8b949e;font-size:9px}\n.ti .warn{color:#f85149;font-size:9px;margin-left:2px}\n\n/* EDITOR */\n.editor-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}\n.tabs{background:#161b22;border-bottom:1px solid #30363d;display:flex;overflow-x:auto;min-height:34px;align-items:stretch}\n.tab{padding:6px 12px;font-size:11px;cursor:pointer;border-right:1px solid #30363d;white-space:nowrap;display:flex;align-items:center;gap:5px;color:#8b949e;flex-shrink:0}\n.tab:hover{background:#21262d;color:#c9d1d9}\n.tab.active{background:#0d1117;color:#c9d1d9;border-bottom:2px solid #58a6ff}\n.tab .cx{opacity:0.5;font-size:13px;line-height:1}\n.tab .cx:hover{opacity:1;color:#f85149}\n.ec{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}\n.ec-bar{padding:3px 10px;background:#161b22;border-bottom:1px solid #30363d;font-size:10px;color:#8b949e;display:flex;gap:10px;align-items:center}\n.ec-bar button{padding:2px 7px;border-radius:3px;border:none;cursor:pointer;font-size:10px}\n.ec-bar .b-save{background:#238636;color:#fff}\n.ec-bar .b-clean{background:#9a6700;color:#fff}\ntextarea.ce{flex:1;width:100%;background:#0d1117;color:#c9d1d9;border:none;outline:none;padding:12px;font-family:'Fira Code',monospace;font-size:12px;line-height:1.6;resize:none;tab-size:2}\n.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#8b949e;gap:10px;padding:20px;text-align:center}\n.welcome h2{color:#58a6ff;font-size:16px}\n\n/* PAINEL */\n.panel{width:300px;min-width:240px;background:#161b22;border-left:1px solid #30363d;display:flex;flex-direction:column;overflow:hidden}\n.ptabs{display:flex;border-bottom:1px solid #30363d}\n.ptab{flex:1;padding:7px 4px;font-size:10px;text-align:center;cursor:pointer;color:#8b949e;border-bottom:2px solid transparent;white-space:nowrap}\n.ptab:hover{color:#c9d1d9}\n.ptab.active{color:#58a6ff;border-bottom-color:#58a6ff}\n.pc{flex:1;overflow-y:auto;padding:10px}\n\n/* Cards de análise */\n.card{border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:11px;display:flex;align-items:flex-start;gap:7px}\n.card.ok{background:#0d2818;border-left:3px solid #3fb950;color:#3fb950}\n.card.warn{background:#2d1f00;border-left:3px solid #e3b341;color:#e3b341}\n.card.err{background:#2d0f0f;border-left:3px solid #f85149;color:#f85149}\n.card .ci{flex-shrink:0;font-size:14px}\n.card .ct{flex:1}\n.card .cl{font-weight:700}\n.card .cd{color:#8b949e;font-size:10px;margin-top:2px}\n.card .fix-btn{margin-top:4px;padding:2px 7px;border-radius:3px;border:none;cursor:pointer;font-size:10px;background:#1f6feb;color:#fff}\n.card .fix-btn:hover{background:#388bfd}\n\n/* Botões de geração */\n.gb{width:100%;padding:7px 10px;margin-bottom:5px;border-radius:6px;border:1px solid #30363d;background:#21262d;color:#c9d1d9;cursor:pointer;font-size:11px;text-align:left;display:flex;align-items:center;gap:7px}\n.gb:hover{background:#30363d;border-color:#58a6ff;color:#fff}\n.gb .gbi{font-size:14px;flex-shrink:0}\n.gb .gbt{flex:1}\n.gb .gbd{font-size:9px;color:#8b949e;display:block;margin-top:1px}\n.gb .badge{font-size:9px;padding:1px 5px;border-radius:8px;color:#fff;flex-shrink:0}\n.bg-ok{background:#238636}\n.bg-warn{background:#9a6700}\n.bg-info{background:#1f6feb}\n.bg-err{background:#da3633}\n\n/* Stats */\n.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}\n.stat{background:#21262d;border-radius:6px;padding:6px;text-align:center}\n.stat .n{font-size:18px;font-weight:700;color:#58a6ff}\n.stat .l{font-size:9px;color:#8b949e;margin-top:1px}\n\n/* Seção */\n.sec{margin-bottom:14px}\n.sec h3{font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px;padding-bottom:4px;border-bottom:1px solid #21262d}\n\n/* Alerta de problema */\n.problem{background:#2d0f0f;border:1px solid #f85149;border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:11px}\n.problem .pt{color:#f85149;font-weight:700;margin-bottom:3px}\n.problem .pd{color:#c9d1d9;font-size:10px}\n.problem .pf{margin-top:5px;padding:2px 8px;border-radius:3px;border:none;cursor:pointer;font-size:10px;background:#da3633;color:#fff}\n\n/* Drop */\n.drop-overlay{position:fixed;inset:0;background:rgba(88,166,255,0.08);border:3px dashed #58a6ff;z-index:999;display:none;align-items:center;justify-content:center;font-size:22px;color:#58a6ff;flex-direction:column;gap:8px}\n.drop-overlay.active{display:flex}\n\n/* Toast */\n.toast{position:fixed;bottom:16px;right:16px;padding:9px 14px;border-radius:7px;font-size:12px;z-index:9999;animation:fin 0.3s ease;max-width:280px;color:#fff}\n.toast.ok{background:#238636}\n.toast.err{background:#da3633}\n.toast.warn{background:#9a6700}\n@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}\n\n/* Scrollbar */\n::-webkit-scrollbar{width:5px;height:5px}\n::-webkit-scrollbar-track{background:#0d1117}\n::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}\n\ninput[type=file]{display:none}\n\n/* Modo target */\n.target-selector{display:flex;gap:6px;margin-bottom:10px}\n.target-btn{flex:1;padding:6px;border-radius:6px;border:2px solid #30363d;background:#21262d;color:#8b949e;cursor:pointer;font-size:11px;text-align:center;transition:all 0.2s}\n.target-btn:hover{border-color:#58a6ff;color:#c9d1d9}\n.target-btn.active{border-color:#58a6ff;background:#1f3a5f;color:#58a6ff;font-weight:700}\n.target-btn .tbi{font-size:18px;display:block;margin-bottom:2px}\n\n/* Progress */\n.progress-bar{height:4px;background:#21262d;border-radius:2px;overflow:hidden;margin-bottom:8px}\n.progress-fill{height:100%;background:linear-gradient(90deg,#1f6feb,#58a6ff);border-radius:2px;transition:width 0.5s}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"drop-overlay\" id=\"dropOverlay\">\n  \u003cspan>📂\u003c/span>\n  \u003cspan>Solte o ZIP aqui\u003c/span>\n\u003c/div>\n\n\u003cheader>\n  \u003cspan style=\"font-size:18px\">🔧\u003c/span>\n  \u003ch1>ConstruAPK Pro — Analisador & Gerador\u003c/h1>\n  \u003cdiv class=\"hbtns\">\n    \u003cbutton class=\"btn-import\" onclick=\"document.getElementById('fi').click()\">📂 ZIP\u003c/button>\n    \u003cbutton class=\"btn-folder\" onclick=\"document.getElementById('fld').click()\">📁 Pasta\u003c/button>\n    \u003cbutton class=\"btn-export\" onclick=\"exportZip()\">💾 Exportar\u003c/button>\n    \u003cbutton style=\"padding:5px 10px;border-radius:6px;border:1px solid #30363d;background:#21262d;color:#c9d1d9;cursor:pointer;font-size:11px\" onclick=\"toggleSidebar()\">☰\u003c/button>\n  \u003c/div>\n\u003c/header>\n\n\u003cinput type=\"file\" id=\"fi\" accept=\".zip\" onchange=\"importZip(this)\"/>\n\u003cinput type=\"file\" id=\"fld\" webkitdirectory multiple onchange=\"importFolder(this)\"/>\n\n\u003cdiv class=\"main\">\n  \u003c!-- SIDEBAR -->\n  \u003cdiv class=\"sidebar\" id=\"sidebar\">\n    \u003cdiv class=\"sb-header\">\n      \u003cbutton onclick=\"expandAll()\">▼\u003c/button>\n      \u003cbutton onclick=\"collapseAll()\">▶\u003c/button>\n      \u003cbutton onclick=\"runAnalysis()\" id=\"abtn\" style=\"display:none;background:#1f6feb;color:#fff;border-color:#1f6feb\">⚡ Analisar\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"sb-search\">\n      \u003cinput id=\"srch\" placeholder=\"🔍 Filtrar arquivos...\" oninput=\"renderTree()\"/>\n    \u003c/div>\n    \u003cdiv class=\"file-tree\" id=\"ft\">\n      \u003cdiv style=\"padding:20px;text-align:center;color:#8b949e;font-size:11px\">\n        \u003cdiv style=\"font-size:28px;margin-bottom:6px\">📂\u003c/div>\n        Importe um projeto\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- EDITOR -->\n  \u003cdiv class=\"editor-area\">\n    \u003cdiv class=\"tabs\" id=\"tabs\">\u003c/div>\n    \u003cdiv class=\"ec\" id=\"ec\">\n      \u003cdiv class=\"welcome\">\n        \u003cdiv style=\"font-size:40px\">🔧\u003c/div>\n        \u003ch2>ConstruAPK Pro\u003c/h2>\n        \u003cp>Importe um ZIP ou pasta → analise → corrija → gere APK ou EXE\u003c/p>\n        \u003cdiv style=\"display:flex;gap:8px;margin-top:6px\">\n          \u003cbutton onclick=\"document.getElementById('fi').click()\" style=\"padding:7px 14px;background:#1f6feb;border:none;border-radius:6px;color:#fff;cursor:pointer;font-size:12px\">📂 Importar ZIP\u003c/button>\n          \u003cbutton onclick=\"document.getElementById('fld').click()\" style=\"padding:7px 14px;background:#21262d;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;cursor:pointer;font-size:12px\">📁 Importar Pasta\u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- PAINEL -->\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"ptabs\">\n      \u003cdiv class=\"ptab active\" onclick=\"switchP('diag')\">🔍 Diagnóstico\u003c/div>\n      \u003cdiv class=\"ptab\" onclick=\"switchP('gerar')\">⚙️ Gerar\u003c/div>\n      \u003cdiv class=\"ptab\" onclick=\"switchP('limpar')\">🧹 Limpar\u003c/div>\n      \u003cdiv class=\"ptab\" onclick=\"switchP('deploy')\">🚀 Deploy\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"pc\" id=\"pc\">\n      \u003cdiv style=\"color:#8b949e;font-size:11px;text-align:center;padding:20px\">\n        \u003cdiv style=\"font-size:28px;margin-bottom:6px\">🔍\u003c/div>\n        Importe um projeto para começar\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\n// ══════════════════════════════════════════\n// ESTADO\n// ══════════════════════════════════════════\nlet P={}, TABS=[], ATAB=null, AN=null, PANEL='diag', TS={}, TARGET='apk';\n\n// ══════════════════════════════════════════\n// IMPORTAÇÃO\n// ══════════════════════════════════════════\nasync function importZip(inp){\n  const f=inp.files[0]; if(!f) return;\n  toast('⏳ Lendo ZIP...');\n  try{\n    const JSZ=await loadJSZ();\n    const z=await JSZ.loadAsync(await f.arrayBuffer());\n    P={}; let n=0;\n    const paths=Object.entries(z.files).filter(([,v])=>!v.dir).map(([k])=>k);\n    const tops=[...new Set(paths.map(k=>k.split('/')[0]))];\n    const pre=tops.length===1?tops[0]+'/':'';\n    for(const [path,entry] of Object.entries(z.files)){\n      if(entry.dir) continue;\n      const rel=pre?path.slice(pre.length):path;\n      if(!rel) continue;\n      const buf=await entry.async('arraybuffer');\n      const txt=decodeText(buf);\n      P[rel]={content:txt,binary:txt===null,raw:buf,modified:false};\n      n++;\n    }\n    toast(`✅ ${n} arquivos importados!`);\n    afterImport();\n  }catch(e){toast('Erro: '+e.message,'err');}\n  inp.value='';\n}\n\nfunction importFolder(inp){\n  const files=Array.from(inp.files); if(!files.length) return;\n  P={}; let done=0;\n  const proms=files.map(f=>new Promise(res=>{\n    const path=f.webkitRelativePath.replace(/^[^/]+\\//,'');\n    if(!path){res();return;}\n    const r=new FileReader();\n    r.onload=e=>{\n      const buf=e.target.result;\n      const txt=decodeText(buf);\n      P[path]={content:txt,binary:txt===null,raw:buf,modified:false};\n      done++; res();\n    };\n    r.readAsArrayBuffer(f);\n  }));\n  Promise.all(proms).then(()=>{toast(`✅ ${done} arquivos!`);afterImport();});\n  inp.value='';\n}\n\nfunction afterImport(){\n  renderTree();\n  document.getElementById('abtn').style.display='block';\n  runAnalysis();\n}\n\nfunction decodeText(buf){\n  try{\n    const b=new Uint8Array(buf);\n    for(let i=0;i\u003cMath.min(512,b.length);i++) if(b[i]===0) return null;\n    return new TextDecoder('utf-8',{fatal:true}).decode(buf);\n  }catch{try{return new TextDecoder('latin1').decode(buf);}catch{return null;}}\n}\n\n// ══════════════════════════════════════════\n// ÁRVORE\n// ══════════════════════════════════════════\nfunction renderTree(){\n  const ft=document.getElementById('ft');\n  const q=(document.getElementById('srch').value||'').toLowerCase();\n  const paths=Object.keys(P).filter(p=>!q||p.toLowerCase().includes(q)).sort();\n  if(!paths.length){ft.innerHTML='\u003cdiv style=\"padding:16px;text-align:center;color:#8b949e;font-size:11px\">Nenhum arquivo\u003c/div>';return;}\n  const root=buildTree(paths);\n  ft.innerHTML=renderNode(root,0);\n}\n\nfunction buildTree(paths){\n  const root={type:'folder',name:'',children:{}};\n  for(const p of paths){\n    const parts=p.split('/');\n    let node=root;\n    for(let i=0;i\u003cparts.length-1;i++){\n      const part=parts[i];\n      if(!node.children[part]) node.children[part]={type:'folder',name:part,children:{},path:parts.slice(0,i+1).join('/')};\n      node=node.children[part];\n    }\n    node.children[parts[parts.length-1]]={type:'file',name:parts[parts.length-1],path:p};\n  }\n  return root;\n}\n\nfunction renderNode(node,depth){\n  let h='';\n  const sorted=Object.values(node.children).sort((a,b)=>{\n    if(a.type!==b.type) return a.type==='folder'?-1:1;\n    return a.name.localeCompare(b.name);\n  });\n  for(const c of sorted){\n    const ind=depth*14;\n    if(c.type==='folder'){\n      const exp=TS[c.path]!==false;\n      h+=`\u003cdiv class=\"ti folder\" style=\"padding-left:${8+ind}px\" onclick=\"toggleF('${c.path}')\">\n        \u003cspan>${exp?'📂':'📁'}\u003c/span>\n        \u003cspan class=\"nm\">${c.name}\u003c/span>\n        \u003cspan class=\"sz\">${cntF(c)}\u003c/span>\n      \u003c/div>`;\n      if(exp) h+=renderNode(c,depth+1);\n    }else{\n      const mod=P[c.path]?.modified?'●':'';\n      const warn=hasProblems(c.path)?'⚠':'';\n      h+=`\u003cdiv class=\"ti file ${ATAB===c.path?'active':''}\" style=\"padding-left:${8+ind}px\" onclick=\"openFile('${esc(c.path)}')\">\n        \u003cspan>${fIcon(c.name)}\u003c/span>\n        \u003cspan class=\"nm\">${c.name}${mod?'\u003cspan style=\"color:#e3b341\"> '+mod+'\u003c/span>':''}\u003c/span>\n        \u003cspan class=\"sz\">${fmtSz(P[c.path]?.content?.length||0)}\u003c/span>\n        ${warn?`\u003cspan class=\"warn\">${warn}\u003c/span>`:''}\n      \u003c/div>`;\n    }\n  }\n  return h;\n}\n\nfunction hasProblems(path){\n  if(!AN) return false;\n  return AN.problemFiles?.includes(path);\n}\n\nfunction cntF(n){let c=0;for(const x of Object.values(n.children)){if(x.type==='file')c++;else c+=cntF(x);}return c;}\nfunction toggleF(p){TS[p]=TS[p]===false?true:false;renderTree();}\nfunction expandAll(){Object.keys(P).forEach(p=>{const pts=p.split('/');for(let i=1;i\u003cpts.length;i++)TS[pts.slice(0,i).join('/')]=true;});renderTree();}\nfunction collapseAll(){Object.keys(TS).forEach(k=>TS[k]=false);renderTree();}\nfunction toggleSidebar(){const s=document.getElementById('sidebar');s.classList.toggle('collapsed');}\n\nfunction fIcon(n){\n  const e=n.split('.').pop()?.toLowerCase();\n  const m={html:'🌐',htm:'🌐',css:'🎨',js:'📜',ts:'📘',tsx:'⚛️',jsx:'⚛️',json:'📋',md:'📝',txt:'📄',yml:'⚙️',yaml:'⚙️',sh:'💻',png:'🖼️',jpg:'🖼️',svg:'🎭',ico:'🎯',zip:'📦',apk:'📱',exe:'🖥️',gradle:'🔨',xml:'📋',java:'☕',kt:'🎯',env:'🔑',lock:'🔒',sql:'🗄️'};\n  return m[e]||'📄';\n}\nfunction fmtSz(b){if(!b)return'';if(b\u003c1024)return b+'B';if(b\u003c1048576)return(b/1024).toFixed(1)+'K';return(b/1048576).toFixed(1)+'M';}\nfunction esc(s){return s.replace(/\\\\/g,'\\\\\\\\').replace(/'/g,\"\\\\'\");}\n\n// ══════════════════════════════════════════\n// EDITOR\n// ══════════════════════════════════════════\nfunction openFile(path){\n  const f=P[path]; if(!f) return;\n  if(f.binary){toast('Arquivo binário','warn');return;}\n  if(!TABS.includes(path)) TABS.push(path);\n  if(TABS.length>12) TABS.shift();\n  ATAB=path;\n  renderTabs(); renderEditor(); renderTree();\n}\n\nfunction closeTab(path,e){\n  e.stopPropagation();\n  const i=TABS.indexOf(path); TABS.splice(i,1);\n  if(ATAB===path) ATAB=TABS[Math.min(i,TABS.length-1)]||null;\n  renderTabs(); renderEditor(); renderTree();\n}\n\nfunction renderTabs(){\n  document.getElementById('tabs').innerHTML=TABS.map(p=>{\n    const n=p.split('/').pop();\n    const mod=P[p]?.modified;\n    return `\u003cdiv class=\"tab ${p===ATAB?'active':''}\" onclick=\"openFile('${esc(p)}')\">\n      \u003cspan>${fIcon(n)} ${n}\u003c/span>\n      \u003cspan class=\"cx\" style=\"${mod?'color:#e3b341':''}\" onclick=\"closeTab('${esc(p)}',event)\">${mod?'●':'×'}\u003c/span>\n    \u003c/div>`;\n  }).join('');\n}\n\nfunction renderEditor(){\n  const ec=document.getElementById('ec');\n  if(!ATAB||!P[ATAB]){\n    ec.innerHTML='\u003cdiv class=\"welcome\">\u003cdiv style=\"font-size:36px\">📄\u003c/div>\u003cp>Selecione um arquivo\u003c/p>\u003c/div>';\n    return;\n  }\n  const f=P[ATAB];\n  const txt=(f.content||'').replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;');\n  ec.innerHTML=`\n    \u003cdiv class=\"ec-bar\">\n      \u003cspan style=\"color:#58a6ff\">${ATAB}\u003c/span>\n      \u003cspan>${fmtSz(f.content?.length||0)}\u003c/span>\n      ${f.modified?'\u003cspan style=\"color:#e3b341\">● Modificado\u003c/span>':''}\n      \u003cbutton class=\"b-save\" onclick=\"saveF('${esc(ATAB)}')\">💾 Salvar\u003c/button>\n      \u003cbutton class=\"b-clean\" onclick=\"cleanReplit('${esc(ATAB)}')\">🧹 Limpar Replit\u003c/button>\n      \u003cbutton style=\"padding:2px 7px;border-radius:3px;border:none;cursor:pointer;font-size:10px;background:#21262d;color:#c9d1d9;border:1px solid #30363d\" onclick=\"analyzeFile('${esc(ATAB)}')\">🔍 Analisar\u003c/button>\n    \u003c/div>\n    \u003ctextarea class=\"ce\" id=\"ce\" oninput=\"markMod('${esc(ATAB)}',this)\">${txt}\u003c/textarea>`;\n}\n\nfunction markMod(path
