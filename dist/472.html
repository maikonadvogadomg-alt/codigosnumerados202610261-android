-content', 'align-items'].forEach((p) => a(p, null));\n    if (modo === 'normal') { a('display', null); a('gap', null); L.aviso('Voltou ao normal: um embaixo do outro.'); }\n    if (modo === 'lado') { a('display', 'flex'); a('flex-wrap', 'wrap'); a('gap', '12px'); L.aviso('Agora os pedaços de dentro ficam lado a lado (flex).'); }\n    if (modo === 'grade') { a('display', 'grid'); a('grid-template-columns', 'repeat(' + Math.min(3, Math.max(2, info.filhos)) + ', 1fr)'); a('gap', '12px'); L.aviso('Agora é uma grade (grid). Mude o número de colunas.'); }\n    if (modo === 'pilha') { a('display', 'flex'); a('flex-direction', 'column'); a('gap', '12px'); }\n  }\n  function empilharNoCelular() {\n    const disp = L.codigo.valor(sel, 'display', false) || info.css.display;\n    if (/grid/.test(disp)) L.codigo.ajustar(sel, 'grid-template-columns', '1fr', true);\n    else { L.codigo.ajustar(sel, 'flex-direction', 'column', true); }\n    verCelular(true);\n    L.aviso('Pronto: no celular eles ficam um embaixo do outro. No computador continuam lado a lado.', 'ok');\n  }\n  function trocarTexto() {\n    const novo = $('#in-texto').value; const velho = info.texto;\n    if (novo === velho) return;\n    const novoEsc = L.esc(novo).replace(/&#39;/g, \"'\").replace(/&quot;/g, '\"');\n    // tenta do mais preciso ao mais simples: o pedaço inteiro, depois >texto\u003c, depois só o texto\n    let r = 'nao';\n    const tentativas = [[info.html, info.html.replace('>' + velho + '\u003c', '>' + novoEsc + '\u003c')], ['>' + velho + '\u003c', '>' + novoEsc + '\u003c'], [velho, novoEsc]];\n    for (const [a, b] of tentativas) { if (a === b) continue; r = L.codigo.trocarTrecho(a, b); if (r === 'ok') break; }\n    if (r === 'ok') { info.texto = novo; L.aviso('Texto trocado no código.', 'ok'); }\n    else if (r === 'varios') L.aviso('Esse texto aparece mais de uma vez no código. Troque na aba 📝 Código (usei 🔎 para achar).', 'erro');\n    else { L.aviso('Não achei esse texto igualzinho no código (pode ter espaços ou acentos escritos de outro jeito). Troque na aba 📝 Código.', 'erro'); L.abrirAba('codigo'); L.editorCodigo.achar(info.html); }\n  }\n  function mostrarVal(prop, val) { const s = painel.querySelector('[data-val=\"' + prop + '\"]'); if (s) { s.textContent = val; } const css = $('#in-css'); if (css) css.textContent = cssDoSel(); }\n  function cssDoSel() {\n    const linhas = L.codigo.lista().filter((x) => x.sel === sel).map((x) => (x.cel ? '/* só no celular */\\n' : '') + x.sel + ' {\\n' + Object.entries(x.props).map(([p, v]) => '  ' + p + ': ' + v + ';').join('\\n') + '\\n}');\n    return linhas.join('\\n') || '(nada ainda — mexa num controle)';\n  }\n  function atualizarMedidas() {\n    const m = $('#in-medidas'); if (m && info) m.textContent = 'Tamanho na tela agora: ' + info.w + ' de largura × ' + info.h + ' de altura (pixels).';\n    const css = $('#in-css'); if (css) css.textContent = cssDoSel();\n  }\n\n  // lista de tudo o que você mudou, com ✕ para desfazer cada um\n  function pintarMudancas() {\n    const box = $('#in-mudancas'); if (!box) return;\n    const l = L.codigo.lista();\n    if (!l.length) { box.innerHTML = '\u003cb>📋 Mudanças feitas\u003c/b>\u003cp class=\"peq mut\" style=\"margin:4px 0\">Nenhuma ainda.\u003c/p>'; return; }\n    box.innerHTML = '\u003cdiv class=\"linha\">\u003cb class=\"cresce\">📋 Mudanças feitas (' + l.length + ')\u003c/b>\u003cbutton class=\"bt mini\" id=\"in-limpar\">🧹 Tirar todas\u003c/button>\u003c/div>' +\n      l.map((x, i) => '\u003cdiv class=\"linha\" style=\"border-top:1px solid var(--linha);padding:4px 0\">\u003ccode class=\"cod\" style=\"flex:1;min-width:0;overflow-wrap:anywhere\">' + (x.cel ? '📱 ' : '') + L.esc(x.sel) + '\u003c/code>' +\n        '\u003cspan class=\"peq mut\">' + Object.keys(x.props).length + ' ajuste(s)\u003c/span>' +\n        '\u003cbutton class=\"bt mini\" data-escolher=\"' + i + '\" title=\"Escolher este pedaço\">🎯\u003c/button>\u003cbutton class=\"bt mini\" data-apagar=\"' + i + '\" title=\"Desfazer as mudanças deste pedaço\">✕\u003c/button>\u003c/div>').join('');\n    box.querySelector('#in-limpar').onclick = () => { if (confirm('Tirar TODAS as mudanças de visual?')) { L.codigo.limparAjustes(); redesenharLado(); } };\n    box.querySelectorAll('[data-escolher]').forEach((b) => (b.onclick = () => enviar({ lab: 'achar', sel: l[+b.dataset.escolher].sel })));\n    box.querySelectorAll('[data-apagar]').forEach((b) => (b.onclick = () => { const x = l[+b.dataset.apagar]; L.codigo.apagarSel(x.sel, x.cel); redesenharLado(); }));\n  }\n\n  L.inspetor = { recarregar: carregar };\n  L.registrar({ aba: 'inspetor', montar });\n})(window.L);\n\n\u003c/script>\n  \u003cscript>\n/* 40-manual.js — 📘 APRENDER\n   Lições curtas. Cada uma tem: explicação simples, um código que você PODE MUDAR\n   e a página ao vivo do lado. Mudou o código → a página muda na hora.\n   \"🔍 Levar para o Inspetor\" abre o exemplo na aba de mexer tocando. */\n(function (L) {\n  'use strict';\n  const pag = (corpo, estilo) => '\u003c!doctype html>\\n\u003chtml lang=\"pt-BR\">\\n\u003chead>\\n\u003cmeta charset=\"utf-8\">\\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\\n\u003cstyle>\\n' + estilo.trim() + '\\n\u003c/style>\\n\u003c/head>\\n\u003cbody>\\n' + corpo.trim() + '\\n\u003c/body>\\n\u003c/html>';\n\n  const LICOES = [\n    {\n      id: 'comeco', titulo: '0. Como usar este laboratório',\n      exp: '\u003cp>Este laboratório tem 3 partes:\u003c/p>\u003cul>\u003cli>\u003cb>🔍 Mexer no visual\u003c/b>: você vê a página funcionando, \u003cb>toca num pedaço\u003c/b> e muda cor, tamanho, espaço, esconde, arruma lado a lado… sem procurar nada no código.\u003c/li>\u003cli>\u003cb>📘 Aprender\u003c/b>: estas lições. Mude o código da esquerda e veja a página da direita mudar na hora.\u003c/li>\u003cli>\u003cb>📝 Código\u003c/b>: o código inteiro, para colar, abrir, copiar e baixar.\u003c/li>\u003c/ul>\u003cp>Uma página da internet é feita de \u003cb>3 coisas\u003c/b>:\u003c/p>\u003cul>\u003cli>\u003cb>HTML\u003c/b> = \u003ci>o que existe\u003c/i> (título, parágrafo, botão, imagem). É o esqueleto.\u003c/li>\u003cli>\u003cb>CSS\u003c/b> = \u003ci>como aparece\u003c/i> (cor, tamanho, posição). É a roupa.\u003c/li>\u003cli>\u003cb>JavaScript\u003c/b> = \u003ci>o que acontece\u003c/i> quando você toca (abrir menu, calcular). É o movimento.\u003c/li>\u003c/ul>',\n      dica: 'Experimente: troque a palavra “blue” (azul) por “red” (vermelho) no código ao lado e veja.',\n      codigo: pag('\u003ch1>Olá, Maikon!\u003c/h1>\\n\u003cp>Este é um parágrafo. Mude este texto.\u003c/p>\\n\u003cbutton onclick=\"alert(\\'Você tocou no botão!\\')\">Toque aqui\u003c/button>', 'h1 { color: blue; }\\np { font-size: 20px; }'),\n    },\n    {\n      id: 'html', titulo: '1. O que é HTML (etiquetas)',\n      exp: '\u003cp>HTML é feito de \u003cb>etiquetas\u003c/b> (em inglês, \u003ci>tags\u003c/i>). Quase toda etiqueta \u003cb>abre\u003c/b> e \u003cb>fecha\u003c/b>:\u003c/p>\u003cp>\u003ccode>&lt;p&gt;\u003c/code> texto aqui \u003ccode>&lt;/p&gt;\u003c/code> ← a barra \u003ccode>/\u003c/code> fecha.\u003c/p>\u003cp>O que fica entre as duas é o \u003cb>conteúdo\u003c/b>. Etiquetas podem ficar \u003cb>uma dentro da outra\u003c/b>, como caixas dentro de caixas.\u003c/p>\u003cp>A página sempre tem:\u003c/p>\u003cul>\u003cli>\u003ccode>&lt;head&gt;\u003c/code> = a “cabeça”: coisas que NÃO aparecem (título da aba, o CSS).\u003c/li>\u003cli>\u003ccode>&lt;body&gt;\u003c/code> = o “corpo”: tudo o que aparece na tela.\u003c/li>\u003c/ul>\u003cp>Uma etiqueta pode ter \u003cb>atributos\u003c/b>: informações extras dentro da abertura, como \u003ccode>&lt;a href=\"endereço\"&gt;\u003c/code>.\u003c/p>',\n      dica: 'Esqueceu de fechar uma etiqueta? O navegador tenta adivinhar, e às vezes tudo fica torto. Sempre feche.',\n      codigo: pag('\u003cdiv>\\n  Esta é uma caixa (div).\\n  \u003cp>Este parágrafo está DENTRO da caixa.\u003c/p>\\n  \u003cp>Este também. Tem \u003cb>negrito\u003c/b> e \u003ci>itálico\u003c/i> aqui dentro.\u003c/p>\\n\u003c/div>', 'div { border: 2px dashed gray; padding: 10px; }\\np { background: #eef; }'),\n    },\n    {\n      id: 'textos', titulo: '2. Títulos e textos',\n      exp: '\u003cul>\u003cli>\u003ccode>&lt;h1&gt;\u003c/code> até \u003ccode>&lt;h6&gt;\u003c/code>: títulos. h1 é o maior e mais importante.\u003c/li>\u003cli>\u003ccode>&lt;p&gt;\u003c/code>: parágrafo.\u003c/li>\u003cli>\u003ccode>&lt;b&gt;\u003c/code> ou \u003ccode>&lt;strong&gt;\u003c/code>: negrito. \u003ccode>&lt;i&gt;\u003c/code> ou \u003ccode>&lt;em&gt;\u003c/code>: itálico.\u003c/li>\u003cli>\u003ccode>&lt;br&gt;\u003c/code>: pula linha (não fecha).\u003c/li>\u003cli>\u003ccode>&lt;blockquote&gt;\u003c/code>: citação recuada (bom para ementas!).\u003c/li>\u003cli>\u003ccode>&lt;span&gt;\u003c/code>: um pedacinho de texto para pintar diferente.\u003c/li>\u003c/ul>',\n      dica: 'Use h1, h2, h3 pela IMPORTÂNCIA, não pelo tamanho. O tamanho você muda depois no CSS.',\n      codigo: pag('\u003ch1>Petição Inicial\u003c/h1>\\n\u003ch2>Dos Fatos\u003c/h2>\\n\u003cp>O autor nasceu em 1960 e trabalhou \u003cb>35 anos\u003c/b> com carteira assinada.\u003cbr>Esta frase começa numa linha nova.\u003c/p>\\n\u003ch2>Do Direito\u003c/h2>\\n\u003cblockquote>“A aposentadoria é direito do segurado…” (trecho de ementa)\u003c/blockquote>\\n\u003cp>Pedido: \u003cspan class=\"destaque\">concessão do benefício\u003c/span>.\u003c/p>', 'body { font-family: Georgia, serif; padding: 12px; }\\nh1 { text-align: center; }\\nblockquote { margin-left: 40px; font-size: 14px; color: #444; }\\n.destaque { background: yellow; }'),\n    },\n    {\n      id: 'links', titulo: '3. Links e imagens',\n      exp: '\u003cul>\u003cli>\u003cb>Link\u003c/b>: \u003ccode>&lt;a href=\"https://…\"&gt;texto&lt;/a&gt;\u003c/code>. O \u003ccode>href\u003c/code> diz para onde vai. \u003ccode>target=\"_blank\"\u003c/code> abre em outra aba.\u003c/li>\u003cli>Link para WhatsApp: \u003ccode>href=\"https://wa.me/5531999999999\"\u003c/code>.\u003c/li>\u003cli>Link para telefone: \u003ccode>href=\"tel:+5531999999999\"\u003c/code>.\u003c/li>\u003cli>\u003cb>Imagem\u003c/b>: \u003ccode>&lt;img src=\"foto.jpg\" alt=\"descrição\"&gt;\u003c/code>. Não fecha. O \u003ccode>alt\u003c/code> é lido por quem não enxerga e aparece se a imagem falhar.\u003c/li>\u003c/ul>',\n      dica: 'Para a imagem não “estourar” no celular: img { max-width: 100%; height: auto; }',\n      codigo: pag('\u003cp>\u003ca href=\"https://wa.me/5531999999999\" target=\"_blank\">💬 Fale no WhatsApp\u003c/a>\u003c/p>\\n\u003cp>\u003ca href=\"tel:+5531999999999\">📞 Ligar\u003c/a>\u003c/p>\\n\u003cimg src=\"https://picsum.photos/600/300\" alt=\"Uma foto qualquer\">', 'body { padding: 12px; font-family: Arial; }\\na { color: green; font-size: 20px; }\\nimg { max-width: 100%; height: auto; border-radius: 12px; }'),\n    },\n    {\n      id: 'listas', titulo: '4. Listas e tabelas',\n      exp: '\u003cul>\u003cli>\u003ccode>&lt;ul&gt;\u003c/code> = lista com bolinhas. \u003ccode>&lt;ol&gt;\u003c/code> = lista numerada. Cada item é um \u003ccode>&lt;li&gt;\u003c/code>.\u003c/li>\u003cli>\u003cb>Tabela\u003c/b>: \u003ccode>&lt;table&gt;\u003c/code> → linhas \u003ccode>&lt;tr&gt;\u003c/code> → células \u003ccode>&lt;td&gt;\u003c/code> (ou \u003ccode>&lt;th&gt;\u003c/code> para título).\u003c/li>\u003c/ul>',\n      dica: 'Tabela larga no celular? Coloque ela dentro de \u003cdiv style=\"overflow-x:auto\"> para poder arrastar para o lado.',\n      codigo: pag('\u003ch3>Documentos para aposentadoria\u003c/h3>\\n\u003col>\\n  \u003cli>RG e CPF\u003c/li>\\n  \u003cli>Carteira de trabalho\u003c/li>\\n  \u003cli>CNIS\u003c/li>\\n\u003c/ol>\\n\u003cdiv style=\"overflow-x:auto\">\\n\u003ctable>\\n  \u003ctr>\u003cth>Período\u003c/th>\u003cth>Empresa\u003c/th>\u003cth>Tempo\u003c/th>\u003c/tr>\\n  \u003ctr>\u003ctd>1980–1990\u003c/td>\u003ctd>Fábrica A\u003c/td>\u003ctd>10 anos\u003c/td>\u003c/tr>\\n  \u003ctr>\u003ctd>1990–2015\u003c/td>\u003ctd>Loja B\u003c/td>\u003ctd>25 anos\u003c/td>\u003c/tr>\\n\u003c/table>\\n\u003c/div>', 'body { padding: 12px; font-family: Arial; }\\ntable { border-collapse: collapse; width: 100%; }\\nth, td { border: 1px solid #999; padding: 8px; }\\nth { background: #dde; }'),\n    },\n    {\n      id: 'form', titulo: '5. Botões e formulários',\n      exp: '\u003cul>\u003cli>\u003ccode>&lt;button&gt;\u003c/code>: botão.\u003c/li>\u003cli>\u003ccode>&lt;input&gt;\u003c/code>: campo de digitar. O \u003ccode>type\u003c/code> muda o jeito: \u003ccode>text\u003c/code>, \u003ccode>number\u003c/code>, \u003ccode>date\u003c/code>, \u003ccode>email\u003c/code>, \u003ccode>checkbox\u003c/code> (marcar), \u003ccode>color\u003c/code>…\u003c/li>\u003cli>\u003ccode>&lt;label&gt;\u003c/code>: o nome do campo. Tocar no nome já foca o campo.\u003c/li>\u003cli>\u003ccode>&lt;textarea&gt;\u003c/code>: texto grande. \u003ccode>&lt;select&gt;\u003c/code> com \u003ccode>&lt;option&gt;\u003c/code>: lista de escolha.\u003c/li>\u003cli>\u003ccode>placeholder=\"…\"\u003c/code>: o texto cinza de exemplo dentro do campo.\u003c/li>\u003c/ul>',\n      dica: 'O botão de baixo usa um pouquinho de JavaScript (onclick) para fazer uma conta. É assim que as páginas “fazem coisas”.',\n      codigo: pag('\u003clabel>Nome do cliente\u003cbr>\u003cinput type=\"text\" id=\"nome\" placeholder=\"Ex.: Maria da Silva\">\u003c/label>\\n\u003clabel>Nascimento\u003cbr>\u003cinput type=\"date\" id=\"nasc\">\u003c/label>\\n\u003clabel>Benefício\u003cbr>\\n  \u003cselect id=\"tipo\">\u003coption>Aposentadoria por idade\u003c/option>\u003coption>BPC/LOAS\u003c/option>\u003c/select>\\n\u003c/label>\\n\u003clabel>\u003cinput type=\"checkbox\"> Já tem CNIS\u003c/label>\\n\u003cbutton onclick=\"document.getElementById(\\'res\\').textContent = \\'Ficha de \\' + document.getElementById(\\'nome\\').value + \\' — \\' + document.getElementById(\\'tipo\\').value\">Montar ficha\u003c/button>\\n\u003cp id=\"res\">\u003c/p>', 'body { padding: 12px; font-family: Arial; display: grid; gap: 10px; max-width: 400px; }\\ninput, select { width: 100%; padding: 8px; font-size: 16px; }\\nbutton { padding: 12px; font-size: 16px; background: #2a5bd7; color: white; border: 0; border-radius: 8px; }'),\n    },\n    {\n      id: 'css', titulo: '6. O que é CSS (e como “achar” as coisas)',\n      exp: '\u003cp>CSS é uma lista de \u003cb>regras\u003c/b>. Cada regra diz \u003cb>QUEM\u003c/b> e \u003cb>COMO\u003c/b>:\u003c/p>\u003cp>\u003ccode>quem { propriedade: valor; }\u003c/code>\u003c/p>\u003cp>O “quem” se chama \u003cb>seletor\u003c/b>:\u003c/p>\u003cul>\u003cli>\u003ccode>p\u003c/code> → todos os parágrafos.\u003c/li>\u003cli>\u003ccode>.cartao\u003c/code> (com ponto) → tudo que tem \u003ccode>class=\"cartao\"\u003c/code>. \u003cb>Classe\u003c/b> é um apelido que você dá, pode repetir em vários.\u003c/li>\u003cli>\u003ccode>#topo\u003c/code> (com #) → o único que tem \u003ccode>id=\"topo\"\u003c/code>. \u003cb>id\u003c/b> é nome único.\u003c/li>\u003cli>\u003ccode>header h1\u003c/code> → o h1 que está DENTRO do header.\u003c/li>\u003c/ul>\u003cp>O CSS fica dentro de \u003ccode>&lt;style&gt;\u003c/code> no \u003ccode>&lt;head&gt;\u003c/code>, ou num arquivo \u003ccode>.css\u003c/code> separado, ou direto na etiqueta: \u003ccode>style=\"color:red\"\u003c/code>.\u003c/p>',\n      dica: 'Se duas regras brigam, ganha a mais específica (#id ganha de .classe, que ganha de etiqueta) ou a que vem por último. “!important” força a ganhar — o laboratório usa isso nas suas mudanças.',\n      codigo: pag('\u003cheader id=\"topo\">\u003ch1>Escritório\u003c/h1>\u003c/header>\\n\u003cp>Parágrafo comum.\u003c/p>\\n\u003cp class=\"cartao\">Parágrafo com a classe cartao.\u003c/p>\\n\u003cp class=\"cartao\">Outro com a mesma classe.\u003c/p>', 'p { color: gray; }\\n.cartao { color: black; background: #ffe; padding: 8px; border: 1px solid #cc9; }\\n#topo { background: navy; }\\nheader h1 { color: white; margin: 0; padding: 10px; }'),\n    },\n    {\n      id: 'caixa', titulo: '7. A caixa: margin, border, padding',\n      exp: '\u003cp>\u003cb>Tudo na página é uma caixa.\u003c/b> Cada caixa tem 4 camadas, de dentro para fora:\u003c/p>\u003col>\u003cli>\u003cb>Conteúdo\u003c/b> (o texto, a imagem). Tamanho: \u003ccode>width\u003c/code> e \u003ccode>height\u003c/code>.\u003c/li>\u003cli>\u003cb>padding\u003c/b> = espaço de DENTRO, entre o conteúdo e a borda. O fundo pinta aqui.\u003c/li>\u003cli>\u003cb>border\u003c/b> = a borda (linha em volta).\u003c/li>\u003cli>\u003cb>margin\u003c/b> = espaço de FORA, afasta das outras caixas. É sempre transparente.\u003c/li>\u003c/ol>\u003cp>Escrevendo: \u003ccode>padding: 10px\u003c/code> (os 4 lados), \u003ccode>padding: 10px 20px\u003c/code> (cima/baixo, lados), \u003ccode>margin: 0 auto\u003c/code> (centraliza a caixa).\u003c/p>',\n      dica: 'Truque que quase toda página usa: * { box-sizing: border-box; } — assim a largura INCLUI padding e borda, e as contas ficam fáceis.',\n      codigo: pag('\u003cdiv class=\"caixa\">Eu sou o conteúdo\u003c/div>\\n\u003cdiv class=\"caixa outra\">Eu tenho mais padding e margin\u003c/div>', '* { box-sizing: border-box; }\\nbody { background: #ddd; font-family: Arial; }\\n.caixa {\\n  background: white;      /* pinta o conteúdo + padding */\\n  padding: 10px;          /* espaço de DENTRO */\\n  border: 4px solid blue; /* a borda */\\n  margin: 10px;           /* espaço de FORA */\\n}\\n.outra { padding: 40px; margin: 40px; border-radius: 16px; width: 70%; }'),\n    },\n    {\n      id: 'display', titulo: '8. Bloco e em linha (display)',\n      exp: '\u003cp>Toda etiqueta tem um jeito de “sentar” na página, chamado \u003ccode>display\u003c/code>:\u003c/p>\u003cul>\u003cli>\u003ccode>block\u003c/code> (bloco): ocupa a linha toda; a próxima vai para baixo. Ex.: div, p, h1, section.\u003c/li>\u003cli>\u003ccode>inline\u003c/code> (em linha): fica no meio do texto, só o tamanho do conteúdo. Ex.: span, a, b. \u003ci>Não aceita width/height.\u003c/i>\u003c/li>\u003cli>\u003ccode>inline-block\u003c/code>: fica em linha MAS aceita tamanho. Bom para botões.\u003c/li>\u003cli>\u003ccode>none\u003c/code>: some.\u003c/li>\u003cli>\u003ccode>flex\u003c/code> e \u003ccode>grid\u003c/code>: arrumam os de dentro (próximas lições).\u003c/li>\u003c/ul>',\n      dica: 'Um link (a) não aceitou largura? Coloque display: inline-block nele.',\n      codigo: pag('\u003cdiv class=\"bloco\">div = bloco\u003c/div>\\n\u003cdiv class=\"bloco\">outro bloco (foi para baixo)\u003c/div>\\n\u003cp>Texto com \u003cspan class=\"linha\">um span\u003c/span> e \u003ca href=\"#\" class=\"linha\">um link\u003c/a> no meio, em linha.\u003c/p>\\n\u003ca href=\"#\" class=\"botao\">Link como botão (inline-block)\u003c/a>', 'body { font-family: Arial; padding: 10px; }\\n.bloco { background: #cde; margin: 4px 0; }\\n.linha { background: #fd9; }\\n.botao { display: inline-block; width: 220px; padding: 12px; background: green; color: white; text-align: center; border-radius: 8px; text-decoration: none; }'),\n    },\n    {\n      id: 'flex', titulo: '9. Flex: um ao lado do outro',\n      exp: '\u003cp>\u003ccode>display: flex\u003c/code> se põe na \u003cb>caixa de FORA\u003c/b>. Aí as caixas de \u003cb>dentro\u003c/b> ficam numa fila, lado a lado.\u003c/p>\u003cul>\u003cli>\u003ccode>gap: 12px\u003c/code> → espaço entre elas.\u003c/li>\u003cli>\u003ccode>flex-wrap: wrap\u003c/code> → se não couber, desce para a linha de baixo (essencial no celular).\u003c/li>\u003cli>\u003ccode>justify-content\u003c/code> → onde ficam na linha: \u003ccode>flex-start\u003c/code> (início), \u003ccode>center\u003c/code>, \u003ccode>space-between\u003c/code> (espalhadas), \u003ccode>flex-end\u003c/code>.\u003c/li>\u003cli>\u003ccode>align-items: center\u003c/code> → centraliza na vertical.\u003c/li>\u003cli>\u003ccode>flex-direction: column\u003c/code> → vira coluna (um embaixo do outro).\u003c/li>\u003cli>Na caixa de dentro: \u003ccode>flex: 1\u003c/code> → “cresça e ocupe o que sobrar”.\u003c/li>\u003c/ul>',\n      dica: 'Centralizar QUALQUER coisa no meio de uma caixa: display:flex; justify-content:center; align-items:center;',\n      codigo: pag('\u003cnav class=\"menu\">\\n  \u003cb>⚖️ Advocacia\u003c/b>\\n  \u003ca href=\"#\">Início\u003c/a>\\n  \u003ca href=\"#\">Serviços\u003c/a>\\n  \u003ca href=\"#\">Contato\u003c/a>\\n\u003c/nav>\\n\u003cdiv class=\"fila\">\\n  \u003cdiv class=\"item\">1\u003c/div>\\n  \u003cdiv class=\"item\">2\u003c/div>\\n  \u003cdiv class=\"item grande\">3 (flex: 1, cresce)\u003c/div>\\n\u003c/div>', 'body { font-family: Arial; margin: 0; }\\n.menu { display: flex; gap: 16px; align-items: center; padding: 12px; background: #223; }\\n.menu b { color: white; flex: 1; }\\n.menu a { color: #9cf; }\\n.fila { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px; }\\n.item { background: #fc6; padding: 20px; }\\n.grande { flex: 1; background: #9d9; }'),\n    },\n    {\n      id: 'grid', titulo: '10. Grid: grade de colunas',\n      exp: '\u003cp>\u003ccode>display: grid\u003c/code> também vai na \u003cb>caixa de FORA\u003c/b>, mas transforma os de dentro numa \u003cb>grade\u003c/b>, como uma tabela.\u003c/p>\u003cul>\u003cli>\u003ccode>grid-template-columns: repeat(3, 1fr)\u003c/code> → 3 colunas iguais. \u003cb>fr\u003c/b> = “fração”, uma parte igual do espaço.\u003c/li>\u003cli>\u003ccode>grid-template-columns: 200px 1fr\u003c/code> → uma coluna fixa de 200 e outra que ocupa o resto (ótimo para menu lateral).\u003c/li>\u003cli>\u003ccode>gap: 12px\u003c/code> → espaço entre as células.\u003c/li>\u003cli>\u003cb>Mágico para celular:\u003c/b> \u003ccode>repeat(auto-fill, minmax(200px, 1fr))\u003c/code> → coloca quantas colunas couberem, cada uma com no mínimo 200px. Sozinho já fica responsivo!\u003c/li>\u003c/ul>',\n      dica: 'Flex ou grid? Flex = uma fila (menu, botões). Grid = linhas E colunas (cartões, galeria, painel).',\n      codigo: pag('\u003ch3>Grade fixa (3 colunas)\u003c/h3>\\n\u003cdiv class=\"grade\">\\n  \u003cdiv>1\u003c/div>\u003cdiv>2\u003c/div>\u003cdiv>3\u003c/div>\u003cdiv>4\u003c/div>\u003cdiv>5\u003c/div>\u003cdiv>6\u003c/div>\\n\u003c/div>\\n\u003ch3>Grade automática (diminua a tela!)\u003c/h3>\\n\u003cdiv class=\"auto\">\\n  \u003cdiv>Aposentadoria\u003c/div>\u003cdiv>BPC\u003c/div>\u003cdiv>Revisão\u003c/div>\u003cdiv>Pensão\u003c/div>\\n\u003c/div>', 'body { font-family: Arial; padding: 10px; }\\n.grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }\\n.auto { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }\\n.grade div, .auto div { background: #bcf; padding: 16px; text-align: center; border-radius: 8px; }'),\n    },\n    {\n      id: 'celular', titulo: '11. Celular (responsivo) e @media',\n      exp: '\u003cp>Para a página ficar boa no celular:\u003c/p>\u003col>\u003cli>No \u003ccode>&lt;head&gt;\u003c/code>, SEMPRE: \u003ccode>&lt;meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"&gt;\u003c/code>. Sem isso o celular mostra a página minúscula.\u003c/li>\u003cli>Use \u003ccode>%\u003c/code>, \u003ccode>max-width\u003c/code> e \u003ccode>flex-wrap\u003c/code> em vez de larguras fixas grandes.\u003c/li>\u003cli>Use \u003ccode>@media\u003c/code>: uma regra que \u003cb>só vale em tela pequena\u003c/b>:\u003c/li>\u003c/ol>\u003cp>\u003ccode>@media (max-width: 600px) { .colunas { grid-template-columns: 1fr; } }\u003c/code>\u003c/p>\u003cp>Lê-se: “quando a tela tiver no máximo 600 pixels, a grade vira uma coluna só”.\u003c/p>',\n      dica: 'Veja isto no 🔍 Inspetor com o botão 📱 Ver como celular: as colunas viram uma só.',\n      codigo: pag('\u003cdiv class=\"colunas\">\\n  \u003cdiv>Coluna 1\u003c/div>\\n  \u003cdiv>Coluna 2\u003c/div>\\n  \u003cdiv>Coluna 3\u003c/div>\\n\u003c/div>\\n\u003cp class=\"so-pc\">Este aviso só aparece em tela grande.\u003c/p>', 'body { font-family: Arial; padding: 10px; }\\n.colunas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }\\n.colunas div { background: #fca; padding: 20px; }\\n\\n/* SÓ NO CELULAR (tela até 600px): */\\n@media (max-width: 600px) {\\n  .colunas { grid-template-columns: 1fr; }\\n  .so-pc { display: none; }\\n}'),\n    },\n    {\n      id: 'esconder', titulo: '12. Esconder e mostrar',\n      exp: '\u003cul>\u003cli>\u003ccode>display: none\u003c/code> → some e \u003cb>não ocupa espaço\u003c/b>.\u003c/li>\u003cli>\u003ccode>visibility: hidden\u003c/code> → fica invisível mas \u003cb>o buraco continua\u003c/b>.\u003c/li>\u003cli>\u003ccode>opacity: 0.5\u003c/code> → meio transparente (0 = invisível, 1 = normal).\u003c/li>\u003cli>\u003cb>Sem programar:\u003c/b> \u003ccode>&lt;details&gt;&lt;summary&gt;Título&lt;/summary&gt;conteúdo&lt;/details&gt;\u003c/code> → toca no título e abre/fecha sozinho.\u003c/li>\u003cli>\u003cb>Com um botão:\u003c/b> um pouquinho de JavaScript troca uma classe (veja o código).\u003c/li>\u003c/ul>',\n      dica: 'O atributo hidden no HTML (\u003cdiv hidden>) também esconde, igual display:none.',\n      codigo: pag('\u003cdetails>\\n  \u003csummary>📄 Documentos necessários (toque)\u003c/summary>\\n  \u003cp>RG, CPF, carteira de trabalho, CNIS.\u003c/p>\\n\u003c/details>\\n\\n\u003cbutton onclick=\"document.getElementById(\\'caixa\\').classList.toggle(\\'escondido\\')\">Mostrar / esconder a caixa\u003c/button>\\n\u003cdiv id=\"caixa\">Eu apareço e desapareço.\u003c/div>\\n\u003cp style=\"opacity:.4\">Eu sou meio transparente (opacity).\u003c/p>', 'body { font-family: Arial; padding: 10px; }\\ndetails { background: #eef; padding: 10px; border-radius: 8px; margin-bottom: 10px; }\\nsummary { cursor: pointer; font-weight: bold; }\\n#caixa { background: #fd8; padding: 16px; margin-top: 8px; }\\n.escondido { display: none; }'),\n    },\n    {\n      id: 'posicao', titulo: '13. Barra fixa no topo e posição',\n      exp: '\u003cul>\u003cli>\u003ccode>position: sticky; top: 0\u003c/code> → a barra \u003cb>gruda no topo\u003c/b> quando você rola. É o jeito mais fácil.\u003c/li>\u003cli>\u003ccode>position: fixed; bottom: 16px; right: 16px\u003c/code> → fica parado na tela sempre (ex.: botão do WhatsApp no canto).\u003c/li>\u003cli>\u003ccode>position: relative\u003c/code> na caixa de fora + \u003ccode>position: absolute\u003c/code> na de dentro → coloca algo num canto da caixa (ex.: um selo “Novo”).\u003c/li>\u003cli>\u003ccode>z-index: 10\u003c/code> → quem fica por cima (número maior = mais na frente).\u003c/li>\u003c/ul>',\n      dica: 'Role a página da direita para ver a barra grudar e o botão verde ficar parado.',\n      codigo: pag('\u003cheader class=\"barra\">⚖️ Meu Escritório\u003c/header>\\n\u003cdiv class=\"cartao\">Cartão com selo \u003cspan class=\"selo\">Novo\u003c/span>\u003c/div>\\n\u003cp>Role para baixo…\u003c/p>\u003cp style=\"height:900px\">…bastante texto…\u003c/p>\\n\u003ca class=\"zap\" href=\"#\">💬\u003c/a>', 'body { font-family: Arial; margin: 0; }\\n.barra { position: sticky; top: 0; background: #234; color: white; padding: 14px; z-index: 10; }\\n.cartao { position: relative; margin: 20px; padding: 30px; background: #eee; }\\n.selo { position: absolute; top: -8px; right: -8px; background: red; color: white; padding: 4px 8px; border-radius: 8px; }\\n.zap { position: fixed; bottom: 16px; right: 16px; background: #25d366; width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; text-decoration: none; }'),\n    },\n    {\n      id: 'cores', titulo: '14. Cores, variáveis e modo escuro',\n      exp: '\u003cp>Jeitos de escrever cor:\u003c/p>\u003cul>\u003cli>Nome em inglês: \u003ccode>red\u003c/code>, \u003ccode>blue\u003c/code>, \u003ccode>white\u003c/code>…\u003c/li>\u003cli>Hexadecimal: \u003ccode>#2a5bd7\u003c/code> (o mais usado).\u003c/li>\u003cli>\u003ccode>rgb(42, 91, 215)\u003c/code> e com transparência \u003ccode>rgba(0,0,0,.3)\u003c/code>.\u003c/li>\u003c/ul>\u003cp>\u003cb>Variáveis\u003c/b>: você dá um nome para a cor UMA vez e usa em vários lugares. Trocou ali, troca no site todo:\u003c/p>\u003cp>\u003ccode>:root { --principal: #2a5bd7; }\u003c/code> e depois \u003ccode>color: var(--principal);\u003c/code>\u003c/p>\u003cp>\u003cb>Modo escuro automático\u003c/b>: \u003ccode>@media (prefers-color-scheme: dark) { … }\u003c/code> — vale quando o celular está no tema escuro.\u003c/p>',\n      dica: 'Mude --principal no código para #c0392b e veja o site todo mudar de azul para vermelho.',\n      codigo: pag('\u003ch1>Título na cor principal\u003c/h1>\\n\u003cbutton>Botão na cor principal\u003c/button>\\n\u003cp class=\"aviso\">Caixa de aviso\u003c/p>', ':root {\\n  --principal: #2a5bd7;\\n  --fundo: #ffffff;\\n  --texto: #222222;\\n}\\n@media (prefers-color-scheme: dark) {\\n  :root { --fundo: #111822; --texto: #e8e8e8; }\\n}\\nbody { background: var(--fundo); color: var(--texto); font-family: Arial; padding: 12px; }\\nh1 { color: var(--principal); }\\nbutton { background: var(--principal); color: white; border: 0; padding: 12px 20px; border-radius: 8px; }\\n.aviso { border-left: 6px solid var(--principal); padding: 10px; background: rgba(0,0,0,.05); }'),\n    },\n    {\n      id: 'letras', titulo: '15. Letras (fontes) e texto',\n      exp: '\u003cul>\u003cli>\u003ccode>font-family: Arial, sans-serif\u003c/code> → tipo de letra. A segunda é a reserva.\u003c/li>\u003cli>\u003ccode>font-size: 18px\u003c/code> → tamanho. Também existe \u003ccode>rem\u003c/code>: \u003ccode>1rem\u003c/code> = o tamanho normal (16px), \u003ccode>1.5rem\u003c/code> = 24px.\u003c/li>\u003cli>\u003ccode>font-weight: 700\u003c/code> → negrito.\u003c/li>\u003cli>\u003ccode>line-height: 1.6\u003c/code> → altura da linha (mais espaço entre linhas = mais fácil de ler).\u003c/li>\u003cli>\u003ccode>text-align: justify\u003c/code> → justificado, como em petição.\u003c/li>\u003cli>\u003ccode>text-indent: 2.5cm\u003c/code> → recuo da primeira linha do parágrafo.\u003c/li>\u003cli>\u003ccode>text-transform: uppercase\u003c/code> → tudo maiúsculo.\u003c/li>\u003c/ul>',\n      dica: 'Este é o “padrão ABNT” de um parágrafo de petição, em CSS.',\n      codigo: pag('\u003ch2>DOS FATOS\u003c/h2>\\n\u003cp>O autor, segurado do Regime Geral de Previdência Social, requereu administrativamente o benefício de aposentadoria por idade, que lhe foi indeferido sob o fundamento de ausência de carência.\u003c/p>\\n\u003cp>Contudo, conforme se demonstrará, o autor preenche todos os requisitos legais.\u003c/p>', 'body { font-family: \"Times New Roman\", serif; font-size: 12pt; padding: 20px; max-width: 700px; margin: 0 auto; }\\nh2 { text-transform: uppercase; font-size: 12pt; }\\np { text-align: justify; text-indent: 2.5cm; line-height: 1.5; }'),\n    },\n    {\n      id: 'glossario', titulo: '📖 Dicionário rápido',\n      exp: '\u003ctable style=\"border-collapse:collapse;width:100%\">' + [\n        ['tag / etiqueta', 'Uma peça do HTML: \u003ccode>&lt;p&gt;\u003c/code>, \u003ccode>&lt;div&gt;\u003c/code>…'],\n        ['atributo', 'Informação extra dentro da etiqueta: \u003ccode>href\u003c/code>, \u003ccode>src\u003c/code>, \u003ccode>class\u003c/code>, \u003ccode>id\u003c/code>.'],\n        ['class / classe', 'Apelido que pode repetir. No CSS com ponto: \u003ccode>.cartao\u003c/code>.'],\n        ['id', 'Nome único. No CSS com #: \u003ccode>#topo\u003c/code>.'],\n        ['seletor', 'O “quem” de uma regra CSS.'],\n        ['propriedade', 'O “o quê” muda: \u003ccode>color\u003c/code>, \u003ccode>width\u003c/code>…'],\n        ['div', 'Caixa genérica para agrupar.'],\n        ['span', 'Pedaço de texto genérico.'],\n        ['px', 'Pixel, um pontinho da tela.'],\n        ['%', 'Porcentagem da caixa de fora.'],\n        ['rem / em', 'Medida baseada no tamanho da letra (1rem ≈ 16px).'],\n        ['vh / vw', '1vh = 1% da altura da tela; 1vw = 1% da largura.'],\n        ['fr', 'Uma “fração” do espaço livre (no grid).'],\n        ['padding', 'Espaço de DENTRO.'],\n        ['margin', 'Espaço de FORA.'],\n        ['border', 'Borda.'],\n        ['border-radius', 'Cantos arredondados.'],\n        ['display', 'Como a caixa se comporta: block, inline, flex, grid, none.'],\n        ['flex', 'Arruma os de dentro numa fila.'],\n        ['grid', 'Arruma os de dentro numa grade.'],\n        ['gap', 'Espaço entre os de dentro (flex/grid).'],\n        ['@media', 'Regra que só vale em certo tamanho de tela.'],\n        ['responsivo', 'Página que se ajusta a celular e computador.'],\n        ['viewport', 'A área visível da tela.'],\n        ['position', 'Onde a caixa fica: static, relative, absolute, fixed, sticky.'],\n        ['z-index', 'Quem fica por cima.'],\n        ['opacity', 'Transparência (0 a 1).'],\n        ['var(--nome)', 'Usar uma variável de CSS.'],\n        ['!important', 'Força a regra a ganhar das outras.'],\n        ['DOM', 'A “árvore” de caixas que o navegador monta a partir do HTML.'],\n        ['srcdoc / iframe', 'Uma página dentro de outra (o laboratório usa isso para a prévia).'],\n      ].map(([a, b]) => '\u003ctr>\u003ctd style=\"border-bottom:1px solid var(--linha);padding:6px;white-space:nowrap\">\u003cb>' + a + '\u003c/b>\u003c/td>\u003ctd style=\"border-bottom:1px solid var(--linha);padding:6px\">' + b + '\u003c/td>\u003c/tr>').join('') + '\u003c/table>',\n      semCodigo: true,\n    },\n  ];\n\n  let painel, atual = 0;\n  const $ = (s) => L.$(s, painel);\n  function montar(el) {\n    painel = el;\n    el.innerHTML = '\u003cdiv class=\"cartao\">\u003cdiv class=\"licoes\" id=\"ma-lista\">' + LICOES.map((l, i) => '\u003cbutton class=\"bt mini\" data-i=\"' + i + '\">' + L.esc(l.titulo) + '\u003c/button>').join('') + '\u003c/div>\u003c/div>\u003cdiv id=\"ma-licao\">\u003c/div>';\n    $('#ma-lista').onclick = (e) => { const b = e.target.closest('[data-i]'); if (b) abrir(+b.dataset.i); };\n    abrir(Math.min(L.pref.get('licao', 0), LICOES.length - 1));\n  }\n  function abrir(i) {\n    atual = i; L.pref.set('licao', i);\n    const l = LICOES[i];\n    painel.querySelectorAll('#ma-lista button').forEach((b, j) => { b.classList.toggle('ativo', j === i); if (j === i) b.scrollIntoView({ inline: 'center', block: 'nearest' }); });\n    const ant = i > 0 ? '\u003cbutton class=\"bt\" id=\"ma-ant\">◀ Anterior\u003c/button>' : '';\n    const prox = i \u003c LICOES.length - 1 ? '\u003cbutton class=\"bt forte\" id=\"ma-prox\">Próxima ▶\u003c/button>' : '';\n    $('#ma-licao').innerHTML = '\u003cdiv class=\"cartao licao\">\u003ch2>' + L.esc(l.titulo) + '\u003c/h2>\u003cdiv class=\"exp\">' + l.exp + '\u003c/div>' + (l.dica ? '\u003cdiv class=\"dica\">💡 ' + L.esc(l.dica) + '\u003c/div>' : '') + '\u003c/div>' +\n      (l.semCodigo ? '' : '\u003cdiv class=\"cartao\">\u003cdiv class=\"duas\">\u003cdiv>\u003cp class=\"peq mut\" style=\"margin:0 0 4px\">✍️ \u003cb>Código\u003c/b> — pode mudar à vontade:\u003c/p>\u003ctextarea class=\"codigo\" id=\"ma-cod\" spellcheck=\"false\" autocapitalize=\"off\" autocomplete=\"off\">\u003c/textarea>\u003c/div>\u003cdiv>\u003cp class=\"peq mut\" style=\"margin:0 0 4px\">👀 \u003cb>Resultado\u003c/b> ao vivo:\u003c/p>\u003ciframe id=\"ma-frame\" title=\"Resultado da lição\" sandbox=\"allow-scripts allow-modals\">\u003c/iframe>\u003c/div>\u003c/div>' +\n        '\u003cdiv class=\"linha\" style=\"margin-top:8px\">\u003cbutton class=\"bt\" id=\"ma-volta\">🔄 Voltar ao original\u003c/button>\u003cbutton class=\"bt\" id=\"ma-copiar\">📋 Copiar\u003c/button>\u003cbutton class=\"bt forte\" id=\"ma-insp\">🔍 Levar para o Inspetor (mexer tocando)\u003c/button>\u003c/div>\u003c/div>') +\n      '\u003cdiv class=\"linha\" style=\"justify-content:space-between\">' + ant + '\u003cspan>\u003c/span>' + prox + '\u003c/div>';\n    if (!l.semCodigo) {\n      const ta = $('#ma-cod'); const guardado = L.pref.get('licao:' + l.id, null);\n      ta.value = guardado || l.codigo; ta.rows = Math.min(28, ta.value.split('\\n').length + 1);\n      let t; const viver = () => { $('#ma-frame').srcdoc = ta.value; };\n      ta.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { viver(); L.pref.set('licao:' + l.id, ta.value); }, 350); });\n      ta.addEventListener('keydown', (e) => { if (e.key === 'Tab') { e.preventDefault(); const p = ta.selectionStart; ta.setRangeText('  ', p, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input')); } });\n      viver();\n      $('#ma-volta').onclick = () => { ta.value = l.codigo; L.pref.set('licao:' + l.id, null); viver(); };\n      $('#ma-copiar').onclick = () => L.copiar(ta.value);\n      $('#ma-insp').onclick = () => { L.codigo.trocar(ta.value); L.abrirAba('inspetor'); L.aviso('Agora toque nos pedaços da página para mexer.', 'ok'); };\n    }\n    if ($('#ma-ant')) $('#ma-ant').onclick = () => abrir(i - 1);\n    if ($('#ma-prox')) $('#ma-prox').onclick = () => abrir(i + 1);\n    painel.scrollIntoView({ block: 'start' }); window.scrollTo(0, 0);\n  }\n  L.manual = { LICOES, abrir };\n  L.registrar({ aba: 'manual', montar });\n})(window.L);\n\n\u003c/script>\n  \u003cscript>\n/* 50-editor-codigo.js — 📝 CÓDIGO\n   O código inteiro da página que você está estudando (com as suas mudanças).\n   Colar, abrir arquivo, usar, copiar, baixar e voltar ao exemplo. */\n(function (L) {\n  'use strict';\n  let painel; const $ = (s) => L.$(s, painel);\n  function montar(el) {\n    painel = el;\n    el.innerHTML =\n      '\u003cdiv class=\"cartao\">\u003cp style=\"margin-top:0\">Aqui fica \u003cb>o código inteiro\u003c/b>. Cole o seu (apague o que está e cole), ou abra um arquivo .html, e toque em \u003cb>✅ Usar este código\u003c/b>. Depois vá em 🔍 Mexer no visual e toque nas partes.\u003c/p>' +\n      '\u003cdiv class=\"linha\">\u003cbutton class=\"bt forte\" id=\"ed-usar\">✅ Usar este código\u003c/button>\u003cbutton class=\"bt\" id=\"ed-abrir\">📂 Abrir arquivo\u003c/button>\u003cbutton class=\"bt\" id=\"ed-colar\">📋 Colar\u003c/button>\u003cbutton class=\"bt\" id=\"ed-limpar\">🧽 Esvaziar\u003c/button>\u003cbutton class=\"bt\" id=\"ed-copiar\">📄 Copiar tudo\u003c/button>\u003cbutton class=\"bt\" id=\"ed-baixar\">⬇ Baixar .html\u003c/button>\u003cbutton class=\"bt\" id=\"ed-exemplo\">🔄 Voltar ao exemplo\u003c/button>' +\n      '\u003cinput type=\"file\" id=\"ed-arq\" accept=\".html,.htm,text/html\" hidden>\u003c/div>' +\n      '\u003cp class=\"peq mut\" id=\"ed-info\">\u003c/p>' +\n      '\u003ctextarea class=\"codigo\" id=\"ed-texto\" spellcheck=\"false\" autocapitalize=\"off\" autocomplete=\"off\" style=\"min-height:60vh\">\u003c/textarea>' +\n      '\u003cdiv class=\"dica\">As mudanças que você faz tocando ficam num bloco \u003ccode>&lt;style id=\"ajustes-do-laboratorio\"&gt;\u003c/code> perto do fim do \u003ccode>&lt;head&gt;\u003c/code>. Assim o seu código original não é bagunçado, e você vê exatamente qual CSS cada mudança criou.\u003c/div>\u003c/div>';\n    const ta = $('#ed-texto');\n    const pintar = () => { ta.value = L.codigo.completo(); $('#ed-info').textContent = ta.value.split('\\n').length + ' linhas · ' + ta.value.length.toLocaleString('pt-BR') + ' letras' + (L.codigo.temAjustes ? ' · com mudanças do laboratório' : ''); };\n    $('#ed-usar').onclick = () => { if (!ta.value.trim()) return L.aviso('A caixa está vazia.'); L.codigo.trocar(ta.value); L.aviso('Pronto! Agora vá em 🔍 Mexer no visual.', 'ok'); L.abrirAba('inspetor'); };\n    $('#ed-abrir').onclick = () => $('#ed-arq').click();\n    $('#ed-arq').onchange = async (e) => { const f = e.target.files[0]; if (!f) return; ta.value = await f.text(); L.codigo.trocar(ta.value); L.aviso('Aberto: ' + f.name, 'ok'); e.target.value = ''; };\n    $('#ed-colar').onclick = async () => { try { const t = await navigator.clipboard.readText(); if (t) { ta.value = t; L.aviso('Colado. Toque em ✅ Usar este código.'); } else throw 0; } catch { ta.focus(); L.aviso('Toque e segure dentro da caixa → Colar.'); } };\n    $('#ed-limpar').onclick = () => { ta.value = ''; ta.focus(); };\n    $('#ed-copiar').onclick = () => L.copiar(ta.value);\n    $('#ed-baixar').onclick = () => L.baixar('minha-pagina.html', ta.value);\n    $('#ed-exemplo').onclick = () => { if (confirm('Trocar pelo exemplo do escritório? (o código atual sai daqui)')) { L.codigo.trocar(L.codigo.EXEMPLO); pintar(); } };\n    ta.addEventListener('keydown', (e) => { if (e.key === 'Tab') { e.preventDefault(); ta.setRangeText('  ', ta.selectionStart, ta.selectionEnd, 'end'); } });\n    L.on('codigo-mudou', () => { if (document.activeElement !== ta) pintar(); });\n    L.on('aba', (a) => { if (a === 'codigo') pintar(); });\n    pintar();\n  }\n  // seleciona no código o começo de um pedaço (ex.: vindo do 🔎 Achar no código)\n  function achar(html) {\n    const ta = $('#ed-texto'); if (!ta) return;\n    ta.value = L.codigo.completo();\n    const abertura = String(html || '').split('>')[0] + '>';\n    let i = ta.value.indexOf(abertura);\n    if (i \u003c 0) { const tag = (abertura.match(/^\u003c\\w+/) || [''])[0]; const cls = (abertura.match(/class=\"([^\"]+)\"/) || [])[1]; if (cls) i = ta.value.indexOf('class=\"' + cls + '\"'); if (i \u003c 0 && tag) i = ta.value.indexOf(tag); }\n    if (i \u003c 0) return L.aviso('Não achei esse pedaço exatamente no código (ele pode ter sido criado por JavaScript).', 'erro');\n    ta.focus(); ta.setSelectionRange(i, i + abertura.length);\n    const linha = ta.value.slice(0, i).split('\\n').length;\n    ta.scrollTop = Math.max(0, (linha - 4) * 19.5);\n    L.aviso('Está na linha ' + linha + ' (marcado).', 'ok');\n  }\n  L.editorCodigo = { achar };\n  L.registrar({ aba: 'codigo', montar });\n})(window.L);\n\n\u003c/script>\n  \u003cscript>\n/* 99-app.js — O ÚLTIMO VAGÃO: monta cada módulo na sua aba e liga as abas. */\n(function (L) {\n  'use strict';\n  L.$('#versao').textContent = 'v' + L.versao;\n  for (const m of L.modulos) {\n    const el = L.$('#painel-' + m.aba); if (!el) continue;\n    try { m.montar(el); } catch (e) { console.error(e); el.innerHTML = '\u003cdiv class=\"cartao\" style=\"color:var(--ruim)\">Esta parte deu erro ao abrir: ' + L.esc(e.message) + '\u003c/div>'; }\n  }\n  L.$('#abas').addEventListener('click', (e) => { const b = e.target.closest('[data-aba]'); if (b) { L.abrirAba(b.dataset.aba); L.pref.set('aba', b.dataset.aba); } });\n  const aba = L.pref.get('aba', 'inspetor');\n  L.abrirAba(L.$('#painel-' + aba) ? aba : 'inspetor');\n})(window.L);\n\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","l":"html","n":""},{"p":"mo2586.html","t":"\u003c!DOCTYPE html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Comparar Código\u003c/title>\n\u003cstyle>\n* { box-sizing: border-box; margin: 0; padding: 0; }\nbody { background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }\n\n/* HEADER */\n.header { background: #1e293b; border-bottom: 2px solid #334155; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }\n.title { font-size: 15px; font-weight: 700; color: #58a6ff; }\n.btn { padding: 7px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; transition: 0.2s; }\n.btn-blue  { background: #3b82f6; color: #fff; }\n.btn-green { background: #22c55e; color: #fff; }\n.btn-red   { background: #ef4444; color: #fff; }\n.btn-gray  { background: #475569; color: #fff; }\n.btn:hover { opacity: 0.85; }\n.status { margin-left: auto; font-size: 11px; color: #94a3b8; }\n\n/* SEARCH BAR */\n.searchbar { background: #1e293b; border-bottom: 1px solid #334155; padding: 8px 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }\n.search-input { flex: 1; min-width: 180px; padding: 7px 12px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #e2e8f0; font-size: 12px; outline: none; }\n.search-input:focus { border-color: #58a6ff; }\n.search-count { font-size: 11px; color: #3fb950; min-width: 90px; }\n.nav-btn { padding: 6px 10px; background: #334155; border: none; border-radius: 4px; color: #e2e8f0; cursor: pointer; font-size: 12px; }\n.nav-btn:hover { background: #475569; }\n.chk-label { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #94a3b8; cursor: pointer; }\n\n/* PAINEIS */\n.panels { flex: 1; display: flex; overflow: hidden; }\n.panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid #334155; }\n.panel:last-child { border-right: none; }\n.panel-header { padding: 8px 12px; background: #0f172a; border-bottom: 1px solid #334155; font-size: 11px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }\n.panel-header.blue  { color: #58a6ff; }\n.panel-header.green { color: #3fb950; }\n.panel-header.gold  { color: #ffc107; }\n.panel-body { flex: 1; display: flex; overflow: hidden; }\n.line-nums { background: #0a0f1a; color: #475569; padding: 8px 10px; font-family: monospace; font-size: 11px; line-height: 1.6; overflow: hidden; user-select: none; text-align: right; min-width: 40px; border-right: 1px solid #1e293b; }\n.code-area { flex: 1; padding: 8px 12px; background: #0a0f1a; color: #e2e8f0; border: none; font-family: 'Courier New', monospace; font-size: 11px; line-height: 1.6; resize: none; outline: none; overflow: auto; white-space: pre; }\n.code-area.editable { background: #0d1117; }\n\n/* RESULTADOS */\n.results-panel { width: 260px; background: #1e293b; border-left: 2px solid #334155; display: flex; flex-direction: column; overflow: hidden; }\n.results-header { padding: 8px 12px; background: #0f172a; border-bottom: 1px solid #334155; font-size: 11px; font-weight: 600; color: #ffc107; }\n.results-body { flex: 1; overflow-y: auto; padding: 6px; }\n.result-item { padding: 7px 8px; margin-bottom: 5px; background: #0f172a; border: 1px solid #334155; border-radius: 4px; cursor: pointer; font-size: 10px; transition: 0.2s; }\n.result-item:hover { border-color: #58a6ff; background: #1e293b; }\n.result-item.active { border-color: #3fb950; background: #0d2818; }\n.result-line { color: #58a6ff; font-weight: 700; margin-bottom: 3px; }\n.result-text { color: #94a3b8; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.result-copy { padding: 3px 7px; background: #6366f1; color: #fff; border: none; border-radius: 3px; cursor: pointer; font-size: 9px; margin-top: 4px; }\n.result-copy:hover { background: #4f46e5; }\n\n/* TOAST */\n.toast { position: fixed; bottom: 20px; right: 20px; padding: 10px 16px; background: #22c55e; color: #fff; border-radius: 8px; font-size: 11px; font-weight: 600; z-index: 9999; animation: pop 0.3s ease; }\n.toast.err { background: #ef4444; }\n@keyframes pop { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }\n\n@media (max-width: 700px) {\n  .panels { flex-direction: column; }\n  .results-panel { width: 100%; height: 160px; border-left: none; border-top: 2px solid #334155; }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003c!-- HEADER -->\n\u003cdiv class=\"header\">\n  \u003cdiv class=\"title\">🔍 Comparar e Buscar Código\u003c/div>\n\n  \u003clabel style=\"display:flex;align-items:center;gap:6px;cursor:pointer;\">\n    \u003cdiv class=\"btn btn-blue\">📁 Carregar Arquivo\u003c/div>\n    \u003cinput type=\"file\" id=\"file-input\" style=\"display:none\" accept=\"*\">\n  \u003c/label>\n\n  \u003cbutton class=\"btn btn-gray\" onclick=\"clearAll()\">🗑️ Limpar\u003c/button>\n  \u003cbutton class=\"btn btn-green\" onclick=\"copyEditor()\">📋 Copiar Código\u003c/button>\n  \u003cbutton class=\"btn btn-red\"  onclick=\"downloadCode()\">💾 Baixar\u003c/button>\n\n  \u003cdiv class=\"status\" id=\"status\">Pronto\u003c/div>\n\u003c/div>\n\n\u003c!-- BARRA DE BUSCA -->\n\u003cdiv class=\"searchbar\">\n  \u003cinput type=\"text\" id=\"search-input\" class=\"search-input\" placeholder=\"🔍 Buscar no código...\">\n  \u003cbutton class=\"nav-btn\" onclick=\"prevMatch()\" title=\"Anterior (Shift+Enter)\">▲\u003c/button>\n  \u003cbutton class=\"nav-btn\" onclick=\"nextMatch()\" title=\"Próximo (Enter)\">▼\u003c/button>\n  \u003cspan class=\"search-count\" id=\"search-count\">0 resultados\u003c/span>\n  \u003clabel class=\"chk-label\">\u003cinput type=\"checkbox\" id=\"chk-case\"> Maiúsc\u003c/label>\n  \u003clabel class=\"chk-label\">\u003cinput type=\"checkbox\" id=\"chk-regex\"> Regex\u003c/label>\n  \u003clabel class=\"chk-label\">\u003cinput type=\"checkbox\" id=\"chk-word\"> Palavra\u003c/label>\n\u003c/div>\n\n\u003c!-- PAINEIS -->\n\u003cdiv class=\"panels\">\n\n  \u003c!-- PAINEL ESQUERDO: código carregado -->\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"panel-header blue\">\n      \u003cspan id=\"panel-left-title\">📄 Cole ou carregue o código aqui\u003c/span>\n      \u003cspan id=\"panel-left-info\" style=\"font-size:10px;color:#475569;\">\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"panel-body\">\n      \u003cdiv class=\"line-nums\" id=\"ln-left\">\u003c/div>\n      \u003ctextarea class=\"code-area editable\" id=\"editor-left\"\n        placeholder=\"Cole o código do 4.6 aqui...&#10;&#10;Ou use o botão 📁 para carregar um arquivo.\"\n        spellcheck=\"false\"\n        oninput=\"onEditorChange()\"\n        onscroll=\"syncLN('left')\">\u003c/textarea>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- PAINEL DE RESULTADOS -->\n  \u003cdiv class=\"results-panel\">\n    \u003cdiv class=\"results-header\">🎯 Resultados da Busca\u003c/div>\n    \u003cdiv class=\"results-body\" id=\"results-body\">\n      \u003cdiv style=\"color:#475569;font-size:11px;padding:16px;text-align:center;\">\n        Digite algo na busca para encontrar no código\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\n\u003cscript>\nconst $ = id => document.getElementById(id);\n\nlet matches = [];\nlet matchIndex = 0;\n\n/* ── ARQUIVO ── */\n$('file-input').addEventListener('change', async e => {\n  const file = e.target.files[0];\n  if (!file) return;\n  try {\n    const text = await file.text();\n    $('editor-left').value = text;\n    $('panel-left-title').textContent = '📄 ' + file.name;\n    $('panel-left-info').textContent = (file.size/1024).toFixed(1) + ' KB';\n    onEditorChange();\n    setStatus('✅ Carregado: ' + file.name);\n    toast('✅ Arquivo carregado!');\n  } catch(err) {\n    toast('❌ Erro: ' + err.message, true);\n  }\n  e.target.value = '';\n});\n\n/* ── LINHA NUMBERS ── */\nfunction updateLN(side) {\n  const ta = $('editor-' + side);\n  const ln = $('ln-' + side);\n  if (!ta || !ln) return;\n  const n = ta.value.split('\\n').length;\n  ln.textContent = Array.from({length: n}, (_, i) => i + 1).join('\\n');\n}\n\nfunction syncLN(side) {\n  const ta = $('editor-' + side);\n  const ln = $('ln-' + side);\n  if (ta && ln) ln.scrollTop = ta.scrollTop;\n}\n\nfunction onEditorChange() {\n  updateLN('left');\n  doSearch();\n}\n\n/* ── BUSCA ── */\n$('search-input').addEventListener('input', doSearch);\n$('chk-case').addEventListener('change', doSearch);\n$('chk-regex').addEventListener('change', doSearch);\n$('chk-word').addEventListener('change', doSearch);\n\n$('search-input').addEventListener('keydown', e => {\n  if (e.key === 'Enter') { e.shiftKey ? prevMatch() : nextMatch(); }\n});\n\nfunction doSearch() {\n  const term = $('search-input').value;\n  const code = $('editor-left').value;\n  matches = [];\n  matchIndex = 0;\n\n  if (!term || !code) {\n    $('search-count').textContent = '0 resultados';\n    $('results-body').innerHTML = '\u003cdiv style=\"color:#475569;font-size:11px;padding:16px;text-align:center;\">Digite algo na busca\u003c/div>';\n    return;\n  }\n\n  const caseSens = $('chk-case').checked;\n  const useRegex = $('chk-regex').checked;\n  const wholeWord = $('chk-word').checked;\n\n  let regex;\n  try {\n    let pattern = useRegex ? term : term.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');\n    if (wholeWord) pattern = '\\\\b' + pattern + '\\\\b';\n    regex = new RegExp(pattern, caseSens ? 'g' : 'gi');\n  } catch(e) {\n    $('search-count').textContent = '❌ Regex inválida';\n    return;\n  }\n\n  const lines = code.split('\\n');\n  lines.forEach((line, li) => {\n    let m;\n    regex.lastIndex = 0;\n    while ((m = regex.exec(line)) !== null) {\n      matches.push({ line: li, col: m.index, text: m[0], context: line });\n    }\n  });\n\n  $('search-count').textContent = matches.length + ' resultado(s)';\n  renderResults();\n  if (matches.length > 0) goToMatch(0);\n}\n\nfunction renderResults() {\n  if (!matches.length) {\n    $('results-body').innerHTML = '\u003cdiv style=\"color:#ef4444;font-size:11px;padding:16px;text-align:center;\">❌ Nenhum resultado\u003c/div>';\n    return;\n  }\n\n  $('results-body').innerHTML = matches.map((m, i) => `\n    \u003cdiv class=\"result-item ${i === matchIndex ? 'active' : ''}\" id=\"ri-${i}\" onclick=\"goToMatch(${i})\">\n      \u003cdiv class=\"result-line\">Linha ${m.line + 1}, Col ${m.col + 1}\u003c/div>\n      \u003cdiv class=\"result-text\">${escHtml(m.context.trim().slice(0, 55))}\u003c/div>\n      \u003cbutton class=\"result-copy\" onclick=\"event.stopPropagation(); copyLine('${escAttr(m.context)}')\">📋 Copiar linha\u003c/button>\n    \u003c/div>\n  `).join('');\n}\n\nfunction goToMatch(i) {\n  if (i \u003c 0) i = matches.length - 1;\n  if (i >= matches.length) i = 0;\n  matchIndex = i;\n\n  const m = matches[i];\n  const ta = $('editor-left');\n  const lines = ta.value.split('\\n');\n\n  // Posição no textarea\n  let pos = 0;\n  for (let l = 0; l \u003c m.line; l++) pos += lines[l].length + 1;\n  pos += m.col;\n\n  ta.focus();\n  ta.setSelectionRange(pos, pos + m.text.length);\n\n  // Scroll para linha\n  const lh = parseFloat(getComputedStyle(ta).lineHeight) || 18;\n  ta.scrollTop = m.line * lh - ta.clientHeight / 2;\n  syncLN('left');\n\n  // Atualizar lista\n  document.querySelectorAll('.result-item').forEach((el, idx) => {\n    el.classList.toggle('active', idx === i);\n  });\n  const ri = $('ri-' + i);\n  if (ri) ri.scrollIntoView({ behavior: 'smooth', block: 'nearest' });\n\n  setStatus(`Resultado ${i + 1} de ${matches.length} — Linha ${m.line + 1}`);\n}\n\nfunction nextMatch() { goToMatch(matchIndex + 1); }\nfunction prevMatch() { goToMatch(matchIndex - 1); }\n\n/* ── AÇÕES ── */\nfunction clearAll() {\n  $('editor-left').value = '';\n  $('panel-left-title').textContent = '📄 Cole ou carregue o código aqui';\n  $('panel-left-info').textContent = '';\n  $('search-input').value = '';\n  matches = [];\n  $('search-count').textContent = '0 resultados';\n  $('results-body').innerHTML = '\u003cdiv style=\"color:#475569;font-size:11px;padding:16px;text-align:center;\">Digite algo na busca\u003c/div>';\n  updateLN('left');\n  toast('🗑️ Limpo!');\n}\n\nfunction copyEditor() {\n  const code = $('editor-left').value;\n  if (!code) { toast('❌ Nada para copiar', true); return; }\n  navigator.clipboard.writeText(code).then(() => toast('📋 Copiado!'));\n}\n\nfunction downloadCode() {\n  const code = $('editor-left').value;\n  if (!code) { toast('❌ Nada para baixar', true); return; }\n  const name = $('panel-left-title').textContent.replace('📄 ', '') || 'codigo.txt';\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(new Blob([code], {type: 'text/plain'}));\n  a.download = name;\n  a.click();\n  URL.revokeObjectURL(a.href);\n  toast('💾 Baixando...');\n}\n\nfunction copyLine(text) {\n  navigator.clipboard.writeText(text).then(() => toast('📋 Linha copiada!'));\n}\n\n/* ── UTILS ── */\nfunction setStatus(msg) { $('status').textContent = msg; }\n\nfunction toast(msg, err = false) {\n  const el = document.createElement('div');\n  el.className = 'toast' + (err ? ' err' : '');\n  el.textContent = msg;\n  document.body.appendChild(el);\n  setTimeout(() => el.remove(), 2800);\n}\n\nfunction escHtml(s) {\n  return s.replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');\n}\nfunction escAttr(s) {\n  return s.replace(/\\\\/g,'\\\\\\\\').replace(/'/g,\"\\\\'\").replace(/\\n/g,'\\\\n');\n}\n\n// Init\nupdateLN('left');\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","l":"html","n":""},{"p":"lqb.html","t":"\u003c!DOCTYPE html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n\u003cmeta name=\"theme-color\" content=\"#0d1117\">\n\u003ctitle>Projeto Lab\u003c/title>\n\u003cstyle>\n:root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--border:#30363d;--text:#c9d1d9;--text2:#8b949e;--accent:#58a6ff;\n  --green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#bc8cff;--orange:#f0883e;--addbg:rgba(63,185,80,.14);--delbg:rgba(248,81,73,.14)}\n*{margin:0;padding:0;box-sizing:border-box}\nhtml,body{height:100%}\nbody{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;font-size:13px}\nbutton,select,input,textarea{font-family:inherit;font-size:12px}\n.hidden{display:none!important}\na{color:var(--accent)}\nselect,input[type=text],input[type=password],input[type=search],textarea{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:5px 9px;border-radius:6px;outline:none;min-height:30px}\nselect:focus,input:focus,textarea:focus{border-color:var(--accent)}\n.btn{padding:5px 10px;min-height:30px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text);cursor:pointer;white-space:nowrap;touch-action:manipulation}\n.btn:hover{background:var(--border)}\n.btn.sm{min-height:24px;padding:2px 8px;font-size:11px}\n.btn.primary{background:var(--accent);color:#000;border-color:var(--accent)}\n.btn.success{background:var(--green);color:#000;border-color:var(--green)}\n.btn.danger{background:var(--red);color:#fff;border-color:var(--red)}\n.btn.ai{border-color:var(--purple);color:var(--purple)}\n.btn.ai:hover{background:rgba(188,140,255,.15)}\n.btn.on{border-color:var(--accent);color:var(--accent);background:rgba(88,166,255,.14)}\n.btn:disabled{opacity:.4;cursor:not-allowed}\n.mono{font-family:Consolas,Monaco,'Courier New',monospace}\n.muted{color:var(--text2)}\n.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}\n\n/* HEADER */\nheader{background:var(--bg2);border-bottom:1px solid var(--border);padding:6px 8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}\n.brand{font-weight:700;color:var(--accent);font-size:14px;white-space:nowrap;margin-right:4px}\n.slot{display:flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:3px 5px;min-width:0;flex:1 1 230px;max-width:420px}\n.slot.drop{border-color:var(--accent);background:rgba(88,166,255,.12)}\n.tag{font-weight:800;border-radius:5px;padding:1px 7px;font-size:12px;color:#000;flex-shrink:0}\n.tag.A{background:var(--orange)}.tag.B{background:var(--purple)}\n.slot input{flex:1;min-width:60px;background:transparent;border:1px solid transparent;min-height:26px;padding:2px 5px}\n.slot input:hover{border-color:var(--border)}\n.slot .info{font-size:10.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}\nnav.tabs{display:flex;gap:2px;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 6px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}\nnav.tabs::-webkit-scrollbar{display:none}\n.tab{background:none;border:none;color:var(--text2);padding:8px 11px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;font-size:12.5px}\n.tab:hover{color:var(--text)}\n.tab.on{color:var(--accent);border-bottom-color:var(--accent)}\n.tab .cnt{background:var(--bg3);border-radius:9px;padding:0 6px;font-size:10.5px;margin-left:3px}\n.viewbar{display:flex;gap:6px;align-items:center;padding:5px 10px;background:var(--bg);border-bottom:1px solid var(--border);flex-wrap:wrap;flex-shrink:0}\n\n/* LAYOUT */\n.main{flex:1;display:flex;min-height:0;position:relative}\n#view{flex:1;overflow:auto;min-width:0;padding:12px}\n#view.full{padding:0;overflow:hidden;display:flex;flex-direction:column}\n.split{display:flex;flex:1;min-height:0}\n.split .left{width:320px;flex-shrink:0;border-right:1px solid var(--border);overflow:auto;background:var(--bg2);display:flex;flex-direction:column}\n.split .right{flex:1;overflow:auto;min-width:0;display:flex;flex-direction:column}\n.pad{padding:10px}\n\n/* CARDS */\n.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-bottom:12px}\n.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 12px}\n.card .big{font-size:22px;font-weight:700}\n.card .lbl{font-size:11px;color:var(--text2)}\n.card.click{cursor:pointer}.card.click:hover{border-color:var(--accent)}\n.box{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px}\n.box h3{font-size:13.5px;margin-bottom:8px;color:#e6edf3}\n.welcome{max-width:720px;margin:20px auto;line-height:1.7}\n.welcome h2{color:var(--accent);margin-bottom:8px}\n.welcome ul{margin:6px 0 10px 20px}\n.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;border:1px solid var(--border);color:var(--text2);margin:0 4px 4px 0;background:var(--bg)}\n.pill.ok{border-color:var(--green);color:var(--green)}\n.pill.warn{border-color:var(--yellow);color:var(--yellow)}\n.pill.bad{border-color:var(--red);color:var(--red)}\n\n/* SEVERIDADE */\n.sev{font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px;white-space:nowrap}\n.sev.critico{background:var(--red);color:#fff}.sev.alto{background:var(--orange);color:#000}\n.sev.medio{background:var(--yellow);color:#000}.sev.info{background:var(--bg3);color:var(--accent);border:1px solid var(--accent)}\n.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:5px}\n.dot.critico{background:var(--red)}.dot.alto{background:var(--orange)}.dot.medio{background:var(--yellow)}.dot.info{background:var(--accent)}\n\n/* TABELAS */\ntable.t{width:100%;border-collapse:collapse;font-size:12px}\ntable.t th{text-align:left;color:var(--text2);font-weight:600;border-bottom:1px solid var(--border);padding:5px 6px;position:sticky;top:0;background:var(--bg2)}\ntable.t td{border-bottom:1px solid var(--bg3);padding:5px 6px;vertical-align:top;word-break:break-word}\ntable.t tr:hover td{background:rgba(255,255,255,.02)}\n.iss{display:flex;gap:8px;padding:8px 10px;border-bottom:1px solid var(--bg3);align-items:flex-start}\n.iss:hover{background:rgba(255,255,255,.02)}\n.iss .body{flex:1;min-width:0}\n.iss .msg{color:#e6edf3}\n.iss .fix{color:var(--text2);font-size:11.5px;margin-top:2px}\n.iss .loc{font-size:11px;color:var(--accent);cursor:pointer;word-break:break-all}\n.iss .det{font-size:11px;color:var(--text2)}\n\n/* ÁRVORE */\n.tree{padding:4px 2px;font-size:12px;flex:1;overflow:auto}\n.tree details>summary{list-style:none;cursor:pointer;padding:2px 6px;border-radius:4px;white-space:nowrap}\n.tree details>summary::-webkit-details-marker{display:none}\n.tree details>summary:hover,.tree .f:hover{background:var(--bg3)}\n.tree details>div{padding-left:12px;border-left:1px solid var(--bg3);margin-left:9px}\n.tree .f{padding:2px 6px;border-radius:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.tree .f.sel{background:rgba(88,166,255,.18);color:var(--accent)}\n.tree .hid{color:var(--orange)}\n.tree .skip{color:var(--text2);font-style:italic;padding:2px 6px}\n.tree .cnt{color:var(--text2);font-size:10px;margin-left:4px}\n.st{font-weight:800;font-size:10.5px;display:inline-block;width:14px;text-align:center}\n.st.A{color:var(--green)}.st.D{color:var(--red)}.st.M{color:var(--yellow)}\n\n/* CÓDIGO */\n.codehead{position:sticky;top:0;z-index:2;background:var(--bg2);border-bottom:1px solid var(--border);padding:6px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}\n.codehead .path{font-family:Consolas,monospace;font-size:12px;color:#e6edf3;word-break:break-all;margin-right:auto}\n.code{font-family:Consolas,Monaco,'Courier New',monospace;font-size:12px;line-height:1.55;background:var(--bg);min-width:max-content}\n.code .l{display:flex}\n.code .n{width:52px;flex-shrink:0;text-align:right;padding-right:10px;color:#484f58;user-select:none}\n.code .x{white-space:pre;padding-right:20px;color:#e6edf3}\n.code .l.hl{background:rgba(248,81,73,.13)}\n.code .l.hl .n{color:var(--red)}\n.code .l.jump{outline:1px solid var(--accent)}\n\n/* DIFF */\ntable.diff{border-collapse:collapse;width:100%;font-family:Consolas,Monaco,monospace;font-size:12px;line-height:1.5;table-layout:fixed}\ntable.diff td{vertical-align:top;padding:0 6px;white-space:pre-wrap;word-break:break-all}\ntable.diff td.n{width:46px;text-align:right;color:#484f58;user-select:none;background:var(--bg2)}\ntable.diff td.del{background:var(--delbg)}\ntable.diff td.add{background:var(--addbg)}\ntable.diff td.emp{background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,255,255,.02) 6px 12px)}\ntable.diff tr.gap td{background:var(--bg3);color:var(--text2);text-align:center;font-family:'Segoe UI',sans-serif;font-size:11px;padding:3px}\ntable.diff tr.head td{background:var(--bg2);color:var(--text2);font-family:'Segoe UI',sans-serif;font-weight:600;padding:5px 6px;position:sticky;top:0}\n.u .l .x{white-space:pre-wrap;word-break:break-all}\n.u .l.add{background:var(--addbg)}.u .l.del{background:var(--delbg)}\n\n/* IA */\n#aiPanel{width:420px;flex-shrink:0;border-left:1px solid var(--border);background:var(--bg2);display:flex;flex-direction:column}\n#aiPanel:not(.open){display:none}\n.ai-head{padding:6px 8px;border-bottom:1px solid var(--border);display:flex;gap:5px;align-items:center;flex-wrap:wrap}\n.ai-head select{max-width:150px}\n#aiMsgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px}\n.aimsg{border:1px solid var(--border);border-radius:10px;padding:8px 11px;line-height:1.6;background:var(--bg);word-break:break-word}\n.aimsg.user{border-color:var(--accent);background:var(--bg3)}\n.aimsg.err{border-color:var(--red);color:#ffb3ad}\n.aimsg .meta{font-size:10.5px;color:var(--text2);margin-top:4px;display:flex;gap:6px;align-items:center}\n.aimsg .meta button{background:none;border:none;color:var(--text2);cursor:pointer;font-size:12px}\n.ctxchip{display:inline-block;background:rgba(188,140,255,.12);border:1px solid var(--purple);color:var(--purple);border-radius:6px;padding:1px 7px;font-size:11px;margin:2px 0}\n.ai-input{border-top:1px solid var(--border);padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom))}\n.ai-input textarea{width:100%;min-height:60px;max-height:200px;resize:vertical;font-size:13px}\n.presets{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;max-height:90px;overflow:auto}\n.presets .btn{white-space:normal;text-align:left;height:auto}\n.md-h{font-weight:700;color:#e6edf3;margin:6px 0 2px}\n.inline-code{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:0 4px;font-family:Consolas,monospace;font-size:12px;color:#ffa657}\n.codebox{border:1px solid var(--border);border-radius:8px;margin:6px 0;overflow:hidden}\n.codebox-head{display:flex;gap:6px;align-items:center;padding:3px 8px;background:var(--bg3);font-size:11px}\n.codebox-head .lang{color:var(--accent);font-weight:700;text-transform:uppercase;margin-right:auto}\n.codebox pre{margin:0;padding:8px;overflow:auto;max-height:380px;background:var(--bg)}\n.codebox code{font-family:Consolas,monospace;font-size:12px;white-space:pre;color:#e6edf3}\n.typing span{display:inline-block;width:6px;height:6px;background:var(--text2);border-radius:50%;margin-right:3px;animation:b 1.2s infinite}\n.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}\n@keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}\n\n/* MODAL / TOAST / OVERLAY */\n.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;align-items:center;justify-content:center;padding:10px}\n.modal-bg.open{display:flex}\n.modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px;width:560px;max-width:100%;max-height:92vh;overflow:auto}\n.modal h2{font-size:16px;color:var(--accent);margin-bottom:12px}\n.fg{margin-bottom:11px}\n.fg>label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px}\n.fg input:not([type=checkbox]),.fg select,.fg textarea{width:100%}\n.check{display:flex;align-items:center;gap:6px;cursor:pointer}\n.hint{font-size:11.5px;color:var(--text2);line-height:1.5;margin-top:4px}\n.big-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}\n.big-btns .btn{min-height:64px;font-size:13px;white-space:normal}\n.toast{position:fixed;bottom:16px;right:16px;max-width:min(480px,calc(100vw - 32px));background:var(--bg3);border:1px solid var(--border);padding:9px 14px;border-radius:8px;z-index:9999;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;font-size:12.5px}\n.toast.show{opacity:1;transform:none}\n.toast.success{border-color:var(--green);color:var(--green)}.toast.error{border-color:var(--red);color:#ffb3ad}.toast.warn{border-color:var(--yellow);color:var(--yellow)}\n#dropOverlay{position:fixed;inset:0;background:rgba(13,17,23,.88);border:3px dashed var(--accent);z-index:2000;display:none;align-items:center;justify-content:center;font-size:20px;color:var(--accent);text-align:center;padding:20px}\n#dropOverlay.show{display:flex}\n#busy{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:3000;display:none;align-items:center;justify-content:center}\n#busy.show{display:flex}\n#busy .inner{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px 26px;text-align:center;min-width:260px}\n.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}\n@keyframes sp{to{transform:rotate(360deg)}}\n::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}\n\n@media (max-width:820px){\n  .brand{flex:1;order:0}#aiBtn{order:1}header>.btn:last-child{order:2}\n  .slot{flex-basis:100%;max-width:none;order:3}#swapBtn{display:none}\n  .slot .info{display:none}\n  .split{flex-direction:column}\n  .split .left{width:100%;max-height:38vh;border-right:0;border-bottom:1px solid var(--border)}\n  #aiPanel{position:absolute;inset:0;width:100%;z-index:50}\n  #view{padding:8px}\n  .big-btns{grid-template-columns:1fr}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cheader>\n  \u003cspan class=\"brand\">🔬 Projeto Lab\u003c/span>\n  \u003cdiv class=\"slot\" id=\"slotA\">\n    \u003cspan class=\"tag A\">A\u003c/span>\n    \u003cinput id=\"nameA\" placeholder=\"Versão A (antiga / base)\" onchange=\"renameSlot('A',this.value)\">\n    \u003cspan class=\"info\" id=\"infoA\">vazio\u003c/span>\n    \u003cbutton class=\"btn sm\" onclick=\"openLoad('A')\" title=\"Carregar projeto A\">📂\u003c/button>\n    \u003cbutton class=\"btn sm\" onclick=\"clearSlot('A')\" title=\"Remover\">✕\u003c/button>\n  \u003c/div>\n  \u003cbutton class=\"btn sm\" id=\"swapBtn\" onclick=\"swapSlots()\" title=\"Trocar A ⇄ B\">⇄\u003c/button>\n  \u003cdiv class=\"slot\" id=\"slotB\">\n    \u003cspan class=\"tag B\">B\u003c/span>\n    \u003cinput id=\"nameB\" placeholder=\"Versão B (nova / para comparar)\" onchange=\"renameSlot('B',this.value)\">\n    \u003cspan class=\"info\" id=\"infoB\">vazio\u003c/span>\n    \u003cbutton class=\"btn sm\" onclick=\"openLoad('B')\" title=\"Carregar projeto B\">📂\u003c/button>\n    \u003cbutton class=\"btn sm\" onclick=\"clearSlot('B')\" title=\"Remover\">✕\u003c/button>\n  \u003c/div>\n  \u003cbutton class=\"btn ai\" id=\"aiBtn\" onclick=\"AI.toggle()\" title=\"IA ajudante\">🤖 IA\u003c/button>\n  \u003cbutton class=\"btn\" onclick=\"Settings.open()\" title=\"Configurações e chaves de IA\">⚙️\u003c/button>\n\u003c/header>\n\n\u003cnav class=\"tabs\" id=\"tabs\">\n  \u003cbutton class=\"tab on\" data-tab=\"resumo\" onclick=\"setTab('resumo')\">📊 Resumo\u003c/button>\n  \u003cbutton class=\"tab\" data-tab=\"arquivos\" onclick=\"setTab('arquivos')\">📁 Arquivos\u003c/button>\n  \u003cbutton class=\"tab\" data-tab=\"problemas\" onclick=\"setTab('problemas')\">🩺 Problemas\u003cspan class=\"cnt\" id=\"cntIss\">0\u003c/span>\u003c/button>\n  \u003cbutton class=\"tab\" data-tab=\"deps\" onclick=\"setTab('deps')\">📦 Dependências\u003c/button>\n  \u003cbutton class=\"tab\" data-tab=\"api\" onclick=\"setTab('api')\">🔌 API\u003c/button>\n  \u003cbutton class=\"tab\" data-tab=\"git\" onclick=\"setTab('git')\">🌿 Git\u003c/button>\n  \u003cbutton class=\"tab\" data-tab=\"comparar\" onclick=\"setTab('comparar')\">⚖️ Comparar A × B\u003c/button>\n\u003c/nav>\n\u003cdiv class=\"viewbar hidden\" id=\"viewbar\">\u003c/div>\n\n\u003cdiv class=\"main\">\n  \u003cdiv id=\"view\">\u003c/div>\n  \u003caside id=\"aiPanel\">\n    \u003cdiv class=\"ai-head\">\n      \u003cb style=\"color:var(--purple)\">🤖\u003c/b>\n      \u003cselect id=\"aiProvider\" onchange=\"AI.onProvider()\">\u003c/select>\n      \u003cselect id=\"aiModel\" onchange=\"AI.onModel()\">\u003c/select>\n      \u003cspan style=\"flex:1\">\u003c/span>\n      \u003cbutton class=\"btn sm\" onclick=\"AI.clear()\" title=\"Limpar conversa\">🧹\u003c/button>\n      \u003cbutton class=\"btn sm\" onclick=\"AI.toggle()\">✕\u003c/button>\n    \u003c/div>\n    \u003cdiv id=\"aiMsgs\">\u003c/div>\n    \u003cdiv class=\"ai-input\">\n      \u003cdiv id=\"aiCtx\" class=\"hidden\" style=\"margin-bottom:5px\">\u003c/div>\n      \u003cdiv class=\"presets\" id=\"aiPresets\">\u003c/div>\n      \u003ctextarea id=\"aiInput\" placeholder=\"Pergunte sobre o projeto... (Ctrl+Enter envia)\" onkeydown=\"if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){event.preventDefault();AI.send()}\">\u003c/textarea>\n      \u003cdiv class=\"row\" style=\"margin-top:5px\">\n        \u003cbutton class=\"btn sm\" onclick=\"AI.copyPrompt()\" title=\"Copiar pergunta + contexto para colar em outra IA (ex.: Claude)\">📋 Copiar pedido\u003c/button>\n        \u003cbutton class=\"btn sm\" onclick=\"AI.dropCtx()\" id=\"aiDropCtx\" style=\"display:none\">✕ tirar contexto\u003c/button>\n        \u003cspan style=\"flex:1\">\u003c/span>\n        \u003cbutton class=\"btn primary\" id=\"aiSend\" onclick=\"AI.send()\">Enviar ▶\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/aside>\n\u003c/div>\n\n\u003c!-- CARREGAR -->\n\u003cdiv class=\"modal-bg\" id=\"loadModal\">\n  \u003cdiv class=\"modal\">\n    \u003ch2>📂 Carregar projeto \u003cspan id=\"loadSlotLbl\">\u003c/span>\u003c/h2>\n    \u003cdiv class=\"fg\">\u003clabel>Nome desta versão (para a comparação)\u003c/label>\u003cinput type=\"text\" id=\"loadName\" placeholder=\"Ex.: Replit original, Versão consertada, Backup 28/09\">\u003c/div>\n    \u003cdiv class=\"big-btns\">\n      \u003cbutton class=\"btn primary\" onclick=\"$('pickArchive').click()\">🗜️ Arquivo compactado\u003cbr>\u003csmall>.zip .tar .tar.gz .tgz .gz\u003c/small>\u003c/button>\n      \u003cbutton class=\"btn\" onclick=\"$('pickFolder').click()\">📁 Pasta inteira\u003cbr>\u003csmall>(no computador)\u003c/small>\u003c/button>\n    \u003c/div>\n    \u003clabel class=\"check fg\">\u003cinput type=\"checkbox\" id=\"optSkip\" checked> Ignorar \u003cb>node_modules\u003c/b>, caches e builds pesados (recomendado — eles só são contados)\u003c/label>\n    \u003cp class=\"hint\">Também dá para \u003cb>arrastar e soltar\u003c/b> um zip ou pasta em cima de A ou B. As pastas ocultas (\u003cb>.git\u003c/b>, .replit, .local, .config...) são lidas normalmente. Nada é enviado para a internet: tudo é lido aqui no navegador (só vai para a IA o que você mandar).\u003cbr>\n    .rar e .7z não são lidos no navegador — abra no 7-Zip/WinRAR e salve como .zip.\u003c/p>\n    \u003cdiv class=\"row\" style=\"justify-content:flex-end;margin-top:10px\">\u003cbutton class=\"btn\" onclick=\"closeModal('loadModal')\">Cancelar\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- CONFIG -->\n\u003cdiv class=\"modal-bg\" id=\"setModal\">\n  \u003cdiv class=\"modal\">\n    \u003ch2>⚙️ Configurações da IA\u003c/h2>\n    \u003cdiv id=\"keysBox\">\u003c/div>\n    \u003cdiv class=\"fg\">\u003clabel>🏠 Ollama URL\u003c/label>\u003cinput type=\"text\" id=\"setOllama\" placeholder=\"http://localhost:11434\">\u003c/div>\n    \u003cdiv class=\"fg\">\u003clabel>🔧 URL base do \"Personalizado\" (compatível OpenAI)\u003c/label>\u003cinput type=\"text\" id=\"setCustom\" placeholder=\"https://.../v1\">\u003c/div>\n    \u003cdiv class=\"fg\">\u003clabel>Máximo de caracteres de contexto enviados por pergunta\u003c/label>\u003cinput type=\"text\" id=\"setMaxCtx\">\u003c/div>\n    \u003cdiv class=\"fg\">\u003clabel>Tamanho máximo da resposta (tokens)\u003c/label>\u003cinput type=\"text\" id=\"setMaxTok\">\u003c/div>\n    \u003cp class=\"hint\">Chaves ficam só neste navegador. Se você usa o AI Code Studio no mesmo navegador/pasta, as chaves dele são aproveitadas automaticamente. Gemini aceita chave AIza... e AQ.... Use 🔄 ao lado do modelo para buscar a lista atual.\u003c/p>\n    \u003cdiv class=\"row\" style=\"justify-content:flex-end;margin-top:12px\">\n      \u003cbutton class=\"btn\" onclick=\"Settings.test()\">🧪 Testar IA\u003c/button>\n      \u003cbutton class=\"btn\" onclick=\"closeModal('setModal')\">Cancelar\u003c/button>\n      \u003cbutton class=\"btn primary\" onclick=\"Settings.save()\">💾 Salvar\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"dropOverlay\">Solte o zip / pasta aqui\u003cbr>\u003csmall id=\"dropHint\">\u003c/small>\u003c/div>\n\u003cdiv id=\"busy\">\u003cdiv class=\"inner\">\u003cdiv class=\"sp
