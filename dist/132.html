&lt;script&gt;
// ====================== CÓDIGO COMPLETO ======================
let apiKey = localStorage.getItem('pg_apikey') || '';
let apiProvider = localStorage.getItem('pg_provider') || 'gemini';
let currentFile = 'sem_titulo.html';
let previewOpen = false;

const SYSTEM_PROMPT = `Você é uma assistente de código de altíssimo nível integrada a um editor.
REGRAS ABSOLUTAS:
- NUNCA peça desculpas.
- NUNCA use frases de empatia.
- Vá DIRETO ao ponto.
- Quando for alterar código, mostre o trecho exato com comentário indicando onde inserir.
- Ao final de respostas com código pergunte apenas: &quot;Quer que eu aplique mais alguma coisa?&quot;`;

function updateCount() {
  const code = document.getElementById('editor').value;
  document.getElementById('char-count').textContent = code.length + ' chars';
  if (previewOpen) updatePreview();
}

function importFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.onchange = e =&gt; {
    const file = e.target.files[0];
    if (!file) return;
    currentFile = file.name;
    document.getElementById('filename-display').textContent = file.name;
    const reader = new FileReader();
    reader.onload = ev =&gt; {
      document.getElementById('editor').value = ev.target.result;
      updateCount();
    };
    reader.readAsText(file);
  };
  input.click();
}

function saveFile() {
  const code = document.getElementById('editor').value;
  localStorage.setItem('pg_code_' + currentFile, code);
  localStorage.setItem('pg_lastfile', currentFile);
  alert('Salvo no navegador: ' + currentFile);
}

function downloadFile() {
  const code = document.getElementById('editor').value;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([code]));
  a.download = currentFile;
  a.click();
}

function togglePreview() {
  const panel = document.getElementById('preview-panel');
  previewOpen = !previewOpen;
  panel.style.display = previewOpen ? 'flex' : 'none';
  if (previewOpen) updatePreview();
}

function updatePreview() {
  document.getElementById('preview-frame').srcdoc = document.getElementById('editor').value;
}

function openFullscreen() {
  document.getElementById('modal-editor').value = document.getElementById('editor').value;
  document.getElementById('modal').classList.add('open');
}

function closeFullscreen() {
  document.getElementById('editor').value = document.getElementById('modal-editor').value;
  document.getElementById('modal').classList.remove('open');
  updateCount();
}

function openApiModal() {
  document.getElementById('apikey-input').value = apiKey;
  document.getElementById('api-provider').value = apiProvider;
  document.getElementById('apimodal').classList.add('open');
}

function closeApiModal() {
  document.getElementById('apimodal').classList.remove('open');
}

function saveApiKey() {
  apiKey = document.getElementById('apikey-input').value.trim();
  apiProvider = document.getElementById('api-provider').value;
  localStorage.setItem('pg_apikey', apiKey);
  localStorage.setItem('pg_provider', apiProvider);
  document.getElementById('model-label').textContent = apiProvider === 'gemini' ? 'Gemini 1.5 Flash' : 'GPT-4o Mini';
  closeApiModal();
}

function addMsg(role, content, codeBlock) {
  const container = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg msg-' + role;
  div.textContent = content;
  if (codeBlock) {
    const btn = document.createElement('button');
    btn.className = 'apply-btn';
    btn.textContent = '✅ Aplicar no editor';
    btn.onclick = () =&gt; {
      document.getElementById('editor').value = codeBlock;
      updateCount();
    };
    div.appendChild(btn);
  }
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || !apiKey) return;
  input.value = '';
  addMsg('user', text);

  const code = document.getElementById('editor').value;
  const fullMsg = code ? `[CÓDIGO ATUAL]\n${code}\n\n[PEDIDO]\n${text}` : text;

  addMsg('system', 'Pensando...');

  try {
    let reply = '';
    if (apiProvider === 'gemini') {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({system_instruction:{parts:[{text:SYSTEM_PROMPT}]},contents:[{role:'user',parts:[{text:fullMsg}]}]})
      });
      const data = await res.json();
      reply = data.candidates[0].content.parts[0].text;
    } else {
      const res = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: {'Content-Type': 'application/json','Authorization':'Bearer '+apiKey},
        body: JSON.stringify({model:'gpt-4o-mini',messages:[{role:'system',content:SYSTEM_PROMPT},{role:'user',content:fullMsg}]})
      });
      const data = await res.json();
      reply = data.choices[0].message.content;
    }

    const match = reply.match(/```[\s\S]*?\n([\s\S]*?)```/);
    addMsg('ai', reply, match ? match[1] : null);
  } catch (e) {
    addMsg('system', 'Erro: ' + e.message);
  }
}

window.onload = () =&gt; {
  const saved = localStorage.getItem('pg_lastfile');
  if (saved) {
    const code = localStorage.getItem('pg_code_' + saved);
    if (code) {
      currentFile = saved;
      document.getElementById('filename-display').textContent = saved;
      document.getElementById('editor').value = code;
      updateCount();
    }
  }
  if (!apiKey) setTimeout(() =&gt; addMsg('system', 'Configure sua API Key clicando em &quot;🔑 API Key&quot;'), 800);
};
&lt;/script&gt;
&lt;/body&gt;

  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #0d0d0d; }

      &lt;button class=&quot;btn btn-gray&quot; style=&quot;flex:1&quot; onclick=&quot;closeApiModal()&quot;&gt;Cancelar&lt;/button&gt;
    &lt;/div&gt;
    &lt;p style=&quot;font-size:11px;color:#6b7280;margin-top:12px;&quot;&gt;A chave fica salva só no seu navegador (localStorage). Não é enviada para nenhum servidor externo.&lt;/p&gt;

&lt;script&gt;
// ============================================================
// CONFIGURAÇÃO
// ============================================================
let apiKey = localStorage.getItem('pg_apikey') || '';
let apiProvider = localStorage.getItem('pg_provider') || 'gemini';
let currentFile = 'sem_titulo.html';
let previewOpen = false;
let lastAiCode = null;

const SYSTEM_PROMPT = `Você é uma assistente de código e jurídica de altíssimo nível integrada a um editor de código.
O usuário é o Saulo, advogado, muito focado. Ele odeia enrolação.

REGRAS ABSOLUTAS:
1. NUNCA peça desculpas.
2. NUNCA diga &quot;Parece que você tem um problema&quot;, &quot;Eu entendo sua frustração&quot; ou qualquer frase de empatia.
3. Vá DIRETO ao ponto. Só o que foi pedido.
4. Se for alterar código: mostre o trecho alterado com comentário indicando EXATAMENTE onde inserir. Seja cirúrgico.
5. Se for pergunta jurídica: responda como um colega advogado sênior. Direto, técnico, sem rodeios.
6. Ao final de cada resposta com código, pergunte apenas: &quot;Quer que eu aplique mais alguma coisa?&quot;`;

// ============================================================
// EDITOR
// ============================================================
function updateCount() {
  const code = document.getElementById('editor').value;
  document.getElementById('char-count').textContent = code.length + ' chars';
  if (previewOpen) updatePreview();
}

function importFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.html,.htm,.js,.ts,.tsx,.jsx,.css,.txt,.json';
  input.onchange = e =&gt; {
    const file = e.target.files[0];
    if (!file) return;
    currentFile = file.name;
    document.getElementById('filename-display').textContent = file.name;
    const reader = new FileReader();
    reader.onload = ev =&gt; {
      document.getElementById('editor').value = ev.target.result;
      updateCount();
      addMsg('system', '📂 Arquivo &quot;' + file.name + '&quot; importado. IA já pode lê-lo.');
    };
    reader.readAsText(file);
  };
  input.click();
}

function saveFile() {
  const code = document.getElementById('editor').value;
  localStorage.setItem('pg_code_' + currentFile, code);
  localStorage.setItem('pg_lastfile', currentFile);
  addMsg('system', '💾 Salvo no navegador: &quot;' + currentFile + '&quot;');
}

function downloadFile() {
  const code = document.getElementById('editor').value;
  const blob = new Blob([code], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = currentFile;
  a.click();
  addMsg('system', '⬇️ Download iniciado: &quot;' + currentFile + '&quot;');
}

function togglePreview() {
  const panel = document.getElementById('preview-panel');
  previewOpen = !previewOpen;
  panel.style.display = previewOpen ? 'flex' : 'none';
  if (previewOpen) updatePreview();
}

function updatePreview() {
  const code = document.getElementById('editor').value;
  const frame = document.getElementById('preview-frame');
  frame.srcdoc = code;
}

// ============================================================
// FULLSCREEN
// ============================================================
function openFullscreen() {
  const code = document.getElementById('editor').value;
  document.getElementById('modal-editor').value = code;
  document.getElementById('modal').classList.add('open');
}

function closeFullscreen() {
  const code = document.getElementById('modal-editor').value;
  document.getElementById('editor').value = code;
  document.getElementById('modal').classList.remove('open');
  updateCount();
}

// ============================================================
// API KEY
// ============================================================
function openApiModal() {
  document.getElementById('apikey-input').value = apiKey;
  document.getElementById('api-provider').value = apiProvider;
  document.getElementById('apimodal').classList.add('open');
}

function closeApiModal() {
  document.getElementById('apimodal').classList.remove('open');
}

function saveApiKey() {
  apiKey = document.getElementById('apikey-input').value.trim();
  apiProvider = document.getElementById('api-provider').value;
  localStorage.setItem('pg_apikey', apiKey);
  localStorage.setItem('pg_provider', apiProvider);
  updateModelLabel();
  closeApiModal();
  addMsg('system', '✅ API Key salva. Pronto para usar.');
}

function updateModelLabel() {
  const p = document.getElementById('api-provider').value;
  document.getElementById('model-label').textContent = p === 'gemini' ? 'Gemini 1.5 Flash' : 'GPT-4o Mini';
}

// ============================================================
// CHAT
// ============================================================
function handleKey(e) {
  if (e.key === 'Enter' &amp;&amp; !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function addMsg(role, content, hasCode) {
  const container = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg msg-' + role;
  div.textContent = content;

  if (hasCode &amp;&amp; role === 'ai') {
    const btn = document.createElement('button');
    btn.className = 'apply-btn';
    btn.textContent = '✅ Aplicar este código no editor';
    btn.onclick = () =&gt; {
      document.getElementById('editor').value = hasCode;
      updateCount();
      addMsg('system', '✅ Código aplicado no editor.');
    };
    div.appendChild(btn);
  }

  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

function showLoading() {
  const container = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'loading';
  div.id = 'loading-indicator';
  div.innerHTML = '&lt;div class=&quot;dot&quot;&gt;&lt;/div&gt;&lt;div class=&quot;dot&quot;&gt;&lt;/div&gt;&lt;div class=&quot;dot&quot;&gt;&lt;/div&gt;';
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function hideLoading() {
  const el = document.getElementById('loading-indicator');
  if (el) el.remove();
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const userText = input.value.trim();
  if (!userText) return;

  if (!apiKey) {
    addMsg('system', '⚠️ Configure sua API Key primeiro. Clique em &quot;🔑 API Key&quot; no topo.');
    return;
  }

  input.value = '';
  document.getElementById('send-btn').disabled = true;
  addMsg('user', userText);

  const editorCode = document.getElementById('editor').value;
  const contextMsg = editorCode
    ? `[CÓDIGO ATUAL NO EDITOR - arquivo: ${currentFile}]\n\`\`\`\n${editorCode.substring(0, 8000)}\n\`\`\`\n\n[PEDIDO DO USUÁRIO]\n${userText}`
    : userText;

  showLoading();

  try {
    let reply = '';

    if (apiProvider === 'gemini') {
      reply = await callGemini(contextMsg);
    } else {
      reply = await callOpenAI(contextMsg);
    }

    hideLoading();

    // Detecta se tem bloco de código na resposta
    const codeMatch = reply.match(/```(?:html|js|javascript|tsx|jsx|css)?\n([\s\S]*?)```/);
    const extractedCode = codeMatch ? codeMatch[1] : null;

    addMsg('ai', reply, extractedCode);

  } catch (err) {
    hideLoading();
    addMsg('system', '❌ Erro: ' + err.message);
  }

  document.getElementById('send-btn').disabled = false;
}

// ============================================================
// GEMINI
// ============================================================
async function callGemini(userMsg) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
  const body = {
    system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
    contents: [{ role: 'user', parts: [{ text: userMsg }] }],
    generationConfig: { temperature: 0.3, maxOutputTokens: 4096 }
  };
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || 'Erro Gemini'); }
  const data = await res.json();
  return data.candidates?.[0]?.content?.parts?.[0]?.text || 'Sem resposta.';
}

// ============================================================
// OPENAI
// ============================================================
async function callOpenAI(userMsg) {
  const url = 'https://api.openai.com/v1/chat/completions';
  const body = {
    model: 'gpt-4o-mini',
    messages: [
      { role: 'system', content: SYSTEM_PROMPT },
      { role: 'user', content: userMsg }
    ],
    temperature: 0.3,
    max_tokens: 4096
  };
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey }, body: JSON.stringify(body) });
  if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || 'Erro OpenAI'); }
  const data = await res.json();
  return data.choices?.[0]?.message?.content || 'Sem resposta.';
}

// ============================================================
// INIT
// ============================================================
window.onload = () =&gt; {
  updateModelLabel();
  const saved = localStorage.getItem('pg_lastfile');
  if (saved) {
    const code = localStorage.getItem('pg_code_' + saved);
    if (code) {
      currentFile = saved;
      document.getElementById('filename-display').textContent = saved;
      document.getElementById('editor').value = code;
      updateCount();
    }
  }
  if (!apiKey) {
    setTimeout(() =&gt; addMsg('system', '👆 Configure sua API Key clicando em &quot;🔑 API Key&quot; no topo para começar.'), 500);
  }
};
&lt;/script&gt;

&lt;div id=&quot;workspace&quot;&gt;

  &lt;!-- EDITOR --&gt;
  &lt;div class=&quot;panel&quot; id=&quot;editor-panel&quot;&gt;
    &lt;div class=&quot;panel-header&quot;&gt;
      &lt;span&gt;📝 Editor&lt;/span&gt;
      &lt;span id=&quot;file-name&quot;&gt;sem_titulo.html&lt;/span&gt;
    &lt;/div&gt;
    &lt;textarea id=&quot;code-editor&quot; spellcheck=&quot;false&quot; placeholder=&quot;Cole ou importe seu código aqui...&quot; oninput=&quot;onEditorChange()&quot;&gt;&lt;/textarea&gt;
  &lt;/div&gt;

  &lt;!-- PREVIEW --&gt;
  &lt;div class=&quot;panel&quot; id=&quot;preview-panel&quot;&gt;
    &lt;div class=&quot;panel-header&quot;&gt;
      &lt;span&gt;👁 Preview&lt;/span&gt;
      &lt;span id=&quot;preview-status&quot;&gt;aguardando...&lt;/span&gt;
    &lt;/div&gt;
    &lt;div id=&quot;preview-empty&quot;&gt;
      &lt;span style=&quot;font-size:28px&quot;&gt;▶&lt;/span&gt;
      &lt;span&gt;Clique em &lt;strong&gt;Rodar&lt;/strong&gt; para ver o resultado&lt;/span&gt;
    &lt;/div&gt;
    &lt;iframe id=&quot;preview-frame&quot; style=&quot;display:none&quot;&gt;&lt;/iframe&gt;
  &lt;/div&gt;

  &lt;!-- CHAT --&gt;
  &lt;div class=&quot;panel&quot; id=&quot;chat-panel&quot;&gt;
    &lt;div class=&quot;panel-header&quot;&gt;
      &lt;span&gt;🤖 IA Integrada&lt;/span&gt;
      &lt;span id=&quot;model-tag&quot; style=&quot;color:#60a5fa&quot;&gt;Gemini Flash&lt;/span&gt;
    &lt;/div&gt;
    &lt;div id=&quot;chat-messages&quot;&gt;
      &lt;div class=&quot;msg msg-system&quot;&gt;IA lê o código do editor em tempo real. Peça qualquer alteração.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div id=&quot;chat-bottom&quot;&gt;
      &lt;textarea id=&quot;chat-input&quot; rows=&quot;2&quot; placeholder=&quot;O que precisa? (Enter = enviar)&quot; onkeydown=&quot;handleKey(event)&quot;&gt;&lt;/textarea&gt;
      &lt;button id=&quot;chat-send&quot; onclick=&quot;sendMsg()&quot;&gt;➤&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;

&lt;/div&gt;

&lt;!-- MODAL FULLSCREEN EDITOR --&gt;
&lt;div id=&quot;fs-modal&quot;&gt;
  &lt;div id=&quot;fs-modal-bar&quot;&gt;
    &lt;span style=&quot;color:#60a5fa;font-weight:700;font-size:13px&quot;&gt;⛶ Editor Ampliado&lt;/span&gt;
    &lt;button class=&quot;btn b-red&quot; onclick=&quot;closeFsEditor()&quot;&gt;✕ Fechar e Aplicar&lt;/button&gt;
  &lt;/div&gt;
  &lt;textarea id=&quot;fs-editor&quot; spellcheck=&quot;false&quot;&gt;&lt;/textarea&gt;
&lt;/div&gt;

&lt;!-- MODAL FULLSCREEN PREVIEW --&gt;
&lt;div id=&quot;fp-modal&quot;&gt;
  &lt;div id=&quot;fp-modal-bar&quot;&gt;
    &lt;span style=&quot;color:#60a5fa;font-weight:700;font-size:13px&quot;&gt;🔍 Preview Ampliado&lt;/span&gt;
    &lt;button class=&quot;btn b-red&quot; onclick=&quot;closeFsPreview()&quot;&gt;✕ Fechar&lt;/button&gt;
  &lt;/div&gt;
  &lt;iframe id=&quot;fp-frame&quot;&gt;&lt;/iframe&gt;
&lt;/div&gt;

&lt;!-- API MODAL --&gt;
&lt;div id=&quot;api-modal&quot;&gt;
  &lt;div id=&quot;api-box&quot;&gt;
    &lt;h2&gt;🔑 Configurar API&lt;/h2&gt;
    &lt;select class=&quot;api-select&quot; id=&quot;api-provider&quot; onchange=&quot;updateModelTag()&quot;&gt;
      &lt;option value=&quot;gemini&quot;&gt;Google Gemini (recomendado — gratuito)&lt;/option&gt;
      &lt;option value=&quot;openai&quot;&gt;OpenAI (GPT-4o Mini)&lt;/option&gt;
    &lt;/select&gt;
    &lt;input class=&quot;api-input&quot; id=&quot;api-key-input&quot; type=&quot;password&quot; placeholder=&quot;Cole sua API Key aqui...&quot;/&gt;
    &lt;div style=&quot;display:flex;gap:8px;margin-top:4px&quot;&gt;
      &lt;button class=&quot;btn b-green&quot; style=&quot;flex:1;padding:9px&quot; onclick=&quot;saveApiKey()&quot;&gt;✅ Salvar&lt;/button&gt;
      &lt;button class=&quot;btn b-gray&quot; style=&quot;flex:1;padding:9px&quot; onclick=&quot;closeApiModal()&quot;&gt;Cancelar&lt;/button&gt;
    &lt;/div&gt;
    &lt;p style=&quot;font-size:10px;color:#4b5563;margin-top:10px&quot;&gt;Chave salva só no seu navegador. Não vai para nenhum servidor.&lt;/p&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
// ─── ESTADO ───────────────────────────────────────────────
let apiKey      = localStorage.getItem('pg_key')      || '';
let apiProvider = localStorage.getItem('pg_provider') || 'gemini';
let fileName    = localStorage.getItem('pg_fname')    || 'sem_titulo.html';
let autoRun     = false;
let autoTimer   = null;
let previewRan  = false;

const SYSTEM = `Você é uma IA integrada a um playground de código. O usuário é Saulo, advogado, direto ao ponto.
REGRAS ABSOLUTAS:
1. NUNCA peça desculpas.
2. NUNCA use frases de empatia (&quot;parece que&quot;, &quot;eu entendo&quot;, &quot;sinto muito&quot;).
3. Vá DIRETO ao ponto. Só o que foi pedido.
4. Ao alterar código: retorne o arquivo COMPLETO atualizado entre triple backticks para permitir aplicação automática.
5. Seja cirúrgico. Indique o que mudou em uma linha antes do código.`;

// ─── EDITOR ───────────────────────────────────────────────
function onEditorChange() {
  updateCharCount();
  if (autoRun) {
    clearTimeout(autoTimer);
    autoTimer = setTimeout(runPreview, 900);
  }
  autoSave();
}

function updateCharCount() {
  // silencioso
}

function autoSave() {
  const code = document.getElementById('code-editor').value;
  localStorage.setItem('pg_code', code);
  localStorage.setItem('pg_fname', fileName);
  showStatus('salvo ✓');
}

function showStatus(msg) {
  const el = document.getElementById('save-status');
  el.textContent = msg;
  setTimeout(() =&gt; el.textContent = '', 2000);
}

// ─── PREVIEW ──────────────────────────────────────────────
function runPreview() {
  const code = document.getElementById('code-editor').value.trim();
  const empty = document.getElementById('preview-empty');
  const frame = document.getElementById('preview-frame');
  const status = document.getElementById('preview-status');

  if (!code) {
    empty.style.display = 'flex';
    frame.style.display = 'none';
    status.textContent = 'vazio';
    return;
  }

  empty.style.display = 'none';
  frame.style.display = 'block';
  frame.srcdoc = code;
  status.textContent = 'atualizado ✓';
  previewRan = true;
}

function toggleAutoRun() {
  autoRun = !autoRun;
  document.getElementById('auto-btn').textContent = '⚡ Auto: ' + (autoRun ? 'ON' : 'OFF');
  document.getElementById('auto-btn').style.background = autoRun ? '#15803d' : '';
  if (autoRun) runPreview();
}

// ─── ARQUIVOS ─────────────────────────────────────────────
function importFile() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.html,.htm,.js,.ts,.tsx,.jsx,.css,.txt,.json,.py';
  inp.onchange = e =&gt; {
    const f = e.target.files[0];
    if (!f) return;
    fileName = f.name;
    document.getElementById('file-name').textContent = f.name;
    const r = new FileReader();
    r.onload = ev =&gt; {
      document.getElementById('code-editor').value = ev.target.result;
      onEditorChange();
      addMsg('system', '📂 &quot;' + f.name + '&quot; importado. IA já pode lê-lo.');
    };
    r.readAsText(f);
  };
  inp.click();
}

function saveLocal() {
  autoSave();
  addMsg('system', '💾 Salvo no navegador.');
}

function downloadFile() {
  const code = document.getElementById('code-editor').value;
  const blob = new Blob([code], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fileName;
  a.click();
  showStatus('baixado ✓');
}

function copyCode() {
  navigator.clipboard.writeText(document.getElementById('code-editor').value);
  showStatus('copiado ✓');
}

function clearEditor() {
  if (!confirm('Limpar o editor?')) return;
  document.getElementById('code-editor').value = '';
  onEditorChange();
  runPreview();
}

// ─── FULLSCREEN EDITOR ────────────────────────────────────
function openFsEditor() {
  document.getElementById('fs-editor').value = document.getElementById('code-editor').value;
  document.getElementById('fs-modal').classList.add('open');
}
function closeFsEditor() {
  document.getElementById('code-editor').value = document.getElementById('fs-editor').value;
  document.getElementById('fs-modal').classList.remove('open');
  onEditorChange();
}

// ─── FULLSCREEN PREVIEW ───────────────────────────────────
function openFsPreview() {
  const code = document.getElementById('code-editor').value;
  document.getElementById('fp-frame').srcdoc = code;
  document.getElementById('fp-modal').classList.add('open');
}
function closeFsPreview() {
  document.getElementById('fp-modal').classList.remove('open');
}

// ─── API MODAL ────────────────────────────────────────────
function openApiModal() {
  document.getElementById('api-key-input').value = apiKey;
  document.getElementById('api-provider').value = apiProvider;
  document.getElementById('api-modal').classList.add('open');
}
function closeApiModal() {
  document.getElementById('api-modal').classList.remove('open');
}
function saveApiKey() {
  apiKey = document.getElementById('api-key-input').value.trim();
  apiProvider = document.getElementById('api-provider').value;
  localStorage.setItem('pg_key', apiKey);
  localStorage.setItem('pg_provider', apiProvider);
  updateModelTag();
  closeApiModal();
  addMsg('system', '✅ API Key salva. Pronto.');
}
function updateModelTag() {
  const p = document.getElementById('api-provider')?.value || apiProvider;
  document.getElementById('model-tag').textContent = p === 'gemini' ? 'Gemini Flash' : 'GPT-4o Mini';
}

// ─── CHAT ─────────────────────────────────────────────────
function handleKey(e) {
  if (e.key === 'Enter' &amp;&amp; !e.shiftKey) { e.preventDefault(); sendMsg(); }
}

function addMsg(role, text, codeToApply) {
  const box = document.getElementById('chat-messages');
  const d = document.createElement('div');
  d.className = 'msg msg-' + role;
  d.textContent = text;

  if (codeToApply) {
    const btn = document.createElement('button');
    btn.className = 'apply-btn';
    btn.textContent = '✅ Aplicar código no editor';
    btn.onclick = () =&gt; {
      document.getElementById('code-editor').value = codeToApply;
      onEditorChange();
      runPreview();
      addMsg('system', '✅ Código aplicado. Preview atualizado.');
    };
    d.appendChild(btn);
  }

  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function showLoading() {
  const box = document.getElementById('chat-messages');
  const d = document.createElement('div');
  d.id = 'loading-dots';
  d.className = 'dots';
  d.innerHTML = '&lt;div class=&quot;dot&quot;&gt;&lt;/div&gt;&lt;div class=&quot;dot&quot;&gt;&lt;/div&gt;&lt;div class=&quot;dot&quot;&gt;&lt;/div&gt;';
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}
function hideLoading() {
  const el = document.getElementById('loading-dots');
  if (el) el.remove();
}

async function sendMsg() {
  const inp = document.getElementById('chat-input');
  const text = inp.value.trim();
  if (!text) return;

  if (!apiKey) {
    addMsg('system', '⚠️ Configure a API Key primeiro. Clique em &quot;🔑 API Key&quot;.');
    return;
  }

  inp.value = '';
  document.getElementById('chat-send').disabled = true;
  addMsg('user', text);

  const code = document.getElementById('code-editor').value;
  const fullMsg = code
    ? `[CÓDIGO ATUAL NO EDITOR — arquivo: ${fileName}]\n\`\`\`\n${code.substring(0, 10000)}\n\`\`\`\n\n[PEDIDO]\n${text}`
    : text;

  showLoading();

  try {
    const reply = apiProvider === 'gemini'
      ? await callGemini(fullMsg)
      : await callOpenAI(fullMsg);

    hideLoading();

    // Extrai código completo se vier entre backticks
    const match = reply.match(/```(?:html|js|javascript|css|jsx|tsx|python)?\n([\s\S]*?)```/);
    const extracted = match ? match[1].trim() : null;

    addMsg('ai', reply, extracted);

  } catch(err) {
    hideLoading();
    addMsg('system', '❌ ' + err.message);
  }

  document.getElementById('chat-send').disabled = false;
}

// ─── GEMINI ───────────────────────────────────────────────
async function callGemini(msg) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
  const body = {
    system_instruction: { parts:[{ text: SYSTEM }] },
    contents: [{ role:'user', parts:[{ text: msg }] }],
    generationConfig: { temperature:0.2, maxOutputTokens:8192 }
  };
  const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  if (!r.ok) { const e = await r.json(); throw new Error(e.error?.message || 'Erro Gemini'); }
  const d = await r.json();
  return d.candidates?.[0]?.content?.parts?.[0]?.text || 'Sem resposta.';
}

// ─── OPENAI ───────────────────────────────────────────────
async function callOpenAI(msg) {
  const r = await fetch('https://api.openai.com/v1/chat/completions', {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
    body: JSON.stringify({
      model:'gpt-4o-mini',
      messages:[{role:'system',content:SYSTEM},{role:'user',content:msg}],
      temperature:0.2, max_tokens:8192
    })
  });
  if (!r.ok) { const e = await r.json(); throw new Error(e.error?.message || 'Erro OpenAI'); }
  const d = await r.json();
  return d.choices?.[0]?.message?.content || 'Sem resposta.';
}

// ─── INIT ─────────────────────────────────────────────────
window.onload = () =&gt; {
  updateModelTag();

  // Restaura último código salvo
  const saved = localStorage.getItem('pg_code');
  const savedName = localStorage.getItem('pg_fname');
  if (saved) {
    document.getElementById('code-editor').value = saved;
    if (savedName) {
      fileName = savedName;
      document.getElementById('file-name').textContent = savedName;
    }
    updateCharCount();
    // Roda preview automaticamente se tinha código
    runPreview();
  }

  if (!apiKey) {
    setTimeout(() =&gt; addMsg('system', '👆 Configure a API Key clicando em &quot;🔑 API Key&quot; para ativar a IA.'), 600);
  }
};
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>
</div>


<script>
function trocarProjeto(index) {
  // Esconde todos
  document.querySelectorAll('.project-container').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  
  // Mostra o selecionado
  document.getElementById('projeto' + index).classList.add('active');
  document.querySelectorAll('.nav-btn')[index].classList.add('active');
  
  // Salva preferência
  localStorage.setItem('ultimo-projeto', index);
}

// Restaura último projeto aberto
window.onload = function() {
  const ultimo = localStorage.getItem('ultimo-projeto');
  if (ultimo !== null) trocarProjeto(parseInt(ultimo));
};
</script>
</body>
</html>
