<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartao de Perfil</title>
  <style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; background:#0f172a; }
.profile-card { background:#1e293b; border-radius:16px; padding:2rem; text-align:center; color:#e2e8f0; width:320px; box-shadow:0 25px 50px rgba(0,0,0,0.3); }
.avatar { width:80px; height:80px; border-radius:50%; background:linear-gradient(135deg,#6366f1,#8b5cf6); display:flex; align-items:center; justify-content:center; margin:0 auto 1rem; font-size:1.5rem; font-weight:700; }
h2 { font-size:1.3rem; margin-bottom:0.3rem; }
.role { color:#94a3b8; font-size:0.9rem; margin-bottom:1.5rem; }
.stats { display:flex; justify-content:space-around; margin-bottom:1.5rem; }
.stats div { display:flex; flex-direction:column; }
.stats strong { font-size:1.2rem; }
.stats span { font-size:0.75rem; color:#94a3b8; }
button { width:100%; padding:0.6rem; background:#6366f1; color:#fff; border:none; border-radius:8px; font-size:0.95rem; cursor:pointer; transition:background 0.2s; }
button:hover { background:#4f46e5; }
  </style>
</head>
<body>
<div class="profile-card">
  <div class="avatar">JD</div>
  <h2>Joao da Silva</h2>
  <p class="role">Desenvolvedor Frontend</p>
  <div class="stats">
    <div><strong>142</strong><span>Projetos</span></div>
    <div><strong>1.2k</strong><span>Seguidores</span></div>
    <div><strong>89</strong><span>Repos</span></div>
  </div>
  <button onclick="this.textContent='Seguindo!'">Seguir</button>
</div>
<script>
console.log("Cartao de perfil carregado!");
</script>
</body>
</html>
