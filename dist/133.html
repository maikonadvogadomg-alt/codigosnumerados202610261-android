    &lt;/style&gt;

&lt;body&gt;
    &lt;div class=&quot;container&quot;&gt;
        &lt;h1&gt;🧹 Limpador de Vínculos Replit&lt;/h1&gt;
        
        &lt;div class=&quot;upload-area&quot;&gt;
            &lt;h2 style=&quot;color: #888; margin-bottom: 20px;&quot;&gt;
                📦 Faça upload do seu projeto ZIP
            &lt;/h2&gt;
            &lt;label for=&quot;fileInput&quot; class=&quot;btn&quot;&gt;
                📁 Escolher ZIP
            &lt;/label&gt;
            &lt;input type=&quot;file&quot; id=&quot;fileInput&quot; accept=&quot;.zip&quot; onchange=&quot;processarZip(event)&quot;&gt;
        &lt;/div&gt;

        &lt;div class=&quot;stats&quot; id=&quot;stats&quot; style=&quot;display: none;&quot;&gt;
            &lt;div class=&quot;stat-card&quot;&gt;
                &lt;div class=&quot;stat-number&quot; id=&quot;totalArquivos&quot;&gt;0&lt;/div&gt;
                &lt;div class=&quot;stat-label&quot;&gt;Arquivos&lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;stat-card&quot;&gt;
                &lt;div class=&quot;stat-number&quot; id=&quot;vinculosEncontrados&quot;&gt;0&lt;/div&gt;
                &lt;div class=&quot;stat-label&quot;&gt;Vínculos Replit&lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;stat-card&quot;&gt;
                &lt;div class=&quot;stat-number&quot; id=&quot;vinculosRemovidos&quot;&gt;0&lt;/div&gt;
                &lt;div class=&quot;stat-label&quot;&gt;Removidos&lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;stat-card&quot;&gt;
                &lt;div class=&quot;stat-number&quot; id=&quot;endpointsCorrigidos&quot;&gt;0&lt;/div&gt;
                &lt;div class=&quot;stat-label&quot;&gt;Endpoints Corrigidos&lt;/div&gt;
            &lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;log&quot; id=&quot;log&quot; style=&quot;display: none;&quot;&gt;&lt;/div&gt;

        &lt;div style=&quot;text-align: center;&quot;&gt;
            &lt;button class=&quot;btn&quot; id=&quot;btnBaixar&quot; style=&quot;display: none;&quot; onclick=&quot;baixarZipLimpo()&quot;&gt;
                📦 Baixar ZIP Limpo
            &lt;/button&gt;
        &lt;/div&gt;
    &lt;/div&gt;

    &lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js&quot;&gt;&lt;/script&gt;
    &lt;script&gt;
        let arquivosLimpos = {};
        let estatisticas = {
            totalArquivos: 0,
            vinculosEncontrados: 0,
            vinculosRemovidos: 0,
            endpointsCorrigidos: 0
        };

        // ========================================
        // PADRÕES PARA DETECTAR E REMOVER
        // ========================================
        const padroes = {
            // URLs Replit
            urlsReplit: [
                /https?:\/\/[^\/]*replit\.com[^\s\&quot;\'\)&gt;]*/gi,
                /https?:\/\/[^\/]*repl\.co[^\s\&quot;\'\)&gt;]*/gi,
                /https?:\/\/[^\/]*replitusercontent\.com[^\s\&quot;\'\)&gt;]*/gi,
            ],

            // Imports Replit
            importsReplit: [
                /import\s+.*from\s+['&quot;]@replit\/[^'&quot;]+['&quot;]/gi,
                /require\s*\(\s*['&quot;]@replit\/[^'&quot;]+['&quot;]\s*\)/gi,
            ],

            // Endpoints API
            endpointsAPI: [
                /fetch\s*\(\s*['&quot;]\/api\/[^'&quot;]+['&quot;]/gi,
                /axios\.[a-z]+\s*\(\s*['&quot;]\/api\/[^'&quot;]+['&quot;]/gi,
            ],

            // Comentários com TODO/FIXME
            comentarios: [
                /\/\/\s*TODO:.*$/gmi,
                /\/\/\s*FIXME:.*$/gmi,
                /\/\*\s*TODO:[\s\S]*?\*\//gi,
            ],

            // Console.log desnecessários
            consoleLogs: [
                /console\.log\([^)]*replit[^)]*\);?/gi,
            ]
        };

        // ========================================
        // PROCESSAR ZIP
        // ========================================
        async function processarZip(event) {
            const file = event.target.files[0];
            if (!file) return;

            mostrarLog();
            log('🚀 Iniciando limpeza...', 'info');
            log('');

            const zip = new JSZip();
            const conteudo = await zip.loadAsync(file);

            arquivosLimpos = {};
            estatisticas = {
                totalArquivos: 0,
                vinculosEncontrados: 0,
                vinculosRemovidos: 0,
                endpointsCorrigidos: 0
            };

            for (const [caminho, arquivo] of Object.entries(conteudo.files)) {
                if (arquivo.dir) continue;

                estatisticas.totalArquivos++;
                
                // Ignora node_modules, .git, etc
                if (caminho.includes('node_modules/') || 
                    caminho.includes('.git/') ||
                    caminho.startsWith('.')) {
                    continue;
                }

                const conteudoOriginal = await arquivo.async('text');
                const conteudoLimpo = limparArquivo(caminho, conteudoOriginal);
                
                arquivosLimpos[caminho] = conteudoLimpo;
            }

            log('');
            log('✅ Limpeza concluída!', 'success');
            log('');
            log(`📊 Estatísticas:`, 'info');
            log(`   • Arquivos processados: ${estatisticas.totalArquivos}`);
            log(`   • Vínculos encontrados: ${estatisticas.vinculosEncontrados}`);
            log(`   • Vínculos removidos: ${estatisticas.vinculosRemovidos}`);
            log(`   • Endpoints corrigidos: ${estatisticas.endpointsCorrigidos}`);

            atualizarEstatisticas();
            document.getElementById('btnBaixar').style.display = 'inline-block';
        }

        // ========================================
        // LIMPAR ARQUIVO
        // ========================================
        function limparArquivo(caminho, conteudo) {
            let conteudoLimpo = conteudo;
            let mudancas = 0;

            log(`🔍 Analisando: ${caminho}`, 'info');

            // 1. Remover URLs Replit
            padroes.urlsReplit.forEach(padrao =&gt; {
                const matches = conteudo.match(padrao);
                if (matches) {
                    matches.forEach(match =&gt; {
                        log(`   ❌ Removendo URL: ${match}`, 'warning');
                        conteudoLimpo = conteudoLimpo.replace(match, '');
                        mudancas++;
                        estatisticas.vinculosEncontrados++;
                        estatisticas.vinculosRemovidos++;
                    });
                }
            });

            // 2. Remover Imports Replit
            padroes.importsReplit.forEach(padrao =&gt; {
                const matches = conteudo.match(padrao);
                if (matches) {
                    matches.forEach(match =&gt; {
                        log(`   ❌ Removendo import: ${match}`, 'warning');
                        conteudoLimpo = conteudoLimpo.replace(match, '// Import removido');
                        mudancas++;
                        estatisticas.vinculosEncontrados++;
                        estatisticas.vinculosRemovidos++;
                    });
                }
            });

            // 3. Corrigir Endpoints API
            padroes.endpointsAPI.forEach(padrao =&gt; {
                const matches = conteudo.match(padrao);
                if (matches) {
                    matches.forEach(match =&gt; {
                        log(`   🔧 Corrigindo endpoint: ${match}`, 'warning');
                        // Comentar o fetch
                        conteudoLimpo = conteudoLimpo.replace(
                            match, 
                            `// ${match} // ⚠️ Endpoint removido - configure seu backend`
                        );
                        mudancas++;
                        estatisticas.endpointsCorrigidos++;
                    });
                }
            });

            // 4. Remover comentários TODO/FIXME
            padroes.comentarios.forEach(padrao =&gt; {
                conteudoLimpo = conteudoLimpo.replace(padrao, '');
            });

            // 5. Remover console.log com &quot;replit&quot;
            padroes.consoleLogs.forEach(padrao =&gt; {
                conteudoLimpo = conteudoLimpo.replace(padrao, '');
            });

            if (mudancas &gt; 0) {
                log(`   ✅ ${mudancas} alterações feitas`, 'success');
            } else {
                log(`   ✓ Arquivo limpo`, 'success');
            }

            return conteudoLimpo;
        }

        // ========================================
        // BAIXAR ZIP LIMPO
        // ========================================
        async function baixarZipLimpo() {
            log('');
            log('📦 Gerando ZIP limpo...', 'info');

            const zip = new JSZip();

            Object.entries(arquivosLimpos).forEach(([caminho, conteudo]) =&gt; {
                zip.file(caminho, conteudo);
            });

            // Adicionar README com instruções
            const readme = `# Projeto Limpo

✅ Este projeto foi limpo de vínculos com Replit.

## Alterações feitas:
- ${estatisticas.vinculosRemovidos} vínculos Replit removidos
- ${estatisticas.endpointsCorrigidos} endpoints comentados

## ⚠️ Próximos passos:
1. Revise os arquivos marcados com &quot;⚠️&quot;
2. Configure seu próprio backend se necessário
3. Teste o projeto localmente
4. Publique no GitHub Pages ou Netlify

---
Limpo por: Limpador de Replit
Data: ${new Date().toLocaleString('pt-BR')}
`;

            zip.file('README-LIMPEZA.md', readme);

            const blob = await zip.generateAsync({ type: 'blob' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'projeto-limpo.zip';
            a.click();

            log('✅ ZIP baixado com sucesso!', 'success');
        }

        // ========================================
        // FUNÇÕES AUXILIARES
        // ========================================
        function log(texto, tipo = '') {
            const logDiv = document.getElementById('log');
            const linha = document.createElement('div');
            linha.className = `log-line ${tipo}`;
            linha.textContent = texto;
            logDiv.appendChild(linha);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function mostrarLog() {
            document.getElementById('stats').style.display = 'grid';
            document.getElementById('log').style.display = 'block';
        }

        function atualizarEstatisticas() {
            document.getElementById('totalArquivos').textContent = estatisticas.totalArquivos;
            document.getElementById('vinculosEncontrados').textContent = estatisticas.vinculosEncontrados;
            document.getElementById('vinculosRemovidos').textContent = estatisticas.vinculosRemovidos;
            document.getElementById('endpointsCorrigidos').textContent = estatisticas.endpointsCorrigidos;
        }
    &lt;/script&gt;
&lt;/body&gt;

        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #1e3a5f;
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
    &lt;div class=&quot;container&quot;&gt;
        &lt;h1&gt;🔍 Comparador de Projetos&lt;/h1&gt;
        &lt;p class=&quot;subtitulo&quot;&gt;Compare 2 ou mais projetos · Detecte diferenças · Veja o que funciona em cada um · Gere relatório completo&lt;/p&gt;

        &lt;div class=&quot;grid&quot;&gt;
            &lt;!-- PROJETO 1 --&gt;
            &lt;div class=&quot;card&quot;&gt;
                &lt;h2&gt;📦 Projeto 1 (Original)&lt;/h2&gt;
                &lt;div class=&quot;upload-area&quot; id=&quot;upload1&quot; onclick=&quot;document.getElementById('file1').click()&quot;&gt;
                    &lt;div style=&quot;font-size: 48px; margin-bottom: 12px;&quot;&gt;📁&lt;/div&gt;
                    &lt;div style=&quot;color: #38bdf8; font-weight: bold; margin-bottom: 8px;&quot;&gt;Clique ou arraste o projeto aqui&lt;/div&gt;
                    &lt;div style=&quot;color: #64748b; font-size: 12px;&quot;&gt;ZIP, HTML, JS, JSON ou pasta completa&lt;/div&gt;
                &lt;/div&gt;
                &lt;input type=&quot;file&quot; id=&quot;file1&quot; accept=&quot;.zip,.html,.js,.json,.txt&quot; onchange=&quot;carregarProjeto(1, event)&quot;&gt;
                &lt;div id=&quot;info1&quot; class=&quot;projeto-info&quot; style=&quot;display: none;&quot;&gt;&lt;/div&gt;
            &lt;/div&gt;

            &lt;!-- PROJETO 2 --&gt;
            &lt;div class=&quot;card&quot;&gt;
                &lt;h2&gt;📦 Projeto 2 (Novo/Atualizado)&lt;/h2&gt;
                &lt;div class=&quot;upload-area&quot; id=&quot;upload2&quot; onclick=&quot;document.getElementById('file2').click()&quot;&gt;
                    &lt;div style=&quot;font-size: 48px; margin-bottom: 12px;&quot;&gt;📁&lt;/div&gt;
                    &lt;div style=&quot;color: #38bdf8; font-weight: bold; margin-bottom: 8px;&quot;&gt;Clique ou arraste o projeto aqui&lt;/div&gt;
                    &lt;div style=&quot;color: #64748b; font-size: 12px;&quot;&gt;ZIP, HTML, JS, JSON ou pasta completa&lt;/div&gt;
                &lt;/div&gt;
                &lt;input type=&quot;file&quot; id=&quot;file2&quot; accept=&quot;.zip,.html,.js,.json,.txt&quot; onchange=&quot;carregarProjeto(2, event)&quot;&gt;
                &lt;div id=&quot;info2&quot; class=&quot;projeto-info&quot; style=&quot;display: none;&quot;&gt;&lt;/div&gt;
            &lt;/div&gt;
        &lt;/div&gt;

        &lt;!-- AÇÕES --&gt;
        &lt;div class=&quot;card&quot;&gt;
            &lt;h2&gt;⚡ Ações&lt;/h2&gt;
            &lt;button class=&quot;btn btn-verde&quot; onclick=&quot;compararProjetos()&quot; id=&quot;btnComparar&quot; disabled&gt;
                🔍 Comparar Projetos
            &lt;/button&gt;
            &lt;button class=&quot;btn btn-roxo&quot; onclick=&quot;gerarRelatorio()&quot; id=&quot;btnRelatorio&quot; disabled&gt;
                📄 Gerar Relatório Completo
            &lt;/button&gt;
            &lt;button class=&quot;btn btn-vermelho&quot; onclick=&quot;limparTudo()&quot;&gt;
                🗑️ Limpar Tudo
            &lt;/button&gt;
        &lt;/div&gt;

        &lt;!-- RESULTADO --&gt;
        &lt;div class=&quot;resultado&quot; id=&quot;resultado&quot; style=&quot;display: none;&quot;&gt;
            &lt;h2&gt;📊 Resultado da Comparação&lt;/h2&gt;
            
            &lt;div class=&quot;stats&quot; id=&quot;stats&quot;&gt;&lt;/div&gt;

            &lt;div class=&quot;tabs&quot;&gt;
                &lt;div class=&quot;tab ativo&quot; onclick=&quot;mudarTab('resumo')&quot;&gt;📋 Resumo&lt;/div&gt;
                &lt;div class=&quot;tab&quot; onclick=&quot;mudarTab('arquivos')&quot;&gt;📁 Arquivos&lt;/div&gt;
                &lt;div class=&quot;tab&quot; onclick=&quot;mudarTab('codigo')&quot;&gt;💻 Código&lt;/div&gt;
                &lt;div class=&quot;tab&quot; onclick=&quot;mudarTab('dependencias')&quot;&gt;📦 Dependências&lt;/div&gt;
                &lt;div class=&quot;tab&quot; onclick=&quot;mudarTab('sugestoes')&quot;&gt;💡 Sugestões&lt;/div&gt;
            &lt;/div&gt;

            &lt;div class=&quot;tab-content ativo&quot; id=&quot;tab-resumo&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;tab-content&quot; id=&quot;tab-arquivos&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;tab-content&quot; id=&quot;tab-codigo&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;tab-content&quot; id=&quot;tab-dependencias&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;tab-content&quot; id=&quot;tab-sugestoes&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
    &lt;/div&gt;

    &lt;script&gt;
        // =====================
        // ESTADO GLOBAL
        // =====================
        let projetos = {
            1: null,
            2: null
        };

        let comparacao = null;

        // =====================
        // DRAG &amp; DROP
        // =====================
        ['upload1', 'upload2'].forEach((id, idx) =&gt; {
            const el = document.getElementById(id);
            
            el.addEventListener('dragover', (e) =&gt; {
                e.preventDefault();
                el.classList.add('dragover');
            });

            el.addEventListener('dragleave', () =&gt; {
                el.classList.remove('dragover');
            });

            el.addEventListener('drop', (e) =&gt; {
                e.preventDefault();
                el.classList.remove('dragover');
                const file = e.dataTransfer.files[0];
                if (file) {
                    document.getElementById(`file${idx + 1}`).files = e.dataTransfer.files;
                    carregarProjeto(idx + 1, { target: { files: [file] } });
                }
            });
        });

        // =====================
        // CARREGAR PROJETO
        // =====================
        async function carregarProjeto(num, event) {
            const file = event.target.files[0];
            if (!file) return;

            const ext = file.name.split('.').pop().toLowerCase();
            let projeto = {
                nome: file.name,
                tamanho: file.size,
                arquivos: {},
                tipo: ext
            };

            if (ext === 'zip') {
                projeto = await carregarZIP(file, projeto);
            } else {
                const conteudo = await file.text();
                projeto.arquivos[file.name] = {
                    nome: file.name,
                    conteudo: conteudo,
                    tamanho: file.size,
                    tipo: ext
                };
            }

            projetos[num] = projeto;
            mostrarInfo(num, projeto);
            verificarBotaoComparar();
        }

        async function carregarZIP(file, projeto) {
            const zip = await JSZip.loadAsync(file);
            const arquivos = {};

            for (const [caminho, entrada] of Object.entries(zip.files)) {
                if (!entrada.dir) {
                    const ext = caminho.split('.').pop().toLowerCase();
                    const legivel = ['js','ts','tsx','jsx','html','htm','css','json','txt','md','xml'].includes(ext);
                    
                    if (legivel) {
                        try {
                            const conteudo = await entrada.async('text');
                            arquivos[caminho] = {
                                nome: caminho,
                                conteudo: conteudo,
                                tamanho: conteudo.length,
                                tipo: ext
                            };
                        } catch(e) {}
                    }
                }
            }

            projeto.arquivos = arquivos;
            return projeto;
        }

        function mostrarInfo(num, projeto) {
            const el = document.getElementById(`info${num}`);
            const totalArquivos = Object.keys(projeto.arquivos).length;
            const tamanhoTotal = Object.values(projeto.arquivos).reduce((sum, arq) =&gt; sum + arq.tamanho, 0);

            el.style.display = 'block';
            el.innerHTML = `
                &lt;div&gt;&lt;span class=&quot;label&quot;&gt;Nome:&lt;/span&gt; &lt;span class=&quot;valor&quot;&gt;${projeto.nome}&lt;/span&gt;&lt;/div&gt;
                &lt;div&gt;&lt;span class=&quot;label&quot;&gt;Arquivos:&lt;/span&gt; &lt;span class=&quot;valor&quot;&gt;${totalArquivos}&lt;/span&gt;&lt;/div&gt;
                &lt;div&gt;&lt;span class=&quot;label&quot;&gt;Tamanho:&lt;/span&gt; &lt;span class=&quot;valor&quot;&gt;${(tamanhoTotal / 1024).toFixed(1)} KB&lt;/span&gt;&lt;/div&gt;
                &lt;div&gt;&lt;span class=&quot;label&quot;&gt;Status:&lt;/span&gt; &lt;span class=&quot;valor&quot;&gt;✅ Carregado&lt;/span&gt;&lt;/div&gt;
            `;
        }

        function verificarBotaoComparar() {
            const btn = document.getElementById('btnComparar');
            btn.disabled = !(projetos[1] &amp;&amp; projetos[2]);
        }

        // =====================
        // COMPARAR PROJETOS
        // =====================
        function compararProjetos() {
            if (!projetos[1] || !projetos[2]) {
                alert('Carregue os 2 projetos primeiro!');
                return;
            }

            document.getElementById('resultado').style.display = 'block';
            document.getElementById('tab-resumo').innerHTML = '&lt;div class=&quot;loading&quot;&gt;&lt;div class=&quot;spinner&quot;&gt;&lt;/div&gt;&lt;div style=&quot;margin-top:16px;&quot;&gt;Comparando projetos...&lt;/div&gt;&lt;/div&gt;';

            setTimeout(() =&gt; {
                comparacao = realizarComparacao();
                mostrarResultado();
                document.getElementById('btnRelatorio').disabled = false;
            }, 500);
        }

        function realizarComparacao() {
            const arq1 = projetos[1].arquivos;
            const arq2 = projetos[2].arquivos;

            const nomes1 = new Set(Object.keys(arq1));
            const nomes2 = new Set(Object.keys(arq2));

            const novos = [];
            const deletados = [];
            const modificados = [];
            const iguais = [];

            // Arquivos novos (só no projeto 2)
            for (const nome of nomes2) {
                if (!nomes1.has(nome)) {
                    novos.push({
                        nome,
                        arquivo: arq2[nome]
                    });
                }
            }

            // Arquivos deletados (só no projeto 1)
            for (const nome of nomes1) {
                if (!nomes2.has(nome)) {
                    deletados.push({
                        nome,
                        arquivo: arq1[nome]
                    });
                }
            }

            // Arquivos em ambos (comparar conteúdo)
            for (const nome of nomes1) {
                if (nomes2.has(nome)) {
                    const diff = compararArquivos(arq1[nome], arq2[nome]);
                    if (diff.modificado) {
                        modificados.push({
                            nome,
                            arquivo1: arq1[nome],
                            arquivo2: arq2[nome],
                            diff
                        });
                    } else {
                        iguais.push({
                            nome,
                            arquivo: arq1[nome]
                        });
                    }
                }
            }

            return {
                novos,
                deletados,
                modificados,
                iguais,
                total: nomes1.size + nomes2.size - iguais.length
            };
        }

        function compararArquivos(arq1, arq2) {
            const linhas1 = arq1.conteudo.split('\n');
            const linhas2 = arq2.conteudo.split('\n');

            if (arq1.conteudo === arq2.conteudo) {
                return { modificado: false };
            }

            const diff = [];
            const maxLen = Math.max(linhas1.length, linhas2.length);

            for (let i = 0; i &lt; maxLen; i++) {
                const l1 = linhas1[i];
                const l2 = linhas2[i];

                if (l1 === undefined) {
                    diff.push({ tipo: 'add', linha: i + 1, conteudo: l2 });
                } else if (l2 === undefined) {
                    diff.push({ tipo: 'remove', linha: i + 1, conteudo: l1 });
                } else if (l1 !== l2) {
                    diff.push({ tipo: 'modify', linha: i + 1, antes: l1, depois: l2 });
                } else {
                    diff.push({ tipo: 'igual', linha: i + 1, conteudo: l1 });
                }
            }

            return {
                modificado: true,
                diff,
                linhasAdicionadas: diff.filter(d =&gt; d.tipo === 'add').length,
                linhasRemovidas: diff.filter(d =&gt; d.tipo === 'remove').length,
                linhasModificadas: diff.filter(d =&gt; d.tipo === 'modify').length
            };
        }

        // =====================
        // MOSTRAR RESULTADO
        // =====================
        function mostrarResultado() {
            // STATS
            document.getElementById('stats').innerHTML = `
                &lt;div class=&quot;stat-card&quot;&gt;
                    &lt;div class=&quot;stat-numero&quot; style=&quot;color: #4ade80;&quot;&gt;${comparacao.novos.length}&lt;/div&gt;
                    &lt;div class=&quot;stat-label&quot;&gt;Novos&lt;/div&gt;
                &lt;/div&gt;
                &lt;div class=&quot;stat-card&quot;&gt;
                    &lt;div class=&quot;stat-numero&quot; style=&quot;color: #fbbf24;&quot;&gt;${comparacao.modificados.length}&lt;/div&gt;
                    &lt;div class=&quot;stat-label&quot;&gt;Modificados&lt;/div&gt;
                &lt;/div&gt;
                &lt;div class=&quot;stat-card&quot;&gt;
                    &lt;div class=&quot;stat-numero&quot; style=&quot;color: #f87171;&quot;&gt;${comparacao.deletados.length}&lt;/div&gt;
                    &lt;div class=&quot;stat-label&quot;&gt;Deletados&lt;/div&gt;
                &lt;/div&gt;
                &lt;div class=&quot;stat-card&quot;&gt;
                    &lt;div class=&quot;stat-numero&quot; style=&quot;color: #64748b;&quot;&gt;${comparacao.iguais.length}&lt;/div&gt;
                    &lt;div class=&quot;stat-label&quot;&gt;Iguais&lt;/div&gt;
                &lt;/div&gt;
            `;

            // RESUMO
            mostrarResumo();

            // ARQUIVOS
            mostrarArquivos();

            // SUGESTÕES
            gerarSugestoes();
        }

        function mostrarResumo() {
            let html = '&lt;div class=&quot;diff-container&quot;&gt;';
            
            html += `&lt;div style=&quot;color: #38bdf8; font-weight: bold; font-size: 16px; margin-bottom: 16px;&quot;&gt;📊 RESUMO DA COMPARAÇÃO&lt;/div&gt;`;
            
            html += `&lt;div style=&quot;margin-bottom: 20px;&quot;&gt;`;
            html += `&lt;div style=&quot;color: #94a3b8; margin-bottom: 8px;&quot;&gt;PROJETO 1: ${projetos[1].nome}&lt;/div&gt;`;
            html += `&lt;div style=&quot;color: #94a3b8;&quot;&gt;PROJETO 2: ${projetos[2].nome}&lt;/div&gt;`;
            html += `&lt;/div&gt;`;

            if (comparacao.novos.length &gt; 0) {
                html += `&lt;div style=&quot;color: #4ade80; font-weight: bold; margin-top: 16px;&quot;&gt;✅ ARQUIVOS NOVOS (${comparacao.novos.length}):&lt;/div&gt;`;
                comparacao.novos.slice(0, 10).forEach(item =&gt; {
                    html += `&lt;div class=&quot;diff-linha diff-add&quot;&gt;+ ${item.nome}&lt;/div&gt;`;
                });
                if (comparacao.novos.length &gt; 10) {
                    html += `&lt;div style=&quot;color: #64748b; margin: 8px 0;&quot;&gt;... e mais ${comparacao.novos.length - 10} arquivos&lt;/div&gt;`;
                }
            }

            if (comparacao.modificados.length &gt; 0) {
                html += `&lt;div style=&quot;color: #fbbf24; font-weight: bold; margin-top: 16px;&quot;&gt;⚠️ ARQUIVOS MODIFICADOS (${comparacao.modificados.length}):&lt;/div&gt;`;
                comparacao.modificados.slice(0, 10).forEach(item =&gt; {
                    html += `&lt;div class=&quot;diff-linha diff-modify&quot;&gt;~ ${item.nome}&lt;/div&gt;`;
                });
                if (comparacao.modificados.length &gt; 10) {
                    html += `&lt;div style=&quot;color: #64748b; margin: 8px 0;&quot;&gt;... e mais ${comparacao.modificados.length - 10} arquivos&lt;/div&gt;`;
                }
            }

            if (comparacao.deletados.length &gt; 0) {
                html += `&lt;div style=&quot;color: #f87171; font-weight: bold; margin-top: 16px;&quot;&gt;❌ ARQUIVOS DELETADOS (${comparacao.deletados.length}):&lt;/div&gt;`;
                comparacao.deletados.slice(0, 10).forEach(item =&gt; {
                    html += `&lt;div class=&quot;diff-linha diff-remove&quot;&gt;- ${item.nome}&lt;/div&gt;`;
                });
                if (comparacao.deletados.length &gt; 10) {
                    html += `&lt;div style=&quot;color: #64748b; margin: 8px 0;&quot;&gt;... e mais ${comparacao.deletados.length - 10} arquivos&lt;/div&gt;`;
                }
            }

            html += '&lt;/div&gt;';
            document.getElementById('tab-resumo').innerHTML = html;
        }

        function mostrarArquivos() {
            let html = '';

            // Novos
            if (comparacao.novos.length &gt; 0) {
                html += `&lt;div style=&quot;color: #4ade80; font-weight: bold; margin-bottom: 12px;&quot;&gt;✅ ARQUIVOS NOVOS:&lt;/div&gt;`;
                comparacao.novos.forEach((item, idx) =&gt; {
                    html += `
                        &lt;div class=&quot;arquivo-item&quot; onclick=&quot;verArquivo('novo', ${idx})&quot;&gt;
                            &lt;div class=&quot;arquivo-icon&quot;&gt;📄&lt;/div&gt;
                            &lt;div class=&quot;arquivo-info&quot;&gt;
                                &lt;div class=&quot;arquivo-nome&quot;&gt;${item.nome}&lt;/div&gt;
                                &lt;div class=&quot;arquivo-status status-novo&quot;&gt;Novo · ${(item.arquivo.tamanho / 1024).toFixed(1)} KB&lt;/div&gt;
                            &lt;/div&gt;
                        &lt;/div&gt;
                    `;
                });
            }

            // Modificados
            if (comparacao.modificados.length &gt; 0) {
                html += `&lt;div style=&quot;color: #fbbf24; font-weight: bold; margin: 20px 0 12px;&quot;&gt;⚠️ ARQUIVOS MODIFICADOS:&lt;/div&gt;`;
                comparacao.modificados.forEach((item, idx) =&gt; {
                    html += `
                        &lt;div class=&quot;arquivo-item&quot; onclick=&quot;verArquivo('modificado', ${idx})&quot;&gt;
                            &lt;div class=&quot;arquivo-icon&quot;&gt;📝&lt;/div&gt;
                            &lt;div class=&quot;arquivo-info&quot;&gt;
                                &lt;div class=&quot;arquivo-nome&quot;&gt;${item.nome}&lt;/div&gt;
                                &lt;div class=&quot;arquivo-status status-modificado&quot;&gt;
                                    +${item.diff.linhasAdicionadas} -${item.diff.linhasRemovidas} ~${item.diff.linhasModificadas} linhas
                                &lt;/div&gt;
                            &lt;/div&gt;
                        &lt;/div&gt;
                    `;
                });
            }

            // Deletados
            if (comparacao.deletados.length &gt; 0) {
                html += `&lt;div style=&quot;color: #f87171; font-weight: bold; margin: 20px 0 12px;&quot;&gt;❌ ARQUIVOS DELETADOS:&lt;/div&gt;`;
                comparacao.deletados.forEach((item, idx) =&gt; {
                    html += `
                        &lt;div class=&quot;arquivo-item&quot; onclick=&quot;verArquivo('deletado', ${idx})&quot;&gt;
                            &lt;div class=&quot;arquivo-icon&quot;&gt;🗑️&lt;/div&gt;
                            &lt;div class=&quot;arquivo-info&quot;&gt;
                                &lt;div class=&quot;arquivo-nome&quot;&gt;${item.nome}&lt;/div&gt;
                                &lt;div class=&quot;arquivo-status status-deletado&quot;&gt;Deletado&lt;/div&gt;
                            &lt;/div&gt;
                        &lt;/div&gt;
                    `;
                });
            }

            document.getElementById('tab-arquivos').innerHTML = html;
        }

        function verArquivo(tipo, idx) {
            let item, diff;

            if (tipo === 'novo') {
                item = comparacao.novos[idx];
                diff = `&lt;div style=&quot;color: #4ade80; font-weight: bold; margin-bottom: 12px;&quot;&gt;✅ ARQUIVO NOVO: ${item.nome}&lt;/div&gt;`;
                diff += '&lt;div class=&quot;diff-container&quot;&gt;';
                item.arquivo.conteudo.split('\n').slice(0, 100).forEach((linha, i) =&gt; {
                    diff += `&lt;div class=&quot;diff-linha diff-add&quot;&gt;${i + 1} | ${linha}&lt;/div&gt;`;
                });
                diff += '&lt;/div&gt;';
            } else if (tipo === 'modificado') {
                item = comparacao.modificados[idx];
                diff = `&lt;div style=&quot;color: #fbbf24; font-weight: bold; margin-bottom: 12px;&quot;&gt;⚠️ ARQUIVO MODIFICADO: ${item.nome}&lt;/div&gt;`;
                diff += '&lt;div class=&quot;diff-container&quot;&gt;';
                item.diff.diff.slice(0, 200).forEach(d =&gt; {
                    if (d.tipo === 'add') {
                        diff += `&lt;div class=&quot;diff-linha diff-add&quot;&gt;${d.linha} | + ${d.conteudo}&lt;/div&gt;`;
                    } else if (d.tipo === 'remove') {
                        diff += `&lt;div class=&quot;diff-linha diff-remove&quot;&gt;${d.linha} | - ${d.conteudo}&lt;/div&gt;`;
                    } else if (d.tipo === 'modify') {
                        diff += `&lt;div class=&quot;diff-linha diff-remove&quot;&gt;${d.linha} | - ${d.antes}&lt;/div&gt;`;
                        diff += `&lt;div class=&quot;diff-linha diff-add&quot;&gt;${d.linha} | + ${d.depois}&lt;/div&gt;`;
                    } else if (Math.random() &gt; 0.7) { // Mostrar só algumas linhas iguais
                        diff += `&lt;div class=&quot;diff-linha diff-igual&quot;&gt;${d.linha} | ${d.conteudo}&lt;/div&gt;`;
                    }
                });
                diff += '&lt;/div&gt;';
            } else {
                item = comparacao.deletados[idx];
                diff = `&lt;div style=&quot;color: #f87171; font-weight: bold; margin-bottom: 12px;&quot;&gt;❌ ARQUIVO DELETADO: ${item.nome}&lt;/div&gt;`;
                diff += '&lt;div class=&quot;diff-container&quot;&gt;';
                item.arquivo.conteudo.split('\n').slice(0, 100).forEach((linha, i) =&gt; {
                    diff += `&lt;div class=&quot;diff-linha diff-remove&quot;&gt;${i + 1} | ${linha}&lt;/div&gt;`;
                });
                diff += '&lt;/div&gt;';

    function parseAxml(buf) {
      const data = new Uint8Array(buf);
      const dv = new DataView(buf);
      const strings = [];
      try {
        const off = 8;
        const strCount  = dv.getUint32(off + 8, true);
        const flags     = dv.getUint32(off + 16, true);
        const strStart  = dv.getUint32(off + 20, true);
        const poolHSize = dv.getUint16(off + 2, true);
        const isUtf8    = !!(flags &amp; (1 &lt;&lt; 8));
        const offsetsBase = off + poolHSize;
        const stringsBase = off + strStart;
        for (let i = 0; i &lt; Math.min(strCount, 500); i++) {
          const idxOff = offsetsBase + i * 4;
          if (idxOff + 4 &gt; data.byteLength) break;
          const sOff = stringsBase + dv.getUint32(idxOff, true);
          if (sOff &gt;= data.byteLength) continue;
          let s = &quot;&quot;;
          if (isUtf8) {
            const clen = data[sOff + 1];
            if (sOff + 2 + clen &gt; data.byteLength) continue;
            for (let j = 0; j &lt; clen; j++) { const c = data[sOff + 2 + j]; if (c &gt;= 0x20) s += String.fromCharCode(c); }

            if (sOff + 2 + clen * 2 &gt; data.byteLength) continue;
            for (let j = 0; j &lt; clen; j++) { const c = dv.getUint16(sOff + 2 + j * 2, true); if (c &gt;= 0x20) s += String.fromCharCode(c); }

          if (s.length &gt;= 2) strings.push(s);

        // SEM LIMITE DE 60 ARQUIVOS AQUI! Lê todos.
        const promises = [];
        zip.forEach((path, entry) =&gt; {
          if (!entry.dir) {
            currentFiles.push(path);
            const ext = path.split('.').pop().toLowerCase();
            if (!SKIP_EXT.has(ext)) {
              promises.push(
                entry.async('string').then(txt =&gt; fileContents[path] = txt).catch(() =&gt; fileContents[path] = &quot;[Erro]&quot;)
              );
            } else {
              promises.push(
                entry.async('uint8array').then(bin =&gt; fileContents[path] = bin)
              );
            }
          }
        });

        await Promise.all(promises);
        currentFiles.sort();
        renderFileList();
        showSection('editor');
      } catch(e) {
        alert(&quot;Erro: &quot; + e.message);
      } finally {
        hideLoader();
      }
    });

    function renderApkInfo() {
      if (!apkInfoData) return;
      document.getElementById('apkDataContainer').innerHTML = `
        &lt;div class=&quot;bg-darkBg p-4 rounded-lg border border-borderGreen&quot;&gt;
          &lt;h3 class=&quot;text-brandGreen font-bold&quot;&gt;${apkInfoData.fileName}&lt;/h3&gt;
          &lt;p class=&quot;text-xs text-gray-400 mt-2&quot;&gt;Package ID: &lt;strong class=&quot;text-accentGold&quot;&gt;${apkInfoData.packageName}&lt;/strong&gt;&lt;/p&gt;
          &lt;p class=&quot;text-xs text-gray-400&quot;&gt;Versão: &lt;strong class=&quot;text-white&quot;&gt;${apkInfoData.versionName}&lt;/strong&gt;&lt;/p&gt;
        &lt;/div&gt;`;
    }

    // ================= EDITOR =================
    function hasReplitRef(text) {
      if (typeof text !== 'string') return false;
      return REPLIT_PATTERNS.some(p =&gt; { p.lastIndex = 0; return p.test(text); });
    }

    function renderFileList() {
      document.getElementById('filesCount').innerText = currentFiles.length;
      const container = document.getElementById('fileList');
      container.innerHTML = currentFiles.map(file =&gt; {
        const isSujo = hasReplitRef(fileContents[file]);
        const badge = isSujo ? '&lt;span class=&quot;text-[9px] bg-red-950 text-red-400 px-1 rounded&quot;&gt;Replit&lt;/span&gt;' : '';
        return `&lt;div class=&quot;p-1.5 hover:bg-borderGreen rounded cursor-pointer flex justify-between items-center truncate border-b border-borderGreen/10&quot; onclick=&quot;openFile('${file}')&quot;&gt;
          &lt;span class=&quot;truncate&quot;&gt;📄 ${file}&lt;/span&gt;${badge}
        &lt;/div&gt;`;
      }).join('');
    }

    function openFile(filename) {
      activeFile = filename;
      document.getElementById('currentFileName').innerText = `📝 ${filename}`;
      const content = fileContents[filename];
      document.getElementById('fileContent').value = typeof content === 'string' ? content : &quot;[Arquivo Binário]&quot;;
    }

    function saveCurrentFileChanges() {
      if (!activeFile) return;
      fileContents[activeFile] = document.getElementById('fileContent').value;
      alert(&quot;Salvo na memória!&quot;);
      renderFileList();
    }

    // ================= LIMPEZA E INJEÇÃO (A MÁGICA) =================
    function updateScannerStats() {
      document.getElementById('scanTotalFiles').innerText = currentFiles.length;
      let infected = 0;
      currentFiles.forEach(f =&gt; { if(hasReplitRef(fileContents[f])) infected++; });
      document.getElementById('scanInfectedFiles').innerText = infected;
    }

    // Lógica de limpeza de strings (igual a sua do React)
    function cleanReplitStrings(text) {
      let out = text;
      out = out.replace(/https?:\/\/[a-z0-9-]+\.replit\.dev[^\s&quot;'`)]*/gi, &quot;&quot;);
      out = out.replace(/https?:\/\/[a-z0-9-]+\.repl\.co[^\s&quot;'`)]*/gi, &quot;&quot;);
      out = out.replace(/[&quot;']REPLIT_DEV_DOMAIN[&quot;']\s*:\s*[&quot;'][^&quot;']*[&quot;']/gi, '&quot;REPLIT_DEV_DOMAIN&quot;:&quot;&quot;');
      out = out.replace(/[&quot;']REPL_ID[&quot;']\s*:\s*[&quot;'][^&quot;']*[&quot;']/gi, '&quot;REPL_ID&quot;:&quot;&quot;');
      out = out.replace(/process\.env\.REPL_ID/g, '&quot;&quot;');
      out = out.replace(/process\.env\.REPLIT_DEV_DOMAIN/g, '&quot;&quot;');
      out = out.replace(/import\.meta\.env\.REPLIT[A-Z_]*/g, '&quot;&quot;');
      return out;
    }

    // Lógica nova: Injetar arquivos essenciais se for código fonte
    function injectEssentialFiles() {
      // Se tiver package.json, é um projeto Node/Vite (ZIP)
      const isSourceCode = currentFiles.some(f =&gt; f.includes('package.json'));
      
      if (isSourceCode) {
        logAction(&quot;Detectado código-fonte (ZIP). Injetando arquivos essenciais...&quot;, &quot;info&quot;);
        
        // 1. Forçar um vite.config.js limpo
        const cleanViteConfig = `import { defineConfig } from 'vite';\nimport react from '@vitejs/plugin-react';\n\nexport default defineConfig({\n  plugins: [react()],\n  server: { host: '0.0.0.0', port: 3000 }\n});`;
        
        // Procura onde está o vite config (pode estar na raiz ou numa pasta)
        let vitePath = currentFiles.find(f =&gt; f.endsWith('vite.config.js') || f.endsWith('vite.config.ts'));
        if (!vitePath) {
          vitePath = &quot;vite.config.js&quot;;
          currentFiles.push(vitePath);
        }
        fileContents[vitePath] = cleanViteConfig;
        logAction(`Substituído/Criado: ${vitePath}`, &quot;success&quot;);

        // 2. Limpar index.html de scripts injetados
        let htmlPath = currentFiles.find(f =&gt; f.endsWith('index.html'));
        if (htmlPath &amp;&amp; typeof fileContents[htmlPath] === 'string') {
          let html = fileContents[htmlPath];
          // Remove scripts do replit
          html = html.replace(/&lt;script[^&gt;]*src=[&quot;'][^&quot;']*replit[^&quot;']*[&quot;'][^&gt;]*&gt;&lt;\/script&gt;/gi, &quot;&quot;);
          fileContents[htmlPath] = html;
          logAction(`Limpado: ${htmlPath}`, &quot;success&quot;);
        }
      } else {
        logAction(&quot;Detectado APK compilado. Apenas limpando strings, sem injetar arquivos.&quot;, &quot;info&quot;);
      }
    }

    async function executeCleanAndInject() {
      if (currentFiles.length === 0) return alert(&quot;Importe um projeto primeiro!&quot;);
      showLoader(&quot;Limpando e Injetando...&quot;);
      document.getElementById('cleanLogs').innerHTML = &quot;&quot;;
      
      let cleanedCount = 0;

      // 1. Limpar strings
      currentFiles.forEach(f =&gt; {
        if (typeof fileContents[f] === 'string' &amp;&amp; hasReplitRef(fileContents[f])) {
          fileContents[f] = cleanReplitStrings(fileContents[f]);
          cleanedCount++;
          logAction(`Strings limpas em: ${f}`);
        }
      });

      // 2. Injetar Essenciais (A resposta para a sua dúvida)
      injectEssentialFiles();

      logAction(`Total de arquivos modificados: ${cleanedCount}`, &quot;success&quot;);
      logAction(&quot;Gerando novo arquivo para download...&quot;, &quot;info&quot;);

      // 3. Gerar ZIP/APK
      const zip = new JSZip();
      currentFiles.forEach(f =&gt; {
        zip.file(f, fileContents[f]);
      });

      const blob = await zip.generateAsync({ type: &quot;blob&quot;, compression: &quot;DEFLATE&quot;, compressionOptions: { level: 6 } });
      const url = URL.createObjectURL(blob);
      const a = document.createElement(&quot;a&quot;);
      a.href = url; 
      
      const isApk = originalFileName.endsWith('.apk');
      a.download = originalFileName.replace(isApk ? &quot;.apk&quot; : &quot;.zip&quot;, isApk ? &quot;-limpo.apk&quot; : &quot;-limpo.zip&quot;);
      
      document.body.appendChild(a); 
      a.click();
      document.body.removeChild(a);
      
      hideLoader();
      renderFileList(); // Atualiza a lista tirando as tags vermelhas
      logAction(&quot;Download concluído com sucesso!&quot;, &quot;success&quot;);
    }
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>
</div>


<script>
function trocarProjeto(index) {
  // Esconde todos
  document.querySelectorAll('.project-container').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  
  // Mostra o selecionado
  document.getElementById('projeto' + index).classList.add('active');
  document.querySelectorAll('.nav-btn')[index].classList.add('active');
  
  // Salva preferência
  localStorage.setItem('ultimo-projeto', index);
}

// Restaura último projeto aberto
window.onload = function() {
  const ultimo = localStorage.getItem('ultimo-projeto');
  if (ultimo !== null) trocarProjeto(parseInt(ultimo));
};
</script>
</body>
</html>
