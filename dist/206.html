  text-indent: 4cm;
  margin-bottom: 0;
  line-height: 1.5;
}

}

}

.tiptap-editor-content .ProseMirror h2,

  margin: 0.5cm 0 0.3cm;
  text-indent: 0;
  font-size: 12pt;
}

.tiptap-editor-content .ProseMirror h2:not([style]),
.tiptap-editor-content .ProseMirror h3:not([style]) {
  text-align: center;
}

.tiptap-editor-content .ProseMirror blockquote {
  margin-left: 4cm;
  margin-right: 4cm;

  border-left: none;
  padding-left: 0;
  font-style: italic;

}

/* Dark mode — editor usa tema oliva */

}

  color: hsl(80 30% 92%);
}

.tiptap-editor-content .ProseMirror:focus {
  outline: none;
}

  pointer-events: none;
  height: 0;
}

.tiptap-editor-content .ProseMirror ::selection {

}

  }
}
