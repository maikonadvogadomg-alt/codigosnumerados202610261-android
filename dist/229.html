<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extrator de Texto Pro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      transition: all 0.3s ease;
    }

    body.dark {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      animation: slideIn 0.5s ease;
    }

    body.dark .container {
      background: #0f3460;
      color: #e8e8e8;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2.5em;
      color: #667eea;
      margin-bottom: 10px;
    }

    body.dark h1 {
      color: #5eead4;
    }

    .subtitle {
      color: #666;
      font-size: 1.1em;
    }

    body.dark .subtitle {
      color: #a8a8a8;
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: white;
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.5em;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
      z-index: 1000;
    }

    .theme-toggle:hover {
      transform: scale(1.1) rotate(20deg);
    }

    body.dark .theme-toggle {
      background: #0f3460;
    }

    .upload-zone {
      border: 3px dashed #667eea;
      border-radius: 15px;
      padding: 60px 20px;
      text-align: center;
      margin-bottom: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: #f8f9ff;
    }

    body.dark .upload-zone {
      background: #16213e;
      border-color: #5eead4;
    }

    .upload-zone:hover, .upload-zone.dragover {
      background: #e8ebff;
      border-color: #764ba2;
      transform: scale(1.02);
    }

    body.dark .upload-zone:hover, body.dark .upload-zone.dragover {
      background: #1a2942;
      border-color: #7dd3c0;
    }

    .upload-icon {
      font-size: 4em;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .file-info {
      margin: 20px 0;
      padding: 15px;
      background: #e8ebff;
      border-radius: 10px;
      display: none;
    }

    body.dark .file-info {
      background: #1a2942;
    }

    .file-info.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .progress-container {
      margin: 20px 0;
      display: none;
    }

    .progress-container.show {
      display: block;
    }

    .progress-bar {
      width: 100%;
      height: 30px;
      background: #e0e0e0;
      border-radius: 15px;
      overflow: hidden;
      position: relative;
    }

    body.dark .progress-bar {
      background: #1a2942;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      width: 0%;
      transition: width 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin: 30px 0;
    }

    button {
      padding: 15px 25px;
      border: none;
      border-radius: 10px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: white;
      color: #667eea;
      border: 2px solid #667eea;
    }

    body.dark .btn-secondary {
      background: #1a2942;
      color: #5eead4;
      border-color: #5eead4;
    }

    .btn-secondary:hover {
      background: #667eea;
      color: white;
      transform: translateY(-3px);
    }

    body.dark .btn-secondary:hover {
      background: #5eead4;
      color: #0f3460;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    textarea {
      width: 100%;
      min-height: 400px;
      padding: 20px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      resize: vertical;
      transition: border-color 0.3s ease;
    }

    body.dark textarea {
      background: #1a2942;
      color: #e8e8e8;
      border-color: #2d4a6f;
    }

    textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
      padding: 20px;
      background: #f8f9ff;
      border-radius: 10px;
    }

    body.dark .stats {
      background: #1a2942;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-size: 2em;
      font-weight: bold;
      color: #667eea;
    }

    body.dark .stat-value {
      color: #5eead4;
    }

    .stat-label {
      color: #666;
      font-size: 0.9em;
    }

    body.dark .stat-label {
      color: #a8a8a8;
    }

    .notification {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 20px 30px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      display: none;
      animation: slideUp 0.3s ease;
      z-index: 1000;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .notification.show {
      display: block;
    }

    .notification.success {
      border-left: 5px solid #4caf50;
    }

    .notification.error {
      border-left: 5px solid #f44336;
    }

    input[type="file"] {
      display: none;
    }

    @media (max-width: 768px) {
      .container {
        padding: 20px;
      }

      h1 {
        font-size: 1.8em;
      }

      .buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()">🌙</button>

  <div class="container">
    <header>
      <h1>📄 Extrator de Texto Pro</h1>
      <p class="subtitle">Extraia texto de PDF, DOCX, imagens e TXT com facilidade</p>
    </header>

    <div class="upload-zone" id="uploadZone">
      <div class="upload-icon">📁</div>
      <h3>Arraste seu arquivo aqui</h3>
      <p>ou clique para selecionar</p>
      <p style="margin-top: 10px; color: #999; font-size: 0.9em;">
        Suporta: PDF, DOCX, TXT, PNG, JPG, JPEG
      </p>
      <input type="file" id="fileInput" accept=".pdf,.txt,.png,.jpg,.jpeg,.docx">
    </div>

    <div class="file-info" id="fileInfo">
      <strong>📎 Arquivo selecionado:</strong> <span id="fileName"></span>
      <br>
      <strong>📏 Tamanho:</strong> <span id="fileSize"></span>
    </div>

    <div class="progress-container" id="progressContainer">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill">0%</div>
      </div>
    </div>

    <div class="buttons">
      <button class="btn-primary" onclick="extractText()">🔍 Extrair Texto</button>
      <button class="btn-secondary" onclick="downloadText()">💾 Baixar TXT</button>
      <button class="btn-secondary" onclick="downloadPDF()">📕 Baixar PDF</button>
      <button class="btn-secondary" onclick="downloadDOCX()">📘 Baixar DOCX</button>
      <button class="btn-secondary" onclick="downloadMarkdown()">📝 Baixar MD</button>
      <button class="btn-secondary" onclick="copyText()">📋 Copiar</button>
    </div>

    <div class="stats">
      <div class="stat-item">
        <div class="stat-value" id="charCount">0</div>
        <div class="stat-label">Caracteres</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="wordCount">0</div>
        <div class="stat-label">Palavras</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="lineCount">0</div>
        <div class="stat-label">Linhas</div>
      </div>
    </div>

    <h3>📝 Texto Extraído:</h3>
    <textarea id="output" placeholder="O texto extraído aparecerá aqui..."></textarea>
  </div>

  <div class="notification" id="notification"></div>

  <!-- Bibliotecas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.36.0/docxtemplater.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsPDF/2.5.1/jspdf.umd.min.js"></script>

  <script>
    let extractedText = "";
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const output = document.getElementById('output');

    // Tema
    function toggleTheme() {
      document.body.classList.toggle('dark');
      const btn = document.querySelector('.theme-toggle');
      btn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
      localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    }

    // Carregar tema salvo
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
      document.querySelector('.theme-toggle').textContent = '☀️';
    }

    // Notificação
    function showNotification(message, type = 'success') {
      const notif = document.getElementById('notification');
      notif.textContent = message;
      notif.className = `notification ${type} show`;
      setTimeout(() => notif.classList.remove('show'), 3000);
    }

    // Atualizar estatísticas
    function updateStats(text) {
      document.getElementById('charCount').textContent = text.length.toLocaleString();
      document.getElementById('wordCount').textContent = text.trim().split(/\s+/).filter(w => w).length.toLocaleString();
      document.getElementById('lineCount').textContent = text.split('\n').length.toLocaleString();
    }

    // Drag & Drop
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      uploadZone.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName => {
      uploadZone.addEventListener(eventName, () => uploadZone.classList.add('dragover'));
    });

    ['dragleave', 'drop'].forEach(eventName => {
      uploadZone.addEventListener(eventName, () => uploadZone.classList.remove('dragover'));
    });

    uploadZone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      if (files.length) {
        fileInput.files = files;
        handleFileSelect(files[0]);
      }
    });

    uploadZone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) {
        handleFileSelect(e.target.files[0]);
      }
    });

    function handleFileSelect(file) {
      document.getElementById('fileName').textContent = file.name;
      document.getElementById('fileSize').textContent = formatFileSize(file.size);
      document.getElementById('fileInfo').classList.add('show');
    }

    function formatFileSize(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }

    // Barra de progresso
    function showProgress() {
      const container = document.getElementById('progressContainer');
      const fill = document.getElementById('progressFill');
      container.classList.add('show');
      fill.style.width = '0%';
      fill.textContent = '0%';
      
      let progress = 0;
      const interval = setInterval(() => {
        progress += Math.random() * 15;
        if (progress > 90) progress = 90;
        fill.style.width = progress + '%';
        fill.textContent = Math.round(progress) + '%';
      }, 200);

      return () => {
        clearInterval(interval);
        fill.style.width = '100%';
        fill.textContent = '100%';
        setTimeout(() => container.classList.remove('show'), 1000);
      };
    }

    // Limpar rodapés
    function cleanFooter(text) {
      const patterns = [
        /Num\.\s*\d+\s*-\s*Pág\.\s*\d+[\s\S]*?Número do documento:\s*\d+[^\n]*\n?/gi,
        /Assinado digitalmente por:[\s\S]*?Número do documento:[^\n]*\n?/gi,
        /Documento eletrônico assinado[\s\S]*?Número do documento:[^\n]*\n?/gi
      ];
      let cleaned = text;
      patterns.forEach(p => cleaned = cleaned.replace(p, ""));
      return cleaned;
    }

    // Autosave
    window.onload = function() {
      const saved = localStorage.getItem("autosaveText");
      if (saved) {
        extractedText = saved;
        output.value = saved;
        updateStats(saved);
      }
    };

    output.addEventListener('input', () => {
      extractedText = output.value;
      localStorage.setItem("autosaveText", extractedText);
      updateStats(extractedText);
    });

    // Extração de texto
    async function extractText() {
      const file = fileInput.files[0];
      if (!file) {
        showNotification("Selecione um arquivo primeiro!", "error");
        return;
      }

      const completeProgress = showProgress();
      output.value = "⏳ Processando... Aguarde.";

      try {
        if (file.type === "text/plain") {
          const text = await file.text();
          extractedText = cleanFooter(text) + `\n\n--- Fim do arquivo TXT ---\n\n`;

        } else if (file.type === "application/pdf") {
          extractedText = await extractFromPDF(file);

        } else if (file.type.startsWith("image/")) {
          extractedText = await extractFromImage(file);

        } else if (file.name.endsWith(".docx")) {
          extractedText = await extractFromDOCX(file);

        } else {
          throw new Error("Formato não suportado");
        }

        output.value = extractedText;
        localStorage.setItem("autosaveText", extractedText);
        updateStats(extractedText);
        completeProgress();
        showNotification("✅ Texto extraído com sucesso!");

      } catch (error) {
        completeProgress();
        output.value = "❌ Erro ao extrair texto. Tente novamente.";
        showNotification("Erro: " + error.message, "error");
      }
    }

    async function extractFromPDF(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = async function() {
          const typedArray = new Uint8Array(this.result);
          const pdf = await pdfjsLib.getDocument(typedArray).promise;
          let textContent = "";

          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const text = await page.getTextContent();

            if (text.items.length > 0) {
              text.items.forEach(item => textContent += item.str + " ");
            } else {
              const viewport = page.getViewport({ scale: 2 });
              const canvas = document.createElement("canvas");
              const context = canvas.getContext("2d");
              canvas.height = viewport.height;
              canvas.width = viewport.width;

              await page.render({ canvasContext: context, viewport: viewport }).promise;
              const { data: { text: ocrText } } = await Tesseract.recognize(canvas, 'por');
              textContent += ocrText + " ";
            }

            textContent += `\n\n--- Página ${i} ---\n\n`;
          }

          resolve(cleanFooter(textContent));
        };
        reader.readAsArrayBuffer(file);
      });
    }

    async function extractFromImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = async function() {
          const { data: { text } } = await Tesseract.recognize(reader.result, 'por');
          resolve(cleanFooter(text) + `\n\n--- Fim da imagem ---\n\n`);
        };
        reader.readAsDataURL(file);
      });
    }

    async function extractFromDOCX(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = async function() {
          const zip = new JSZip(reader.result);
          const doc = new window.Docxtemplater().loadZip(zip);
          const text = doc.getFullText();
          resolve(cleanFooter(text) + `\n\n--- Fim do arquivo DOCX ---\n\n`);
        };
        reader.readAsBinaryString(file);
      });
    }

    function downloadText() {
      if (!extractedText) {
        showNotification("Nenhum texto extraído ainda!", "error");
        return;
      }
      const blob = new Blob([extractedText], { type: "text/plain" });
      downloadFile(blob, "texto_extraido.txt");
      showNotification("📥 Arquivo TXT baixado!");
    }

    function downloadPDF() {
      if (!extractedText) {
        showNotification("Nenhum texto extraído ainda!", "error");
        return;
      }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFontSize(12);
      const lines = doc.splitTextToSize(extractedText, 180);
      doc.text(lines, 10, 10);
      doc.save("texto_extraido.pdf");
      showNotification("📥 Arquivo PDF baixado!");
    }

    function downloadDOCX() {
      if (!extractedText) {
        showNotification("Nenhum texto extraído ainda!", "error");
        return;
      }
      const blob = new Blob(
        [`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
        <w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
          <w:body>
            <w:p><w:r><w:t>${extractedText.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}</w:t></w:r></w:p>
          </w:body>
        </w:document>`],
        { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" }
      );
      downloadFile(blob, "texto_extraido.docx");
      showNotification("📥 Arquivo DOCX baixado!");
    }

    function downloadMarkdown() {
      if (!extractedText) {
        showNotification("Nenhum texto extraído ainda!", "error");
        return;
      }
      const mdText = extractedText.replace(/--- Página (\d+) ---/g, "### Página $1");
      const blob = new Blob([mdText], { type: "text/markdown" });
      downloadFile(blob, "texto_extraido.md");
      showNotification("📥 Arquivo Markdown baixado!");
    }

    function downloadFile(blob, filename) {
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
    }

    function copyText() {
      if (!extractedText) {
        showNotification("Nenhum texto extraído ainda!", "error");
        return;
      }
      navigator.clipboard.writeText(extractedText).then(() => {
        showNotification("📋 Texto copiado!");
      });
    }
  </script>
</body>
</html>
