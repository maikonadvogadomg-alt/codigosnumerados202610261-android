&lt;style&gt;
:root {
  --bg:#0f172a;--bg2:#1e293b;--bg3:#334155;
  --text:#e2e8f0;--text2:#94a3b8;
  --accent:#a3a082;--accent2:#d4d0a8;
  --blue:#3b82f6;--green:#4ade80;--red:#f87171;--yellow:#fbbf24;
  --border:#334155;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:4px;}
.header-left{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.header-right{display:flex;align-items:center;gap:3px;flex-wrap:wrap;}
.logo{font-weight:800;font-size:13px;color:var(--accent);white-space:nowrap;}
.logo small{font-size:9px;color:var(--text2);font-weight:400;display:block;}
.title-input{background:transparent;border:1px solid transparent;color:var(--text);font-size:12px;padding:3px 7px;border-radius:6px;width:130px;}
.title-input:focus{outline:none;border-color:var(--accent);}
.btn{display:inline-flex;align-items:center;gap:3px;padding:4px 9px;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;}
.btn-icon{padding:5px 7px;border-radius:6px;background:transparent;border:none;color:var(--text2);cursor:pointer;font-size:12px;transition:all .15s;}
.btn-icon:hover{background:var(--bg3);color:var(--text);}
.btn-primary{background:var(--accent);color:#000;}
.btn-primary:hover{background:var(--accent2);}
.btn-ghost{background:transparent;color:var(--text2);}
.btn-ghost:hover{background:var(--bg3);color:var(--text);}
.btn-mode{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;}
.btn-mode.active{background:var(--accent);color:#000;border-color:var(--accent);}
.mode-group{display:flex;gap:2px;background:var(--bg);padding:2px;border-radius:7px;border:1px solid var(--border);}

/* TABS */
.tabs-bar{display:flex;align-items:center;justify-content:space-between;padding:3px 8px;background:var(--bg2);border-bottom:1px solid var(--border);}
.tabs{display:flex;gap:2px;}
.tab{padding:4px 10px;font-size:11px;font-weight:600;border:none;background:transparent;color:var(--text2);cursor:pointer;border-radius:6px;transition:all .15s;}
.tab.active{background:var(--bg3);color:var(--text);}
.tab-info{font-size:10px;color:var(--text2);display:flex;align-items:center;gap:6px;}
.badge{font-size:9px;padding:2px 5px;border-radius:4px;font-weight:700;text-transform:uppercase;}
.badge-html{background:rgba(239,68,68,.15);color:var(--red);}
.badge-react{background:rgba(59,130,246,.15);color:var(--blue);}
.badge-python{background:rgba(251,191,36,.15);color:var(--yellow);}

/* MAIN */
.main{display:flex;flex:1;overflow:hidden;}

/* EDITOR */
.editor-panel{display:flex;flex-direction:column;width:38%;border-right:1px solid var(--border);transition:width .3s;min-width:0;}
.editor-panel.hidden{display:none;}
.editor-panel.full{width:100%;}
.editor-wrap{flex:1;position:relative;overflow:hidden;}
.editor-textarea{width:100%;height:100%;resize:none;background:var(--bg);color:var(--text);font-family:'Cascadia Code','Fira Code','Consolas',monospace;font-size:12px;line-height:1.6;padding:10px 10px 10px 44px;border:none;outline:none;tab-size:2;position:absolute;inset:0;}
.line-numbers{position:absolute;left:0;top:0;bottom:0;width:36px;background:rgba(30,41,59,.6);padding:10px 4px 10px 0;text-align:right;font-family:'Consolas',monospace;font-size:11px;line-height:1.6;color:var(--text2);opacity:.6;overflow:hidden;pointer-events:none;user-select:none;z-index:1;}

/* PREVIEW */
.preview-panel{display:flex;flex-direction:column;flex:1;min-width:0;border-right:1px solid var(--border);}
.preview-panel.hidden{display:none;}
.preview-header{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.preview-frame{flex:1;border:none;background:#fff;}

/* CHAT IA */
.chat-panel{display:flex;flex-direction:column;width:300px;flex-shrink:0;}
.chat-panel.hidden{display:none;}
.chat-panel.wide{width:420px;}
.chat-header{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;}
.chat-header-left{display:flex;align-items:center;gap:6px;}
.chat-messages{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:7px;}
.msg{padding:8px 10px;border-radius:8px;font-size:11.5px;line-height:1.5;word-break:break-word;}
.msg-user{background:#1e3a8a;color:#fff;align-self:flex-end;max-width:92%;}
.msg-ai{background:#111827;border:1px solid var(--bg3);color:var(--text);align-self:flex-start;max-width:98%;white-space:pre-wrap;}
.msg-sys{background:var(--bg2);border:1px solid var(--border);color:#4b5563;font-size:10px;align-self:center;text-align:center;padding:4px 8px;border-radius:5px;}
.apply-btn{display:block;width:100%;margin-top:7px;padding:6px;background:#15803d;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:11px;font-weight:700;}
.apply-btn:hover{background:#16a34a;}
.chat-bottom{padding:7px;background:var(--bg2);border-top:1px solid var(--border);display:flex;gap:5px;flex-shrink:0;}
#chatInput{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:6px 8px;color:var(--text);font-size:11px;outline:none;resize:none;font-family:inherit;}
#chatInput:focus{border-color:#2563eb;}
#chatSend{background:#1d4ed8;color:#fff;border:none;border-radius:7px;padding:6px 10px;cursor:pointer;font-size:15px;}
#chatSend:hover{background:#2563eb;}
#chatSend:disabled{background:var(--bg3);cursor:not-allowed;}

/* MODAIS */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(3px);}
.overlay.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px;width:90%;max-width:460px;max-height:82vh;overflow-y:auto;}
.modal h3{font-size:15px;margin-bottom:12px;color:var(--accent);}
.minput{width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:12px;margin-bottom:10px;outline:none;font-family:inherit;}
.minput:focus{border-color:var(--accent);}

/* SALVOS */
.sitem{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-bottom:5px;cursor:pointer;transition:all .15s;}
.sitem:hover{border-color:var(--accent);background:var(--bg3);}
.sitem-name{font-size:12px;font-weight:600;}
.sitem-meta{font-size:10px;color:var(--text2);}
.sitem-actions{display:flex;gap:2px;flex-shrink:0;}

/* FULLSCREEN EDITOR */
#fsModal{display:none;position:fixed;inset:0;background:var(--bg);z-index:999;flex-direction:column;}
#fsModal.open{display:flex;}
#fsBar{background:var(--bg2);padding:7px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
#fsEditor{flex:1;width:100%;background:var(--bg);color:var(--text);border:none;outline:none;padding:18px;font-family:'Cascadia Code','Consolas',monospace;font-size:14px;line-height:1.7;resize:none;}

/* LOADING */
.dots{display:flex;gap:4px;padding:8px 10px;}
.dot{width:7px;height:7px;background:#7c3aed;border-radius:50%;animation:blink .8s infinite;}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* TOAST */
.toast{position:fixed;bottom:16px;right:16px;background:var(--bg2);border:1px solid var(--accent);border-radius:9px;padding:10px 16px;font-size:12px;font-weight:600;color:var(--accent2);z-index:2000;transform:translateY(80px);opacity:0;transition:all .3s;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}

/* STATUS */
#saveStatus{font-size:10px;color:#4ade80;}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}

@media(max-width:768px){
  .main{flex-direction:column;}
  .editor-panel{width:100%!important;height:40%;border-right:none;border-bottom:1px solid var(--border);}
  .preview-panel{height:35%;}
  .chat-panel{width:100%;height:25%;}
}

// ═══════════════════════════════════════
// CHAVES localStorage
// ═══════════════════════════════════════
const K_SNIPPETS  = 'pg_snippets_v4';
const K_AUTOSAVE  = 'pg_autosave_v4';
const K_CURRID    = 'pg_current_id_v4';
const K_APIKEY    = 'pg_apikey_v4';
const K_PROVIDER  = 'pg_provider_v4';
const K_SYSPROMPT = 'pg_sysprompt_v4';

const DEFAULT_SYSTEM = `Você é uma IA integrada a um editor de código. O usuário é Saulo, advogado de Manhumirim-MG.
REGRAS:
1. NUNCA peça desculpas ou use frases de empatia.
2. Vá direto ao ponto.
3. Ao alterar código: devolva o arquivo COMPLETO atualizado entre triple backticks.

editor.addEventListener('input', () =&gt; {

});

editor.addEventListener('keydown', e =&gt; {

    e.preventDefault();
    const s = editor.selectionStart, end = editor.selectionEnd;
    editor.value = editor.value.substring(0,s) + '  ' + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = s + 2;
    saveCurrentTab();
  }
});

editor.addEventListener('paste', () =&gt; {
  setTimeout(() =&gt; {
    const c = editor.value;
    if (state.mode === 'html') {
      if (/import\s+React|from\s+['&quot;]react['&quot;]|useState|&lt;[A-Z][a-zA-Z]*[\s/&gt;]/.test(c)) {

      if (/^(def |class |import |from |print\()/im.test(c) &amp;&amp; !c.includes('&lt;')) {

function updateLineNumbers() {

  document.getElementById('lineCount').textContent = lines + ' linhas';
  lineNumbers.textContent = Array.from({length:lines},(_,i)=&gt;i+1).join('\n');
}

function saveCurrentTab() {
  const t = state.activeTab;
  if (state.mode==='react'&amp;&amp;t==='jsx') state.jsx=editor.value;
  else if (state.mode==='python'&amp;&amp;t==='python') state.python=editor.value;
  else if (t==='html') state.html=editor.value;
  else if (t==='css')  state.css=editor.value;
  else if (t==='js')   state.js=editor.value;
}

function loadEditorContent() {
  const t = state.activeTab;
  if (state.mode==='react'&amp;&amp;t==='jsx') editor.value=state.jsx;
  else if (state.mode==='python'&amp;&amp;t==='python') editor.value=state.python;
  else if (t==='html') editor.value=state.html;
  else if (t==='css')  editor.value=state.css;
  else if (t==='js')   editor.value=state.js;

}

function switchTab(tab) {

function buildDocument() {
  if (state.mode==='react') {
    return `&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;UTF-8&quot;&gt;
&lt;script crossorigin src=&quot;https://unpkg.com/react@18/umd/react.development.js&quot;&gt;&lt;\/script&gt;
&lt;script crossorigin src=&quot;https://unpkg.com/react-dom@18/umd/react-dom.development.js&quot;&gt;&lt;\/script&gt;
&lt;script src=&quot;https://unpkg.com/@babel/standalone/babel.min.js&quot;&gt;&lt;\/script&gt;
&lt;style&gt;*{box-sizing:border-box}body{margin:0;font-family:sans-serif}${state.css}&lt;/style&gt;
&lt;/head&gt;&lt;body&gt;&lt;div id=&quot;root&quot;&gt;&lt;/div&gt;
&lt;script type=&quot;text/babel&quot;&gt;
const {useState,useEffect,useRef,useCallback,useMemo,Fragment}=React;
${state.jsx}
try{ReactDOM.createRoot(document.getElementById('root')).render(&lt;App/&gt;)}
catch(e){document.getElementById('root').innerHTML='&lt;div style=&quot;color:red;padding:20px;font-family:monospace&quot;&gt;Erro: '+e.message+'&lt;/div&gt;'}
&lt;\/script&gt;&lt;/body&gt;&lt;/html&gt;`;
  }
  if (state.mode==='python') {

    return `&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;UTF-8&quot;&gt;
&lt;style&gt;body{margin:0;background:#0f172a;color:#e2e8f0;font-family:'Consolas',monospace;padding:20px}#out{white-space:pre-wrap;font-size:13px;line-height:1.6}.ok{color:#4ade80}.err{color:#f87171}.ld{color:#60a5fa}&lt;/style&gt;
&lt;/head&gt;&lt;body&gt;&lt;div id=&quot;out&quot;&gt;&lt;span class=&quot;ld&quot;&gt;⟳ Carregando Python...&lt;/span&gt;&lt;/div&gt;
&lt;script src=&quot;https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js&quot;&gt;&lt;\/script&gt;
&lt;script&gt;
async function run(){
  const out=document.getElementById('out');
  try{
    const py=await loadPyodide();
    py.runPython('import sys\\nfrom io import StringIO\\nsys.stdout=StringIO()');
    py.runPython(\`${esc}\`);
    const r=py.runPython('sys.stdout.getvalue()');
    out.innerHTML='&lt;span class=&quot;ok&quot;&gt;$ python3&lt;/span&gt;\\n'+r;
  }catch(e){out.innerHTML='&lt;span class=&quot;err&quot;&gt;Erro: '+e.message+'&lt;/span&gt;';}
}run();
&lt;\/script&gt;&lt;/body&gt;&lt;/html&gt;`;
  }
  const lower = state.html.trim().toLowerCase();
  if (lower.includes('&lt;!doctype')||(lower.includes('&lt;html')&amp;&amp;lower.includes('&lt;/html&gt;'))) return state.html;
  return `&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;UTF-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1.0&quot;&gt;

${state.html}
&lt;script&gt;${state.js}&lt;\/script&gt;&lt;/body&gt;&lt;/html&gt;`;

function getSnippets() {

}
function setSnippets(list) {
  localStorage.setItem(K_SNIPPETS, JSON.stringify(list));
}

function saveProject() {
  saveCurrentTab();
  const snippets = getSnippets();
  const now = new Date().toISOString();
  let id = state.currentId;

  if (!id) {
    id = Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    state.currentId = id;
    localStorage.setItem(K_CURRID, id);
  }

  const item = {
    id,
    title: state.title || 'Sem titulo',
    mode: state.mode,
    activeTab: state.activeTab,
    html: state.html, css: state.css, js: state.js,
    jsx: state.jsx, python: state.python,
    updatedAt: now
  };

  const idx = snippets.findIndex(s=&gt;s.id===id);
  if (idx&gt;=0) {
    item.createdAt = snippets[idx].createdAt || snippets[idx].updatedAt || now;
    snippets[idx] = item;
    showToast('💾 Projeto atualizado!');
  } else {
    item.createdAt = now;
    snippets.unshift(item);
    showToast('💾 Projeto salvo!');
  }

  setSnippets(snippets);
  autoSave();
}

function saveAsNew() {
  state.currentId = null;
  localStorage.removeItem(K_CURRID);
  saveProject();
}

function openSavedModal() {
  document.getElementById('savedModal').classList.add('open');
  document.getElementById('searchInput').value='';
  renderSaved();
}
function closeSavedModal() {
  document.getElementById('savedModal').classList.remove('open');
}

function renderSaved() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const list = getSnippets().filter(s=&gt;s.title.toLowerCase().includes(q));
  const c = document.getElementById('savedList');
  if (!list.length) {
    c.innerHTML='&lt;p style=&quot;text-align:center;color:var(--text2);font-size:12px;padding:20px;&quot;&gt;Nenhum projeto salvo ainda.&lt;br&gt;Clique em 💾 Salvar para guardar o atual.&lt;/p&gt;';
    return;
  }
  c.innerHTML = list.map(s=&gt;`
    &lt;div class=&quot;sitem&quot; onclick=&quot;loadProject('${s.id}')&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;sitem-name&quot;&gt;${esc(s.title)}&lt;/div&gt;
        &lt;div class=&quot;sitem-meta&quot;&gt;${s.mode||'html'} • ${fmtDate(s.updatedAt||s.createdAt)}&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;sitem-actions&quot;&gt;
        &lt;button class=&quot;btn-icon&quot; onclick=&quot;event.stopPropagation();renameProject('${s.id}')&quot; title=&quot;Renomear&quot;&gt;✏️&lt;/button&gt;
        &lt;button class=&quot;btn-icon&quot; onclick=&quot;event.stopPropagation();deleteProject('${s.id}')&quot; title=&quot;Excluir&quot;&gt;🗑️&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;`).join('');
}

function loadProject(id) {
  const s = getSnippets().find(x=&gt;x.id===id);
  if (!s) return;

  state.currentId = s.id;
  localStorage.setItem(K_CURRID, s.id);

  state.title   = s.title   || 'Sem titulo';
  state.mode    = s.mode    || 'html';
  state.activeTab = s.activeTab || (s.mode==='react'?'jsx':s.mode==='python'?'python':'html');
  state.html    = s.html    || '';
  state.css     = s.css     || '';
  state.js      = s.js      || '';
  state.jsx     = s.jsx     || '';
  state.python  = s.python  || '';

  titleInput.value = state.title;

  document.querySelectorAll('.btn-mode').forEach(b=&gt;b.classList.remove('active'));
  const mb = document.getElementById('mode'+state.mode.charAt(0).toUpperCase()+state.mode.slice(1));
  if (mb) mb.classList.add('active');

  updateTabs();
  loadEditorContent();
  updatePreview();
  autoSave();
  closeSavedModal();
  showToast('📂 &quot;'+state.title+'&quot; aberto!');
}

function deleteProject(id) {
  if (!confirm('Excluir este projeto?')) return;
  setSnippets(getSnippets().filter(s=&gt;s.id!==id));
  if (state.currentId===id) { state.currentId=null; localStorage.removeItem(K_CURRID); }
  renderSaved();
  showToast('🗑️ Excluído!');
}

function renameProject(id) {
  const list = getSnippets();
  const s = list.find(x=&gt;x.id===id);
  if (!s) return;
  const n = prompt('Novo nome:', s.title);
  if (n&amp;&amp;n.trim()) {
    s.title=n.trim();
    if (state.currentId===id) { state.title=s.title; titleInput.value=s.title; }
    setSnippets(list); renderSaved(); showToast('✏️ Renomeado!');
  }
}

// IMPORTAR / BAIXAR / COPIAR

function importFile() { document.getElementById('fileInput').click(); }

document.getElementById('fileInput').addEventListener('change', e =&gt; {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev =&gt; {
    const content = ev.target.result;
    const ext = file.name.split('.').pop().toLowerCase();
    const name = file.name.replace(/\.[^.]+$/,'');

    if (ext==='py') { switchMode('python'); state.python=content; }
    else if (ext==='jsx'||ext==='tsx') { switchMode('react'); state.jsx=content; }
    else if (ext==='css') { state.css=content; if(state.mode==='html') switchTab('css'); }
    else if (ext==='js') { state.js=content; if(state.mode==='html') switchTab('js'); }
    else {
      const lower=content.trim().toLowerCase();
      switchMode('html');
      state.html=content; state.css=''; state.js='';
    }

    state.title=name; titleInput.value=name;
    loadEditorContent(); updatePreview(); autoSave();
    showToast('📂 &quot;'+file.name+'&quot; importado!');
  };
  reader.readAsText(file);
  e.target.value='';
});

function downloadFile() {
  let content, ext, mime;
  if (state.mode==='python'){content=state.python;ext='py';mime='text/plain';}
  else if (state.mode==='react'){content=state.jsx;ext='jsx';mime='text/plain';}
  else {content=buildDocument();ext='html';mime='text/html';}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:mime}));
  a.download=(state.title||'playground')+'.'+ext;
  a.click(); URL.revokeObjectURL(a.href);
  showToast('⬇️ Baixado!');
}

function copyCode() {
  navigator.clipboard.writeText(buildDocument()).then(()=&gt;showToast('📋 Copiado!'));
}

function clearCode() {
  if (!confirm('Limpar o editor? O projeto salvo não muda até você clicar em Salvar.')) return;
  if (state.mode==='react') state.jsx='';
  else if (state.mode==='python') state.python='';
  else { state.html=''; state.css=''; state.js=''; }
  loadEditorContent(); updatePreview(); autoSave(); showToast('🗑️ Limpo!');
}

function addMsg(role, text, code) {
  const box = document.getElementById('chatMessages');
  const d = document.createElement('div');
  d.className = 'msg msg-'+role;
  d.textContent = text;
  if (code &amp;&amp; role==='ai') {
    const btn = document.createElement('button');
    btn.className = 'apply-btn';
    btn.textContent = '✅ Aplicar código no editor + atualizar preview';
    btn.onclick = () =&gt; {
      if (state.mode==='react') { state.jsx=code; state.activeTab='jsx'; }
      else if (state.mode==='python') { state.python=code; state.activeTab='python'; }
      else { state.html=code; state.css=''; state.js=''; state.activeTab='html'; }
      updateTabs(); loadEditorContent(); updateLineNumbers(); autoSave(); updatePreview();
      addMsg('sys','✅ Código aplicado. Preview atualizado.');
    };
    d.appendChild(btn);
  }
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function showDots() {
  const box=document.getElementById('chatMessages');
  const d=document.createElement('div');
  d.id='ldots'; d.className='dots';
  d.innerHTML='&lt;div class=&quot;dot&quot;&gt;&lt;/div&gt;&lt;div class=&quot;dot&quot;&gt;&lt;/div&gt;&lt;div class=&quot;dot&quot;&gt;&lt;/div&gt;';
  box.appendChild(d); box.scrollTop=box.scrollHeight;
}
function hideDots() { const el=document.getElementById('ldots'); if(el)el.remove(); }

async function sendMsg() {
  const inp = document.getElementById('chatInput');
  const text = inp.value.trim();
  if (!text) return;
  if (!apiKey) { openApiModal(); showToast('🔑 Configure a API Key primeiro.'); return; }

  inp.value='';
  document.getElementById('chatSend').disabled=true;
  addMsg('user', text);

  const code = buildDocument();
  const fullMsg = `${sysPrompt}

MODO: ${state.mode} | ARQUIVO: ${state.title}

CÓDIGO ATUAL NO EDITOR:
\`\`\`${state.mode==='python'?'python':state.mode==='react'?'jsx':'html'}
${code.substring(0,12000)}
\`\`\`

PEDIDO:
${text}`;

  showDots();
  try {
    const reply = provider==='gemini' ? await callGemini(fullMsg) : await callOpenAI(fullMsg);
    hideDots();
    const match = reply.match(/```(?:html|js|javascript|jsx|tsx|css|python|py)?\n?([\s\S]*?)```/);
    addMsg('ai', reply, match ? match[1].trim() : null);
  } catch(err) {
    hideDots();
    addMsg('sys','❌ '+err.message);
  }
  document.getElementById('chatSend').disabled=false;
}

async function callGemini(msg) {
  const url=`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    contents:[{role:'user',parts:[{text:msg}]}],
    generationConfig:{temperature:0.2,maxOutputTokens:8192}
  })});
  if(!r.ok){const e=await r.json();throw new Error(e.error?.message||'Erro Gemini');}
  const d=await r.json();
  return d.candidates?.[0]?.content?.parts?.[0]?.text||'Sem resposta.';
}

async function callOpenAI(msg) {
  const r=await fetch('https://api.openai.com/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
    body:JSON.stringify({model:'gpt-4o-mini',messages:[{role:'user',content:msg}],temperature:0.2,max_tokens:8192})
  });
  if(!r.ok){const e=await r.json();throw new Error(e.error?.message||'Erro OpenAI');}
  const d=await r.json();
  return d.choices?.[0]?.message?.content||'Sem resposta.';
}

// VOZ
// ═══════════════════════════════════════
function startVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showToast('🎙️ Navegador não suporta voz. Use Chrome.'); return; }

  // Abre o chat se estiver fechado
  const p = document.getElementById('chatPanel');
  if (p.classList.contains('hidden')) toggleChat();

  const rec = new SR();
  rec.lang='pt-BR'; rec.interimResults=false; rec.maxAlternatives=1;

  showToast('🎙️ Fale agora...');

  rec.onresult = e =&gt; {
    const txt = e.results[0][0].transcript;
    document.getElementById('chatInput').value = txt;
    showToast('🎙️ Capturado: &quot;'+txt+'&quot;');
  };
  rec.onerror = e =&gt; showToast('Erro no microfone: '+e.error);
  rec.start();
}

function esc(s) { return String(s).replace(/&amp;/g,'&amp;amp;').replace(/&lt;/g,'&amp;lt;').replace(/&gt;/g,'&amp;gt;').replace(/&quot;/g,'&amp;quot;'); }

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=&gt;t.classList.remove('show'),2500);
}

      &lt;button class=&quot;btn btn-primary&quot; style=&quot;flex:1&quot; onclick=&quot;saveApiKey()&quot;&gt;✅ Salvar&lt;/button&gt;
      &lt;button class=&quot;btn btn-ghost&quot; style=&quot;flex:1&quot; onclick=&quot;closeApiModal()&quot;&gt;Cancelar&lt;/button&gt;
    &lt;/div&gt;
    &lt;p style=&quot;font-size:10px;color:#4b5563;margin-top:8px;&quot;&gt;Chave salva só no seu navegador.&lt;/p&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- FULLSCREEN EDITOR --&gt;
&lt;div id=&quot;fs-modal&quot;&gt;
  &lt;div id=&quot;fs-bar&quot;&gt;
    &lt;span style=&quot;color:var(--accent);font-weight:700;font-size:13px;&quot;&gt;⛶ Editor Ampliado&lt;/span&gt;
    &lt;button class=&quot;btn btn-ghost&quot; onclick=&quot;closeFsEditor()&quot; style=&quot;background:#dc2626;color:#fff;&quot;&gt;✕ Fechar e Aplicar&lt;/button&gt;
  &lt;/div&gt;
  &lt;textarea id=&quot;fs-editor&quot; spellcheck=&quot;false&quot;&gt;&lt;/textarea&gt;
&lt;/div&gt;

&lt;!-- TOAST --&gt;
&lt;div class=&quot;toast&quot; id=&quot;toast&quot;&gt;&lt;/div&gt;

&lt;script&gt;
// ═══════════════════════════════════════════════
// CONSTANTES
// ═══════════════════════════════════════════════
const LS_SNIPPETS   = 'pg_snippets_v3';
const LS_AUTOSAVE   = 'pg_autosave_v3';
const LS_APIKEY     = 'pg_apikey';
const LS_PROVIDER   = 'pg_provider';
const LS_SYSPROMPT  = 'pg_sysprompt';

const DEFAULT_SYSTEM = `Você é uma IA integrada a um playground de código. O usuário é Saulo, advogado de Manhumirim-MG, direto ao ponto.
REGRAS ABSOLUTAS:
1. NUNCA peça desculpas.
2. NUNCA use frases de empatia (&quot;parece que&quot;, &quot;eu entendo&quot;, &quot;sinto muito&quot;, &quot;compreendo&quot;).
3. Vá DIRETO ao ponto. Só o que foi pedido.
4. Ao alterar código: retorne o arquivo COMPLETO atualizado entre triple backticks para aplicação automática.
5. Seja cirúrgico. Em uma linha diga o que mudou, depois o código.
6. Ao final: &quot;Quer mais alguma alteração?&quot;`;

// ═══════════════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════════════
let state = {
  mode: 'html',
  activeTab: 'html',
  html: `&lt;div style=&quot;max-width:600px;margin:40px auto;padding:20px;font-family:sans-serif;&quot;&gt;
  &lt;h1 style=&quot;color:#333;&quot;&gt;Bem-vindo ao Playground IA&lt;/h1&gt;
  &lt;p style=&quot;color:#666;margin:16px 0;&quot;&gt;Cole seu código aqui e veja o resultado ao vivo. A IA lê este código e pode alterá-lo.&lt;/p&gt;
  &lt;button onclick=&quot;alert('Funcionou!')&quot; style=&quot;padding:10px 24px;font-size:16px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;&quot;&gt;Testar&lt;/button&gt;
&lt;/div&gt;`,
  css: '',
  js: `// JavaScript aqui\nconsole.log(&quot;Playground IA — Saulo&quot;);`,
  jsx: `function App() {
  const [count, setCount] = React.useState(0);
  return (
    &lt;div style={{padding:40,fontFamily:'sans-serif',textAlign:'center'}}&gt;
      &lt;h1&gt;⚛️ React Playground&lt;/h1&gt;
      &lt;p&gt;Contador: &lt;strong&gt;{count}&lt;/strong&gt;&lt;/p&gt;
      &lt;button onClick={() =&gt; setCount(count+1)} style={{padding:'10px 24px',fontSize:16,background:'#3b82f6',color:'white',border:'none',borderRadius:8,cursor:'pointer'}}&gt;+1&lt;/button&gt;
    &lt;/div&gt;
  );
}`,
  python: `# Python — output no preview
dados = [&quot;João Silva&quot;, &quot;Maria Souza&quot;, &quot;Pedro Lima&quot;]
print(&quot;=== CLIENTES ===&quot;)
for i, nome in enumerate(dados, 1):
    print(f&quot;{i}. {nome}&quot;)
print(f&quot;\\nTotal: {len(dados)}&quot;)`,
  title: 'Sem titulo',
  editorState: 'normal'
};

// Carrega autosave
try {
  const saved = localStorage.getItem(LS_AUTOSAVE);
  if (saved) Object.assign(state, JSON.parse(saved));
} catch(e) {}

let apiKey     = localStorage.getItem(LS_APIKEY)    || '';
let apiProvider= localStorage.getItem(LS_PROVIDER)  || 'gemini';
let sysPrompt  = localStorage.getItem(LS_SYSPROMPT) || DEFAULT_SYSTEM;
let autoPreview= true;
let previewTimer= null;
let chatVisible = true;

// ═══════════════════════════════════════════════
// DOM
// ═══════════════════════════════════════════════
const editor       = document.getElementById('editor');
const previewFrame = document.getElementById('previewFrame');
const lineNumbers  = document.getElementById('lineNumbers');
const titleInput   = document.getElementById('projectTitle');

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
titleInput.value = state.title;
updateTabs();
loadEditorContent();
updatePreview();

// ═══════════════════════════════════════════════
// EDITOR EVENTS
// ═══════════════════════════════════════════════
editor.addEventListener('input', () =&gt; {
  saveCurrentTab();
  updateLineNumbers();
  autoSave();
  if (autoPreview) {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(updatePreview, 500);
  }
});

editor.addEventListener('scroll', () =&gt; {
  lineNumbers.scrollTop = editor.scrollTop;
});

editor.addEventListener('keydown', e =&gt; {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = editor.selectionStart, end = editor.selectionEnd;
    editor.value = editor.value.substring(0,s) + '  ' + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = s + 2;
    saveCurrentTab();
  }
});

editor.addEventListener('paste', () =&gt; {
  setTimeout(() =&gt; {
    const c = editor.value;
    if (state.mode === 'html') {
      if (/import\s+React|from\s+['&quot;]react['&quot;]|useState|&lt;[A-Z][a-zA-Z]*[\s/&gt;]/.test(c)) {
        switchMode('react'); state.jsx = c; loadEditorContent(); showToast('⚛️ React detectado!'); return;
      }
      if (/^(def |class |import |from |print\()/im.test(c) &amp;&amp; !c.includes('&lt;')) {
        switchMode('python'); state.python = c; loadEditorContent(); showToast('🐍 Python detectado!'); return;
      }
    }
    saveCurrentTab(); updatePreview();
  }, 50);
});

titleInput.addEventListener('input', () =&gt; { state.title = titleInput.value; autoSave(); });

// ═══════════════════════════════════════════════
// EDITOR FUNÇÕES
// ═══════════════════════════════════════════════
function updateLineNumbers() {
  const lines = editor.value.split('\n').length;
  document.getElementById('lineCount').textContent = lines + ' linhas';
  lineNumbers.textContent = Array.from({length:lines},(_,i)=&gt;i+1).join('\n');
}

function saveCurrentTab() {
  const t = state.activeTab;
  if (state.mode==='react'&amp;&amp;t==='jsx') state.jsx=editor.value;
  else if (state.mode==='python'&amp;&amp;t==='python') state.python=editor.value;
  else if (t==='html') state.html=editor.value;
  else if (t==='css')  state.css=editor.value;
  else if (t==='js')   state.js=editor.value;
}

function loadEditorContent() {
  const t = state.activeTab;
  if (state.mode==='react'&amp;&amp;t==='jsx') editor.value=state.jsx;
  else if (state.mode==='python'&amp;&amp;t==='python') editor.value=state.python;
  else if (t==='html') editor.value=state.html;
  else if (t==='css')  editor.value=state.css;
  else if (t==='js')   editor.value=state.js;
  else editor.value='';
  updateLineNumbers();
}

function switchTab(tab) {
  saveCurrentTab();
  state.activeTab = tab;
  document.querySelectorAll('.tab').forEach(t=&gt;t.classList.remove('active'));
  const id = 'tab'+tab.charAt(0).toUpperCase()+tab.slice(1);
  const el = document.getElementById(id);
  if (el) el.classList.add('active');
  loadEditorContent();
}

function updateTabs() {
  const container = document.getElementById('tabsContainer');
  const badge = document.getElementById('modeBadge');
  if (state.mode==='html') {
    container.innerHTML = `
      &lt;button class=&quot;tab ${state.activeTab==='html'?'active':''}&quot; id=&quot;tabHtml&quot; onclick=&quot;switchTab('html')&quot;&gt;📄 HTML&lt;/button&gt;
      &lt;button class=&quot;tab ${state.activeTab==='css'?'active':''}&quot; id=&quot;tabCss&quot; onclick=&quot;switchTab('css')&quot;&gt;🎨 CSS&lt;/button&gt;
      &lt;button class=&quot;tab ${state.activeTab==='js'?'active':''}&quot; id=&quot;tabJs&quot; onclick=&quot;switchTab('js')&quot;&gt;⚙️ JS&lt;/button&gt;`;
    badge.className='status-badge html'; badge.textContent='HTML';
  } else if (state.mode==='react') {
    container.innerHTML = `
      &lt;button class=&quot;tab ${state.activeTab==='jsx'?'active':''}&quot; id=&quot;tabJsx&quot; onclick=&quot;switchTab('jsx')&quot;&gt;⚛️ JSX&lt;/button&gt;
      &lt;button class=&quot;tab ${state.activeTab==='css'?'active':''}&quot; id=&quot;tabCss&quot; onclick=&quot;switchTab('css')&quot;&gt;🎨 CSS&lt;/button&gt;`;
    badge.className='status-badge react'; badge.textContent='REACT';
  } else {
    container.innerHTML = `&lt;button class=&quot;tab active&quot; id=&quot;tabPython&quot; onclick=&quot;switchTab('python')&quot;&gt;🐍 Python&lt;/button&gt;`;
    badge.className='status-badge python'; badge.textContent='PYTHON';
  }
}

function switchMode(mode) {
  saveCurrentTab();
  state.mode = mode;
  document.querySelectorAll('.btn-mode').forEach(b=&gt;b.classList.remove('active'));
  document.getElementById('mode'+mode.charAt(0).toUpperCase()+mode.slice(1)).classList.add('active');
  if (mode==='html') state.activeTab='html';
  else if (mode==='react') state.activeTab='jsx';
  else state.activeTab='python';
  updateTabs(); loadEditorContent(); updatePreview(); autoSave();
}

// ═══════════════════════════════════════════════
// PREVIEW
// ═══════════════════════════════════════════════
function buildDocument() {
  if (state.mode==='react') {
    return `&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;UTF-8&quot;&gt;
&lt;script crossorigin src=&quot;https://unpkg.com/react@18/umd/react.development.js&quot;&gt;&lt;\/script&gt;
&lt;script crossorigin src=&quot;https://unpkg.com/react-dom@18/umd/react-dom.development.js&quot;&gt;&lt;\/script&gt;
&lt;script src=&quot;https://unpkg.com/@babel/standalone/babel.min.js&quot;&gt;&lt;\/script&gt;
&lt;style&gt;*{box-sizing:border-box}body{margin:0;font-family:sans-serif}${state.css}&lt;/style&gt;
&lt;/head&gt;&lt;body&gt;&lt;div id=&quot;root&quot;&gt;&lt;/div&gt;
&lt;script type=&quot;text/babel&quot;&gt;
const {useState,useEffect,useRef,useCallback,useMemo,Fragment}=React;
${state.jsx}
try{ReactDOM.createRoot(document.getElementById('root')).render(&lt;App/&gt;)}
catch(e){document.getElementById('root').innerHTML='&lt;div style=&quot;color:red;padding:20px;font-family:monospace&quot;&gt;Erro: '+e.message+'&lt;/div&gt;'}
&lt;\/script&gt;&lt;/body&gt;&lt;/html&gt;`;
  }
  if (state.mode==='python') {
    const esc = state.python.replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/&lt;\/script&gt;/g,'&lt;\\/script&gt;');
    return `&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;UTF-8&quot;&gt;
&lt;style&gt;body{margin:0;background:#0f172a;color:#e2e8f0;font-family:'Consolas',monospace;padding:20px}#output{white-space:pre-wrap;font-size:13px;line-height:1.6}.loading{color:#60a5fa}.error{color:#f87171}.ok{color:#4ade80}&lt;/style&gt;
&lt;/head&gt;&lt;body&gt;&lt;div id=&quot;output&quot;&gt;&lt;span class=&quot;loading&quot;&gt;⟳ Carregando Python...&lt;/span&gt;&lt;/div&gt;
&lt;script src=&quot;https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js&quot;&gt;&lt;\/script&gt;
&lt;script&gt;
async function run(){
  const out=document.getElementById('output');
  try{
    const py=await loadPyodide();
    py.runPython('import sys\\nfrom io import StringIO\\nsys.stdout=StringIO()');
    py.runPython(\`${esc}\`);
    const stdout=py.runPython('sys.stdout.getvalue()');
    out.innerHTML='&lt;span class=&quot;ok&quot;&gt;$ python3&lt;/span&gt;\\n'+stdout;
  }catch(e){out.innerHTML='&lt;span class=&quot;error&quot;&gt;Erro: '+e.message+'&lt;/span&gt;';}
}run();
&lt;\/script&gt;&lt;/body&gt;&lt;/html&gt;`;
  }
  const lower = state.html.trim().toLowerCase();
  const isComplete = lower.includes('&lt;!doctype')||(lower.includes('&lt;html')&amp;&amp;lower.includes('&lt;/html&gt;'));
  if (isComplete) return state.html;
  return `&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;UTF-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1.0&quot;&gt;
&lt;style&gt;${state.css}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
${state.html}
&lt;script&gt;${state.js}&lt;\/script&gt;&lt;/body&gt;&lt;/html&gt;`;
}

function updatePreview() {
  const doc = buildDocument();
  const blob = new Blob([doc],{type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  previewFrame.src = url;
  setTimeout(()=&gt;URL.revokeObjectURL(url),5000);
}

function toggleAuto() {
  autoPreview = !autoPreview;
  document.getElementById('autoLabel').textContent = '● AUTO: '+(autoPreview?'ON':'OFF');
  document.getElementById('autoLabel').style.color = autoPreview ? 'var(--green)' : 'var(--red)';
  if (autoPreview) updatePreview();
}

// ═══════════════════════════════════════════════
// AUTOSAVE
// ═══════════════════════════════════════════════
function autoSave() {
  try {
    localStorage.setItem(LS_AUTOSAVE, JSON.stringify(state));
    const el = document.getElementById('save-status');
    el.textContent = '● auto-salvo';
    setTimeout(()=&gt;el.textContent='', 1500);
  } catch(e) {}
}

// ═══════════════════════════════════════════════
// AÇÕES DO HEADER
// ═══════════════════════════════════════════════
function importFile() {
  document.getElementById('fileInput').click();
}

document.getElementById('fileInput').addEventListener('change', e =&gt; {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev =&gt; {
    const content = ev.target.result;
    const ext = file.name.split('.').pop().toLowerCase();
    const name = file.name.replace(/\.[^.]+$/,'');
    if (ext==='py') { switchMode('python'); state.python=content; }
    else if (ext==='jsx'||ext==='tsx') { switchMode('react'); state.jsx=content; }
    else if (ext==='css') { state.css=content; if(state.mode==='html') switchTab('css'); }
    else if (ext==='js') { state.js=content; if(state.mode==='html') switchTab('js'); }
    else {
      const lower = content.trim().toLowerCase();
      if (lower.includes('&lt;!doctype')||lower.includes('&lt;html')) {
        switchMode('html'); state.html=content; state.css=''; state.js='';
      } else { state.html=content; }
      switchMode('html');
    }
    state.title=name; titleInput.value=name;
    loadEditorContent(); updatePreview(); autoSave();
    showToast('📂 &quot;'+file.name+'&quot; importado!');
  };
  reader.readAsText(file);
  e.target.value='';
});

function copyCode() {
  navigator.clipboard.writeText(buildDocument()).then(()=&gt;showToast('📋 Copiado!'));
}

function downloadFile() {
  let content, ext, mime;
  if (state.mode==='python'){content=state.python;ext='py';mime='text/plain';}
  else if (state.mode==='react'){content=state.jsx;ext='jsx';mime='text/plain';}
  else {content=buildDocument();ext='html';mime='text/html';}
  const blob=new Blob([content],{type:mime});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(state.title||'playground')+'.'+ext;
  a.click(); URL.revokeObjectURL(a.href);
  showToast('⬇️ Baixado!');
}

function openFullscreen() {
  document.getElementById('fs-editor').value = editor.value;
  document.getElementById('fs-modal').classList.add('open');
}
function closeFsEditor() {
  editor.value = document.getElementById('fs-editor').value;
  document.getElementById('fs-modal').classList.remove('open');
  saveCurrentTab(); updateLineNumbers(); autoSave(); updatePreview();
}

function openPreviewFull() {
  const doc = buildDocument();
  const blob = new Blob([doc],{type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  window.open(url,'_blank');
  setTimeout(()=&gt;URL.revokeObjectURL(url),5000);
}

function toggleChat() {
  chatVisible = !chatVisible;
  document.getElementById('chatPanel').classList.toggle('hidden', !chatVisible);
  document.getElementById('btnChat').style.color = chatVisible ? 'var(--green)' : 'var(--text2)';
}

function clearCode() {
  if (!confirm('Limpar o código?')) return;
  if (state.mode==='react') state.jsx='';
  else if (state.mode==='python') state.python='';
  else { state.html=''; state.css=''; state.js=''; }
  loadEditorContent(); updatePreview(); autoSave(); showToast('🗑️ Limpo!');
}

function resetCode() {
  if (!confirm('Resetar para o exemplo padrão?')) return;
  if (state.mode==='react') state.jsx=`function App(){\n  return &lt;div style={{padding:40,fontFamily:'sans-serif'}}&gt;&lt;h1&gt;⚛️ React&lt;/h1&gt;&lt;/div&gt;;\n}`;
  else if (state.mode==='python') state.python=`print(&quot;Hello, Saulo!&quot;)`;
  else { state.html=`&lt;h1 style=&quot;font-family:sans-serif;padding:40px&quot;&gt;Hello, Saulo!&lt;/h1&gt;`; state.css=''; state.js=''; }
  loadEditorContent(); updatePreview(); autoSave(); showToast('🔄 Resetado!');
}

// ═══════════════════════════════════════════════
// BANCO LOCAL (SALVAR / ABRIR)
// ═══════════════════════════════════════════════
function getSnippets() {
  try { return JSON.parse(localStorage.getItem(LS_SNIPPETS)||'[]'); } catch { return []; }
}
function setSnippets(list) {
  localStorage.setItem(LS_SNIPPETS, JSON.stringify(list));
}

function saveToLocal() {
  const snippets = getSnippets();
  // Verifica se já existe com mesmo título para atualizar
  const existing = snippets.findIndex(s =&gt; s.title === state.title);
  const item = {
    id: existing&gt;=0 ? snippets[existing].id : Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    title: state.title || 'Sem titulo',
    mode: state.mode,
    html: state.html, css: state.css, js: state.js,
    jsx: state.jsx, python: state.python,
    date: new Date().toISOString()
  };
  if (existing&gt;=0) {
    snippets[existing] = item;
    showToast('💾 &quot;'+item.title+'&quot; atualizado!');
  } else {
    snippets.unshift(item);
    showToast('💾 &quot;'+item.title+'&quot; salvo!');
  }
  setSnippets(snippets);
}

function openSavedModal() {
  document.getElementById('savedModal').classList.add('open');
  document.getElementById('searchInput').value = '';
  renderSavedList();
}
function closeSavedModal() {
  document.getElementById('savedModal').classList.remove('open');
}

function renderSavedList() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const snippets = getSnippets().filter(s=&gt;s.title.toLowerCase().includes(query));
  const container = document.getElementById('savedList');
  if (snippets.length===0) {
    container.innerHTML='&lt;p style=&quot;text-align:center;color:var(--text2);font-size:12px;padding:20px;&quot;&gt;Nenhum código salvo ainda.&lt;br&gt;Clique em 💾 Salvar para guardar o atual.&lt;/p&gt;';
    return;
  }
  container.innerHTML = snippets.map(s=&gt;`
    &lt;div class=&quot;snippet-item&quot; onclick=&quot;loadSnippet('${s.id}')&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;sname&quot;&gt;${escHtml(s.title)}&lt;/div&gt;
        &lt;div class=&quot;smeta&quot;&gt;${s.mode||'html'} • ${new Date(s.date).toLocaleDateString('pt-BR')} ${new Date(s.date).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;snippet-actions&quot;&gt;
        &lt;button class=&quot;btn-icon&quot; onclick=&quot;event.stopPropagation();renameSnippet('${s.id}')&quot; title=&quot;Renomear&quot;&gt;✏️&lt;/button&gt;
        &lt;button class=&quot;btn-icon&quot; onclick=&quot;event.stopPropagation();deleteSnippet('${s.id}')&quot; title=&quot;Excluir&quot;&gt;🗑️&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;`).join('');
}

function loadSnippet(id) {
  const s = getSnippets().find(x=&gt;x.id===id);
  if (!s) return;
  state.title=s.title; state.mode=s.mode||'html';
  state.html=s.html||''; state.css=s.css||''; state.js=s.js||'';
  state.jsx=s.jsx||''; state.python=s.python||'';
  titleInput.value=state.title;
  switchMode(state.mode);
  closeSavedModal();
  showToast('📂 &quot;'+s.title+'&quot; carregado!');
}

function deleteSnippet(id) {
  if (!confirm('Excluir este código?')) return;
  setSnippets(getSnippets().filter(s=&gt;s.id!==id));
  renderSavedList();
  showToast('🗑️ Excluído!');
}

function renameSnippet(id) {
  const snippets=getSnippets();
  const s=snippets.find(x=&gt;x.id===id);
  if (!s) return;
  const n=prompt('Novo nome:',s.title);
  if (n&amp;&amp;n.trim()) { s.title=n.trim(); setSnippets(snippets); renderSavedList(); showToast('✏️ Renomeado!'); }
}

// ═══════════════════════════════════════════════
// API KEY MODAL
// ═══════════════════════════════════════════════
function openApiModal() {
  document.getElementById('api-key-input').value = apiKey;
  document.getElementById('api-provider').value = apiProvider;
  document.getElementById('system-prompt-input').value = sysPrompt;
  document.getElementById('apiModal').classList.add('open');
}
function closeApiModal() {
  document.getElementById('apiModal').classList.remove('open');
}
function saveApiKey() {
  apiKey      = document.getElementById('api-key-input').value.trim();
  apiProvider = document.getElementById('api-provider').value;
  sysPrompt   = document.getElementById('system-prompt-input').value || DEFAULT_SYSTEM;
  localStorage.setItem(LS_APIKEY, apiKey);
  localStorage.setItem(LS_PROVIDER, apiProvider);
  localStorage.setItem(LS_SYSPROMPT, sysPrompt);
  updateModelTag();
  closeApiModal();
  showToast('✅ API Key salva!');
}
function updateModelTag() {
  const p = document.getElementById('api-provider')?.value || apiProvider;
  document.getElementById('model-tag').textContent = p==='gemini' ? 'Gemini Flash' : 'GPT-4o Mini';
}

function handleChatKey(e) {
  if (e.key==='Enter'&amp;&amp;!e.shiftKey) { e.preventDefault(); sendMsg(); }
}

function addChatMsg(role, text, codeToApply) {
  const box = document.getElementById('chat-messages');
  const d = document.createElement('div');
  d.className = 'msg msg-'+role;
  d.textContent = text;
  if (codeToApply &amp;&amp; role==='ai') {
    const btn = document.createElement('button');
    btn.className = 'apply-btn';
    btn.textContent = '✅ Aplicar código no editor + Preview';
    btn.onclick = () =&gt; {
      // Aplica no editor
      if (state.mode==='react') { state.jsx=codeToApply; state.activeTab='jsx'; }
      else if (state.mode==='python') { state.python=codeToApply; state.activeTab='python'; }
      else { state.html=codeToApply; state.activeTab='html'; }
      loadEditorContent(); updateLineNumbers(); autoSave(); updatePreview();
      addChatMsg('system','✅ Código aplicado. Preview atualizado.');
    };
    d.appendChild(btn);
  }
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function showDots() {
  const box = document.getElementById('chat-messages');
  const d = document.createElement('div');
  d.id='loading-dots'; d.className='dots';
  d.innerHTML='&lt;div class=&quot;dot-a&quot;&gt;&lt;/div&gt;&lt;div class=&quot;dot-a&quot;&gt;&lt;/div&gt;&lt;div class=&quot;dot-a&quot;&gt;&lt;/div&gt;';
  box.appendChild(d); box.scrollTop=box.scrollHeight;
}
function hideDots() { const el=document.getElementById('loading-dots'); if(el)el.remove(); }

async function sendMsg() {
  const inp = document.getElementById('chat-input');
  const text = inp.value.trim();
  if (!text) return;
  if (!apiKey) { addChatMsg('system','⚠️ Configure a API Key clicando em &quot;🔑 API Key&quot;.'); return; }

  inp.value='';
  document.getElementById('chat-send').disabled=true;
  addChatMsg('user', text);

  // Monta contexto com o código atual
  const code = buildDocument();
  const fullMsg = `[CÓDIGO ATUAL NO EDITOR — modo: ${state.mode}, arquivo: ${state.title}]
\`\`\`
${code.substring(0,12000)}
\`\`\`

[PEDIDO DO USUÁRIO]
${text}`;

  showDots();
  try {
    const reply = apiProvider==='gemini' ? await callGemini(fullMsg) : await callOpenAI(fullMsg);
    hideDots();
    // Extrai código se vier entre backticks
    const match = reply.match(/```(?:html|js|javascript|jsx|tsx|css|python)?\n([\s\S]*?)```/);
    addChatMsg('ai', reply, match ? match[1].trim() : null);
  } catch(err) {
    hideDots();
    addChatMsg('system','❌ '+err.message);
  }
  document.getElementById('chat-send').disabled=false;
}

async function callGemini(msg) {
  const url=`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
  const body={
    system_instruction:{parts:[{text:sysPrompt}]},
    contents:[{role:'user',parts:[{text:msg}]}],
    generationConfig:{temperature:0.2,maxOutputTokens:8192}
  };
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){const e=await r.json();throw new Error(e.error?.message||'Erro Gemini');}
  const d=await r.json();
  return d.candidates?.[0]?.content?.parts?.[0]?.text||'Sem resposta.';
}

async function callOpenAI(msg) {
  const r=await fetch('https://api.openai.com/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
    body:JSON.stringify({model:'gpt-4o-mini',messages:[{role:'system',content:sysPrompt},{role:'user',content:msg}],temperature:0.2,max_tokens:8192})
  });
  if(!r.ok){const e=await r.json();throw new Error(e.error?.message||'Erro OpenAI');}
  const d=await r.json();
  return d.choices?.[0]?.message?.content||'Sem resposta.';
}

&lt;script&gt;
// ─── ESTADO ───────────────────────────────────────────────
let apiKey      = localStorage.getItem('pg_key')      || '';
let apiProvider = localStorage.getItem('pg_provider') || 'gemini';
let fileName    = localStorage.getItem('pg_fname')    || 'sem_titulo.html';
let autoRun     = false;
let autoTimer   = null;
let previewRan  = false;

const SYSTEM = `Você é uma IA integrada a um playground de código. O usuário é Saulo, advogado, direto ao ponto.
REGRAS ABSOLUTAS:
1. NUNCA peça desculpas.
2. NUNCA use frases de empatia (&quot;parece que&quot;, &quot;eu entendo&quot;, &quot;sinto muito&quot;).
3. Vá DIRETO ao ponto. Só o que foi pedido.
4. Ao alterar código: retorne o arquivo COMPLETO atualizado entre triple backticks para permitir aplicação automática.
5. Seja cirúrgico. Indique o que mudou em uma linha antes do código.`;

// ─── EDITOR ───────────────────────────────────────────────
function onEditorChange() {
  updateCharCount();
  if (autoRun) {
    clearTimeout(autoTimer);
    autoTimer = setTimeout(runPreview, 900);
  }
  autoSave();
}

function updateCharCount() {
  // silencioso
}

function autoSave() {
  const code = document.getElementById('code-editor').value;
  localStorage.setItem('pg_code', code);
  localStorage.setItem('pg_fname', fileName);
  showStatus('salvo ✓');
}

function showStatus(msg) {
  const el = document.getElementById('save-status');
  el.textContent = msg;
  setTimeout(() =&gt; el.textContent = '', 2000);
}

// ─── PREVIEW ──────────────────────────────────────────────
function runPreview() {
  const code = document.getElementById('code-editor').value.trim();
  const empty = document.getElementById('preview-empty');
  const frame = document.getElementById('preview-frame');
  const status = document.getElementById('preview-status');

  if (!code) {
    empty.style.display = 'flex';
    frame.style.display = 'none';
    status.textContent = 'vazio';
    return;
  }

  empty.style.display = 'none';
  frame.style.display = 'block';
  frame.srcdoc = code;
  status.textContent = 'atualizado ✓';
  previewRan = true;
}

function toggleAutoRun() {
  autoRun = !autoRun;
  document.getElementById('auto-btn').textContent = '⚡ Auto: ' + (autoRun ? 'ON' : 'OFF');
  document.getElementById('auto-btn').style.background = autoRun ? '#15803d' : '';
  if (autoRun) runPreview();
}

// ─── ARQUIVOS ─────────────────────────────────────────────
function importFile() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.html,.htm,.js,.ts,.tsx,.jsx,.css,.txt,.json,.py';
  inp.onchange = e =&gt; {
    const f = e.target.files[0];
    if (!f) return;
    fileName = f.name;
    document.getElementById('file-name').textContent = f.name;
    const r = new FileReader();
    r.onload = ev =&gt; {
      document.getElementById('code-editor').value = ev.target.result;
      onEditorChange();
      addMsg('system', '📂 &quot;' + f.name + '&quot; importado. IA já pode lê-lo.');
    };
    r.readAsText(f);
  };
  inp.click();
}

function saveLocal() {
  autoSave();
  addMsg('system', '💾 Salvo no navegador.');
}

function downloadFile() {
  const code = document.getElementById('code-editor').value;
  const blob = new Blob([code], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fileName;
  a.click();
  showStatus('baixado ✓');
}

function copyCode() {
  navigator.clipboard.writeText(document.getElementById('code-editor').value);
  showStatus('copiado ✓');
}

function clearEditor() {
  if (!confirm('Limpar o editor?')) return;
  document.getElementById('code-editor').value = '';
  onEditorChange();
  runPreview();
}

// ─── FULLSCREEN EDITOR ────────────────────────────────────
function openFsEditor() {
  document.getElementById('fs-editor').value = document.getElementById('code-editor').value;
  document.getElementById('fs-modal').classList.add('open');
}
function closeFsEditor() {
  document.getElementById('code-editor').value = document.getElementById('fs-editor').value;
  document.getElementById('fs-modal').classList.remove('open');
  onEditorChange();
}

// ─── FULLSCREEN PREVIEW ───────────────────────────────────
function openFsPreview() {
  const code = document.getElementById('code-editor').value;
  document.getElementById('fp-frame').srcdoc = code;
  document.getElementById('fp-modal').classList.add('open');
}
function closeFsPreview() {
  document.getElementById('fp-modal').classList.remove('open');
}

// ─── API MODAL ────────────────────────────────────────────
function openApiModal() {
  document.getElementById('api-key-input').value = apiKey;
  document.getElementById('api-provider').value = apiProvider;
  document.getElementById('api-modal').classList.add('open');
}
function closeApiModal() {
  document.getElementById('api-modal').classList.remove('open');
}
function saveApiKey() {
  apiKey = document.getElementById('api-key-input').value.trim();
  apiProvider = document.getElementById('api-provider').value;
  localStorage.setItem('pg_key', apiKey);
  localStorage.setItem('pg_provider', apiProvider);
  updateModelTag();
  closeApiModal();
  addMsg('system', '✅ API Key salva. Pronto.');
}
function updateModelTag() {
  const p = document.getElementById('api-provider')?.value || apiProvider;
  document.getElementById('model-tag').textContent = p === 'gemini' ? 'Gemini Flash' : 'GPT-4o Mini';
}

// ─── CHAT ─────────────────────────────────────────────────
function handleKey(e) {
  if (e.key === 'Enter' &amp;&amp; !e.shiftKey) { e.preventDefault(); sendMsg(); }
}

function addMsg(role, text, codeToApply) {
  const box = document.getElementById('chat-messages');
  const d = document.createElement('div');
  d.className = 'msg msg-' + role;
  d.textContent = text;

  if (codeToApply) {
    const btn = document.createElement('button');
    btn.className = 'apply-btn';
    btn.textContent = '✅ Aplicar código no editor';
    btn.onclick = () =&gt; {
      document.getElementById('code-editor').value = codeToApply;
      onEditorChange();
      runPreview();
      addMsg('system', '✅ Código aplicado. Preview atualizado.');
    };
    d.appendChild(btn);
  }

  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function showLoading() {
  const box = document.getElementById('chat-messages');
  const d = document.createElement('div');
  d.id = 'loading-dots';
  d.className = 'dots';
  d.innerHTML = '&lt;div class=&quot;dot&quot;&gt;&lt;/div&gt;&lt;div class=&quot;dot&quot;&gt;&lt;/div&gt;&lt;div class=&quot;dot&quot;&gt;&lt;/div&gt;';
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}
function hideLoading() {
  const el = document.getElementById('loading-dots');
  if (el) el.remove();
}

async function sendMsg() {
  const inp = document.getElementById('chat-input');
  const text = inp.value.trim();
  if (!text) return;

  if (!apiKey) {
    addMsg('system', '⚠️ Configure a API Key primeiro. Clique em &quot;🔑 API Key&quot;.');
    return;
  }

  inp.value = '';
  document.getElementById('chat-send').disabled = true;
  addMsg('user', text);

  const code = document.getElementById('code-editor').value;
  const fullMsg = code
    ? `[CÓDIGO ATUAL NO EDITOR — arquivo: ${fileName}]\n\`\`\`\n${code.substring(0, 10000)}\n\`\`\`\n\n[PEDIDO]\n${text}`
    : text;

  showLoading();

  try {
    const reply = apiProvider === 'gemini'
      ? await callGemini(fullMsg)
      : await callOpenAI(fullMsg);

    hideLoading();

    // Extrai código completo se vier entre backticks
    const match = reply.match(/```(?:html|js|javascript|css|jsx|tsx|python)?\n([\s\S]*?)```/);
    const extracted = match ? match[1].trim() : null;

    addMsg('ai', reply, extracted);

  } catch(err) {
    hideLoading();
    addMsg('system', '❌ ' + err.message);
  }

  document.getElementById('chat-send').disabled = false;
}

// ─── GEMINI ───────────────────────────────────────────────
async function callGemini(msg) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
  const body = {
    system_instruction: { parts:[{ text: SYSTEM }] },
    contents: [{ role:'user', parts:[{ text: msg }] }],
    generationConfig: { temperature:0.2, maxOutputTokens:8192 }
  };
  const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  if (!r.ok) { const e = await r.json(); throw new Error(e.error?.message || 'Erro Gemini'); }
  const d = await r.json();
  return d.candidates?.[0]?.content?.parts?.[0]?.text || 'Sem resposta.';
}

// ─── OPENAI ───────────────────────────────────────────────
async function callOpenAI(msg) {
  const r = await fetch('https://api.openai.com/v1/chat/completions', {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
    body: JSON.stringify({
      model:'gpt-4o-mini',
      messages:[{role:'system',content:SYSTEM},{role:'user',content:msg}],
      temperature:0.2, max_tokens:8192
    })
  });
  if (!r.ok) { const e = await r.json(); throw new Error(e.error?.message || 'Erro OpenAI'); }
  const d = await r.json();
  return d.choices?.[0]?.message?.content || 'Sem resposta.';
}

// ─── INIT ─────────────────────────────────────────────────
window.onload = () =&gt; {
  updateModelTag();

  // Restaura último código salvo
  const saved = localStorage.getItem('pg_code');
  const savedName = localStorage.getItem('pg_fname');
  if (saved) {
    document.getElementById('code-editor').value = saved;
    if (savedName) {
      fileName = savedName;
      document.getElementById('file-name').textContent = savedName;
    }
    updateCharCount();
    // Roda preview automaticamente se tinha código
    runPreview();
  }

  if (!apiKey) {
    setTimeout(() =&gt; addMsg('system', '👆 Configure a API Key clicando em &quot;🔑 API Key&quot; para ativar a IA.'), 600);
  }
};

<script>
function trocarProjeto(index) {
  // Esconde todos
  document.querySelectorAll('.project-container').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  
  // Mostra o selecionado
  document.getElementById('projeto' + index).classList.add('active');
  document.querySelectorAll('.nav-btn')[index].classList.add('active');
  
  // Salva preferência
  localStorage.setItem('ultimo-projeto', index);
}

// Restaura último projeto aberto
window.onload = function() {
  const ultimo = localStorage.getItem('ultimo-projeto');
  if (ultimo !== null) trocarProjeto(parseInt(ultimo));
};
</script>
